<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY VAULT | NCC DATA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ZERO-CONFLICT SECURITY MIDDLEWARE
        const current_handle = localStorage.getItem('mog_handle');
        if (current_handle) {
            const MOG_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
            const MOG_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
            const mog_sb = window.supabase.createClient(MOG_URL, MOG_KEY);
            mog_sb.from('blacklisted_operatives').select('*').eq('username', current_handle).single()
              .then(({data}) => {
                  if(data) { localStorage.clear(); window.location.href = '404.html'; }
              }).catch(err => console.log("Security Check Bypass:", err));
        } else { window.location.href = 'index.html'; }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body x-data="vault()" x-init="init()" class="bg-black text-gold p-6 pb-24">
    <div class="scanline"></div>

    <header class="mb-10 flex items-center justify-between glass px-4 rounded-2xl border-none">
        <button onclick="window.location.href='index.html'" class="p-3 glass rounded-2xl active:scale-90 transition-all"><i data-lucide="chevron-left" size="20"></i></button>
        <div class="text-right">
            <h1 class="text-xl font-black italic uppercase text-white tracking-tighter">The Vault</h1>
            <p class="text-[7px] uppercase tracking-widest text-gold/40 font-black" x-text="isDirector ? 'Directorate Archive' : 'Data Repository'"></p>
        </div>
    </header>

    <main class="space-y-6 max-w-xl mx-auto">
        <template x-if="isDirector">
            <section class="space-y-6 animate-in fade-in duration-700">
                <div class="glass p-6 rounded-[2.5rem] border-red-600/30 bg-red-900/5">
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="shield-off" class="text-red-600" size="16"></i>
                        <h3 class="text-[9px] font-black uppercase text-white italic tracking-widest">Sanctioned Operatives Log</h3>
                    </div>
                    <div class="space-y-3 max-h-[300px] overflow-y-auto pr-2">
                        <template x-for="log in sanctionLog" :key="log.username">
                            <div class="flex justify-between items-center p-4 bg-black/40 rounded-2xl border border-red-900/20">
                                <div><span class="text-[10px] font-black text-red-500 uppercase" x-text="log.username"></span><p class="text-[7px] text-zinc-500 uppercase mt-1" x-text="'Reason: ' + (log.reason || 'PROTOCOL_VIOLATION')"></p></div>
                                <div class="text-right"><p class="text-[7px] text-zinc-400 font-bold" x-text="new Date(log.termination_date).toLocaleDateString()"></p><button @click="reinstate(log.username)" class="text-[7px] text-green-500 uppercase font-black mt-2">Reinstate</button></div>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="glass p-6 rounded-[2.5rem] border-blue-500/20">
                    <h3 class="text-[9px] font-black uppercase text-white mb-4 italic tracking-widest">Data Management</h3>
                    <button @click="exportData('messages')" class="w-full flex justify-between items-center p-4 bg-white/5 rounded-2xl text-[9px] font-black uppercase text-white"><span>Export Grid Signals (CSV)</span><i data-lucide="download" size="14"></i></button>
                </div>
            </section>
        </template>
        <div class="glass p-8 rounded-[3rem] border-gold/10 text-center">
            <button onclick="sendDispatch()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-2xl shadow-lg flex items-center justify-center gap-3 active:scale-95 transition-all"><i data-lucide="mail" size="16"></i> Send Encrypted Dispatch</button>
        </div>
    </main>

    <script>
        function vault() {
            return {
                isDirector: false, sanctionLog: [],
                async init() {
                    this.isDirector = localStorage.getItem('mog_handle') === 'DIRECTORATE';
                    const SB_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
                    this.supabase = window.supabase.createClient(SB_URL, SB_KEY);
                    if (this.isDirector) { this.fetchSanctions(); } lucide.createIcons();
                },
                async fetchSanctions() { const { data } = await this.supabase.from('blacklisted_operatives').select('*'); this.sanctionLog = data?.map(d => ({ username: d.username, reason: d.reason, termination_date: d.created_at })) || []; },
                async reinstate(target) { if(confirm(`REINSTATE ${target}?`)) { await this.supabase.from('blacklisted_operatives').delete().eq('username', target); this.fetchSanctions(); } },
                async exportData(table) {
                    const { data } = await this.supabase.from(table).select('*'); if (!data) return;
                    const csv = [Object.keys(data[0]).join(","), ...data.map(row => Object.values(row).join(","))].join("\n");
                    const link = document.createElement("a"); link.href = "data:text/csv;charset=utf-8," + encodeURI(csv); link.download = `MOG_${table.toUpperCase()}_EXPORT.csv`; link.click();
                }
            }
        }
        function sendDispatch() { window.location.href = `mailto:director.mog@gmail.com?subject=[GRID_DISPATCH]&body=SIGNAL: `; }
    </script>
</body>
</html>
