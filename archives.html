<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAULT | Ministry of Groove</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        
        let supabaseClient = null;

        function vaultLogic() {
            return {
                view: 'loading',
                username: '',
                isDirector: false,
                currentTime: '',
                searchQuery: '',
                isUploading: false, // Added state for your new button
                
                assets: [
                    { id: 1, name: 'Project_Asili_Blueprints.pdf', type: 'DOC', size: '4.2MB', level: 'Director', icon: 'file-text', color: 'text-red-400' },
                    { id: 2, name: 'Intelligence_Briefing_March.wav', type: 'AUDIO', size: '12.8MB', level: 'Operative', icon: 'mic', color: 'text-blue-400' },
                    { id: 3, name: 'Ministry_Wealth_Index.xlsx', type: 'DATA', size: '1.1MB', level: 'Director', icon: 'trending-up', color: 'text-gold' },
                    { id: 4, name: 'Event_Protocol_v3.pdf', type: 'DOC', size: '800KB', level: 'Operative', icon: 'shield-check', color: 'text-green-400' }
                ],

                async init() {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    await this.checkAuth();
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                },

                async checkAuth() {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) { window.location.href = 'index.html'; return; }
                    this.username = session.user.user_metadata.handle || session.user.email.split('@')[0];
                    this.isDirector = session.user.email === 'director.mog@gmail.com';
                    this.view = 'ready';
                },

                updateTime() {
                    this.currentTime = new Date().toLocaleTimeString('en-US', { hour12: false });
                },

                get filteredAssets() {
                    return this.assets.filter(asset => {
                        const matchesSearch = asset.name.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const hasClearance = asset.level === 'Director' ? this.isDirector : true;
                        return matchesSearch && hasClearance;
                    });
                }
            }
        }
    </script>
</head>
<body x-data="vaultLogic()" x-init="init()" class="bg-black text-white min-h-screen bg-grid">

    <template x-if="view === 'ready'">
        <div class="max-w-5xl mx-auto p-6 relative z-10 animate-fade-in">
            
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12">
                <div class="flex items-center gap-6">
                    <button onclick="history.back()" class="p-4 glass rounded-2xl border border-white/10 hover:border-gold/50 transition-all">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gold"></i>
                    </button>
                    <div>
                        <h1 class="text-2xl font-black uppercase tracking-tighter italic">Classified Vault</h1>
                        <p class="text-[10px] text-gold font-bold uppercase tracking-widest" x-text="isDirector ? 'DIRECTORATE CLEARANCE' : 'OPERATIVE ACCESS'"></p>
                    </div>
                </div>
                <div class="glass px-6 py-3 rounded-2xl border border-white/5">
                    <p class="terminal-font text-lg font-black" x-text="currentTime"></p>
                </div>
            </header>

            <div class="glass rounded-[2.5rem] border border-white/10 overflow-hidden shadow-2xl">
                <div class="p-6 border-b border-white/5 bg-white/5 flex flex-col md:flex-row justify-between items-center gap-4">
                    <h2 class="text-xs font-black uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="database" class="w-4 h-4 text-gold"></i> Digital Asset Manifest
                    </h2>
                    
                    <div class="flex items-center gap-3">
                        <template x-if="isDirector">
                            <button @click="isUploading = true; setTimeout(() => { isUploading = false; assets.push({id: Date.now(), name: 'New_Intel_Archive.pdf', type: 'DOC', size: '1.2MB', level: 'Director', icon: 'upload-cloud', color: 'text-gold'}); lucide.createIcons(); }, 3000)" 
                                    class="bg-gold text-black px-4 py-2 rounded-full text-[9px] font-black uppercase flex items-center gap-2 hover:bg-yellow-400 transition-all">
                                <i data-lucide="upload-cloud" class="w-3 h-3"></i>
                                <span x-text="isUploading ? 'TRANSMITTING...' : 'Secure Upload'"></span>
                            </button>
                        </template>

                        <div class="relative">
                            <i data-lucide="search" class="w-3 h-3 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                            <input x-model="searchQuery" type="text" placeholder="FILTER..." class="bg-black/40 border border-white/10 rounded-full px-8 py-2 text-[10px] outline-none w-48 uppercase">
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="text-[9px] text-zinc-500 uppercase font-black tracking-widest bg-white/[0.02]">
                            <tr>
                                <th class="px-6 py-4">Identification</th>
                                <th class="px-6 py-4">Size</th>
                                <th class="px-6 py-4 text-right">Clearance</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/5">
                            <template x-for="asset in filteredAssets" :key="asset.id">
                                <tr class="hover:bg-white/[0.03] transition-colors group">
                                    <td class="px-6 py-5">
                                        <div class="flex items-center gap-4">
                                            <i :data-lucide="asset.icon" class="w-4 h-4" :class="asset.color"></i>
                                            <span class="text-xs font-bold text-white group-hover:text-gold transition-colors" x-text="asset.name"></span>
                                        </div>
                                    </td>
                                    <td class="px-6 py-5 text-[10px] text-zinc-400 terminal-font" x-text="asset.size"></td>
                                    <td class="px-6 py-5 text-right">
                                        <span :class="asset.level === 'Director' ? 'text-red-500 border-red-500/40 bg-red-500/5' : 'text-blue-500 border-blue-500/40 bg-blue-500/5'" 
                                              class="text-[7px] font-black px-2 py-1 rounded border uppercase" x-text="asset.level"></span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('alpine:initialized', () => { lucide.createIcons(); });
    </script>
</body>
</html>
