<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY VAULT | NCC DATA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #D4AF37; --noir: #050505; }
        body { background: var(--noir); color: var(--gold); font-family: 'Inter', sans-serif; margin: 0; }
        .glass { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .scanline { width: 100%; height: 2px; background: rgba(212, 175, 55, 0.1); position: fixed; animation: scan 8s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body x-data="vault()" x-init="init()" class="bg-black text-gold p-6 pb-24">
    <div class="scanline"></div>

    <header class="mb-10 flex items-center justify-between glass p-4 rounded-2xl">
        <button onclick="window.location.href='index.html'" class="p-3 glass rounded-2xl"><i data-lucide="chevron-left"></i></button>
        <div class="text-right">
            <h1 class="text-xl font-black uppercase italic text-white">The Vault</h1>
            <p class="text-[7px] tracking-[0.4em] text-gold/40" x-text="isDirector ? 'ADMIN_ACCESS' : 'DATA_ARCHIVE'"></p>
        </div>
    </header>

    <main class="max-w-xl mx-auto space-y-6">
        <template x-if="isDirector">
            <section class="glass p-6 rounded-[2.5rem] border-red-900/30">
                <h3 class="text-[9px] font-black uppercase text-white mb-4 italic">Sanctioned Operatives</h3>
                <div class="space-y-3">
                    <template x-for="log in sanctionLog" :key="log.username">
                        <div class="flex justify-between items-center p-4 bg-black/40 rounded-2xl border border-red-900/20">
                            <div>
                                <span class="text-[10px] font-black text-red-500" x-text="log.username"></span>
                                <p class="text-[7px] text-zinc-500 uppercase mt-1" x-text="log.reason"></p>
                            </div>
                            <button @click="reinstate(log.username)" class="text-[8px] font-black text-green-500 uppercase">Reinstate</button>
                        </div>
                    </template>
                </div>
            </section>
        </template>

        <section class="glass p-8 rounded-[3rem] text-center space-y-4">
            <i data-lucide="shield-check" class="mx-auto text-gold/20" size="48"></i>
            <h3 class="text-[10px] font-black uppercase text-white">Official Dispatch</h3>
            <button onclick="window.location.href='mailto:director.mog@gmail.com'" class="w-full py-5 bg-gold text-black font-black text-[10px] rounded-2xl">Send Encrypted Dispatch</button>
        </section>
    </main>

    <script>
        function vault() {
            return {
                isDirector: false, sanctionLog: [],
                async init() {
                    this.isDirector = localStorage.getItem('mog_handle') === 'DIRECTORATE';
                    if (this.isDirector) this.fetchSanctions();
                    lucide.createIcons();
                },
                async fetchSanctions() {
                    const { data } = await mog_sb.from('blacklisted_operatives').select('*');
                    this.sanctionLog = data || [];
                },
                async reinstate(target) {
                    await mog_sb.from('blacklisted_operatives').delete().eq('username', target);
                    this.fetchSanctions();
                }
            }
        }
    </script>
</body>
    </html>
