<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Groove | The Vault</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-noir text-gold" x-data="vaultLogic">

    <header class="p-6 border-b border-gold/20 flex justify-between items-center sticky top-0 bg-noir/90 backdrop-blur-sm z-10">
        <h1 class="text-sm tracking-[0.4em] uppercase font-bold">Secure Archives</h1>
        <div class="flex gap-4">
            <input type="text" x-model="search" placeholder="FILTER LOGS..." class="bg-transparent border-b border-gold/30 text-[10px] focus:outline-none focus:border-gold px-2">
            <a href="index.html" class="text-[10px] hover:text-white transition">← EXIT</a>
        </div>
    </header>

    <main class="p-6 max-w-3xl mx-auto">
        <div class="relative border-l border-gold/20 ml-4 pl-8 space-y-12 py-8">
            
            <template x-for="log in filteredLogs" :key="log.id">
                <div class="relative">
                    <div class="absolute -left-[37px] top-1 w-4 h-4 rounded-full bg-noir border-2 border-gold shadow-[0_0_8px_#D4AF37]"></div>
                    
                    <div class="space-y-2">
                        <span class="text-[10px] font-mono opacity-50" x-text="log.timestamp"></span>
                        <h3 class="text-lg uppercase font-bold tracking-tight" x-text="log.title"></h3>
                        <p class="text-sm text-gold/80 leading-relaxed font-light" x-text="log.content"></p>
                        
                        <div class="flex gap-2 pt-2">
                            <template x-for="tag in log.tags">
                                <span class="text-[9px] border border-gold/30 px-2 py-0.5 rounded-full" x-text="'#'+tag"></span>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
