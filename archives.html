<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAULT | Ministry of Groove</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let supabaseClient = null;

        function vaultLogic() {
            return {
                view: 'loading', isDirector: false, isUploading: false, searchQuery: '',
                assets: [
                    { id: 1, name: 'Project_Asili_Blueprints.pdf', level: 'Director', icon: 'file-text', color: 'text-red-400' },
                    { id: 2, name: 'Intelligence_Brief.wav', level: 'Operative', icon: 'mic', color: 'text-blue-400' }
                ],
                async init() {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (!session) window.location.href = 'index.html';
                    this.isDirector = session.user.email === 'director.mog@gmail.com';
                    this.view = 'ready';
                    this.$nextTick(() => lucide.createIcons());
                },
                async handleDirectorUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    this.isUploading = true;
                    const { error } = await supabaseClient.storage.from('vault').upload(`${Date.now()}_${file.name}`, file);
                    if (!error) {
                        this.assets.push({ id: Date.now(), name: file.name, level: 'Director', icon: 'shield-check', color: 'text-gold' });
                        alert('Archived successfully.');
                    }
                    this.isUploading = false;
                }
            }
        }
    </script>
</head>
<body x-data="vaultLogic()" x-init="init()" class="bg-black text-white min-h-screen bg-grid">
    <template x-if="view === 'ready'">
        <div class="max-w-5xl mx-auto p-6 animate-fade-in">
            <header class="flex items-center justify-between mb-12">
                <div class="flex items-center gap-6">
                    <button onclick="window.location.href='index.html'" class="p-4 glass rounded-2xl border border-white/10"><i data-lucide="chevron-left" class="text-gold"></i></button>
                    <h1 class="text-2xl font-black uppercase tracking-tighter italic">Classified Vault</h1>
                </div>
                <img src="assets/images/logo.png" class="w-12 h-12">
            </header>

            <div class="glass rounded-[2.5rem] border border-white/10 overflow-hidden">
                <div class="p-6 bg-white/5 flex justify-between items-center">
                    <h2 class="text-xs font-black uppercase italic">Asset manifest</h2>
                    <template x-if="isDirector">
                        <div>
                            <input type="file" @change="handleDirectorUpload" id="v-up" class="hidden">
                            <label for="v-up" class="bg-gold text-black px-4 py-2 rounded-full text-[9px] font-black uppercase cursor-pointer">
                                <span x-text="isUploading ? 'TRANSMITTING...' : 'Secure Upload'"></span>
                            </label>
                        </div>
                    </template>
                </div>
                </div>
        </div>
    </template>
</body>
</html>
