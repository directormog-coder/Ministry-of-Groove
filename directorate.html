<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | DIRECTORATE COMMAND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        function commandCenter() {
            return {
                view: 'loading', broadcastInput: '', currentTime: '',
                async init() {
                    const sb = supabase.createClient('https://fgkljjgxecjmiiaptiug.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE');
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (!session || session.user.email !== 'director.mog@gmail.com') {
                        window.location.href = 'index.html';
                        return;
                    }

                    this.view = 'active';
                    setInterval(() => { this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); }, 1000);
                    this.$nextTick(() => lucide.createIcons());
                },
                async sendBroadcast() {
                    if (!this.broadcastInput.trim()) return;
                    const sb = supabase.createClient('https://fgkljjgxecjmiiaptiug.supabase.co', '...');
                    const { error } = await sb.from('broadcasts').insert({ content: this.broadcastInput, created_by: 'DIRECTOR' });
                    if (!error) { alert('GLOBAL BROADCAST INITIATED'); this.broadcastInput = ''; }
                }
            }
        }
    </script>
</head>
<body x-data="commandCenter()" x-init="init()" class="bg-black text-white bg-grid min-h-screen">

    <template x-if="view === 'active'">
        <div class="max-w-6xl mx-auto p-10 z-10 relative">
            <header class="p-8 glass-strong rounded-3xl border border-red-500/30 flex justify-between items-center mb-16 shadow-2xl shadow-red-500/10">
                <div class="flex items-center gap-6">
                    <button onclick="window.location.href='index.html'" class="p-4 glass rounded-2xl border border-white/10 hover:border-gold/50 transition-all">
                        <i data-lucide="chevron-left" class="text-gold w-6 h-6"></i>
                    </button>
                    <div>
                        <h1 class="text-3xl font-black uppercase italic tracking-tighter text-red-500">Directorate HQ</h1>
                        <p class="text-[10px] text-red-400 font-black uppercase tracking-[0.4em]">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</p>
                    </div>
                </div>
                <div class="text-right"><p class="text-2xl font-black terminal-font text-white" x-text="currentTime"></p></div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                <div class="md:col-span-2 glass p-12 rounded-[4rem] border border-red-500/20 shadow-2xl space-y-8">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="p-4 bg-red-600 rounded-3xl text-white shadow-xl"><i data-lucide="radio" class="animate-pulse w-8 h-8"></i></div>
                        <h3 class="text-xl font-black uppercase italic text-white">Issue Global Alert</h3>
                    </div>
                    <textarea x-model="broadcastInput" class="w-full h-64 bg-black/50 border border-red-500/10 p-8 rounded-[2rem] outline-none text-[12px] uppercase terminal-font" placeholder="Command Directive..."></textarea>
                    <button @click="sendBroadcast()" class="w-full py-6 bg-red-600 text-white font-black uppercase rounded-full shadow-2xl active:scale-95 transition-all">Initiate Global Uplink</button>
                </div>

                <div class="glass p-10 rounded-[4rem] border border-gold/20 text-center relative overflow-hidden group">
                    <div class="absolute inset-0 bg-radial-gradient from-gold/10 to-transparent"></div>
                    <div class="w-64 h-64 mx-auto relative z-10 group-hover:scale-110 transition-transform duration-700">
                        <img src="assets/images/1000219947.png" class="w-full h-full object-contain">
                        <div class="absolute inset-0 border-4 border-gold/10 rounded-full animate-pulse"></div>
                    </div>
                    <div class="pt-10 border-t border-gold/10 mt-10">
                        <h3 class="text-xl font-black uppercase italic tracking-tighter">Seal of the Directorate</h3>
                        <p class="text-[9px] text-zinc-500 uppercase font-black tracking-widest mt-2">Authenticated Emalahleni Uplink // 2026</p>
                    </div>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
