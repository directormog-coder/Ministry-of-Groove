<!DOCTYPE html>
<html lang="en" color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050A0E">
  <meta name="robots" content="noindex, nofollow">
  <title>M.O.G. | DIRECTORATE COMMAND</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #F0C85A;
      --gold-glow: rgba(201,168,76,0.3);
      --teal: #00E5CC;
      --teal-glow: rgba(0,229,204,0.3);
      --red: #FF3B3B;
      --red-glow: rgba(255,59,59,0.3);
      --black: #050A0E;
      --navy: #0D1F2D;
      --panel: rgba(13,31,45,0.9);
      --border: rgba(201,168,76,0.15);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background: var(--black); color: #fff; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; min-height: 100vh; padding-bottom: 60px; }

    /* --- ATMOSPHERICS --- */
    .bg-vfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle, black, transparent 85%); opacity: 0.1; }
    .scanlines { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px); z-index: 5; }

    /* --- TOP COMMAND BAR --- */
    .command-bar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5,10,14,0.98); border-bottom: 1px solid var(--gold);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
      backdrop-filter: blur(20px);
    }
    .director-brand { display: flex; align-items: center; gap: 15px; }
    .director-brand img { filter: drop-shadow(0 0 8px var(--gold-glow)); }
    .system-clock { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--teal); letter-spacing: 2px; }

    /* --- LAYOUT GRID --- */
    .dashboard {
      display: grid; grid-template-columns: 1fr 360px; gap: 20px;
      max-width: 1400px; margin: 20px auto; padding: 0 20px;
      position: relative; z-index: 10;
    }

    /* --- STATS RIBBON --- */
    .stats-ribbon { grid-column: span 2; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    .stat-card {
      background: var(--panel); border: 1px solid var(--border);
      padding: 18px; border-radius: 8px; position: relative; overflow: hidden;
    }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--gold); }
    .stat-label { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--gold-glow); letter-spacing: 2px; text-transform: uppercase; }
    .stat-value { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; margin-top: 5px; letter-spacing: 1px; }

    /* --- MAIN PANELS --- */
    .glass-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .panel-title { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 3px; color: var(--gold); font-weight: 700; }

    .video-feed {
      width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; 
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .radar-sweep {
      position: absolute; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, var(--teal-glow), transparent 30%);
      animation: rotate 4s linear infinite; opacity: 0.2;
    }

    /* --- BUTTONS --- */
    .console-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
    .btn {
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      padding: 15px; border-radius: 6px; cursor: pointer; color: #fff;
      font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
      letter-spacing: 2px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn:hover { background: var(--gold); color: var(--black); box-shadow: 0 0 20px var(--gold-glow); }
    .btn-danger { color: var(--red); border-color: var(--red-glow); }
    .btn-danger:hover { background: var(--red); color: #fff; box-shadow: 0 0 20px var(--red-glow); }
    .btn-danger.active { background: var(--red); color: #fff; animation: pulse-red 1.5s infinite; }

    /* --- LISTS & ANIMATIONS --- */
    .log-container { height: 400px; overflow-y: auto; padding-right: 10px; }
    .log-item { padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-family: 'Share Tech Mono', monospace; font-size: 11px; }
    .log-item .ts { color: var(--gold-glow); font-size: 9px; margin-bottom: 4px; display: block; }
    .op-row { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 2px solid var(--teal); }
    
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255,59,59,0.7); } 70% { box-shadow: 0 0 0 15px rgba(255,59,59,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,59,0); } }
    
    [x-cloak] { display: none !important; }
    @media (max-width: 1000px) { .dashboard { grid-template-columns: 1fr; } .stats-ribbon { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body x-data="directorCommand()" x-init="init()">

  <div class="bg-vfx"><div class="grid"></div><div class="scanlines"></div></div>

  <template x-if="view === 'loading'">
    <div style="height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; z-index:20;">
      <div style="width:60px; height:60px; border:3px solid var(--gold); border-top-color:transparent; border-radius:50%; animation: rotate 1s linear infinite;"></div>
      <p style="margin-top:25px; font-family:'Orbitron'; font-size:11px; letter-spacing:6px; color:var(--gold);">AUTHENTICATING DIRECTOR ACCESS...</p>
    </div>
  </template>

  <template x-if="view === 'active'">
    <div>
      <nav class="command-bar">
        <div class="director-brand">
          <img src="../assets/images/1000219947.png" height="32">
          <div>
            <h1 style="font-family:'Orbitron'; font-size:14px; letter-spacing:2px; font-weight:900;">DIRECTORATE COMMAND</h1>
            <p class="system-clock">UPLINK: SECURE // <span x-text="currentTime"></span></p>
          </div>
        </div>
        <a href="../index.html" class="btn" style="padding:8px 15px;">EXIT TO HUB</a>
      </nav>

      <main class="dashboard">
        <div class="stats-ribbon">
          <div class="stat-card">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" style="color:var(--gold-light);" x-text="stats.revenue"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Operatives Live</div>
            <div class="stat-value" style="color:var(--teal);" x-text="operatives.length"></div>
          </div>
          <div class="stat-card">
            <div class="stat-label">System Load</div>
            <div class="stat-value">12.4%</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Vault Status</div>
            <div class="stat-value">LOCKED</div>
          </div>
        </div>

        <div>
          <div class="glass-panel">
            <div class="panel-head">
              <div class="panel-title">// MASTER SIGNAL OVERRIDE</div>
              <div style="font-family:'Share Tech Mono'; font-size:10px; color:var(--red);">LIVE BROADCAST ACTIVE</div>
            </div>
            <div class="video-feed">
              <div class="radar-sweep"></div>
              <div style="z-index:10; text-align:center;">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--gold-glow)" stroke-width="1">
                  <circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20"/>
                </svg>
                <p style="font-family:'Share Tech Mono'; font-size:10px; color:var(--gold-glow); margin-top:10px; letter-spacing:2px;">FEED: MOG_PRIME_STREAM</p>
              </div>
            </div>
            <div class="console-grid">
              <button class="btn btn-danger" :class="protocolZero ? 'active' : ''" @click="toggleProtocol()">
                <span x-text="protocolZero ? 'DISENGAGE LOCKDOWN' : 'PROTOCOL ZERO'"></span>
              </button>
              <button class="btn" @click="globalBroadcast()">GLOBAL PUSH ALERT</button>
            </div>
          </div>

          <div class="glass-panel">
            <div class="panel-title" style="margin-bottom:15px;">// DEPLOY NEW ASSETS</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
              <div style="border:1px dashed var(--border); padding:20px; border-radius:8px; text-align:center; background:rgba(0,0,0,0.2);">
                <p style="font-size:10px; font-family:'Share Tech Mono';">DROP SESSION MEDIA</p>
                <button class="btn" style="margin-top:10px; font-size:9px; padding:8px;">BROWSE</button>
              </div>
              <div style="display:flex; flex-direction:column; gap:10px;">
                <input type="text" placeholder="SESSION TITLE..." style="background:var(--navy); border:1px solid var(--border); padding:10px; border-radius:4px; color:#fff; font-family:'Share Tech Mono';">
                <button class="btn" style="background:var(--teal); color:var(--black); border:none;">UPLOAD TO GALLERY</button>
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:20px;">
          <div class="glass-panel" style="padding:20px; margin:0;">
            <div class="panel-title" style="font-size:11px; margin-bottom:15px;">TRANSMISSION LOGS</div>
            <div class="log-container">
              <template x-for="log in logs" :key="log.id">
                <div class="log-item">
                  <span class="ts" x-text="formatTime(log.created_at)"></span>
                  <span x-text="log.description"></span>
                </div>
              </template>
            </div>
          </div>
          <div class="glass-panel" style="padding:20px; margin:0;">
            <div class="panel-title" style="font-size:11px; margin-bottom:15px;">ACTIVE DOSSIERS</div>
            <template x-for="op in operatives" :key="op.username">
              <div class="op-row">
                <div style="width:30px; height:30px; border-radius:50%; background:var(--navy); display:flex; align-items:center; justify-content:center; font-size:10px; font-family:'Orbitron'; border:1px solid var(--border);" x-text="op.username.substring(0,2).toUpperCase()"></div>
                <div style="flex:1;">
                  <div style="font-size:11px; font-weight:700;" x-text="op.username"></div>
                  <div style="font-size:8px; color:var(--gold-glow); text-transform:uppercase;" x-text="op.rank || 'OPERATIVE'"></div>
                </div>
                <div style="width:6px; height:6px; background:var(--teal); border-radius:50%; animation: pulse-red 2s infinite;"></div>
              </div>
            </template>
          </div>
        </div>
      </main>
    </div>
  </template>

  <script>
    function directorCommand() {
      return {
        view: 'loading',
        currentTime: '',
        protocolZero: false,
        stats: { revenue: 'R45,200' },
        logs: [],
        operatives: [],

        async init() {
          setInterval(() => { this.currentTime = new Date().toLocaleTimeString(); }, 1000);
          try {
            if (typeof sb !== 'undefined') {
              const { data: { session } } = await sb.auth.getSession();
              if (!session) { window.location.href = '../login.html'; return; }
              await this.syncData();
            } else {
              // Mock data for display
              this.logs = [{ id:1, created_at: new Date(), description: 'SYSTEMS ONLINE // OFFLINE EMULATION' }];
              this.operatives = [{ username: 'DIRECTOR_X', rank: 'DIRECTOR' }];
            }
            this.view = 'active';
          } catch (e) { this.view = 'active'; }
        },

        async syncData() {
          const { data: logs } = await sb.from('activity_log').select('*').order('created_at', { ascending: false }).limit(15);
          this.logs = logs || [];
          const { data: ops } = await sb.from('profiles').select('username, rank').limit(5);
          this.operatives = ops || [];
        },

        async toggleProtocol() {
          const mode = !this.protocolZero;
          if(confirm(mode ? "ACTIVATE SYSTEM-WIDE LOCKDOWN?" : "REVERT TO NORMAL OPERATIONS?")) {
            this.protocolZero = mode;
            if(typeof sb !== 'undefined') {
              await sb.from('system_settings').upsert({ key: 'protocol_zero', value: mode });
              await sb.from('activity_log').insert({ description: mode ? '!!! PROTOCOL ZERO ENGAGED !!!' : 'Protocol Zero Disengaged' });
              this.syncData();
            }
          }
        },

        async globalBroadcast() {
          const msg = prompt("ENTER BROADCAST ALERT:");
          if(msg && typeof sb !== 'undefined') {
            await sb.from('activity_log').insert({ description: `GLOBAL ALERT: ${msg}` });
            this.syncData();
            alert("BROADCAST SENT.");
          }
        },

        formatTime(ts) { return new Date(ts).toLocaleTimeString(); }
      }
    }
  </script>
</body>
</html>
