<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <meta name="theme-color" content="#000000">
    <title>DIRECTORATE HQ | MASTER COMMAND</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-client.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
        [x-cloak] { display: none !important; }

        :root {
            --black:       #000000;
            --surface:     #0a0806;
            --gold:        #d4af37;
            --gold-bright: #f0c040;
            --gold-dark:   #8b6914;
            --gold-glow:   rgba(212,175,55,0.45);
            --gold-dim:    rgba(212,175,55,0.12);
            --red:         #dc2626;
            --red-dark:    #991b1b;
            --red-glow:    rgba(220,38,38,0.4);
            --teal:        #00d4aa;
            --teal-glow:   rgba(0,212,170,0.3);
            --text:        #e8e0cc;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family:'Rajdhani',sans-serif; background:var(--black); color:var(--text); min-height:100vh; overflow-x:hidden; }
        .mono  { font-family:'Share Tech Mono',monospace; }
        .orbit { font-family:'Orbitron',sans-serif; }

        .seal-watermark {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            width:80vmin; height:80vmin;
            background:url('/assets/images/1000219947.png') center/contain no-repeat;
            opacity:0.05; pointer-events:none; z-index:0;
            filter:sepia(60%) hue-rotate(5deg) saturate(180%) drop-shadow(0 0 60px rgba(212,175,55,0.2));
        }
        .grid-overlay {
            position:fixed; inset:0; z-index:1; pointer-events:none;
            background-image:
                linear-gradient(rgba(220,38,38,0.04) 1px,transparent 1px),
                linear-gradient(90deg,rgba(220,38,38,0.04) 1px,transparent 1px);
            background-size:48px 48px;
        }
        .vignette { position:fixed; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.85) 100%); }
        .scanline { position:fixed; top:-80px; left:0; width:100%; height:80px; z-index:3; pointer-events:none; background:linear-gradient(transparent,rgba(220,38,38,0.04) 50%,transparent); animation:scanline 10s linear infinite; }
        @keyframes scanline { to{top:100vh} }
        #binaryCanvas { position:fixed; inset:0; z-index:1; opacity:0.04; pointer-events:none; }

        /* Glass */
        .glass-red  { background:rgba(14,4,4,0.9); backdrop-filter:blur(24px); border:1px solid rgba(220,38,38,0.25); box-shadow:0 4px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.04); }
        .glass-gold { background:rgba(14,10,2,0.92); backdrop-filter:blur(24px); border:1px solid rgba(212,175,55,0.28); box-shadow:0 4px 40px rgba(0,0,0,0.6),inset 0 1px 0 rgba(212,175,55,0.05); }
        .glass-dark { background:rgba(8,6,2,0.95); backdrop-filter:blur(24px); border:1px solid rgba(212,175,55,0.1); }
        .glass-teal { background:rgba(0,20,16,0.92); backdrop-filter:blur(24px); border:1px solid rgba(0,212,170,0.22); box-shadow:0 4px 40px rgba(0,0,0,0.6); }

        /* Text */
        .text-gold     { color:var(--gold); text-shadow:0 0 14px var(--gold-glow); }
        .text-gold-b   { color:var(--gold-bright); text-shadow:0 0 20px var(--gold-glow); }
        .text-red-glow { color:var(--red); text-shadow:0 0 14px var(--red-glow); }
        .text-teal-acc { color:var(--teal); text-shadow:0 0 12px var(--teal-glow); }

        /* Buttons */
        .btn { position:relative; overflow:hidden; transition:all 0.26s ease; }
        .btn::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent); transform:translateX(-100%); transition:transform 0.5s ease; }
        .btn:hover::after { transform:translateX(100%); }
        .btn:hover { transform:translateY(-1px); }
        .btn:disabled { opacity:0.35; cursor:not-allowed; transform:none !important; }
        .btn-red   { background:linear-gradient(135deg,rgba(220,38,38,0.15),rgba(153,27,27,0.28)); border:1px solid rgba(220,38,38,0.45); color:#fca5a5; }
        .btn-red:hover   { background:linear-gradient(135deg,rgba(220,38,38,0.3),rgba(153,27,27,0.45)); border-color:var(--gold); box-shadow:0 0 24px var(--red-glow); color:#fff; }
        .btn-gold  { background:linear-gradient(135deg,rgba(212,175,55,0.12),rgba(139,105,20,0.22)); border:1px solid rgba(212,175,55,0.4); color:var(--gold); }
        .btn-gold:hover  { background:linear-gradient(135deg,rgba(212,175,55,0.25),rgba(139,105,20,0.38)); border-color:var(--gold-bright); box-shadow:0 0 24px var(--gold-glow); }
        .btn-green { background:linear-gradient(135deg,rgba(22,163,74,0.15),rgba(21,128,61,0.25)); border:1px solid rgba(22,163,74,0.4); color:#86efac; }
        .btn-green:hover { background:linear-gradient(135deg,rgba(22,163,74,0.28),rgba(21,128,61,0.4)); border-color:#4ade80; box-shadow:0 0 20px rgba(22,163,74,0.3); }
        .btn-teal  { background:linear-gradient(135deg,rgba(0,212,170,0.12),rgba(0,110,89,0.22)); border:1px solid rgba(0,212,170,0.4); color:var(--teal); }
        .btn-teal:hover  { background:linear-gradient(135deg,rgba(0,212,170,0.25),rgba(0,110,89,0.38)); border-color:var(--teal); box-shadow:0 0 24px var(--teal-glow); }

        /* Nav node */
        .nav-node { background:linear-gradient(135deg,rgba(14,10,2,0.9),rgba(20,6,6,0.9)); border:1px solid rgba(212,175,55,0.18); transition:all 0.25s ease; cursor:pointer; position:relative; overflow:hidden; }
        .nav-node:hover { border-color:rgba(220,38,38,0.5); box-shadow:0 0 24px rgba(212,175,55,0.08),0 0 8px var(--red-glow); transform:translateY(-2px); }

        /* Seal card */
        .seal-card { transition:box-shadow 0.4s ease; }
        .seal-card:hover { box-shadow:0 0 60px rgba(212,175,55,0.2),0 0 120px rgba(220,38,38,0.08) !important; }
        .seal-card img { filter:drop-shadow(0 0 24px rgba(212,175,55,0.35)) drop-shadow(0 0 8px rgba(0,212,170,0.2)); transition:all 0.5s ease; }
        .seal-card:hover img { filter:drop-shadow(0 0 40px rgba(212,175,55,0.55)) drop-shadow(0 0 16px rgba(0,212,170,0.3)); transform:scale(1.03); }

        /* Classified stamp */
        .classified { position:absolute; top:18px; right:18px; color:var(--red); border:2px solid var(--red); padding:4px 14px; font-size:9px; font-weight:900; letter-spacing:0.3em; transform:rotate(15deg); text-transform:uppercase; pointer-events:none; font-family:'Orbitron',sans-serif; text-shadow:0 0 8px var(--red-glow); box-shadow:0 0 12px var(--red-glow); opacity:0.85; }

        /* Dividers */
        .gold-line { height:1px; background:linear-gradient(90deg,transparent,var(--gold-dark),var(--gold),var(--red),var(--gold-dark),transparent); }

        /* Inputs */
        .input-dir { background:rgba(0,0,0,0.7); border:1px solid rgba(220,38,38,0.25); color:var(--text); font-family:'Share Tech Mono',monospace; transition:border-color 0.25s,box-shadow 0.25s; width:100%; }
        .input-dir:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,0.06),0 0 20px rgba(212,175,55,0.1); outline:none; }
        .input-dir::placeholder { color:rgba(255,255,255,0.2); }
        .input-dir:disabled { opacity:0.4; cursor:not-allowed; }
        select.input-dir option { background:#0a0806; color:var(--text); }

        /* Status dots */
        .dot-online  { background:#22c55e; box-shadow:0 0 8px #22c55e; }
        .dot-warning { background:#eab308; box-shadow:0 0 8px #eab308; }
        .dot-offline { background:#6b7280; }
        .dot-red     { background:var(--red); box-shadow:0 0 8px var(--red); }
        .dot-pulse   { animation:dotPulse 2s ease-in-out infinite; }
        @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Loader */
        .loader { width:64px; height:64px; border-radius:50%; border:3px solid transparent; border-top-color:var(--gold); border-right-color:var(--red); animation:spin 1.4s linear infinite; box-shadow:0 0 24px var(--gold-glow); }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* Animations */
        .fade-up { animation:fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .dot-blink span { animation:blink 1.3s infinite; }
        .dot-blink span:nth-child(2){animation-delay:.2s} .dot-blink span:nth-child(3){animation-delay:.4s}
        @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

        /* Scrollbar */
        ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-track { background:rgba(0,0,0,0.8); }
        ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--gold-dark),var(--red-dark)); border-radius:4px; }

        /* Toast */
        .toast { font-family:'Orbitron',sans-serif; font-weight:700; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; border-radius:12px; padding:14px 20px; box-shadow:0 8px 32px rgba(0,0,0,0.8); display:flex; align-items:center; gap:10px; border-width:1px; border-style:solid; transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s ease; }

        /* Wealth number */
        .wealth-num { font-family:'Orbitron',sans-serif; background:linear-gradient(135deg,var(--gold-bright),var(--gold),var(--teal)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 10px rgba(212,175,55,0.4)); }

        /* Stat bar */
        .stat-track { height:3px; background:rgba(0,0,0,0.8); border-radius:99px; overflow:hidden; border:1px solid rgba(212,175,55,0.1); }
        .stat-fill  { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold-dark),var(--gold-bright)); box-shadow:0 0 8px var(--gold-glow); transition:width 1.4s cubic-bezier(0.34,1.56,0.64,1); }
        .stat-fill-red { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--red-dark),var(--red)); box-shadow:0 0 8px var(--red-glow); transition:width 1.4s cubic-bezier(0.34,1.56,0.64,1); }

        /* Lockdown pulse */
        .lockdown-pulse { animation:lockPulse 2s ease-in-out infinite; }
        @keyframes lockPulse { 0%,100%{border-color:rgba(220,38,38,0.5)} 50%{border-color:rgba(220,38,38,0.95);box-shadow:0 0 20px var(--red-glow)} }

        /* Tab */
        .tab-active { position:relative; }
        .tab-active::after { content:''; position:absolute; bottom:-1px; left:15%; width:70%; height:2px; background:linear-gradient(90deg,var(--gold-dark),var(--gold),var(--red)); border-radius:2px; box-shadow:0 0 8px var(--gold-glow); }

        /* Row hover */
        .row-hover { transition:border-color 0.2s,background 0.2s; }
        .row-hover:hover { border-color:rgba(212,175,55,0.28) !important; background:rgba(212,175,55,0.04) !important; }

        /* Op card */
        .op-card { transition:border-color 0.2s,transform 0.2s; }
        .op-card:hover { border-color:rgba(220,38,38,0.38) !important; transform:translateY(-1px); }

        /* Rank badge */
        .rank-badge { border-radius:999px; padding:2px 10px; font-size:0.62rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; font-family:'Orbitron',sans-serif; }

        /* Permission toggle */
        .perm-toggle { width:44px; height:24px; border-radius:12px; border:1px solid rgba(212,175,55,0.3); background:rgba(0,0,0,0.6); cursor:pointer; position:relative; transition:all 0.3s ease; flex-shrink:0; }
        .perm-toggle.on { background:rgba(22,163,74,0.3); border-color:rgba(22,163,74,0.5); box-shadow:0 0 12px rgba(22,163,74,0.3); }
        .perm-toggle::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--gold-dark); transition:all 0.3s ease; }
        .perm-toggle.on::after { left:22px; background:#4ade80; }

        /* ── NEW: Lockdown Overlay ── */
        .lockdown-overlay {
            position:fixed; inset:0; z-index:99999;
            background:rgba(0,0,0,0.97);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            animation:fadeUp 0.3s ease forwards;
        }
        .lockdown-overlay-border {
            position:absolute; inset:12px; border:2px solid var(--red); border-radius:24px;
            animation:lockPulse 1.5s ease-in-out infinite;
            pointer-events:none;
        }
        .lockdown-skull { animation:spin 8s linear infinite; }

        /* ── NEW: Ticker bar ── */
        .ticker-bar {
            position:fixed; top:0; left:0; right:0; z-index:9998;
            height:28px; overflow:hidden;
            background:linear-gradient(90deg,var(--red-dark),rgba(0,0,0,0.9),var(--red-dark));
            border-bottom:1px solid rgba(220,38,38,0.4);
            display:flex; align-items:center;
        }
        .ticker-track {
            display:flex; gap:0; white-space:nowrap;
            animation:tickerScroll 25s linear infinite;
        }
        @keyframes tickerScroll {
            0%   { transform:translateX(100vw); }
            100% { transform:translateX(-100%); }
        }
        .ticker-text { font-family:'Orbitron',sans-serif; font-size:9px; font-weight:700; letter-spacing:0.3em; color:var(--gold); text-transform:uppercase; }
        .ticker-sep { color:var(--red); margin:0 24px; font-size:10px; }

        /* ── NEW: Protocol Zero button ── */
        .proto-zero-btn {
            position:relative; overflow:hidden;
            background:linear-gradient(135deg,rgba(220,38,38,0.08),rgba(0,0,0,0.9));
            border:2px solid rgba(220,38,38,0.5);
            border-radius:20px; cursor:pointer; transition:all 0.3s ease;
        }
        .proto-zero-btn:hover { border-color:var(--red); box-shadow:0 0 40px var(--red-glow),0 0 80px rgba(220,38,38,0.1); }
        .proto-zero-btn.armed { animation:lockPulse 0.8s ease-in-out infinite; }
        .proto-zero-ring {
            position:absolute; inset:-6px; border-radius:26px;
            border:1px solid rgba(220,38,38,0.2);
            animation:ringPulse 2s ease-in-out infinite;
        }
        @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:0.3} 50%{transform:scale(1.02);opacity:0.7} }

        /* ── NEW: Piano chart bar ── */
        .piano-bar { height:4px; background:rgba(0,0,0,0.6); border-radius:99px; overflow:hidden; margin-top:4px; }
        .piano-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--teal),var(--gold)); box-shadow:0 0 6px var(--teal-glow); transition:width 1.2s cubic-bezier(0.34,1.56,0.64,1); }

        /* ── NEW: Intel gallery ── */
        .intel-thumb { transition:all 0.3s ease; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
        .intel-thumb:hover { transform:scale(1.04); box-shadow:0 0 30px var(--gold-glow); }
        .intel-thumb img, .intel-thumb video { width:100%; height:100%; object-fit:cover; }

        /* ── NEW: Chat message ── */
        .chat-msg-director { align-self:flex-end; background:linear-gradient(135deg,rgba(220,38,38,0.18),rgba(0,0,0,0.8)); border:1px solid rgba(220,38,38,0.3); border-radius:16px 16px 4px 16px; }
        .chat-msg-operative { align-self:flex-start; background:linear-gradient(135deg,rgba(212,175,55,0.08),rgba(0,0,0,0.8)); border:1px solid rgba(212,175,55,0.18); border-radius:16px 16px 16px 4px; }

        /* ── NEW: Popularity chart bar ── */
        .pop-bar { height:5px; background:rgba(0,0,0,0.7); border-radius:99px; overflow:hidden; }
        .pop-bar-fill { height:100%; border-radius:99px; transition:width 1.5s cubic-bezier(0.34,1.56,0.64,1); }

        /* ── NEW: Command seal ring ── */
        .seal-ring {
            position:absolute; inset:-8px; border-radius:50%;
            border:1px solid rgba(212,175,55,0.25);
            animation:ringPulse 3s ease-in-out infinite;
        }
        .seal-ring-2 {
            position:absolute; inset:-16px; border-radius:50%;
            border:1px solid rgba(220,38,38,0.12);
            animation:ringPulse 3s ease-in-out infinite 0.5s;
        }

        /* auth gate */
        .auth-gate { position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,0.99);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px; }

        /* Slogan */
        .slogan-text { font-family:'Orbitron',sans-serif; font-size:9px; letter-spacing:0.35em; color:var(--teal); text-transform:uppercase; opacity:0.7; text-shadow:0 0 12px var(--teal-glow); }
    </style>

    <script>
    /* ─────────────────────────────────────────────
       commandCenter()  — Alpine.js root component
    ───────────────────────────────────────────── */
    function commandCenter() {
        return {
            /* ── Views / tabs ── */
            view: 'gate',
            activeTab: 'broadcast',

            /* ── Clock ── */
            currentTime: '',
            sessionDuration: '00:00:00',
            sessionStart: null,

            /* ── UI State ── */
            isLoading: false,
            systemStatus: 'ONLINE',
            activeNodes: 0,
            threatLevel: 'LOW',
            lastSync: null,
            confirmLockdown: false,
            currentDirectorId: null,

            /* ── Protocol Zero (Panic Button) ── */
            protocolZeroArmed: false,
            protocolZeroActive: false,
            protocolZeroCountdown: 0,
            protocolZeroTimer: null,

            /* ── Ticker ── */
            tickerMessage: '',
            tickerActive: false,
            tickerMessages: [],

            /* ── Data ── */
            operatives: [],
            liveActivity: [],
            recentDirectives: [],
            allMessages: [],
            chatMessages: [],
            chatInput: '',
            popularityData: [],
            amapianoChart: [],
            intelGallery: [],
            wealth: '1.4M',

            /* ── Index control ── */
            indexControl: {
                bannerText:   'THE MINISTRY OF GROOVE',
                subText:      'EMALAHLENI UPLINK II EST. 2026',
                alertStatus:  'ALL CLEAR',
                frequency:    '104.7 FM',
                isLocked:     false
            },

            /* ── Broadcast ── */
            broadcastInput: '',
            broadcastPriority: 'HIGH',

            /* ── Operative management ── */
            selectedOperative: null,
            editingOperative: false,
            rankOptions: ['INITIATE','AGENT','OPERATIVE','SPECIALIST','DIRECTOR'],
            deptOptions: ['UNASSIGNED','OPERATIONS','INTELLIGENCE','COMMUNICATIONS','LOGISTICS','RESEARCH','SOUND'],
            operativeFilter: '',

            /* ── Content management ── */
            newAnnouncement: { title:'', content:'', priority:'NORMAL', visible:true },

            /* ── System settings ── */
            sysSettings: {
                maintenanceMode: false,
                registrationOpen: true,
                maxOperatives: 100,
                siteName: 'M.O.G. NETWORK',
                siteTagline: 'Ministry of Groove',
                contactEmail: 'director.mog@gmail.com',
                whatsapp: '0813874921'
            },

            /* ── Computed ── */
            get filteredOperatives() {
                if (!this.operativeFilter) return this.operatives;
                const q = this.operativeFilter.toLowerCase();
                return this.operatives.filter(o =>
                    (o.username||'').toLowerCase().includes(q) ||
                    (o.codename||'').toLowerCase().includes(q) ||
                    (o.rank||'').toLowerCase().includes(q) ||
                    (o.department||'').toLowerCase().includes(q)
                );
            },

            /* ──────────────────────── INIT ──────────────────────── */
            async init() {
                // ── ALPHA GATEKEEPER ──
                const role      = localStorage.getItem('userRole');
                const clearance = localStorage.getItem('clearanceLevel');
                if (role !== 'director' && clearance !== 'ALPHA') {
                    this.showAuthFail(); return;
                }

                // Wait for supabase-client.js to expose `sb`
                let tries = 0;
                while (typeof sb === 'undefined' && tries < 30) {
                    await new Promise(r => setTimeout(r, 100)); tries++;
                }
                if (!sb) { this.hardRedirect('/login.html'); return; }

                const { data:{ session } } = await sb.auth.getSession();
                if (!session) { this.hardRedirect('/login.html'); return; }

                // Double-check DB rank
                const { data: profile } = await sb.from('profiles')
                    .select('rank').eq('id', session.user.id).single();
                if (profile && profile.rank !== 'DIRECTOR') {
                    this.showAuthFail(); return;
                }

                this.currentDirectorId = session.user.id;
                this.view = 'active';
                this.sessionStart = Date.now();
                this.lastSync = new Date().toISOString();
                this.startClock();
                this.syncWithIndex();
                this.loadSysSettings();
                this.seedStaticData();
                await this.loadAll();
                this.$nextTick(() => lucide.createIcons());
            },

            showAuthFail() {
                document.body.innerHTML = `
                    <div style="position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-family:'Orbitron',sans-serif;">
                        <div style="width:60px;height:60px;border-radius:50%;border:2px solid #dc2626;display:flex;align-items:center;justify-content:center;color:#dc2626;font-size:24px;box-shadow:0 0 30px rgba(220,38,38,0.5);">✕</div>
                        <p style="color:#dc2626;font-size:11px;letter-spacing:0.4em;text-transform:uppercase;text-shadow:0 0 10px rgba(220,38,38,0.6);">Insufficient Clearance</p>
                        <p style="color:#6b7280;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;">Access Denied — Redirecting to Login Terminal</p>
                    </div>`;
                setTimeout(() => { window.location.href = '/login.html'; }, 2500);
            },

            hardRedirect(url) { window.location.href = url; },

            /* ── Seed static/mock data for new modules ── */
            seedStaticData() {
                this.amapianoChart = [
                    { rank:1,  title:'John Vuli Gate',  artist:'Mapara A Jazz ft. Ntosh Gazi', plays:'2.4M', trend:'up',   pct:98 },
                    { rank:2,  title:'Stimela',          artist:'Master KG ft. Nomcebo',        plays:'2.1M', trend:'up',   pct:92 },
                    { rank:3,  title:'Bayeke',           artist:'Ami Faku ft. Donald',          plays:'1.9M', trend:'same', pct:87 },
                    { rank:4,  title:'Umsebenzi Wethu',  artist:'Vigro Deep ft. Nhlanhla',      plays:'1.7M', trend:'up',   pct:81 },
                    { rank:5,  title:'Phoyisa',          artist:'DJ Stokie ft. Samthing',       plays:'1.5M', trend:'down', pct:76 },
                    { rank:6,  title:'Piano Season',     artist:'DBN Gogo',                     plays:'1.4M', trend:'up',   pct:72 },
                    { rank:7,  title:'Gqom Theory',      artist:'DJ Lag ft. Lasoulmate',        plays:'1.2M', trend:'same', pct:65 },
                    { rank:8,  title:'Umlando',          artist:'9umba, Comado, Njelic',        plays:'1.1M', trend:'down', pct:60 },
                    { rank:9,  title:'Ke Star',          artist:'Focalistic ft. Vigro Deep',    plays:'1.0M', trend:'up',   pct:55 },
                    { rank:10, title:'Love You Tonight', artist:'Kabza De Small ft. Howard',    plays:'0.9M', trend:'same', pct:50 },
                ];

                this.intelGallery = [
                    { id:1, type:'image', src:'/assets/images/gallery1.jpg',  label:'OP: EMALAHLENI DROP', date:'2 days ago' },
                    { id:2, type:'image', src:'/assets/images/gallery2.jpg',  label:'OP: GROOVE SUMMIT',   date:'4 days ago' },
                    { id:3, type:'video', src:'/assets/videos/clip1.mp4',     label:'INTEL CLIP A',        date:'1 week ago' },
                    { id:4, type:'image', src:'/assets/images/gallery3.jpg',  label:'OP: SECTOR 7G AUDIT', date:'1 week ago' },
                    { id:5, type:'image', src:'/assets/images/gallery4.jpg',  label:'DIRECTORATE BRIEF',   date:'2 weeks ago'},
                    { id:6, type:'video', src:'/assets/videos/clip2.mp4',     label:'FIELD TRANSMISSION',  date:'2 weeks ago'},
                ];
            },

            /* ──────────────── LOAD ALL ────────────────── */
            async loadAll() {
                this.isLoading = true;
                try {
                    await Promise.all([
                        this.loadOperatives(),
                        this.loadActivity(),
                        this.loadDirectives(),
                        this.loadMessages(),
                        this.loadChat(),
                        this.loadPopularity(),
                        this.loadTickers()
                    ]);
                    this.lastSync = new Date().toISOString();
                } finally {
                    this.isLoading = false;
                }
            },

            async loadOperatives() {
                const { data } = await sb.from('profiles')
                    .select('*').order('last_active', { ascending: false });
                this.operatives = data || [];
                this.activeNodes = this.operatives.filter(o => {
                    return (Date.now() - new Date(o.last_active||0)) / 60000 < 30;
                }).length;
            },

            async loadActivity() {
                const { data } = await sb.from('activity_log')
                    .select('*').order('created_at', { ascending: false }).limit(30);
                this.liveActivity = data || [];
            },

            async loadDirectives() {
                const { data } = await sb.from('directives')
                    .select('*').order('timestamp', { ascending: false }).limit(10);
                this.recentDirectives = data || [];
            },

            async loadMessages() {
                const { data } = await sb.from('messages')
                    .select('*').order('created_at', { ascending: false }).limit(20);
                this.allMessages = data || [];
            },

            async loadChat() {
                try {
                    const { data } = await sb.from('chat_messages')
                        .select('*').order('created_at', { ascending: false }).limit(40);
                    this.chatMessages = (data || []).reverse();
                } catch(_) { this.chatMessages = []; }
            },

            async loadPopularity() {
                try {
                    const { data } = await sb.from('media_likes')
                        .select('media_id, title, count')
                        .order('count', { ascending: false }).limit(8);
                    if (data && data.length) {
                        const max = data[0].count || 1;
                        this.popularityData = data.map(d => ({
                            ...d, pct: Math.round((d.count/max)*100)
                        }));
                    } else {
                        // Fallback mock data
                        this.popularityData = [
                            { title:'Groove Drop Ep.01', count:284, pct:100, color:'var(--gold)' },
                            { title:'Sector 7G Remix',   count:241, pct:85,  color:'var(--teal)' },
                            { title:'Emalahleni Uplink', count:198, pct:70,  color:'var(--gold)' },
                            { title:'Piano Chronicles',  count:155, pct:55,  color:'var(--teal)' },
                            { title:'Frequency 104.7',   count:122, pct:43,  color:'var(--gold)' },
                        ];
                    }
                } catch(_) {
                    this.popularityData = [
                        { title:'Groove Drop Ep.01', count:284, pct:100 },
                        { title:'Sector 7G Remix',   count:241, pct:85 },
                        { title:'Emalahleni Uplink', count:198, pct:70 },
                    ];
                }
            },

            async loadTickers() {
                try {
                    const { data } = await sb.from('ticker_messages')
                        .select('*').eq('active', true).order('created_at', { ascending: false }).limit(5);
                    this.tickerMessages = data || [];
                    if (this.tickerMessages.length) this.tickerActive = true;
                } catch(_) {}
            },

            /* ──────────────── INDEX SYNC ─────────────── */
            syncWithIndex() {
                try {
                    const s = localStorage.getItem('ministrySettings');
                    if (s) this.indexControl = { ...this.indexControl, ...JSON.parse(s) };
                } catch(_) {}
            },

            async pushToIndex() {
                localStorage.setItem('ministrySettings', JSON.stringify(this.indexControl));
                window.dispatchEvent(new StorageEvent('storage', {
                    key: 'ministrySettings', newValue: JSON.stringify(this.indexControl)
                }));
                try {
                    await sb.from('system_settings').upsert({
                        key: 'ministrySettings',
                        value: JSON.stringify(this.indexControl),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });
                } catch(_) {}
            },

            /* ──────────────── TICKER BROADCAST ─────────────── */
            async pushTicker() {
                if (!this.tickerMessage.trim()) return;
                this.isLoading = true;
                try {
                    // Save to DB
                    await sb.from('ticker_messages').insert({
                        message: this.tickerMessage,
                        active: true,
                        created_at: new Date().toISOString()
                    });
                    // Broadcast via system_settings so index.html picks it up
                    await sb.from('system_settings').upsert({
                        key: 'tickerBroadcast',
                        value: JSON.stringify({ message: this.tickerMessage, ts: Date.now() }),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });
                    this.tickerActive = true;
                    await this.loadTickers();
                    this.showNotification('Ticker Broadcast Active', 'success');
                    this.tickerMessage = '';
                } catch(e) {
                    this.showNotification('Ticker Push Failed', 'error');
                } finally { this.isLoading = false; }
            },

            async clearTicker() {
                try {
                    await sb.from('ticker_messages').update({ active: false }).eq('active', true);
                    await sb.from('system_settings').upsert({
                        key: 'tickerBroadcast',
                        value: JSON.stringify({ message: '', ts: Date.now() }),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });
                    this.tickerMessages = [];
                    this.tickerActive = false;
                    this.showNotification('Ticker Cleared', 'success');
                } catch(_) {}
            },

            /* ──────────────── BROADCAST DIRECTIVE ─────────────── */
            async sendBroadcast() {
                if (!this.broadcastInput.trim()) return;
                this.isLoading = true;
                try {
                    const { error } = await sb.from('directives').insert({
                        content:   this.broadcastInput,
                        issued_by: 'DIRECTOR',
                        priority:  this.broadcastPriority,
                        timestamp: new Date().toISOString(),
                        status:    'ACTIVE'
                    });
                    if (error) throw error;
                    this.indexControl.alertStatus = 'DIRECTIVE ACTIVE';
                    await this.pushToIndex();
                    this.showNotification('Directive Synchronized', 'success');
                    this.broadcastInput = '';
                    await this.loadDirectives();
                } catch(e) {
                    this.showNotification('Transmission Failed', 'error');
                } finally { this.isLoading = false; }
            },

            async deleteDirective(id) {
                try {
                    await sb.from('directives').delete().eq('id', id);
                    this.recentDirectives = this.recentDirectives.filter(d => d.id !== id);
                    this.showNotification('Directive Revoked', 'success');
                } catch(_) { this.showNotification('Delete Failed', 'error'); }
            },

            /* ──────────────── PROTOCOL ZERO ─────────────── */
            armProtocolZero() {
                this.protocolZeroArmed = true;
            },

            cancelProtocolZero() {
                this.protocolZeroArmed = false;
                if (this.protocolZeroTimer) { clearInterval(this.protocolZeroTimer); this.protocolZeroTimer = null; }
                this.protocolZeroCountdown = 0;
            },

            async fireProtocolZero() {
                this.isLoading = true;
                this.protocolZeroCountdown = 5;
                this.protocolZeroTimer = setInterval(() => {
                    this.protocolZeroCountdown--;
                    if (this.protocolZeroCountdown <= 0) {
                        clearInterval(this.protocolZeroTimer);
                        this.protocolZeroTimer = null;
                        this._executeProtocolZero();
                    }
                }, 1000);
            },

            async _executeProtocolZero() {
                try {
                    this.indexControl.isLocked    = true;
                    this.indexControl.alertStatus = '⚠ SYSTEM LOCKDOWN — ALL TERMINALS FROZEN';
                    await this.pushToIndex();

                    // Write lockdown flag to DB so every session picks it up
                    await sb.from('system_settings').upsert({
                        key: 'protocolZero',
                        value: JSON.stringify({ active: true, ts: Date.now(), initiatedBy: this.currentDirectorId }),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });

                    await sb.from('system_logs').insert({
                        event: 'PROTOCOL_ZERO',
                        initiated_by: 'DIRECTOR',
                        timestamp: new Date().toISOString()
                    }).catch(() => {});

                    this.protocolZeroActive = true;
                    this.protocolZeroArmed  = false;
                    this.showNotification('Protocol Zero Engaged — All Terminals Frozen', 'warning');
                } catch(e) {
                    this.showNotification('Protocol Zero Failed', 'error');
                } finally {
                    this.isLoading = false;
                    this.protocolZeroCountdown = 0;
                }
            },

            async standDownProtocolZero() {
                try {
                    this.indexControl.isLocked    = false;
                    this.indexControl.alertStatus = 'ALL CLEAR — STAND DOWN';
                    await this.pushToIndex();
                    await sb.from('system_settings').upsert({
                        key: 'protocolZero',
                        value: JSON.stringify({ active: false, ts: Date.now() }),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });
                    this.protocolZeroActive = false;
                    this.showNotification('Protocol Zero Lifted — Operatives Restored', 'success');
                } catch(e) {
                    this.showNotification('Stand Down Failed', 'error');
                }
            },

            /* ──────────────── LOCKDOWN (legacy) ─────────────── */
            async lockdownIndex() {
                this.isLoading = true;
                try {
                    this.indexControl.isLocked    = true;
                    this.indexControl.alertStatus = 'NETWORK LOCKDOWN ACTIVE';
                    await this.pushToIndex();
                    await sb.from('system_logs').insert({ event:'LOCKDOWN', initiated_by:'DIRECTOR', timestamp:new Date().toISOString() }).catch(() => {});
                    this.confirmLockdown = false;
                    this.showNotification('Sector Lockdown Engaged', 'warning');
                } catch(e) {
                    this.showNotification('Lockdown Failed', 'error');
                } finally { this.isLoading = false; }
            },

            async unlockIndex() {
                this.indexControl.isLocked    = false;
                this.indexControl.alertStatus = 'ALL CLEAR';
                await this.pushToIndex();
                this.showNotification('Sector Unlocked', 'success');
            },

            /* ──────────────── OPERATIVE MANAGEMENT ─────────────── */
            selectOperative(op) {
                this.selectedOperative = { ...op };
                this.editingOperative = true;
            },

            async saveOperative() {
                if (!this.selectedOperative) return;
                this.isLoading = true;
                try {
                    const { id, ...updates } = this.selectedOperative;
                    const { error } = await sb.from('profiles').update({
                        username:   updates.username,
                        codename:   updates.codename,
                        rank:       updates.rank,
                        department: updates.department,
                        bio:        updates.bio,
                        updated_at: new Date().toISOString()
                    }).eq('id', id);
                    if (error) throw error;
                    await this.loadOperatives();
                    this.editingOperative = false;
                    this.selectedOperative = null;
                    this.showNotification('Operative Dossier Updated', 'success');
                    await sb.from('activity_log').insert({
                        user_id: this.currentDirectorId, type: 'RANK_CHANGE',
                        description: `Director updated dossier for ${updates.username||id}`,
                        network: 'M.O.G.', created_at: new Date().toISOString()
                    }).catch(() => {});
                } catch(e) {
                    this.showNotification('Update Failed — ' + (e.message||'retry'), 'error');
                } finally { this.isLoading = false; }
            },

            async banOperative(op) {
                if (!confirm(`Ban operative ${op.username}?`)) return;
                this.isLoading = true;
                try {
                    await sb.from('profiles').update({
                        rank:'BANNED',
                        bio:`[BANNED by Director on ${new Date().toLocaleDateString()}]`,
                        updated_at:new Date().toISOString()
                    }).eq('id', op.id);
                    await this.loadOperatives();
                    this.showNotification(`${op.username} Banned`, 'warning');
                } catch(e) {
                    this.showNotification('Ban Failed', 'error');
                } finally { this.isLoading = false; }
            },

            async deleteOperative(op) {
                if (!confirm(`PERMANENTLY DELETE ${op.username}?`)) return;
                this.isLoading = true;
                try {
                    await sb.from('profiles').delete().eq('id', op.id);
                    await this.loadOperatives();
                    this.editingOperative = false;
                    this.showNotification(`${op.username} Removed`, 'success');
                } catch(e) {
                    this.showNotification('Delete Failed', 'error');
                } finally { this.isLoading = false; }
            },

            async updateOperativeStats(op, stat, value) {
                try {
                    const newStats = { ...(op.stats||{}), [stat]: parseInt(value)||0 };
                    await sb.from('profiles').update({ stats: newStats }).eq('id', op.id);
                    const idx = this.operatives.findIndex(o => o.id === op.id);
                    if (idx > -1) this.operatives[idx].stats = newStats;
                    if (this.selectedOperative?.id === op.id) this.selectedOperative.stats = newStats;
                } catch(_) {}
            },

            /* ──────────────── CHAT ─────────────── */
            async sendChatMessage() {
                if (!this.chatInput.trim()) return;
                const msg = {
                    sender_id:   this.currentDirectorId,
                    sender_name: 'DIRECTOR',
                    content:     this.chatInput,
                    type:        'COMMAND',
                    created_at:  new Date().toISOString()
                };
                // Optimistic update
                this.chatMessages.push(msg);
                this.chatInput = '';
                try {
                    await sb.from('chat_messages').insert(msg);
                } catch(_) {}
                this.$nextTick(() => {
                    const el = document.getElementById('chatScroll');
                    if (el) el.scrollTop = el.scrollHeight;
                });
            },

            async deleteChatMessage(id) {
                try {
                    await sb.from('chat_messages').delete().eq('id', id);
                    this.chatMessages = this.chatMessages.filter(m => m.id !== id);
                } catch(_) {}
            },

            /* ──────────────── CONTENT ─────────────── */
            async postAnnouncement() {
                if (!this.newAnnouncement.title.trim() || !this.newAnnouncement.content.trim()) return;
                this.isLoading = true;
                try {
                    await sb.from('announcements').insert({
                        title:      this.newAnnouncement.title,
                        content:    this.newAnnouncement.content,
                        priority:   this.newAnnouncement.priority,
                        visible:    this.newAnnouncement.visible,
                        posted_by:  this.currentDirectorId,
                        created_at: new Date().toISOString()
                    });
                    this.newAnnouncement = { title:'', content:'', priority:'NORMAL', visible:true };
                    this.showNotification('Announcement Posted', 'success');
                } catch(e) {
                    this.showNotification('Post Failed', 'error');
                } finally { this.isLoading = false; }
            },

            async deleteMessage(id) {
                try {
                    await sb.from('messages').delete().eq('id', id);
                    this.allMessages = this.allMessages.filter(m => m.id !== id);
                    this.showNotification('Message Deleted', 'success');
                } catch(_) { this.showNotification('Delete Failed', 'error'); }
            },

            /* ──────────────── SYSTEM SETTINGS ─────────────── */
            loadSysSettings() {
                try {
                    const s = localStorage.getItem('sysSettings');
                    if (s) this.sysSettings = { ...this.sysSettings, ...JSON.parse(s) };
                } catch(_) {}
            },

            async saveSysSettings() {
                this.isLoading = true;
                try {
                    localStorage.setItem('sysSettings', JSON.stringify(this.sysSettings));
                    await sb.from('system_settings').upsert({
                        key: 'sysSettings',
                        value: JSON.stringify(this.sysSettings),
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'key' });
                    if (this.sysSettings.maintenanceMode) {
                        this.indexControl.isLocked    = true;
                        this.indexControl.alertStatus = 'SYSTEM MAINTENANCE';
                        await this.pushToIndex();
                    }
                    this.showNotification('Settings Saved', 'success');
                } catch(e) {
                    this.showNotification('Save Failed', 'error');
                } finally { this.isLoading = false; }
            },

            /* ──────────────── UTILS ─────────────── */
            startClock() {
                setInterval(() => {
                    this.currentTime = new Date().toLocaleTimeString('en-ZA',{hour12:false});
                    if (!this.sessionStart) return;
                    const d = Math.floor((Date.now()-this.sessionStart)/1000);
                    this.sessionDuration = [
                        Math.floor(d/3600), Math.floor((d%3600)/60), d%60
                    ].map(n=>String(n).padStart(2,'0')).join(':');
                }, 1000);
            },

            getOnlineStatus(ts) {
                if (!ts) return { label:'OFFLINE', dot:'dot-offline' };
                const m = (Date.now()-new Date(ts))/60000;
                if (m<5)    return { label:'LIVE',    dot:'dot-online'  };
                if (m<30)   return { label:'RECENT',  dot:'dot-warning' };
                if (m<1440) return { label:'TODAY',   dot:'dot-offline' };
                return           { label:'OFFLINE',  dot:'dot-offline' };
            },

            getRankBadge(rank) {
                return {
                    INITIATE:   'border-gray-600/40 text-gray-400',
                    AGENT:      'border-teal-600/50 text-teal-400',
                    OPERATIVE:  'border-teal-400/60 text-teal-300',
                    SPECIALIST: 'border-yellow-600/50 text-yellow-400',
                    DIRECTOR:   'border-yellow-400/70 text-yellow-300',
                    BANNED:     'border-red-700/60 text-red-400'
                }[rank] || 'border-gray-600/40 text-gray-400';
            },

            trendIcon(t) {
                return t==='up' ? '▲' : t==='down' ? '▼' : '—';
            },

            trendColor(t) {
                return t==='up' ? 'text-green-400' : t==='down' ? 'text-red-400' : 'text-gray-500';
            },

            timeAgo(ts) {
                if (!ts) return '—';
                const s = (Date.now()-new Date(ts))/1000;
                if (s<60)    return Math.floor(s)+'s ago';
                if (s<3600)  return Math.floor(s/60)+'m ago';
                if (s<86400) return Math.floor(s/3600)+'h ago';
                return Math.floor(s/86400)+'d ago';
            },

            showNotification(message, type='info') {
                const cfg = {
                    success:{ bg:'bg-green-950',  border:'border-green-600/60',  icon:'check-circle',   tc:'text-green-300'  },
                    error:  { bg:'bg-red-950',    border:'border-red-600/60',    icon:'alert-triangle', tc:'text-red-300'    },
                    warning:{ bg:'bg-yellow-950', border:'border-yellow-600/60', icon:'alert-circle',   tc:'text-yellow-300' },
                    info:   { bg:'bg-zinc-900',   border:'border-zinc-600/60',   icon:'info',           tc:'text-zinc-300'   }
                }[type]||{ bg:'bg-zinc-900',border:'border-zinc-600/60',icon:'info',tc:'text-zinc-300' };
                const t = document.createElement('div');
                t.className=`toast fixed top-10 right-5 z-[999999] ${cfg.bg} ${cfg.border} ${cfg.tc} translate-x-[120%]`;
                t.innerHTML=`<i data-lucide="${cfg.icon}" style="width:15px;height:15px;flex-shrink:0;"></i><span>${message.toUpperCase()}</span>`;
                document.body.appendChild(t); lucide.createIcons();
                requestAnimationFrame(()=>setTimeout(()=>t.style.transform='translateX(0)',30));
                setTimeout(()=>{ t.style.transform='translateX(120%)'; t.style.opacity='0'; setTimeout(()=>t.remove(),350); },4000);
            },

            async logout() {
                try { await sb.auth.signOut(); } catch(_) {}
                localStorage.removeItem('userRole');
                localStorage.removeItem('clearanceLevel');
                window.location.href = '/login.html';
            }
        };
    }
    </script>
</head>

<body x-data="commandCenter()" x-init="init()" x-cloak class="bg-black min-h-screen">

    <canvas id="binaryCanvas" aria-hidden="true"></canvas>
    <div class="seal-watermark" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="scanline" aria-hidden="true"></div>

    <!-- ══ LIVE TICKER BAR ═══════════════════════════════════════════ -->
    <template x-if="tickerActive && tickerMessages.length">
        <div class="ticker-bar">
            <div class="w-24 flex-shrink-0 flex items-center justify-center z-10" style="background:var(--red-dark);height:100%;border-right:1px solid rgba(220,38,38,0.5)">
                <span class="orbit text-[8px] font-black tracking-widest text-white uppercase">LIVE</span>
            </div>
            <div class="flex-1 overflow-hidden relative">
                <div class="ticker-track">
                    <template x-for="m in tickerMessages" :key="m.id||m.message">
                        <span>
                            <span class="ticker-text" x-text="m.message||m"></span>
                            <span class="ticker-sep">◆</span>
                        </span>
                    </template>
                    <!-- Duplicate for seamless loop -->
                    <template x-for="m in tickerMessages" :key="'dup-'+(m.id||m.message)">
                        <span>
                            <span class="ticker-text" x-text="m.message||m"></span>
                            <span class="ticker-sep">◆</span>
                        </span>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- ══ PROTOCOL ZERO LOCKDOWN OVERLAY ════════════════════════════ -->
    <template x-if="protocolZeroActive">
        <div class="lockdown-overlay">
            <div class="lockdown-overlay-border"></div>
            <div class="relative z-10 text-center space-y-6 px-8 max-w-lg">
                <!-- Rotating seal -->
                <div class="mx-auto w-24 h-24 relative">
                    <div class="seal-ring"></div>
                    <div class="seal-ring-2"></div>
                    <div class="w-24 h-24 rounded-full flex items-center justify-center" style="border:2px solid rgba(220,38,38,0.6);background:rgba(220,38,38,0.06)">
                        <img src="/assets/images/1000219947.png" alt="Seal" class="w-16 h-16 object-contain lockdown-skull" style="filter:drop-shadow(0 0 20px var(--red))">
                    </div>
                </div>
                <!-- Title -->
                <div>
                    <p class="orbit text-[10px] uppercase tracking-[0.6em] text-red-500 mb-2">Ministry of Groove</p>
                    <h2 class="orbit text-3xl font-black uppercase" style="color:var(--red);text-shadow:0 0 30px var(--red-glow)">SYSTEM LOCKDOWN</h2>
                    <p class="mono text-xs uppercase tracking-widest mt-2 text-gray-500">Protocol Zero — Initiated by Directorate Command</p>
                </div>
                <div class="gold-line" style="opacity:0.3"></div>
                <p class="mono text-sm text-gray-400 uppercase tracking-wider">All operative terminals have been frozen.<br>Awaiting Director authorization to resume.</p>
                <!-- Director override -->

                                            <span class="mono text-xs text-gray-400 uppercase tracking-wider">Visible to Operatives</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <button @click="postAnnouncement()" :disabled="isLoading||!newAnnouncement.title.trim()||!newAnnouncement.content.trim()"
                                    class="btn btn-gold px-7 py-2.5 rounded-xl text-xs uppercase font-bold tracking-wider flex items-center gap-2">
                                <i data-lucide="send" class="w-3.5 h-3.5"></i>Post Announcement
                            </button>
                        </div>

                        <div class="glass-dark rounded-[2rem] p-6" style="border-color:rgba(212,175,55,0.1)">
                            <div class="flex items-center justify-between mb-5">
                                <h4 class="orbit text-[9px] uppercase tracking-widest font-bold text-gold flex items-center gap-2">
                                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i>
                                    Message Moderation
                                    <span class="ml-1 mono text-gray-600" x-text="allMessages.length"></span>
                                </h4>
                                <button @click="loadMessages()" class="mono text-[9px] uppercase text-gray-600 hover:text-gold transition-colors">Refresh</button>
                            </div>
                            <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                                <template x-if="allMessages.length===0">
                                    <p class="mono text-xs text-gray-700 text-center py-6 uppercase tracking-widest">No messages</p>
                                </template>
                                <template x-for="msg in allMessages" :key="msg.id">
                                    <div class="row-hover flex items-start gap-3 p-3.5 rounded-xl" style="background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.05)">
                                        <div class="flex-1 min-w-0">
                                            <p class="text-sm text-white/85 leading-snug" x-text="msg.content||msg.message||'[no content]'"></p>
                                            <p class="mono text-[9px] text-gray-600 mt-0.5" x-text="timeAgo(msg.created_at)"></p>
                                        </div>
                                        <button @click="deleteMessage(msg.id)" class="p-1.5 rounded-lg hover:bg-red-900/30 text-red-700 hover:text-red-400 transition-colors flex-shrink-0">
                                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- ▸ ACTIVITY TAB ────────────────────────────── -->
                    <div x-show="activeTab==='activity'" class="space-y-5">
                        <div class="glass-dark rounded-[2rem] p-6" style="border-color:rgba(212,175,55,0.1)">
                            <div class="flex items-center justify-between mb-5">
                                <h4 class="orbit text-[9px] uppercase tracking-widest font-bold text-gold flex items-center gap-2">
                                    <i data-lucide="terminal" class="w-3.5 h-3.5"></i>Live Activity Stream
                                </h4>
                                <button @click="loadActivity()" class="mono text-[9px] uppercase text-gray-600 hover:text-gold transition-colors flex items-center gap-1">
                                    <i data-lucide="refresh-cw" class="w-3 h-3"></i>Refresh
                                </button>
                            </div>
                            <div class="space-y-2 max-h-[560px] overflow-y-auto pr-1">
                                <template x-if="liveActivity.length===0">
                                    <div class="text-center py-12 mono text-xs text-gray-700 uppercase tracking-widest">No active signals</div>
                                </template>
                                <template x-for="(act,i) in liveActivity" :key="act.id||i">
                                    <div class="row-hover flex items-center gap-3 p-3.5 rounded-xl" style="background:rgba(0,0,0,0.45);border:1px solid rgba(255,255,255,0.04)">
                                        <div class="w-1.5 h-1.5 rounded-full flex-shrink-0 dot-online dot-pulse"></div>
                                        <div class="flex-1 min-w-0">
                                            <p class="mono text-sm text-white/85 truncate" x-text="act.description||act.content||act.message||'Encrypted Transmission'"></p>
                                            <p class="mono text-[9px] text-gray-600 mt-0.5" x-text="timeAgo(act.created_at)"></p>
                                        </div>
                                        <span class="mono text-[9px] px-2 py-1 rounded-lg flex-shrink-0 text-gold" style="background:rgba(212,175,55,0.07);border:1px solid rgba(212,175,55,0.18)" x-text="(act.type||'LOG').replace(/_/g,' ')"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- ▸ SETTINGS TAB ───────────────────────────── -->
                    <div x-show="activeTab==='settings'" class="space-y-5">
                        <div class="glass-gold rounded-[2rem] p-6" style="border-color:rgba(212,175,55,0.25)">
                            <h4 class="orbit text-[9px] uppercase tracking-widest font-bold mb-6 text-gold flex items-center gap-2">
                                <i data-lucide="settings" class="w-3.5 h-3.5"></i>System Configuration
                            </h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                                <div>
                                    <label class="mono text-[9px] uppercase tracking-widest text-gray-500 block mb-1">Site Name</label>
                                    <input type="text" x-model="sysSettings.siteName" class="input-dir px-4 py-2.5 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="mono text-[9px] uppercase tracking-widest text-gray-500 block mb-1">Tagline</label>
                                    <input type="text" x-model="sysSettings.siteTagline" class="input-dir px-4 py-2.5 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="mono text-[9px] uppercase tracking-widest text-gray-500 block mb-1">Contact Email</label>
                                    <input type="email" x-model="sysSettings.contactEmail" class="input-dir px-4 py-2.5 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="mono text-[9px] uppercase tracking-widest text-gray-500 block mb-1">WhatsApp</label>
                                    <input type="text" x-model="sysSettings.whatsapp" class="input-dir px-4 py-2.5 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="mono text-[9px] uppercase tracking-widest text-gray-500 block mb-1">Max Operatives</label>
                                    <input type="number" x-model="sysSettings.maxOperatives" class="input-dir px-4 py-2.5 rounded-xl text-sm">
                                </div>
                            </div>
                            <div class="space-y-3 mb-6">
                                <div class="flex items-center justify-between p-4 rounded-xl" style="background:rgba(0,0,0,0.5);border:1px solid rgba(212,175,55,0.1)">
                                    <div>
                                        <p class="orbit text-xs font-bold uppercase text-white">Maintenance Mode</p>
                                        <p class="mono text-[9px] text-gray-500 uppercase mt-0.5">Locks all users out except Director</p>
                                    </div>
                                    <div class="perm-toggle" :class="sysSettings.maintenanceMode?'on':''" @click="sysSettings.maintenanceMode=!sysSettings.maintenanceMode"></div>
                                </div>
                                <div class="flex items-center justify-between p-4 rounded-xl" style="background:rgba(0,0,0,0.5);border:1px solid rgba(212,175,55,0.1)">
                                    <div>
                                        <p class="orbit text-xs font-bold uppercase text-white">Registration Open</p>
                                        <p class="mono text-[9px] text-gray-500 uppercase mt-0.5">Allow new operatives to enlist</p>
                                    </div>
                                    <div class="perm-toggle" :class="sysSettings.registrationOpen?'on':''" @click="sysSettings.registrationOpen=!sysSettings.registrationOpen"></div>
                                </div>
                            </div>
                            <button @click="saveSysSettings()" :disabled="isLoading"
                                    class="btn btn-gold px-8 py-3 rounded-xl text-xs uppercase font-bold tracking-wider flex items-center gap-2">
                                <i data-lucide="save" class="w-3.5 h-3.5"></i>
                                <span x-text="isLoading?'Saving...':'Save Settings'"></span>
                            </button>
                        </div>

                        <!-- Danger zone -->
                        <div class="glass-red rounded-[2rem] p-6 lockdown-pulse" style="border-color:rgba(220,38,38,0.5)">
                            <h4 class="orbit text-[9px] uppercase tracking-widest font-bold mb-5 text-red-glow flex items-center gap-2">
                                <i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>Danger Zone
                            </h4>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between p-4 rounded-xl" style="background:rgba(0,0,0,0.6);border:1px solid rgba(220,38,38,0.2)">
                                    <div>
                                        <p class="orbit text-xs font-bold uppercase text-white">Purge All Directives</p>
                                        <p class="mono text-[9px] text-gray-500 uppercase mt-0.5">Remove all active directives from DB</p>
                                    </div>
                                    <button @click="if(confirm('Purge ALL directives?')){sb.from('directives').delete().neq('id','00000000-0000-0000-0000-000000000000').then(()=>{recentDirectives=[];showNotification('Directives Purged','warning')})}"
                                            class="btn btn-red px-4 py-2 rounded-xl text-xs uppercase font-bold tracking-wider">Purge</button>
                                </div>
                                <div class="flex items-center justify-between p-4 rounded-xl" style="background:rgba(0,0,0,0.6);border:1px solid rgba(220,38,38,0.2)">
                                    <div>
                                        <p class="orbit text-xs font-bold uppercase text-white">Clear Activity Log</p>
                                        <p class="mono text-[9px] text-gray-500 uppercase mt-0.5">Wipe the activity_log table</p>
                                    </div>
                                    <button @click="if(confirm('Clear ALL activity logs?')){sb.from('activity_log').delete().neq('id','00000000-0000-0000-0000-000000000000').then(()=>{liveActivity=[];showNotification('Logs Cleared','warning')})}"
                                            class="btn btn-red px-4 py-2 rounded-xl text-xs uppercase font-bold tracking-wider">Clear</button>
                                </div>
                                <div class="flex items-center justify-between p-4 rounded-xl" style="background:rgba(0,0,0,0.6);border:1px solid rgba(220,38,38,0.2)">
                                    <div>
                                        <p class="orbit text-xs font-bold uppercase text-white">Clear Ticker Feed</p>
                                        <p class="mono text-[9px] text-gray-500 uppercase mt-0.5">Remove all active ticker broadcasts</p>
                                    </div>
                                    <button @click="clearTicker()"
                                            class="btn btn-red px-4 py-2 rounded-xl text-xs uppercase font-bold tracking-wider">Clear</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div><!-- /main panel -->
            </div><!-- /grid -->

            <!-- Footer -->
            <footer class="mt-10 pb-8 text-center">
                <div class="gold-line mb-4" style="opacity:0.2"></div>
                <div class="flex items-center justify-center gap-3 mb-2">
                    <img src="/assets/images/1000219947.png" alt="Seal" class="w-7 h-7 object-contain opacity-25">
                    <span class="orbit text-xs text-gold tracking-[0.25em] font-black" style="opacity:0.4">DIRECTORATE HQ</span>
                </div>
                <p class="slogan-text mb-1">Decrypting the Culture. Synchronizing the Grid.</p>
                <p class="mono text-[9px] uppercase tracking-[0.3em] text-gray-700">The Ministry of Groove // Emalahleni Uplink II // Est. 2026</p>
                <p class="mono text-[8px] uppercase tracking-widest mt-1" style="color:var(--red-dark)">[Sector 7G] // Authorized Personnel Only</p>
            </footer>

        </div>
    </template>

    <!-- Binary rain canvas -->
    <script>
    (function(){
        const c = document.getElementById('binaryCanvas');
        if (!c) return;
        const ctx = c.getContext('2d');
        function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        const cols=Math.floor(window.innerWidth/18), drops=Array(cols).fill(1);
        function draw(){
            ctx.fillStyle='rgba(0,0,0,0.06)'; ctx.fillRect(0,0,c.width,c.height);
            ctx.fillStyle='#d4af37'; ctx.font='13px monospace';
            for(let i=0;i<drops.length;i++){
                ctx.fillText(Math.random()>.5?'1':'0',i*18,drops[i]*18);
                if(drops[i]*18>c.height&&Math.random()>.975)drops[i]=0;
                drops[i]++;
            }
        }
        setInterval(draw,55);
    })();
    </script>
</body>
</html>
