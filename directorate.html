<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>DIRECTORATE HQ | M.O.G. MASTER COMMAND</title>

    <!-- Supabase — loaded first, before Alpine -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --black:       #000000;
            --surface:     #060a07;
            --gold:        #d4af37;
            --gold-bright: #f0c040;
            --gold-dark:   #8b6914;
            --gold-glow:   rgba(212,175,55,0.4);
            --red:         #dc2626;
            --red-dark:    #991b1b;
            --red-glow:    rgba(220,38,38,0.4);
            --teal:        #00d4aa;
            --teal-dim:    #006e59;
            --teal-glow:   rgba(0,212,170,0.3);
            --text:        #e8e0cc;

            --text-xs:  clamp(0.6rem,  1.5vw, 0.72rem);
            --text-sm:  clamp(0.72rem, 2vw,   0.875rem);
            --text-base:clamp(0.875rem,2.5vw, 1rem);
            --text-lg:  clamp(1rem,    3vw,   1.25rem);
            --text-xl:  clamp(1.1rem,  4vw,   1.5rem);
            --text-2xl: clamp(1.25rem, 5vw,   1.875rem);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mono  { font-family: 'Share Tech Mono', monospace; }
        .orbit { font-family: 'Orbitron', sans-serif; }

        button, a { touch-action: manipulation; }

        /* ── Background ── */
        .bg-seal {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: clamp(300px, 70vmin, 700px);
            height: clamp(300px, 70vmin, 700px);
            background: url('/assets/images/logo.png') center/contain no-repeat;
            opacity: 0.04; pointer-events: none; z-index: 0;
            filter: drop-shadow(0 0 60px rgba(212,175,55,0.1));
        }
        .bg-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background-image:
                linear-gradient(rgba(220,38,38,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220,38,38,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        @media (max-width:480px){ .bg-grid { display:none; } }
        .bg-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
        }
        .scanline {
            position: fixed; top: -80px; left: 0; width: 100%; height: 80px;
            z-index: 3; pointer-events: none;
            background: linear-gradient(transparent, rgba(220,38,38,0.03) 50%, transparent);
            animation: scanline 12s linear infinite;
        }
        @media (max-width:640px){ .scanline { display:none; } }
        @keyframes scanline { to { top: 100vh; } }

        /* ── Glass cards ── */
        .glass-red {
            background: rgba(12,3,3,0.92);
            border: 1px solid rgba(220,38,38,0.22);
            box-shadow: 0 4px 32px rgba(0,0,0,0.5);
        }
        .glass-gold {
            background: rgba(12,9,2,0.93);
            border: 1px solid rgba(212,175,55,0.24);
            box-shadow: 0 4px 32px rgba(0,0,0,0.5);
        }
        .glass-dark {
            background: rgba(4,7,5,0.96);
            border: 1px solid rgba(212,175,55,0.1);
        }
        .glass-teal {
            background: rgba(0,16,12,0.93);
            border: 1px solid rgba(0,212,170,0.2);
        }
        @media (min-width:641px){
            .glass-red,.glass-gold,.glass-dark,.glass-teal {
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
            }
        }

        /* ── Typography helpers ── */
        .text-gold  { color: var(--gold);  text-shadow: 0 0 12px var(--gold-glow); }
        .text-red   { color: var(--red);   text-shadow: 0 0 12px var(--red-glow);  }
        .text-teal  { color: var(--teal);  text-shadow: 0 0 10px var(--teal-glow); }

        /* ── Divider ── */
        .gold-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold), var(--red-dark), transparent);
        }

        /* ── Buttons ── */
        .btn {
            position: relative; overflow: hidden;
            transition: all 0.24s ease; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transform: translateX(-100%); transition: transform 0.5s ease;
        }
        @media (hover:hover) {
            .btn:hover::after { transform: translateX(100%); }
            .btn:hover { transform: translateY(-1px); }
        }
        .btn:active { transform: scale(0.97) !important; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

        .btn-red  { background: linear-gradient(135deg,rgba(220,38,38,0.14),rgba(153,27,27,0.25)); border:1px solid rgba(220,38,38,0.4); color:#fca5a5; }
        .btn-red:hover  { background: linear-gradient(135deg,rgba(220,38,38,0.28),rgba(153,27,27,0.4)); border-color:var(--gold); box-shadow:0 0 20px var(--red-glow); color:#fff; }
        .btn-gold { background: linear-gradient(135deg,rgba(212,175,55,0.1),rgba(139,105,20,0.2)); border:1px solid rgba(212,175,55,0.38); color:var(--gold); }
        .btn-gold:hover { background: linear-gradient(135deg,rgba(212,175,55,0.22),rgba(139,105,20,0.35)); border-color:var(--gold-bright); box-shadow:0 0 20px var(--gold-glow); }
        .btn-green{ background: linear-gradient(135deg,rgba(22,163,74,0.13),rgba(21,128,61,0.22)); border:1px solid rgba(22,163,74,0.38); color:#86efac; }
        .btn-green:hover{ background: linear-gradient(135deg,rgba(22,163,74,0.25),rgba(21,128,61,0.38)); border-color:#4ade80; box-shadow:0 0 18px rgba(22,163,74,0.28); }
        .btn-teal { background: linear-gradient(135deg,rgba(0,212,170,0.1),rgba(0,110,89,0.2)); border:1px solid rgba(0,212,170,0.38); color:var(--teal); }
        .btn-teal:hover { background: linear-gradient(135deg,rgba(0,212,170,0.22),rgba(0,110,89,0.35)); border-color:var(--teal); box-shadow:0 0 20px var(--teal-glow); }

        /* ── Inputs ── */
        .inp {
            background: rgba(0,0,0,0.7); border: 1px solid rgba(220,38,38,0.2);
            color: var(--text); font-family: 'Share Tech Mono', monospace;
            font-size: max(16px, var(--text-sm));
            transition: border-color 0.2s, box-shadow 0.2s; width: 100%;
            border-radius: 0.75rem; padding: 0.65rem 0.9rem;
        }
        .inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.06); outline: none; }
        .inp::placeholder { color: rgba(255,255,255,0.18); }
        .inp:disabled { opacity: 0.4; cursor: not-allowed; }
        select.inp option { background: #060a07; color: var(--text); }

        /* ── Status dots ── */
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot-online  { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .dot-warning { background: #eab308; box-shadow: 0 0 8px #eab308; }
        .dot-offline { background: #4b5563; }
        .dot-red     { background: var(--red); box-shadow: 0 0 8px var(--red); }
        .dot-pulse   { animation: dotPulse 2s ease-in-out infinite; }
        @keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── Tab bar ── */
        .tab-btn {
            padding: 0.55rem 1rem; border-radius: 999px;
            border: 1px solid rgba(212,175,55,0.15);
            color: #6b7280; font-family: 'Orbitron', sans-serif;
            font-size: var(--text-xs); font-weight: 700;
            letter-spacing: 0.08em; text-transform: uppercase;
            cursor: pointer; white-space: nowrap;
            transition: all 0.2s ease; background: transparent;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .tab-btn.active {
            background: rgba(220,38,38,0.15);
            border-color: rgba(220,38,38,0.5);
            color: #fca5a5;
            box-shadow: 0 0 12px rgba(220,38,38,0.15);
        }
        .tab-btn:not(.active):hover { border-color: rgba(212,175,55,0.3); color: #9ca3af; }
        .tab-btn svg { width: 12px; height: 12px; flex-shrink: 0; }

        /* ── Card rows ── */
        .row-item {
            border: 1px solid rgba(212,175,55,0.07);
            border-radius: 0.875rem;
            background: rgba(0,0,0,0.45);
            transition: border-color 0.2s, background 0.2s;
        }
        @media (hover:hover) {
            .row-item:hover { border-color: rgba(212,175,55,0.25); background: rgba(212,175,55,0.03); }
        }

        /* ── Op cards ── */
        .op-card {
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 1rem; background: rgba(0,0,0,0.5);
            cursor: pointer; transition: all 0.2s ease;
        }
        @media (hover:hover) {
            .op-card:hover { border-color: rgba(220,38,38,0.35); transform: translateY(-1px); }
        }
        .op-card:active { transform: scale(0.98); }

        /* ── Rank badge ── */
        .rank-chip {
            border-radius: 999px; padding: 2px 9px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.58rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
            border: 1px solid;
        }

        /* ── Toggle switch ── */
        .toggle {
            width: 44px; height: 24px; border-radius: 12px;
            border: 1px solid rgba(212,175,55,0.3);
            background: rgba(0,0,0,0.6); cursor: pointer;
            position: relative; transition: all 0.3s ease; flex-shrink: 0;
        }
        .toggle.on { background: rgba(22,163,74,0.28); border-color: rgba(22,163,74,0.5); box-shadow: 0 0 10px rgba(22,163,74,0.25); }
        .toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--gold-dark); transition: all 0.3s ease;
        }
        .toggle.on::after { left: 23px; background: #4ade80; }

        /* ── Animations ── */
        .fade-up { animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

        .dot-blink span { animation: blink 1.3s infinite; }
        .dot-blink span:nth-child(2){animation-delay:.2s}
        .dot-blink span:nth-child(3){animation-delay:.4s}
        @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

        @keyframes spin { to{transform:rotate(360deg)} }
        .spin-anim { animation: spin 1.2s linear infinite; }

        /* ── Lockdown pulse ── */
        .lockdown-pulse { animation: lockPulse 1.8s ease-in-out infinite; }
        @keyframes lockPulse {
            0%,100%{ border-color:rgba(220,38,38,0.4); }
            50%{ border-color:rgba(220,38,38,0.9); box-shadow:0 0 24px var(--red-glow); }
        }

        /* ── Proto Zero overlay ── */
        .pz-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.98);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 2rem;
        }
        .pz-border {
            position: absolute; inset: 12px; border-radius: 20px;
            border: 2px solid var(--red); pointer-events: none;
            animation: lockPulse 1.2s ease-in-out infinite;
        }

        /* ── Ticker bar ── */
        .ticker-bar {
            height: 26px; overflow: hidden;
            background: linear-gradient(90deg, rgba(153,27,27,0.8), rgba(0,0,0,0.9), rgba(153,27,27,0.8));
            border-bottom: 1px solid rgba(220,38,38,0.3);
            display: flex; align-items: center;
        }
        .ticker-label {
            width: 56px; flex-shrink: 0; height: 100%;
            background: var(--red); display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 900;
            color: #fff; letter-spacing: 0.2em; border-right: 1px solid rgba(255,255,255,0.1);
        }
        .ticker-track {
            display: flex; white-space: nowrap;
            animation: tickerMove 25s linear infinite;
        }
        @keyframes tickerMove { 0%{transform:translateX(100vw)} 100%{transform:translateX(-100%)} }
        .ticker-text {
            font-family: 'Orbitron', sans-serif; font-size: 8px; font-weight: 700;
            letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase;
        }
        .ticker-sep { color: rgba(220,38,38,0.6); margin: 0 16px; }

        /* ── Piano chart bar ── */
        .piano-bar { height: 3px; background: rgba(0,0,0,0.7); border-radius: 99px; overflow: hidden; margin-top: 4px; }
        .piano-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,var(--teal),var(--gold)); box-shadow: 0 0 6px var(--teal-glow); transition: width 1.2s cubic-bezier(0.34,1.56,0.64,1); }

        /* ── Popularity bar ── */
        .pop-bar { height: 4px; background: rgba(0,0,0,0.6); border-radius: 99px; overflow: hidden; }
        .pop-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,var(--gold-dark),var(--gold-bright)); box-shadow: 0 0 6px var(--gold-glow); transition: width 1.4s cubic-bezier(0.34,1.56,0.64,1); }

        /* ── Stat bar ── */
        .stat-bar { height: 3px; background: rgba(0,0,0,0.8); border-radius: 99px; overflow: hidden; }
        .stat-fill-gold { height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-dark),var(--gold-bright));box-shadow:0 0 6px var(--gold-glow);transition:width 1.4s cubic-bezier(0.34,1.56,0.64,1); }
        .stat-fill-red  { height:100%;border-radius:99px;background:linear-gradient(90deg,var(--red-dark),var(--red));box-shadow:0 0 6px var(--red-glow);transition:width 1.4s cubic-bezier(0.34,1.56,0.64,1); }

        /* ── Chat bubbles ── */
        .chat-director  { align-self:flex-end;  background:rgba(220,38,38,0.12); border:1px solid rgba(220,38,38,0.25); border-radius:14px 14px 3px 14px; }
        .chat-operative { align-self:flex-start; background:rgba(212,175,55,0.07); border:1px solid rgba(212,175,55,0.15); border-radius:14px 14px 14px 3px; }

        /* ── Gallery thumb ── */
        .gallery-thumb { aspect-ratio:16/9; border-radius:10px; overflow:hidden; position:relative; cursor:pointer; }
        .gallery-thumb img,.gallery-thumb video { width:100%;height:100%;object-fit:cover;transition:transform 0.35s ease; }
        @media (hover:hover){ .gallery-thumb:hover img,.gallery-thumb:hover video { transform:scale(1.05); } }
        .gallery-thumb .thumb-overlay { position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.8));opacity:0;transition:opacity 0.25s; }
        @media (hover:hover){ .gallery-thumb:hover .thumb-overlay { opacity:1; } }

        /* ── Slogan ── */
        .slogan { font-family:'Orbitron',sans-serif;font-size:clamp(0.44rem,1.1vw,0.56rem);letter-spacing:0.28em;color:var(--teal);opacity:0.55;text-transform:uppercase; }

        /* ── Toast ── */
        .toast {
            font-family:'Orbitron',sans-serif;font-weight:700;font-size:0.65rem;
            letter-spacing:0.1em;text-transform:uppercase;
            border-radius:12px;padding:12px 16px;
            box-shadow:0 8px 32px rgba(0,0,0,0.8);
            display:flex;align-items:center;gap:8px;
            border-width:1px;border-style:solid;
            transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s ease;
            max-width:min(90vw,360px);
        }

        /* ── System status panel ── */
        .sys-node {
            padding: 0.6rem 0.9rem; border-radius: 0.75rem;
            border: 1px solid rgba(212,175,55,0.1);
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }

        /* ── Mobile bottom nav ── */
        .bottom-nav { display:none; }
        @media (max-width:767px){
            .bottom-nav { display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(0,0,0,0.97);border-top:1px solid rgba(212,175,55,0.12);padding-bottom:env(safe-area-inset-bottom,0); }
            main { padding-bottom:80px !important; }
        }

        /* scrollbar */
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:rgba(0,0,0,0.6); }
        ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--gold-dark),var(--red-dark)); border-radius:4px; }

        @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important} }
    </style>
</head>

<body x-data="directorate()" x-init="boot()" class="bg-black">

<!-- Background layers -->
<div class="bg-seal" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>

<!-- ══ PROTOCOL ZERO OVERLAY ══════════════════════════════════ -->
<template x-if="pzActive">
<div class="pz-overlay fade-up">
    <div class="pz-border"></div>
    <div class="relative z-10 flex flex-col items-center gap-5 max-w-md">
        <img src="/assets/images/logo.png" alt="Seal" style="width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 0 20px var(--red)) drop-shadow(0 0 40px rgba(220,38,38,0.3))">
        <p class="orbit text-xs tracking-widest" style="color:var(--red-dark);letter-spacing:0.4em">Protocol Zero Active</p>
        <h2 class="orbit font-black text-2xl md:text-3xl uppercase text-center" style="color:var(--red);text-shadow:0 0 30px var(--red-glow)">SYSTEM LOCKDOWN</h2>
        <div class="gold-line w-40" style="opacity:0.3"></div>
        <p class="mono text-sm text-center" style="color:rgba(255,255,255,0.45)">All operative terminals frozen.<br>Director authorization required to resume.</p>
        <button @click="standDown()" class="btn btn-gold px-8 py-3 rounded-full text-xs font-black tracking-widest" style="font-family:'Orbitron',sans-serif">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Director Override — Stand Down
        </button>
    </div>
</div>
</template>

<!-- ══ BOOT GATE ════════════════════════════════════════════ -->
<template x-if="view==='gate'">
<div class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-black">
    <div class="relative" style="width:64px;height:64px">
        <div class="absolute inset-0 rounded-full border-2 border-transparent" style="border-top-color:var(--gold);animation:spin 1.2s linear infinite"></div>
        <div class="absolute inset-0 rounded-full border border-transparent" style="border-bottom-color:var(--teal);animation:spin 1.8s linear infinite reverse"></div>
        <div class="absolute inset-0 flex items-center justify-center">
            <img src="/assets/images/logo.png" alt="" style="width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 10px var(--gold-glow))">
        </div>
    </div>
    <div class="text-center space-y-2">
        <p class="orbit text-xs tracking-widest text-gold">
            Establishing Uplink
            <span class="dot-blink"><span>.</span><span>.</span><span>.</span></span>
        </p>
        <p class="slogan">Decrypting the Culture. Synchronizing the Grid.</p>
    </div>
</div>
</template>

<!-- ══ AUTH DENIED ════════════════════════════════════════ -->
<template x-if="view==='denied'">
<div class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-5 bg-black text-center px-4">
    <div style="width:64px;height:64px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px var(--red-glow)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
    <p class="orbit text-sm font-black tracking-widest" style="color:var(--red)">Insufficient Clearance</p>
    <p class="mono text-xs text-gray-600 tracking-widest uppercase">Access Denied — Redirecting</p>
</div>
</template>

<!-- ══ MAIN HQ VIEW ══════════════════════════════════════ -->
<template x-if="view==='active'">
<div class="relative z-10 fade-up">

    <!-- LIVE TICKER -->
    <template x-if="ticker.active && ticker.messages.length">
    <div class="ticker-bar sticky top-0 z-50">
        <div class="ticker-label">LIVE</div>
        <div style="flex:1;overflow:hidden">
            <div class="ticker-track">
                <template x-for="m in ticker.messages" :key="m.id||m">
                    <span><span class="ticker-text" x-text="m.message||m"></span><span class="ticker-sep">◆</span></span>
                </template>
                <template x-for="m in ticker.messages" :key="'d'+(m.id||m)">

        /* ── Computed ── */
        get filteredOps() {
            if (!this.opFilter) return this.operatives;
            const q = this.opFilter.toLowerCase();
            return this.operatives.filter(o =>
                (o.username||'').toLowerCase().includes(q) ||
                (o.codename||'').toLowerCase().includes(q) ||
                (o.rank||'').toLowerCase().includes(q) ||
                (o.department||'').toLowerCase().includes(q)
            );
        },

        /* ════════════════ BOOT ════════════════ */
        async boot() {
            /* 1. Auth check via localStorage (set by index.html on login) */
            const role      = localStorage.getItem('userRole');
            const clearance = localStorage.getItem('clearanceLevel');
            if (role !== 'director' && clearance !== 'ALPHA') {
                this.view = 'denied';
                setTimeout(() => { window.location.href = '/login.html'; }, 2500);
                return;
            }

            /* 2. Wait for Supabase */
            let tries = 0;
            while (!this._sb() && tries < 40) {
                await new Promise(r => setTimeout(r, 100)); tries++;
            }
            if (!this._sb()) {
                this.toast('Supabase unavailable — check /js/supabase-client.js', 'error');
                this.view = 'denied';
                return;
            }

            /* 3. Verify active session */
            try {
                const { data:{ session } } = await this._sb().auth.getSession();
                if (!session) { window.location.href = '/login.html'; return; }
                this.currentUserId = session.user.id;

                /* 4. DB rank double-check (non-blocking — don't block UI on failure) */
                try {
                    const { data: prof } = await this._sb()
                        .from('profiles').select('rank').eq('id', session.user.id).single();
                    if (prof && prof.rank !== 'DIRECTOR') {
                        this.view = 'denied';
                        setTimeout(() => { window.location.href = '/login.html'; }, 2500);
                        return;
                    }
                } catch(_) { /* profiles table may not have rank col yet — allow through */ }

            } catch(e) {
                window.location.href = '/login.html'; return;
            }

            /* 5. Ready */
            this.view = 'active';
            this._sessionStart = Date.now();
            // Load real state from DB FIRST — never from localStorage
            await this.loadSysConfig();
            this.seedGallery();
            this.startClock();
            await this.loadAll();
            this.startPoller();
        },

        /* ── Safe Supabase getter ── */
        _sb() { return window.sb || window.supabaseClient || null; },

        /* ── Load everything ── */
        async loadAll() {
            this.loading = true;
            await Promise.allSettled([
                this.loadOperatives(),
                this.loadDirectives(),
                this.loadActivity(),
                this.loadMessages(),
                this.loadComms(),
                this.loadTicker(),
                this.loadIntel(),
            ]);
            this.lastSync = new Date().toISOString();
            this.loading = false;
        },

        async loadOperatives() {
            try {
                const { data } = await this._sb().from('profiles')
                    .select('id,username,codename,rank,department,avatar_url,last_active,bio,stats')
                    .order('last_active', { ascending:false });
                this.operatives = data || [];
                this.stats.operatives = this.operatives.length;
                this.stats.active = this.operatives.filter(o => {
                    return o.last_active && (Date.now()-new Date(o.last_active))/60000 < 30;
                }).length;
            } catch(_) { this.operatives = []; }
        },

        async loadDirectives() {
            try {
                const { data } = await this._sb().from('directives')
                    .select('*').order('timestamp', { ascending:false }).limit(15);
                this.directives = data || [];
                this.stats.directives = this.directives.length;
            } catch(_) { this.directives = []; }
        },

        async loadActivity() {
            try {
                const { data } = await this._sb().from('activity_log')
                    .select('*').order('created_at', { ascending:false }).limit(40);
                this.activity = data || [];
            } catch(_) { this.activity = []; }
        },

        async loadMessages() {
            try {
                const { data } = await this._sb().from('messages')
                    .select('*').order('created_at', { ascending:false }).limit(25);
                this.messages = data || [];
            } catch(_) { this.messages = []; }
        },

        async loadComms() {
            try {
                const { data } = await this._sb().from('chat_messages')
                    .select('*').order('created_at', { ascending:false }).limit(50);
                this.comms = (data || []).reverse();
                this.$nextTick(() => {
                    const el = document.getElementById('chatScroll');
                    if (el) el.scrollTop = el.scrollHeight;
                });
            } catch(_) { this.comms = []; }
        },

        async loadTicker() {
            try {
                /* Check system_settings key first */
                const { data: ss } = await this._sb().from('system_settings')
                    .select('value').eq('key','tickerBroadcast').single();
                if (ss?.value) {
                    const p = JSON.parse(ss.value);
                    if (p.message) { this.ticker.messages = [{ message:p.message, id:'ss' }]; this.ticker.active = true; return; }
                }
                /* Fallback: ticker_messages table */
                const { data } = await this._sb().from('ticker_messages')
                    .select('*').eq('active', true).order('created_at', { ascending:false }).limit(5);
                this.ticker.messages = data || [];
                this.ticker.active = this.ticker.messages.length > 0;
            } catch(_) { this.ticker.messages = []; this.ticker.active = false; }
        },

        async loadIntel() {
            try {
                const { data } = await this._sb().from('media_likes')
                    .select('media_id, title, count').order('count', { ascending:false }).limit(8);
                if (data && data.length) {
                    const max = data[0].count || 1;
                    this.intel.popularity = data.map(d => ({ ...d, pct: Math.round((d.count/max)*100) }));
                }
            } catch(_) { /* media_likes may not exist yet — no-op */ }

        /* ════════════════ INDEX.HTML SYNC ════════════════ */
        syncFromStorage() {
            // Never trust localStorage for locked state — always use DB as truth.
            // Only sync non-security display values (bannerText, alertStatus).
            try {
                const s = localStorage.getItem('ministrySettings');
                if (s) {
                    const p = JSON.parse(s);
                    // Explicitly exclude locked — it can only come from DB
                    if (p.bannerText  !== undefined) this.net.bannerText  = p.bannerText;
                    if (p.alertStatus !== undefined) this.net.alertStatus = p.alertStatus;
                    // Never: this.net.locked = p.locked
                }
            } catch(_) {}
        },

        // Load real net state from DB — called on boot before anything else
        async loadSysConfig() {
            try {
                const { data } = await this._sb().from('system_settings')
                    .select('key,value')
                    .in('key', ['ministrySettings','protocolZero']);
                if (!data) return;
                data.forEach(row => {
                    try {
                        const p = JSON.parse(row.value);
                        if (row.key === 'ministrySettings') {
                            // Only apply lock state from DB, not from localStorage
                            this.net.locked      = p.isLocked === true || p.locked === true;
                            this.net.alertStatus = p.alertStatus || 'ALL CLEAR';
                            this.net.bannerText  = p.bannerText  || 'THE MINISTRY OF GROOVE';
                        }
                        if (row.key === 'protocolZero') {
                            this.pzActive = p.active === true;
                            if (p.active === true) this.net.locked = true;
                        }
                    } catch(_) {}
                });
            } catch(_) {}
        },

        async pushToIndex() {
            // Always write isLocked (not locked) — index.html reads isLocked
            const payload = JSON.stringify({
                isLocked:    this.net.locked,
                alertStatus: this.net.alertStatus,
                bannerText:  this.net.bannerText,
            });
            // Sync localStorage for cross-tab messaging only
            localStorage.setItem('ministrySettings', payload);
            try {
                await this._sb().from('system_settings').upsert(
                    { key:'ministrySettings', value:payload, updated_at:new Date().toISOString() },
                    { onConflict:'key' }
                );
            } catch(_) {}
        },

        /* ════════════════ TICKER ════════════════ */
        async pushTicker() {
            if (!this.ticker.input.trim()) return;
            this.loading = true;
            const msg = this.ticker.input;
            try {
                /* Write to system_settings so index.html picks it up */
                await this._sb().from('system_settings').upsert(
                    { key:'tickerBroadcast', value:JSON.stringify({ message:msg, ts:Date.now() }), updated_at:new Date().toISOString() },
                    { onConflict:'key' }
                );
                /* Also try ticker_messages table — graceful if it doesn't exist */
                try {
                    await this._sb().from('ticker_messages').insert({ message:msg, active:true, created_at:new Date().toISOString() });
                } catch(_) {}
                this.ticker.messages = [{ message:msg, id:'live' }];
                this.ticker.active = true;
                this.ticker.input = '';
                this.toast('Ticker broadcast active', 'success');
            } catch(e) { this.toast('Ticker push failed', 'error'); }
            this.loading = false;
        },

        async clearTicker() {
            try {
                await this._sb().from('system_settings').upsert(
                    { key:'tickerBroadcast', value:JSON.stringify({ message:'', ts:Date.now() }), updated_at:new Date().toISOString() },
                    { onConflict:'key' }
                );
                try { await this._sb().from('ticker_messages').update({ active:false }).eq('active', true); } catch(_) {}
                this.ticker.messages = []; this.ticker.active = false;
                this.toast('Ticker cleared', 'success');
            } catch(e) { this.toast('Clear failed', 'error'); }
        },

        /* ════════════════ DIRECTIVES ════════════════ */
        async sendDirective() {
            if (!this.broadcast.text.trim()) return;
            this.loading = true;
            try {
                const { error } = await this._sb().from('directives').insert({
                    content: this.broadcast.text, issued_by:'DIRECTOR',
                    priority: this.broadcast.priority,
                    timestamp: new Date().toISOString(), status:'ACTIVE'
                });
                if (error) throw error;
                this.net.alertStatus = 'DIRECTIVE ACTIVE';
                await this.pushToIndex();
                this.broadcast.text = '';
                await this.loadDirectives();
                this.toast('Directive synchronized', 'success');
            } catch(e) { this.toast('Transmission failed: '+(e.message||'retry'), 'error'); }
            this.loading = false;
        },

        async deleteDirective(id) {
            try {
                await this._sb().from('directives').delete().eq('id', id);
                this.directives = this.directives.filter(d => d.id !== id);
                this.toast('Directive revoked', 'success');
            } catch(_) { this.toast('Delete failed', 'error'); }
        },

        /* ════════════════ LOCKDOWN ════════════════ */
        async lockdownNetwork() {
            this.loading = true;
            this.net.locked = true; this.net.alertStatus = 'NETWORK LOCKDOWN ACTIVE';
            await this.pushToIndex();
            try { await this._sb().from('system_logs').insert({ event:'LOCKDOWN', initiated_by:'DIRECTOR', timestamp:new Date().toISOString() }); } catch(_) {}
            this.confirmLock = false;
            this.toast('Lockdown engaged', 'warning');
            this.loading = false;
        },

        async unlockNetwork() {
            this.net.locked = false; this.net.alertStatus = 'ALL CLEAR';
            await this.pushToIndex();
            this.toast('Network unlocked', 'success');
        },

        /* ════════════════ PROTOCOL ZERO ════════════════ */
        async fireProtocolZero() {
            this.pzCount = 5;
            this._pzTimer = setInterval(async () => {
                this.pzCount--;
                if (this.pzCount <= 0) {
                    clearInterval(this._pzTimer);
                    await this._executePZ();
                }
            }, 1000);
        },

        async _executePZ() {
            this.net.locked = true; this.net.alertStatus = '⚠ SYSTEM LOCKDOWN — PROTOCOL ZERO';
            await this.pushToIndex();
            try {
                await this._sb().from('system_settings').upsert(
                    { key:'protocolZero', value:JSON.stringify({ active:true, ts:Date.now(), by:this.currentUserId }), updated_at:new Date().toISOString() },
                    { onConflict:'key' }
                );
            } catch(_) {}
            this.pzActive = true; this.pzArmed = false; this.pzCount = 0;
            this.toast('Protocol Zero — All terminals frozen', 'warning');
        },

        async standDown() {
            this.net.locked = false; this.net.alertStatus = 'ALL CLEAR — STAND DOWN';
            await this.pushToIndex();
            try {
                await this._sb().from('system_settings').upsert(
                    { key:'protocolZero', value:JSON.stringify({ active:false, ts:Date.now() }), updated_at:new Date().toISOString() },
                    { onConflict:'key' }
                );
            } catch(_) {}
            this.pzActive = false;
            this.toast('Stand down — operatives restored', 'success');
        },

        /* ════════════════ OPERATIVES ════════════════ */
        async saveOp() {
            if (!this.editOp) return;
            this.loading = true;
            try {
                const { id, ...u } = this.editOp;
                const { error } = await this._sb().from('profiles').update({
                    username:u.username, codename:u.codename, rank:u.rank,
                    department:u.department, bio:u.bio, updated_at:new Date().toISOString()
                }).eq('id', id);
                if (error) throw error;
                await this.loadOperatives();
                this.editOp = null;
                this.toast('Dossier updated', 'success');
                try { await this._sb().from('activity_log').insert({ user_id:this.currentUserId, type:'RANK_CHANGE', description:'Director updated dossier for '+u.username, network:'M.O.G.', created_at:new Date().toISOString() }); } catch(_) {}
            } catch(e) { this.toast('Update failed: '+(e.message||'retry'), 'error'); }
            this.loading = false;
        },

                await this._sb().from('profiles').update({ rank:'BANNED', bio:'[BANNED '+new Date().toLocaleDateString()+']', updated_at:new Date().toISOString() }).eq('id', op.id);

                this.toast(op.username+' banned', 'warning');

            this.loading = false;

        async deleteMessage(id) {
            try {
                await this._sb().from('messages').delete().eq('id', id);
                this.messages = this.messages.filter(m => m.id !== id);
                this.toast('Message deleted', 'success');
            } catch(_) { this.toast('Delete failed', 'error'); }
        },

        /* ════════════════ SETTINGS ════════════════ */
        loadSysConfig() {
            try { const s=localStorage.getItem('sysConfig'); if(s) this.sysConfig={...this.sysConfig,...JSON.parse(s)}; } catch(_) {}
        },

        async saveSettings() {
            this.loading = true;
            try {
                localStorage.setItem('sysConfig', JSON.stringify(this.sysConfig));
                await this._sb().from('system_settings').upsert(
                    { key:'sysConfig', value:JSON.stringify(this.sysConfig), updated_at:new Date().toISOString() },
                    { onConflict:'key' }
                );
                if (this.sysConfig.maintenanceMode) {
                    this.net.locked = true; this.net.alertStatus = 'SYSTEM MAINTENANCE';
                    await this.pushToIndex();
                }
                this.toast('Settings saved', 'success');
            } catch(e) { this.toast('Save failed', 'error'); }
            this.loading = false;
        },

        /* ════════════════ DANGER ZONE ════════════════ */
        async purgeDirectives() {
            if (!confirm('Purge ALL directives?')) return;
            try {
                await this._sb().from('directives').delete().neq('id','00000000-0000-0000-0000-000000000000');
                this.directives = [];
                this.toast('Directives purged', 'warning');
            } catch(_) { this.toast('Purge failed', 'error'); }
        },

        async purgeActivity() {
            if (!confirm('Clear ALL activity logs?')) return;
            try {
                await this._sb().from('activity_log').delete().neq('id','00000000-0000-0000-0000-000000000000');
                this.activity = [];
                this.toast('Activity log cleared', 'warning');
            } catch(_) { this.toast('Clear failed', 'error'); }
        },

        /* ════════════════ POLLING ════════════════ */
        startPoller() {
            setInterval(async () => {
                if (!this._sb()) return;
                try {
                    /* Check Protocol Zero status */
                    const { data:pz } = await this._sb().from('system_settings').select('value').eq('key','protocolZero').single();
                    if (pz?.value) { const p=JSON.parse(pz.value); if(!p.active) this.pzActive=false; }
                    /* Reload directives quietly */
                    await this.loadDirectives();
                } catch(_) {}
            }, 30000);
        },

        /* ════════════════ LOGOUT ════════════════ */
        async logout() {
            try { await this._sb().auth.signOut(); } catch(_) {}
            localStorage.removeItem('userRole'); localStorage.removeItem('clearanceLevel');
            window.location.href = '/login.html';
        },
