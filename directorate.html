<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE HQ | MASTER COMMAND</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="../js/auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
        
        [x-cloak] { display: none !important; }
        
        :root {
            --gold: #d4af37;
            --gold-light: #f4d03f;
            --gold-dark: #b8860b;
            --red-primary: #dc2626;
            --red-dark: #991b1b;
        }
        
        body {
            font-family: 'Orbitron', sans-serif;
        }
        
        .terminal-font { 
            font-family: 'Share Tech Mono', monospace; 
        }
        
        /* Seal Background Pattern */
        .seal-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/images/1000219947.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 80vmin;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
            filter: sepia(100%) hue-rotate(10deg) saturate(200%);
        }
        
        .seal-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.9) 70%, rgba(0,0,0,1) 100%);
        }
        
        /* Grid Pattern */
        .bg-grid-red { 
            background-image: 
                linear-gradient(rgba(220, 38, 38, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.1) 1px, transparent 1px);
            background-size: 50px 50px; 
        }
        
        /* Glass Effects */
        .glass-red { 
            background: rgba(20, 0, 0, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(220, 38, 38, 0.4); 
            box-shadow: 
                0 0 40px rgba(220, 38, 38, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        .glass-gold { 
            background: rgba(30, 20, 0, 0.9); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(212, 175, 55, 0.4); 
            box-shadow: 
                0 0 40px rgba(212, 175, 55, 0.2),
                inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        .glass { 
            background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        /* Loader */
        .loader-red { 
            width: 60px; 
            height: 60px; 
            border: 3px solid transparent;
            border-top-color: var(--gold);
            border-right-color: var(--red-primary);
            border-radius: 50%; 
            animation: rotation 1.5s linear infinite; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        
        @keyframes rotation { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        /* Scanline */
        .scanline-red { 
            width: 100%; 
            height: 150px; 
            background: linear-gradient(0deg, transparent 0%, rgba(220, 38, 38, 0.08) 50%, transparent 100%); 
            position: fixed; 
            top: -150px; 
            left: 0; 
            pointer-events: none; 
            animation: moveScanline 8s linear infinite; 
            z-index: 100; 
        }
        
        @keyframes moveScanline { 
            from { top: -150px; } 
            to { top: 100vh; } 
        }
        
        /* Gold Text */
        .text-gold { 
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        
        .text-gold-light {
            color: var(--gold-light);
        }
        
        /* Seal Container */
        .seal-container {
            position: relative;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.4));
            transition: all 0.5s ease;
        }
        
        .seal-container:hover {
            filter: drop-shadow(0 0 50px rgba(212, 175, 55, 0.6));
            transform: scale(1.02);
        }
        
        /* Button Effects */
        .btn-directorate {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.2) 0%, rgba(139, 0, 0, 0.4) 100%);
            border: 1px solid rgba(220, 38, 38, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-directorate::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .btn-directorate:hover::before {
            left: 100%;
        }
        
        .btn-directorate:hover {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.4) 0%, rgba(139, 0, 0, 0.6) 100%);
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.4);
            transform: translateY(-2px);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2) 0%, rgba(184, 134, 11, 0.4) 100%);
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: var(--gold);
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.4) 0%, rgba(184, 134, 11, 0.6) 100%);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            color: var(--gold-light);
        }
        
        /* Status Indicators */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        
        .status-active {
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }
        
        .status-warning {
            background: #eab308;
            box-shadow: 0 0 10px #eab308;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Input Styling */
        .directorate-input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: white;
            transition: all 0.3s ease;
        }
        
        .directorate-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            outline: none;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--gold-dark), var(--red-dark));
            border-radius: 4px;
        }
        
        /* Classified Stamp */
        .classified-stamp {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #dc2626;
            border: 2px solid #dc2626;
            padding: 5px 15px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.3em;
            transform: rotate(15deg);
            opacity: 0.8;
            text-transform: uppercase;
            pointer-events: none;
        }
        
        /* Binary Rain Effect */
        .binary-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
        }
    </style>

    <script>
        function commandCenter() {
            return {
                view: 'gate',
                broadcastInput: '',
                operatives: [],
                liveActivity: [],
                wealth: '1.4M',
                currentTime: '',
                sessionDuration: '00:00',
                sessionStart: null,
                isLoading: false,
                systemStatus: 'ONLINE',
                activeNodes: 6,
                threatLevel: 'LOW',
                lastSync: null,
                
                // Index.html Control Properties
                indexControl: {
                    bannerText: 'THE MINISTRY OF GROOVE',
                    subText: 'EMALAHLENI UPLINK II EST. 2026',
                    alertStatus: 'ALL CLEAR',
                    frequency: '104.7 FM',
                    isLocked: false
                },

                async init() {
                    // 1. CLEARANCE CHECK - DIRECTOR ONLY
                    const role = localStorage.getItem('userRole');
                    const clearance = localStorage.getItem('clearanceLevel');
                    
                    if (role !== 'director' && clearance !== 'ALPHA') {
                        console.error("UNAUTHORIZED ACCESS DETECTED - CLEARANCE INSUFFICIENT");
                        window.location.href = '/index.html';
                        return;
                    }

                    // 2. SESSION INITIALIZATION
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session) {
                        window.location.href = '/login.html';
                        return;
                    }

                    this.view = 'active';
                    this.sessionStart = Date.now();
                    this.lastSync = new Date().toISOString();
                    this.startClock();
                    await this.loadSecureData();
                    await this.syncWithIndex();
                    
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadSecureData() {
                    this.isLoading = true;
                    try {
                        // Load Operatives
                        const { data: ops, error: opsError } = await sb.from('profiles')
                            .select('*')
                            .order('last_active', { ascending: false })
                            .limit(15);
                        if (ops) this.operatives = ops;
                        if (opsError) console.warn('Operative data restricted:', opsError);

                        // Load Messages/Logs
                        const { data: logs, error: logsError } = await sb.from('messages')
                            .select('*')
                            .order('created_at', { ascending: false })
                            .limit(12);
                        if (logs) this.liveActivity = logs;
                        if (logsError) console.warn('Log access limited:', logsError);
                        
                        // Load Directives
                        const { data: directives } = await sb.from('directives')
                            .select('*')
                            .order('timestamp', { ascending: false })
                            .limit(5);
                        if (directives) this.recentDirectives = directives;
                        
                    } catch (e) {
                        console.error("Signal weak: Data retrieval failed.", e);
                    } finally {
                        this.isLoading = false;
                    }
                },

                async syncWithIndex() {
                    // Synchronize with index.html settings
                    try {
                        const savedSettings = localStorage.getItem('ministrySettings');
                        if (savedSettings) {
                            this.indexControl = { ...this.indexControl, ...JSON.parse(savedSettings) };
                        }
                    } catch (e) {
                        console.warn('Index sync failed:', e);
                    }
                },

                async updateIndexControl() {
                    // Push changes to index.html
                    try {
                        localStorage.setItem('ministrySettings', JSON.stringify(this.indexControl));
                        localStorage.setItem('lastDirective', JSON.stringify({
                            timestamp: new Date().toISOString(),
                            source: 'DIRECTORATE',
                            action: 'UPDATE_INDEX'
                        }));
                        
                        // Broadcast to all open tabs
                        window.dispatchEvent(new StorageEvent('storage', {
                            key: 'ministrySettings',
                            newValue: JSON.stringify(this.indexControl)
                        }));
                        
                        return true;
                    } catch (e) {
                        console.error('Index control update failed:', e);
                        return false;
                    }
                },

                async sendBroadcast() {
                    if (!this.broadcastInput.trim()) return;
                    this.isLoading = true;
                    try {
                        // Save to database
                        const { error } = await sb.from('directives').insert({
                            content: this.broadcastInput,
                            issued_by: 'DIRECTOR',
                            priority: 'HIGH',
                            timestamp: new Date().toISOString(),
                            status: 'ACTIVE'
                        });
                        
                        if (error) throw error;
                        
                        // Update index.html banner
                        this.indexControl.alertStatus = 'DIRECTIVE ACTIVE';
                        await this.updateIndexControl();
                        
                        this.showNotification('GLOBAL DIRECTIVE SYNCHRONIZED', 'success');
                        this.broadcastInput = '';
                        await this.loadSecureData();
                    } catch (e) {
                        this.showNotification('TRANSMISSION FAILED - CHECK UPLINK', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async lockdownIndex() {
                    this.isLoading = true;
                    try {
                        this.indexControl.isLocked = true;
                        this.indexControl.alertStatus = 'LOCKDOWN INITIATED';
                        await this.updateIndexControl();
                        
                        await sb.from('system_logs').insert({
                            event: 'LOCKDOWN',
                            initiated_by: 'DIRECTOR',
                            timestamp: new Date().toISOString()
                        });
                        
                        this.showNotification('SECTOR LOCKDOWN ENGAGED', 'warning');
                    } catch (e) {
                        this.showNotification('LOCKDOWN FAILED', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async unlockIndex() {
                    this.indexControl.isLocked = false;
                    this.indexControl.alertStatus = 'ALL CLEAR';
                    await this.updateIndexControl();
                    this.showNotification('SECTOR UNLOCKED', 'success');
                },

                startClock() {
                    setInterval(() => {
                        this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false });
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        const hours = Math.floor(diff / 3600);
                        const mins = Math.floor((diff % 3600) / 60);
                        const secs = diff % 60;
                        this.sessionDuration = `${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                    }, 1000);
                },

                showNotification(message, type = 'info') {
                    // Simple notification implementation
                    const notif = document.createElement('div');
                    notif.className = `fixed top-4 right-4 p-4 rounded-lg z-50 font-bold tracking-wider ${type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : type === 'warning' ? 'bg-yellow-600' : 'bg-blue-600'} text-white`;
                    notif.textContent = message;
                    document.body.appendChild(notif);
                    setTimeout(() => notif.remove(), 3000);
                },

                async logout() {
                    await sb.auth.signOut();
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('clearanceLevel');
                    window.location.href = '/login.html';
                },
                
                getStatusColor(status) {
                    const colors = {
                        'ONLINE': 'text-green-500',
                        'OFFLINE': 'text-red-500',
                        'BUSY': 'text-yellow-500',
                        'STANDBY': 'text-blue-500'
                    };
                    return colors[status] || 'text-gray-500';
                }
            }
        }
    </script>
</head>
<body x-data="commandCenter()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <!-- Seal Background -->
    <div class="seal-bg"></div>
    
    <!-- Binary Rain Canvas -->
    <canvas id="binaryRain" class="binary-rain"></canvas>
    
    <!-- Scanline -->
    <div class="scanline-red"></div>
    
    <!-- Grid Overlay -->
    <div class="bg-grid-red fixed inset-0 z-0 opacity-20"></div>

    <!-- GATE VIEW -->
    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-8 relative z-50">
            <div class="loader-red"></div>
            <p class="terminal-font text-sm text-gold animate-pulse uppercase tracking-[0.5em]">Establishing High-Clearance Uplink...</p>
            <p class="terminal-font text-xs text-red-600 uppercase tracking-widest mt-4">Ministry of Groove // Directorate Channel</p>
        </div>
    </template>

    <!-- ACTIVE VIEW -->
    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-4 md:p-8 z-10 relative">
            
            <!-- Header -->
            <header class="p-6 md:p-10 glass-red rounded-[2rem] flex flex-col md:flex-row justify-between items-center gap-6 mb-12 shadow-2xl relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-r from-red-900/20 via-transparent to-gold-900/20 pointer-events-none"></div>
                
                <div class="flex items-center gap-6 relative z-10">
                    <button onclick="window.location.href='/index.html'" class="p-4 bg-black/40 rounded-[1.5rem] border border-gold/30 hover:border-gold hover:bg-gold/10 transition-all group">
                        <i data-lucide="chevron-left" class="text-gold w-6 h-6 group-hover:scale-110 transition-transform"></i>
                    </button>
                    <div>
                        <h1 class="text-3xl md:text-4xl font-black uppercase italic tracking-tighter text-red-600" style="text-shadow: 0 0 20px rgba(220, 38, 38, 0.5);">Directorate HQ</h1>
                        <p class="text-xs text-gold font-black uppercase tracking-[0.3em] mt-2 italic">MASTER COMMAND // SECTOR 7G ARCHIVE</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-8 relative z-10">
                    <div class="hidden md:block text-right">
                        <p class="text-3xl font-black terminal-font text-white" x-text="currentTime"></p>
                        <p class="text-xs text-red-600 uppercase font-black tracking-widest" x-text="'SESSION: ' + sessionDuration"></p>
                    </div>
                    
                    <!-- Status Panel -->
                    <div class="glass-gold p-4 rounded-[1rem] text-center min-w-[120px]">
                        <div class="status-dot status-active mb-2"></div>
                        <p class="text-xs text-gold uppercase tracking-widest font-bold" x-text="systemStatus"></p>
                    </div>
                    
                    <button @click="logout()" class="p-4 border border-red-600/50 text-red-500 rounded-[1.5rem] hover:bg-red-600 hover:text-white transition-all group">
                        <i data-lucide="power" class="w-6 h-6 group-hover:rotate-90 transition-transform"></i>
                    </button>
                </div>
            </header>
            
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- Left Column - Seal & Stats -->
                <div class="lg:col-span-4 space-y-6">
                    
                    <!-- Seal Display -->
                    <div class="glass-gold p-8 rounded-[3rem] text-center border border-gold/30 shadow-2xl relative overflow-hidden group seal-container">
                        <div class="classified-stamp">CLASSIFIED</div>
                        <img src="../assets/images/1000219947.png" alt="SEAL" class="w-full aspect-square object-contain mb-6 filter drop-shadow-[0_0_30px_rgba(212,175,55,0.6)] group-hover:scale-105 transition-transform duration-700">
                        <div class="pt-6 border-t border-gold/20">
                            <h3 class="text-xl font-black uppercase italic tracking-tighter text-gold">Directorate Seal</h3>
                            <p class="text-xs text-red-500 uppercase tracking-widest mt-2">Authentication Verified</p>
                        </div>
                    </div>

                    <!-- Wealth Index -->
                    <div class="glass-gold p-8 rounded-[2rem] text-center border border-gold/30 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-gold to-transparent"></div>
                        <h4 class="terminal-font text-xs text-gold mb-4 uppercase tracking-[0.3em] italic">Brand Wealth Index</h4>
                        <p class="text-6xl font-black text-white terminal-font tracking-tighter" x-text="wealth"></p>
                        <p class="text-xs text-green-500 mt-2 uppercase tracking-widest">▲ 12.4% This Cycle</p>
                    </div>

                    <!-- Quick Stats -->
                    <div class="glass-red p-6 rounded-[2rem] space-y-4">
                        <h4 class="text-xs text-red-500 uppercase tracking-widest font-bold mb-4">Sector Metrics</h4>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-400">Active Nodes</span>
                            <span class="text-gold font-bold terminal-font" x-text="activeNodes"></span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-400">Threat Level</span>
                            <span class="text-green-500 font-bold terminal-font" x-text="threatLevel"></span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-gray-400">Last Sync</span>
                            <span class="text-xs text-gray-500 terminal-font" x-text="lastSync ? new Date(lastSync).toLocaleTimeString() : '--:--'"></span>
                        </div>
                    </div>
                    
                    <!-- Index Control Panel -->
                    <div class="glass-red p-6 rounded-[2rem] border-2 border-red-600/50">
                        <h4 class="text-sm text-red-500 uppercase tracking-widest font-bold mb-4 flex items-center gap-2">
                            <i data-lucide="shield" class="w-4 h-4"></i>
                            Index.html Control
                        </h4>
                        
                        <div class="space-y-3">
                            <button @click="lockdownIndex()" :disabled="isLoading || indexControl.isLocked" 
                                class="w-full py-3 px-4 bg-red-900/50 border border-red-600 rounded-xl text-red-400 text-xs uppercase font-bold tracking-wider hover:bg-red-800 transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                                <i data-lucide="lock" class="w-4 h-4"></i>
                                Initiate Lockdown
                            </button>
                            
                            <button @click="unlockIndex()" :disabled="!indexControl.isLocked" 
                                class="w-full py-3 px-4 bg-green-900/50 border border-green-600 rounded-xl text-green-400 text-xs uppercase font-bold tracking-wider hover:bg-green-800 transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                                <i data-lucide="unlock" class="w-4 h-4"></i>
                                Lift Lockdown
                            </button>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-red-600/20">
                            <p class="text-xs text-gray-500 mb-2">Current Status:</p>
                            <p class="text-sm font-bold" :class="indexControl.isLocked ? 'text-red-500' : 'text-green-500'" x-text="indexControl.alertStatus"></p>
                        </div>
                    </div>
                </div>

                <!-- Right Column - Main Controls -->
                <div class="lg:col-span-8 space-y-6">

                    <!-- Navigation Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <template x-for="node in [
                            {i:'layout-grid', l:'Hub', u:'/index.html', c:'text-gold', desc:'Main Interface'}, 
                            {i:'user-cog', l:'Dossier', u:'/pages/dossier.html', c:'text-green-500', desc:'Personnel Files'}, 
                            {i:'camera', l:'Gallery', u:'/pages/gallery.html', c:'text-purple-500', desc:'Visual Archive'}, 
                            {i:'activity', l:'Frequency', u:'/pages/frequency.html', c:'text-gold', desc:'Signal Monitor'}, 
                            {i:'radio', l:'Dispatch', u:'/pages/dispatch.html', c:'text-red-500', desc:'Communications'}, 
                            {i:'lock', l:'Vault', u:'/pages/archives.html', c:'text-zinc-500', desc:'Secure Storage'}
                        ]" :key="node.l">
                            <div @click="window.location.href=node.u" class="btn-directorate p-6 rounded-[2rem] text-center cursor-pointer group relative">
                                <div :class="node.c" class="mb-3 group-hover:scale-110 transition-transform">
                                    <i :data-lucide="node.i" class="mx-auto w-8 h-8"></i>
                                </div>
                                <span class="text-xs font-black uppercase tracking-[0.2em] text-white block" x-text="node.l"></span>
                                <span class="text-[10px] text-gray-500 uppercase tracking-wider" x-text="node.desc"></span>
                            </div>
                        </template>
                    </div>

                    <!-- Broadcast Terminal -->
                    <div class="glass-red p-8 md:p-12 rounded-[3rem] border border-red-600/30 shadow-2xl space-y-8 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-64 h-64 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>
                        
                        <div class="flex items-center gap-6 relative z-10">
                            <div class="p-4 bg-gradient-to-br from-red-600 to-red-800 rounded-[1.5rem] text-white shadow-lg">
                                <i data-lucide="zap" class="w-8 h-8"></i>
                            </div>
                            <div>
                                <h3 class="text-2xl md:text-3xl font-black uppercase italic tracking-widest text-white">Execute Directive</h3>
                                <p class="text-xs text-gray-500 uppercase tracking-widest mt-1">Global Broadcast System</p>
                            </div>
                        </div>
                        
                        <textarea x-model="broadcastInput" 
                            class="w-full h-48 bg-black/60 border border-red-600/20 p-6 rounded-[2rem] outline-none text-lg terminal-font text-white resize-none directivate-input placeholder-gray-600" 
                            placeholder="ENTER MASTER DIRECTIVE..."></textarea>
                        
                        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="text-xs text-gray-500 terminal-font">
                                <span class="text-gold">CHAR:</span> <span x-text="broadcastInput.length"></span> | 
                                <span class="text-gold">PRIORITY:</span> ALPHA
                            </div>
                            <button @click="sendBroadcast()" :disabled="isLoading || !broadcastInput.trim()" 
                                class="px-12 py-4 bg-gradient-to-r from-red-700 to-red-900 text-white font-black uppercase rounded-full shadow-2xl disabled:opacity-50 disabled:cursor-not-allowed hover:shadow-red-600/50 hover:scale-105 transition-all flex items-center gap-3">
                                <i data-lucide="send" class="w-5 h-5"></i>
                                <span x-text="isLoading ? 'TRANSMITTING...' : 'Synchronize Grid'"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Live Activity Feed -->
                    <div class="glass p-6 rounded-[2rem] border border-white/10">
                        <div class="flex items-center justify-between mb-6">
                            <h4 class="text-sm text-gold uppercase tracking-widest font-bold flex items-center gap-2">
                                <i data-lucide="terminal" class="w-4 h-4"></i>
                                Live Activity Stream
                            </h4>
                            <button @click="loadSecureData()" class="text-xs text-gray-500 hover:text-gold transition-colors uppercase tracking-wider">
                                Refresh
                            </button>
                        </div>
                        
                        <div class="space-y-3 max-h-64 overflow-y-auto pr-2">
                            <template x-if="liveActivity.length === 0">
                                <div class="text-center py-8 text-gray-600 terminal-font text-sm">NO ACTIVE SIGNALS</div>
                            </template>
                            
                            <template x-for="(activity, index) in liveActivity" :key="index">
                                <div class="flex items-center gap-4 p-4 bg-black/40 rounded-xl border border-white/5 hover:border-gold/30 transition-colors">
                                    <div class="w-2 h-2 rounded-full bg-gold animate-pulse"></div>
                                    <div class="flex-1">
                                        <p class="text-sm text-white terminal-font" x-text="activity.content || activity.message || 'Encrypted Transmission'"></p>
                                        <p class="text-xs text-gray-600 mt-1" x-text="new Date(activity.created_at).toLocaleString()"></p>
                                    </div>
                                    <span class="text-xs px-2 py-1 rounded bg-gold/10 text-gold uppercase tracking-wider" x-text="activity.type || 'LOG'"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                    
                    <!-- Operative Status -->
                    <div class="glass p-6 rounded-[2rem] border border-white/10">
                        <h4 class="text-sm text-gold uppercase tracking-widest font-bold mb-6 flex items-center gap-2">
                            <i data-lucide="users" class="w-4 h-4"></i>
                            Active Operatives
                        </h4>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <template x-for="operative in operatives" :key="operative.id">
                                <div class="flex items-center gap-3 p-3 bg-black/40 rounded-xl border border-white/5">
                                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-gold/20 to-red-900/20 flex items-center justify-center border border-gold/30">
                                        <i data-lucide="user" class="w-5 h-5 text-gold"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm text-white font-bold truncate" x-text="operative.username || operative.email || 'Unknown Agent'"></p>
                                        <p class="text-xs text-gray-500 uppercase" x-text="operative.role || 'OPERATIVE'"></p>
                                    </div>
                                    <div class="w-2 h-2 rounded-full" :class="getStatusColor(operative.status)"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                    </div>
            </div>
            
            <!-- Footer -->
            <footer class="mt-12 text-center pb-8">
                <p class="text-xs text-gray-600 uppercase tracking-[0.3em] terminal-font">
                    The Ministry of Groove // Emalahleni Uplink II // Est. 2026
                </p>
                <p class="text-[10px] text-red-900/50 uppercase tracking-widest mt-2">
                    [SECTOR 7G] // AUTHORIZED PERSONNEL ONLY
                </p>
            </footer>
        </div>
    </template>

    <script>
        // Binary Rain Animation
        const canvas = document.getElementById('binaryRain');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const columns = Math.floor(canvas.width / 20);
        const drops = Array(columns).fill(1);
        
        function drawBinary() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#d4af37';
            ctx.font = '15px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = Math.random() > 0.5 ? '1' : '0';
                ctx.fillText(text, i * 20, drops[i] * 20);
                
                if (drops[i] * 20 > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawBinary, 50);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
