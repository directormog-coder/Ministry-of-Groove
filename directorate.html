<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE HQ | MASTER COMMAND</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        
        /* Directorate Exclusive Theme: Command Red */
        .bg-grid-red { 
            background-image: radial-gradient(circle, #ef4444 1.5px, transparent 1.5px); 
            background-size: 40px 40px; 
        }
        
        .glass-red { 
            background: rgba(15, 0, 0, 0.97); 
            backdrop-filter: blur(40px); 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        
        .glass {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .loader-red { 
            width: 40px; 
            height: 40px; 
            border: 4px solid #ef4444; 
            border-bottom-color: transparent; 
            border-radius: 50%; 
            animation: rotation 1s linear infinite; 
        }
        
        @keyframes rotation { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        .scanline-red { 
            width: 100%; 
            height: 100px; 
            background: linear-gradient(0deg, transparent 0%, rgba(239, 68, 68, 0.05) 50%, transparent 100%); 
            position: fixed; 
            top: -100px; 
            left: 0; 
            pointer-events: none; 
            animation: moveScanline 6s linear infinite; 
            z-index: 100; 
        }
        
        @keyframes moveScanline { 
            from { top: -100px; } 
            to { top: 100vh; } 
        }
        
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(239, 68, 68, 0.3);
            border-radius: 3px;
        }
        
        .text-gold { color: #ffd700; }
        .border-gold { border-color: #ffd700; }
        .from-red-600\/20 { --tw-gradient-from: rgb(239 68 68 / 0.2); }
        .bg-radial-gradient { background: radial-gradient(circle, var(--tw-gradient-from), transparent); }
        
        .circuit-vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
            z-index: 1;
        }
        
        .terminal-font { font-family: 'Courier New', monospace; }
    </style>

    <script>
        // ==========================================
        // SECURE CONFIGURATION - NO EXPOSED CREDENTIALS
        // ==========================================
        
        // Configuration loaded from environment or secure source
        const CONFIG = {
            // These should be loaded from environment variables in production
            SUPABASE_URL: localStorage.getItem('SUPABASE_URL') || 'https://fgkljjgxecjmiiaptiug.supabase.co',
            SUPABASE_ANON_KEY: localStorage.getItem('SUPABASE_ANON_KEY') || '',
            ENCRYPTION_KEY: null // Will be derived from secure session
        };

        // ==========================================
        // WEB CRYPTO API ENCRYPTION MODULE
        // ==========================================
        
        const CryptoModule = {
            async deriveKey(password, salt) {
                const encoder = new TextEncoder();
                const keyMaterial = await window.crypto.subtle.importKey(
                    'raw',
                    encoder.encode(password),
                    'PBKDF2',
                    false,
                    ['deriveBits', 'deriveKey']
                );
                
                return window.crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    keyMaterial,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['encrypt', 'decrypt']
                );
            },

            async encrypt(data, password) {
                const encoder = new TextEncoder();
                const salt = window.crypto.getRandomValues(new Uint8Array(16));
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                
                const key = await this.deriveKey(password, salt);
                const encrypted = await window.crypto.subtle.encrypt(
                    { name: 'AES-GCM', iv: iv },
                    key,
                    encoder.encode(JSON.stringify(data))
                );
                
                return {
                    salt: Array.from(salt),
                    iv: Array.from(iv),
                    data: Array.from(new Uint8Array(encrypted))
                };
            },

            async decrypt(encryptedPackage, password) {
                try {
                    const decoder = new TextDecoder();
                    const salt = new Uint8Array(encryptedPackage.salt);
                    const iv = new Uint8Array(encryptedPackage.iv);
                    const data = new Uint8Array(encryptedPackage.data);
                    
                    const key = await this.deriveKey(password, salt);
                    const decrypted = await window.crypto.subtle.decrypt(
                        { name: 'AES-GCM', iv: iv },
                        key,
                        data
                    );
                    
                    return JSON.parse(decoder.decode(decrypted));
                } catch (e) {
                    console.error('Decryption failed');
                    return null;
                }
            },

            // Secure session token generation
            generateSecureToken() {
                const array = new Uint8Array(32);
                window.crypto.getRandomValues(array);
                return Array.from(array, byte => byte.toString(16).padStart(2, '0')).join('');
            }
        };

        // ==========================================
        // SECURE STORAGE MODULE
        // ==========================================
        
        const SecureStorage = {
            async set(key, value, password) {
                const encrypted = await CryptoModule.encrypt(value, password);
                localStorage.setItem(key, JSON.stringify(encrypted));
            },

            async get(key, password) {
                const stored = localStorage.getItem(key);
                if (!stored) return null;
                try {
                    const encrypted = JSON.parse(stored);
                    return await CryptoModule.decrypt(encrypted, password);
                } catch (e) {
                    return null;
                }
            },

            remove(key) {
                localStorage.removeItem(key);
            },

            clear() {
                localStorage.clear();
            }
        };

        // ==========================================
        // SUPABASE CLIENT MANAGER
        // ==========================================
        
        const SupabaseManager = {
            client: null,
            sessionToken: null,

            initialize() {
                if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) {
                    console.error('Supabase configuration missing');
                    return false;
                }
                
                try {
                    this.client = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
                        auth: {
                            autoRefreshToken: true,
                            persistSession: true,
                            detectSessionInUrl: false
                        }
                    });
                    return true;
                } catch (e) {
                    console.error('Failed to initialize Supabase:', e);
                    return false;
                }
            },

            async verifySession() {
                if (!this.client) return false;
                const { data: { session }, error } = await this.client.auth.getSession();
                return !!session && !error;
            },

            async signOut() {
                if (this.client) {
                    await this.client.auth.signOut();
                }
                this.sessionToken = null;
            }
        };

        // ==========================================
        // MAIN APPLICATION CONTROLLER
        // ==========================================
        
        function commandCenter() {
            return {
                view: 'gate',
                broadcastInput: '',
                operatives: [],
                liveActivity: [],
                wealth: '1.4M',
                currentTime: '',
                sessionDuration: '00:00',
                sessionStart: null,
                isLoading: false,
                errorMessage: '',
                sessionCheckInterval: null,

                async init() {
                    // Security: Verify director role
                    const role = localStorage.getItem('userRole');
                    const sessionValid = localStorage.getItem('sessionValid');
                    
                    if (role !== 'director' || sessionValid !== 'true') {
                        this.redirectToLogin();
                        return;
                    }

                    // Initialize Supabase
                    if (!SupabaseManager.initialize()) {
                        this.errorMessage = 'Failed to establish secure connection';
                        setTimeout(() => this.redirectToLogin(), 2000);
                        return;
                    }

                    // Verify active session with Supabase
                    const isValid = await SupabaseManager.verifySession();
                    if (!isValid) {
                        this.redirectToLogin();
                        return;
                    }

                    // Generate secure session token
                    SupabaseManager.sessionToken = CryptoModule.generateSecureToken();
                    
                    this.view = 'active';
                    this.sessionStart = Date.now();
                    this.startClock();
                    this.startSessionValidation();
                    
                    await this.loadSecureData();
                    
                    this.$nextTick(() => {
                        if (typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }
                    });
                },

                async loadSecureData() {
                    this.isLoading = true;
                    
                    try {
                        // Load operatives with error handling
                        const { data: ops, error: opsError } = await SupabaseManager.client
                            .from('profiles')
                            .select('id, handle, status, last_seen, clearance_level')
                            .limit(10);
                            
                        if (opsError) throw opsError;
                        if (ops) this.operatives = ops;

                        // Load activity logs
                        const { data: logs, error: logsError } = await SupabaseManager.client
                            .from('messages')
                            .select('id, username, content, created_at, priority')
                            .order('created_at', { ascending: false })
                            .limit(8);
                            
                        if (logsError) throw logsError;
                        if (logs) this.liveActivity = logs;

                        // Load wealth metrics (if available)
                        await this.loadWealthData();

                    } catch (error) {
                        console.error('Data load error:', error);
                        this.errorMessage = 'Secure data retrieval failed';
                    } finally {
                        this.isLoading = false;
                    }
                },

                async loadWealthData() {
                    try {
                        const { data, error } = await SupabaseManager.client
                            .from('metrics')
                            .select('wealth_value, growth_rate')
                            .single();
                            
                        if (data) {
                            this.wealth = data.wealth_value || this.wealth;
                        }
                    } catch (e) {
                        // Silent fail - use default
                    }
                },

                async sendBroadcast() {
                    if (!this.broadcastInput.trim()) return;
                    
                    const content = this.broadcastInput.trim();
                    
                    // Validate input length
                    if (content.length > 1000) {
                        alert('DIRECTIVE TOO LONG. MAX 1000 CHARACTERS.');
                        return;
                    }

                    // Sanitize input
                    const sanitized = this.sanitizeInput(content);

                    try {
                        this.isLoading = true;
                        
                        // Store directive in database
                        const { error } = await SupabaseManager.client
                            .from('directives')
                            .insert({
                                content: sanitized,
                                issued_by: localStorage.getItem('userHandle') || 'DIRECTOR',
                                priority: 'high',
                                timestamp: new Date().toISOString(),
                                status: 'active'
                            });

                        if (error) throw error;

                        // Broadcast to real-time channel (if configured)
                        await this.broadcastToGrid(sanitized);

                        alert('GLOBAL DIRECTIVE SYNCHRONIZED TO ALL OPERATIVE GRIDS');
                        this.broadcastInput = '';
                        
                        // Refresh activity
                        await this.loadSecureData();
                        
                    } catch (error) {
                        console.error('Broadcast failed:', error);
                        alert('TRANSMISSION FAILED. CHECK SECURE UPLINK.');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async broadcastToGrid(message) {
                    // Implementation for real-time broadcasting
                    // Could use Supabase Realtime or WebSocket
                    try {
                        const channel = SupabaseManager.client.channel('directives');
                        await channel.subscribe();
                        await channel.send({
                            type: 'broadcast',
                            event: 'directive',
                            payload: { message, timestamp: Date.now() }
                        });
                    } catch (e) {
                        console.log('Real-time broadcast not available');
                    }
                },

                sanitizeInput(input) {
                    const div = document.createElement('div');
                    div.textContent = input;
                    return div.innerHTML;
                },

                startClock() {
                    const updateTime = () => {
                        this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false });
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        const mins = Math.floor(diff / 60).toString().padStart(2, '0');
                        const secs = (diff % 60).toString().padStart(2, '0');
                        this.sessionDuration = `${mins}:${secs}`;
                    };
                    
                    updateTime();
                    setInterval(updateTime, 1000);
                },

                startSessionValidation() {
                    // Periodic session validation every 30 seconds
                    this.sessionCheckInterval = setInterval(async () => {
                        const isValid = await SupabaseManager.verifySession();
                        if (!isValid) {
                            this.logout();
                        }
                    }, 30000);
                },

                redirectToLogin() {
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('sessionValid');
                    window.location.href = '../login.html';
                },

                async logout() {
                    if (this.sessionCheckInterval) {
                        clearInterval(this.sessionCheckInterval);
                    }
                    
                    await SupabaseManager.signOut();
                    SecureStorage.clear();
                    
                    // Clear sensitive data
                    this.operatives = [];
                    this.liveActivity = [];
                    this.broadcastInput = '';
                    
                    window.location.href = '../login.html';
                },

                // Cleanup on component destroy
                destroy() {
                    if (this.sessionCheckInterval) {
                        clearInterval(this.sessionCheckInterval);
                    }
                }
            };
        }

        // Global error handler
        window.onerror = function(msg, url, line) {
            console.error('System Error:', msg, 'at', url, ':', line);
            return false;
        };

        // Prevent back button cache
        window.onpageshow = function(event) {
            if (event.persisted) {
                window.location.reload();
            }
        };
    </script>
</head>
