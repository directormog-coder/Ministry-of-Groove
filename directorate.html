<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE HQ | MINISTRY OF GROOVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-red { background-image: radial-gradient(circle, #ef4444 1px, transparent 1px); background-size: 40px 40px; }
        .glass-red { background: rgba(20, 0, 0, 0.85); backdrop-filter: blur(25px); border: 1px solid rgba(239, 68, 68, 0.2); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .loader-red { width: 32px; height: 32px; border: 4px solid #ef4444; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(239, 68, 68, 0.3); border-radius: 10px; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function directorateControl() {
            return {
                view: 'loading',
                broadcastInput: '',
                currentTime: '',
                sessionStart: null,
                sessionDuration: '00:00',
                liveMessages: [],
                stats: { activeOperatives: 14, systemIntegrity: 'SECURED' },
                wealthIndex: { value: '1.2M', growth: '+14.2%', currency: 'MOGV' },

                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    
                    // SECURITY PROTOCOL: Hard Wall Redirection
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session || session.user.email !== 'director.mog@gmail.com') {
                        window.location.href = 'index.html';
                        return;
                    }

                    this.view = 'active';
                    this.sessionStart = Date.now();
                    
                    // Initialize Data Streams
                    this.loadLiveFeed();
                    this.subscribeToGrid();
                    
                    // Global Timers
                    setInterval(() => { this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); }, 1000);
                    setInterval(() => {
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);

                    this.$nextTick(() => lucide.createIcons());
                },

                async loadLiveFeed() {
                    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(5);
                    if (data) this.liveMessages = data;
                },

                subscribeToGrid() {
                    sb.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.liveMessages.unshift(payload.new);
                        if (this.liveMessages.length > 5) this.liveMessages.pop();
                    }).subscribe();
                },

                async sendBroadcast() {
                    if (!this.broadcastInput.trim()) return;
                    const { error } = await sb.from('broadcasts').insert({ 
                        content: this.broadcastInput.toUpperCase(), 
                        created_by: 'DIRECTOR' 
                    });
                    if (!error) {
                        alert('GLOBAL ALERT SYNCHRONIZED');
                        this.broadcastInput = '';
                    } else {
                        alert('TRANSMISSION ERROR: CHECK DATABASE');
                    }
                },

                async loginWithGoogle() {
                    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/directorate.html' } });
                },

                logout() { sb.auth.signOut(); window.location.href = 'index.html'; }
            }
        }
    </script>
</head>
<body x-data="directorateControl()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-red-500/30">

    <div class="bg-grid-red fixed inset-0 opacity-10"></div>

    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-10 relative animate-fade-in">
            
            <header class="p-10 glass-red rounded-[3rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-12 shadow-2xl">
                <div class="flex items-center gap-8">
                    <button onclick="window.location.href='index.html'" class="p-5 bg-white/5 rounded-2xl border border-white/10 hover:border-gold transition-all shadow-lg">
                        <i data-lucide="chevron-left" class="text-gold w-8 h-8"></i>
                    </button>
                    <div>
                        <h1 class="text-4xl font-black uppercase tracking-tighter italic text-red-500">Directorate HQ</h1>
                        <p class="text-[12px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-2">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-10 text-right">
                    <div class="border-r border-red-500/20 pr-10 hidden md:block">
                        <p class="text-3xl font-black terminal-font text-white" x-text="currentTime"></p>
                        <p class="text-[10px] text-red-500 uppercase font-black tracking-widest" x-text="'CLEARANCE: MASTER ADMIN'"></p>
                    </div>
                    <div class="flex gap-4">
                        <button @click="loginWithGoogle()" class="p-5 border border-white/10 text-gold/50 rounded-2xl hover:text-gold transition-all">
                            <i data-lucide="chrome" class="w-6 h-6"></i>
                        </button>
                        <button @click="logout()" class="p-5 border border-red-500/30 text-red-500 rounded-2xl hover:bg-red-500/10 transition-all">
                            <i data-lucide="power" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                
                <div class="lg:col-span-2 space-y-12">
                    
                    <div class="glass-red p-12 rounded-[4rem] shadow-2xl space-y-10 border-t-4 border-red-600/50">
                        <div class="flex items-center gap-6 border-b border-red-500/10 pb-8">
                            <div class="p-5 bg-red-600 rounded-[2rem] text-white shadow-xl shadow-red-600/40">
                                <i data-lucide="radio" class="animate-pulse w-10 h-10"></i>
                            </div>
                            <h3 class="text-2xl font-black uppercase italic tracking-widest">Global Directive</h3>
                        </div>
                        
                        <textarea x-model="broadcastInput" 
                            class="w-full h-72 bg-black/40 border border-red-500/10 p-10 rounded-[3rem] outline-none text-[15px] uppercase terminal-font leading-relaxed focus:border-red-500/50 transition-all placeholder:text-zinc-800"
                            placeholder="Enter directive for all operative grids..."></textarea>
                        
                        <div class="flex justify-end">
                            <button @click="sendBroadcast()" 
                                class="px-16 py-7 bg-red-600 text-white font-black uppercase rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all text-sm tracking-[0.2em]">
                                Execute Transmission
                            </button>
                        </div>
                    </div>

                    <div class="glass p-12 rounded-[3.5rem] border border-white/5 space-y-8 shadow-inner">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-black uppercase tracking-[0.3em] text-gold flex items-center gap-3 italic">
                                <i data-lucide="activity" class="w-5 h-5"></i> Operative Intelligence
                            </h3>
                            <span class="text-[10px] text-zinc-600 font-black uppercase tracking-widest">eMalahleni Sector</span>
                        </div>
                        <div class="space-y-4 max-h-80 overflow-y-auto custom-scrollbar">
                            <template x-for="msg in liveMessages" :key="msg.id">
                                <div class="p-5 bg-white/[0.02] border-l-4 border-red-600 rounded-r-2xl flex justify-between items-center transition-all hover:bg-white/[0.05]">
                                    <div>
                                        <p class="text-[8px] text-zinc-500 font-black uppercase tracking-widest" x-text="msg.username"></p>
                                        <p class="text-[12px] text-zinc-200 terminal-font mt-1" x-text="msg.content"></p>
                                    </div>
                                    <span class="text-[10px] text-zinc-700 font-black terminal-font" x-text="new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="space-y-12">
                    
                    <div class="glass-red p-12 rounded-[6rem] text-center relative group shadow-[0_0_80px_rgba(212,175,55,0.05)]">
                        <div class="absolute inset-0 bg-radial-gradient from-red-600/5 to-transparent"></div>
                        
                        <div class="w-full aspect-square mx-auto relative z-10 transition-transform duration-1000 group-hover:rotate-12 group-hover:scale-105">
                            <img src="assets/images/1000219947.png" alt="MOG DIRECTORATE SEAL" class="w-full h-full object-contain filter drop-shadow-[0_0_30px_rgba(239,68,68,0.2)]">
                            <div class="absolute inset-0 border-8 border-gold/5 rounded-full animate-pulse"></div>
                        </div>

                        <div class="pt-12 border-t border-red-500/10 mt-12 relative z-10">
                            <h3 class="text-3xl font-black uppercase italic tracking-tighter">Command Seal</h3>
                            <p class="text-[10px] text-zinc-500 uppercase font-black tracking-widest mt-4">Authorized Admin Point // 2026</p>
                        </div>
                    </div>

                    <div class="glass-red p-12 rounded-[4rem] text-center border-gold/30 shadow-2xl relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4"><i data-lucide="trending-up" class="text-gold w-6 h-6 opacity-20"></i></div>
                        <h4 class="text-[11px] font-black uppercase text-gold tracking-[0.5em] mb-6 italic">Brand Wealth Index</h4>
                        <div class="space-y-2">
                            <p class="text-6xl font-black text-white terminal-font" x-text="wealthIndex.value"></p>
                            <p class="text-[12px] font-black text-green-500 uppercase tracking-widest" x-text="wealthIndex.growth + ' MOGV GAIN'"></p>
                        </div>
                    </div>

                    <div class="glass p-10 rounded-[3rem] border border-white/5 space-y-5 shadow-xl">
                        <div class="flex justify-between items-center text-[10px] font-black uppercase">
                            <span class="text-zinc-500">Operatives Active</span>
                            <span class="text-white" x-text="stats.activeOperatives"></span>
                        </div>
                        <div class="w-full h-1 bg-white/5 rounded-full"><div class="h-full bg-red-600 w-3/4 rounded-full"></div></div>
                        <div class="flex justify-between items-center text-[10px] font-black uppercase">
                            <span class="text-zinc-500">Grid Integrity</span>
                            <span class="text-green-500" x-text="stats.systemIntegrity"></span>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-24 pt-12 border-t border-white/5 text-center text-zinc-600">
                <p class="text-[12px] uppercase font-black tracking-[0.6em] italic">NCC MASTER SYSTEM v3.0 // SECURED DIRECTORATE CHANNEL</p>
                <div class="flex justify-center gap-12 mt-10 opacity-20">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                    <i data-lucide="fingerprint" class="w-6 h-6"></i>
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                    <i data-lucide="lock" class="w-6 h-6"></i>
                </div>
            </footer>
        </div>
    </template>

    <template x-if="view === 'loading'">
        <div class="h-screen w-full flex flex-col items-center justify-center space-y-8">
            <div class="loader-red"></div>
            <p class="text-[12px] font-black text-red-500 uppercase tracking-[0.5em] animate-pulse">Authenticating Master Clearance...</p>
        </div>
    </template>

</body>
</html>
