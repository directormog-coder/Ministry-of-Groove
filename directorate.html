<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE HQ | MASTER COMMAND</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="../js/auth.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-red { background-image: radial-gradient(circle, #ef4444 1.5px, transparent 1.5px); background-size: 40px 40px; }
        .glass-red { background: rgba(15, 0, 0, 0.97); backdrop-filter: blur(40px); border: 1px solid rgba(239, 68, 68, 0.3); }
        .glass { background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader-red { width: 40px; height: 40px; border: 4px solid #ef4444; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .scanline-red { width: 100%; height: 100px; background: linear-gradient(0deg, transparent 0%, rgba(239, 68, 68, 0.05) 50%, transparent 100%); position: fixed; top: -100px; left: 0; pointer-events: none; animation: moveScanline 6s linear infinite; z-index: 100; }
        @keyframes moveScanline { from { top: -100px; } to { top: 100vh; } }
        .terminal-font { font-family: 'Courier New', monospace; }
        .text-gold { color: #ffd700; }
    </style>

    <script>
        function commandCenter() {
            return {
                view: 'gate',
                broadcastInput: '',
                operatives: [],
                liveActivity: [],
                wealth: '1.4M',
                currentTime: '',
                sessionDuration: '00:00',
                sessionStart: null,
                isLoading: false,

                async init() {
                    // 1. CLEARANCE CHECK
                    const role = localStorage.getItem('userRole');
                    if (role !== 'director') {
                        console.error("UNAUTHORIZED ACCESS DETECTED");
                        window.location.href = '/index.html';
                        return;
                    }

                    // 2. SESSION INITIALIZATION
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session) {
                        window.location.href = '/login.html';
                        return;
                    }

                    this.view = 'active';
                    this.sessionStart = Date.now();
                    this.startClock();
                    await this.loadSecureData();
                    
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadSecureData() {
                    this.isLoading = true;
                    try {
                        // Load Operatives
                        const { data: ops } = await sb.from('profiles').select('*').limit(10);
                        if (ops) this.operatives = ops;

                        // Load Messages/Logs
                        const { data: logs } = await sb.from('messages').select('*').order('created_at', {ascending: false}).limit(8);
                        if (logs) this.liveActivity = logs;
                    } catch (e) {
                        console.error("Signal weak: Data retrieval failed.");
                    } finally {
                        this.isLoading = false;
                    }
                },

                async sendBroadcast() {
                    if (!this.broadcastInput.trim()) return;
                    this.isLoading = true;
                    try {
                        const { error } = await sb.from('directives').insert({
                            content: this.broadcastInput,
                            issued_by: 'DIRECTOR',
                            timestamp: new Date().toISOString()
                        });
                        if (error) throw error;
                        alert('GLOBAL DIRECTIVE SYNCHRONIZED');
                        this.broadcastInput = '';
                        await this.loadSecureData();
                    } catch (e) {
                        alert('TRANSMISSION FAILED');
                    } finally {
                        this.isLoading = false;
                    }
                },

                startClock() {
                    setInterval(() => {
                        this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false });
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);
                },

                async logout() {
                    await sb.auth.signOut();
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
</head>
<body x-data="commandCenter()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="scanline-red"></div>
    <div class="bg-grid-red fixed inset-0 z-0 opacity-10"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <div class="loader-red"></div>
            <p class="terminal-font text-[12px] text-red-500 animate-pulse uppercase tracking-[0.5em]">Establishing High-Clearance Uplink...</p>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-10 relative">
            
            <header class="p-10 glass-red rounded-[3rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl">
                <div class="flex items-center gap-8">
                    <button onclick="window.location.href='/index.html'" class="p-6 bg-white/5 rounded-[2rem] border border-white/10 hover:border-gold transition-all">
                        <i data-lucide="chevron-left" class="text-gold w-8 h-8"></i>
                    </button>
                    <div>
                        <h1 class="text-4xl font-black uppercase italic tracking-tighter text-red-600">Directorate HQ</h1>
                        <p class="text-[11px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-2 italic">MASTER COMMAND // SECTOR 7G ARCHIVE</p>
                    </div>
                </div>
                <div class="text-right flex items-center gap-12">
                    <div class="hidden md:block">
                        <p class="text-4xl font-black terminal-font text-white" x-text="currentTime"></p>
                        <p class="text-[10px] text-red-600 uppercase font-black tracking-widest text-right" x-text="'SESSION: ' + sessionDuration"></p>
                    </div>
                    <button @click="logout()" class="p-6 border border-red-600/30 text-red-600 rounded-[2.5rem] hover:bg-red-600 hover:text-white transition-all">
                        <i data-lucide="power" class="w-8 h-8"></i>
                    </button>
                </div>
            </header>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <div class="space-y-12">
                    <div class="glass-red p-12 rounded-[6rem] text-center border border-gold/20 shadow-2xl relative overflow-hidden group">
                        <img src="../assets/images/1000219947.png" alt="SEAL" class="w-full aspect-square object-contain mb-8 filter drop-shadow-[0_0_40px_rgba(239,68,68,0.5)]">
                        <div class="pt-8 border-t border-red-600/20">
                            <h3 class="text-2xl font-black uppercase italic tracking-tighter text-gold">Directorate Seal</h3>
                        </div>
                    </div>

                    <div class="glass-red p-12 rounded-[4rem] text-center border border-gold/30">
                        <h4 class="terminal-font text-[12px] text-gold mb-6 italic">Brand Wealth Index</h4>
                        <p class="text-7xl font-black text-white terminal-font tracking-tighter" x-text="wealth"></p>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-12">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-8">
                        <template x-for="node in [
                            {i:'layout-grid', l:'Hub', u:'/index.html', c:'text-gold'}, 
                            {i:'user-cog', l:'Dossier', u:'/pages/dossier.html', c:'text-green-500'}, 
                            {i:'camera', l:'Gallery', u:'/pages/gallery.html', c:'text-purple-500'}, 
                            {i:'activity', l:'Freq', u:'/pages/frequency.html', c:'text-gold'}, 
                            {i:'radio', l:'Dispatch', u:'/pages/dispatch.html', c:'text-red-500'}, 
                            {i:'lock', l:'Vault', u:'/pages/archives.html', c:'text-zinc-500'}
                        ]" :key="node.l">
                            <div @click="window.location.href=node.u" class="glass-red p-10 rounded-[3.5rem] text-center border border-white/5 hover:border-white transition-all cursor-pointer">
                                <div :class="node.c" class="mb-4">
                                    <i :data-lucide="node.i" class="mx-auto w-10 h-10"></i>
                                </div>
                                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-white" x-text="node.l"></span>
                            </div>
                        </template>
                    </div>

                    <div class="glass-red p-16 rounded-[5rem] border border-red-600/30 shadow-2xl space-y-12">
                        <div class="flex items-center gap-8">
                            <div class="p-6 bg-red-600 rounded-[2.5rem] text-white"><i data-lucide="zap" class="w-14 h-14"></i></div>
                            <div>
                                <h3 class="text-4xl font-black uppercase italic tracking-widest text-white">Execute Directive</h3>
                            </div>
                        </div>
                        <textarea x-model="broadcastInput" class="w-full h-64 bg-black/40 border border-red-600/10 p-10 rounded-[4rem] outline-none text-[20px] terminal-font text-white resize-none" placeholder="TRANSMIT MASTER ORDER..."></textarea>
                        <div class="flex justify-end">
                            <button @click="sendBroadcast()" :disabled="isLoading" class="px-24 py-9 bg-red-600 text-white font-black uppercase rounded-full shadow-2xl disabled:opacity-50">
                                <span x-text="isLoading ? 'TRANSMITTING...' : 'Synchronize Grid'"></span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

</body>
</html>
