<section x-data="directorate">
    <header class="p-6 border-b border-gold">
        <h1 class="text-xl">DIRECTORATE HUB // PRIVILEGED ACCESS</h1>
    </header>
    
    <div class="p-6 grid gap-8">
        <div class="border border-red-900 p-4">
            <h3 class="text-red-500 mb-4">ACTIVE SANCTIONS</h3>
            <input type="text" placeholder="Operative ID" class="bg-transparent border border-gold p-2 w-full mb-2">
            <button @click="issueSanction" class="w-full bg-red-900 text-white py-2">TERMINATE SIGNAL</button>
        </div>

        <div class="border border-gold p-4">
            <h3>BROADCAST SIGNAL</h3>
            <textarea class="bg-transparent border border-gold w-full mt-2 p-2" rows="4"></textarea>
            <button class="mt-2 border border-gold px-4 py-1 hover:bg-gold hover:text-noir">SEND TO ALL</button>
        </div>
    </div>
</section>
