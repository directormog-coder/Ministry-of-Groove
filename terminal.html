<section class="glass p-8 rounded-[3rem] space-y-4">
    <h3 class="text-xs font-black uppercase text-gold italic">Chart_Manager_Module</h3>
    <div class="space-y-2">
        <input x-model="newTrackTitle" placeholder="SONG_TITLE..." class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-white outline-none">
        <input x-model="newTrackArtist" placeholder="ARTIST_NAME..." class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-white outline-none">
        <button @click="addTrack()" class="w-full py-4 bg-gold text-black font-black rounded-xl">Inject into Charts</button>
    </div>
    <button @click="resetCharts()" class="w-full py-2 text-red-500 text-[8px] uppercase font-bold border border-red-900/20 rounded-lg">Reset Weekly Votes</button>
</section>

<script>
// Inside terminal() function
async addTrack() {
    if(!this.newTrackTitle || !this.newTrackArtist) return;
    await mog_sb.from('chart_tracks').insert([{ 
        title: this.newTrackTitle.toUpperCase(), 
        artist: this.newTrackArtist.toUpperCase() 
    }]);
    this.newTrackTitle = ''; this.newTrackArtist = '';
    alert("TRACK_INJECTED");
},
async resetCharts() {
    if(confirm("WIPE ALL VOTES FOR NEW WEEK?")) {
        await mog_sb.from('chart_tracks').update({ votes: 0 }).neq('id', '00000000-0000-0000-0000-000000000000');
        alert("CHARTS_RESET");
    }
}
</script>
