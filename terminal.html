<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DIRECTORATE TERMINAL | MOG HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>body { background: #050505; color: #D4AF37; font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body x-data="terminal()" x-init="init()" class="p-6">
    <template x-if="authenticated">
        <main class="max-w-5xl mx-auto space-y-6">
            <header class="flex justify-between items-center bg-white/5 p-6 rounded-3xl border border-gold/20">
                <h1 class="text-xs font-black text-white">COMMAND_CENTER [ACTIVE]</h1>
                <button @click="logout()" class="text-red-500"><i data-lucide="power"></i></button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <section class="bg-white/5 p-8 rounded-[2rem] border border-white/10">
                    <h3 class="text-[10px] font-black text-white mb-4">Live Operatives</h3>
                    <div class="space-y-2 max-h-64 overflow-y-auto">
                        <template x-for="op in operatives">
                            <div class="flex justify-between items-center p-3 bg-black/40 rounded-xl">
                                <span class="text-[10px] font-bold" x-text="op.username"></span>
                                <button @click="sanction(op.username)" class="text-red-500 text-[8px] font-black">SANCTION</button>
                            </div>
                        </template>
                    </div>
                </section>

                <section class="bg-white/5 p-8 rounded-[2rem] space-y-4">
                    <h3 class="text-[10px] font-black text-white">Emergency Uplink</h3>
                    <input x-model="newsMsg" placeholder="BROADCAST_MSG..." class="w-full bg-black p-4 rounded-xl text-[10px] outline-none border border-gold/10">
                    <button @click="sendNews()" class="w-full py-4 bg-gold text-black font-black text-[10px] rounded-xl">Transmit Signal</button>
                    <button @click="purge()" class="w-full py-2 border border-red-500/30 text-red-500 text-[8px] font-black uppercase rounded-lg">Execute Binary Purge</button>
                </section>
            </div>
        </main>
    </template>

    <template x-if="!authenticated">
        <div class="h-screen flex flex-col items-center justify-center space-y-4">
            <input x-model="loginEmail" type="email" placeholder="DIRECTOR_ID..." class="bg-white/5 p-4 rounded-xl text-center outline-none border border-gold/20">
            <input x-model="loginPass" type="password" placeholder="PROTOCOL_KEY..." class="bg-white/5 p-4 rounded-xl text-center outline-none border border-gold/20">
            <button @click="verify()" class="bg-gold text-black px-10 py-4 rounded-full font-black text-[10px]">Authorize</button>
        </div>
    </template>

    <script>
        function terminal() {
            return {
                authenticated: false, loginEmail: '', loginPass: '', newsMsg: '', operatives: [],
                async init() {
                    if(sessionStorage.getItem('mog_terminal_auth') === 'true') {
                        this.authenticated = true;
                        this.sync();
                        setInterval(() => this.sync(), 15000);
                    }
                    this.$nextTick(() => lucide.createIcons());
                },
                async verify() {
                    if(this.loginEmail === 'director.mog@gmail.com' && this.loginPass === '@MOGProtocol2026') {
                        this.authenticated = true;
                        sessionStorage.setItem('mog_terminal_auth', 'true');
                        localStorage.setItem('mog_handle', 'DIRECTORATE');
                        location.reload();
                    }
                },
                async sync() {
                    const { data } = await mog_sb.from('presence').select('username').gt('last_seen', new Date(Date.now() - 300000).toISOString());
                    this.operatives = data || [];
                },
                async sendNews() {
                    await mog_sb.from('broadcasts').insert([{ message: this.newsMsg.toUpperCase(), title: 'SYSTEM_ALERT' }]);
                    this.newsMsg = '';
                },
                async sanction(user) {
                    await mog_sb.from('blacklisted_operatives').insert([{ username: user }]);
                    this.sync();
                },
                async purge() {
                    if(confirm("WIPE ALL DATA?")) await mog_sb.rpc('purge_grid_messages');
                },
                logout() { sessionStorage.clear(); localStorage.clear(); location.reload(); }
            }
        }
    </script>
</body>
</html>
