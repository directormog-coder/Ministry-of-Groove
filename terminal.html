<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE TERMINAL | MOG HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { background: #050505; color: #D4AF37; font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(15px); }
    </style>
</head>
<body x-data="terminal()" x-init="init()" class="p-6">
    <template x-if="!authenticated">
        <div class="h-screen flex flex-col items-center justify-center space-y-4">
            <h2 class="text-xs font-black tracking-widest uppercase text-white">Directorate Secure Access</h2>
            <input x-model="loginEmail" type="email" placeholder="DIRECTOR_ID..." class="w-full max-w-xs bg-white/5 border border-gold/20 p-4 rounded-xl text-center text-[10px] outline-none">
            <input x-model="loginPass" type="password" placeholder="PROTOCOL_KEY..." class="w-full max-w-xs bg-white/5 border border-gold/20 p-4 rounded-xl text-center text-[10px] outline-none">
            <button @click="verifyAccess()" class="w-full max-w-xs py-4 bg-gold text-black font-black text-[10px] rounded-full">Authorize Terminal</button>
        </div>
    </template>

    <template x-if="authenticated">
        <main class="max-w-4xl mx-auto space-y-6">
            <header class="flex justify-between items-center glass p-5 rounded-3xl">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full">
                    <h1 class="font-black italic text-white">MOG_COMMAND_CENTER</h1>
                </div>
                <button @click="logout()" class="p-3 text-red-500 bg-red-900/10 rounded-xl"><i data-lucide="power"></i></button>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <section class="glass p-6 rounded-[2.5rem]">
                    <h3 class="text-[9px] font-black text-white mb-4 italic">Active Operatives</h3>
                    <div class="space-y-2 max-h-64 overflow-y-auto">
                        <template x-for="op in operatives" :key="op.username">
                            <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                                <span class="text-[10px] font-bold" x-text="op.username"></span>
                                <button @click="sanctionUser(op.username)" class="text-red-500 text-[8px] font-black border border-red-500/20 px-2 py-1 rounded">TERMINATE</button>
                            </div>
                        </template>
                    </div>
                </section>

                <section class="glass p-6 rounded-[2.5rem] flex flex-col justify-center items-center space-y-4">
                    <h3 class="text-red-500 text-[9px] font-black">EMERGENCY PROTOCOLS</h3>
                    <button @click="confirmPurge()" class="w-full py-6 bg-red-600/10 border border-red-600/40 text-red-500 rounded-3xl font-black text-[10px]">PURGE GRID MESSAGES</button>
                </section>
            </div>
        </main>
    </template>

    <script>
        function terminal() {
            return {
                authenticated: false, loginEmail: '', loginPass: '', operatives: [],
                async init() {
                    if(sessionStorage.getItem('mog_terminal_auth') === 'true') {
                        this.authenticated = true;
                        this.sync();
                    }
                    lucide.createIcons();
                },
                async verifyAccess() {
                    if(this.loginEmail === 'director.mog@gmail.com' && this.loginPass === '@MOGProtocol2026') {
                        this.authenticated = true;
                        sessionStorage.setItem('mog_terminal_auth', 'true');
                        localStorage.setItem('mog_handle', 'DIRECTORATE');
                        this.sync();
                    }
                },
                async sync() {
                    const { data } = await mog_sb.from('presence').select('username').gt('last_seen', new Date(Date.now() - 300000).toISOString());
                    this.operatives = data || [];
                },
                async sanctionUser(target) {
                    if(!confirm(`TERMINATE ${target}?`)) return;
                    await mog_sb.from('blacklisted_operatives').insert([{ username: target, reason: 'DIRECTORATE_TERMINATION' }]);
                    this.sync();
                },
                async confirmPurge() {
                    if(!confirm("PURGE ALL DATA?")) return;
                    await mog_sb.rpc('purge_grid_messages');
                    alert("GRID_WIPED");
                },
                logout() { sessionStorage.clear(); localStorage.clear(); location.reload(); }
            }
        }
    </script>
</body>
</html>
