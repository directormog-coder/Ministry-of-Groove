<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL | Ministry of Groove</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="CSS/style.css">
    <style>
        .terminal-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: var(--gold);
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .terminal-line { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-black text-white min-h-screen">
    <div class="max-w-4xl mx-auto p-4 h-screen flex flex-col">
        <header class="flex items-center gap-4 mb-4 pb-4 border-b border-gold/20">
            <button onclick="history.back()" class="p-2 glass rounded-full hover:bg-white/10 transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4 text-gold"></i>
            </button>
            <div class="flex-1">
                <h1 class="text-sm font-black uppercase tracking-widest terminal-font text-gold">NCC_MASTER_TERMINAL</h1>
                <p class="text-[10px] text-zinc-500 terminal-font">v2.6.0 | SECURE CONNECTION</p>
            </div>
            <div class="flex gap-2">
                <span class="px-2 py-1 bg-green-500/20 text-green-400 text-[10px] rounded border border-green-500/30">ONLINE</span>
            </div>
        </header>

        <div id="terminal-output" class="flex-1 overflow-y-auto space-y-1 p-4 glass rounded-2xl terminal-font text-[12px] mb-4">
            <div class="text-gold">[SYSTEM] Ministry of Groove Terminal initialized...</div>
            <div class="text-zinc-500">[SYSTEM] Loading secure modules...</div>
            <div class="text-zinc-500">[SYSTEM] Connection established.</div>
            <div class="text-white mt-2">Type 'help' for available commands.</div>
            <div class="text-white mt-2"><span class="text-gold">➜</span> <span id="current-line"></span><span class="terminal-cursor"></span></div>
        </div>

        <form id="terminal-form" class="flex gap-2">
            <span class="text-gold py-3 px-4 terminal-font text-sm">➜</span>
            <input type="text" id="terminal-input" 
                   class="flex-1 bg-transparent border-none outline-none text-white terminal-font text-sm placeholder-zinc-700" 
                   placeholder="Enter command..." 
                   autocomplete="off" 
                   autofocus>
        </form>
    </div>

    <script>
        lucide.createIcons();
        
        const terminal = {
            history: [],
            historyIndex: -1,
            
            commands: {
                help: () => `Available commands:
  help       - Show this help message
  clear      - Clear terminal
  status     - System status
  time       - Current server time
  whoami     - Current operative
  logout     - Terminate session
  grid       - Access Grid chat
  vault      - Access archives
  dossier    - View profile`,
                
                clear: () => { document.getElementById('terminal-output').innerHTML = ''; return ''; },
                
                status: () => `[SYSTEM] All systems operational
[GRID]   Connected
[VAULT]  Secure
[AUTH]   Validated
[UPTIME] ${Math.floor(Math.random() * 99)}d ${Math.floor(Math.random() * 24)}h ${Math.floor(Math.random() * 60)}m`,
                
                time: () => new Date().toISOString(),
                
                whoami: () => `Current operative: GUEST
Clearance: STANDARD
Session: ACTIVE`,
                
                logout: () => { setTimeout(() => window.location.href = 'index.html', 1000); return 'Terminating session...'; },
                
                grid: () => { setTimeout(() => window.location.href = 'index.html', 500); return 'Redirecting to Grid...'; },
                
                vault: () => { setTimeout(() => window.location.href = 'archives.html', 500); return 'Accessing Vault...'; },
                
                dossier: () => { setTimeout(() => window.location.href = 'dossier.html', 500); return 'Loading Dossier...'; }
            },
            
            execute(cmd) {
                const command = cmd.toLowerCase().trim();
                if (!command) return;
                
                this.history.push(command);
                this.historyIndex = this.history.length;
                
                const output = document.getElementById('terminal-output');
                
                // Add command line
                const cmdLine = document.createElement('div');
                cmdLine.className = 'text-white';
                cmdLine.innerHTML = `<span class="text-gold">➜</span> ${cmd}`;
                output.appendChild(cmdLine);
                
                // Execute command
                if (this.commands[command]) {
                    const result = this.commands[command]();
                    if (result) {
                        const resultLines = result.split('\n');
                        resultLines.forEach(line => {
                            const resultDiv = document.createElement('div');
                            resultDiv.className = 'text-zinc-400 ml-4';
                            resultDiv.textContent = line;
                            output.appendChild(resultDiv);
                        });
                    }
                } else {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'text-red-400 ml-4';
                    errorDiv.textContent = `Command not found: ${cmd}. Type 'help' for available commands.`;
                    output.appendChild(errorDiv);
                }
                
                // Add new prompt
                const promptDiv = document.createElement('div');
                promptDiv.className = 'text-white mt-2';
                promptDiv.innerHTML = '<span class="text-gold">➜</span> <span id="current-line"></span><span class="terminal-cursor"></span>';
                output.appendChild(promptDiv);
                
                output.scrollTop = output.scrollHeight;
            }
        };

        document.getElementById('terminal-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('terminal-input');
            terminal.execute(input.value);
            input.value = '';
        });

        // Focus input on load
        document.getElementById('terminal-input').focus();
    </script>
</body>
</html>
