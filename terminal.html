<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE TERMINAL | MOG HQ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // High-Priority Auth Guard
        if (!sessionStorage.getItem('mog_terminal_auth')) {
            window.location.href = 'index.html';
        }

        // Initialize Global Client
        window.MOG_CONFIG = {
            url: 'https://quzwygjbqpkuqjhrmsjp.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU'
        };
        window.mog = window.supabase.createClient(window.MOG_CONFIG.url, window.MOG_CONFIG.key);
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body x-data="terminal()" x-init="init()" class="bg-black text-gold p-6 min-h-screen">
    <div class="scanline"></div>

    <main class="max-w-xl mx-auto space-y-6 pb-24">
        <header class="glass p-6 rounded-[2rem] flex justify-between items-center border-gold/20">
            <div>
                <h1 class="font-black italic text-white uppercase text-xs leading-none">MOG_COMMAND</h1>
                <p class="text-[6px] text-gold/50 uppercase font-black mt-1">Status: Uplink_Stable</p>
            </div>
            <div class="flex gap-4 items-center">
                <div class="text-right">
                    <p class="text-[6px] uppercase text-gold/40">Grid Load</p>
                    <p class="text-[10px] font-black terminal-font" x-text="stats.messages + ' SIGS'"></p>
                </div>
                <button @click="logout()" class="p-2 bg-red-900/20 text-red-500 rounded-lg"><i data-lucide="power" size="16"></i></button>
            </div>
        </header>

        <section class="glass p-6 rounded-[2.5rem] border-red-600/20">
            <h2 class="text-[8px] font-black uppercase text-red-500 mb-4 italic tracking-widest">Global Lockdown</h2>
            <button @click="toggleLockdown()" :class="isLockdown ? 'bg-red-600 text-white' : 'bg-white/5 text-red-500'" class="w-full py-6 rounded-2xl border border-red-900/30 transition-all flex flex-col items-center gap-2">
                <i data-lucide="shield-alert" :class="isLockdown ? 'animate-pulse' : ''" size="24"></i>
                <span class="text-[9px] font-black uppercase" x-text="isLockdown ? 'Release Lockdown' : 'Initiate Lockdown'"></span>
            </button>
        </section>

        <section class="glass p-8 rounded-[3rem] border-gold/10">
            <h3 class="text-[8px] font-black uppercase text-white mb-4 italic">Operative Sanction</h3>
            <div class="space-y-3">
                <input x-model="target" placeholder="TARGET_HANDLE..." class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[10px] text-white terminal-font outline-none uppercase">
                <button @click="sanction()" class="w-full py-4 bg-red-600 text-white font-black text-[10px] uppercase rounded-full">Terminate Signal</button>
            </div>
        </section>

        <section class="glass p-8 rounded-[3rem] border-yellow-500/20">
            <h3 class="text-[8px] font-black uppercase text-yellow-500 mb-4 italic">Yellow Alert Warning</h3>
            <div class="space-y-3">
                <input x-model="wTarget" placeholder="RECIPIENT_ID..." class="w-full bg-black/40 border border-yellow-500/20 p-4 rounded-xl text-[10px] text-white terminal-font outline-none uppercase">
                <input x-model="wMsg" placeholder="WARNING_DATA..." class="w-full bg-black/40 border border-yellow-500/20 p-4 rounded-xl text-[10px] text-white terminal-font outline-none uppercase">
                <button @click="sendWarning()" class="w-full py-4 bg-yellow-600 text-black font-black text-[10px] uppercase rounded-full">Issue Warning</button>
            </div>
        </section>

        <button @click="confirmPurge()" class="w-full py-4 glass border-gold/5 text-gold/30 font-black text-[8px] uppercase rounded-xl hover:text-red-500 transition-colors">
            Wipe Grid History (Purge)
        </button>
    </main>

    <script>
        function terminal() {
            return {
                target: '', wTarget: '', wMsg: '', isLockdown: false, stats: { messages: 0 },
                async init() {
                    this.sync();
                    setInterval(() => this.sync(), 10000);
                    lucide.createIcons();
                },
                async sync() {
                    const { data: st } = await window.mog.from('system_status').select('*').eq('id', 'lockdown').single();
                    this.isLockdown = st?.is_active;
                    
                    const { data: counts } = await window.mog.rpc('get_grid_stats');
                    if(counts) this.stats.messages = counts.find(c => c.table_name === 'messages')?.row_count || 0;
                },
                async toggleLockdown() {
                    this.isLockdown = !this.isLockdown;
                    await window.mog.from('system_status').update({ is_active: this.isLockdown }).eq('id', 'lockdown');
                },
                async sanction() {
                    if(!this.target) return;
                    if(confirm(`TERMINATE SIGNAL FOR ${this.target}?`)) {
                        await window.mog.from('blacklisted_operatives').insert([{ username: this.target.toUpperCase() }]);
                        this.target = '';
                        alert("OPERATIVE_SANCTIONED");
                    }
                },
                async sendWarning() {
                    if(!this.wTarget || !this.wMsg) return;
                    await window.mog.from('warnings').insert([{ recipient: this.wTarget.toUpperCase(), message: this.wMsg.toUpperCase() }]);
                    this.wTarget = ''; this.wMsg = '';
                    alert("SIGNAL_WARNED");
                },
                async confirmPurge() {
                    if(confirm("PURGE ALL MESSAGES? THIS CANNOT BE UNDONE.")) {
                        await window.mog.rpc('purge_grid_messages');
                        this.sync();
                    }
                },
                logout() { sessionStorage.removeItem('mog_terminal_auth'); window.location.href = 'index.html'; }
            }
        }
    </script>
</body>
</html>
