name: Deploy Ministry of Groove

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# FIX: Minimal permissions instead of write-all
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # FIX: Validate inputs properly
      - name: Validate Environment
        id: validate-env
        run: |
          ENV_INPUT="${{ github.event.inputs.environment }}"
          if [ "$ENV_INPUT" != "staging" ] && [ "$ENV_INPUT" != "production" ] && [ "$ENV_INPUT" != "" ]; then
            echo "::error::Invalid environment: $ENV_INPUT"
            exit 1
          fi
          echo "environment=${ENV_INPUT:-production}" >> $GITHUB_OUTPUT

      - name: Build Application
        env:
          DEPLOY_ENV: ${{ steps.validate-env.outputs.environment }}
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
