name: MOG Security Protocol

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # This tells GitHub to use the newer runner engine
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Using 20 for stability; it will run on Node 24 runner via the ENV flag above

      - name: Ensure Lockfile and Audit
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Lockfile missing, generating one..."
            npm install --package-lock-only
          fi
          npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run ESLint
        run: |
          npm install
          npx eslint js/ --ext .js || true
        continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          npm install
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ministry-of-groove'
          path: '.'
          out: 'reports' # Added output directory
          format: 'JSON'
        continue-on-error: true
        
