name: MOG Security Protocol

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies and generate lock file
        run: |
          npm install
          npm shrinkwrap
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Create ESLint config
        run: |
          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "extends": "eslint:recommended",
            "parserOptions": {
              "ecmaVersion": "latest",
              "sourceType": "module"
            },
            "rules": {
              "no-unused-vars": "warn",
              "no-console": "off",
              "no-undef": "warn"
            },
            "globals": {
              "Alpine": "readonly",
              "supabase": "readonly",
              "lucide": "readonly",
              "MOGAuth": "readonly",
              "window": "readonly",
              "document": "readonly",
              "console": "readonly",
              "localStorage": "readonly",
              "fetch": "readonly",
              "navigator": "readonly",
              "setTimeout": "readonly",
              "setInterval": "readonly",
              "clearInterval": "readonly",
              "Date": "readonly",
              "Math": "readonly",
              "JSON": "readonly",
              "Promise": "readonly",
              "Error": "readonly"
            }
          }
          EOF
      
      - name: Install ESLint
        run: npm install -g eslint@latest
        
      - name: Run ESLint
        run: |
          if [ -d "js" ]; then
            eslint js/ --ext .js || true
          else
            echo "No js directory found, skipping"
          fi
        continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'ministry-of-groove'
          path: '.'
          format: 'JSON'
          args: >
            --enableRetired
            --enableExperimental
        continue-on-error: true
      
      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
