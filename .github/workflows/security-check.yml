name: Security & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Check for secrets in code
      - name: Secret Detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # Check file sizes (prevent large file commits)
      - name: Check file sizes
        run: |
          find . -type f -size +10M | grep -v node_modules | grep -v .git && echo "❌ Files larger than 10MB found!" && exit 1 || echo "✅ File sizes OK"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run build test
        run: npm run build
        
      - name: Check for uncommitted env files
        run: |
          if grep -r "SUPABASE_ANON_KEY=" . --include="*.html" --include="*.js" | grep -v "{{SUPABASE_ANON_KEY}}"; then
            echo "❌ Hardcoded secrets detected!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"
