name: MOG Security Protocol

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# FIX: Replace write-all with minimal required permissions (CKV2_GHA_1)
permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  initialize-security-context:
    name: Initialize Security Context
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

  dependency-audit:
    name: Dependency Audit
    needs: initialize-security-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run NPM Audit
        run: |
          npm audit --audit-level=moderate --json > audit-report.json || true
          cat audit-report.json

      - name: Check for Critical Vulnerabilities
        run: |
          CRITICAL_COUNT=$(npm audit --audit-level=critical --json 2>/dev/null | jq '.metadata.vulnerabilities.critical // 0' || echo "0")
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical vulnerabilities"
            exit 1
          fi

  secret-detection:
    name: Secret Detection
    needs: initialize-security-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIX: Handle BASE/HEAD commit comparison issue
      - name: Get Base Commit
        id: base-commit
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            # For push events, compare with previous commit
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Run TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.base-commit.outputs.base }}
          head: ${{ steps.base-commit.outputs.head }}
          extra_args: --debug --only-verified --fail

      - name: Scan for Hardcoded Secrets (Fallback)
        run: |
          # Additional regex-based scan for common patterns
          ! grep -rE '(password|passwd|pwd|secret|key|token)\s*=\s*["\'][^"\']+["\']' \
            --include="*.js" --include="*.ts" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git . || true

  static-code-analysis:
    name: Static Code Analysis
    needs: initialize-security-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      - name: Run ESLint Security
        run: |
          npm ci
          npx eslint . --ext .js,.jsx,.ts,.tsx --config .eslintrc.security.js || true

  infrastructure-security:
    name: Infrastructure Security
    needs: initialize-security-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ./
          framework: github_actions
          output_format: sarif
          output_file_path: reports/checkov.sarif
          soft_fail: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/checkov.sarif

  supabase-security-audit:
    name: Supabase Security Audit
    needs: initialize-security-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Supabase Config
        run: |
          # Verify no exposed keys in code
          ! grep -r "supabase.*key" --include="*.js" --include="*.ts" . || true
          
          # Check for environment variable usage
          if grep -r "process.env.SUPABASE" --include="*.js" --include="*.ts" .; then
            echo "✓ Supabase credentials properly env-based"
          fi

  dependency-update-check:
    name: Dependency Update Check
    needs: dependency-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Updates
        run: |
          npm outdated || true

      - name: Create Update Issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const outdated = require('child_process').execSync('npm outdated --json || true').toString();
            if (outdated && outdated !== 'null') {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Dependency Update Available',
                body: '```json\n' + outdated + '\n```'
              });
            }

  web-security-assessment:
    name: Web Security Assessment
    needs: [static-code-analysis, secret-detection]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Security Headers Check
        run: |
          # Check for security headers configuration
          if [ -f "security-headers.config.js" ] || grep -r "Content-Security-Policy" .; then
            echo "✓ Security headers configured"
          fi

      - name: Check for Vulnerable Patterns
        run: |
          # Check for common XSS patterns
          ! grep -r "innerHTML.*=" --include="*.js" --include="*.ts" . || echo "::warning::Potential XSS via innerHTML"
          ! grep -r "eval(" --include="*.js" --include="*.ts" . || echo "::error::Dangerous eval() usage detected"

  security-gate:
    name: Security Gate
    needs: [dependency-audit, secret-detection, static-code-analysis, infrastructure-security, supabase-security-audit, web-security-assessment]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Evaluate Security Check Results
        run: |
          echo "Checking security job results..."
          
          # Check if any required job failed
          if [ "${{ needs.dependency-audit.result }}" == "failure" ] || \
             [ "${{ needs.secret-detection.result }}" == "failure" ] || \
             [ "${{ needs.static-code-analysis.result }}" == "failure" ]; then
            echo "::error::SECURITY GATE FAILED - Critical security issues detected"
            exit 1
          fi
          
          echo "✓ Security Gate Passed"

      # FIX: Make Slack notification optional (handles missing secret)
      - name: Notify Slack (Optional)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          MESSAGE="Security Check $STATUS for ${{ github.repository }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$MESSAGE\"}" \
            "$SLACK_WEBHOOK_URL" || echo "Slack notification failed (non-critical)"

      - name: Security Report Summary
        if: always()
        run: |
          echo "## Security Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-code-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ needs.infrastructure-security.result }} |" >> $GITHUB_STEP_SUMMARY
