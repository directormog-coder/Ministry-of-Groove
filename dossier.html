<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Groove | Operative Dossier</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-noir text-gold" x-data="dossierLogic">

    <header class="p-6 border-b border-gold/20 flex justify-between items-center">
        <h1 class="text-sm tracking-[0.3em] uppercase">Operative Rankings</h1>
        <a href="index.html" class="text-[10px] border border-gold/50 px-3 py-1 hover:bg-gold hover:text-noir transition">EXIT DOSSIER</a>
    </header>

    <main class="p-4 max-w-4xl mx-auto">
        <div class="border-2 border-gold p-6 mb-8 bg-gold/5 flex justify-between items-center">
            <div>
                <p class="text-[10px] opacity-50 uppercase">Your Current Status</p>
                <h2 class="text-3xl font-bold" x-text="myStats.rankName || 'RECRUIT'"></h2>
            </div>
            <div class="text-right">
                <p class="text-[10px] opacity-50 uppercase">Signal Strength</p>
                <p class="text-2xl" x-text="myStats.xp + ' GHz'"></p>
            </div>
        </div>

        <div class="space-y-2">
            <template x-for="(op, index) in rankings" :key="op.id">
                <div class="flex items-center justify-between p-4 border border-gold/10 hover:bg-gold/5 transition group">
                    <div class="flex items-center gap-4">
                        <span class="text-xs opacity-30" x-text="'#' + (index + 1)"></span>
                        <div>
                            <p class="uppercase text-sm group-hover:text-white" x-text="op.username"></p>
                            <p class="text-[9px] opacity-50" x-text="op.role"></p>
                        </div>
                    </div>
                    <div class="h-1 w-24 bg-gold/10 overflow-hidden">
                        <div class="h-full bg-gold" :style="`width: ${op.xp_percent}%` transition"></div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
