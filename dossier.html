<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>OPERATIVE DOSSIER | MOG NCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { background: #050505; color: #D4AF37; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .gold-glow { filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4)); }
    </style>
</head>
<body x-data="dossier()" x-init="init()" class="p-6">
    <header class="mb-10 flex items-center justify-between glass p-4 rounded-2xl">
        <button onclick="window.location.href='index.html'" class="p-3"><i data-lucide="chevron-left"></i></button>
        <h1 class="text-[10px] font-black uppercase tracking-[0.4em] text-white">Operative Dossier</h1>
        <div class="w-10"></div>
    </header>

    <main class="max-w-xl mx-auto space-y-6">
        <div class="glass p-8 rounded-[3.5rem] flex flex-col items-center text-center space-y-4">
            <div class="h-24 w-24 rounded-full bg-gold/5 flex items-center justify-center border-2 border-gold/30 gold-glow">
                <img src="logo.png" class="h-full w-full object-cover rounded-full opacity-60">
            </div>
            <div>
                <h2 class="text-2xl font-black uppercase text-white italic" x-text="handle"></h2>
                <span class="px-3 py-1 bg-gold/10 rounded-full text-[8px] font-black uppercase text-gold border border-gold/20" x-text="rank"></span>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="glass p-6 rounded-[2.5rem] text-center">
                <p class="text-[7px] uppercase text-gold/40 mb-1 font-black">Signals</p>
                <p class="text-xl font-black text-white" x-text="signalCount"></p>
            </div>
            <div class="glass p-6 rounded-[2.5rem] text-center">
                <p class="text-[7px] uppercase text-gold/40 mb-1 font-black">Assets</p>
                <p class="text-xl font-black text-white" x-text="assetCount"></p>
            </div>
        </div>

        <div class="space-y-3">
            <button @click="logout()" class="w-full py-5 bg-red-900/10 border border-red-900/30 text-red-500 font-black text-[10px] uppercase rounded-2xl">Terminate Session</button>
        </div>
    </main>

    <script>
        function dossier() {
            return {
                handle: '...', rank: 'LOADING', signalCount: 0, assetCount: 0,
                async init() {
                    this.handle = localStorage.getItem('mog_handle') || 'ANONYMOUS';
                    const { data: stats } = await mog_sb.rpc('get_grid_stats');
                    // Logic to find counts for current user (this would normally be a query)
                    const { count: mCount } = await mog_sb.from('messages').select('*', { count: 'exact', head: true }).eq('username', this.handle);
                    this.signalCount = mCount || 0;
                    
                    this.rank = this.handle === 'DIRECTORATE' ? 'SUPREME_DIRECTOR' : (this.signalCount > 50 ? 'ELITE_OPERATIVE' : 'GRID_SCOUT');
                    lucide.createIcons();
                },
                logout() { localStorage.clear(); sessionStorage.clear(); window.location.href = 'index.html'; }
            }
        }
    </script>
</body>
</html>
