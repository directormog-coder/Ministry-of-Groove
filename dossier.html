<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOSSIER | Ministry of Groove</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body class="bg-black text-white min-h-screen bg-grid">
    <div class="max-w-2xl mx-auto p-6">
        <header class="flex items-center gap-4 mb-8">
            <button onclick="history.back()" class="p-3 glass rounded-full hover:bg-white/10 transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5 text-gold"></i>
            </button>
            <h1 class="text-lg font-black uppercase tracking-widest italic">Operative Dossier</h1>
        </header>

        <div class="glass rounded-[2.5rem] p-8 space-y-6">
            <div class="flex items-center gap-6">
                <div class="h-24 w-24 rounded-full bg-gradient-to-br from-gold/30 to-transparent border-2 border-gold/50 flex items-center justify-center gold-glow">
                    <i data-lucide="user" class="w-10 h-10 text-gold"></i>
                </div>
                <div>
                    <h2 class="text-xl font-black uppercase text-white">OPERATIVE HANDLE</h2>
                    <p class="text-gold/60 text-sm terminal-font">Clearance Level: Standard</p>
                    <div class="flex gap-2 mt-2">
                        <span class="px-3 py-1 bg-green-500/20 text-green-400 text-[10px] uppercase rounded-full border border-green-500/30">Active</span>
                        <span class="px-3 py-1 bg-blue-500/20 text-blue-400 text-[10px] uppercase rounded-full border border-blue-500/30">Grid Access</span>
                    </div>
                </div>
            </div>

            <div class="space-y-4 pt-6 border-t border-white/10">
                <div class="flex justify-between items-center py-3 border-b border-white/5">
                    <span class="text-zinc-500 text-sm uppercase">Operative ID</span>
                    <span class="text-white terminal-font">MOG-2026-8842</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-white/5">
                    <span class="text-zinc-500 text-sm uppercase">Grid Access</span>
                    <span class="text-green-400 text-sm">Authorized</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-white/5">
                    <span class="text-zinc-500 text-sm uppercase">Last Sync</span>
                    <span class="text-white terminal-font" id="lastSync">Just now</span>
                </div>
                <div class="flex justify-between items-center py-3">
                    <span class="text-zinc-500 text-sm uppercase">Status</span>
                    <select class="bg-black/50 border border-gold/30 rounded-lg text-sm text-white px-3 py-1 outline-none">
                        <option>Online</option>
                        <option>Away</option>
                        <option>Busy</option>
                        <option>Deep Cover</option>
                    </select>
                </div>
            </div>

            <div class="pt-4">
                <button class="w-full py-4 bg-gold text-black font-black uppercase rounded-full hover:bg-yellow-400 transition-all">
                    Update Dossier
                </button>
            </div>
        </div>
    </div>
    <script>lucide.createIcons(); document.getElementById('lastSync').textContent = new Date().toLocaleString();</script>
</body>
</html>
