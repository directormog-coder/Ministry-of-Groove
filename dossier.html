<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOSSIER | Operational Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        function dossierLogic() {
            return {
                user: {}, view: 'loading',
                selectedDate: new Date().toISOString().split('T')[0],
                currentLog: { shift: 'Off', weight: '' },

                async init() {
                    const sb = supabase.createClient('https://fgkljjgxecjmiiaptiug.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE');
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session) window.location.href = 'index.html';
                    this.user = session.user;
                    await this.fetchLog(sb);
                    this.view = 'ready';
                    this.$nextTick(() => lucide.createIcons());
                },

                async fetchLog(sb) {
                    const { data } = await sb.from('operative_logs').select('*').eq('log_date', this.selectedDate).single();
                    if (data) this.currentLog = { shift: data.shift_type, weight: data.weight_entry };
                    else this.currentLog = { shift: 'Off', weight: '' };
                },

                async saveLog() {
                    const sb = supabase.createClient('https://fgkljjgxecjmiiaptiug.supabase.co', '...');
                    await sb.from('operative_logs').upsert({
                        user_id: this.user.id, log_date: this.selectedDate,
                        shift_type: this.currentLog.shift, weight_entry: this.currentLog.weight
                    });
                    alert('LOG ARCHIVED');
                }
            }
        }
    </script>
</head>
<body x-data="dossierLogic()" x-init="init()" class="bg-black text-white bg-grid">
    <template x-if="view === 'ready'">
        <div class="max-w-4xl mx-auto p-6 relative z-10 animate-fade-in">
            <header class="flex items-center justify-between mb-8">
                <button onclick="window.location.href='index.html'" class="p-4 glass rounded-2xl border border-white/10"><i data-lucide="chevron-left" class="text-gold"></i></button>
                <img src="assets/images/logo.png" class="w-12 h-12 object-contain">
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-8 rounded-[2.5rem] border border-gold/20 text-center shadow-2xl">
                    <div class="w-24 h-24 mx-auto bg-zinc-900 rounded-full mb-4 border border-gold/10 flex items-center justify-center"><i data-lucide="user" class="text-gold/20 w-10 h-10"></i></div>
                    <h2 class="text-xl font-black uppercase italic" x-text="user.user_metadata.handle"></h2>
                    <p class="text-[8px] text-gold/40 uppercase font-black tracking-widest mt-1">Status: Active</p>
                </div>

                <div class="glass p-8 rounded-[2.5rem] border border-white/10">
                    <h3 class="text-xs font-black uppercase text-gold mb-6 italic">Shift Management</h3>
                    <div class="space-y-4">
                        <input type="date" x-model="selectedDate" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-xs outline-none">
                        <div class="grid grid-cols-3 gap-2">
                            <button @click="currentLog.shift = 'Day'" :class="currentLog.shift === 'Day' ? 'bg-gold text-black' : 'bg-white/5 text-zinc-500'" class="py-3 rounded-xl text-[9px] font-black uppercase transition-all">Day</button>
                            <button @click="currentLog.shift = 'Night'" :class="currentLog.shift === 'Night' ? 'bg-blue-600 text-white' : 'bg-white/5 text-zinc-500'" class="py-3 rounded-xl text-[9px] font-black uppercase transition-all">Night</button>
                            <button @click="currentLog.shift = 'Off'" :class="currentLog.shift === 'Off' ? 'bg-zinc-800 text-white' : 'bg-white/5 text-zinc-500'" class="py-3 rounded-xl text-[9px] font-black uppercase transition-all">Off</button>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[8px] text-zinc-500 uppercase font-black">Weight Tracking (KG)</label>
                            <input type="number" x-model="currentLog.weight" placeholder="0.0" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-xs outline-none">
                        </div>
                        <button @click="saveLog()" class="w-full py-4 bg-white text-black font-black uppercase rounded-full text-[10px] shadow-xl">Archive Data</button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
