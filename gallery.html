<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | GALLERY ARCHIVES</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-purple { background-image: radial-gradient(circle, #a855f7 1px, transparent 1px); background-size: 30px 30px; }
        .glass-purple { background: rgba(10, 5, 20, 0.96); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); border: 1px solid rgba(168, 85, 247, 0.2); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .media-card:hover .overlay { opacity: 1; transform: translateY(0); }
        .overlay { opacity: 0; transform: translateY(10px); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .loader-purple { width: 35px; height: 35px; border: 4px solid #a855f7; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function galleryEngine() {
            return {
                view: 'gate',
                items: [],
                isDirector: false,
                isLoading: false,
                filter: 'all',

                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (!session) {
                        window.location.href = 'index.html';
                        return;
                    }

                    this.isDirector = session.user.email === 'director.mog@gmail.com';
                    this.view = 'active';
                    this.loadMedia();
                    this.subscribeToGallery();
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadMedia() {
                    const { data } = await sb.from('gallery').select('*').order('created_at', { ascending: false });
                    if (data) this.items = data;
                },

                subscribeToGallery() {
                    sb.channel('public:gallery').on('postgres_changes', { event: '*', schema: 'public', table: 'gallery' }, () => {
                        this.loadMedia();
                    }).subscribe();
                },

                async handleUpload(e) {
                    if (!this.isDirector) return;
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    this.isLoading = true;
                    // Note: This requires a bucket named 'media' in Supabase Storage
                    const fileName = `${Date.now()}-${file.name}`;
                    const { data, error } = await sb.storage.from('media').upload(fileName, file);

                    if (!error) {
                        const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(fileName);
                        await sb.from('gallery').insert({ 
                            url: publicUrl, 
                            type: file.type.includes('video') ? 'video' : 'image',
                            name: file.name.toUpperCase()
                        });
                        alert('ARCHIVE UPDATED: ASSET SYNCHRONIZED');
                    } else {
                        alert('UPLOAD DENIED: UPLINK FAILED');
                    }
                    this.isLoading = false;
                },

                async likeAsset(id, currentLikes) {
                    await sb.from('gallery').update({ likes: (currentLikes || 0) + 1 }).eq('id', id);
                },

                async redactAsset(id) {
                    if (!this.isDirector) return;
                    if (confirm("PERMANENTLY REDACT ASSET FROM GRID?")) {
                        const { error } = await sb.from('gallery').delete().eq('id', id);
                        if (!error) alert("ASSET PURGED.");
                    }
                }
            }
        }
    </script>
</head>
<body x-data="galleryEngine()" x-init="init()" x-cloak class="bg-black text-white bg-grid-purple min-h-screen relative overflow-x-hidden selection:bg-purple-500/30">

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6">
            <div class="loader-purple"></div>
            <p class="text-[11px] font-black text-purple-500 uppercase tracking-[0.5em] animate-pulse">Syncing Media Frequency...</p>
        </div>
    </template>
    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-10 relative animate-fade-in">
            
            <header class="p-8 glass-purple rounded-[2.5rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-12 shadow-2xl">
                <div class="flex items-center gap-6">
                    <button onclick="window.location.href='index.html'" class="p-4 bg-white/5 rounded-2xl border border-white/10 hover:border-purple-500 transition-all group">
                        <i data-lucide="chevron-left" class="text-purple-500 group-hover:scale-110"></i>
                    </button>
                    <div>
                        <h1 class="text-3xl font-black uppercase italic tracking-tighter text-purple-500">Media Archives</h1>
                        <p class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-1">Cultural Surveillance // Sector 7G</p>
                    </div>
                </div>

                <template x-if="isDirector">
                    <label class="cursor-pointer bg-purple-600 px-10 py-5 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-purple-600/20 hover:scale-105 active:scale-95 transition-all flex items-center gap-3">
                        <i data-lucide="upload-cloud" class="w-4 h-4" x-show="!isLoading"></i>
                        <span x-text="isLoading ? 'Syncing...' : 'Initiate Archive Upload'"></span>
                        <input type="file" @change="handleUpload" class="hidden" accept="image/*,video/*">
                    </label>
                </template>

                <div x-show="!isDirector" class="text-right">
                    <p class="text-[10px] text-zinc-600 font-black uppercase tracking-widest">Clearance: Operative</p>
                    <p class="text-xs font-black terminal-font text-purple-400">READ_ONLY ACCESS</p>
                </div>
            </header>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <template x-for="item in items" :key="item.id">
                    <div class="media-card relative aspect-square glass-purple rounded-[3rem] overflow-hidden border border-white/5 group shadow-2xl">
                        
                        <template x-if="item.type === 'video'">
                            <video :src="item.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                        </template>
                        <template x-if="item.type !== 'video'">
                            <img :src="item.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                        </template>

                        <div class="overlay absolute inset-0 bg-black/85 p-8 flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-[8px] text-zinc-500 uppercase font-black tracking-widest" x-text="'REF: ' + item.id.substring(0,8)"></p>
                                    <p class="text-[10px] text-white font-black uppercase mt-1 truncate max-w-[120px]" x-text="item.name || 'UNNAMED_ASSET'"></p>
                                </div>
                                <template x-if="isDirector">
                                    <button @click="redactAsset(item.id)" class="p-3 bg-red-600/20 text-red-500 rounded-xl border border-red-500/20 hover:bg-red-600 hover:text-white transition-all">
                                        <i data-lucide="shield-off" class="w-4 h-4"></i>
                                    </button>
                                </template>
                            </div>

                            <div class="flex justify-center gap-6">
                                <button @click="likeAsset(item.id, item.likes)" class="flex flex-col items-center gap-2 group/btn">
                                    <div class="p-5 bg-purple-600 text-white rounded-full shadow-2xl shadow-purple-600/30 group-hover/btn:scale-110 active:scale-90 transition-all">
                                        <i data-lucide="heart" class="w-6 h-6"></i>
                                    </div>
                                    <span class="text-[10px] font-black text-purple-400" x-text="item.likes || 0"></span>
                                </button>
                                
                                <a :href="item.url" download class="flex flex-col items-center gap-2 group/btn">
                                    <div class="p-5 bg-white/10 text-white rounded-full backdrop-blur-md border border-white/10 group-hover/btn:bg-white group-hover/btn:text-black transition-all">
                                        <i data-lucide="download" class="w-6 h-6"></i>
                                    </div>
                                    <span class="text-[10px] font-black text-zinc-500 uppercase">Save</span>
                                </a>
                            </div>

                            <div class="flex justify-center">
                                <span class="text-[7px] text-zinc-700 font-black uppercase tracking-[0.4em]">Ministry Archive Protocol</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="items.length === 0" class="h-96 flex flex-col items-center justify-center opacity-20">
                <i data-lucide="camera-off" class="w-20 h-20 mb-6"></i>
                <p class="text-xs font-black uppercase tracking-[0.5em]">No Data Detected in Archives</p>
            </div>

            <footer class="mt-24 pt-10 border-t border-white/5 text-center text-zinc-800">
                <p class="text-[10px] uppercase font-black tracking-[0.6em] italic leading-relaxed">
                    DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026
                </p>
            </footer>
        </div>
    </template>

</body>
</html>
