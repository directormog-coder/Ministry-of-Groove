<main class="p-6 space-y-6 max-w-2xl mx-auto">
    <div class="glass p-8 rounded-[2.5rem] text-center space-y-4">
        <label class="cursor-pointer bg-gold text-black px-8 py-4 rounded-full font-black text-[10px] uppercase">
            TRANSMIT_ASSET
            <input type="file" @change="uploadImage" class="hidden" accept="image/*">
        </label>
    </div>
    <div class="grid grid-cols-2 gap-3" id="gallery-grid">
        <template x-for="img in items" :key="img.id">
            <div class="aspect-square glass rounded-2xl overflow-hidden"><img :src="img.url" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all"></div>
        </template>
    </div>
</main>
