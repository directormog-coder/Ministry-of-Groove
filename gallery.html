<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Groove | Visual Archives</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-noir text-gold" x-data="archiveLogic">

    <header class="p-6 flex justify-between items-center border-b border-gold/20">
        <a href="index.html" class="text-xs tracking-widest hover:text-white transition">← RETURN TO GRID</a>
        <h1 class="text-xl font-bold uppercase tracking-tighter">Visual Archives</h1>
        <div class="w-8"></div> </header>

    <main class="p-4 md:p-8 grid grid-cols-2 md:grid-cols-4 gap-4 auto-rows-[200px]">
        
        <div class="col-span-2 row-span-2 border border-gold/40 relative group overflow-hidden bg-gold/5">
            <img src="event-01.jpg" class="object-cover w-full h-full opacity-60 group-hover:opacity-100 transition-opacity">
            <div class="absolute bottom-0 left-0 p-4 bg-noir/80 border-t border-gold/20 w-full">
                <p class="text-[10px] uppercase opacity-50">Archive Ref: 001-X</p>
                <h3 class="text-sm">Main Stage: Signal Echoes</h3>
            </div>
        </div>

        <template x-for="item in archiveItems" :key="item.id">
            <div class="border border-gold/20 relative group overflow-hidden hover:border-gold transition">
                <img :src="item.url" class="object-cover w-full h-full grayscale group-hover:grayscale-0 transition-all duration-500">
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-noir/40 transition">
                    <span class="text-[10px] border border-gold px-2 py-1" x-text="item.label"></span>
                </div>
            </div>
        </template>

    </main>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('archiveLogic', () => ({
                archiveItems: [
                    { id: 1, url: 'grid-02.jpg', label: 'OPERATIVE HUB' },
                    { id: 2, url: 'grid-03.jpg', label: 'VAULT ACCESS' },
                    { id: 3, url: 'event-02.jpg', label: 'LIVE SIGNAL' },
                    { id: 4, url: 'grid-04.jpg', label: 'ENCRYPTION' },
                    { id: 5, url: 'event-03.jpg', label: 'CROWD DENSITY' },
                    { id: 6, url: 'logo-alt.png', label: 'BRAND IDENTITY' }
                ]
            }));
        });
    </script>
</body>
</html>
