<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | GALLERY ARCHIVES</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-purple { background-image: radial-gradient(circle, #a855f7 1.2px, transparent 1.2px); background-size: 30px 30px; }
        .glass-purple { background: rgba(10, 5, 20, 0.96); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border: 1px solid rgba(168, 85, 247, 0.2); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        
        /* MEDIA CARD LOGIC */
        .media-card { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .media-card:hover { transform: translateY(-10px) scale(1.02); }
        .media-card:hover .overlay { opacity: 1; transform: translateY(0); }
        .overlay { opacity: 0; transform: translateY(20px); transition: all 0.4s ease; }
        
        .loader-purple { width: 40px; height: 40px; border: 4px solid #a855f7; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .purple-glow { box-shadow: 0 0 50px rgba(168, 85, 247, 0.1); }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function galleryEngine() {
            return {
                // SYSTEM STATE
                view: 'gate',
                isDirector: false,
                isLoading: false,
                items: [],
                
                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    
                    // --- THE GOOGLE AUTH GATE ---
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (!session) {
                        // Check for OAuth callback fragments
                        if (window.location.hash.includes('access_token')) {
                            this.view = 'gate'; 
                        } else {
                            window.location.href = 'index.html'; 
                            return;
                        }
                    }

                    this.isDirector = session.user.email === 'director.mog@gmail.com';
                    this.view = 'active';
                    this.loadMedia();
                    this.subscribeToGallery();
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadMedia() {
                    const { data, error } = await sb.from('gallery').select('*').order('created_at', { ascending: false });
                    if (!error) this.items = data;
                },

                subscribeToGallery() {
                    sb.channel('public:gallery').on('postgres_changes', { event: '*', schema: 'public', table: 'gallery' }, () => {
                        this.loadMedia();
                    }).subscribe();
                },

                // --- DIRECTOR EXCLUSIVE: UPLOAD ---
                async handleUpload(e) {
                    if (!this.isDirector) return;
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    this.isLoading = true;
                    const fileName = `MOG-${Date.now()}-${file.name.replace(/\s/g, '_')}`;
                    
                    // Step 1: Upload to Supabase Storage
                    const { data: uploadData, error: uploadError } = await sb.storage.from('media').upload(fileName, file);

                    if (!uploadError) {
                        const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(fileName);
                        
                        // Step 2: Record in Gallery Table
                        await sb.from('gallery').insert({ 
                            url: publicUrl, 
                            type: file.type.startsWith('video') ? 'video' : 'image',
                            name: file.name.toUpperCase()
                        });
                        alert('ARCHIVE SYNCHRONIZED: ASSET LIVE');
                    } else {
                        alert('UPLINK DENIED: ' + uploadError.message);
                    }
                    this.isLoading = false;
                },

                // --- OPERATIVE: INTERACTION ---
                async likeAsset(id, currentLikes) {
                    await sb.from('gallery').update({ likes: (currentLikes || 0) + 1 }).eq('id', id);
                },

                // --- DIRECTOR EXCLUSIVE: REDACT ---
                async redactAsset(id) {
                    if (!this.isDirector) return;
                    if (confirm("PERMANENTLY REDACT THIS CULTURAL ASSET?")) {
                        await sb.from('gallery').delete().eq('id', id);
                        alert("ASSET PURGED FROM GRID.");
                    }
                }
            }
        }
    </script>
</head>
<body x-data="galleryEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-purple-500/30">

    <div class="bg-circuit-pattern"></div>
    <div class="bg-grid-purple fixed inset-0 z-0 opacity-20"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-8">
            <div class="loader-purple"></div>
            <p class="text-[12px] font-black text-purple-500 uppercase tracking-[0.6em] animate-pulse italic">Syncing Visual Archive...</p>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-20 relative animate-fade-in">
            
            <header class="p-8 glass-purple rounded-[3rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl purple-glow">
                <div class="flex items-center gap-8">
                    <button onclick="window.location.href='index.html'" class="p-6 bg-white/5 rounded-[2rem] border border-white/10 hover:border-purple-500 transition-all group shadow-xl">
                        <i data-lucide="chevron-left" class="text-purple-500 group-hover:scale-110"></i>
                    </button>
                    <div>
                        <h1 class="text-4xl font-black uppercase italic tracking-tighter text-purple-500 leading-none">Media Curator</h1>
                        <p class="text-[11px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-4 italic">Cultural Surveillance // Sector 7G Archive</p>
                    </div>
                </div>

                <template x-if="isDirector">
                    <label class="cursor-pointer bg-purple-600 px-12 py-6 rounded-full text-[11px] font-black uppercase tracking-[0.3em] shadow-2xl shadow-purple-600/30 hover:scale-105 active:scale-95 transition-all flex items-center gap-4">
                        <i data-lucide="upload-cloud" class="w-6 h-6" x-show="!isLoading"></i>
                        <span x-text="isLoading ? 'Syncing...' : 'Initiate Archive Upload'"></span>
                        <input type="file" @change="handleUpload" class="hidden" accept="image/*,video/*">
                    </label>
                </template>

                <div x-show="!isDirector" class="text-right border-l border-white/5 pl-8 hidden md:block">
                    <p class="text-[10px] text-purple-500/50 font-black uppercase tracking-widest">Clearance: Operative</p>
                    <p class="text-xs font-black terminal-font mt-1 text-zinc-400">READ_ONLY ARCHIVE ACCESS</p>
                </div>
            </header>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
                <template x-for="item in items" :key="item.id">
                    <div class="media-card relative aspect-square glass-purple rounded-[4rem] overflow-hidden border border-white/5 group shadow-2xl">
                        
                        <template x-if="item.type === 'video'">
                            <video :src="item.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                        </template>
                        <template x-if="item.type !== 'video'">
                            <img :src="item.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000" loading="lazy">
                        </template>

                        <div class="overlay absolute inset-0 bg-black/90 p-10 flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                                <div>
                                    <p class="text-[8px] text-zinc-600 uppercase font-black tracking-widest" x-text="'REF: ' + item.id.substring(0,8)"></p>
                                    <p class="text-[12px] text-white font-black uppercase mt-1 truncate max-w-[150px]" x-text="item.name"></p>
                                </div>
                                <template x-if="isDirector">
                                    <button @click="redactAsset(item.id)" class="p-4 bg-red-600/10 text-red-500 rounded-2xl border border-red-600/20 hover:bg-red-600 hover:text-white transition-all shadow-xl">
                                        <i data-lucide="shield-off" class="w-5 h-5"></i>
                                    </button>
                                </template>
                            </div>

                            <div class="flex justify-center gap-8">
                                <button @click="likeAsset(item.id, item.likes)" class="flex flex-col items-center gap-3 group/btn">
                                    <div class="p-6 bg-purple-600 text-white rounded-full shadow-2xl shadow-purple-600/40 group-hover/btn:scale-110 active:scale-90 transition-all">
                                        <i data-lucide="heart" class="w-7 h-7"></i>
                                    </div>
                                    <span class="text-[11px] font-black text-purple-400 terminal-font" x-text="item.likes || 0"></span>
                                </button>
                                
                                <a :href="item.url" download class="flex flex-col items-center gap-3 group/btn">
                                    <div class="p-6 bg-white/5 text-white rounded-full border border-white/10 group-hover/btn:bg-white group-hover/btn:text-black transition-all">
                                        <i data-lucide="download" class="w-7 h-7"></i>
                                    </div>
                                    <span class="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Archive</span>
                                </a>
                            </div>

                            <div class="flex justify-center">
                                <span class="text-[7px] text-zinc-800 font-black uppercase tracking-[0.5em]">Ministry Archive Protocol // Sec-7G</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="items.length === 0" class="h-screen flex flex-col items-center justify-center opacity-10">
                <i data-lucide="camera-off" class="w-24 h-24 mb-8"></i>
                <p class="text-[13px] font-black uppercase tracking-[0.8em]">No Assets Detected in Sector Archives</p>
            </div>

            <footer class="mt-40 pt-16 border-t border-white/5 text-center text-zinc-800">
                <p class="text-[14px] uppercase font-black tracking-[0.8em] italic leading-relaxed">
                    DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026
                </p>
            </footer>
        </div>
    </template>

</body>
</html>
