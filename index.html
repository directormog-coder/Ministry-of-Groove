<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        
        let supabaseClient = null;
        
        function ministry() {
            return {
                // View State
                view: 'auth',
                subView: 'chat',
                authMode: 'login',
                
                // User Data
                username: '',
                emailInput: '',
                passwordInput: '',
                confirmPassword: '',
                handleInput: '',
                userStatus: 'online',
                isDirector: false,
                
                // UI State
                isLoading: false,
                errorMsg: '',
                isOnline: navigator.onLine,
                soundEnabled: true,
                darkMode: true,
                notifications: true,
                showSettings: false,
                
                // Chat State
                messages: [],
                msgInput: '',
                typingUsers: [],
                unreadCount: 0,
                onlineCount: 0,
                
                // Gallery State
                galleryItems: [],
                selectedImage: null,
                isUploading: false,
                uploadProgress: 0,
                totalStorage: 0,
                
                // Voice Recording
                showVoiceRecorder: false,
                isRecording: false,
                recordingTime: '00:00',
                recordedBlob: null,
                
                // Encryption
                showEncryptionModal: false,
                encryptionPassword: '',
                pendingFile: null,
                
                // Amapiano Chart & Player
                amapianoChart: [],
                totalVotes: 0,
                nowPlaying: null,
                isPlaying: false,
                playbackProgress: 0,
                
                // Broadcasts
                showDirectorConsole: false,
                globalAlertInput: '',
                activeBroadcast: null,
                
                // System Meta
                currentTime: '',
                weatherStatus: 'SECURE CONNECTION',
                sessionDuration: '00:00',
                sessionStart: null,
                
                async init() {
                    console.log('🎛️ System Initializing...');
                    try {
                        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    } catch (e) { console.error('Supabase Error:', e); }
                    
                    await this.checkSession();
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    this.subscribeToBroadcasts();
                    
                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { this.isOnline = false; });
                    
                    this.$watch('view', () => {
                        this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                    });
                },
                
                async checkSession() {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) { this.setupSession(session.user); }
                },

                setupSession(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid';
                    this.sessionStart = Date.now();
                    this.startSessionTimer();
                    this.loadMessages();
                    this.loadGallery();
                    this.loadAmapianoChart();
                    this.subscribeToMessages();
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    try {
                        const { error } = await supabaseClient.auth.signInWithOAuth({
                            provider: 'google',
                            options: { redirectTo: window.location.origin }
                        });
                        if (error) throw error;
                    } catch (e) { this.errorMsg = "GOOGLE AUTH ERROR"; }
                    finally { this.isLoading = false; }
                },

                async loginUser() {
                    if (!this.emailInput || !this.passwordInput) { this.errorMsg = 'ENTER CREDENTIALS'; return; }
                    this.isLoading = true;
                    try {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: this.emailInput.toLowerCase().trim(),
                            password: this.passwordInput
                        });
                        if (error) throw error;
                        this.setupSession(data.user);
                    } catch (e) { this.errorMsg = e.message.toUpperCase(); }
                    finally { this.isLoading = false; }
                },

                async sendBroadcast() {
                    if (!this.globalAlertInput.trim()) return;
                    await supabaseClient.from('broadcasts').insert({ 
                        content: this.globalAlertInput, 
                        created_by: this.username 
                    });
                    this.showDirectorConsole = false;
                    this.globalAlertInput = '';
                },

                subscribeToBroadcasts() {
                    supabaseClient.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                        this.activeBroadcast = payload.new.content;
                        setTimeout(() => { this.activeBroadcast = null; }, 15000);
                    }).subscribe();
                },

                async loadMessages() {
                    const { data } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
                    if (data) { this.messages = data; this.scrollToBottom(); }
                },

                subscribeToMessages() {
                    supabaseClient.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.scrollToBottom();
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    await supabaseClient.from('messages').insert({ username: this.username, content: this.msgInput });
                    this.msgInput = '';
                },

                loadAmapianoChart() {
                    this.amapianoChart = [
                        { id: 1, title: 'Amazwe', artist: 'Mthunzi ft. MaWhoo', votes: 1240 },
                        { id: 2, title: 'Imithandazo', artist: 'Kabza De Small', votes: 1180 },
                        { id: 3, title: 'Uku Khula', artist: 'Toss', votes: 950 }
                    ];
                    this.totalVotes = this.amapianoChart.reduce((a, b) => a + b.votes, 0);
                },

                playPreview(song) {
                    this.nowPlaying = song;
                    this.isPlaying = true;
                    this.playbackProgress = 0;
                    if(this.audioInterval) clearInterval(this.audioInterval);
                    this.audioInterval = setInterval(() => {
                        if(this.isPlaying && this.playbackProgress < 100) this.playbackProgress += 0.5;
                    }, 100);
                },

                updateTime() { this.currentTime = new Date().toLocaleTimeString('en-US', { hour12: false }); },
                startSessionTimer() {
                    setInterval(() => {
                        if (this.sessionStart) {
                            const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                            this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                        }
                    }, 1000);
                },
                scrollToBottom() { this.$nextTick(() => { if(this.$refs.chatContainer) this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight; }); },
                logout() { supabaseClient.auth.signOut(); window.location.reload(); }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <template x-if="activeBroadcast">
        <div class="fixed top-0 left-0 right-0 z-[200] bg-red-600 p-4 text-center font-black uppercase animate-pulse border-b-4 border-white shadow-2xl">
            <span x-text="'DIRECTORATE BROADCAST: ' + activeBroadcast"></span>
        </div>
    </template>

    <div x-show="selectedImage" class="image-modal" :class="{ 'active': selectedImage }" @click="selectedImage = null">
        <img :src="selectedImage" @click.stop alt="Full size">
    </div>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-6 text-center z-10 animate-fade-in">
            <div class="w-full max-w-md space-y-8">
                <img src="assets/images/logo.png" class="w-32 h-32 mx-auto object-contain" onerror="this.outerHTML='<div class=\'text-4xl font-black text-gold\'>MOG</div>'">
                
                <div x-show="authMode === 'login'" class="space-y-4">
                    <h1 class="text-white font-black uppercase tracking-[0.3em] text-sm italic">Ministry of Groove</h1>
                    <div class="space-y-3">
                        <input x-model="emailInput" type="email" placeholder="OPERATIVE EMAIL" class="w-full bg-black/60 border border-gold/20 p-5 rounded-2xl text-center outline-none uppercase text-[10px]">
                        <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/60 border border-gold/20 p-5 rounded-2xl text-center outline-none uppercase text-[10px]">
                        <button @click="loginUser()" class="w-full py-5 bg-gold text-black font-black uppercase rounded-full shadow-lg shadow-gold/20">Initialize Access</button>
                        <button @click="loginWithGoogle()" class="w-full py-4 bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-full flex items-center justify-center gap-2 hover:bg-white/10 transition-all">
                            <i data-lucide="chrome" class="w-4 h-4 text-gold"></i> Sign in with Google
                        </button>
                    </div>
                </div>
                <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[9px] font-black uppercase"></p>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col z-10 pb-32">
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <img src="assets/images/logo.png" class="w-10 h-10 object-contain">
                    <div>
                        <p class="text-[10px] font-black uppercase italic tracking-widest leading-tight">Ministry of Groove</p>
                        <div class="flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                            <p class="text-[6px] text-gold/40 uppercase font-black" x-text="username"></p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button x-show="isDirector" @click="showDirectorConsole = true" class="p-3 border border-red-500 text-red-500 rounded-xl hover:bg-red-500/10 transition-all">
                        <i data-lucide="radio" class="w-4 h-4"></i>
                    </button>
                    <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl"><i data-lucide="power" class="w-4 h-4"></i></button>
                </div>
            </header>

            <main class="p-4 md:p-6 space-y-6 max-w-6xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10 shadow-lg' : 'border-white/10'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Grid</span>
                    </div>
                    <div onclick="window.location.href='dossier.html'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border border-white/10 hover:border-green-400/30 transition-all">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Dossier</span>
                    </div>
                    <div @click="subView = 'gallery'" :class="subView === 'gallery' ? 'border-purple-400 bg-purple-400/10' : 'border-white/10'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Gallery</span>
                    </div>
                    <div onclick="window.location.href='archives.html'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border border-white/10 hover:border-gold/50 transition-all">
                        <i data-lucide="database" class="mx-auto mb-2 text-gold w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="amapiano-chart p-6 rounded-[2rem] border border-gold/20 shadow-2xl">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xs font-black uppercase tracking-widest text-white italic">Amapiano Top 10</h3>
                        <p class="text-[10px] font-black text-gold terminal-font" x-text="totalVotes.toLocaleString()"></p>
                    </div>
                    <div class="space-y-2">
                        <template x-for="(song, index) in amapianoChart" :key="song.id">
                            <div @click="playPreview(song)" class="chart-item p-4 bg-white/5 rounded-2xl flex items-center justify-between hover:bg-white/10 cursor-pointer border border-white/5 transition-all">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-xl bg-gold/10 flex items-center justify-center">
                                        <i :data-lucide="nowPlaying?.id === song.id && isPlaying ? 'pause' : 'play'" class="w-4 h-4 text-gold"></i>
                                    </div>
                                    <div>
                                        <p class="text-xs font-bold text-white uppercase" x-text="song.title"></p>
                                        <p class="text-[8px] text-gold/40 uppercase font-black" x-text="song.artist"></p>
                                    </div>
                                </div>
                                <span class="text-[10px] font-black text-gold terminal-font" x-text="'#' + (index + 1)"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="glass rounded-[2rem] md:rounded-[3rem] h-[45vh] flex flex-col overflow-hidden border-white/5 shadow-2xl">
                    <div class="p-4 border-b border-white/5 bg-white/5 flex justify-between items-center">
                        <span class="text-[10px] font-black uppercase tracking-widest italic">Grid Uplink</span>
                        <div class="flex gap-4">
                            <button @click="showVoiceRecorder = true" class="text-gold"><i data-lucide="mic" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <div class="flex-grow overflow-y-auto p-4 md:p-6 space-y-4" x-ref="chatContainer">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === username ? 'ml-auto text-right' : 'mr-auto text-left'" class="max-w-[85%] space-y-1">
                                <span class="text-[7px] font-black text-zinc-500 uppercase tracking-widest" x-text="msg.username"></span>
                                <div :class="msg.username === username ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-3 md:p-4 border rounded-2xl text-[11px] leading-relaxed shadow-lg" x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="sendMessage()" class="p-4 bg-black/40 border-t border-gold/10 flex gap-3">
                        <input x-model="msgInput" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[12px] outline-none terminal-font uppercase">
                        <button type="submit" class="text-gold"><i data-lucide="send" class="w-5 h-5"></i></button>
                    </form>
                </div>
            </main>

            <div x-show="showDirectorConsole" class="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-black/95 animate-fade-in">
                <div class="glass max-w-sm w-full p-6 rounded-3xl border border-red-500">
                    <h3 class="text-lg font-black uppercase italic text-white mb-4">Broadcast Console</h3>
                    <textarea x-model="globalAlertInput" placeholder="ENTER GLOBAL ALERT..." class="w-full bg-black p-4 border border-red-500/20 rounded-xl mb-4 h-32 outline-none text-xs uppercase"></textarea>
                    <div class="flex gap-4">
                        <button @click="showDirectorConsole = false" class="flex-1 py-3 text-[10px] font-black uppercase">Abort</button>
                        <button @click="sendBroadcast()" class="flex-1 py-3 bg-red-600 rounded-full text-[10px] font-black uppercase">Send Broadcast</button>
                    </div>
                </div>
            </div>

            <div x-show="nowPlaying" class="fixed bottom-0 left-0 right-0 z-[100] glass-strong border-t border-gold/30 p-4 shadow-2xl animate-slide-up">
                <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-gold/20 flex items-center justify-center border border-gold/20"><i data-lucide="music" class="text-gold w-6 h-6"></i></div>
                        <div>
                            <p class="text-xs font-black uppercase italic" x-text="nowPlaying?.title"></p>
                            <p class="text-[8px] text-gold/60 uppercase font-black tracking-widest mt-1" x-text="nowPlaying?.artist"></p>
                        </div>
                    </div>
                    <div class="flex flex-col items-center gap-2 flex-1 max-w-sm">
                        <button @click="togglePlay()" class="w-12 h-12 rounded-full bg-gold text-black flex items-center justify-center hover:scale-110 active:scale-95 transition-all shadow-xl shadow-gold/20">
                            <i :data-lucide="isPlaying ? 'pause' : 'play'" class="w-6 h-6"></i>
                        </button>
                        <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden border border-white/5">
                            <div class="h-full bg-gold transition-all duration-300" :style="'width: ' + playbackProgress + '%'"></div>
                        </div>
                    </div>
                    <div class="hidden md:block text-right">
                        <p class="text-[9px] font-black text-gold/60 uppercase terminal-font">NCC-MASTER ACTIVE</p>
                    </div>
                </div>
            </div>

            <footer class="mog-footer border-t border-white/5 mt-12 bg-black/40 backdrop-blur-xl">
                <div class="max-w-6xl mx-auto p-12 grid md:grid-cols-4 gap-12">
                    <div class="space-y-4">
                        <img src="assets/images/logo.png" class="w-16 h-16 object-contain" onerror="this.style.display='none'">
                        <p class="text-[10px] text-zinc-400 font-bold uppercase tracking-widest leading-relaxed">Secure. Connected. Groove.</p>
                        <p class="text-[9px] text-zinc-600 leading-relaxed uppercase">The Ministry of Groove is your premier entertainment organization. Connecting operatives through secure channels.</p>
                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest">Operations</h4>
                        <div class="flex flex-col gap-4 text-[9px] text-zinc-400 uppercase font-black tracking-wider">
                            <a href="#" @click="subView = 'chat'">Command Grid</a>
                            <a href="dossier.html">Operative Dossier</a>
                            <a href="archives.html">Classified Vault</a>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest">Directorate</h4>
                        <div class="text-[9px] text-zinc-400 space-y-3 uppercase font-black">
                            <p>director.mog@gmail.com</p>
                            <p>Emalahleni, Mpumalanga</p>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest">Socials</h4>
                        <div class="flex flex-wrap gap-5 text-zinc-500">
                            <a href="https://www.instagram.com/ministryofgroove_hq" target="_blank" class="hover:text-gold transition-all"><i data-lucide="instagram" class="w-5 h-5"></i></a>
                            <a href="https://wa.me/message/EASM3GTNOVSQE1" target="_blank" class="hover:text-gold transition-all"><i data-lucide="message-circle" class="w-5 h-5"></i></a>
                            <a href="https://www.youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:text-gold transition-all"><i data-lucide="youtube" class="w-5 h-5"></i></a>
                        </div>
                    </div>
                </div>
                <div class="p-8 border-t border-white/5 text-center">
                    <p class="text-[8px] text-zinc-700 uppercase tracking-[0.6em] font-black italic">
                        © 2026 MINISTRY OF GROOVE • NCC MASTER v3.0 • SECURE CONNECTION <span x-text="isOnline ? 'ACTIVE' : 'OFFLINE'" class="text-gold"></span>
                    </p>
                </div>
            </footer>
        </div>
    </template>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/service-worker.js'); }); }
    </script>
</body>
</html>
