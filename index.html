<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        
        let supabaseClient = null;
        
        // Ministry App Logic
        function ministry() {
            return {
                // View State
                view: 'auth',
                subView: 'chat',
                authMode: 'login',
                
                // User Data
                username: '',
                emailInput: '',
                passwordInput: '',
                confirmPassword: '',
                handleInput: '',
                userStatus: 'online',
                isDirector: false,
                
                // UI State
                isLoading: false,
                errorMsg: '',
                isOnline: navigator.onLine,
                soundEnabled: true,
                darkMode: true,
                notifications: true,
                showSettings: false,
                
                // Chat State
                messages: [],
                msgInput: '',
                typingUsers: [],
                unreadCount: 0,
                onlineCount: 0,
                
                // Gallery State
                galleryItems: [],
                selectedImage: null,
                isUploading: false,
                uploadProgress: 0,
                totalStorage: 0,
                
                // Voice Recording
                showVoiceRecorder: false,
                isRecording: false,
                recordingTime: '00:00',
                recordedBlob: null,
                
                // Encryption
                showEncryptionModal: false,
                encryptionPassword: '',
                pendingFile: null,
                
                // Private Messages
                showPrivateModal: false,
                privateMessageRecipient: '',
                privateMsgInput: '',
                
                // Amapiano Chart
                amapianoChart: [],
                totalVotes: 0,
                currentPlaying: null,
                nowPlaying: null,
                isPlaying: false,
                playbackProgress: 0,
                
                // Time/Weather
                currentTime: '',
                weatherStatus: 'SECURE CONNECTION',
                sessionDuration: '00:00',
                sessionStart: null,
                
                // Initialization
                async init() {
                    console.log('🎛️ Ministry of Groove System Initializing...');
                    try {
                        if (typeof supabase !== 'undefined') {
                            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        }
                    } catch (e) { console.error('Supabase Init Error:', e); }
                    
                    await this.checkSession();
                    
                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { this.isOnline = false; });
                    
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    
                    if (typeof lucide !== 'undefined') lucide.createIcons();

                    // Re-run icons when Alpine switches templates
                    this.$watch('view', () => {
                        this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                    });
                },
                
                async checkSession() {
                    if (!supabaseClient) return;
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) { this.setupSession(session.user); }
                },

                setupSession(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid';
                    this.sessionStart = Date.now();
                    this.startSessionTimer();
                    this.loadMessages();
                    this.loadGallery();
                    this.loadAmapianoChart();
                    this.subscribeToMessages();
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    try {
                        const { error } = await supabaseClient.auth.signInWithOAuth({
                            provider: 'google',
                            options: { redirectTo: window.location.origin }
                        });
                        if (error) throw error;
                    } catch (e) { this.errorMsg = e.message.toUpperCase(); }
                    finally { this.isLoading = false; }
                },

                async loginUser() {
                    if (!this.emailInput || !this.passwordInput) {
                        this.errorMsg = 'ENTER CREDENTIALS';
                        return;
                    }
                    this.isLoading = true;
                    this.errorMsg = '';
                    try {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: this.emailInput.toLowerCase().trim(),
                            password: this.passwordInput
                        });
                        if (error) throw error;
                        this.setupSession(data.user);
                    } catch (error) {
                        this.errorMsg = error.message.toUpperCase();
                    } finally { this.isLoading = false; }
                },

                async registerUser() {
                    if (this.passwordInput !== this.confirmPassword) {
                        this.errorMsg = 'PASSWORDS DO NOT MATCH'; return;
                    }
                    this.isLoading = true;
                    try {
                        const { data, error } = await supabaseClient.auth.signUp({
                            email: this.emailInput.toLowerCase().trim(),
                            password: this.passwordInput,
                            options: { data: { handle: this.handleInput } }
                        });
                        if (error) throw error;
                        this.authMode = 'login';
                        this.errorMsg = 'CHECK EMAIL FOR CONFIRMATION';
                    } catch (e) { this.errorMsg = e.message.toUpperCase(); }
                    finally { this.isLoading = false; }
                },

                async logout() {
                    if (supabaseClient) await supabaseClient.auth.signOut();
                    this.view = 'auth';
                    this.sessionStart = null;
                },

                async loadMessages() {
                    const { data } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
                    if (data) this.messages = data;
                    this.scrollToBottom();
                },

                async loadGallery() {
                    const { data } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
                    if (data) {
                        this.galleryItems = data;
                        this.calculateStorage();
                    }
                },

                loadAmapianoChart() {
                    this.amapianoChart = [
                        { id: 1, title: 'Amazwe', artist: 'Mthunzi ft. MaWhoo', votes: 1240, userVoted: false },
                        { id: 2, title: 'Imithandazo', artist: 'Kabza De Small', votes: 1180, userVoted: false },
                        { id: 3, title: 'Uku Khula', artist: 'Toss', votes: 950, userVoted: false },
                        { id: 4, title: 'Khusela', artist: 'K.O ft. Nandi Madida', votes: 890, userVoted: false },
                        { id: 5, title: 'Adiwele', artist: 'Young Stunna', votes: 840, userVoted: false }
                    ];
                    this.totalVotes = this.amapianoChart.reduce((a, b) => a + b.votes, 0);
                },

                subscribeToMessages() {
                    supabaseClient.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.scrollToBottom();
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    const { error } = await supabaseClient.from('messages').insert({
                        username: this.username,
                        content: this.msgInput,
                        created_at: new Date().toISOString()
                    });
                    if (!error) this.msgInput = '';
                },

                updateTime() {
                    this.currentTime = new Date().toLocaleTimeString('en-US', { hour12: false });
                },

                startSessionTimer() {
                    setInterval(() => {
                        if (this.sessionStart) {
                            const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                            const mins = Math.floor(diff / 60).toString().padStart(2, '0');
                            const secs = (diff % 60).toString().padStart(2, '0');
                            this.sessionDuration = `${mins}:${secs}`;
                        }
                    }, 1000);
                },

                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.chatContainer;
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                },

                formatTime(ds) { return new Date(ds).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }); },
                formatDate(ds) { return new Date(ds).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); },
                formatBytes(b) { return (b / 1024).toFixed(2) + ' KB'; },
                calculateStorage() { this.totalStorage = this.galleryItems.reduce((acc, item) => acc + (item.size || 0), 0); },
                voteForSong(id) {
                    const s = this.amapianoChart.find(x => x.id === id);
                    if (s && !s.userVoted) { s.votes++; s.userVoted = true; this.totalVotes++; }
                },
                playPreview(s) { this.nowPlaying = s; this.isPlaying = true; },
                toggleSound() { this.soundEnabled = !this.soundEnabled; },
                toggleTheme() { this.darkMode = !this.darkMode; },
                togglePlay() { this.isPlaying = !this.isPlaying; },
                clearChat() { this.messages = []; },
                onTyping() {},
                showToast(m, t = 'info') { console.log(`[${t.toUpperCase()}] ${m}`); }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <div class="offline-banner" :class="{ 'show': !isOnline }">OFFLINE MODE - MESSAGES SAVED LOCALLY</div>

    <div class="toast-container" id="toast-container"></div>

    <div x-show="selectedImage" class="image-modal" :class="{ 'active': selectedImage }" @click="selectedImage = null">
        <img :src="selectedImage" @click.stop alt="Full size">
    </div>

    <div x-show="showVoiceRecorder" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20 text-center">
            <h3 class="text-lg font-black uppercase tracking-widest text-white mb-4">Voice Transmission</h3>
            <div class="flex justify-center mb-6">
                <div class="audio-visualizer" x-show="isRecording">
                    <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                </div>
                <div x-show="!isRecording" class="h-20 flex items-center justify-center">
                    <i data-lucide="mic" class="w-12 h-12 text-gold/50"></i>
                </div>
            </div>
            <div x-show="isRecording" class="text-gold font-black text-2xl mb-4 terminal-font" x-text="recordingTime"></div>
            <div class="flex gap-3 justify-center">
                <button x-show="!isRecording" @click="isRecording = true" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center"><i data-lucide="mic" class="w-8 h-8 text-white"></i></button>
                <button x-show="isRecording" @click="isRecording = false" class="w-16 h-16 rounded-full bg-gold flex items-center justify-center"><i data-lucide="square" class="w-8 h-8 text-black"></i></button>
            </div>
            <button @click="showVoiceRecorder = false" class="mt-6 text-[10px] text-zinc-500 uppercase">Cancel</button>
        </div>
    </div>

    <div x-show="showEncryptionModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20">
            <div class="flex items-center gap-3 mb-4">
                <i data-lucide="lock" class="w-6 h-6 text-gold"></i>
                <h3 class="text-lg font-black uppercase tracking-widest text-white">Encrypt Asset</h3>
            </div>
            <input x-model="encryptionPassword" type="password" placeholder="ENTER ENCRYPTION KEY..." class="w-full bg-black/50 border border-gold/20 p-4 rounded-xl text-[12px] text-white text-center terminal-font outline-none mb-4">
            <div class="flex gap-3">
                <button @click="showEncryptionModal = false" class="flex-1 py-3 bg-white/10 text-white rounded-full text-[10px] font-black uppercase">Cancel</button>
                <button @click="showEncryptionModal = false" class="flex-1 py-3 bg-gold text-black rounded-full text-[10px] font-black uppercase">Encrypt</button>
            </div>
        </div>
    </div>

    <template x-if="view === 'auth'">
        <div class="h-screen w-full flex flex-col items-center justify-center p-6 text-center relative z-10">
            <div class="relative z-10 w-full max-w-md space-y-8 animate-slide-up">
                <div class="mog-logo-container mx-auto mb-4">
                    <div class="text-4xl font-black text-gold">MOG</div>
                </div>

                <div class="space-y-6">
                    <div x-show="authMode === 'login'" class="space-y-4" x-transition>
                        <div class="space-y-2">
                            <h1 class="text-white font-black uppercase tracking-[0.3em] text-sm italic">Ministry of Groove</h1>
                            <p class="text-gold/40 text-[8px] uppercase font-black tracking-[0.2em]">Secure Authentication Required</p>
                        </div>
                        <div class="space-y-3">
                            <input x-model="emailInput" type="email" placeholder="OPERATIVE@GMAIL.COM" class="w-full bg-black/60 backdrop-blur-md border border-gold/20 p-5 rounded-2xl text-[11px] text-white uppercase outline-none focus:border-gold terminal-font text-center">
                            <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/60 backdrop-blur-md border border-gold/20 p-5 rounded-2xl text-[11px] text-white uppercase outline-none focus:border-gold terminal-font text-center" @keyup.enter="loginUser()">
                            <button @click="loginUser()" :disabled="isLoading" class="w-full py-5 bg-gradient-to-r from-gold to-yellow-600 text-black font-black text-[11px] uppercase rounded-full shadow-lg active:scale-95 transition-all">
                                <span x-show="!isLoading">Initialize Access</span>
                                <div x-show="isLoading" class="loader"></div>
                            </button>
                            <button @click="loginWithGoogle()" class="w-full py-4 bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-full hover:bg-white/10 transition-all">Sign in with Google</button>
                        </div>
                        <div class="pt-4 border-t border-white/10">
                            <button @click="authMode = 'register'" class="text-[10px] uppercase text-gold/60 tracking-widest hover:text-gold transition-colors">Register Clearance</button>
                        </div>
                    </div>

                    <div x-show="authMode === 'register'" x-transition class="glass p-6 rounded-[2.5rem] space-y-4 border-gold/40 bg-black/60 backdrop-blur-xl">
                        <h2 class="text-white text-sm font-black uppercase tracking-widest italic">New Operative Registration</h2>
                        <div class="space-y-3">
                            <input x-model="emailInput" type="email" placeholder="GMAIL ADDRESS" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center">
                            <input x-model="handleInput" type="text" placeholder="OPERATIVE HANDLE" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center">
                            <input x-model="passwordInput" type="password" placeholder="CREATE PASSWORD" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center">
                            <input x-model="confirmPassword" type="password" placeholder="CONFIRM" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center">
                        </div>
                        <button @click="registerUser()" class="w-full py-4 bg-white text-black font-black text-[11px] uppercase rounded-full">Register & Initialize</button>
                        <button @click="authMode = 'login'" class="text-[10px] uppercase text-white/40 tracking-widest">← Return to Login</button>
                    </div>
                    <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[9px] uppercase font-black terminal-font bg-red-500/10 py-2 px-4 rounded-full"></p>
                </div>
                <div class="pt-6 border-t border-white/5">
                    <p class="text-[7px] text-zinc-500 uppercase tracking-[0.3em]">System Version 3.0.0 | Secure Channel</p>
                </div>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col relative z-10 pb-24 md:pb-0">
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <div class="text-xl font-black text-gold">MOG</div>
                    <div>
                        <p class="text-[10px] font-black uppercase text-white tracking-widest italic leading-tight">Ministry of Groove</p>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                            <p class="text-[6px] text-gold/40 uppercase tracking-widest" x-text="username"></p>
                            <span x-show="isDirector" class="text-[6px] text-red-500 uppercase font-black">[DIRECTOR]</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-right">
                        <p class="terminal-font text-[10px] text-white font-bold" x-text="currentTime"></p>
                        <p class="text-[6px] text-gold/40 font-black uppercase tracking-tighter" x-text="weatherStatus"></p>
                    </div>
                    <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl hover:bg-red-900/20 transition-all active:scale-95 group">
                        <i data-lucide="power" class="w-4 h-4 group-hover:rotate-90 transition-transform"></i>
                    </button>
                </div>
            </header>

            <main class="p-4 md:p-6 space-y-6 max-w-6xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10' : 'border-white/10'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Grid</span>
                    </div>
                    <div @click="window.location.href='dossier.html'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border border-white/10 hover:border-green-400/30 hover:scale-105 transition-all">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Dossier</span>
                    </div>
                    <div @click="subView = 'gallery'" :class="subView === 'gallery' ? 'border-purple-400 bg-purple-400/10' : 'border-white/10'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Gallery</span>
                    </div>
                    <div @click="window.location.href='vault.html'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border border-white/10 hover:border-gold/50 hover:scale-105 transition-all">
                        <i data-lucide="database" class="mx-auto mb-2 text-gold w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="amapiano-chart p-6 rounded-[2rem] border border-gold/20">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <i data-lucide="music" class="w-6 h-6 text-gold"></i>
                            <h3 class="text-lg font-black uppercase tracking-widest text-white italic">Amapiano Top 10</h3>
                        </div>
                        <p class="text-xl font-black text-gold terminal-font" x-text="totalVotes.toLocaleString()"></p>
                    </div>
                    <div class="space-y-2 max-h-[300px] overflow-y-auto">
                        <template x-for="(song, index) in amapianoChart" :key="song.id">
                            <div class="chart-item p-3 bg-white/5 rounded-xl flex items-center justify-between" @click="playPreview(song)">
                                <div class="flex items-center gap-4">
                                    <span class="text-gold font-bold" x-text="index + 1"></span>
                                    <div><p class="text-xs font-bold" x-text="song.title"></p><p class="text-[8px] text-zinc-400" x-text="song.artist"></p></div>
                                </div>
                                <button @click.stop="voteForSong(song.id)" class="px-3 py-1 bg-gold/10 text-gold text-[8px] rounded-full uppercase font-black" x-text="song.userVoted ? 'Voted' : 'Vote'"></button>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="subView === 'chat'" x-transition class="glass rounded-[2rem] md:rounded-[3rem] h-[40vh] md:h-[50vh] flex flex-col overflow-hidden border-white/5 shadow-2xl">
                    <div class="p-4 border-b border-white/5 flex justify-between bg-white/5">
                        <span class="text-[10px] font-black uppercase tracking-widest text-white">Grid Channel</span>
                        <button @click="clearChat()" class="text-[8px] text-zinc-400 hover:text-red-400 uppercase tracking-wider">Clear</button>
                    </div>
                    <div class="flex-grow overflow-y-auto p-4 md:p-6 space-y-4" x-ref="chatContainer">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === username ? 'ml-auto items-end' : 'mr-auto items-start'" class="flex flex-col gap-1 max-w-[85%]">
                                <span class="text-[7px] font-black text-zinc-400 uppercase" x-text="msg.username"></span>
                                <div :class="msg.username === username ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-3 md:p-4 border rounded-2xl text-[11px] md:text-[12px] leading-relaxed" x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="sendMessage()" class="p-4 bg-black/40 border-t border-gold/10 flex gap-3">
                        <input x-model="msgInput" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[12px] text-white outline-none terminal-font">
                        <button type="submit" :disabled="!msgInput.trim()" class="text-gold hover:bg-gold/10 rounded-full p-2 transition-all"><i data-lucide="send-horizontal" class="w-5 h-5"></i></button>
                    </form>
                </div>

                <div x-show="subView === 'gallery'" x-transition class="glass rounded-[2rem] md:rounded-[3rem] h-[50vh] flex flex-col overflow-hidden border-white/5">
                    <div class="p-4 md:p-6 grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto">
                        <template x-for="img in galleryItems" :key="img.id">
                            <div class="relative aspect-square rounded-2xl overflow-hidden glass border border-white/10 cursor-pointer" @click="selectedImage = img.url">
                                <img :src="img.url" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500">
                            </div>
                        </template>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3 md:gap-4">
                    <div class="glass p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-400 uppercase tracking-wider mb-1">Messages</p>
                        <p class="text-lg font-black text-white terminal-font" x-text="messages.length"></p>
                    </div>
                    <div class="glass p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-400 uppercase tracking-wider mb-1">Assets</p>
                        <p class="text-lg font-black text-gold terminal-font" x-text="galleryItems.length"></p>
