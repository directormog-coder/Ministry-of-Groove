<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #D4AF37; overflow-x: hidden; }
        .glass-panel { background: rgba(10, 10, 10, 0.96); backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .gold-glow { filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.25)); }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        @keyframes scan { 0% { background-position: 0 -100vh; } 100% { background-position: 0 100vh; } }
        .scanning { background: linear-gradient(to bottom, transparent, rgba(212,175,55,0.05), transparent); background-size: 100% 100vh; animation: scan 4s linear infinite; }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak class="scanning">

    <template x-if="appState === 'landing'">
        <div class="h-screen w-screen flex flex-col items-center justify-center p-6 text-center bg-black">
            <div @click="startUplink()" class="cursor-pointer group active:scale-95 transition-all">
                <img src="/logo.png" class="h-48 w-48 mx-auto mb-10 gold-glow animate-pulse group-hover:scale-110 transition-transform duration-700">
                <h1 class="text-white text-3xl md:text-5xl tracking-[0.5em] font-black uppercase italic">Ministry of Groove</h1>
                <p class="text-gold/40 text-[10px] tracking-[1.2em] mt-8 uppercase opacity-60">Initialize National Grid</p>
            </div>
        </div>
    </template>

    <template x-if="appState === 'grid'">
        <div class="min-h-screen flex flex-col animate-in fade-in duration-1000">
            <header class="p-5 border-b border-gold/10 glass-panel flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <img src="/logo.png" class="h-10 w-10 gold-glow">
                    <div class="hidden md:block">
                        <h2 class="text-white text-[10px] font-black uppercase tracking-widest italic">National Command Center</h2>
                        <p class="text-[7px] text-blue-400 font-bold uppercase tracking-widest">Sector_eMalahleni_Stable</p>
                    </div>
                </div>
                <div class="flex gap-4 items-center">
                    <button @click="exportDossier()" class="text-[9px] border border-gold/30 px-5 py-2 uppercase font-black hover:bg-gold hover:text-black transition-all">Export Dossier</button>
                    <button @click="logout()" class="text-[9px] text-red-500 font-black uppercase hover:opacity-70">Disconnect</button>
                </div>
            </header>

            <main class="flex-grow grid grid-cols-1 md:grid-cols-12 p-4 md:p-8 gap-6">
                <aside class="md:col-span-3 space-y-4">
                    <div class="glass-panel p-6 rounded-[2rem] h-[450px] flex flex-col border-blue-500/10">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-[9px] uppercase tracking-widest text-gold/50 font-black italic">Active_Operatives</h3>
                            <div class="h-2 w-2 bg-green-500 rounded-full animate-ping"></div>
                        </div>
                        <div class="overflow-y-auto space-y-2 pr-2">
                            <template x-for="m in members" :key="m.id">
                                <div class="flex items-center gap-3 p-3 bg-white/5 rounded-2xl border border-white/5 hover:border-gold/30 transition-all cursor-default">
                                    <div class="h-8 w-8 rounded-full bg-gold/10 border border-gold/20 flex items-center justify-center text-[10px] text-gold font-black" x-text="(m.full_name || 'U')[0]"></div>
                                    <span class="text-[10px] text-white uppercase font-black tracking-tight" x-text="m.full_name || 'Classified'"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </aside>

                <div class="md:col-span-9 glass-panel rounded-[2.5rem] flex flex-col h-[75vh] md:h-[80vh] overflow-hidden shadow-2xl border-white/5">
                    <div class="p-4 bg-white/5 border-b border-white/5 flex items-center justify-between">
                        <span class="text-[9px] font-black text-blue-400 uppercase tracking-widest">Encrypted_Frequency_Active</span>
                        <i data-lucide="shield-check" class="text-green-500/50" size="14"></i>
                    </div>
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-6 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.user_id === user?.id ? 'justify-end' : 'justify-start'" class="flex animate-in slide-in-from-bottom-2 duration-300">
                                <div :class="msg.user_id === user?.id ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-zinc-900 text-zinc-300 rounded-tl-none border border-white/5'" 
                                     class="max-w-[85%] md:max-w-[70%] p-4 rounded-3xl shadow-2xl">
                                    <p class="text-xs font-medium leading-relaxed tracking-wide" x-text="msg.text"></p>
                                    <div class="text-[7px] mt-2 opacity-40 uppercase font-black text-right" x-text="new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <form @submit.prevent="sendMessage()" class="p-5 bg-black/80 border-t border-white/5 flex gap-3">
                        <input x-model="newMessage" placeholder="INPUT TRANSMISSION..." class="flex-grow bg-zinc-900/50 p-4 rounded-2xl text-xs text-white outline-none border border-white/10 focus:border-gold/50 transition-all uppercase tracking-widest placeholder-zinc-700">
                        <button type="submit" class="bg-gold text-black px-8 rounded-2xl font-black text-[10px] hover:bg-white transition-all italic tracking-tighter uppercase">Transmit</button>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <template x-if="authView">
        <div class="fixed inset-0 z-[100] bg-black/98 flex items-center justify-center p-4 backdrop-blur-xl">
            <div class="max-w-md w-full p-10 glass-panel rounded-[3rem] text-center shadow-[0_0_80px_rgba(212,175,55,0.15)] border-gold/20">
                <div class="mb-8">
                    <template x-if="authView === 'set_passkey'"><i data-lucide="fingerprint" class="mx-auto text-blue-500 animate-pulse" size="56"></i></template>
                    <template x-if="authView !== 'set_passkey'"><i data-lucide="shield-alert" class="mx-auto text-gold animate-flicker" size="56"></i></template>
                </div>
                
                <h2 class="text-white tracking-[0.4em] uppercase font-black mb-2 text-sm" x-text="authView.replace('_', ' ')"></h2>
                <p class="text-gold/40 text-[8px] uppercase tracking-[0.5em] mb-10">Directorate Security Protocol</p>
                
                <form @submit.prevent="runAuthAction()" class="space-y-5">
                    <template x-if="authView !== 'set_passkey'">
                        <input type="email" x-model="email" placeholder="ACCESS_EMAIL" required class="w-full bg-zinc-900/50 p-5 rounded-2xl text-white text-[10px] border border-white/10 outline-none focus:border-gold/50 tracking-widest transition-all">
                    </template>
                    
                    <input type="password" x-model="authView === 'set_passkey' ? passkey : password" 
                           :placeholder="authView === 'set_passkey' ? 'ESTABLISH_6_CHAR_PASSKEY' : 'SECURITY_CODE'" 
                           required class="w-full bg-zinc-900/50 p-5 rounded-2xl text-white text-[10px] border border-white/10 outline-none focus:border-gold/50 tracking-widest transition-all">
                    
                    <button type="submit" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase tracking-[0.4em] rounded-2xl hover:bg-white hover:scale-[1.02] transition-all duration-500 shadow-xl">
                        Execute_Protocol
                    </button>
                </form>

                <template x-if="authView !== 'set_passkey'">
                    <div class="mt-4">
                        <div class="flex items-center gap-4 my-8 opacity-20"><div class="h-[1px] bg-white flex-grow"></div><span class="text-[8px] font-black italic">OR</span><div class="h-[1px] bg-white flex-grow"></div></div>
                        <button type="button" @click="loginWithGoogle()" class="w-full py-5 bg-white/5 text-white font-bold text-[9px] uppercase tracking-widest rounded-2xl border border-white/10 flex items-center justify-center gap-3 hover:bg-white/10 transition-all">
                            <i data-lucide="chrome" size="14"></i> GOOGLE_UPLINK_SECURE
                        </button>
                    </div>
                </template>

                <div class="mt-10 flex justify-center gap-8 text-[9px] uppercase font-black tracking-widest opacity-30">
                    <button type="button" class="hover:text-gold hover:opacity-100 transition-all" @click="authView = 'login'">Login Access</button>
                    <button type="button" class="hover:text-gold hover:opacity-100 transition-all" @click="authView = 'register'">New Operative</button>
                </div>
            </div>
        </div>
    </template>
    
    <script>
        function app() {
            return {
                appState: 'landing', authView: 'login', user: null, profile: null,
                email: '', password: '', passkey: '', newMessage: '',
                messages: [], members: [], supabase: null, channel: null,

                async init() {
                    // SECURE CREDENTIALS INTEGRATED
                    const SB_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
                    
                    this.supabase = window.supabase.createClient(SB_URL, SB_KEY);
                    
                    const { data: { session } } = await this.supabase.auth.getSession();
                    if (session) await this.handleAuthSuccess(session.user);

                    this.supabase.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session) await this.handleAuthSuccess(session.user);
                        if (event === 'SIGNED_OUT') {
                            this.user = null;
                            this.appState = 'landing';
                            this.authView = 'login';
                            if (this.channel) this.supabase.removeChannel(this.channel);
                        }
                    });
                    lucide.createIcons();
                },

                async loginWithGoogle() {
                    const { error } = await this.supabase.auth.signInWithOAuth({ 
                        provider: 'google', 
                        options: { redirectTo: window.location.origin } 
                    });
                    if (error) alert(error.message);
                },

                runAuthAction() {
                    if (this.authView === 'login') this.handleLogin();
                    else if (this.authView === 'register') this.handleRegister();
                    else if (this.authView === 'set_passkey') this.finalizeSecurity();
                },

                async handleLogin() {
                    const { error } = await this.supabase.auth.signInWithPassword({ email: this.email, password: this.password });
                    if (error) alert(error.message);
                },

                async handleRegister() {
                    const { error } = await this.supabase.auth.signUp({ email: this.email, password: this.password });
                    if (error) alert(error.message); 
                    else alert("Access Request Sent. Verify email then login.");
                },

                async handleAuthSuccess(user) {
                    this.user = user;
                    
                    // Fetch existing profile or create new
                    let { data: profile, error } = await this.supabase.from('members').select('*').eq('user_id', user.id).maybeSingle();
                    
                    if (!profile) {
                        const { data: newProfile } = await this.supabase.from('members')
                            .insert([{ user_id: user.id, full_name: user.email.split('@')[0], gate_two_complete: false }])
                            .select().single();
                        profile = newProfile;
                    }
                    
                    this.profile = profile;
                    
                    // Logic Gate check
                    if (!profile.gate_two_complete) {
                        this.authView = 'set_passkey';
                        this.$nextTick(() => lucide.createIcons());
                    } else {
                        this.authView = null;
                        this.startUplink();
                        this.fetchData();
                        this.subscribeToMessages();
                    }
                },

                async finalizeSecurity() {
                    if (this.passkey.length < 6) return alert("Security Error: Passkey must be 6+ characters.");
                    
                    try {
                        // Update User Password
                        const { error: authError } = await this.supabase.auth.updateUser({ password: this.passkey });
                        if (authError) throw authError;

                        // Finalize Database Entry
                        const { error: dbError } = await this.supabase.from('members')
                            .update({ gate_two_complete: true }).eq('user_id', this.user.id);
                        if (dbError) throw dbError;

                        // Refresh State & Transition
                        const { data } = await this.supabase.from('members').select('*').eq('user_id', this.user.id).single();
                        this.profile = data;
                        this.authView = null; 
                        this.startUplink();
                        this.fetchData();
                        this.subscribeToMessages();
                    } catch (err) {
                        alert("Protocol Failure: " + err.message);
                    }
                },

                async fetchData() {
                    const { data: members } = await this.supabase.from('members').select('*');
                    this.members = members || [];
                    const { data: msg } = await this.supabase.from('messages').select('*').order('created_at', { ascending: true });
                    this.messages = msg || [];
                    this.scrollToBottom();
                },

                subscribeToMessages() {
                    if (this.channel) return;
                    this.channel = this.supabase.channel('hq').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => {
                        this.messages.push(p.new);
                        this.scrollToBottom();
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    const textToSend = this.newMessage.toUpperCase();
                    this.newMessage = ''; // Immediate UI clear
                    await this.supabase.from('messages').insert([{ text: textToSend, user_id: this.user.id, sender_name: this.profile?.full_name }]);
                },

                logout() { this.supabase.auth.signOut(); },
                startUplink() { this.appState = 'grid'; this.$nextTick(() => { lucide.createIcons(); this.scrollToBottom(); }); },
                scrollToBottom() { this.$nextTick(() => { const el = document.getElementById('chat-stream'); if (el) el.scrollTop = el.scrollHeight; }); },
                
                exportDossier() {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFillColor(5, 5, 5); doc.rect(0, 0, 210, 297, 'F');
                    doc.setTextColor(212, 175, 55); 
                    doc.setFontSize(22); doc.text("MINISTRY OF GROOVE", 105, 40, { align: "center" });
                    doc.setFontSize(10); doc.text("OFFICIAL INTELLIGENCE DOSSIER // eMalahleni HQ", 105, 50, { align: "center" });
                    doc.save(`MOG_Dossier_${Date.now()}.pdf`);
                }
            }
        }
    </script>
</body>
</html>
