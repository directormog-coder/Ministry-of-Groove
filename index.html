<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body x-data="ministry()" x-init="init()" x-cloak>

    <!-- Auth View -->
    <template x-if="view === 'auth'">
        <div class="h-screen w-full flex flex-col items-center justify-center bg-black p-10 text-center animate-in fade-in duration-1000">
            <div class="h-32 w-32 mb-8 gold-glow animate-pulse rounded-full bg-gradient-to-br from-gold/20 to-transparent flex items-center justify-center border border-gold/30">
                <i data-lucide="hexagon" class="w-16 h-16 text-gold"></i>
            </div>
            
            <div class="w-full max-w-xs space-y-6">
                <!-- Operative Login -->
                <div x-show="!showBypass" class="space-y-4">
                    <div class="space-y-1">
                        <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                        <p class="text-gold/40 text-[7px] uppercase font-black tracking-[0.3em]">Grid Synchronization Required</p>
                    </div>
                    
                    <input x-model="handleInput" 
                           type="text" 
                           placeholder="ENTER OPERATIVE HANDLE..." 
                           class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white uppercase outline-none focus:border-gold terminal-font text-center transition-all"
                           @keyup.enter="initializeUser()">
                    
                    <button @click="initializeUser()" 
                            :disabled="isLoading"
                            class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full shadow-lg active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <span x-show="!isLoading">Initialize Access</span>
                        <span x-show="isLoading" class="animate-spin">⟳</span>
                    </button>
                    
                    <button @click="showBypass = true" 
                            class="text-[7px] uppercase text-white/30 tracking-widest hover:text-gold transition-colors">
                        Directorate Override
                    </button>
                </div>

                <!-- Directorate Login -->
                <div x-show="showBypass" 
                     x-transition 
                     class="glass p-6 rounded-[2.5rem] space-y-4 border-gold/40">
                    <h2 class="text-white text-[9px] font-black uppercase tracking-widest italic">Directorate Override</h2>
                    
                    <input x-ref="emailInput"
                           type="email" 
                           placeholder="DIRECTOR_ID" 
                           class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[9px] text-white text-center terminal-font outline-none focus:border-gold">
                    
                    <input x-ref="passwordInput"
                           type="password" 
                           placeholder="PROTOCOL_KEY" 
                           class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[9px] text-white text-center terminal-font outline-none focus:border-gold"
                           @keyup.enter="signInWithEmail()">
                    
                    <button @click="signInWithEmail()" 
                            :disabled="isLoading"
                            class="w-full py-4 bg-white text-black font-black text-[9px] uppercase rounded-full hover:bg-gold transition-colors disabled:opacity-50">
                        <span x-show="!isLoading">Execute Authorization</span>
                        <span x-show="isLoading">AUTHENTICATING...</span>
                    </button>
                    
                    <button @click="showBypass = false" 
                            class="text-[7px] uppercase text-white/40 tracking-widest hover:text-white">
                        Abort
                    </button>
                </div>
                
                <p x-show="errorMsg" 
                   x-text="errorMsg" 
                   x-transition
                   class="text-red-500 text-[8px] uppercase font-black animate-pulse"></p>
            </div>
        </div>
    </template>

    <!-- Main Grid View -->
    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col relative animate-in fade-in duration-500 pb-[100px]">
            
            <!-- Header -->
            <header class="p-6 border-b border-gold/10 glass flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <div class="h-10 w-10 gold-glow rounded-full bg-gradient-to-br from-gold/20 to-transparent flex items-center justify-center border border-gold/30">
                        <i data-lucide="hexagon" class="w-5 h-5 text-gold"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black uppercase text-white tracking-widest italic leading-tight">Ministry of Groove</p>
                        <p class="text-[6px] text-gold/40 uppercase tracking-widest" x-text="username"></p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-right">
                        <p id="sast-clock" class="terminal-font text-[10px] text-white">00:00:00</p>
                        <p id="weather-display" class="text-[6px] text-gold/40 font-black uppercase tracking-tighter">SYNCING...</p>
                    </div>
                    <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg hover:bg-red-900/20 transition-colors">
                        <i data-lucide="power" size="16"></i>
                    </button>
                </div>
            </header>

            <!-- Main Content -->
            <main class="p-6 space-y-6 max-w-5xl mx-auto w-full overflow-y-auto">
                
                <!-- Navigation Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div @click="subView = 'chat'" 
                         :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10' : 'border-gold/10'" 
                         class="glass p-6 sm:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Grid</span>
                    </div>
                    
                    <div @click="window.location.href='dossier.html'" 
                         class="glass p-6 sm:p-8 rounded-[2rem] text-center cursor-pointer border border-gold/10 hover:border-green-400/30 hover:scale-105 transition-all">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Dossier</span>
                    </div>
                    
                    <div @click="subView = 'gallery'" 
                         :class="subView === 'gallery' ? 'border-purple-400 bg-purple-400/10' : 'border-gold/10'" 
                         class="glass p-6 sm:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Gallery</span>
                    </div>
                    
                    <div @click="window.location.href='archives.html'" 
                         class="glass p-6 sm:p-8 rounded-[2rem] text-center cursor-pointer border border-gold/10 hover:border-gold/50 hover:scale-105 transition-all">
                        <i data-lucide="database" class="mx-auto mb-2 text-gold"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white">Vault</span>
                    </div>
                </div>

                <!-- Chat Section -->
                <div x-show="subView === 'chat'" 
                     class="glass rounded-[3rem] h-[45vh] flex flex-col overflow-hidden border-white/5">
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-4">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === 'DIRECTORATE' ? 'ml-auto items-end' : 'mr-auto items-start'" 
                                 class="flex flex-col gap-1 max-w-[85%]">
                                <div class="flex items-center gap-2">
                                    <template x-if="msg.username === 'DIRECTORATE'">
                                        <div class="h-4 w-4 rounded-full bg-gold/20 flex items-center justify-center border border-gold/40">
                                            <i data-lucide="shield" class="w-2 h-2 text-gold"></i>
                                        </div>
                                    </template>
                                    <span class="text-[7px] font-black text-zinc-500 uppercase tracking-wider" x-text="msg.username"></span>
                                    <span class="text-[6px] text-zinc-600" x-text="new Date(msg.created_at).toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'})"></span>
                                </div>
                                <div :class="msg.username === 'DIRECTORATE' ? 'bg-gold/10 border-gold/20 text-white' : 'bg-white/5 border-white/5 text-white/80'" 
                                     class="p-4 border rounded-2xl text-[12px] leading-relaxed" 
                                     x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    
                    <form @submit.prevent="send()" class="p-4 bg-black/40 border-t border-gold/10 flex gap-3">
                        <input x-model="msgInput" 
                               placeholder="COMMAND UPLINK..." 
                               class="flex-grow bg-transparent text-[12px] text-white outline-none placeholder:text-zinc-600"
                               maxlength="500">
                        <button type="submit" 
                                :disabled="!msgInput.trim()"
                                class="text-gold active:scale-90 transition-all disabled:opacity-30">
                            <i data-lucide="send-horizontal"></i>
                        </button>
                    </form>
                </div>

                <!-- Gallery Section -->
                <div x-show="subView === 'gallery'" 
                     class="glass rounded-[3rem] h-[45vh] flex flex-col overflow-hidden border-white/5 p-6">
                    <div class="flex justify-between items-center mb-4 px-2">
                        <h3 class="text-[10px] font-black uppercase tracking-widest text-white italic">Visual Archives</h3>
                        <label class="cursor-pointer bg-gold text-black px-4 py-2 rounded-full text-[8px] font-black uppercase active:scale-95 transition-all shadow-lg hover:shadow-gold/20 disabled:opacity-50" :class="{ 'opacity-50 cursor-not-allowed': isLoading }">
                            <i data-lucide="upload" size="12" class="inline mr-1"></i> 
                            <span x-text="isLoading ? 'UPLOADING...' : 'Transmit Asset'"></span>
                            <input type="file" @change="uploadImage" class="hidden" accept="image/*" :disabled="isLoading">
                        </label>
                    </div>
                    
                    <div class="gallery-grid overflow-y-auto flex-grow pr-2">
                        <template x-for="img in galleryItems" :key="img.id">
                            <div class="relative aspect-square rounded-2xl overflow-hidden glass group border border-white/10 cursor-pointer hover:border-gold/30 transition-all">
                                <img :src="img.url" 
                                     class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700"
                                     loading="lazy">
                                <div class="absolute bottom-0 w-full p-2 bg-gradient-to-t from-black/90 to-transparent opacity-0 group-hover:opacity-100 transition-all">
                                    <p class="text-[6px] text-white truncate uppercase terminal-font" x-text="img.owner"></p>
                                    <p class="text-[5px] text-gold/60" x-text="new Date(img.created_at).toLocaleDateString()"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </main>
            
            <!-- Footer -->
            <footer class="glass border-t border-gold/20 flex flex-col sm:flex-row justify-between items-center px-6 py-4 gap-4 sm:gap-0 fixed bottom-0 w-full left-0 z-40">
                <div class="flex flex-col items-center sm:items-start gap-1">
                    <p class="terminal-font text-[7px] font-black uppercase text-gold/60">© 2026 MINISTRY OF GROOVE</p>
                    <div class="flex gap-3 text-[6px] font-black uppercase tracking-widest text-gold/30
