<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D4AF37">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            background-color: #050505; 
            color: #D4AF37; 
            font-family: 'Inter', sans-serif;
            background-image: url('logo.png'); 
            background-repeat: no-repeat;
            background-position: center; 
            background-attachment: fixed; 
            background-size: 35%;
            overflow-x: hidden;
        }

        /* High-Definition Directorate Overlay */
        body::before {
            content: ""; 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.96); 
            z-index: -1;
        }

        .glass-panel { 
            background: rgba(13, 13, 13, 0.9); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
        }

        .gold-glow { 
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3)); 
        }

        [x-cloak] { display: none !important; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }

        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-directorate { animation: pulse-slow 4s infinite; }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

    <template x-if="appState === 'landing'">
        <div class="h-screen w-screen flex flex-col items-center justify-center text-center p-6 bg-black">
            <div @click="startUplink()" class="cursor-pointer group active:scale-95 transition-all">
                <img src="logo.png" class="h-56 w-56 mx-auto mb-10 gold-glow animate-pulse group-hover:scale-110 transition-transform duration-700">
                <h1 class="text-white text-4xl md:text-6xl tracking-[0.5em] font-black uppercase italic mb-4">Ministry of Groove</h1>
                <p class="text-gold/40 text-[10px] tracking-[1.2em] mt-8 uppercase animate-directorate">Initialize National Grid</p>
            </div>
        </div>
    </template>

    <template x-if="appState === 'grid'">
        <div class="min-h-screen flex flex-col animate-in fade-in duration-1000">
            <header class="p-4 md:p-6 border-b border-gold/10 glass-panel flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 gold-glow">
                    <div class="hidden md:block">
                        <h2 class="text-white text-[11px] font-black uppercase tracking-widest italic">National Command Center</h2>
                        <p class="text-[7px] text-blue-400 font-bold uppercase tracking-widest">Sector_eMalahleni_Titanium_Stable</p>
                    </div>
                </div>
                <div class="flex gap-4 items-center">
                    <button @click="requestNotify()" class="text-[8px] border border-blue-500/30 px-4 py-2 text-blue-400 uppercase font-black hover:bg-blue-500 hover:text-white transition-all">Enable Alerts</button>
                    <button @click="logout()" class="text-[9px] text-red-500 font-black uppercase tracking-widest hover:opacity-50">Disconnect</button>
                </div>
            </header>

            <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
                <div class="w-full max-w-6xl glass-panel rounded-[3rem] h-[80vh] flex flex-col overflow-hidden shadow-[0_0_100px_rgba(0,0,0,0.5)] border-white/5">
                    
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-8 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.user_id === user?.id ? 'justify-end' : 'justify-start'" class="flex animate-in slide-in-from-bottom-3 duration-300">
                                <div :class="msg.user_id === user?.id ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-zinc-900 text-zinc-300 rounded-tl-none border border-white/5'" 
                                     class="max-w-[85%] md:max-w-[70%] p-5 rounded-[2rem] shadow-2xl">
                                    
                                    <template x-if="msg.image_url">
                                        <div class="mb-3 overflow-hidden rounded-2xl border border-white/10">
                                            <img :src="msg.image_url" class="max-h-72 w-full object-cover cursor-zoom-in hover:scale-105 transition-all duration-700">
                                        </div>
                                    </template>
                                    
                                    <p class="text-[13px] font-medium leading-relaxed tracking-wide" x-text="msg.text"></p>
                                    <div class="text-[8px] mt-3 opacity-40 uppercase font-black text-right tracking-tighter" x-text="new Date(msg.created_at).toLocaleTimeString()"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <form @submit.prevent="sendMessage()" class="p-6 bg-black/80 border-t border-white/5 flex items-center gap-4">
                        <label class="cursor-pointer text-gold/40 hover:text-gold transition-all p-3 hover:bg-white/5 rounded-full">
                            <i data-lucide="paperclip" size="24"></i>
                            <input type="file" class="hidden" @change="uploadImage($event)" accept="image/*">
                        </label>
                        <input x-model="newMessage" placeholder="INPUT TRANSMISSION..." class="flex-grow bg-zinc-900/50 p-5 rounded-[1.5rem] text-xs text-white outline-none border border-white/10 focus:border-gold/50 transition-all uppercase tracking-[0.2em] placeholder-zinc-700">
                        <button type="submit" class="bg-gold text-black px-12 py-5 rounded-[1.5rem] font-black text-[11px] hover:bg-white transition-all italic uppercase tracking-tighter">Transmit</button>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <template x-if="authView">
        <div class="fixed inset-0 z-[100] bg-black/98 flex items-center justify-center p-4 backdrop-blur-xl">
            <div class="max-w-md w-full p-12 glass-panel rounded-[3.5rem] text-center shadow-[0_0_100px_rgba(212,175,55,0.1)] border-gold/20">
                <i :data-lucide="authView === 'set_passkey' ? 'fingerprint' : 'shield-alert'" class="mx-auto text-gold mb-10 animate-pulse" size="64"></i>
                <h2 class="text-white tracking-[0.5em] uppercase font-black mb-12 text-sm" x-text="authView.replace('_', ' ')"></h2>
                
                <form @submit.prevent="runAuthAction()" class="space-y-6">
                    <template x-if="authView !== 'set_passkey'">
                        <input type="email" x-model="email" placeholder="ACCESS_EMAIL" required class="w-full bg-zinc-900 p-5 rounded-2xl text-white text-[11px] border border-white/10 outline-none focus:border-gold/50 tracking-widest">
                    </template>
                    <input type="password" x-model="authView === 'set_passkey' ? passkey : password"  placeholder="SECURITY_CODE (MIN 6 CHARS)" required class="w-full bg-zinc-900 p-5 rounded-2xl text-white text-[11px] border border-white/10 outline-none focus:border-gold/50 tracking-widest">
                    <button type="submit" class="w-full py-6 bg-gold text-black font-black text-[11px] uppercase tracking-[0.4em] rounded-2xl hover:bg-white transition-all shadow-xl">Execute_Protocol</button>
                </form>

                <template x-if="authView !== 'set_passkey'">
                    <button @click="loginWithGoogle()" class="w-full mt-6 py-6 bg-white/5 text-white font-bold text-[10px] uppercase tracking-widest rounded-2xl border border-white/10 flex items-center justify-center gap-4 hover:bg-white/10 transition-all">
                        <i data-lucide="chrome" size="16"></i> GOOGLE_UPLINK_SECURE
                    </button>
                    <div class="mt-12 flex justify-center gap-10 text-[10px] uppercase font-black tracking-widest opacity-30">
                        <button type="button" @click="authView = 'login'" class="hover:text-gold transition-all">Login</button>
                        <button type="button" @click="authView = 'register'" class="hover:text-gold transition-all">Register</button>
                    </div>
                </template>
            </div>
        </div>
    </template>

    <script>
        function app() {
            return {
                appState: 'landing', authView: 'login', user: null, profile: null,
                email: '', password: '', passkey: '', newMessage: '',
                messages: [], supabase: null, channel: null,

                async init() {
                    const SB_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
                    
                    this.supabase = window.supabase.createClient(SB_URL, SB_KEY);
                    
                    const { data: { session } } = await this.supabase.auth.getSession();
                    if (session) await this.handleAuthSuccess(session.user);

                    this.supabase.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session) await this.handleAuthSuccess(session.user);
                        if (event === 'SIGNED_OUT') { location.reload(); }
                    });

                    lucide.createIcons();
                    
                    // Service Worker for PWA
                    if ('serviceWorker' in navigator) { 
                        window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js')); 
                    }
                },

                async handleAuthSuccess(user) {
                    this.user = user;
                    
                    // First-Time Email Confirmation Guard
                    if (!user.confirmed_at) {
                        alert("DIRECTORATE OVERRIDE: Email verification required. Check your inbox before uplink.");
                        await this.supabase.auth.signOut();
                        return;
                    }

                    let { data: profile } = await this.supabase.from('members').select('*').eq('user_id', user.id).maybeSingle();
                    if (!profile) {
                        const { data } = await this.supabase.from('members').insert([{ user_id: user.id, full_name: user.email.split('@')[0], gate_two_complete: false }]).select().single();
                        profile = data;
                    }
                    this.profile = profile;
                    
                    // Gate Two Passkey Logic
                    if (!profile.gate_two_complete) {
                        this.authView = 'set_passkey';
                        this.$nextTick(() => lucide.createIcons());
                    } else {
                        this.authView = null;
                        this.startUplink();
                        this.fetchData();
                        this.subscribeToMessages();
                    }
                },

                async uploadImage(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const path = `chat/${Date.now()}-${file.name}`;
                    const buffer = await file.arrayBuffer();
                    
                    const { data, error } = await this.supabase.storage.from('chat-attachments').upload(path, buffer, { contentType: file.type });
                    
                    if (data) {
                        const { data: { publicUrl } } = this.supabase.storage.from('chat-attachments').getPublicUrl(path);
                        await this.supabase.from('messages').insert([{ 
                            image_url: publicUrl, 
                            user_id: this.user.id, 
                            text: `UPLINKED_MEDIA: ${file.name.toUpperCase()}` 
                        }]);
                    } else {
                        alert("Uplink Error: " + error.message);
                    }
                },

                async requestNotify() {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') alert("Protocol Enabled: HQ Transmissions will now trigger alerts.");
                },

                subscribeToMessages() {
                    if (this.channel) return;
                    this.channel = this.supabase.channel('hq').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => {
                        this.messages.push(p.new);
                        // Push Notification Logic
                        if (p.new.user_id !== this.user.id && Notification.permission === 'granted') {
                            new Notification("NCC HQ: NEW TRANSMISSION", { body: p.new.text, icon: 'logo.png' });
                        }
                        this.scrollToBottom();
                    }).subscribe();
                },

                runAuthAction() {
                    if (this.authView === 'login') this.handleLogin();
                    else if (this.authView === 'register') this.handleRegister();
                    else this.finalizeSecurity();
                },

                async finalizeSecurity() {
                    if (this.passkey.length < 6) return alert("Security Breach: Passkey must be 6+ characters.");
                    const { error: authErr } = await this.supabase.auth.updateUser({ password: this.passkey });
                    const { error: dbErr } = await this.supabase.from('members').update({ gate_two_complete: true }).eq('user_id', this.user.id);
                    if (!authErr && !dbErr) { location.reload(); }
                },

                async handleLogin() { const { error } = await this.supabase.auth.signInWithPassword({ email: this.email, password: this.password }); if (error) alert(error.message); },
                async handleRegister() { const { error } = await this.supabase.auth.signUp({ email: this.email, password: this.password }); if (error) alert(error.message); else alert("Recruitment Request Initialized. Check your email."); },
                async fetchData() { const { data } = await this.supabase.from('messages').select('*').order('created_at', { ascending: true }); this.messages = data || []; this.scrollToBottom(); },
                async sendMessage() { if (!this.newMessage.trim()) return; const txt = this.newMessage.toUpperCase(); this.newMessage = ''; await this.supabase.from('messages').insert([{ text: txt, user_id: this.user.id }]); },
                async loginWithGoogle() { await this.supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } }); },
                logout() { this.supabase.auth.signOut(); },
                startUplink() { this.appState = 'grid'; this.$nextTick(() => { lucide.createIcons(); this.scrollToBottom(); }); },
                scrollToBottom() { this.$nextTick(() => { const el = document.getElementById('chat-stream'); if (el) el.scrollTop = el.scrollHeight; }); }
            }
        }
    </script>
</body>
</html>
