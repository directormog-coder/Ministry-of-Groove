<!DOCTYPE html>
<html lang="en" color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <title>M.O.G. | OPERATIVE HUB</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --surface: rgba(10, 12, 10, 0.98);
      --gold: #d4af37;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --teal: #00d4aa;
      --red: #dc2626;
      --text: #e8e0cc;
      --border: rgba(212, 175, 55, 0.15);
    }

    body { font-family: 'Rajdhani', sans-serif; background: var(--black); color: var(--text); overflow-x: hidden; margin: 0; }
    [x-cloak] { display: none !important; }

    /* HARDWARE LOGO SCALING */
    .logo-frame {
      position: relative;
      width: clamp(40px, 8vw, 60px);
      height: clamp(40px, 8vw, 60px);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-frame img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 10px var(--gold-glow)); }

    /* TILES & BADGES */
    .panel-glass { background: var(--surface); border: 1px solid var(--border); border-radius: 1.5rem; backdrop-filter: blur(20px); }
    .badge-hex { 
      width: 76px; height: 86px; 
      background: rgba(15, 15, 15, 0.9); 
      border: 1px solid var(--gold); 
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: transform 0.3s ease, border-color 0.3s;
    }
    .badge-hex:hover { transform: translateY(-5px); border-color: var(--teal); }

    /* TICKER */
    .ticker-wrap { height: 32px; background: linear-gradient(90deg, #600, #000, #600); border-bottom: 1px solid var(--border); display: flex; align-items: center; overflow: hidden; }
    .ticker-label { background: var(--red); color: #fff; font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900; padding: 0 15px; height: 100%; display: flex; align-items: center; font-style: italic; }
    .ticker-move { display: flex; white-space: nowrap; animation: tickerScroll 30s linear infinite; }
    @keyframes tickerScroll { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    /* BACKGROUND ELEMENTS */
    .bg-seal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80vmin; opacity: 0.03; z-index: 0; pointer-events: none; }
    .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 50px 50px; z-index: 1; pointer-events: none; }
  </style>

  <script>
    function hub() {
      return {
        view: 'loading',
        isLoading: false,
        operativeId: 'OP:OFFLINE',
        profile: { username: 'RECRUIT', rank: 'INITIATE', avatar_url: null, stats: { loyalty: 100, groove: 50 } },
        tickerMsgs: ["UPLINK STABLE", "SECTOR 7G SCANNING", "ENCRYPTION ACTIVE"],

        async init() {
          // Fix: Ensure Supabase is defined before proceeding
          let check = 0; while (typeof sb === 'undefined' && check < 50) { await new Promise(r => setTimeout(r, 100)); check++; }
          if (typeof sb === 'undefined') return;

          try {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) { window.location.href = '/login.html'; return; }
            this.operativeId = `OP-${session.user.id.slice(0, 8).toUpperCase()}`;
            await this.syncData(session.user.id);
            this.view = 'hub';
            this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
          } catch (e) { console.error(e); }
        },

        async syncData(userId) {
          this.isLoading = true;
          const { data } = await sb.from('profiles').select('*').eq('id', userId).single();
          if (data) this.profile = { ...this.profile, ...data };
          this.isLoading = false;
        },

        async logout() { await sb.auth.signOut(); window.location.href = '/login.html'; }
      };
    }
  </script>
</head>
<body x-data="hub()" x-init="init()" x-cloak>
  <img src="assets/images/logo.png" class="bg-seal">
  <div class="bg-grid"></div>

  <template x-if="view === 'hub'">
    <div class="relative z-10 pt-12 max-w-6xl mx-auto px-4">
      
      <div class="ticker-wrap fixed top-0 left-0 right-0 z-50">
        <div class="ticker-label">LIVE FEED</div>
        <div class="ticker-move">
          <template x-for="m in tickerMsgs" :key="m">
            <span class="font-mono text-[11px] text-white/80 px-10 flex items-center gap-2">◈ <span x-text="m"></span></span>
          </template>
        </div>
      </div>

      <nav class="panel-glass p-4 flex justify-between items-center mb-8 border-gold/20">
        <div class="flex items-center gap-4">
          <div class="logo-frame">
            <img src="assets/images/logo.png" alt="Logo">
          </div>
          <div>
            <h1 class="font-orbit text-white text-sm font-black tracking-widest uppercase">Operative Hub</h1>
            <p class="font-mono text-gold text-[10px]" x-text="operativeId"></p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <template x-if="profile.rank === 'DIRECTOR'">
            <a href="pages/directorate.html" class="text-gold border border-gold/40 px-3 py-1 rounded text-[10px] font-orbit">DIRECTORATE</a>
          </template>
          <button @click="logout()" class="text-gray-500 hover:text-red-500"><i data-lucide="power"></i></button>
        </div>
      </nav>

          <main class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="lg:col-span-1 panel-glass p-8 text-center">
          <div class="w-32 h-32 mx-auto rounded-2xl border-2 border-gold/30 overflow-hidden mb-4 bg-black">
            <img :src="profile.avatar_url || 'assets/images/logo.png'" class="w-full h-full object-cover">
          </div>
          <h2 class="font-orbit text-white text-lg font-black uppercase" x-text="profile.username"></h2>
          <p class="font-mono text-gold text-xs tracking-widest" x-text="profile.rank"></p>
        </div>

        <div class="lg:col-span-3 panel-glass p-8">
          <div class="flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex-1 w-full space-y-4">
              <div class="flex justify-between font-orbit text-[10px] text-teal tracking-widest">
                <span>SYSTEMS NOMINAL</span>
                <span>STATUS: ACTIVE</span>
              </div>
              <div class="h-1 bg-black rounded-full overflow-hidden">
                <div class="h-full bg-teal shadow-[0_0_12px_#00d4aa]" style="width: 100%"></div>
              </div>
            </div>
            <div class="flex gap-4">
              <div class="badge-hex"><i data-lucide="shield" class="text-gold"></i><span class="font-orbit text-[6px] text-white mt-1">SECURE</span></div>
              <div class="badge-hex"><i data-lucide="zap" class="text-gold"></i><span class="font-orbit text-[6px] text-white mt-1">UPLINK</span></div>
            </div>
          </div>
        </div>
      </main>

    </div>
  </template>
</body>
</html>
