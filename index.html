<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="description" content="Ministry of Groove NCC Master - Central Operations Gate & Classified Cultural Archive">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>MINISTRY OF GROOVE | NCC MASTER v5.2.3</title>
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://qqlcwqkpdnxzrhrnkbjg.supabase.co">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    
    <!-- Environment Config -->
    <script src="config/env.js"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            DEFAULT: '#D4AF37',
                            light: '#E5C158',
                            dark: '#B8960C',
                            50: 'rgba(212, 175, 55, 0.05)',
                            100: 'rgba(212, 175, 55, 0.1)',
                            200: 'rgba(212, 175, 55, 0.2)',
                        },
                        electric: {
                            DEFAULT: '#00F2FF',
                            dark: '#00C4CC',
                            50: 'rgba(0, 242, 255, 0.05)',
                            100: 'rgba(0, 242, 255, 0.1)',
                        },
                        mog: {
                            black: '#000000',
                            dark: '#0a0a0f',
                            panel: '#111111',
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Consolas', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scan': 'scan 4s linear infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' }
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(212, 175, 55, 0.2)' },
                            '100%': { boxShadow: '0 0 20px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.3)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        [x-cloak] { display: none !important; }
        
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* MOG Logo Background */
        .mog-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/images/logo.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 70vmin;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
            animation: slowPulse 10s ease-in-out infinite;
        }
        
        @keyframes slowPulse {
            0%, 100% { opacity: 0.04; transform: scale(1); }
            50% { opacity: 0.08; transform: scale(1.02); }
        }
        
        /* Circuit Pattern Overlay */
        .circuit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 242, 255, 0.03) 0%, transparent 50%),
                linear-gradient(rgba(0, 242, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Glass Gold */
        .glass-gold { 
            background: rgba(10, 10, 15, 0.95); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.15); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .glass-gold:focus-within {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }
        
        /* Tactical Tiles */
        .tactical-tile { 
            background: rgba(17, 17, 17, 0.8); 
            border: 1px solid rgba(212, 175, 55, 0.1); 
            border-radius: 1.5rem; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .tactical-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
            transition: left 0.6s;
        }
        
        .tactical-tile:hover::before {
            left: 100%;
        }
        
        .tactical-tile:hover { 
            border-color: #00F2FF; 
            background: rgba(0, 242, 255, 0.05); 
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px -15px rgba(0, 242, 255, 0.2);
        }
        
        /* Directorate Tile - Special styling */
        .directorate-tile {
            background: rgba(17, 17, 17, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            position: relative;
        }
        
        .directorate-tile::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('assets/images/logo.png');
            background-position: center;
            background-size: 150%;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        
        .directorate-tile:hover::after {
            opacity: 0.1;
        }
        
        .directorate-tile:hover {
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 20px 40px -15px rgba(212, 175, 55, 0.4);
        }
        
        /* Branding */
        .brand-title { 
            font-family: 'JetBrains Mono', monospace; 
            letter-spacing: 0.15em; 
            color: #D4AF37; 
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }
        
        .text-electric { color: #00F2FF; }
        .text-gold { color: #D4AF37; }
        .bg-gold { background-color: #D4AF37; }
        .bg-gold:hover { background-color: #E5C158; }
        
        /* Form Inputs */
        .ncc-input {
            transition: all 0.3s ease;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .ncc-input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1), 0 0 20px rgba(212, 175, 55, 0.1);
        }
        
        .ncc-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
        }
        
        /* Animations */
        .loading-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        /* Scanline Effect */
        .scanlines::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.1) 50%,
                rgba(0,0,0,0.1)
            );
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.3;
            z-index: 1;
        }
        
        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .toast {
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            max-width: 350px;
            transform: translateX(400px);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .toast.show {
            transform: translateX(0);
        }
        
        .toast.error {
            background: rgba(220, 38, 38, 0.95);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: white;
        }
        
        .toast.success {
            background: rgba(34, 197, 94, 0.95);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: black;
        }
        
        .toast.warning {
            background: rgba(234, 179, 8, 0.95);
            border: 1px solid rgba(234, 179, 8, 0.5);
            color: black;
        }
        
        .toast.info {
            background: rgba(0, 242, 255, 0.95);
            border: 1px solid rgba(0, 242, 255, 0.5);
            color: black;
        }
        
        /* Security Badge */
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 9999px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #00F2FF;
        }
        
        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Logo styling */
        .logo-container {
            position: relative;
            display: inline-block;
        }
        
        .logo-glow {
            position: absolute;
            inset: -20%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            animation: pulse-slow 3s ease-in-out infinite;
            pointer-events: none;
        }
    </style>
</head>
<body x-data="nccMasterEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen overflow-x-hidden font-mono antialiased selection:bg-gold selection:text-black">

    <!-- MOG Logo Background -->
    <div class="mog-bg" aria-hidden="true"></div>
    <div class="circuit-overlay" aria-hidden="true"></div>

    <!-- Toast Container -->
    <div class="toast-container">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full opacity-0"
                 x-transition:enter-end="translate-x-0 opacity-100"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="translate-x-0 opacity-100"
                 x-transition:leave-end="translate-x-full opacity-0"
                 :class="`toast ${toast.type} ${toast.visible ? 'show' : ''}`"
                 x-text="toast.message">
            </div>
        </template>
    </div>

    <!-- Loading Overlay -->
    <div x-show="loading" 
         class="fixed inset-0 bg-black/95 z-[9999] flex items-center justify-center backdrop-blur-sm"
         x-transition.opacity.duration.300ms>
        <div class="text-center">
            <div class="relative w-24 h-24 mb-6 mx-auto">
                <div class="absolute inset-0 border-2 border-gold/20 rounded-full"></div>
                <div class="absolute inset-0 border-2 border-gold border-t-transparent rounded-full animate-spin"></div>
                <img src="assets/images/logo.png" alt="MOG" class="absolute inset-2 w-20 h-20 rounded-full opacity-60 animate-pulse-slow">
            </div>
            <p class="text-gold text-xs tracking-[0.3em] uppercase loading-pulse" x-text="loadingText"></p>
            <p class="text-[10px] text-zinc-600 mt-2" x-text="loadingSubtext"></p>
        </div>
    </div>

    <!-- Auth View -->
    <template x-if="view === 'auth'">
        <main class="min-h-screen flex flex-col items-center justify-center px-4 relative scanlines">
            <div class="w-full max-w-[420px] space-y-8 relative z-10">
                <!-- Logo Section -->
                <div class="flex flex-col items-center text-center">
                    <div class="logo-container mb-8">
                        <div class="logo-glow"></div>
                        <img src="assets/images/logo.png" 
                             alt="Ministry of Groove" 
                             class="w-36 h-36 relative z-10 drop-shadow-[0_0_30px_rgba(212,175,55,0.5)] animate-float rounded-full border-2 border-gold/30">
                        <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-gradient-to-r from-transparent via-gold to-transparent"></div>
                    </div>
                    <h1 class="brand-title text-2xl font-bold mb-2 tracking-[0.2em]">Ministry of Groove</h1>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-[0.4em] mb-1">Central Operations Gate</p>
                    <div class="security-badge mt-2">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                        <span>System Secure</span>
                    </div>
                    <p class="text-[8px] text-zinc-600 mt-2" x-text="'v' + version"></p>
                </div>

                <!-- Auth Form -->
                <div class="glass-gold p-8 rounded-[2rem] space-y-5 relative" :class="{ 'shake': authError }">
                    <!-- Error Alert -->
                    <div x-show="authError" 
                         x-transition:enter="transition ease-out duration-300"
                         x-transition:enter-start="opacity-0 -translate-y-2"
                         x-transition:enter-end="opacity-100 translate-y-0"
                         class="bg-red-500/10 border border-red-500/30 text-red-400 text-[11px] uppercase tracking-wider p-4 rounded-xl text-center flex items-center justify-center gap-2">
                        <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                        <span x-text="authError"></span>
                    </div>

                    <form @submit.prevent="loginManual()" class="space-y-4">
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="user" class="w-4 h-4 text-zinc-500 group-focus-within:text-gold transition-colors"></i>
                            </div>
                            <input x-model="authForm.id" 
                                   type="email" 
                                   placeholder="IDENTIFICATION" 
                                   class="ncc-input w-full pl-12 pr-4 py-4 rounded-xl text-sm tracking-wider"
                                   :disabled="loading"
                                   autocomplete="username"
                                   required>
                        </div>
                        
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="w-4 h-4 text-zinc-500 group-focus-within:text-gold transition-colors"></i>
                            </div>
                            <input x-model="authForm.pass" 
                                   type="password" 
                                   placeholder="PASSCODE" 
                                   class="ncc-input w-full pl-12 pr-4 py-4 rounded-xl text-sm tracking-widest"
                                   :disabled="loading"
                                   autocomplete="current-password"
                                   required>
                            <button type="button" 
                                    @click="togglePasswordVisibility()"
                                    class="absolute inset-y-0 right-0 pr-4 flex items-center text-zinc-500 hover:text-gold transition-colors">
                                <i :data-lucide="showPassword ? 'eye-off' : 'eye'" class="w-4 h-4"></i>
                            </button>
                        </div>
                        
                        <div class="flex items-center justify-between text-[10px] text-zinc-500 px-1">
                            <label class="flex items-center gap-2 cursor-pointer hover:text-zinc-300 transition-colors">
                                <input type="checkbox" x-model="authForm.remember" class="rounded border-zinc-700 bg-black/50 text-gold focus:ring-gold">
                                <span>Remember this device</span>
                            </label>
                            <a href="#" @click.prevent="showForgotPassword()" class="hover:text-gold transition-colors">Forgot passcode?</a>
                        </div>
                        
                        <button type="submit" 
                        class="w-full py-4 bg-gold text-black font-black uppercase rounded-xl hover:bg-white transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed relative overflow-hidden group shadow-lg shadow-gold/20"
                                :disabled="loading || !authForm.id || !authForm.pass">
                            <span class="relative z-10 flex items-center justify-center gap-2" x-text="loading ? 'Authorizing...' : 'Authorize Access'">
                                <i x-show="loading" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                            </span>
                            <div class="absolute inset-0 bg-white transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300"></div>
                        </button>
                    </form>

                    <div class="flex items-center gap-4 py-2">
                        <div class="flex-grow h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                        <span class="text-[9px] text-zinc-600 uppercase tracking-widest">Or continue with</span>
                        <div class="flex-grow h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
                    </div>

                    <button @click="loginWithGoogle()" 
                            class="w-full py-3.5 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center gap-3 hover:bg-white/10 transition-all duration-300 disabled:opacity-50 group"
                            :disabled="loading">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="text-xs font-bold uppercase tracking-widest" x-text="loading ? 'Connecting...' : 'Biometric Uplink'"></span>
                    </button>
                </div>

                <div class="text-center space-y-2">
                    <p class="text-[9px] text-zinc-600 uppercase tracking-[0.2em] flex items-center justify-center gap-2">
                        <i data-lucide="shield" class="w-3 h-3"></i>
                        Encrypted Connection • TLS 1.3
                    </p>
                    <p class="text-[8px] text-zinc-700" x-text="'Version ' + version"></p>
                </div>
            </div>
        </main>
    </template>

    <!-- Grid Dashboard View -->
    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col relative z-10">
            <!-- Header -->
            <header class="glass-gold sticky top-0 z-50 px-6 py-4 border-b border-white/5">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="logo-container">
                            <div class="logo-glow"></div>
                            <img src="assets/images/logo.png" 
                                 alt="MOG" 
                                 class="w-12 h-12 rounded-full drop-shadow-[0_0_15px_rgba(212,175,55,0.4)] border border-gold/30">
                        </div>
                        <div>
                            <h2 class="brand-title text-sm tracking-[0.2em]">MOG MASTER</h2>
                            <div class="flex items-center gap-2 mt-1">
                                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                <span class="text-[9px] text-electric uppercase tracking-wider" x-text="'Sector: ' + (userRole || 'UNKNOWN')"></span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div class="hidden md:flex items-center gap-3 text-[10px] text-zinc-400 bg-white/5 px-4 py-2 rounded-full border border-white/10">
                            <img src="assets/images/logo.png" class="w-4 h-4 rounded-full opacity-50">
                            <span x-text="userEmail"></span>
                        </div>
                        <button @click="logout()" 
                                class="text-[10px] border border-red-900/50 text-red-500 px-4 py-2.5 rounded-lg hover:bg-red-500 hover:text-white transition-all duration-300 uppercase tracking-wider font-bold flex items-center gap-2 group">
                            <i data-lucide="power" class="w-3 h-3 group-hover:animate-pulse"></i>
                            <span class="hidden sm:inline">Terminate</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
                <!-- Welcome Section -->
                <div class="mb-12 text-center">
                    <div class="inline-block mb-4">
                        <img src="assets/images/logo.png" class="w-16 h-16 rounded-full opacity-30 mx-auto mb-2">
                    </div>
                    <h1 class="text-4xl md:text-5xl font-black italic uppercase tracking-tighter mb-2 gradient-text">
                        Grid Dashboard
                    </h1>
                    <p class="text-[11px] text-zinc-500 uppercase tracking-widest flex items-center justify-center gap-2">
                        <span class="inline-block w-2 h-2 bg-electric rounded-full animate-pulse"></span>
                        <span x-text="'Welcome back, ' + (user?.user_metadata?.full_name || userEmail?.split('@')[0] || 'Agent')"></span>
                        <span class="text-zinc-700">•</span>
                        <span x-text="currentTime"></span>
                    </p>
                </div>

                <!-- Navigation Grid -->
                <nav class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                    <!-- Personnel Dossier -->
                    <a href="pages/dossier.html" 
                       class="tactical-tile p-8 flex flex-col items-center text-center group no-underline">

                    <a href="pages/frequency.html"

                <!-- Directorate Access (Director Only) -->
                <div x-show="userRole === 'director'" 
                     x-transition:enter="transition ease-out duration-500"

                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="mb-12">
                    <div class="flex items-center gap-4 mb-4">

                    <a href="directorate.html" 
                       class="directorate-tile p-8 flex items-center justify-between group no-underline">

                            <div class="w-16 h-16 rounded-full bg-gold/20 flex items-center justify-center animate-pulse group-hover:animate-none group-hover:bg-gold/30 transition-all border-2 border-gold/50">

                <!-- System Status Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-gold rounded-xl p-5 text-center group hover:border-gold/30 transition-colors">
                        <div class="text-2xl font-bold text-gold mb-1 group-hover:scale-110 transition-transform" x-text="systemStatus.uptime"></div>
                        <div class="text-[9px] text-zinc-500 uppercase tracking-widest">Uptime</div>
                    </div>
                    <div class="glass-gold rounded-xl p-5 text-center group hover:border-electric/30 transition-colors">
                        <div class="text-2xl font-bold text-electric mb-1 group-hover:scale-110 transition-transform" x-text="systemStatus.users"></div>
                        <div class="text-[9px] text-zinc-500 uppercase tracking-widest">Active Sessions</div>
                    </div>
                    <div class="glass-gold rounded-xl p-5 text-center group hover:border-green-500/30 transition-colors">
                        <div class="text-2xl font-bold text-green-500 mb-1 group-hover:scale-110 transition-transform" x-text="systemStatus.security"></div>
                        <div class="text-[9px] text-zinc-500 uppercase tracking-widest">Security Level</div>
                    </div>
                    <div class="glass-gold rounded-xl p-5 text-center group hover:border-white/30 transition-colors">
                        <div class="text-2xl font-bold text-white mb-1 group-hover:scale-110 transition-transform" x-text="systemStatus.latency + 'ms'"></div>
                        <div class="text-[9px] text-zinc-500 uppercase tracking-widest">Latency</div>

            <!-- Footer -->
            <footer class="py-8 text-center border-t border-white/5 mt-auto">
                <div class="flex items-center justify-center gap-2 mb-2">

                    © 2026 NCC Master // Authorized Personnel Only // <span x-text="'Session: ' + sessionId"></span>
                </p>
            </footer>
        </div>
    </template>

    <script>
        // Initialize Lucide icons
        document.addEventListener('alpine:init', () => {
            lucide.createIcons();
        });

        function nccMasterEngine() {
            return {
                // Core State
                view: 'auth',
                loading: true,
                loadingText: 'Initializing...',
                loadingSubtext: 'Establishing secure connection',
                version: '5.2.3',
                
                // Auth State
                user: null,
                userRole: '',
                userEmail: '',
                sessionId: '',
                authError: '',
                showPassword: false,
                
                // Form Data
                authForm: {
                    id: '',
                    pass: '',
                    remember: false
                },
                
                // UI State
                toasts: [],
                currentTime: '',
                
                // System Status
                systemStatus: {
                    uptime: '99.9%',
                    users: '0',
                    security: 'MAX',
                    latency: 0,
                    version: 'v5.2.3'
                },
                
                // Supabase Client
                supabase: null,
                
                // Rate Limiting
                loginAttempts: 0,
                lastAttemptTime: 0,

                async init() {
                    try {
                        this.loadingText = 'Initializing Secure Uplink';
                        this.loadingSubtext = 'Loading configuration...';

                    // Validate environment
                        if (!window.ENV || !window.ENV.SUPABASE_URL) {
                            throw new Error('Environment configuration not loaded. Check config/env.js');
                        }
                        
                        // Initialize Supabase
                        this.loadingSubtext = 'Connecting to secure database...';
                        this.supabase = this.initializeSupabase();
                        
                        // Setup realtime subscriptions
                        this.setupRealtimeSubscriptions();
                        
                        // Check existing session
                        this.loadingSubtext = 'Validating session...';
                        await this.checkSession();
                        
                        // Start time updater
                        this.updateTime();
                        setInterval(() => this.updateTime(), 1000);
                        
                        // Update system status
                        this.updateSystemStatus();
                        setInterval(() => this.updateSystemStatus(), 30000);
                        
                    } catch (error) {
                        console.error('Initialization error:', error);
                        this.showToast(error.message, 'error');
                        this.authError = 'System initialization failed. Contact administrator.';
                    } finally {
                        this.loading = false;
                    }
                },

                initializeSupabase() {
                    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.ENV;
                    
                    if (!SUPABASE_URL || !SUPABASE_ANON_KEY || 
                        SUPABASE_URL.includes('your-project') || 
                        SUPABASE_ANON_KEY.includes('your-anon-key')) {
                        throw new Error('Invalid Supabase configuration. Update config/env.js with your credentials.');
                    }
                    
                    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                        auth: {
                            autoRefreshToken: true,
                            persistSession: true,
                            detectSessionInUrl: true,
                            storage: localStorage,
                            storageKey: 'mog-auth-token',
                            flowType: 'pkce'
                        },
                        realtime: {
                            params: {
                                eventsPerSecond: 10
                            }
                        }
                    });
                    
                    return client;
                },

                setupRealtimeSubscriptions() {
                    if (!this.supabase) return;
                    
                    this.supabase.auth.onAuthStateChange(async (event, session) => {
                        console.log('Auth event:', event);

                                                         switch(event) {
                            case 'SIGNED_IN':
                                if (session) {
                                    await this.loadUserData(session.user);
                                    this.showToast('Access granted. Welcome to NCC Master.', 'success');
                                    this.logAudit('LOGIN_SUCCESS', { provider: session.user.app_metadata?.provider });
                                }
                                break;
                                
                            case 'SIGNED_OUT':
                                this.clearUserData();
                                this.showToast('Session terminated securely.', 'info');
                                break;
                                
                            case 'TOKEN_REFRESHED':
                                console.log('Session token refreshed');
                                break;
                                
                            case 'USER_UPDATED':
                                if (session) await this.loadUserData(session.user);
                                break;
                        }
                    });
                },

                async checkSession() {
                    const { data: { session }, error } = await this.supabase.auth.getSession();
                    
                    if (error) {
                        console.error('Session check error:', error);
                        return;
                    }
                    
                    if (session) {
                        // Validate session age
                        const sessionAge = Date.now() - (session.expires_at * 1000 - 3600000);
                        const maxAge = window.ENV.SESSION_TIMEOUT || 3600000;
                        
                        if (sessionAge > maxAge) {
                            await this.supabase.auth.signOut();
                            this.showToast('Session expired. Please re-authenticate.', 'warning');
                            return;
                        }
                        
                        await this.loadUserData(session.user);
                    }
                },

                async loadUserData(user) {
                    this.user = user;
                    this.userEmail = user.email || 'Unknown';
                    this.sessionId = this.generateSessionId();
                    
                    // Determine role from user metadata or email
                    const metadata = user.user_metadata || {};
                    const email = user.email || '';
                    
                    if (metadata.role === 'director' || 
                        email.includes('director') || 
                        email.includes('admin@mog.gov')) {
                        this.userRole = 'director';
                    } else if (metadata.role === 'operator' || email.includes('operator')) {
                        this.userRole = 'operator';
                    } else {
                        this.userRole = metadata.role || 'agent';
                    }

                // Store minimal session info
                    localStorage.setItem('mog-session', JSON.stringify({
                        id: user.id,
                        email: this.userEmail,
                        role: this.userRole,
                        timestamp: Date.now()
                    }));
                    
                    this.view = 'grid';
                    
                    // Re-initialize icons after view change
                    this.$nextTick(() => {
                        lucide.createIcons();
                    });
                    
                    // Fetch additional user data if needed
                    await this.fetchUserProfile(user.id);
                },

                async fetchUserProfile(userId) {
                    try {
                        const { data, error } = await this.supabase
                            .from('profiles')
                            .select('*')
                            .eq('id', userId)
                            .single();
                            
                        if (error) throw error;
                        
                        if (data) {
                            this.user.profile = data;
                            // Update role if specified in profile
                            if (data.clearance_level === 'director') {
                                this.userRole = 'director';
                            }
                        }
                    } catch (error) {
                        console.log('Profile fetch error (non-critical):', error);
                    }
                },

                async loginManual() {
                    this.authError = '';
                    
                    // Rate limiting check
                    const now = Date.now();
                    const windowStart = now - (window.ENV.RATE_LIMIT_WINDOW || 900000);
                    
                    if (this.lastAttemptTime > windowStart) {
                        this.loginAttempts++;
                        if (this.loginAttempts > (window.ENV.MAX_LOGIN_ATTEMPTS || 5)) {
                            this.authError = 'Too many attempts. Please try again later.';
                            this.showToast('Rate limit exceeded', 'error');
                            return;
                        }
                    } else {
                        this.loginAttempts = 1;
                    }
                    
                    this.lastAttemptTime = now;
                    
                    // Validation
                    if (!this.authForm.id || !this.authForm.pass) {
                        this.authError = 'Identification and passcode required';
                        return;
                    }
                    
                    this.loading = true;
                    this.loadingText = 'Authenticating';
                    this.loadingSubtext = 'Verifying credentials...';

                try {
                        const { data, error } = await this.supabase.auth.signInWithPassword({
                            email: this.authForm.id,
                            password: this.authForm.pass
                        });
                        
                        if (error) throw error;
                        
                        // Clear form on success
                        this.authForm = { id: '', pass: '', remember: false };
                        
                    } catch (error) {
                        console.error('Login error:', error);
                        
                        let message = 'Authentication failed';
                        if (error.message.includes('Invalid login')) {
                            message = 'Invalid identification or passcode';
                        } else if (error.message.includes('Email not confirmed')) {
                            message = 'Account pending verification';
                        }
                        
                        this.authError = message;
                        this.showToast(message, 'error');
                        this.logAudit('LOGIN_FAILED', { error: error.message });
                        
                    } finally {
                        this.loading = false;
                    }
                },

                async loginWithGoogle() {
                    this.loading = true;
                    this.loadingText = 'Initiating Biometric Uplink';
                    this.loadingSubtext = 'Connecting to Google identity provider...';
                    
                    try {
                        const { data, error } = await this.supabase.auth.signInWithOAuth({
                            provider: 'google',
                            options: {
                                redirectTo: window.location.origin,
                                queryParams: {
                                    access_type: 'offline',
                                    prompt: 'consent'
                                }
                            }
                        });
                        
                        if (error) throw error;
                        
                    } catch (error) {
                        console.error('Google login error:', error);
                        this.authError = 'Biometric uplink failed. Try manual authorization.';
                        this.showToast('Biometric uplink failed', 'error');
                        this.loading = false;
                    }
                },

                async logout() {
                    this.loading = true;
                    this.loadingText = 'Terminating Session';
                    this.loadingSubtext = 'Clearing secure credentials...';
                    
                    try {
                        // Log audit before logout
                        this.logAudit('LOGOUT', { sessionId: this.sessionId });

                    // Clear local session data first
                        localStorage.removeItem('mog-session');
                        localStorage.removeItem('mog-auth-token');
                        
                        // Sign out from Supabase
                        if (this.supabase) {
                            await this.supabase.auth.signOut();
                        }
                        
                        this.clearUserData();
                        
                    } catch (error) {
                        console.error('Logout error:', error);
                        this.showToast('Error during logout', 'error');
                        // Force clear even on error
                        this.clearUserData();
                    } finally {
                        this.loading = false;
                    }
                },

                clearUserData() {
                    this.user = null;
                    this.userRole = '';
                    this.userEmail = '';
                    this.sessionId = '';
                    this.authForm = { id: '', pass: '', remember: false };
                    this.view = 'auth';
                    this.loginAttempts = 0;
                },

                togglePasswordVisibility() {
                    this.showPassword = !this.showPassword;
                    const input = document.querySelector('input[type="password"], input[type="text"]');
                    if (input) {
                        input.type = this.showPassword ? 'text' : 'password';
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                showForgotPassword() {
                    this.showToast('Contact system administrator for passcode reset', 'info');
                },

                showToast(message, type = 'info', duration = 4000) {
                    const id = Date.now();
                    const toast = { id, message, type, visible: true };
                    this.toasts.push(toast);
                    
                    setTimeout(() => {
                        const index = this.toasts.findIndex(t => t.id === id);
                        if (index > -1) {
                            this.toasts[index].visible = false;
                            setTimeout(() => {
                                this.toasts = this.toasts.filter(t => t.id !== id);
                            }, 300);
                        }
                    }, duration);
                },

                async logAudit(action, details = {}) {
                    const logEntry = {
                        timestamp: new Date().toISOString(),
                        action,
                        user_id: this.user?.id || 'anonymous',
                        session_id: this.sessionId,
                        ip_address: 'client-side',
                        user_agent: navigator.userAgent,
                        details
                    };

              if (window.ENV.AUDIT_ENDPOINT) {
                        try {
                            await fetch(window.ENV.AUDIT_ENDPOINT, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(logEntry)
                            });
                        } catch (e) {
                            console.error('Audit log failed:', e);
                        }
                    }
                    
                    console.log('[AUDIT]', logEntry);
                },

                async updateSystemStatus() {
                    this.systemStatus.latency = Math.floor(Math.random() * 50) + 20;
                    
                    if (this.supabase) {
                        this.systemStatus.users = Math.floor(Math.random() * 50) + 10 + '';
                    }
                },

                updateTime() {
                    const now = new Date();
                    this.currentTime = now.toLocaleTimeString('en-US', { 
                        hour12: false, 
                        hour: '2-digit', 
                        minute: '2-digit',
                        second: '2-digit'
                    }) + ' UTC';
                },

                generateSessionId() {
                    return 'MOG-' + Math.random().toString(36).substr(2, 9).toUpperCase();
                }
            }
        }
    </script>
