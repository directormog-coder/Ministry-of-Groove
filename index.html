<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v3.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">

    <style>
        [x-cloak] { display: none !important; }
        
        /* Unified Poster Typography */
        .brand-title { font-size: 28px; font-weight: 900; letter-spacing: 0.3em; color: #D4AF37; text-transform: uppercase; font-style: italic; }
        .brand-slogan { font-size: 14px; font-weight: 700; letter-spacing: 0.6em; color: rgba(212, 175, 55, 0.6); text-transform: uppercase; }

        /* Social Brand Colors - No Gray */
        .social-instagram { color: #E4405F; }
        .social-whatsapp { color: #25D366; }
        .social-youtube { color: #FF0000; }
        .social-tiktok { color: #00f2ea; }
        .social-facebook { color: #1877F2; }
        .social-x { color: #ffffff; }

        /* Tactical Tile Highlights */
        .tile-highlight { border: 2px solid #D4AF37 !important; background: rgba(212, 175, 55, 0.1) !important; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); transition: all 0.4s ease; }
        .tile-highlight:hover { transform: scale(1.05); background: rgba(212, 175, 55, 0.2) !important; }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function nccMasterEngine() {
            return {
                view: 'gate',
                isLoading: false,
                emailInput: '',
                passwordInput: '',
                username: '',
                operatives: [],

                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    
                    // --- THE GOOGLE AUTH HARD-GATE ---
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (session) {
                        this.setupUser(session.user);
                    } else {
                        // Detect Google OAuth return fragment
                        if (window.location.hash.includes('access_token')) {
                            this.view = 'gate';
                            setTimeout(async () => {
                                const { data: { session: oauthSession } } = await sb.auth.getSession();
                                if (oauthSession) this.setupUser(oauthSession.user);
                                else this.view = 'auth';
                            }, 1000);
                        } else {
                            this.view = 'auth';
                        }
                    }
                    this.loadSocialHub();
                    this.$watch('view', () => this.$nextTick(() => lucide.createIcons()));
                },

                setupUser(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.view = 'grid'; 
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    await sb.auth.signInWithOAuth({ 
                        provider: 'google', 
                        options: { redirectTo: window.location.origin } 
                    });
                },

                async loginManual() {
                    this.isLoading = true;
                    const { data, error } = await sb.auth.signInWithPassword({ 
                        email: this.emailInput.trim(), 
                        password: this.passwordInput 
                    });
                    if (error) { alert("ACCESS DENIED"); this.isLoading = false; }
                    else { this.setupUser(data.user); }
                },

                async loadSocialHub() {
                    const { data } = await sb.from('profiles').select('*').limit(12);
                    if (data) this.operatives = data;
                },

                logout() { sb.auth.signOut().then(() => window.location.reload()); }
            }
        }
    </script>
</head>
<body x-data="nccMasterEngine()" x-init="init()" x-cloak class="bg-black relative min-h-screen text-white overflow-x-hidden">

    <div class="bg-circuit-pattern" style="opacity: 0.8;"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-8 z-[100] relative">
            <div class="flex items-center gap-6 mb-4">
                <img src="assets/images/logo.png" class="w-24 h-24 object-contain filter drop-shadow-[0_0_20px_#D4AF37]">
                <h1 class="brand-title">Ministry of Groove</h1>
            </div>
            <p class="brand-slogan mb-12">Decrypting the Culture. Synchronizing the Grid.</p>
            
            <div class="w-full max-w-sm space-y-4 glass-strong p-10 rounded-[3rem] border border-gold/10">
                <input x-model="emailInput" type="email" placeholder="EMAIL" class="w-full bg-black/80 border border-white/20 p-5 rounded-2xl text-center outline-none uppercase text-[11px]">
                <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/80 border border-white/20 p-5 rounded-2xl text-center outline-none text-[11px]" @keyup.enter="loginManual()">
                
                <button @click="loginManual()" class="w-full py-5 bg-[#D4AF37] text-black font-black uppercase rounded-[2rem] text-sm shadow-[0_0_20px_rgba(212,175,55,0.4)]">Initialize Access</button>
                
                <div class="flex items-center gap-4 py-2">
                    <div class="h-px bg-white/10 flex-grow"></div>
                    <span class="text-[8px] font-black uppercase">OR</span>
                    <div class="h-px bg-white/10 flex-grow"></div>
                </div>

                <button @click="loginWithGoogle()" class="w-full py-5 bg-white text-black font-bold uppercase rounded-[2rem] text-[10px] flex items-center justify-center gap-3">
                   <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-4 h-4"> Sign In With Google
                </button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col z-20 relative">
            <header class="p-8 border-b border-gold/20 glass-strong flex justify-between items-center sticky top-0">
                <div class="flex items-center gap-6">
                    <img src="assets/images/logo.png" class="w-16 h-16 object-contain">
                    <div class="flex flex-col">
                        <h2 class="text-xl font-black uppercase italic tracking-widest text-white">Ministry of Groove</h2>
                        <span class="text-[9px] text-gold font-black uppercase tracking-[0.4em] mt-1" x-text="'CLEARANCE: ' + username"></span>
                    </div>
                </div>
                <button @click="logout()" class="p-5 border border-red-500 text-red-500 rounded-2xl hover:bg-red-500 hover:text-white transition-all"><i data-lucide="power"></i></button>
            </header>

            <main class="p-10 max-w-7xl mx-auto w-full flex-grow">
                <div class="text-center py-16">
                    <p class="brand-slogan leading-loose">Decrypting the Culture.<br>Synchronizing the Grid.</p>
                </div>

                <div class="grid grid-cols-2 lg:grid-cols-3 gap-10">
                    <div onclick="window.location.href='dossier.html'" class="tile-highlight p-14 rounded-[4rem] text-center cursor-pointer">
                        <i data-lucide="user-cog" class="mx-auto mb-4 text-green-500 w-12 h-12"></i>
                        <span class="text-[14px] font-black uppercase tracking-widest">Dossier</span>
                    </div>
                    <div onclick="window.location.href='gallery.html'" class="tile-highlight p-14 rounded-[4rem] text-center cursor-pointer">
                        <i data-lucide="camera" class="mx-auto mb-4 text-purple-500 w-12 h-12"></i>
                        <span class="text-[14px] font-black uppercase tracking-widest">Gallery</span>
                    </div>
                    <div onclick="window.location.href='frequency.html'" class="tile-highlight p-14 rounded-[4rem] text-center cursor-pointer">
                        <i data-lucide="activity" class="mx-auto mb-4 text-gold w-12 h-12"></i>
                        <span class="text-[14px] font-black uppercase tracking-widest">Frequency</span>
                    </div>
                </div>
                
                <div class="mt-20 glass p-12 rounded-[5rem] border border-gold/10">
                    <div class="flex items-center gap-4 mb-10">
                        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                        <h3 class="text-xs font-black uppercase text-gold tracking-widest italic">Live Personnel Activity</h3>
                    </div>
                    <div class="flex gap-12 overflow-x-auto pb-6 custom-scrollbar">
                        <template x-for="op in operatives" :key="op.id">
                            <div class="flex-shrink-0 text-center">
                                <div class="w-20 h-20 bg-white/5 rounded-full border-2 border-gold/20 flex items-center justify-center mb-4">
                                    <i data-lucide="user" class="text-zinc-700"></i>
                                </div>
                                <span class="text-[10px] font-black uppercase" x-text="op.handle"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </main>

            <footer class="border-t border-gold/20 p-20 bg-black text-center relative overflow-hidden">
                <div class="flex flex-wrap justify-center gap-14 mb-14">
                    <a href="https://instagram.com/ministryofgroove_hq" target="_blank" class="hover:scale-125 transition-all"><i data-lucide="instagram" class="w-10 h-10 social-instagram"></i></a>
                    <a href="https://wa.me/message/EASM3GTNOVSQE1" target="_blank" class="hover:scale-125 transition-all"><i data-lucide="message-circle" class="w-10 h-10 social-whatsapp"></i></a>
                    <a href="https://youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:scale-125 transition-all"><i data-lucide="youtube" class="w-10 h-10 social-youtube"></i></a>
                    <a href="https://tiktok.com/@ministryofgroove" target="_blank" class="hover:scale-125 transition-all"><i data-lucide="music-2" class="w-10 h-10 social-tiktok"></i></a>
                    <a href="https://facebook.com/ministryofgroove" target="_blank" class="hover:scale-125 transition-all"><i data-lucide="facebook" class="w-10 h-10 social-facebook"></i></a>
                    <a href="https://x.com/ministryofgroove" target="_blank" class="hover:scale-125 transition-all"><i data-lucide="twitter" class="w-10 h-10 social-x"></i></a>
                </div>
                <p class="text-[11px] text-zinc-500 font-black uppercase tracking-[1em] italic">© 2026 MINISTRY OF GROOVE // NCC MASTER v3.0</p>
            </footer>
        </div>
    </template>

</body>
</html>
