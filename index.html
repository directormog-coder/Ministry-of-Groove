<!DOCTYPE html>
<html lang="en" color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="M.O.G.">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/logo.png">
  <title>M.O.G. | OPERATIVE HUB</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    @layer base, layout, components, utilities;

    @layer base {
      :root {
        --black: #000;
        --surface: rgba(6, 9, 6, 0.96);
        --gold: #d4af37;
        --gold-bright: #f0c040;
        --gold-dark: #8b6914;
        --gold-glow: rgba(212, 175, 55, 0.38);
        --teal: #00d4aa;
        --teal-dim: #006e59;
        --teal-glow: rgba(0, 212, 170, 0.3);
        --red: #dc2626;
        --red-glow: rgba(220, 38, 38, 0.4);
        --text: #e8e0cc;
        --border: rgba(0, 212, 170, 0.11);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
      }
      
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; color-scheme: dark; -webkit-font-smoothing: antialiased; }
      body { 
        font-family: 'Rajdhani', sans-serif; 
        background: var(--black); 
        color: var(--text); 
        min-height: 100dvh; 
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* SCROLLBAR STYLING */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
      ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--gold-dark), var(--teal-dim)); border-radius: 4px; }

      [x-cloak] { display: none !important; }
    }

    @layer layout {
      .bg-seal {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: clamp(280px, 70vmin, 560px); height: clamp(280px, 70vmin, 560px);
        background: url('/assets/images/logo.png') center/contain no-repeat;
        opacity: 0.04; pointer-events: none; z-index: 0;
        filter: drop-shadow(0 0 60px rgba(212, 175, 55, 0.08));
      }
      .bg-grid {
        position: fixed; inset: 0; pointer-events: none; z-index: 1;
        background-image: linear-gradient(rgba(0, 212, 170, 0.018) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(0, 212, 170, 0.018) 1px, transparent 1px);
        background-size: 56px 56px;
      }
      .bg-vig {
        position: fixed; inset: 0; pointer-events: none; z-index: 2;
        background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.82) 100%);
      }
    }

    @layer components {
      /* INTERFACE PANELS */
      .glass { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
      .glass-gold { background: rgba(10, 8, 2, 0.92); border: 1px solid rgba(212, 175, 55, 0.16); }
      
      /* TYPOGRAPHY COMPONENTS */
      .mono { font-family: 'Share Tech Mono', monospace; }
      .orbit { font-family: 'Orbitron', sans-serif; }
      .text-gold { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }
      .text-teal { color: var(--teal); text-shadow: 0 0 10px var(--teal-glow); }
      .slogan { font-family: 'Orbitron', sans-serif; font-size: 0.5rem; letter-spacing: 0.3em; color: var(--teal); opacity: 0.4; text-transform: uppercase; }
      .gold-line { height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dark), var(--gold), var(--teal-dim), transparent); }

      /* BUTTON PROTOCOLS */
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 0.1em;
        text-transform: uppercase; border-radius: 0.75rem; position: relative; overflow: hidden;
      }
      .btn:active { transform: scale(0.96); }
      .btn-g { background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); color: var(--gold); }
      .btn-g:hover { background: rgba(212, 175, 55, 0.2); border-color: var(--gold-bright); box-shadow: 0 0 15px var(--gold-glow); }
      
      /* TICKER SYSTEM */
      .ticker { height: 28px; background: linear-gradient(90deg, #991b1b, #000, #991b1b); border-bottom: 1px solid rgba(220, 38, 38, 0.3); display: flex; align-items: center; }
      .ticker-lbl { padding: 0 10px; height: 100%; background: var(--red); display: flex; align-items: center; font-family: 'Orbitron', sans-serif; font-size: 9px; font-weight: 900; color: #fff; }
      .ticker-trk { display: flex; white-space: nowrap; animation: ticker-scroll 30s linear infinite; }
      @keyframes ticker-scroll { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }

      /* DATA BARS */
      .sb { height: 4px; background: rgba(0,0,0,0.6); border-radius: 4px; overflow: hidden; margin-top: 6px; }
      .sb-fill { height: 100%; transition: width 1.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

      /* LOADING BAR (WhatsApp Style) */
      .load-bar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10000; height: 3px;
        background: linear-gradient(90deg, var(--gold-dark), var(--teal), var(--gold-bright));
        transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease;
      }
      .load-bar.active { transform: scaleX(0.7); animation: load-pulse 2s infinite linear; }
      @keyframes load-pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

      /* MOBILE NAVIGATION */
      .bnav {
        display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
        background: rgba(0, 0, 0, 0.95); border-top: 1px solid rgba(212, 175, 55, 0.15);
        padding-bottom: var(--safe-bottom); backdrop-filter: blur(10px);
      }
      @media(max-width: 768px) { .bnav { display: flex; } main { padding-bottom: 80px; } }

      /* TOAST SYSTEM */
      .tc { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 400px; }
      .toast { 
        padding: 12px 16px; border-radius: 12px; font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
        background: #000; border: 1px solid var(--gold); color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        animation: toast-in 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) both;
      }
      @keyframes toast-in { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    }
  </style>

  <script>
    /**
     * HUB CONTROLLER
     * Manages state, authentication, and realtime synchronization.
     */
    function hub() {
      return {
        // STATE PROPERTIES
        view: 'loading',
        isLoading: false,
        isOnline: navigator.onLine,
        showModal: false,
        activeTab: 'overview',
        currentUser: null,
        operativeId: 'OFFLINE',
        
        // PROFILE DATA STRUCTURE
        profile: {
          username: 'RECRUIT',
          codename: '---',
          rank: 'INITIATE',
          department: 'UNASSIGNED',
          bio: '',
          avatar_url: null,
          stats: { missions: 0, contributions: 0, influence: 0, loyalty: 100, groove: 50 },
          skills: [],
          joined_at: null
        },

        // INTERFACE STATE
        lockdownActive: false,
        tickerMessages: ["ESTABLISHING SECURE UPLINK...", "SCANNING FOR THREATS...", "PROTOCOL ZERO READY"],
        mediaAssets: [],
        allOperatives: [],
        recentActivity: [],

        // INITIALIZATION SEQUENCE
        async init() {
          console.log("M.O.G. Hub Initializing...");
          
          // Network Listeners
          window.addEventListener('online', () => { this.isOnline = true; this.notify("Uplink Restored", "success"); });
          window.addEventListener('offline', () => { this.isOnline = false; this.notify("Uplink Severed", "error"); });

          // Supabase Connection Check
          let attempts = 0;
          while (typeof sb === 'undefined' && attempts < 30) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
          }

          if (typeof sb === 'undefined') {
            console.error("Critical: Supabase failed to load.");
            return;
          }

          try {
            const { data: { session } } = await sb.auth.getSession();
            if (!session) {
              window.location.href = '/login.html';
              return;
            }
            this.currentUser = session.user;
            this.operativeId = `OP-${this.currentUser.id.slice(0, 5).toUpperCase()}`;
            
            await this.syncAllData();
            this.view = 'hub';
            
            // Post-load UI adjustments
            this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
            
          } catch (err) {
            this.notify("Sync Error: " + err.message, "error");
          }
        },

        // DATA SYNCHRONIZATION
        async syncAllData() {
          this.isLoading = true;
          const bar = document.getElementById('loadBar');
          if(bar) bar.classList.add('active');

          await Promise.all([
            this.loadProfile(),
            this.loadOperatives(),
            this.loadMedia(),
            this.loadActivity()
          ]);

          if(bar) {
            bar.classList.remove('active');
            bar.style.transform = 'scaleX(1)';
            setTimeout(() => bar.style.opacity = '0', 500);
          }
          this.isLoading = false;
        },

        async loadProfile() {
          try {
            let { data, error } = await sb.from('profiles').select('*').eq('id', this.currentUser.id).single();
            if (error) throw error;
            this.profile = { ...this.profile, ...data };
          } catch (e) {
            this.notify("Profile Sync Failed", "error");
          }
        },

        async loadOperatives() {
          try {
            const { data } = await sb.from('profiles').select('username, codename, rank, avatar_url').limit(10);
            this.allOperatives = data || [];
          } catch (e) { /* silent fail */ }
        },

        async loadMedia() {
          // Fallback static data if DB is empty
          this.mediaAssets = [
            { id: 1, title: 'Sector 7 Operations', type: 'VIDEO', thumb: '/assets/images/gallery1.jpg' },
            { id: 2, title: 'Frequency Uplink', type: 'AUDIO', thumb: '/assets/images/gallery2.jpg' }
          ];
        },

        async loadActivity() {
          try {
            const { data } = await sb.from('activity_log').select('*').order('created_at', { ascending: false }).limit(5);
            this.recentActivity = data || [];
          } catch (e) { /* silent fail */ }
        },

        // ACTIONS
        async updateProfile() {
          this.isLoading = true;
          try {
            const { error } = await sb.from('profiles').update({
              username: this.profile.username,
              bio: this.profile.bio,
              department: this.profile.department
            }).eq('id', this.currentUser.id);

            if (error) throw error;
            this.notify("Dossier Updated", "success");
            this.showModal = false;
          } catch (e) {
            this.notify(e.message, "error");
          } finally {
            this.isLoading = false;
          }
        },

        notify(msg, type = 'info') {
          const container = document.getElementById('toastContainer');
          const el = document.createElement('div');
          el.className = `toast ${type}`;
          el.innerText = msg.toUpperCase();
          container.appendChild(el);
          setTimeout(() => el.remove(), 4000);
        },

        async logout() {
          await sb.auth.signOut();
          localStorage.clear();
          window.location.href = '/login.html';
        },

        // UTILITIES
        getRankStyle(rank) {
          return {
            'INITIATE': 'text-gray-500',
            'AGENT': 'text-teal-400',
            'OPERATIVE': 'text-gold',
            'DIRECTOR': 'text-red-500 font-bold'
          }[rank] || 'text-white';
        }
      };
    }
  </script>
</head>

<body x-data="hub()" x-init="init()" x-cloak>

  <div class="bg-seal"></div>
  <div class="bg-grid"></div>
  <div class="bg-vig"></div>

  <div id="loadBar" class="load-bar"></div>
  <div id="toastContainer" class="tc"></div>

  <div class="ticker" x-show="view === 'hub'">
    <div class="ticker-lbl">NEWS UPDATE</div>
    <div class="ticker-trk">
      <template x-for="msg in tickerMessages" :key="msg">
        <span class="mono" style="margin-right: 40px; font-size: 10px; color: #fff;">
          <span style="color: var(--gold);">◆</span> <span x-text="msg"></span>
        </span>
      </template>
    </div>
  </div>

  <template x-if="view === 'hub'">
    <div class="relative z-10 p-4 max-w-5xl mx-auto">
      
      <header class="glass rounded-2xl p-4 flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
          <div class="relative w-12 h-12 rounded-full border-2 border-gold p-1">
            <img src="/assets/images/logo.png" class="w-full h-full object-contain" alt="MOG">
          </div>
          <div>
            <h1 class="orbit text-lg font-black text-gold">OPERATIVE HUB</h1>
            <p class="slogan" x-text="operativeId"></p>
          </div>
        </div>
        
        <div class="flex items-center gap-2">
          <button @click="showModal = true" class="btn btn-g p-2 rounded-full">
            <i data-lucide="user-cog"></i>
          </button>
          <button @click="logout()" class="btn btn-g p-2 rounded-full border-red-900 text-red-500">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </header>

      <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <section class="lg:col-span-1 space-y-6">
          <div class="glass rounded-2xl p-6">
            <div class="flex flex-col items-center text-center mb-6">
              <div class="w-24 h-24 rounded-full border-4 border-gold-dark overflow-hidden mb-4 bg-black">
                <template x-if="profile.avatar_url">
                  <img :src="profile.avatar_url" class="w-full h-full object-cover" alt="Profile">
                </template>
                <template x-if="!profile.avatar_url">
                  <div class="flex items-center justify-center h-full text-gold-dark">
                    <i data-lucide="user" size="48"></i>
                  </div>
                </template>
              </div>
              <h2 class="orbit text-xl font-bold" x-text="profile.username"></h2>
              <span class="mono text-xs uppercase" :class="getRankStyle(profile.rank)" x-text="profile.rank"></span>
            </div>
            
            <div class="space-y-4">
              <div>
                <div class="flex justify-between text-[10px] mono uppercase text-teal">
                  <span>Loyalty Level</span>
                  <span x-text="profile.stats.loyalty + '%'"></span>
                </div>
                <div class="sb"><div class="sb-fill bg-teal-500" :style="'width:' + profile.stats.loyalty + '%'"></div></div>
              </div>
              <div>
                <div class="flex justify-between text-[10px] mono uppercase text-gold">
                  <span>Influence</span>
                  <span x-text="profile.stats.influence + '%'"></span>
                </div>
                <div class="sb"><div class="sb-fill bg-gold" :style="'width:' + profile.stats.influence + '%'"></div></div>
              </div>
            </div>
          </div>

          <div class="glass rounded-2xl p-6">
            <h3 class="orbit text-xs font-bold mb-4 flex items-center gap-2">
              <i data-lucide="activity" size="14"></i> RECENT LOGS
            </h3>
            <div class="space-y-3">
              <template x-for="log in recentActivity" :key="log.id">
                <div class="border-l-2 border-gold-dark pl-3 py-1">
                  <p class="text-[11px] text-white" x-text="log.description"></p>
                  <p class="text-[9px] mono text-gray-500" x-text="new Date(log.created_at).toLocaleTimeString()"></p>
                </div>
              </template>
            </div>
          </div>
        </section>

        <section class="lg:col-span-2">
          <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button @click="activeTab = 'overview'" class="btn text-[10px] px-6 py-2" :class="activeTab === 'overview' ? 'btn-g' : 'bg-black/40 border border-white/5 text-gray-500'">HUB</button>
            <button @click="activeTab = 'media'" class="btn text-[10px] px-6 py-2" :class="activeTab === 'media' ? 'btn-g' : 'bg-black/40 border border-white/5 text-gray-500'">INTEL</button>
            <button @click="activeTab = 'network'" class="btn text-[10px] px-6 py-2" :class="activeTab === 'network' ? 'btn-g' : 'bg-black/40 border border-white/5 text-gray-500'">NETWORK</button>
          </div>

          <div class="glass rounded-2xl p-6 min-h-[400px]">
            <div x-show="activeTab === 'overview'" class="space-y-6">
              <div class="gold-line mb-4"></div>
              <p class="mono text-sm text-gray-400 leading-relaxed" x-text="profile.bio || 'NO OPERATIONAL DATA RECORDED. UPDATE YOUR DOSSIER.'"></p>
              
              <div class="grid grid-cols-2 gap-4">
                <div class="bg-black/40 p-4 rounded-xl border border-white/5">
                  <p class="mono text-[10px] text-gold uppercase">Missions</p>
                  <p class="orbit text-2xl font-black" x-text="profile.stats.missions"></p>
                </div>
                <div class="bg-black/40 p-4 rounded-xl border border-white/5">
                  <p class="mono text-[10px] text-teal uppercase">Dept</p>
                  <p class="orbit text-sm font-bold truncate" x-text="profile.department"></p>
                </div>
              </div>
            </div>

            <div x-show="activeTab === 'media'" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <template x-for="asset in mediaAssets" :key="asset.id">
                <div class="group relative rounded-xl overflow-hidden border border-white/10 bg-black">
                  <img :src="asset.thumb" class="w-full aspect-video object-cover opacity-60 group-hover:opacity-100 transition-opacity">
                  <div class="absolute inset-0 flex flex-col justify-end p-3 bg-gradient-to-t from-black to-transparent">
                    <p class="orbit text-[10px] font-bold text-white" x-text="asset.title"></p>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </section>

      </main>

      <footer class="mt-12 text-center pb-8">
        <div class="gold-line mb-6 opacity-30"></div>
        <p class="slogan mb-2">Decrypting the Culture. Synchronizing the Grid.</p>
        <p class="mono text-[9px] text-gray-600 tracking-[0.3em]">MINISTRY OF GROOVE // HQ-UPLINK // EST 2026</p>
      </footer>

    </div>
  </template>

  <nav class="bnav">
    <button @click="activeTab = 'overview'" class="flex-1 flex flex-col items-center py-3" :class="activeTab === 'overview' ? 'text-gold' : 'text-gray-600'">
      <i data-lucide="layout-dashboard" size="20"></i>
      <span class="orbit text-[8px] mt-1">CORE</span>
    </button>
    <button @click="activeTab = 'media'" class="flex-1 flex flex-col items-center py-3" :class="activeTab === 'media' ? 'text-gold' : 'text-gray-600'">
      <i data-lucide="layers" size="20"></i>
      <span class="orbit text-[8px] mt-1">INTEL</span>
    </button>
    <button @click="showModal = true" class="flex-1 flex flex-col items-center py-3 text-gray-600">
      <i data-lucide="shield" size="20"></i>
      <span class="orbit text-[8px] mt-1">DOSSIER</span>
    </button>
  </nav>

  <div x-show="showModal" class="fixed inset-0 z-[1000] flex items-end sm:items-center justify-center p-0 sm:p-4" style="background: rgba(0,0,0,0.9);">
    <div class="glass w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden" @click.away="showModal = false">
      <div class="p-6 border-b border-white/10 flex justify-between items-center">
        <h2 class="orbit text-gold font-black">EDIT DOSSIER</h2>
        <button @click="showModal = false" class="text-gray-500"><i data-lucide="x"></i></button>
      </div>
      
      <div class="p-6 space-y-4">
        <div>
          <label class="mono text-[10px] text-gray-500 uppercase">Operative Designation</label>
          <input type="text" x-model="profile.username" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white mono mt-1 focus:border-gold outline-none">
        </div>
        <div>
          <label class="mono text-[10px] text-gray-500 uppercase">Operational Notes</label>
          <textarea x-model="profile.bio" rows="4" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white text-sm mt-1 focus:border-gold outline-none"></textarea>
        </div>
        <div>
          <label class="mono text-[10px] text-gray-500 uppercase">Deployment Sector</label>
          <select x-model="profile.department" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white mono mt-1 focus:border-gold outline-none">
            <option value="UNASSIGNED">UNASSIGNED</option>
            <option value="FIELD OPS">FIELD OPS</option>
            <option value="INTELLIGENCE">INTELLIGENCE</option>
            <option value="AUDIO UNIT">AUDIO UNIT</option>
          </select>
        </div>
      </div>

      <div class="p-6 bg-white/5 flex gap-3">
        <button @click="showModal = false" class="btn flex-1 py-4 text-[10px] border border-white/10">Abort</button>
        <button @click="updateProfile()" class="btn-g flex-1 py-4 text-[10px] btn">
          <span x-show="!isLoading">Sync Changes</span>
          <i x-show="isLoading" data-lucide="loader" class="animate-spin"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
