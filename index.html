<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | DIRECT_COMMAND</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            background-color: #050505; color: #D4AF37; font-family: 'Inter', sans-serif;
            background-image: url('logo.png'); background-repeat: no-repeat;
            background-position: center; background-attachment: fixed; background-size: 30%;
            overflow: hidden;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.98); z-index: -1;
        }
        .glass-panel { background: rgba(13, 13, 13, 0.94); backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-glow { filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
        .admin-active { border: 2px solid #D4AF37 !important; box-shadow: 0 0 40px rgba(212, 175, 55, 0.2); }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

    <div class="h-screen flex flex-col animate-in fade-in duration-500">
        <header class="p-4 md:p-6 border-b border-gold/10 glass-panel flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-4 cursor-pointer" @click="settingsModal = true">
                <img src="logo.png" class="h-10 w-10 gold-glow">
                <div>
                    <h2 class="text-white text-[11px] font-black uppercase tracking-widest italic" x-text="agentName"></h2>
                    <p class="text-[7px] text-blue-400 font-bold uppercase tracking-widest" x-text="isAdmin ? 'SUPREME_COMMANDER' : 'PUBLIC_SECTOR_ACTIVE'"></p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button @click="openMap()" class="text-[8px] border border-gold/50 text-gold px-3 py-2 uppercase font-black hover:bg-gold rounded-lg">Sector Map</button>
                <button @click="copyInviteLink()" class="text-[8px] border border-blue-500/50 text-blue-400 px-3 py-2 uppercase font-black hover:bg-blue-500 rounded-lg">Invite</button>
                <template x-if="isAdmin">
                    <button @click="adminView = true" class="text-[8px] text-gold border border-gold/30 px-3 py-2 rounded-lg font-black uppercase">Admin Console</button>
                </template>
                <button @click="settingsModal = true" class="p-2 text-gold/60"><i data-lucide="settings" size="18"></i></button>
            </div>
        </header>

        <main class="flex-grow p-4 md:p-8 flex flex-col items-center justify-center">
            <div class="w-full max-w-5xl glass-panel rounded-[2.5rem] h-[82vh] flex flex-col overflow-hidden shadow-2xl relative" :class="isAdmin ? 'admin-active' : ''">
                
                <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-6">
                    <template x-for="msg in messages" :key="msg.id">
                        <div :class="msg.guest_id === guestId ? 'justify-end' : 'justify-start'" class="flex group">
                            <div :class="msg.guest_id === guestId ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-zinc-900 text-zinc-300 rounded-tl-none border border-white/5'" class="max-w-[80%] p-5 rounded-3xl relative shadow-xl">
                                <template x-if="isAdmin">
                                    <button @click="deleteMsg(msg.id)" class="absolute -top-2 -left-2 bg-red-600 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="trash-2" size="12"></i></button>
                                </template>
                                <div class="text-[8px] mb-1 opacity-50 font-black uppercase italic tracking-widest" x-text="msg.author_name"></div>
                                <p class="text-xs font-medium" x-text="msg.text"></p>
                                <div class="text-[7px] mt-2 opacity-30 text-right font-black" x-text="new Date(msg.created_at).toLocaleTimeString()"></div>
                            </div>
                        </div>
                    </template>
                </div>

                <form @submit.prevent="sendMessage()" class="p-5 bg-black/60 border-t border-white/5 flex gap-3">
                    <input x-model="newMessage" placeholder="INPUT TRANSMISSION..." class="flex-grow bg-zinc-900/50 p-4 rounded-xl text-xs text-white outline-none border border-white/10 focus:border-gold uppercase">
                    <button type="submit" class="bg-gold text-black px-10 py-4 rounded-xl font-black text-[10px] uppercase italic active:scale-95 transition-all">Transmit</button>
                </form>
            </div>
        </main>
    </div>

    <template x-if="settingsModal">
        <div class="fixed inset-0 z-[200] bg-black/95 flex items-center justify-center p-6 backdrop-blur-md">
            <div class="max-w-sm w-full glass-panel p-10 rounded-[3rem] text-center">
                <h3 class="text-gold text-xs font-black mb-8 uppercase tracking-widest italic">Identity_Terminal</h3>
                <input x-model="tempName" class="w-full bg-zinc-900 border border-white/10 rounded-xl p-5 text-white text-xs text-center mb-8 outline-none focus:border-gold uppercase">
                <div class="flex gap-4">
                    <button @click="settingsModal = false" class="flex-1 text-[9px] text-white/40 uppercase font-black">Abort</button>
                    <button @click="saveName()" class="flex-1 bg-gold text-black py-4 rounded-xl text-[9px] font-black uppercase">Sync_Alias</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        function app() {
            return {
                guestId: '', agentName: '', tempName: '', isAdmin: false,
                newMessage: '', messages: [], adminView: false, settingsModal: false,
                mapView: false, sectorStats: [], membersList: [], supabase: null,

                async init() {
                    const SB_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
                    this.supabase = window.supabase.createClient(SB_URL, SB_KEY);

                    // Local Device Identity - No password needed
                    this.guestId = localStorage.getItem('mog_id') || 'G-' + Math.random().toString(36).substr(2, 4).toUpperCase();
                    this.agentName = localStorage.getItem('mog_name') || 'AGENT_' + this.guestId.split('-')[1];
                    this.tempName = this.agentName;
                    this.isAdmin = localStorage.getItem('mog_is_admin') === 'true';
                    
                    localStorage.setItem('mog_id', this.guestId);
                    localStorage.setItem('mog_name', this.agentName);

                    this.fetchData();
                    this.subscribe();
                    lucide.createIcons();
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    
                    // Secret Director Override: Type this to unlock Admin Console
                    if (this.newMessage === '@MOGProtocol2026') {
                        this.isAdmin = true;
                        localStorage.setItem('mog_is_admin', 'true');
                        alert("DIRECTOR_AUTHORIZED: CONSOLE UNLOCKED");
                        this.newMessage = '';
                        return;
                    }

                    await this.supabase.from('messages').insert([{ 
                        text: this.newMessage.toUpperCase(), 
                        guest_id: this.guestId, 
                        author_name: this.agentName 
                    }]);
                    this.newMessage = '';
                },

                async fetchData() {
                    const { data } = await this.supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
                    this.messages = data || [];
                    this.$nextTick(() => { const el = document.getElementById('chat-stream'); if (el) el.scrollTop = el.scrollHeight; });
                },

                subscribe() {
                    this.supabase.channel('public').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (p) => {
                        if (p.eventType === 'INSERT') this.messages.push(p.new);
                        if (p.eventType === 'DELETE') this.messages = this.messages.filter(m => m.id !== p.old.id);
                        this.$nextTick(() => { const el = document.getElementById('chat-stream'); if (el) el.scrollTop = el.scrollHeight; });
                    }).subscribe();
                },
                
                copyInviteLink() {
                    const inviteUrl = `https://mog-directorate.vercel.app/enlist?sector=emalahleni&ref=${this.isAdmin ? 'DIRECTOR' : this.guestId}`;
                    navigator.clipboard.writeText(inviteUrl);
                    alert("INVITE_COPIED");
                },

                async deleteMsg(id) {
                    if (confirm("PURGE?")) await this.supabase.from('messages').delete().eq('id', id);
                },

                saveName() {
                    this.agentName = this.tempName.toUpperCase();
                    localStorage.setItem('mog_name', this.agentName);
                    this.settingsModal = false;
                }
            }
        }
    </script>
</body>
</html>
