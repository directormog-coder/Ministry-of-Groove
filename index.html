<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignal.js" async></script>
    <script>
        window.MOG_CONFIG = {
            url: 'https://quzwygjbqpkuqjhrmsjp.supabase.co',
            key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU'
        };
        const initMog = () => {
            if (window.supabase && !window.mog) {
                window.mog = window.supabase.createClient(window.MOG_CONFIG.url, window.MOG_CONFIG.key);
                const h = localStorage.getItem('mog_handle');
                if (h) window.mog.from('blacklisted_operatives').select('*').eq('username', h).single().then(({data}) => { if(data) { localStorage.clear(); window.location.href = '404.html'; }});
            } else if (!window.supabase) setTimeout(initMog, 50);
        };
        initMog();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">
    <div class="scanline"></div>
    <template x-if="isLockdown"><div class="fixed top-0 w-full bg-red-600 text-white py-1 z-[200] text-[8px] font-black text-center animate-pulse">LOCKDOWN_ACTIVE</div></template>
    <div x-show="view === 'auth'" class="h-screen flex flex-col items-center justify-center p-10">
        <img src="logo.png" @click="showBypass = !showBypass" class="h-32 w-32 mb-8 gold-glow rounded-full">
        <div x-show="!showBypass" class="w-full max-w-xs space-y-4">
            <input x-model="handleInput" type="text" placeholder="HANDLE..." class="w-full bg-white/5 border border-gold/20 p-4 rounded-2xl text-white text-center terminal-font">
            <button @click="initializeUser()" class="w-full py-4 bg-gold text-black font-black rounded-full">INITIALIZE</button>
        </div>
        <div x-show="showBypass" class="glass p-6 rounded-3xl w-full max-w-xs space-y-4">
            <input x-model="dirPass" type="password" placeholder="KEY..." class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-white text-center">
            <button @click="executeBypass()" class="w-full py-3 bg-white text-black font-black rounded-full">BYPASS</button>
        </div>
    </div>
    <div x-show="view === 'grid'" class="min-h-screen pb-24">
        <header class="p-6 glass flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3"><img src="logo.png" class="h-8 w-8 rounded-full"><span class="text-[10px] font-black uppercase italic">MOG_GRID</span></div>
            <button @click="logout()" class="text-red-500"><i data-lucide="power" size="18"></i></button>
        </header>
        <main class="p-6 space-y-6 max-w-xl mx-auto">
            <div class="grid grid-cols-2 gap-4">
                <div @click="subView = 'chat'" class="glass p-6 rounded-3xl text-center border-gold/20"><i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i><span class="text-[8px] font-black">GRID</span></div>
                <div onclick="window.location.href='dossier.html'" class="glass p-6 rounded-3xl text-center border-gold/20"><i data-lucide="user" class="mx-auto mb-2 text-green-400"></i><span class="text-[8px] font-black">DOSSIER</span></div>
                <div onclick="window.location.href='gallery.html'" class="glass p-6 rounded-3xl text-center border-gold/20"><i data-lucide="camera" class="mx-auto mb-2 text-purple-400"></i><span class="text-[8px] font-black">GALLERY</span></div>
                <div onclick="window.location.href='archives.html'" class="glass p-6 rounded-3xl text-center border-gold/20"><i data-lucide="database" class="mx-auto mb-2 text-gold"></i><span class="text-[8px] font-black">VAULT</span></div>
            </div>
            <div x-show="subView === 'chat'" class="glass rounded-[2rem] h-[40vh] flex flex-col overflow-hidden">
                <div id="chat-stream" class="flex-grow overflow-y-auto p-4 space-y-4">
                    <template x-for="msg in messages" :key="msg.id">
                        <div :class="msg.username === 'DIRECTORATE' ? 'items-end' : 'items-start'" class="flex flex-col">
                            <span class="text-[6px] text-zinc-500 uppercase px-2" x-text="msg.username"></span>
                            <div :class="msg.username === 'DIRECTORATE' ? 'bg-gold/10 border-gold/30' : 'bg-white/5'" class="p-3 rounded-xl border text-[11px] text-white" x-text="msg.content"></div>
                        </div>
                    </template>
                </div>
                <form @submit.prevent="send()" class="p-3 bg-black/40 border-t border-gold/10 flex gap-2">
                    <input x-model="msgInput" placeholder="SIGNAL..." class="flex-grow bg-transparent text-[11px] outline-none">
                    <button type="submit" class="text-gold"><i data-lucide="send" size="16"></i></button>
                </form>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
