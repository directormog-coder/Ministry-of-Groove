<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M.O.G. | National Command Center</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --mog-gold: #D4AF37; --mog-black: #0a0a0a; --mog-grey: #1a1a1a; }
        body { background: var(--mog-black); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #loading-screen { position: fixed; inset: 0; background: black; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
        .logo-glow { width: 220px; filter: drop-shadow(0 0 20px var(--mog-gold)); }

        #chat-interface { display: none; flex-direction: column; height: 100%; opacity: 0; transition: opacity 1s ease; }
        .header { padding: 15px; background: var(--mog-grey); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px; border-radius: 10px; background: #222; border-left: 4px solid var(--mog-gold); max-width: 85%; }
        .input-area { padding: 15px; background: var(--mog-grey); display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #000; color: white; outline: none; }
        .send-btn { background: var(--mog-gold); color: black; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <img src="logo.png" alt="M.O.G." class="logo-glow">
        <p style="color: var(--mog-gold); margin-top: 25px; letter-spacing: 4px; font-weight: bold;">AUTHENTICATING UPLINK...</p>
    </div>

    <div id="chat-interface">
        <div class="header">
            <span style="font-weight: bold; color: var(--mog-gold);">MINISTRY OF GROOVE</span>
            <button onclick="logout()" style="background:none; border:none; color:#555; font-size: 10px;">DISCONNECT</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Secure Transmission...">
            <button class="send-btn" onclick="sendMessage()"><i data-lucide="send"></i></button>
        </div>
    </div>

    <script>
        const SB_URL = "https://quzwygjbqpkuqjhrmsjp.supabase.co";
        const SB_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        async function init() {
            lucide.createIcons();
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                // Successful Handshake
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('chat-interface').style.display = 'flex';
                    document.getElementById('chat-interface').style.opacity = '1';
                }, 800);
                loadHistory();
                subscribe();
            } else {
                window.location.href = 'login.html'; 
            }
        }

        function subscribe() {
            _supabase.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                render(payload.new);
            }).subscribe();
        }

        async function loadHistory() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if (data) data.forEach(render);
        }

        function render(msg) {
            const d = document.createElement('div');
            d.className = 'msg';
            d.textContent = msg.content;
            document.getElementById('messages').appendChild(d);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        async function sendMessage() {
            const i = document.getElementById('msgInput');
            if (!i.value.trim()) return;
            const text = i.value; i.value = '';
            await _supabase.from('messages').insert([{ content: text }]);
        }

        async function logout() { await _supabase.auth.signOut(); window.location.reload(); }
        init();
    </script>
</body>
</html>
