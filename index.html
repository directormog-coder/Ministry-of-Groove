<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v2.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { --gold: #D4AF37; --noir: #050505; --gold-glow: rgba(212, 175, 55, 0.3); }
        
        body { 
            background: var(--noir); 
            color: var(--gold); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
            /* Subtle grain texture for the terminal feel */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            background-attachment: fixed;
            background-blend-mode: overlay;
        }

        .glass { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(20px) saturate(180%); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .ticker-move { 
            display: inline-block; 
            white-space: nowrap; 
            animation: ticker 40s linear infinite; 
        }
        @keyframes ticker { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }

        #chat-stream::-webkit-scrollbar { width: 3px; }
        #chat-stream::-webkit-scrollbar-track { background: transparent; }
        #chat-stream::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; opacity: 0.3; }

        .terminal-font { font-family: 'JetBrains Mono', monospace; }
        [x-cloak] { display: none !important; }
        
        .btn-active:active { transform: scale(0.95); transition: 0.1s; }
        .gold-glow:hover { box-shadow: 0 0 15px var(--gold-glow); transition: 0.4s; }

        /* Skeleton Animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(212,175,55,0.05) 25%, rgba(212,175,55,0.1) 50%, rgba(212,175,55,0.05) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">

    <div class="fixed top-0 w-full z-[100] glass py-2 border-b border-gold/10 overflow-hidden">
        <div class="ticker-move text-[9px] font-black uppercase tracking-widest text-white">
            <template x-for="news in newsItems" :key="news.id">
                <span class="mx-10" x-text="`${news.title}: ${news.message} — [${new Date(news.created_at).toLocaleTimeString()}]` "></span>
            </template>
            <template x-if="newsItems.length === 0">
                <span class="mx-10 text-gold/40">SYSTEM_IDLE: SCANNING FOR INCOMING DIRECTORATE FREQUENCIES...</span>
            </template>
        </div>
    </div>

    <template x-if="hasDM">
        <div class="fixed bottom-32 left-6 right-6 glass p-4 rounded-2xl border-gold animate-bounce z-[150] flex items-center gap-4 shadow-2xl ring-1 ring-gold/50">
            <i data-lucide="mail" class="text-gold animate-pulse"></i>
            <div class="flex-grow">
                <p class="text-[8px] font-black uppercase text-white">Direct Instruction Received</p>
                <p class="text-[10px] italic text-gold/80" x-text="latestDM"></p>
            </div>
            <button @click="hasDM = false" class="text-[10px] font-black hover:text-white">DISMISS</button>
        </div>
    </template>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-10 text-center">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gold rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
                <img src="logo.png" class="relative h-32 w-32 mb-8 rounded-full border border-gold/20 grayscale hover:grayscale-0 transition-all duration-700">
            </div>
            <div class="w-full max-w-xs space-y-6">
                <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                <p class="text-[7px] text-gold/60 font-bold uppercase tracking-[0.2em] -mt-4">Decrypting the Culture. Synchronizing the Grid.</p>
                <input x-model="handleInput" @keyup.enter="initializeUser()" placeholder="OPERATIVE_HANDLE..." class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white text-center outline-none focus:border-gold/50 transition-all terminal-font">
                <button @click="initializeUser()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full shadow-lg btn-active">Initialize Access</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen pt-14 pb-12 space-y-6">
            
            <header class="p-5 glass flex justify-between items-center mx-4 rounded-2xl sticky top-12 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full border border-gold/20 shadow-inner">
                    <div>
                        <p class="text-[11px] font-black uppercase text-white tracking-widest leading-none">Ministry of Groove</p>
                        <p class="text-[6px] text-gold/50 uppercase mt-1 tracking-tighter" x-text="`Sector: ${province} | System: Online`"></p>
                        <p class="text-[5px] text-zinc-500 uppercase font-bold mt-1 terminal-font" x-text="sastTime"></p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button @click="window.location.href='dossier.html'" class="p-2 glass rounded-lg border-gold/10 gold-glow"><i data-lucide="user" size="14"></i></button>
                    <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg hover:bg-red-500/10"><i data-lucide="power" size="14"></i></button>
                </div>
            </header>

            <main class="px-4 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <template x-for="tab in ['chat', 'map', 'audio', 'charts']">
                        <div @click="subView = tab" 
                             :class="subView === tab ? 'bg-white/10 border-white/30 scale-[1.02]' : 'border-gold/10 opacity-60 hover:opacity-100'" 
                             class="glass p-5 rounded-[2rem] text-center cursor-pointer border transition-all duration-300">
                            <i :data-lucide="tab === 'chat' ? 'message-square' : tab === 'map' ? 'map-pin' : tab === 'audio' ? 'music' : 'trending-up'" 
                               class="mx-auto mb-2" :class="subView === tab ? 'text-gold' : 'text-zinc-500'"></i>
                            <span class="text-[8px] font-black uppercase text-white" x-text="tab === 'chat' ? 'Grid Chat' : tab === 'map' ? 'Live Map' : tab === 'audio' ? 'Streaming' : 'Top 10'"></span>
                        </div>
                    </template>
                </div>

                <div class="glass rounded-[3rem] min-h-[55vh] overflow-hidden flex flex-col">
                    
                    <div x-show="subView === 'chat'" class="flex-grow flex flex-col p-4 h-[55vh]">
                        <div id="chat-stream" class="flex-grow overflow-y-auto space-y-4 p-2 custom-scroll">
                            <template x-if="isLoading">
                                <div class="space-y-4">
                                    <div class="skeleton h-12 w-3/4 rounded-2xl"></div>
                                    <div class="skeleton h-12 w-1/2 rounded-2xl ml-auto"></div>
                                    <div class="skeleton h-12 w-2/3 rounded-2xl"></div>
                                </div>
                            </template>
                            <template x-for="msg in messages" :key="msg.id">
                                <div :class="msg.username === 'DIRECTORATE' || msg.username === username ? 'ml-auto items-end' : 'items-start'" class="flex flex-col max-w-[85%] group">
                                    <span class="text-[6px] text-zinc-500 uppercase px-2 mb-1 group-hover:text-gold transition-colors" x-text="`${msg.username} • ${new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`"></span>
                                    <div :class="msg.username === 'DIRECTORATE' ? 'bg-gold/20 border-gold/40 text-gold font-bold' : msg.username === username ? 'bg-white/10 border-white/20 text-white' : 'bg-white/5 border-white/5 text-zinc-300'" class="p-4 rounded-2xl text-[12px] border transition-all" x-text="msg.content"></div>
                                </div>
                            </template>
                        </div>
                        <form @submit.prevent="send()" class="mt-4 flex gap-2">
                            <input x-model="msgInput" :disabled="isTransmitting" placeholder="TRANSMIT_SIGNAL..." class="flex-grow bg-white/5 p-4 rounded-2xl text-[12px] text-white outline-none focus:ring-1 ring-gold/30 terminal-font disabled:opacity-50">
                            <button type="submit" :disabled="isTransmitting" class="bg-gold text-black px-6 rounded-2xl btn-active disabled:bg-zinc-700">
                                <template x-if="!isTransmitting"><i data-lucide="send" size="18"></i></template>
                                <template x-if="isTransmitting"><div class="animate-spin h-4 w-4 border-2 border-black border-t-transparent rounded-full"></div></template>
                            </button>
                        </form>
                    </div>

                    <div x-show="subView === 'charts'" class="p-6 space-y-4">
                        <template x-for="(track, index) in tracks" :key="track.id">
                            <div class="flex items-center justify-between bg-white/5 p-5 rounded-3xl border border-white/5 hover:border-gold/20 transition-all">
                                <div class="flex items-center gap-6">
                                    <span class="text-2xl font-black italic opacity-20 terminal-font" x-text="index + 1"></span>
                                    <div><p class="text-[11px] font-black text-white uppercase" x-text="track.title"></p><p class="text-[8px] text-gold/50 font-bold" x-text="track.artist"></p></div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="text-[9px] font-black" x-text="track.votes"></span>
                                    <button @click="vote(track.id)" class="p-3 bg-gold/10 text-gold rounded-full gold-glow"><i data-lucide="arrow-big-up" size="18"></i></button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
                
                <footer class="glass p-10 rounded-[3rem] space-y-10 border-t border-gold/10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 text-center md:text-left">
                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black uppercase tracking-widest text-white">Social Uplink</h4>
                            <div class="flex justify-center md:justify-start gap-6">
                                <a href="https://www.facebook.com/share/1AiqRtLxeo/" target="_blank" class="hover:text-white transition-all"><i data-lucide="facebook"></i></a>
                                <a href="https://tiktok.com/@ministryofgroove" target="_blank" class="hover:text-white transition-all"><i data-lucide="music-2"></i></a>
                                <a href="https://www.instagram.com/ministryofgroove_hq?igsh=Y3Rwc24zcmtsY2xj" target="_blank" class="hover:text-white transition-all"><i data-lucide="instagram"></i></a>
                                <a href="https://www.youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:text-white transition-all"><i data-lucide="youtube"></i></a>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black uppercase tracking-widest text-white">Directorate Contact</h4>
                            <div class="space-y-2 flex flex-col items-center md:items-start">
                                <a href="mailto:director.mog@gmail.com" class="text-[11px] text-zinc-400 hover:text-gold transition-colors">director.mog@gmail.com</a>
                                <a href="https://wa.me/27813874921" class="text-[11px] text-zinc-400 hover:text-gold transition-colors">+27 81 387 4921</a>
                            </div>
                        </div>
                    </div>
                    <p class="pt-8 border-t border-white/5 text-center text-[7px] font-black uppercase tracking-[0.5em] opacity-40">© 2026 Ministry of Groove. All Rights Reserved.</p>
                </footer>
            </main>
        </div>
    </template>

    <script>
        function ministry() {
            return {
                view: 'auth', subView: 'chat', username: '', province: 'DETECTING...',
                messages: [], msgInput: '', handleInput: '', 
                provinceStats: [], tracks: [], newsItems: [], streamUrl: '',
                sastTime: '', hasDM: false, latestDM: '',
                isLoading: true, isTransmitting: false,

                async init() {
                    const saved = localStorage.getItem('mog_handle');
                    if(saved) { 
                        this.username = saved; 
                        this.view = 'grid';
                        this.updateTime();
                        await this.syncAll();
                        this.subscribe();
                        // Intervals for background sync
                        setInterval(() => { this.updatePresence(); this.syncAll(); }, 30000);
                        setInterval(() => this.updateTime(), 1000);
                    }
                    this.$nextTick(() => {
                        lucide.createIcons();
                        this.isLoading = false;
                    });
                },

                updateTime() {
                    this.sastTime = new Date().toLocaleTimeString('en-ZA', { 
                        timeZone: 'Africa/Johannesburg', 
                        hour12: false, 
                        hour: '2-digit', minute: '2-digit', second: '2-digit' 
                    });
                },

                scrollToBottom() {
                    const el = document.getElementById('chat-stream');
                    if (el) {
                        el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                    }
                },

                async syncAll() {
                    try {
                        const [msg, stats, trks, news, strm] = await Promise.all([
                            mog_sb.from('messages').select('*').order('created_at', { ascending: true }).limit(50),
                            mog_sb.rpc('get_province_stats'),
                            mog_sb.from('chart_tracks').select('*').order('votes', { ascending: false }),
                            mog_sb.from('broadcasts').select('*').order('created_at', { ascending: false }).limit(5),
                            mog_sb.from('stream_config').select('*').single()
                        ]);
                        this.messages = msg.data || [];
                        this.provinceStats = stats.data || [];
                        this.tracks = trks.data || [];
                        this.newsItems = news.data || [];
                        this.streamUrl = strm.data?.playlist_url;
                        this.$nextTick(() => this.scrollToBottom());
                        this.detectLocation();
                    } catch (e) { console.error("Grid Sync Error:", e); }
                },

                subscribe() {
                    mog_sb.channel('global')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                            this.messages.push(p.new);
                            this.$nextTick(() => this.scrollToBottom());
                        })
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `recipient=eq.${this.username}` }, p => {
                            this.hasDM = true; 
                            this.latestDM = p.new.content;
                        })
                        .subscribe();
                },

                async send() {
                    if(!this.msgInput.trim() || this.isTransmitting) return;
                    this.isTransmitting = true;
                    const content = this.msgInput.toUpperCase();
                    const { error } = await mog_sb.from('messages').insert([{ content, username: this.username }]);
                    if(!error) {
                        this.msgInput = '';
                        this.$nextTick(() => this.scrollToBottom());
                    }
                    this.isTransmitting = false;
                },

                async vote(id) { 
                    await mog_sb.rpc('vote_track', { track_id: id }); 
                    this.syncAll(); // Refresh local list
                },

                async detectLocation() {
                    try {
                        const res = await fetch('https://ipapi.co/json/');
                        const data = await res.json();
                        this.province = data.region ? data.region.toUpperCase() : 'MPUMALANGA';
                    } catch (e) { this.province = 'SOUTH AFRICA'; }
                    this.updatePresence();
                },

                async updatePresence() {
                    await mog_sb.from('presence').upsert({ 
                        username: this.username, 
                        last_seen: new Date().toISOString(), 
                        province: this.province 
                    });
                },

                initializeUser() {
                    if(!this.handleInput.trim()) return;
                    localStorage.setItem('mog_handle', this.handleInput.toUpperCase());
                    location.reload();
                },

                logout() { 
                    localStorage.clear(); 
                    location.reload(); 
                }
            }
        }
    </script>
</body>
        </html>
