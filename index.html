<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Ministry of Groove - NCC Master Control Interface">
    <meta name="theme-color" content="#D4AF37">
    <link rel="manifest" href="manifest.json">
    
    <title>MINISTRY OF GROOVE | NCC MASTER v5.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', light: '#F4D03F', dark: '#B8941F' },
                        electric: '#00F2FF',
                        ncc: { black: '#050508', dark: '#0a0a0a', panel: '#111111' }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        [x-cloak] { display: none !important; }
        
        /* Unified Brand Typography from style.css */
        .brand-title { 
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800; 
            letter-spacing: 0.2em; 
            color: var(--gold); 
            text-transform: uppercase; 
            text-shadow: 0 0 30px var(--gold-glow);
        }

        /* Tactical Nav Engine Styles */
        .glass-gold {
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }

        .tactical-tile {
            background: rgba(17, 17, 17, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tactical-tile:hover {
            border-color: var(--electric);
            background: rgba(0, 242, 255, 0.05);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1);
        }
    </style>
</head>
<body x-data="nccMasterEngine()" x-init="init()" x-cloak class="bg-ncc-black text-white min-h-screen">

    <div class="bg-circuit-pattern" aria-hidden="true"></div>
    <div class="circuit-vignette" aria-hidden="true"></div>

    <template x-if="view === 'auth'">
        <main class="min-h-screen flex flex-col items-center justify-center p-6 relative z-50">
            <div class="w-full max-w-md animate-fade-in">
                <div class="flex flex-col items-center mb-10">
                    <img src="assets/images/logo.png" alt="MOG Logo" class="w-32 h-32 mb-6 filter drop-shadow-[0_0_20px_rgba(212,175,55,0.4)]">
                    <h1 class="brand-title text-2xl text-center">Ministry of Groove</h1>
                    <p class="terminal-font text-[10px] text-gold/60 mt-2">Central Operations Gate</p>
                </div>

                <div class="glass-gold p-8 rounded-[2rem] space-y-6">
                    <div class="space-y-4">
                        <input x-model="authForm.id" type="text" placeholder="IDENTIFICATION" class="ncc-input text-center">
                        <input x-model="authForm.pass" type="password" placeholder="PASSCODE" class="ncc-input text-center">
                        
                        <button @click="attemptAccess()" class="btn-command w-full py-4 mt-2">
                            AUTHORIZE ACCESS
                        </button>
                    </div>

                    <div class="relative py-2 flex items-center">
                        <div class="flex-grow border-t border-white/5"></div>
                        <span class="px-4 text-[8px] text-white/20 uppercase tracking-[0.5em]">OR</span>
                        <div class="flex-grow border-t border-white/5"></div>
                    </div>

                    <button @click="loginWithGoogle()" class="w-full py-3 px-4 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center gap-3 hover:bg-white/10 transition-all">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-5 h-5" alt="Google">
                        <span class="text-xs font-bold uppercase tracking-widest">Biometric Uplink</span>
                    </button>
                </div>
                
                <p class="text-center mt-8 text-[9px] text-white/20 uppercase tracking-[0.4em]">Unauthorized access is recorded.</p>
            </div>
        </main>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col relative z-10">
            
            <header class="glass-gold sticky top-0 z-50 px-6 py-4">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <img src="assets/images/logo.png" alt="MOG Logo" class="w-12 h-12">
                        <div>
                            <h2 class="brand-title text-sm tracking-widest">MOG MASTER</h2>
                            <div class="flex items-center gap-2">
                                <span class="w-1.5 h-1.5 bg-electric rounded-full animate-pulse"></span>
                                <span class="text-[9px] text-gold/80 uppercase tracking-widest" x-text="'Role: ' + userRole"></span>
                            </div>
                        </div>
                    </div>
                    
                    <button @click="terminateSession()" class="btn-command btn-danger py-2 px-4 text-[10px]">
                        TERMINATE_SESSION
                    </button>
                </div>
            </header>

            <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
                <div class="text-center mb-16">
                    <h1 class="text-4xl font-black italic uppercase tracking-tighter text-white">Grid Dashboard</h1>
                    <p class="terminal-font text-xs text-zinc-500 mt-2">Synchronizing sector archives...</p>
                </div>

                <nav class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <a href="pages/dossier.html" class="tactical-tile p-10 flex flex-col items-center text-center group">
                        <div class="p-5 bg-gold/5 rounded-2xl mb-4 group-hover:bg-gold/10 transition-colors">
                            <i data-lucide="shield-check" class="w-10 h-10 text-gold"></i>
                        </div>
                        <h3 class="terminal-font text-white">Personnel Dossier</h3>
                        <p class="text-[10px] text-zinc-500 mt-2 uppercase">Classified Files</p>
                    </a>

                    <a href="pages/gallery.html" class="tactical-tile p-10 flex flex-col items-center text-center group">
                        <div class="p-5 bg-electric/5 rounded-2xl mb-4 group-hover:bg-electric/10 transition-colors">
                            <i data-lucide="camera" class="w-10 h-10 text-electric"></i>
                        </div>
                        <h3 class="terminal-font text-white">Media Archives</h3>
                        <p class="text-[10px] text-zinc-500 mt-2 uppercase">Visual Surveillance</p>
                    </a>

                    <a href="pages/frequency.html" class="tactical-tile p-10 flex flex-col items-center text-center group">
                        <div class="p-5 bg-white/5 rounded-2xl mb-4 group-hover:bg-white/10 transition-colors">
                            <i data-lucide="activity" class="w-10 h-10 text-white/60"></i>
                        </div>
                        <h3 class="terminal-font text-white">Frequency Monitor</h3>
                        <p class="text-[10px] text-zinc-500 mt-2 uppercase">Signal Intelligence</p>
                    </a>
                </nav>

                <section class="mt-20 p-10 glass-gold rounded-[2.5rem] text-center border-dashed border-white/5">
                    <p class="terminal-font text-[11px] text-zinc-400 mb-8 tracking-[0.5em]">External Uplink Hub</p>
                    <div class="flex justify-center gap-10 flex-wrap">
                        <a href="https://instagram.com/ministryofgroove_hq" target="_blank" class="hover:scale-125 transition-all text-zinc-500 hover:text-[#E4405F]"><i data-lucide="instagram" class="w-8 h-8"></i></a>
                        <a href="https://wa.me/message/EASM3GTNOVSQE1" target="_blank" class="hover:scale-125 transition-all text-zinc-500 hover:text-[#25D366]"><i data-lucide="message-circle" class="w-8 h-8"></i></a>
                        <a href="https://youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:scale-125 transition-all text-zinc-500 hover:text-[#FF0000]"><i data-lucide="youtube" class="w-8 h-8"></i></a>
                    </div>
                </section>
            </main>

            <footer class="py-12 text-center">
                <p class="terminal-font text-[10px] text-zinc-700 tracking-[1em]">© 2026 MINISTRY OF GROOVE // NCC MASTER</p>
            </footer>
        </div>
    </template>

    <script src="js/auth.js"></script>
    <script>
        function nccMasterEngine() {
            return {
                view: 'auth', // Start at the gate
                userRole: '',
                authForm: { id: '', pass: '' },
                
                async init() {
                    // Check if already authenticated
                    const savedRole = localStorage.getItem('userRole');
                    if (savedRole) {
                        this.userRole = savedRole;
                        this.view = 'grid';
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                attemptAccess() {
                    // Logic from our auth.js
                    const role = this.authForm.id.toLowerCase();
                    const pass = this.authForm.pass;
                    
                    if (role === 'director' && pass === 'COMMAND-01') {
                        this.loginSuccess('director');
                    } else if (role === 'operative' && pass === 'GROOVE-99') {
                        this.loginSuccess('operative');
                    } else {
                        alert("ACCESS DENIED: Credentials Invalid");
                    }
                },

                loginSuccess(role) {
                    localStorage.setItem('userRole', role);
                    localStorage.setItem('isAuth', 'true');
                    this.userRole = role;
                    this.view = 'grid';
                    this.$nextTick(() => lucide.createIcons());
                },

                terminateSession() {
                    localStorage.clear();
                    this.view = 'auth';
                    this.$nextTick(() => lucide.createIcons());
                },

                loginWithGoogle() {
                    // Placeholder for your Supabase Google Auth
                    alert("Initializing Biometric Uplink...");
                }
            }
        }

        // Register Service Worker from root
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(() => console.log("MOG Protocol Active"))
                .catch(err => console.log("Uplink Failed", err));
        }
    </script>
</body>
</html>
