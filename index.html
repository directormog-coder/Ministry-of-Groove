<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #D4AF37; --noir: #050505; }
        body { background: var(--noir); color: var(--gold); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        #chat-stream::-webkit-scrollbar { width: 4px; }
        #chat-stream::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.2); border-radius: 10px; }
        .terminal-font { font-family: 'JetBrains Mono', monospace; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">

    <div class="fixed top-0 w-full z-[100] glass py-2 border-b border-gold/10 overflow-hidden">
        <div class="ticker-move text-[9px] font-black uppercase tracking-widest text-white">
            <template x-for="news in newsItems" :key="news.id">
                <span class="mx-10" x-text="`${news.title}: ${news.message} — [${new Date(news.created_at).toLocaleTimeString()}]` "></span>
            </template>
            <template x-if="newsItems.length === 0">
                <span class="mx-10 text-gold/40">SYSTEM_IDLE: STANDBY FOR DIRECTORATE SIGNAL...</span>
            </template>
        </div>
    </div>

    <template x-if="view === 'grid' && subView !== 'audio'">
        <div class="fixed bottom-6 right-6 glass p-2 pr-6 rounded-full border-gold/30 shadow-2xl flex items-center gap-3 animate-in fade-in slide-in-from-right-10 z-[100]">
            <a href="https://wa.me/27813874921?text=INITIALIZE_SIGNAL_REPORT:_ID:" target="_blank" class="h-12 w-12 bg-gold rounded-full flex items-center justify-center text-black shadow-lg active:scale-90 transition-all">
                <i data-lucide="message-circle" size="20"></i>
            </a>
            <div class="hidden md:block">
                <p class="text-[7px] font-black uppercase text-white tracking-widest leading-tight">Direct Instruction</p>
                <p class="text-[9px] text-gold font-bold">REPORT TO HQ</p>
            </div>
        </div>
    </template>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-10 text-center animate-in fade-in">
            <img src="logo.png" class="h-32 w-32 mb-8 rounded-full border border-gold/20 shadow-2xl">
            <div class="w-full max-w-xs space-y-6">
                <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                <p class="text-[7px] text-gold/60 font-bold uppercase tracking-[0.2em] -mt-4">Decrypting the Culture. Synchronizing the Grid.</p>
                <input x-model="handleInput" placeholder="OPERATIVE_HANDLE..." class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white text-center outline-none">
                <button @click="initializeUser()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full shadow-lg">Initialize Access</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen pt-14 pb-12 space-y-6">
            <header class="p-5 glass flex justify-between items-center mx-4 rounded-2xl sticky top-12 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full border border-gold/20">
                    <div>
                        <p class="text-[11px] font-black uppercase text-white tracking-widest leading-none">Ministry of Groove</p>
                        <p class="text-[6px] text-gold/50 uppercase mt-1 tracking-tighter">Decrypting the Culture. Synchronizing the Grid.</p>
                        <p class="text-[5px] text-zinc-500 uppercase font-bold mt-1" x-text="`Sector: ${province} | Time: ${sastTime}`"></p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button @click="window.location.href='dossier.html'" class="p-2 glass rounded-lg border-gold/10"><i data-lucide="user" size="14"></i></button>
                    <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg"><i data-lucide="power" size="14"></i></button>
                </div>
            </header>

            <main class="px-4 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'bg-white/10' : ''" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10 transition-all">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Grid Chat</span>
                    </div>
                    <div @click="subView = 'map'" :class="subView === 'map' ? 'bg-white/10' : ''" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10 transition-all">
                        <i data-lucide="map-pin" class="mx-auto mb-2 text-green-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Live Map</span>
                    </div>
                    <div @click="subView = 'audio'" :class="subView === 'audio' ? 'bg-white/10' : ''" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10 transition-all">
                        <i data-lucide="music" class="mx-auto mb-2 text-gold"></i>
                        <span class="text-[8px] font-black uppercase text-white">Streaming</span>
                    </div>
                    <div @click="subView = 'charts'" :class="subView === 'charts' ? 'bg-white/10' : ''" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10 transition-all">
                        <i data-lucide="trending-up" class="mx-auto mb-2 text-purple-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Top 10</span>
                    </div>
                </div>

                <footer class="glass p-10 rounded-[3rem] space-y-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black uppercase tracking-widest text-white">Social Uplink</h4>
                            <div class="flex flex-wrap gap-6">
                                <a href="https://www.facebook.com/share/1AiqRtLxeo/" target="_blank" class="hover:text-white transition-all"><i data-lucide="facebook"></i></a>
                                <a href="https://tiktok.com/@ministryofgroove" target="_blank" class="hover:text-white transition-all"><i data-lucide="music-2"></i></a>
                                <a href="https://www.instagram.com/ministryofgroove_hq?igsh=Y3Rwc24zcmtsY2xj" target="_blank" class="hover:text-white transition-all"><i data-lucide="instagram"></i></a>
                                <a href="https://www.youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:text-white transition-all"><i data-lucide="youtube"></i></a>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black uppercase tracking-widest text-white">Directorate Contact</h4>
                            <div class="space-y-2">
                                <a href="mailto:director.mog@gmail.com" class="flex items-center gap-3 text-[11px] text-zinc-400 hover:text-gold transition-colors"><i data-lucide="mail" size="14"></i> director.mog@gmail.com</a>
                                <a href="https://wa.me/27813874921" class="flex items-center gap-3 text-[11px] text-zinc-400 hover:text-gold transition-colors"><i data-lucide="message-circle" size="14"></i> +27 81 387 4921</a>
                            </div>
                        </div>
                    </div>
                    <div class="pt-8 border-t border-white/5 text-center">
                        <p class="text-[7px] font-black uppercase tracking-[0.5em] opacity-40">© 2026 Ministry of Groove. Decrypting the Culture.</p>
                    </div>
                </footer>
            </main>
        </div>
    </template>

    <script>
        // ... (Full ministry script remains the same as provided in previous turn) ...
    </script>
</body>
</html>
