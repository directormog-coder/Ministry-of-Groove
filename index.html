<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        
        let supabaseClient = null;
        
        function ministry() {
            return {
                view: 'auth',
                subView: 'chat',
                authMode: 'login',
                username: '',
                emailInput: '',
                passwordInput: '',
                confirmPassword: '',
                handleInput: '',
                userStatus: 'online',
                isDirector: false,
                isLoading: false,
                errorMsg: '',
                isOnline: navigator.onLine,
                soundEnabled: true,
                darkMode: true,
                notifications: true,
                showSettings: false,
                messages: [],
                msgInput: '',
                typingUsers: [],
                unreadCount: 0,
                onlineCount: 0,
                galleryItems: [],
                selectedImage: null,
                isUploading: false,
                uploadProgress: 0,
                totalStorage: 0,
                showVoiceRecorder: false,
                isRecording: false,
                recordingTime: '00:00',
                recordedBlob: null,
                showEncryptionModal: false,
                encryptionPassword: '',
                pendingFile: null,
                showPrivateModal: false,
                privateMessageRecipient: '',
                privateMsgInput: '',
                amapianoChart: [],
                totalVotes: 0,
                currentPlaying: null,
                nowPlaying: null,
                isPlaying: false,
                playbackProgress: 0,
                currentTime: '',
                weatherStatus: 'SECURE CONNECTION',
                sessionDuration: '00:00',
                sessionStart: null,
                
                async init() {
                    console.log('🎛️ Ministry of Groove System Initializing...');
                    try {
                        if (typeof supabase !== 'undefined') {
                            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        }
                    } catch (e) { console.error('Supabase Init Error:', e); }
                    
                    await this.checkSession();
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    
                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { this.isOnline = false; });
                    
                    if (typeof lucide !== 'undefined') lucide.createIcons();

                    this.$watch('view', () => {
                        this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                    });
                },
                
                async checkSession() {
                    if (!supabaseClient) return;
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) { this.setupSession(session.user); }
                },

                setupSession(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid';
                    this.sessionStart = Date.now();
                    this.startSessionTimer();
                    this.loadMessages();
                    this.loadGallery();
                    this.loadAmapianoChart();
                    this.subscribeToMessages();
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    try {
                        const { error } = await supabaseClient.auth.signInWithOAuth({
                            provider: 'google', options: { redirectTo: window.location.origin }
                        });
                        if (error) throw error;
                    } catch (e) { this.errorMsg = e.message.toUpperCase(); }
                    finally { this.isLoading = false; }
                },

                async loginUser() {
                    if (!this.emailInput || !this.passwordInput) { this.errorMsg = 'ENTER CREDENTIALS'; return; }
                    this.isLoading = true;
                    try {
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: this.emailInput.toLowerCase().trim(), password: this.passwordInput
                        });
                        if (error) throw error;
                        this.setupSession(data.user);
                    } catch (e) { this.errorMsg = e.message.toUpperCase(); }
                    finally { this.isLoading = false; }
                },

                async registerUser() {
                    if (this.passwordInput !== this.confirmPassword) { this.errorMsg = 'PASSWORDS DO NOT MATCH'; return; }
                    this.isLoading = true;
                    try {
                        const { error } = await supabaseClient.auth.signUp({
                            email: this.emailInput.toLowerCase().trim(), password: this.passwordInput,
                            options: { data: { handle: this.handleInput } }
                        });
                        if (error) throw error;
                        this.authMode = 'login';
                    } catch (e) { this.errorMsg = e.message.toUpperCase(); }
                    finally { this.isLoading = false; }
                },

                async loadMessages() {
                    const { data } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
                    if (data) { this.messages = data; this.scrollToBottom(); }
                },

                async loadGallery() {
                    const { data } = await supabaseClient.from('gallery').select('*').order('created_at', { ascending: false });
                    if (data) { this.galleryItems = data; this.calculateStorage(); }
                },

                loadAmapianoChart() {
                    this.amapianoChart = [
                        { id: 1, title: 'Amazwe', artist: 'Mthunzi ft. MaWhoo', votes: 1240, url: '#' },
                        { id: 2, title: 'Imithandazo', artist: 'Kabza De Small', votes: 1180, url: '#' },
                        { id: 3, title: 'Uku Khula', artist: 'Toss', votes: 950, url: '#' }
                    ];
                    this.totalVotes = this.amapianoChart.reduce((a, b) => a + b.votes, 0);
                },

                playPreview(song) {
                    this.nowPlaying = song;
                    this.isPlaying = true;
                    this.playbackProgress = 0;
                    if(this.audioInterval) clearInterval(this.audioInterval);
                    this.audioInterval = setInterval(() => {
                        if(this.isPlaying && this.playbackProgress < 100) this.playbackProgress += 0.5;
                    }, 100);
                },

                togglePlay() { this.isPlaying = !this.isPlaying; },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    await supabaseClient.from('messages').insert({ username: this.username, content: this.msgInput });
                    this.msgInput = '';
                },

                updateTime() { this.currentTime = new Date().toLocaleTimeString('en-US', { hour12: false }); },
                startSessionTimer() {
                    setInterval(() => {
                        if (this.sessionStart) {
                            const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                            this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                        }
                    }, 1000);
                },
                scrollToBottom() { this.$nextTick(() => { if(this.$refs.chatContainer) this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight; }); },
                formatTime(ds) { return new Date(ds).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false}); },
                formatDate(ds) { return new Date(ds).toLocaleDateString(); },
                formatBytes(b) { return (b / 1024).toFixed(2) + ' KB'; },
                calculateStorage() { this.totalStorage = this.galleryItems.reduce((acc, item) => acc + (item.size || 0), 0); },
                voteForSong(id) {
                    const s = this.amapianoChart.find(x => x.id === id);
                    if (s && !s.userVoted) { s.votes++; s.userVoted = true; this.totalVotes++; }
                },
                logout() { supabaseClient.auth.signOut(); this.view = 'auth'; this.sessionStart = null; },
                subscribeToMessages() {
                    supabaseClient.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.scrollToBottom();
                    }).subscribe();
                }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <div class="offline-banner" :class="{ 'show': !isOnline }">OFFLINE MODE - LOCAL ACCESS ONLY</div>

    <div x-show="selectedImage" class="image-modal" :class="{ 'active': selectedImage }" @click="selectedImage = null">
        <img :src="selectedImage" @click.stop alt="Full size">
    </div>

    <div x-show="showVoiceRecorder" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90" x-transition>

            <div class="flex justify-center mb-6">
                <div class="audio-visualizer" x-show="isRecording">
                    <div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div><div class="audio-bar"></div>
                </div>
                <div x-show="!isRecording" class="h-20 flex items-center justify-center">
                    <i data-lucide="mic" class="w-12 h-12 text-gold/30"></i>
                </div>
            </div>
            <div x-show="isRecording" class="text-gold font-black text-2xl mb-4 terminal-font" x-text="recordingTime"></div>
            <div class="flex gap-3 justify-center">

                <button x-show="isRecording" @click="isRecording = false" class="w-16 h-16 rounded-full bg-gold flex items-center justify-center"><i data-lucide="square" class="w-8 h-8 text-black"></i></button>

    <div x-show="showEncryptionModal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90" x-transition>

            </div>
        </div>
    </div>

    <template x-if="view === 'auth'">

                </div>

                        <input x-model="emailInput" type="email" placeholder="OPERATIVE@GMAIL.COM" class="w-full bg-black/60 border border-gold/20 p-5 rounded-2xl text-[11px] text-white text-center terminal-font outline-none uppercase">
                        <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/60 border border-gold/20 p-5 rounded-2xl text-[11px] text-white text-center terminal-font outline-none uppercase" @keyup.enter="loginUser()">

    <template x-if="view === 'grid'">

                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10' : 'border-white/10'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105 group">

                    </div>
                    <div class="glass p-5 rounded-3xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-500 uppercase tracking-widest mb-1 font-black">Assets</p>
                        <p class="text-xl font-black text-gold terminal-font" x-text="galleryItems.length"></p>

                    <div class="glass p-5 rounded-3xl border border-white/5 text-center">

                </div>
            </main>

            <footer class="mog-footer border-t border-white/5 mt-12 bg-black/40 backdrop-blur-xl">
                <div class="max-w-6xl mx-auto p-12 grid md:grid-cols-4 gap-12">
                    <div class="space-y-4">
                        <div class="text-2xl font-black text-gold italic">MOG</div>
                        <p class="text-[10px] text-zinc-400 leading-relaxed uppercase tracking-widest font-bold">Secure. Connected. Groove.</p>
                        <p class="text-[9px] text-zinc-600 leading-relaxed">The Ministry of Groove is your premier entertainment organization in Mpumalanga. Connecting operatives through secure channels.</p>
                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest">Operations</h4>
                        <div class="flex flex-col gap-4 text-[9px] text-zinc-400 uppercase font-black tracking-wider">
                            <a href="#" class="hover:text-gold transition-colors">Command Grid</a>
                            <a href="dossier.html" class="hover:text-gold transition-colors">Operative Dossier</a>
                            <a href="archives.html" class="hover:text-gold transition-colors">Classified Vault</a>

                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest">Directorate</h4>
