<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | SUPREME COMMAND</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #050505; color: #D4AF37; font-family: 'Inter', sans-serif; background-image: url('logo.png'); background-repeat: no-repeat; background-position: center; background-attachment: fixed; background-size: 30%; overflow-x: hidden; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5, 5, 5, 0.98); z-index: -1; }
        .glass-panel { background: rgba(13, 13, 13, 0.94); backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .gold-glow { filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
        .admin-border { border: 2px solid #D4AF37 !important; box-shadow: 0 0 30px rgba(212, 175, 55, 0.1); }
        [x-cloak] { display: none !important; }
        .announcement-bar { background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), transparent); border-y: 1px solid rgba(212,175,55,0.2); }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

    <template x-if="appState === 'landing'">
        <div class="h-screen flex flex-col items-center justify-center text-center p-6 bg-black">
            <div @click="startUplink()" class="cursor-pointer group active:scale-95 transition-all">
                <img src="logo.png" class="h-48 w-48 mx-auto mb-10 gold-glow animate-pulse">
                <h1 class="text-white text-4xl md:text-6xl tracking-[0.5em] font-black uppercase italic">Ministry of Groove</h1>
                <p class="text-gold/40 text-[10px] tracking-[1.2em] mt-8 uppercase">Initialize National Grid</p>
            </div>
        </div>
    </template>

    <template x-if="appState === 'grid'">
        <div class="min-h-screen flex flex-col animate-in fade-in duration-700">
            <header class="p-4 md:p-6 border-b border-gold/10 glass-panel flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4 cursor-pointer" @click="openProfile()">
                    <img src="logo.png" class="h-10 w-10 gold-glow">
                    <div>
                        <h2 class="text-white text-[11px] font-black uppercase tracking-widest italic" x-text="profile?.full_name || 'Agent'"></h2>
                        <p class="text-[7px] text-blue-400 font-bold uppercase tracking-widest" x-text="profile?.role === 'admin' ? 'DIRECTOR' : 'Sector_eMalahleni'"></p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <template x-if="profile?.role === 'admin'">
                        <button @click="openAdmin()" class="text-[9px] text-gold border border-gold/30 px-4 py-2 rounded-xl hover:bg-gold hover:text-black transition-all font-black uppercase tracking-widest">Console</button>
                    </template>
                    <button @click="logout()" class="text-[9px] text-red-500 border border-red-500/30 px-4 py-2 rounded-xl hover:bg-red-500 hover:text-white transition-all font-black uppercase tracking-widest">Disconnect</button>
                </div>
            </header>

            <template x-if="announcement">
                <div class="announcement-bar py-3 px-6 flex items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <i data-lucide="megaphone" class="text-gold animate-pulse" size="14"></i>
                        <p class="text-[10px] text-white font-bold tracking-widest uppercase italic" x-text="announcement.content"></p>
                    </div>
                    <template x-if="profile?.role === 'admin'">
                        <button @click="clearAnnouncement()" class="text-red-500 hover:text-white transition-all"><i data-lucide="x-circle" size="14"></i></button>
                    </template>
                </div>
            </template>

            <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
                <div class="w-full max-w-5xl glass-panel rounded-[2.5rem] h-[75vh] flex flex-col overflow-hidden shadow-2xl border-white/5" :class="profile?.role === 'admin' ? 'admin-border' : ''">
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-6">
                        <template x-if="hasMore"><button @click="loadMore()" class="w-full text-[7px] text-gold/40 hover:text-gold py-4 uppercase tracking-[0.5em]">Load_Earlier_History</button></template>
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.user_id === user?.id ? 'justify-end' : 'justify-start'" class="flex group">
                                <div :class="msg.user_id === user?.id ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-zinc-900 text-zinc-300 rounded-tl-none border border-white/5'" class="max-w-[80%] p-5 rounded-3xl shadow-xl relative">
                                    <template x-if="profile?.role === 'admin'"><button @click="deleteMsg(msg.id)" class="absolute -top-2 -left-2 bg-red-600 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="trash-2" size="12"></i></button></template>
                                    <template x-if="msg.image_url"><img :src="msg.image_url" class="mb-3 rounded-xl max-h-64 w-full object-cover"></template>
                                    <p class="text-xs font-medium tracking-wide" x-text="msg.text"></p>
                                    <div class="text-[7px] mt-2 opacity-40 uppercase font-black text-right" x-text="new Date(msg.created_at).toLocaleTimeString()"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                    
                    <div class="px-6 py-2 h-6">
                        <template x-if="typingUsers.length > 0"><div class="text-[8px] text-gold/60 italic animate-pulse uppercase tracking-widest"><span x-text="typingUsers.join(', ')"></span> IS DECRYPTING...</div></template>
                    </div>

                    <form @submit.prevent="sendMessage()" class="p-5 bg-black/60 border-t border-white/5 flex items-center gap-3">
                        <label class="cursor-pointer text-gold/50 hover:text-gold p-2"><i data-lucide="paperclip" size="22"></i><input type="file" class="hidden" @change="uploadImage($event)"></label>
                        <input x-model="newMessage" @input="handleTyping()" placeholder="INPUT TRANSMISSION..." class="flex-grow bg-zinc-900/50 p-4 rounded-2xl text-xs text-white outline-none border border-white/10 focus:border-gold/50 tracking-widest uppercase">
                        <button type="submit" :disabled="loading" class="bg-gold text-black px-10 py-4 rounded-2xl font-black text-[10px] uppercase italic transition-all flex items-center min-w-[140px] justify-center">
                            <span x-show="!loading">Transmit</span>
                            <div x-show="loading" class="flex gap-1"><span class="w-1 h-1 bg-black rounded-full animate-bounce"></span><span class="w-1 h-1 bg-black rounded-full animate-bounce [animation-delay:0.2s]"></span></div>
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <template x-if="adminView">
        <div class="fixed inset-0 z-[200] bg-black/95 backdrop-blur-2xl flex items-center justify-center p-4">
            <div class="max-w-4xl w-full h-[80vh] glass-panel rounded-[3rem] p-10 flex flex-col">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-gold text-sm font-black tracking-[0.6em] uppercase">National_Console</h3>
                    <button @click="adminView = false" class="text-white/40 hover:text-white uppercase text-[9px] font-black">Close</button>
                </div>
                
                <div class="mb-10 p-6 border border-gold/20 rounded-2xl bg-gold/5">
                    <label class="text-[9px] text-gold font-black uppercase mb-3 block">Broadcast_New_Announcement</label>
                    <div class="flex gap-4">
                        <input x-model="newAnnouncement" class="flex-grow bg-black/40 border border-white/10 rounded-xl p-4 text-xs text-white outline-none focus:border-gold" placeholder="Enter directive...">
                        <button @click="sendAnnouncement()" class="bg-gold text-black px-6 rounded-xl text-[9px] font-black uppercase italic">Broadcast</button>
                    </div>
                </div>

                <div class="flex-grow overflow-y-auto">
                    <table class="w-full text-left">
                        <thead class="text-[8px] text-gold/40 uppercase tracking-widest border-b border-white/5">
                            <tr><th class="pb-4">Alias</th><th class="pb-4">Role</th><th class="pb-4">Status</th></tr>
                        </thead>
                        <tbody class="text-xs text-white/80">
                            <template x-for="m in membersList" :key="m.id">
                                <tr class="border-b border-white/5">
                                    <td class="py-4 font-black italic" x-text="m.full_name"></td>
                                    <td class="py-4 uppercase font-black text-blue-400" x-text="m.role"></td>
                                    <td class="py-4" x-text="m.gate_two_complete ? 'SYNCED' : 'OFFLINE'"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <template x-if="authView">
        <div class="fixed inset-0 z-[100] bg-black/98 flex items-center justify-center p-4 backdrop-blur-xl">
            <div class="max-w-md w-full p-10 glass-panel rounded-[3rem] text-center shadow-[0_0_80px_rgba(212,175,55,0.1)] border-gold/20">
                <i :data-lucide="authView === 'set_passkey' ? 'fingerprint' : 'shield-alert'" class="mx-auto text-gold mb-8 animate-pulse" size="56"></i>
                <h2 class="text-white tracking-[0.4em] uppercase font-black mb-10 text-sm" x-text="authView.replace('_', ' ')"></h2>
                
                <form @submit.prevent="runAuthAction()" class="space-y-5">
                    <template x-if="authView !== 'set_passkey'">
                        <input type="email" x-model="email" placeholder="ACCESS_EMAIL" required class="w-full bg-zinc-900 p-5 rounded-2xl text-white text-[10px] border border-white/10 outline-none focus:border-gold/50 tracking-widest">
                    </template>
                    <input type="password" x-model="authView === 'set_passkey' ? passkey : password" placeholder="SECURITY_CODE" required class="w-full bg-zinc-900 p-5 rounded-2xl text-white text-[10px] border border-white/10 outline-none focus:border-gold/50 tracking-widest">
                    <button type="submit" :disabled="loading" :class="loading ? 'opacity-50' : 'hover:bg-white'" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase tracking-[0.4em] rounded-2xl transition-all">
                        <span x-show="!loading">Execute_Protocol</span>
                        <span x-show="loading" class="animate-pulse">Syncing...</span>
                    </button>
                </form>

                <template x-if="authView !== 'set_passkey'">
                    <div class="mt-10 flex justify-center gap-8 text-[9px] uppercase font-black tracking-widest opacity-30">
                        <button type="button" @click="authView = 'login'">Login</button>
                        <button type="button" @click="authView = 'register'">Register</button>
                    </div>
                </template>
            </div>
        </div>
    </template>

        <script>
        function app() {
            return {
                appState: 'landing', authView: 'login', user: null, profile: null, loading: false,
                email: '', password: '', passkey: '', newMessage: '', messages: [], 
                page: 0, pageSize: 20, hasMore: true, isTyping: false, typingUsers: [], 
                presenceChannel: null, profileModal: false, adminView: false, membersList: [],
                announcement: null, newAnnouncement: '',
                profileForm: { full_name: '', bio: '' }, supabase: null,

                async init() {
                    const SB_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
                    this.supabase = window.supabase.createClient(SB_URL, SB_KEY);
                    const { data: { session } } = await this.supabase.auth.getSession();
                    if (session) await this.handleAuthSuccess(session.user);
                    this.supabase.auth.onAuthStateChange(async (e, s) => { 
                        if (e === 'SIGNED_IN' && s) await this.handleAuthSuccess(s.user); 
                        if (e === 'SIGNED_OUT') location.reload();
                    });
                    lucide.createIcons();
                },

                async handleAuthSuccess(user) {
                    this.user = user;
                    let { data: p } = await this.supabase.from('members').select('*').eq('user_id', user.id).maybeSingle();
                    if (!p) {
                        const { data: newP } = await this.supabase.from('members').insert([{ user_id: user.id, full_name: user.email.split('@')[0], gate_two_complete: false }]).select().single();
                        p = newP;
                    }
                    this.profile = p;
                    if (p.gate_two_complete) {
                        this.authView = null; this.appState = 'grid';
                        this.fetchData(); this.subscribeToMessages(); this.subscribeToPresence(); this.fetchAnnouncements();
                    } else { this.authView = 'set_passkey'; }
                    this.$nextTick(() => lucide.createIcons());
                },

                async finalizeSecurity() {
                    this.loading = true;
                    if (this.email === 'director.mog@gmail.com' && this.passkey !== '@MOGProtocol2026') {
                        alert("Invalid Admin Passkey."); this.loading = false; return;
                    }
                    const { error } = await this.supabase.from('members').update({ gate_two_complete: true }).eq('user_id', this.user.id);
                    if (!error) { this.profile.gate_two_complete = true; this.handleAuthSuccess(this.user); }
                    this.loading = false;
                },

                async fetchData() {
                    const start = this.page * this.pageSize;
                    const { data } = await this.supabase.from('messages').select('*').order('created_at', { ascending: false }).range(start, start + this.pageSize - 1);
                    if (data) {
                        const newMsgs = data.reverse();
                        this.messages = [...newMsgs, ...this.messages];
                        this.hasMore = data.length === this.pageSize;
                        if (this.page === 0) this.scrollToBottom();
                    }
                },

                async fetchAnnouncements() {
                    const { data } = await this.supabase.from('announcements').select('*').order('created_at', { ascending: false }).limit(1).maybeSingle();
                    this.announcement = data;
                    this.supabase.channel('announcements-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, (p) => {
                        if (p.eventType === 'INSERT') this.announcement = p.new;
                        if (p.eventType === 'DELETE') this.announcement = null;
                    }).subscribe();
                },

                async sendAnnouncement() {
                    if (!this.newAnnouncement.trim()) return;
                    await this.supabase.from('announcements').insert([{ content: this.newAnnouncement.toUpperCase(), created_by: this.user.id }]);
                    this.newAnnouncement = '';
                },

                async clearAnnouncement() {
                    if (this.announcement) await this.supabase.from('announcements').delete().eq('id', this.announcement.id);
                },

                async deleteMsg(id) {
                    if (confirm("Purge transmission?")) await this.supabase.from('messages').delete().eq('id', id);
                },

                runAuthAction() {
                    if (this.authView === 'login') this.handleLogin();
                    else if (this.authView === 'register') this.handleRegister();
                    else if (this.authView === 'set_passkey') this.finalizeSecurity();
                },

                handleTyping() {
                    if (!this.isTyping && this.presenceChannel) {
                        this.isTyping = true;
                        this.presenceChannel.track({ user_id: this.user.id, username: this.profile?.full_name, is_typing: true });
                        setTimeout(() => {
                            this.isTyping = false;
                            this.presenceChannel.track({ user_id: this.user.id, username: this.profile?.full_name, is_typing: false });
                        }, 3000);
                    }
                },

                async sendMessage() { 
                    if (!this.newMessage.trim() || this.loading) return; 
                    this.loading = true;
                    await this.supabase.from('messages').insert([{ text: this.newMessage.toUpperCase(), user_id: this.user.id }]); 
                    this.newMessage = ''; this.loading = false;
                },

                subscribeToMessages() {
                    this.supabase.channel('hq').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, (p) => {
                        if (p.eventType === 'INSERT') { this.messages.push(p.new); this.scrollToBottom(); }
                        if (p.eventType === 'DELETE') { this.messages = this.messages.filter(m => m.id !== p.old.id); }
                    }).subscribe();
                },

                subscribeToPresence() {
                    this.presenceChannel = this.supabase.channel('online-users', { config: { presence: { key: this.user.id } } });
                    this.presenceChannel.on('presence', { event: 'sync' }, () => {
                        const state = this.presenceChannel.presenceState();
                        this.typingUsers = Object.values(state).flat().filter(u => u.is_typing && u.user_id !== this.user.id).map(u => u.username || 'Agent');
                    }).subscribe(async (s) => {
                        if (s === 'SUBSCRIBED') await this.presenceChannel.track({ user_id: this.user.id, username: this.profile?.full_name, is_typing: false });
                    });
                },

                async openAdmin() {
                    const { data } = await this.supabase.from('members').select('*');
                    this.membersList = data; this.adminView = true;
                },

                async handleLogin() { 
                    this.loading = true;
                    const { error } = await this.supabase.auth.signInWithPassword({ email: this.email, password: this.password }); 
                    if (error) { alert(error.message); this.loading = false; }
                },

                async handleRegister() { 
                    this.loading = true;
                    const { error } = await this.supabase.auth.signUp({ email: this.email, password: this.password }); 
                    if (error) { alert(error.message); this.loading = false; }
                    else { alert("Check email for uplink."); this.loading = false; }
                },

                logout() { this.supabase.auth.signOut(); },
                startUplink() { this.appState = 'grid'; this.$nextTick(() => { lucide.createIcons(); this.scrollToBottom(); }); },
                scrollToBottom() { this.$nextTick(() => { const el = document.getElementById('chat-stream'); if (el) el.scrollTop = el.scrollHeight; }); }
            }
        }
    </script>
</body>
</html>
