            color: rgba(255, 255, 255, 0.3);

        /* Auth Divider */
        .auth-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;

        .auth-divider::before,

            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);

            background: rgba(17, 17, 17, 0.6);

    <!-- SECURE AUTHENTICATION MODULE -->
    <script type="module">
        // Configuration - REPLACE WITH YOUR SUPABASE CREDENTIALS
        const CONFIG = {
            SUPABASE_URL: 'YOUR_SUPABASE_URL',
            SUPABASE_ANON_KEY: 'YOUR_SUPABASE_ANON_KEY',
            // Hashed credentials (SHA-256 of "director:COMMAND-01" and "operative:GROOVE-99")
            // Generate these using the hashCredential function in development
            ALLOWED_USERS: {
                'director': '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', // Replace with actual hash
                'operative': '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8'  // Replace with actual hash
            }
        };

        // Web Crypto API for secure hashing
        async function hashCredential(credential) {
            const encoder = new TextEncoder();
            const data = encoder.encode(credential);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Initialize Supabase
        let supabaseClient = null;
        if (CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.includes('YOUR_')) {
            supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        }

        // Alpine.js Data Function
        window.nccMasterEngine = function() {
            return {
                view: 'auth',
                userRole: '',
                user: null,
                authForm: { id: '', pass: '' },
                authError: '',
                isLoading: false,

                async init() {
                    // Check existing session
                    const savedRole = localStorage.getItem('userRole');
                    const savedUser = localStorage.getItem('userData');
                    
                    if (savedRole && savedUser) {
                        try {
                            this.user = JSON.parse(savedUser);
                            this.userRole = savedRole;
                            this.view = 'grid';
                        } catch (e) {
                            this.clearSession();
                        }
                    }
                    
                    // Initialize icons
                    this.$nextTick(() => {
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    });

                    // Check for OAuth callback
                    this.handleOAuthCallback();
                },

                async attemptAccess() {
                    this.authError = '';

                if (!this.authForm.id || !this.authForm.pass) {
                        this.authError = 'Credentials Required';
                        return;
                    }

                    this.isLoading = true;

                    try {
                        const role = this.authForm.id.toLowerCase().trim();
                        const credential = `${role}:${this.authForm.pass}`;
                        const hashed = await hashCredential(credential);
                        
                        // Secure comparison - in production, validate against Supabase Auth
                        if (supabaseClient) {
                            // Use Supabase Auth
                            const { data, error } = await supabaseClient.auth.signInWithPassword({
                                email: `${role}@ministryofgroove.local`,
                                password: this.authForm.pass
                            });
                            
                            if (error) throw error;
                            this.loginSuccess(role, data.user);
                        } else {
                            // Fallback to hashed comparison (development only)
                            const expectedHash = CONFIG.ALLOWED_USERS[role];
                            if (expectedHash && hashed === expectedHash) {
                                this.loginSuccess(role, { id: role, role: role });
                            } else {
                                throw new Error('Invalid Credentials');
                            }
                        }
                    } catch (error) {
                        this.authError = 'Access Denied: Invalid Credentials';
                        // Log security event
                        console.warn(`Failed login attempt: ${this.authForm.id} at ${new Date().toISOString()}`);
                    } finally {
                        this.isLoading = false;
                    }
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    this.authError = '';
                    
                    try {
                        if (!supabaseClient) {
                            throw new Error('Authentication service unavailable');
                        }

                        const { data, error } = await supabaseClient.auth.signInWithOAuth({
                            provider: 'google',
                            options: {
                                redirectTo: window.location.origin
                            }
                        });

                        if (error) throw error;
                        // OAuth redirects, so we don't need to handle success here
                    } catch (error) {
                        this.authError = 'Biometric Uplink Failed';
                        this.isLoading = false;
                    }
                },

                async loginWithApple() {
                    this.isLoading = true;
                    this.authError = '';
                    try {
                        if (!supabaseClient) {
                            throw new Error('Authentication service unavailable');
                        }

                        const { data, error } = await supabaseClient.auth.signInWithOAuth({
                            provider: 'apple',
                            options: {
                                redirectTo: window.location.origin,
                                scopes: 'email name'
                            }
                        });

                        if (error) throw error;
                        // OAuth redirects, so we don't need to handle success here
                    } catch (error) {
                        this.authError = 'Apple Sign-In Failed';
                        this.isLoading = false;
                        console.error('Apple Sign-In error:', error);
                    }
                },

                handleOAuthCallback() {
                    // Handle OAuth redirect callback
                    const hash = window.location.hash;
                    if (hash && hash.includes('access_token')) {
                        // Supabase handles this automatically, but we can check session
                        this.checkSession();
                    }
                },

                async checkSession() {
                    if (!supabaseClient) return;
                    
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session?.user) {
                        const role = session.user.user_metadata?.role || 'operative';
                        this.loginSuccess(role, session.user);
                    }
                },

                loginSuccess(role, userData) {
                    this.userRole = role;
                    this.user = userData;
                    localStorage.setItem('userRole', role);
                    localStorage.setItem('userData', JSON.stringify(userData));
                    this.view = 'grid';
                    this.authForm = { id: '', pass: '' };
                    
                    this.$nextTick(() => {
                        if (typeof lucide !== 'undefined') lucide.createIcons();
                    });
                },

                terminateSession() {
                    if (supabaseClient) {
                        supabaseClient.auth.signOut();
                    }
                    this.clearSession();
                },

                clearSession() {
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('userData');
                    this.userRole = '';
                    this.user = null;
                    this.view = 'auth';
                    this.$nextTick(() => {
                        if (typeof lucide !== 'undefined') 
    lucide.createIcons();
                    });
                }
            };
        };

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then(() => console.log('MOG Protocol Active'))
                .catch(err => console.log('Uplink Failed:', err));
        }
    </script>
</body>
</html>
