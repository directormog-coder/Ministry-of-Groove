<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v2.0</title>
    
    <link href="./dist/output.css" rel="stylesheet">
    
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="text-gold">

    <div class="fixed top-0 w-full z-[100] glass py-2 border-b border-gold/10 overflow-hidden">
        <div class="ticker-move text-[9px] font-black uppercase tracking-widest text-white">
            <template x-for="news in newsItems" :key="news.id">
                <span class="mx-10" x-text="`${news.title}: ${news.message} — [${new Date(news.created_at).toLocaleTimeString()}]` "></span>
            </template>
            <template x-if="newsItems.length === 0">
                <span class="mx-10 text-gold/40">SYSTEM_IDLE: SCANNING FOR DIRECTORATE SIGNAL...</span>
            </template>
        </div>
    </div>

    <template x-if="hasDM">
        <div class="fixed bottom-32 left-6 right-6 glass p-4 rounded-2xl border-gold animate-bounce z-[150] flex items-center gap-4 shadow-2xl ring-1 ring-gold/50">
            <i data-lucide="mail" class="text-gold animate-pulse"></i>
            <div class="flex-grow">
                <p class="text-[8px] font-black uppercase text-white">Direct Instruction Received</p>
                <p class="text-[10px] italic text-gold/80" x-text="latestDM"></p>
            </div>
            <button @click="hasDM = false" class="text-[10px] font-black">X</button>
        </div>
    </template>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-10 text-center">
            <img src="logo.png" class="h-32 w-32 mb-8 rounded-full border border-gold/20 shadow-lg grayscale hover:grayscale-0 transition-all duration-700">
            <div class="w-full max-w-xs space-y-6">
                <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                <input x-model="handleInput" @keyup.enter="initializeUser()" placeholder="OPERATIVE_HANDLE..." class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white text-center outline-none focus:border-gold terminal-font">
                <button @click="initializeUser()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full btn-active">Initialize Access</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen pt-14 pb-12 space-y-6">
            <header class="p-5 glass flex justify-between items-center mx-4 rounded-2xl sticky top-12 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full border border-gold/20">
                    <div>
                        <p class="text-[11px] font-black uppercase text-white tracking-widest leading-none">Ministry of Groove</p>
                        <p class="text-[5px] text-zinc-500 uppercase font-bold mt-1 terminal-font" x-text="sastTime"></p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button @click="window.location.href='dossier.html'" class="p-2 glass rounded-lg gold-glow"><i data-lucide="user" size="14"></i></button>
                    <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg"><i data-lucide="power" size="14"></i></button>
                </div>
            </header>

            <main class="px-4 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <template x-for="tab in ['chat', 'map', 'audio', 'charts']">
                        <div @click="subView = tab" :class="subView === tab ? 'bg-white/10 border-white/30 scale-[1.02]' : 'border-gold/10 opacity-60'" class="glass p-5 rounded-[2rem] text-center cursor-pointer border transition-all duration-300">
                            <i :data-lucide="tab === 'chat' ? 'message-square' : tab === 'map' ? 'map-pin' : tab === 'audio' ? 'music' : 'trending-up'" class="mx-auto mb-2" :class="subView === tab ? 'text-gold' : 'text-zinc-500'"></i>
                            <span class="text-[8px] font-black uppercase text-white" x-text="tab"></span>
                        </div>
                    </template>
                </div>

                <div class="glass rounded-[3rem] min-h-[55vh] flex flex-col overflow-hidden">
                    <div x-show="subView === 'chat'" class="flex-grow flex flex-col p-4 h-[55vh]">
                        <div id="chat-stream" class="flex-grow overflow-y-auto space-y-4 p-2">
                            <template x-if="isLoading"><div class="skeleton h-20 w-full rounded-2xl"></div></template>
                            <template x-for="msg in messages" :key="msg.id">
                                <div :class="msg.username === username ? 'ml-auto items-end' : 'items-start'" class="flex flex-col max-w-[85%]">
                                    <span class="text-[6px] text-zinc-500 uppercase px-2 mb-1" x-text="msg.username"></span>
                                    <div :class="msg.username === 'DIRECTORATE' ? 'bg-gold/20 text-gold border-gold/30' : 'bg-white/5 text-white border-white/10'" class="p-4 rounded-2xl text-[12px] border" x-text="msg.content"></div>
                                </div>
                            </template>
                        </div>
                        <form @submit.prevent="send()" class="mt-4 flex gap-2">
                            <input x-model="msgInput" :disabled="isTransmitting" placeholder="TRANSMIT_SIGNAL..." class="flex-grow bg-white/5 p-4 rounded-2xl text-[12px] text-white outline-none focus:ring-1 ring-gold/30 terminal-font">
                            <button type="submit" class="bg-gold text-black px-6 rounded-2xl btn-active"><i data-lucide="send" size="18"></i></button>
                        </form>
                    </div>
                    
                    <div x-show="subView === 'audio'" class="h-full">
                        <iframe :src="streamUrl" width="100%" height="450" frameborder="0" allow="encrypted-media" class="grayscale hover:grayscale-0 transition-all"></iframe>
                    </div>

                    <div x-show="subView === 'map'" class="p-10 space-y-6">
                        <template x-for="stat in provinceStats" :key="stat.province_name">
                            <div class="space-y-2">
                                <div class="flex justify-between text-[9px] font-black uppercase text-white"><span x-text="stat.province_name"></span><span x-text="stat.operative_count"></span></div>
                                <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden"><div class="h-full bg-gold" :style="`width: ${Math.min(stat.operative_count * 10, 100)}%` "></div></div>
                            </div>
                        </template>
                    </div>

                    <div x-show="subView === 'charts'" class="p-6 space-y-4">
                        <template x-for="(track, index) in tracks" :key="track.id">
                            <div class="flex items-center justify-between bg-white/5 p-5 rounded-3xl border border-white/5">
                                <div class="flex items-center gap-6">
                                    <span class="text-2xl font-black italic opacity-20 terminal-font" x-text="index + 1"></span>
                                    <div><p class="text-[11px] font-black text-white uppercase" x-text="track.title"></p><p class="text-[8px] text-gold/50" x-text="track.artist"></p></div>
                                </div>
                                <button @click="vote(track.id)" class="p-3 bg-gold/10 text-gold rounded-full"><i data-lucide="arrow-big-up" size="18"></i></button>
                            </div>
                        </template>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        function ministry() {
            return {
                view: 'auth', subView: 'chat', username: '', province: 'MPUMALANGA',
                messages: [], msgInput: '', handleInput: '', 
                provinceStats: [], tracks: [], newsItems: [], streamUrl: '',
                sastTime: '', hasDM: false, latestDM: '',
                isLoading: true, isTransmitting: false,

                async init() {
                    const saved = localStorage.getItem('mog_handle');
                    if(saved) { 
                        this.username = saved; 
                        this.view = 'grid';
                        this.updateTime();
                        await this.syncAll();
                        this.subscribe();
                        setInterval(() => { this.updatePresence(); this.syncAll(); }, 30000);
                        setInterval(() => this.updateTime(), 1000);
                    }
                    this.$nextTick(() => { lucide.createIcons(); this.isLoading = false; });
                },

                updateTime() {
                    this.sastTime = new Date().toLocaleTimeString('en-ZA', { timeZone: 'Africa/Johannesburg', hour12: false });
                },

                scrollToBottom() {
                    const el = document.getElementById('chat-stream');
                    if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                },

                async syncAll() {
                    try {
                        const [msg, stats, trks, news, strm] = await Promise.all([
                            mog_sb.from('messages').select('*').order('created_at', { ascending: true }).limit(50),
                            mog_sb.rpc('get_province_stats'),
                            mog_sb.from('chart_tracks').select('*').order('votes', { ascending: false }),
                            mog_sb.from('broadcasts').select('*').order('created_at', { ascending: false }).limit(5),
                            mog_sb.from('stream_config').select('*').single()
                        ]);
                        this.messages = msg.data || [];
                        this.provinceStats = stats.data || [];
                        this.tracks = trks.data || [];
                        this.newsItems = news.data || [];
                        this.streamUrl = strm.data?.playlist_url;
                        this.$nextTick(() => this.scrollToBottom());
                    } catch (e) { console.error("Grid Sync Failure."); }
                },

                subscribe() {
                    mog_sb.channel('global')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                            this.messages.push(p.new);
                            this.$nextTick(() => this.scrollToBottom());
                        })
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `recipient=eq.${this.username}` }, p => {
                            this.hasDM = true; this.latestDM = p.new.content;
                        })
                        .subscribe();
                },

                async send() {
                    if(!this.msgInput.trim() || this.isTransmitting) return;
                    this.isTransmitting = true;
                    const { error } = await mog_sb.from('messages').insert([{ content: this.msgInput.toUpperCase(), username: this.username }]);
                    if(!error) { this.msgInput = ''; this.$nextTick(() => this.scrollToBottom()); }
                    this.isTransmitting = false;
                },

                async vote(id) { await mog_sb.rpc('vote_track', { track_id: id }); this.syncAll(); },

                async updatePresence() {
                    await mog_sb.from('presence').upsert({ username: this.username, last_seen: new Date().toISOString(), province: this.province });
                },

                initializeUser() {
                    if(!this.handleInput.trim()) return;
                    localStorage.setItem('mog_handle', this.handleInput.toUpperCase());
                    location.reload();
                },

                logout() { localStorage.clear(); location.reload(); }
            }
        }
    </script>
</body>
                            </html>
