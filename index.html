<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>M.O.G. | DIGITAL HQ</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase-client.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#D4AF37', bright: '#F0C040', dark: '#8B6914' },
                        surface: '#050505',
                        panel: '#0D0D0D',
                    },
                    fontFamily: {
                        orbit: ['Orbitron', 'sans-serif'],
                        raj: ['Rajdhani', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style type="text/css">
        /* --- HARDWARE RENDERER --- */
        @layer base {
            :root {
                --gold: #D4AF37;
                --gold-glow: rgba(212, 175, 55, 0.3);
                --red: #dc2626;
            }
            [x-cloak] { display: none !important; }
            body { background-color: #000; color: #E8E0CC; -webkit-font-smoothing: antialiased; }
        }

        /* --- AMBIENT OVERLAYS --- */
        .bg-grid {
            position: fixed; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 45px 45px;
        }

        .bg-vignette {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.95) 100%);
        }

        /* --- TILE ARCHITECTURE (HQ LAYOUT) --- */
        .tile-hq {
            background: rgba(13, 13, 13, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .tile-hq:hover {
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* --- HUB FEATURES --- */
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .load-progress {
            position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 9999;
            background: linear-gradient(90deg, #8B6914, #D4AF37, #00d4aa);
            transform-origin: left; transform: scaleX(0); transition: transform 0.4s ease;
        }
        .load-progress.active { animation: loading 2s infinite alternate; }
        @keyframes loading { 0% { transform: scaleX(0.1); } 100% { transform: scaleX(0.8); } }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>

    <script>
        /**
         * HUB CONTROLLER: CORE LOGIC INTEGRATION
         * Merging 831-line Hub functionality into HQ Layout
         */
        function mogApp() {
          return {
            // --- STATE MANAGEMENT ---
            view: 'loading',
            isLoading: false,
            isOnline: navigator.onLine,
            showModal: false,
            activeTab: 'overview',
            currentUser: null,
            operativeId: 'ID:OFFLINE',
            lockdownActive: false,
            
            // --- PROFILE STRUCTURE ---
            profile: {
                username: 'RECRUIT',
                codename: '---',
                rank: 'INITIATE',
                department: 'UNASSIGNED',
                bio: '',
                avatar_url: null,
                stats: { missions: 0, loyalty: 100, groove: 50 }
            },

            // --- DATA ARRAYS ---
            tickerMessages: ["UPLINK ACTIVE...", "SCANNING FREQUENCIES...", "MINISTRY SECURE"],
            mediaAssets: [],
            recentActivity: [],

            // --- INITIALIZATION SEQUENCE ---
            async init() {
                window.addEventListener('online', () => { this.isOnline = true; this.toast("Back Online", "success"); });
                window.addEventListener('offline', () => { this.isOnline = false; this.toast("Connection Lost", "error"); });

                // Wait for Supabase Uplink
                let t = 0; while (typeof sb === 'undefined' && t < 30) { await new Promise(r => setTimeout(r, 100)); t++; }
                if (typeof sb === 'undefined') return;

                try {
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session) { window.location.href = '/login.html'; return; }
                    this.currentUser = session.user;
                    this.operativeId = `ID:${this.currentUser.id.slice(0, 5).toUpperCase()}`;
                    
                    await this.syncData();
                    await this.checkLockdown();
                    this.view = 'hub';
                    
                    this.$nextTick(() => { if (window.lucide) lucide.createIcons(); });
                } catch (err) { this.toast("Init Failed", "error"); }
            },

            async syncData() {
                this.isLoading = true;
                const bar = document.getElementById('topProgress');
                if(bar) bar.classList.add('active');

                await Promise.all([this.loadProfile(), this.loadActivity(), this.loadMedia()]);

                if(bar) { bar.classList.remove('active'); bar.style.transform = 'scaleX(1)'; setTimeout(() => bar.style.opacity = '0', 600); }
                this.isLoading = false;
            },

            async loadProfile() {
                const { data } = await sb.from('profiles').select('*').eq('id', this.currentUser.id).single();
                if (data) this.profile = { ...this.profile, ...data };
            },

            async loadActivity() {
                const { data } = await sb.from('activity_log').select('*').order('created_at', { ascending: false }).limit(5);
                this.recentActivity = data || [];
            },

            async loadMedia() {
                // Placeholder Media Assets (Operative Hub Feature)
                this.mediaAssets = [
                    { id: 1, title: 'Sunset Sessions', type: 'LIVE', icon: 'microphone-lines' },
                    { id: 2, title: 'Archive 092', type: 'VAULT', icon: 'vault' }
                ];
            },

            async checkLockdown() {
                const { data } = await sb.from('system_settings').select('value').eq('key', 'protocolZero').single();
                if (data) {
                    const p = JSON.parse(data.value);
                    this.lockdownActive = p.active === true;
                }
            },

            toast(msg, type = 'info') {
                const tc = document.getElementById('toastRack');
                const el = document.createElement('div');
                el.className = `p-4 mb-2 rounded-xl border flex items-center gap-3 bg-black/90 backdrop-blur text-[10px] font-orbit uppercase tracking-widest ${type === 'error' ? 'border-red-600 text-red-500' : 'border-gold text-gold'}`;
                el.innerHTML = `<div class="w-2 h-2 rounded-full bg-current status-pulse"></div> ${msg}`;
                tc.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            },

            async logout() {
                await sb.auth.signOut();
                localStorage.clear();
                window.location.href = '/login.html';
            }
          };
        }
    </script>
</head>
<body x-data="mogApp()" x-init="init()" x-cloak class="font-raj min-h-screen">

    <div id="topProgress" class="load-progress"></div>
    <div class="bg-grid"></div>
    <div class="bg-vignette"></div>
    <div id="toastRack" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[1000] w-full max-w-xs px-4"></div>

    <div x-show="lockdownActive" class="fixed inset-0 z-[10000] bg-black/98 flex flex-col items-center justify-center text-center p-8">
        <div class="w-24 h-24 border-2 border-red-600 rounded-full flex items-center justify-center mb-6 status-pulse">
            <i class="fa-solid fa-lock text-4xl text-red-600"></i>
        </div>
        <h2 class="font-orbit text-3xl font-black text-red-600 mb-2">SYSTEM LOCKDOWN</h2>
        <p class="font-mono text-xs text-gray-500 tracking-widest uppercase">Directorate Protocol Zero in Effect</p>
        <button @click="location.reload()" class="mt-8 border border-red-600 px-6 py-2 font-orbit text-[10px] text-red-600 uppercase">Re-verify Identity</button>
    </div>

  
    <template x-if="view === 'loading'">
        <div class="fixed inset-0 z-[9000] bg-black flex flex-col items-center justify-center">
            <img src="logo.png" class="w-32 h-32 animate-pulse mb-6" alt="Loading">
            <p class="font-orbit text-[10px] text-gold tracking-[0.5em] uppercase">Synchronizing Digital HQ...</p>
        </div>
    </template>

    <template x-if="view === 'hub'">
        <div class="fade-in">
            <div class="fixed top-0 left-0 right-0 z-50 h-8 bg-red-900/20 backdrop-blur border-b border-white/5 flex items-center overflow-hidden">
                <div class="px-4 bg-red-600 text-white font-orbit text-[9px] font-black h-full flex items-center italic">LIVE</div>
                <div class="flex whitespace-nowrap animate-[ticker_30s_linear_infinite]" style="animation: ticker 25s linear infinite;">
                    <template x-for="msg in tickerMessages" :key="msg">
                        <span class="font-mono text-[10px] text-white/80 px-12 uppercase flex items-center gap-2">
                            <span class="text-gold">◈</span> <span x-text="msg"></span>
                        </span>
                    </template>
                </div>
            </div>
            <style> @keyframes ticker { from { transform: translateX(100vw); } to { transform: translateX(-100%); } } </style>

            <header class="pt-20 pb-12 px-6 flex flex-col items-center relative">
                <div @click="showModal = true" class="absolute top-12 right-6 flex items-center gap-3 cursor-pointer group">
                    <div class="text-right hidden sm:block">
                        <p class="font-orbit text-[10px] font-bold text-white uppercase" x-text="profile.username"></p>
                        <p class="font-mono text-[8px] text-gold/60 uppercase" x-text="profile.rank"></p>
                    </div>
                    <div class="w-10 h-10 rounded-full border border-gold/30 p-0.5 overflow-hidden group-hover:border-gold transition-colors">
                        <img :src="profile.avatar_url || 'logo.png'" class="w-full h-full object-cover rounded-full" alt="Me">
                    </div>
                </div>

                <div class="relative group cursor-pointer mb-6">
                    <div class="absolute inset-0 bg-gold blur-3xl opacity-10"></div>
                    <img src="logo.png" alt="MOG Logo" class="w-32 h-32 md:w-44 md:h-44 relative z-10 transition-transform duration-500 group-hover:rotate-6">
                </div>
                
                <div class="text-center space-y-2">
                    <h1 class="font-orbit text-3xl md:text-4xl font-black tracking-[0.25em] uppercase text-white">Ministry of Groove</h1>
                    <p class="font-mono text-[10px] text-gold/60 tracking-widest uppercase">EST. 2026 | OPERATIVE UPLINK: <span x-text="operativeId"></span></p>
                </div>
            </header>

            <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6">
                
                <div class="md:col-span-3 md:row-span-2 tile-hq rounded-3xl p-8 flex flex-col justify-end min-h-[350px] group border-l-4 border-l-red-600">
                    <div class="absolute top-6 left-6 flex items-center gap-3">
                        <div class="bg-red-600 text-white font-orbit text-[10px] font-black px-3 py-1.5 rounded-sm flex items-center gap-2 status-pulse">
                            <span class="w-1.5 h-1.5 bg-white rounded-full"></span> LIVE BROADCAST
                        </div>
                        <span class="font-mono text-[10px] text-gray-500">SECTOR 7G UPLINK</span>
                    </div>

                    <div class="space-y-4">
                        <h2 class="font-orbit text-4xl md:text-5xl font-black italic uppercase text-white leading-tight">MOG LIVE: <br> <span class="text-gold">SUNSET SESSIONS</span></h2>
                        <div class="flex items-center gap-6">
                            <p class="text-gray-400 font-medium max-w-sm">Synchronizing the global ministry. Deeper cuts and exclusive sets.</p>
                            <button class="w-14 h-14 rounded-full bg-gold flex items-center justify-center text-black hover:bg-gold-bright transition-all shadow-[0_0_20px_rgba(212,175,55,0.4)]">
                                <i class="fa-solid fa-play text-xl ml-1"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="tile-hq rounded-3xl p-6 flex flex-col items-center justify-center text-center group cursor-pointer aspect-square">
                    <div class="w-16 h-16 rounded-2xl bg-gold/10 flex items-center justify-center mb-4 group-hover:bg-gold transition-all">
                        <i class="fa-solid fa-ticket text-3xl text-gold group-hover:text-black"></i>
                    </div>
                    <h3 class="font-orbit text-sm font-bold uppercase text-white tracking-widest">The Ticket Box</h3>
                    <p class="font-mono text-[9px] text-gray-500 mt-2 uppercase">Physical Access</p>
                </div>

                <div class="tile-hq rounded-3xl p-6 flex flex-col items-center justify-center text-center group cursor-pointer aspect-square">
                    <div class="w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center mb-4 group-hover:bg-white transition-all">
                        <i class="fa-solid fa-shirt text-3xl text-gray-500 group-hover:text-black"></i>
                    </div>
                    <h3 class="font-orbit text-sm font-bold uppercase text-white tracking-widest">The Boutique</h3>
                    <p class="font-mono text-[9px] text-gray-500 mt-2 uppercase">Lifestyle Gear</p>
                </div>

                <div class="tile-hq rounded-3xl p-7 flex flex-col justify-between min-h-[220px]">
                    <div class="flex justify-between items-start">
                        <i class="fa-solid fa-microphone-lines text-2xl text-gold"></i>
                        <span class="font-mono text-[9px] bg-white/10 px-2 py-1 rounded">TRANS-092</span>
                    </div>
                    <div>
                        <h3 class="font-orbit text-lg font-black text-white uppercase italic">Groove Podcast</h3>
                        <p class="text-sm text-gray-400 mt-1">Talk & Deep Sets.</p>
                    </div>
                </div>

                <div class="tile-hq rounded-3xl p-7 flex flex-col justify-between min-h-[220px]">
                    <i class="fa-solid fa-vault text-2xl text-gold"></i>
                    <div>
                        <h3 class="font-orbit text-lg font-black text-white uppercase italic">The Vault</h3>
                        <p class="text-sm text-gray-400 mt-1">Legendary Past Sets.</p>
                    </div>
                </div>

                <div class="tile-hq rounded-3xl p-6 flex items-center gap-5 md:col-span-1">
                    <i class="fa-solid fa-qrcode text-3xl text-gold"></i>
                    <div>
                        <h3 class="font-orbit text-xs font-black text-white uppercase">My Passes</h3>
                        <p class="font-mono text-[9px] text-gray-500 mt-1 uppercase">Instant Entry</p>
                    </div>
                </div>

                <div class="tile-hq rounded-3xl p-6 flex items-center gap-5 md:col-span-2">
                    <i class="fa-solid fa-comments text-3xl text-gold"></i>
                    <div>
                        <h3 class="font-orbit text-xs font-black text-white uppercase">The Shoutbox</h3>
                        <p class="font-mono text-[9px] text-gray-500 mt-1 uppercase">Connect with Global Ministry</p>
                    </div>
                </div>

              
            </main>

            <section class="max-w-6xl mx-auto px-6 mt-12 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-1 tile-hq rounded-3xl p-6">
                    <h3 class="font-orbit text-xs font-black text-gold uppercase mb-6 flex items-center gap-2">
                        <i data-lucide="activity" size="14"></i> Transmission Logs
                    </h3>
                    <div class="space-y-4">
                        <template x-for="log in recentActivity" :key="log.id">
                            <div class="border-l border-gold/20 pl-4 py-1">
                                <p class="text-[11px] text-white" x-text="log.description"></p>
                                <p class="font-mono text-[8px] text-gray-600 mt-1" x-text="new Date(log.created_at).toLocaleTimeString()"></p>
                            </div>
                        </template>
                        <template x-if="!recentActivity.length">
                            <p class="font-mono text-[9px] text-gray-700 italic">Scanning for new transmissions...</p>
                        </template>
                    </div>
                </div>

                <div class="md:col-span-2 tile-hq rounded-3xl p-6 flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-4">
                        <p class="font-orbit text-[10px] text-gold font-bold tracking-widest uppercase">Operative Authority Status</p>
                        <span class="font-mono text-[10px] text-teal">ALPHA VERIFIED</span>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between font-mono text-[9px] text-gray-500 mb-1"><span>Loyalty</span><span x-text="profile.stats.loyalty + '%'"></span></div>
                            <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full bg-gold transition-all" :style="'width:' + profile.stats.loyalty + '%'"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between font-mono text-[9px] text-gray-500 mb-1"><span>Groove Factor</span><span x-text="profile.stats.groove + '%'"></span></div>
                            <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full bg-teal transition-all" :style="'width:' + profile.stats.groove + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <footer class="mt-24 px-6 max-w-6xl mx-auto pb-24">
                <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-white/10 to-transparent mb-12"></div>
                <div class="flex flex-col md:flex-row items-center justify-between gap-8">
                    <div class="text-center md:text-left">
                        <p class="font-orbit text-[10px] text-gold font-bold tracking-[0.4em] uppercase">Ministry of Groove // Emalahleni Uplink II</p>
                        <p class="font-mono text-[9px] text-gray-600 uppercase tracking-widest">Decrypting the Culture. Synchronizing the Grid.</p>
                    </div>
                    <div class="flex gap-6">
                        <a href="#" class="text-gray-500 hover:text-gold transition-colors"><i class="fa-brands fa-instagram text-xl"></i></a>
                        <a href="#" class="text-gray-500 hover:text-gold transition-colors"><i class="fa-brands fa-tiktok text-xl"></i></a>
                        <a href="#" class="text-gray-500 hover:text-gold transition-colors"><i class="fa-brands fa-youtube text-xl"></i></a>
                    </div>
                </div>
            </footer>
        </div>
    </template>

    <div x-show="showModal" class="fixed inset-0 z-[2000] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/95 backdrop-blur-sm" x-transition>
        <div class="bg-panel w-full max-w-lg rounded-t-3xl sm:rounded-3xl border border-gold/20 overflow-hidden" @click.away="showModal = false">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h2 class="font-orbit text-gold font-black tracking-widest text-sm">OPERATIVE DOSSIER</h2>
                <button @click="showModal = false" class="text-gray-500 hover:text-white"><i data-lucide="x-circle"></i></button>
            </div>
            <div class="p-8 space-y-6">
                <div>
                    <label class="font-orbit text-[9px] text-gray-500 uppercase block mb-2 tracking-widest">Identifier</label>
                    <input type="text" x-model="profile.username" class="w-full bg-black border border-white/10 rounded-xl p-4 text-white font-mono focus:border-gold outline-none">
                </div>
                <div>
                    <label class="font-orbit text-[9px] text-gray-500 uppercase block mb-2 tracking-widest">Sector Background</label>
                    <textarea x-model="profile.bio" rows="4" class="w-full bg-black border border-white/10 rounded-xl p-4 text-white text-sm focus:border-gold outline-none"></textarea>
                </div>
                <div class="flex gap-4">
                    <button @click="showModal = false" class="flex-1 py-4 font-orbit text-[10px] border border-white/10 rounded-xl uppercase tracking-widest">Abort</button>
                    <button @click="logout()" class="flex-1 py-4 font-orbit text-[10px] bg-red-900/20 border border-red-600/50 text-red-500 rounded-xl uppercase tracking-widest">Sign Out</button>
                </div>
            </div>
        </div>
    </div>

    <script> document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); }); </script>

    <div style="display:none" id="mog-meta-layer">
        <p>BUILD_VERSION: 5.0.1</p>
        <p>LOGS_ENABLED: TRUE</p>
        <p>REALTIME_SYNC: ACTIVE</p>
    </div>
</body>
</html>
