<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v3.0</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid { background-image: radial-gradient(circle, #D4AF37 1px, transparent 1px); background-size: 30px 30px; }
        .glass-strong { background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(30px); border: 1px solid rgba(212,175,55,0.1); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .circuit-vignette { position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.95) 100%); pointer-events: none; z-index: 5; }
        .loader { width: 30px; height: 30px; border: 3px solid #D4AF37; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tile-animate { animation: tilePop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes tilePop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
        .audio-bar { width: 3px; background: #D4AF37; animation: audio-bounce 1s infinite ease-in-out; }
        @keyframes audio-bounce { 0%, 100% { height: 20%; } 50% { height: 100%; } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function ministry() {
            return {
                // System State
                view: 'gate', authMode: 'login', username: '', isDirector: false,
                emailInput: '', passwordInput: '', handleInput: '', confirmPassword: '',
                isLoading: false, errorMsg: '', subView: 'grid',
                
                // Data Streams
                messages: [], msgInput: '', activeBroadcast: null, 
                operatives: [], currentTime: '', sessionStart: null, sessionDuration: '00:00',
                
                // Feature State
                nowPlaying: null, isPlaying: false, showVoiceRecorder: false, isRecording: false,

                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (session) { 
                        this.setupUser(session.user); 
                    } else { 
                        this.view = 'auth'; 
                    }
                    
                    setInterval(() => { this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); }, 1000);
                    this.subscribeToBroadcasts();
                    this.loadSocialHub();
                },

                setupUser(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid'; 
                    this.sessionStart = Date.now();
                    this.loadMessages();
                    this.subscribeToMessages();
                    setInterval(() => {
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    await sb.auth.signInWithOAuth({ 
                        provider: 'google', 
                        options: { redirectTo: window.location.origin + '/index.html' } 
                    });
                },

                async loginUser() {
                    this.isLoading = true; this.errorMsg = '';
                    const { data, error } = await sb.auth.signInWithPassword({ email: this.emailInput.trim(), password: this.passwordInput });
                    if (error) { this.errorMsg = "INVALID CREDENTIALS"; this.isLoading = false; }
                    else { this.setupUser(data.user); }
                },

                async registerUser() {
                    if (this.passwordInput !== this.confirmPassword) { this.errorMsg = 'KEY MISMATCH'; return; }
                    this.isLoading = true;
                    const { error } = await sb.auth.signUp({ 
                        email: this.emailInput.trim(), password: this.passwordInput, 
                        options: { data: { handle: this.handleInput.toUpperCase() } } 
                    });
                    if (error) { this.errorMsg = error.message.toUpperCase(); this.isLoading = false; }
                    else { this.authMode = 'login'; this.errorMsg = 'ENROLLMENT SUCCESS. LOGIN.'; this.isLoading = false; }
                },

                async loadMessages() {
                    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
                    if (data) this.messages = data;
                },

                subscribeToMessages() {
                    sb.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.$nextTick(() => { if(this.$refs.chatContainer) this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight; });
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    await sb.from('messages').insert({ username: this.username, content: this.msgInput });
                    this.msgInput = '';
                },

                async loadSocialHub() {
                    const { data } = await sb.from('profiles').select('*').limit(10);
                    if (data) this.operatives = data;
                },

                subscribeToBroadcasts() {
                    sb.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                        this.activeBroadcast = payload.new.content;
                        setTimeout(() => { this.activeBroadcast = null; }, 15000);
                    }).subscribe();
                },

                logout() { sb.auth.signOut(); window.location.reload(); }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-gold/30">

    <div class="bg-grid fixed inset-0 opacity-20"></div>
    <div class="circuit-vignette"></div>

    <template x-if="activeBroadcast">
        <div class="fixed top-0 left-0 right-0 z-[500] bg-red-600 p-5 text-center font-black uppercase animate-pulse border-b-4 border-white shadow-2xl">
            <span x-text="'BROADCAST: ' + activeBroadcast"></span>
        </div>
    </template>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-4">
            <div class="loader"></div>
            <p class="text-[10px] font-black text-gold uppercase tracking-[0.5em]">Establishing Connection...</p>
        </div>
    </template>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-8 text-center bg-black z-50 relative">
            <img src="assets/images/logo.png" class="w-40 h-40 mb-10 object-contain">
            <div class="w-full max-w-md space-y-4">
                <h2 class="text-white font-black uppercase tracking-[0.3em] text-[10px] italic mb-8">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</h2>
                
                <div x-show="authMode === 'login'" class="space-y-3">
                    <input x-model="emailInput" type="email" placeholder="EMAIL" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[10px] focus:border-gold">
                    <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[10px] focus:border-gold">
                    <button @click="loginUser()" class="w-full py-5 bg-gold text-black font-black uppercase rounded-full shadow-lg hover:scale-105 transition-all">Initialize Access</button>
                    <button @click="loginWithGoogle()" class="w-full py-4 bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-full flex items-center justify-center gap-2">
                        <i data-lucide="chrome" class="w-4 h-4 text-gold"></i> Sign in with Google
                    </button>
                    <button @click="authMode = 'register'" class="text-[8px] text-zinc-500 uppercase font-black mt-4 underline">Enroll Operative</button>
                </div>
                
                <div x-show="authMode === 'register'" class="space-y-3" x-transition>
                    <input x-model="handleInput" placeholder="HANDLE" class="w-full bg-black border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <input x-model="emailInput" type="email" placeholder="EMAIL" class="w-full bg-black border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <input x-model="passwordInput" type="password" placeholder="KEY" class="w-full bg-black border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <input x-model="confirmPassword" type="password" placeholder="CONFIRM KEY" class="w-full bg-black border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <button @click="registerUser()" class="w-full py-5 bg-white text-black font-black uppercase rounded-full shadow-xl">Confirm Enrollment</button>
                    <button @click="authMode = 'login'" class="text-[8px] text-zinc-500 uppercase font-black mt-4 underline">Back to Login</button>
                </div>
                <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[9px] font-black uppercase mt-4"></p>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col">
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <img src="assets/images/logo.png" class="w-12 h-12">
                    <div>
                        <p class="text-[10px] font-black uppercase italic tracking-widest leading-tight">Ministry of Groove</p>
                        <p class="text-[6px] text-gold/40 uppercase font-black tracking-widest" x-text="username"></p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button x-show="isDirector" onclick="window.location.href='directorate.html'" class="p-3 border border-red-500 text-red-500 rounded-xl animate-pulse"><i data-lucide="shield-alert"></i></button>
                    <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl"><i data-lucide="power"></i></button>
                </div>
            </header>

            <main class="p-8 max-w-7xl mx-auto w-full flex-grow">
                <div x-show="subView === 'grid'" class="grid grid-cols-2 md:grid-cols-2 gap-6 mb-12 animate-fade-in">
                    <div @click="subView = 'chat'" class="tile-animate glass p-10 rounded-[2.5rem] text-center border border-blue-500/20 cursor-pointer shadow-xl" style="animation-delay: 0.1s">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400 w-8 h-8"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">The Grid</span>
                    </div>
                    <div onclick="window.location.href='dossier.html'" class="tile-animate glass p-10 rounded-[2.5rem] text-center border border-green-500/20 cursor-pointer shadow-xl" style="animation-delay: 0.2s">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400 w-8 h-8"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">Dossier</span>
                    </div>
                    <div onclick="window.location.href='gallery.html'" class="tile-animate glass p-10 rounded-[2.5rem] text-center border border-purple-500/20 cursor-pointer shadow-xl" style="animation-delay: 0.3s">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400 w-8 h-8"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">Gallery</span>
                    </div>
                    <div onclick="window.location.href='frequency.html'" class="tile-animate glass p-10 rounded-[2.5rem] text-center border border-gold/20 cursor-pointer shadow-xl" style="animation-delay: 0.4s">
                        <i data-lucide="activity" class="mx-auto mb-2 text-gold w-8 h-8"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">Frequency</span>
                    </div>
                    <div onclick="window.location.href='dispatch.html'" class="tile-animate glass p-10 rounded-[2.5rem] text-center border border-red-500/20 cursor-pointer shadow-xl" style="animation-delay: 0.5s">
                        <i data-lucide="radio" class="mx-auto mb-2 text-red-400 w-8 h-8"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">Dispatch</span>
                    </div>
                    <div onclick="window.location.href='archives.html'" class="tile-animate glass p-10 rounded-[2.5rem] text-center border border-zinc-500/20 cursor-pointer shadow-xl" style="animation-delay: 0.6s">
                        <i data-lucide="database" class="mx-auto mb-2 text-zinc-400 w-8 h-8"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest">Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="space-y-4 animate-fade-in">
                    <button @click="subView = 'grid'" class="text-[10px] font-black uppercase text-gold flex items-center gap-2 mb-4"><i data-lucide="chevron-left" class="w-4 h-4"></i> Return to Grid</button>
                    <div class="glass rounded-[3rem] h-[50vh] flex flex-col overflow-hidden shadow-2xl">
                        <div class="flex-grow overflow-y-auto p-6 space-y-4 custom-scrollbar" x-ref="chatContainer">
                            <template x-for="msg in messages" :key="msg.id">
                                <div :class="msg.username === username ? 'ml-auto text-right items-end' : 'mr-auto text-left items-start'" class="flex flex-col max-w-[85%]">
                                    <span class="text-[7px] text-zinc-500 uppercase font-black mb-1" x-text="msg.username"></span>
                                    <div :class="msg.username === username ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-4 border rounded-2xl text-[11px]" x-text="msg.content"></div>
                                </div>
                            </template>
                        </div>
                        <form @submit.prevent="sendMessage()" class="p-6 bg-black/40 border-t border-gold/10 flex gap-4">
                            <input x-model="msgInput" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[11px] outline-none terminal-font uppercase">
                            <button type="submit" class="text-gold"><i data-lucide="send" class="w-5 h-5"></i></button>
                        </form>
                    </div>
                </div>

                <div class="glass p-8 rounded-[3rem] border border-white/5 mt-12">
                    <h3 class="text-xs font-black uppercase text-gold tracking-widest flex items-center gap-2 italic mb-6"><i data-lucide="users" class="w-4 h-4"></i> Personnel Activity</h3>
                    <div class="flex gap-6 overflow-x-auto pb-4 custom-scrollbar">
                        <template x-for="op in operatives" :key="op.id">
                            <div class="flex-shrink-0 w-24 text-center space-y-2">
                                <div class="w-16 h-16 bg-white/5 rounded-full mx-auto border border-gold/20 flex items-center justify-center relative">
                                    <i data-lucide="user" class="text-zinc-600"></i>
                                    <div class="absolute bottom-0 right-0 w-4 h-4 bg-green-500 rounded-full border-2 border-black animate-pulse"></div>
                                </div>
                                <p class="text-[8px] font-black uppercase truncate text-zinc-300" x-text="op.handle"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </main>

            <footer class="border-t border-white/5 p-12 bg-black/60 text-center">
                <div class="flex justify-center gap-10 text-zinc-500 mb-8">
                    <a href="https://instagram.com/ministryofgroove_hq" target="_blank" class="hover:text-gold transition-all"><i data-lucide="instagram" class="w-6 h-6"></i></a>
                    <a href="https://wa.me/message/EASM3GTNOVSQE1" target="_blank" class="hover:text-gold transition-all"><i data-lucide="message-circle" class="w-6 h-6"></i></a>
                    <a href="https://youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:text-gold transition-all"><i data-lucide="youtube" class="w-6 h-6"></i></a>
                </div>
                <p class="text-[9px] text-zinc-700 font-black uppercase tracking-[0.5em] leading-relaxed italic">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026 MINISTRY OF GROOVE</p>
            </footer>
        </div>
    </template>
</body>
</html>
