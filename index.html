<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG_GRID | NCC MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #D4AF37; --noir: #050505; }
        body { background: var(--noir); color: var(--gold); font-family: 'Inter', sans-serif; margin: 0; }
        .glass { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .chart-number { font-family: 'JetBrains Mono', monospace; font-size: 2rem; opacity: 0.2; line-height: 1; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col pb-32">
            <header class="p-6 pt-10 glass flex justify-between items-center mx-4 rounded-2xl sticky top-4 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full border border-gold/20">
                    <h1 class="text-[10px] font-black uppercase text-white tracking-widest italic">Grid_Charts</h1>
                </div>
                <button @click="subView = 'chat'" class="p-3 bg-white/5 rounded-full"><i data-lucide="message-square" size="16"></i></button>
            </header>

            <main class="p-6 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div @click="subView = 'charts'" :class="subView === 'charts' ? 'bg-gold/10 border-gold/40' : 'border-gold/10'" class="glass p-4 rounded-2xl text-center cursor-pointer border transition-all">
                        <i data-lucide="trending-up" class="mx-auto mb-1 text-gold"></i>
                        <span class="text-[8px] font-black uppercase text-white">Top 10</span>
                    </div>
                    <div @click="subView = 'debate'" :class="subView === 'debate' ? 'bg-gold/10 border-gold/40' : 'border-gold/10'" class="glass p-4 rounded-2xl text-center cursor-pointer border transition-all">
                        <i data-lucide="mic-2" class="mx-auto mb-1 text-blue-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Debate</span>
                    </div>
                </div>

                <div x-show="subView === 'charts'" class="space-y-4 animate-in fade-in zoom-in-95">
                    <template x-for="(track, index) in tracks" :key="track.id">
                        <div class="glass p-5 rounded-[2rem] flex items-center justify-between border-white/5 relative overflow-hidden">
                            <div class="absolute left-4 chart-number font-black italic" x-text="index + 1"></div>
                            <div class="pl-12">
                                <h3 class="text-[11px] font-black uppercase text-white leading-tight" x-text="track.title"></h3>
                                <p class="text-[8px] text-gold/60 font-bold" x-text="track.artist"></p>
                            </div>
                            <div class="flex items-center gap-4">
                                <div class="text-right">
                                    <p class="text-[8px] font-black text-white" x-text="track.votes"></p>
                                    <p class="text-[6px] text-zinc-500 uppercase">Signals</p>
                                </div>
                                <button @click="vote(track.id)" class="h-10 w-10 bg-white/5 rounded-full flex items-center justify-center hover:bg-gold hover:text-black transition-all">
                                    <i data-lucide="arrow-big-up" size="20"></i>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="subView === 'debate'" class="glass rounded-[3rem] h-[60vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-6">
                    <div class="p-6 border-b border-white/5">
                        <h3 class="text-[10px] font-black uppercase text-white">The Debate Feed</h3>
                        <p class="text-[7px] text-zinc-500 uppercase">Signal your opinion on the weekly order</p>
                    </div>
                    <div id="debate-stream" class="flex-grow overflow-y-auto p-6 space-y-4">
                        <template x-for="post in debates" :key="post.id">
                            <div class="border-l-2 border-gold/20 pl-4 py-1">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-[8px] font-black text-gold uppercase" x-text="post.username"></span>
                                    <span class="text-[6px] text-zinc-600" x-text="new Date(post.created_at).toLocaleTimeString()"></span>
                                </div>
                                <p class="text-[11px] text-zinc-300" x-text="post.comment"></p>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="postDebate()" class="p-4 bg-black/40 flex gap-2">
                        <input x-model="debateInput" placeholder="ARGUE YOUR SIGNAL..." class="flex-grow bg-transparent text-[11px] text-white outline-none italic">
                        <button type="submit" class="p-3 bg-gold text-black rounded-xl"><i data-lucide="send" size="14"></i></button>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <script>
        function ministry() {
            return {
                view: 'auth', subView: 'charts', username: '', 
                tracks: [], debates: [], debateInput: '', handleInput: '',

                async init() {
                    const saved = localStorage.getItem('mog_handle');
                    if(saved) { 
                        this.username = saved; this.view = 'grid';
                        this.fetchTracks();
                        this.fetchDebates();
                        this.subscribe();
                    }
                    this.$nextTick(() => lucide.createIcons());
                },
                async fetchTracks() {
                    const { data } = await mog_sb.from('chart_tracks').select('*').order('votes', { ascending: false });
                    this.tracks = data || [];
                },
                async fetchDebates() {
                    const { data } = await mog_sb.from('chart_debate').select('*').order('created_at', { ascending: true });
                    this.debates = data || [];
                    this.$nextTick(() => { const el = document.getElementById('debate-stream'); if(el) el.scrollTop = el.scrollHeight; });
                },
                async vote(id) {
                    await mog_sb.rpc('vote_track', { track_id: id });
                    this.fetchTracks(); // Optimized: Realtime will also trigger this
                },
                async postDebate() {
                    if(!this.debateInput.trim()) return;
                    await mog_sb.from('chart_debate').insert([{ username: this.username, comment: this.debateInput.toUpperCase() }]);
                    this.debateInput = '';
                },
                subscribe() {
                    mog_sb.channel('charts').on('postgres_changes', { event: '*', schema: 'public', table: 'chart_tracks' }, () => this.fetchTracks()).subscribe();
                    mog_sb.channel('debate').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chart_debate' }, p => {
                        this.debates.push(p.new);
                        this.$nextTick(() => { const el = document.getElementById('debate-stream'); if(el) el.scrollTop = el.scrollHeight; });
                    }).subscribe();
                },
                initializeUser() {
                    if(!this.handleInput.trim()) return;
                    this.username = this.handleInput.toUpperCase();
                    localStorage.setItem('mog_handle', this.username);
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
