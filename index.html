<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid { background-image: radial-gradient(circle, #D4AF37 1px, transparent 1px); background-size: 30px 30px; }
        .glass-strong { background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(25px); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function ministry() {
            return {
                view: 'auth', subView: 'chat', authMode: 'login',
                username: '', emailInput: '', passwordInput: '',
                isDirector: false, isLoading: false, errorMsg: '',
                messages: [], msgInput: '', activeBroadcast: null,
                currentTime: '', sessionDuration: '00:00', sessionStart: null,

                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await sb.auth.getSession();
                    if (session) this.setupUser(session.user);
                    setInterval(() => { this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); }, 1000);
                    this.subscribeToBroadcasts();
                    this.$watch('view', () => this.$nextTick(() => lucide.createIcons()));
                },

                setupUser(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid';
                    this.sessionStart = Date.now();
                    this.loadMessages();
                    this.subscribeToMessages();
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
                },

                async loginUser() {
                    this.isLoading = true;
                    this.errorMsg = '';
                    const { data, error } = await sb.auth.signInWithPassword({ email: this.emailInput.trim(), password: this.passwordInput });
                    if (error) this.errorMsg = "INVALID CREDENTIALS";
                    else this.setupUser(data.user);
                    this.isLoading = false;
                },

                subscribeToBroadcasts() {
                    sb.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                        this.activeBroadcast = payload.new.content;
                        setTimeout(() => { this.activeBroadcast = null; }, 15000);
                    }).subscribe();
                },

                async loadMessages() {
                    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: true });
                    if (data) this.messages = data;
                },

                subscribeToMessages() {
                    sb.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.$nextTick(() => { this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight; });
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    await sb.from('messages').insert({ username: this.username, content: this.msgInput });
                    this.msgInput = '';
                },

                logout() { sb.auth.signOut(); window.location.reload(); }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">
    
    <div class="bg-grid fixed inset-0 opacity-20"></div>

    <template x-if="activeBroadcast">
        <div class="fixed top-0 left-0 right-0 z-[500] bg-red-600 p-5 text-center font-black uppercase animate-pulse border-b-4 border-white shadow-2xl">
            <span x-text="'BROADCAST: ' + activeBroadcast"></span>
        </div>
    </template>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-8 text-center z-10 animate-fade-in">
            <img src="assets/images/logo.png" class="w-40 h-40 mb-10 object-contain">
            <div class="w-full max-w-md space-y-4">
                <h2 class="text-white font-black uppercase tracking-[0.3em] text-[10px] italic mb-8">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</h2>
                <div class="space-y-3">
                    <input x-model="emailInput" type="email" placeholder="OPERATIVE EMAIL" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[10px] focus:border-gold">
                    <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[10px] focus:border-gold">
                    <button @click="loginUser()" class="w-full py-5 bg-gold text-black font-black uppercase rounded-full shadow-lg">Initialize Access</button>
                    <button @click="loginWithGoogle()" class="w-full py-4 bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-full flex items-center justify-center gap-2 hover:bg-white/10 transition-all">
                        <i data-lucide="chrome" class="w-4 h-4 text-gold"></i> Sign in with Google
                    </button>
                </div>
                <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[9px] font-black uppercase tracking-widest bg-red-500/10 py-2 rounded-full border border-red-500/20"></p>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col z-20 relative pb-32">
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <img src="assets/images/logo.png" class="w-12 h-12 object-contain">
                    <p class="text-[10px] font-black uppercase italic tracking-widest" x-text="username"></p>
                </div>
                <div class="flex items-center gap-4">
                    <button x-show="isDirector" onclick="window.location.href='directorate.html'" class="p-3 border border-red-500 text-red-500 rounded-xl animate-pulse"><i data-lucide="shield-alert"></i></button>
                    <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl"><i data-lucide="power"></i></button>
                </div>
            </header>

            <main class="p-6 space-y-6 max-w-6xl mx-auto w-full flex-grow">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                    <div @click="subView = 'chat'" class="glass p-8 rounded-[2rem] text-center border border-white/10 cursor-pointer">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i>
                        <span class="text-[9px] font-black uppercase text-white tracking-widest block">Grid</span>
                    </div>
                    <div onclick="window.location.href='dossier.html'" class="glass p-8 rounded-[2rem] text-center border border-white/10 cursor-pointer hover:border-green-400 transition-all">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400"></i>
                        <span class="text-[9px] font-black uppercase text-white tracking-widest block">Dossier</span>
                    </div>
                    <div onclick="window.location.href='archives.html'" class="glass p-8 rounded-[2rem] text-center border border-white/10 cursor-pointer hover:border-gold transition-all">
                        <i data-lucide="database" class="mx-auto mb-2 text-gold"></i>
                        <span class="text-[9px] font-black uppercase text-white tracking-widest block">Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="glass rounded-[2.5rem] h-[50vh] flex flex-col overflow-hidden animate-slide-up">
                    <div class="p-4 border-b border-white/5 bg-white/5 flex justify-between">
                        <span class="text-[10px] font-black uppercase italic">Live Grid Uplink</span>
                    </div>
                    <div class="flex-grow overflow-y-auto p-4 space-y-4" x-ref="chatContainer">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === username ? 'ml-auto text-right' : 'mr-auto text-left'" class="max-w-[80%]">
                                <p class="text-[6px] text-zinc-500 uppercase font-black" x-text="msg.username"></p>
                                <div :class="msg.username === username ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-3 border rounded-2xl text-[10px]" x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="sendMessage()" class="p-4 border-t border-white/5 flex gap-2">
                        <input x-model="msgInput" placeholder="ENTER MESSAGE..." class="flex-grow bg-transparent outline-none uppercase text-[10px] terminal-font">
                        <button type="submit" class="text-gold"><i data-lucide="send" class="w-4 h-4"></i></button>
                    </form>
                </div>
            </main>
            
            <footer class="border-t border-white/5 mt-12 bg-black/40 backdrop-blur-xl">
                <div class="max-w-6xl mx-auto p-12 grid md:grid-cols-4 gap-12">
                    <div class="space-y-4">
                        <img src="assets/images/logo.png" class="w-16 h-16">
                        <p class="text-[9px] text-zinc-600 font-black uppercase">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</p>
                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest italic">Contacts</h4>
                        <div class="text-[9px] text-zinc-400 space-y-3 uppercase font-black tracking-widest">
                            <p>director.mog@gmail.com</p>
                            <p>Emalahleni, Mpumalanga</p>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-gold text-[10px] font-black uppercase mb-6 tracking-widest italic">Connect</h4>
                        <div class="flex gap-5 text-zinc-500">
                            <a href="https://instagram.com/ministryofgroove_hq" target="_blank" class="hover:text-gold transition-all"><i data-lucide="instagram" class="w-5 h-5"></i></a>
                            <a href="https://wa.me/message/EASM3GTNOVSQE1" target="_blank" class="hover:text-gold transition-all"><i data-lucide="message-circle" class="w-5 h-5"></i></a>
                            <a href="https://youtube.com/@MinistryofGroove-m1q" target="_blank" class="hover:text-gold transition-all"><i data-lucide="youtube" class="w-5 h-5"></i></a>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
    </template>
</body>
</html>
