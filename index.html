<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>M.O.G. | OPERATIVE NETWORK</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');
        
        [x-cloak] { display: none !important; }
        
        :root {
            --teal: #00d4aa;
            --teal-dark: #00a884;
            --teal-glow: rgba(0, 212, 170, 0.4);
            --gold: #d4af37;
            --gold-light: #f4d03f;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --dark-bg: #0a0f0f;
            --circuit: #001a16;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
        }
        
        .terminal-font { 
            font-family: 'Share Tech Mono', monospace; 
        }
        
        /* M.O.G. Seal Background - Uses logo.png */
        .mog-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vmin;
            height: 90vmin;
            background-image: url('../assets/images/logo.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.04;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 0 50px var(--teal-glow));
        }
        
        /* Circuit Pattern Overlay */
        .circuit-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 1;
        }
        
        /* Glass Effects - Teal Theme */
        .glass-teal { 
            background: rgba(0, 26, 22, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(0, 212, 170, 0.2); 
            box-shadow: 
                0 0 40px rgba(0, 212, 170, 0.1),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        .glass-gold { 
            background: rgba(26, 22, 0, 0.85); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(212, 175, 55, 0.3); 
            box-shadow: 
                0 0 40px rgba(212, 175, 55, 0.15),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        .glass-dark { 
            background: rgba(10, 15, 15, 0.95); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(0, 212, 170, 0.1); 
        }
        
        /* Text Effects */
        .text-teal { 
            color: var(--teal);
            text-shadow: 0 0 15px var(--teal-glow);
        }
        
        .text-gold { 
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold-glow);
        }
        
        /* Button Styles */
        .btn-teal {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.15) 0%, rgba(0, 168, 132, 0.25) 100%);
            border: 1px solid rgba(0, 212, 170, 0.4);
            color: var(--teal);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-teal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 170, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-teal:hover::before {
            left: 100%;
        }
        
        .btn-teal:hover {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.3) 0%, rgba(0, 168, 132, 0.4) 100%);
            border-color: var(--teal);
            box-shadow: 0 0 30px var(--teal-glow);
            transform: translateY(-2px);
        }
        
        .btn-gold {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(184, 134, 11, 0.25) 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: var(--gold);
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3) 0%, rgba(184, 134, 11, 0.4) 100%);
            border-color: var(--gold);
            box-shadow: 0 0 30px var(--gold-glow);
        }
        
        /* Profile Avatar with Circuit Border */
        .avatar-circuit {
            position: relative;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 0deg, var(--teal), var(--gold), var(--teal));
            animation: rotate 20s linear infinite;
        }
        
        .avatar-circuit img {
            border-radius: 50%;
            border: 3px solid var(--dark-bg);
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Stats Bar - Teal Gradient */
        .stat-bar {
            background: rgba(0,0,0,0.6);
            border-radius: 999px;
            overflow: hidden;
            height: 6px;
            border: 1px solid rgba(0, 212, 170, 0.2);
        }
        
        .stat-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 1s ease;
            background: linear-gradient(90deg, var(--teal-dark), var(--teal));
            box-shadow: 0 0 10px var(--teal-glow);
        }
        
        /* Scanline - Teal */
        .scanline-teal {
            width: 100%;
            height: 120px;
            background: linear-gradient(0deg, transparent 0%, rgba(0, 212, 170, 0.04) 50%, transparent 100%);
            position: fixed;
            top: -120px;
            left: 0;
            pointer-events: none;
            animation: scanline 8s linear infinite;
            z-index: 100;
        }
        
        @keyframes scanline {
            from { top: -120px; }
            to { top: 100vh; }
        }
        
        /* Lockdown Overlay - Different from Directorate */
        .lockdown-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 40, 40, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(15px);
            border: 2px solid var(--teal);
        }
        
        /* M.O.G. Badge */
        .mog-badge {
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.2), rgba(212, 175, 55, 0.15));
            border: 1px solid rgba(0, 212, 170, 0.4);
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }
        
        /* Input Styles */
        .input-teal {
            background: rgba(0, 20, 20, 0.8);
            border: 1px solid rgba(0, 212, 170, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-teal:focus {
            border-color: var(--teal);
            box-shadow: 0 0 20px rgba(0, 212, 170, 0.15);
            outline: none;
        }
        
        /* Vinyl Record Animation */
        .vinyl-spin {
            animation: spin 4s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0,20,20,0.5);
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--teal-dark), var(--gold-dark));
            border-radius: 3px;
        }
        
        /* Pulse Animation for Live Status */
        .pulse-teal {
            animation: pulse-teal 2s infinite;
        }
        
        @keyframes pulse-teal {
            0%, 100% { box-shadow: 0 0 5px var(--teal); }
            50% { box-shadow: 0 0 20px var(--teal), 0 0 40px var(--teal-glow); }
        }
    </style>

    <script>
        function mogNetwork() {
            return {
                view: 'loading',
                currentUser: null,
                profile: {
                    username: '',
                    codename: '',
                    rank: 'INITIATE',
                    department: 'UNASSIGNED',
                    bio: '',
                    avatar_url: null,
                    stats: {
                        missions: 0,
                        contributions: 0,
                        influence: 0,
                        loyalty: 100,
                        groove: 50
                    },
                    skills: [],
                    achievements: [],
                    joined_at: null,
                    last_active: null
                },
                isEditing: false,
                isLoading: false,
                uploadProgress: 0,
                systemStatus: 'ONLINE',
                networkStatus: 'CONNECTED',
                lockdownActive: false,
                directorateMessage: '',
                activeTab: 'overview',
                showProfileModal: false,
                allOperatives: [],
                recentActivity: [],
                directives: [],
                
                get rankColor() {
                    const colors = {
                        'INITIATE': 'text-gray-400',
                        'AGENT': 'text-teal-400',
                        'OPERATIVE': 'text-cyan-400',
                        'SPECIALIST': 'text-amber-400',
                        'DIRECTOR': 'text-gold'
                    };
                    return colors[this.profile.rank] || 'text-gray-400';
                },
                
                get clearanceLevel() {
                    const levels = {
                        'INITIATE': 1,
                        'AGENT': 2,
                        'OPERATIVE': 3,
                        'SPECIALIST': 4,
                        'DIRECTOR': 5
                    };
                    return levels[this.profile.rank] || 1;
                },

                async init() {
                    this.checkDirectorateControl();
                    
                    // Listen for directorate commands
                    window.addEventListener('storage', (e) => {
                        if (e.key === 'ministrySettings') {
                            this.checkDirectorateControl();
                        }
                        if (e.key === 'lastDirective') {
                            this.loadDirectives();
                        }
                    });
                    
                    const { data: { session } } = await sb.auth.getSession();
                    if (!session) {
                        window.location.href = '/login.html';
                        return;
                    }
                    
                    this.currentUser = session.user;
                    await this.loadProfile();
                    await this.loadOperatives();
                    await this.loadActivity();
                    await this.loadDirectives();
                    
                    this.view = 'hub';
                    this.$nextTick(() => lucide.createIcons());
                },
                
                checkDirectorateControl() {
                    try {
                        const settings = localStorage.getItem('ministrySettings');
                        if (settings) {
                            const parsed = JSON.parse(settings);
                            this.lockdownActive = parsed.isLocked || false;
                            this.directorateMessage = parsed.alertStatus || '';
                            
                            // Update banner if directorate changed it
                            if (parsed.bannerText) {
                                this.directorateBanner = parsed.bannerText;
                            }
                        }
                    } catch (e) {
                        console.warn('Directorate link weak');
                    }
                },
                
                async loadProfile() {
                    try {
                        let { data, error } = await sb
                            .from('profiles')
                            .select('*')
                            .eq('id', this.currentUser.id)
                            .single();
                        
                        if (error && error.code === 'PGRST116') {
                            // Create M.O.G. operative profile
                            const codename = 'MOG-' + Math.random().toString(36).substr(2, 6).toUpperCase();
                            const newProfile = {
                                id: this.currentUser.id,
                                email: this.currentUser.email,
                                username: this.currentUser.email.split('@')[0],
                                codename: codename,
                                rank: 'INITIATE',
                                department: 'UNASSIGNED',
                                bio: '',
                                avatar_url: null,
                                stats: {
                                    missions: 0,
                                    contributions: 0,
                                    influence: 0,
                                    loyalty: 100,
                                    groove: 50
                                },
                                skills: [],
                                achievements: ['ENLISTED'],
                                joined_at: new Date().toISOString(),
                                last_active: new Date().toISOString(),
                                network: 'M.O.G.'
                            };
                            
                            const { data: created, error: createError } = await sb
                                .from('profiles')
                                .insert(newProfile)
                                .select()
                                .single();
                                
                            if (createError) throw createError;
                            data = created;
                        } else if (error) {
                            throw error;
                        }
                        
                        await sb
                            .from('profiles')
                            .update({ last_active: new Date().toISOString() })
                            .eq('id', this.currentUser.id);
                        
                        this.profile = { ...this.profile, ...data };
                        
                        if (data.rank === 'DIRECTOR') {
                            localStorage.setItem('userRole', 'director');
                            localStorage.setItem('clearanceLevel', 'ALPHA');
                        }
                    } catch (e) {
                        console.error('M.O.G. Network sync failed:', e);
                        this.showNotification('Network sync failed', 'error');
                    }
                },
                
                async loadOperatives() {
                    try {
                        const { data, error } = await sb
                            .from('profiles')
                            .select('id, username, codename, rank, avatar_url, last_active, stats, network')
                            .order('last_active', { ascending: false })
                            .limit(12);
                        
                        if (error) throw error;
                        this.allOperatives = data || [];
                    } catch (e) {
                        console.warn('Operative network unreachable:', e);
                    }
                },
                
                async loadActivity() {
                    try {
                        const { data, error } = await sb
                            .from('activity_log')
                            .select('*')
                            .order('created_at', { ascending: false })
                            .limit(10);
                        
                        if (error) throw error;
                        this.recentActivity = data || [];
                    } catch (e) {
                        this.recentActivity = [];
                    }
                },
                
                async loadDirectives() {
                    try {
                        const { data, error } = await sb
                            .from('directives')
                            .select('*')
                            .order('timestamp', { ascending: false })
                            .limit(3);
                        
                        if (error) throw error;
                        this.directives = data || [];
                    } catch (e) {
                        this.directives = [];
                    }
                },
                
                async updateProfile() {
                    this.isLoading = true;
                    try {
                        const updateData = {
                            username: this.profile.username,
                            codename: this.profile.codename,
                            bio: this.profile.bio,
                            department: this.profile.department,
                            updated_at: new Date().toISOString()
                        };
                        
                        const { error } = await sb
                            .from('profiles')
                            .update(updateData)
                            .eq('id', this.currentUser.id);
                        
                        if (error) throw error;
                        
                        this.isEditing = false;
                        this.showNotification('Dossier updated', 'success');
                        await this.logActivity('PROFILE_UPDATE', 'Updated operative dossier');
                    } catch (e) {
                        this.showNotification('Update failed', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async uploadAvatar(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    if (file.size > 2 * 1024 * 1024) {
                        this.showNotification('File exceeds 2MB limit', 'error');
                        return;
                    }
                    
                    this.isLoading = true;
                    this.uploadProgress = 0;
                    
                    try {
                        const fileExt = file.name.split('.').pop();
                        const fileName = `mog-${this.currentUser.id}-${Date.now()}.${fileExt}`;
                        const filePath = `mog-avatars/${fileName}`;
                        
            const { error: uploadError } = await sb.storage
                            .from('operative-assets')
                            .upload(filePath, file, {
                                cacheControl: '3600',
                                upsert: true
                            });
                        
                        if (uploadError) throw uploadError;
                        
                        const { data: { publicUrl } } = sb.storage
                            .from('operative-assets')
                            .getPublicUrl(filePath);
                        
                        const { error: updateError } = await sb
                            .from('profiles')
                            .update({ avatar_url: publicUrl })
                            .eq('id', this.currentUser.id);
                        
                        if (updateError) throw updateError;
                        
                        this.profile.avatar_url = publicUrl;
                        this.showNotification('Visual ID updated', 'success');
                        this.uploadProgress = 100;
                        
                    } catch (e) {
                        console.error('Upload failed:', e);
                        this.showNotification('Upload failed', 'error');
                    } finally {
                        this.isLoading = false;
                        setTimeout(() => this.uploadProgress = 0, 1000);
                    }
                },
                
                async logActivity(type, description) {
                    try {
                        await sb.from('activity_log').insert({
                            user_id: this.currentUser.id,
                            type,
                            description,
                            network: 'M.O.G.',
                            created_at: new Date().toISOString()
                        });
                    } catch (e) {}
                },
                
                getRankIcon(rank) {
                    const icons = {
                        'INITIATE': 'radio',
                        'AGENT': 'user',
                        'OPERATIVE': 'target',
                        'SPECIALIST': 'star',
                        'DIRECTOR': 'crown'
                    };
                    return icons[rank] || 'radio';
                },
                
                getStatusColor(timestamp) {
                    if (!timestamp) return 'text-gray-600';
                    const lastActive = new Date(timestamp);
                    const now = new Date();
                    const diff = (now - lastActive) / 1000 / 60;
                    
                    if (diff < 5) return 'text-teal-400';
                    if (diff < 30) return 'text-amber-400';
                    return 'text-gray-600';
                },
                
                showNotification(message, type = 'info') {
                    const notif = document.createElement('div');
                    notif.className = `fixed top-4 right-4 p-4 rounded-lg z-[99999] font-bold tracking-wider transform transition-all duration-300 translate-x-full ${
                        type === 'success' ? 'bg-teal-600' : 
                        type === 'error' ? 'bg-red-600' : 
                        type === 'warning' ? 'bg-amber-600' : 'bg-cyan-600'
                    } text-white shadow-2xl border border-white/20`;
                    notif.innerHTML = `
                        <div class="flex items-center gap-2">
                            <i data-lucide="${type === 'success' ? 'check' : type === 'error' ? 'alert-triangle' : 'info'}" class="w-5 h-5"></i>
                            <span>${message}</span>
                        </div>
                    `;
                    document.body.appendChild(notif);
                    lucide.createIcons();
                    
                    setTimeout(() => notif.classList.remove('translate-x-full'), 100);
                    setTimeout(() => {
                        notif.classList.add('translate-x-full');
                        setTimeout(() => notif.remove(), 300);
                    }, 3000);
                },
                
                async logout() {
                    await sb.auth.signOut();
                    localStorage.clear();
                    window.location.href = '/login.html';
                }
            }
        }
    </script>
</head>
<body x-data="mogNetwork()" x-init="init()" x-cloak class="bg-[#0a0f0f] text-white min-h-screen relative overflow-x-hidden">

    <!-- M.O.G. Background Elements -->
    <div class="mog-bg"></div>
    <div class="circuit-grid"></div>
    <div class="scanline-teal"></div>

    <!-- Directorate Lockdown Overlay -->
    <div x-show="lockdownActive" 
         x-transition 
         class="lockdown-overlay">
        <div class="w-24 h-24 rounded-full border-4 border-teal-400 flex items-center justify-center mb-6 pulse-teal">
            <i data-lucide="lock" class="w-12 h-12 text-teal-400"></i>
        </div>
        <h1 class="text-4xl font-black text-teal-400 uppercase tracking-[0.3em] mb-4" style="text-shadow: 0 0 30px rgba(0,212,170,0.5);">NETWORK LOCKDOWN</h1>
        <p class="text-lg text-white/70 terminal-font mb-2" x-text="directorateMessage || 'DIRECTORATE PROTOCOL ACTIVE'"></p>
        <p class="text-sm text-teal-600/60 uppercase tracking-widest">Ministry of Groove // Sector Control</p>
        <button @click="checkDirectorateControl()" class="mt-8 px-8 py-3 border border-teal-500/50 text-teal-400 rounded-full hover:bg-teal-500/20 transition-all uppercase tracking-widest text-sm font-bold">
            Refresh Status
        </button>
    </div>

    <!-- Loading View -->
    <template x-if="view === 'loading'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <div class="w-20 h-20 rounded-full border-4 border-teal-500 border-t-transparent animate-spin"></div>
            <p class="terminal-font text-sm text-teal-400 animate-pulse uppercase tracking-[0.5em]">Connecting to M.O.G. Network...</p>
            <p class="text-xs text-gray-600 uppercase tracking-widest">Ministry of Groove // Est. 2026</p>
        </div>
    </template>

    <!-- Main Hub -->
    <template x-if="view === 'hub'">
        <div class="min-h-screen relative z-10">
            
            <!-- Navigation -->
            <nav class="glass-teal border-b border-teal-500/20 px-6 py-4 sticky top-0 z-50">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <img src="../assets/images/logo.png" alt="M.O.G." class="w-14 h-14 object-contain opacity-90 vinyl-spin" style="animation-duration: 20s;">
                        <div>
                            <h1 class="text-2xl font-black uppercase tracking-tighter text-teal-400" style="text-shadow: 0 0 20px rgba(0,212,170,0.4);">M.O.G.</h1>
                            <p class="text-[10px] text-gray-500 uppercase tracking-[0.3em]">Ministry of Groove Network</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <!-- Directorate Portal -->
                        <a x-show="profile.rank === 'DIRECTOR'" 
                           href="/pages/directorate.html"
                           class="hidden md:flex items-center gap-2 px-5 py-2.5 bg-red-900/20 border border-red-500/50 rounded-full text-red-400 text-xs uppercase font-bold tracking-wider hover:bg-red-900/40 transition-all group">
                            <i data-lucide="shield" class="w-4 h-4 group-hover:animate-pulse"></i>
                            Directorate HQ
                        </a>
                        
                        <!-- Profile Trigger -->
                        <button @click="showProfileModal = true" 
                                class="flex items-center gap-3 p-2 pr-5 rounded-full bg-black/40 border border-teal-500/30 hover:border-teal-400 transition-all group">
                            <div class="avatar-circuit w-11 h-11">
                                <div class="w-full h-full rounded-full bg-gradient-to-br from-teal-900/50 to-black flex items-center justify-center overflow-hidden">
                                    <img x-show="profile.avatar_url" :src="profile.avatar_url" class="w-full h-full object-cover">
                                    <i x-show="!profile.avatar_url" data-lucide="user" class="w-5 h-5 text-teal-400"></i>
                                </div>
                            </div>
                            <div class="hidden md:block text-left">
                                <p class="text-xs font-bold text-white uppercase tracking-wider" x-text="profile.codename"></p>
                                <p class="text-[10px] text-teal-400 uppercase" x-text="profile.rank"></p>
                            </div>
                        </button>
                        
                        <button @click="logout()" class="p-3 text-gray-500 hover:text-teal-400 transition-colors">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="max-w-7xl mx-auto p-6 space-y-8">
                
                <!-- Welcome Section -->
                <div class="glass-teal p-8 rounded-[3rem] relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-r from-teal-900/20 via-transparent to-gold-900/10 pointer-events-none"></div>
                    <div class="relative z-10 flex flex-col md:flex-row items-center gap-8">
                        <div class="avatar-circuit w-28 h-28 flex-shrink-0">
                            <div class="w-full h-full rounded-full bg-gradient-to-br from-teal-500/20 to-gold-500/20 flex items-center justify-center overflow-hidden">
                                <img x-show="profile.avatar_url" :src="profile.avatar_url" class="w-full h-full object-cover">
                                <i x-show="!profile.avatar_url" data-lucide="user" class="w-12 h-12 text-teal-400"></i>
                            </div>
                        </div>
                        <div class="text-center md:text-left flex-1">

                        </div>
                        <div class="p-3 bg-cyan-900/20 rounded-xl border border-cyan-500/20">
                            <p class="text-xl font-black text-cyan-400 terminal-font" x-text="profile.stats.groove + '%'"></p>
                            <p class="text-[10px] text-gray-500 uppercase tracking-wider">Groove</p>
                        </div>
                        <div class="p-3 bg-red-900/20 rounded-xl border border-red-500/20">
                            <p class="text-xl font-black text-red-400 terminal-font" x-text="profile.stats.loyalty + '%'"></p>
                            <p class="text-[10px] text-gray-500 uppercase tracking-wider">Loyalty</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-8 border-t border-teal-500/20 flex justify-end gap-4 bg-black/40">
                <button @click="showProfileModal = false" class="px-6 py-3 rounded-full border border-teal-500/30 text-gray-400 hover:text-teal-300 hover:border-teal-400 transition-all text-xs uppercase font-bold tracking-wider">
                    Cancel
                </button>
                <button @click="updateProfile()" :disabled="isLoading" class="px-8 py-3 bg-gradient-to-r from-teal-600 to-cyan-600 text-white rounded-full hover:from-teal-500 hover:to-cyan-500 transition-all text-xs uppercase font-bold tracking-wider disabled:opacity-50 flex items-center gap-2 shadow-lg shadow-teal-500/20">
                    <i x-show="isLoading" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                    <span x-text="isLoading ? 'SYNCING...' : 'Save Dossier'"></span>
                </button>
            </div>
        </div>
    </div>

    </body>
</html>
