<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;900&display=swap');
        :root { --gold: #D4AF37; --gold-dark: #B8941F; --gold-light: #F4D03F; }
        * { font-family: 'Inter', sans-serif; }
        .terminal-font { font-family: 'JetBrains Mono', monospace; }
        .text-gold { color: var(--gold); }
        .bg-gold { background-color: var(--gold); }
        .gold-glow { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-strong { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(30px); }
        .bg-grid { background-image: linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px); background-size: 50px 50px; }
        [x-cloak] { display: none !important; }
        @keyframes slide-up { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white bg-grid min-h-screen">

    <template x-if="view === 'auth'">
        <div class="h-screen w-full flex flex-col items-center justify-center p-10 relative overflow-hidden">
            <div class="relative z-10 w-full max-w-xs space-y-8 animate-slide-up">
                <div class="h-32 w-32 mx-auto mb-8 gold-glow rounded-full bg-gradient-to-br from-gold/20 to-transparent flex items-center justify-center border border-gold/30">
                    <i data-lucide="hexagon" class="w-16 h-16 text-gold"></i>
                </div>
                
                <div class="space-y-6">
                    <div x-show="!showBypass" class="space-y-4">
                        <div class="text-center">
                            <h1 class="font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                            <p class="text-gold/40 text-[7px] uppercase font-black tracking-[0.3em]">Grid Synchronization Required</p>
                        </div>
                        <input x-model="handleInput" type="text" placeholder="ENTER OPERATIVE HANDLE..." 
                               class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] uppercase outline-none focus:border-gold terminal-font text-center">
                        <button @click="initializeUser()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full hover:bg-yellow-400 transition-all">Initialize Access</button>
                        <button @click="showBypass = true" class="w-full text-[7px] uppercase text-white/30 tracking-widest hover:text-gold">Directorate Override</button>
                    </div>

                    <div x-show="showBypass" class="glass p-6 rounded-[2.5rem] space-y-4 border-gold/40">
                        <input x-model="email" type="email" placeholder="DIRECTOR_ID@DOMAIN" class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[9px] text-center outline-none">
                        <input x-model="password" type="password" placeholder="PROTOCOL_KEY" class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[9px] text-center outline-none">
                        <button @click="signInWithEmail()" class="w-full py-4 bg-white text-black font-black text-[9px] uppercase rounded-full hover:bg-gold">Execute Authorization</button>
                        <button @click="showBypass = false" class="w-full text-[7px] uppercase text-white/40">← Abort Sequence</button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col pb-24">
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <div class="h-10 w-10 gold-glow rounded-full border border-gold/30 flex items-center justify-center">
                        <i data-lucide="hexagon" class="w-5 h-5 text-gold"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black uppercase text-white tracking-widest italic" x-text="isDirector ? 'MOG DIRECTORATE' : 'Ministry of Groove'"></p>
                        <p class="text-[6px] text-gold/40 uppercase tracking-widest" x-text="username"></p>
                    </div>
                </div>
                <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl hover:bg-red-900/20"><i data-lucide="power" class="w-4 h-4"></i></button>
            </header>

            <main class="p-4 md:p-6 space-y-6 max-w-6xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10' : 'border-white/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Grid</span>
                    </div>
                    
                    <template x-if="isDirector">
                        <div @click="subView = 'vault'" :class="subView === 'vault' ? 'border-gold bg-gold/10' : 'border-gold/20'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all animate-pulse-gold">
                            <i data-lucide="trending-up" class="mx-auto mb-2 text-gold w-6 h-6"></i>
                            <span class="text-[9px] font-black uppercase text-white block">Wealth Index</span>
                        </div>
                    </template>

                    <div @click="subView = 'gallery'" :class="subView === 'gallery' ? 'border-purple-400 bg-purple-400/10' : 'border-white/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Gallery</span>
                    </div>
                    <div @click="subView = 'dossier'" :class="subView === 'dossier' ? 'border-green-400 bg-green-400/10' : 'border-white/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400 w-6 h-6"></i>
                        <span class="text-[9px] font-black uppercase text-white block">Dossier</span>
                    </div>
                </div>

                <div x-show="subView === 'vault' && isDirector" class="animate-slide-up space-y-4">
                    <div class="glass p-8 rounded-[2rem] border-gold/30">
                        <h3 class="text-gold text-[10px] font-black uppercase mb-4">Financial Projections</h3>
                        <p class="text-[8px] text-zinc-400 uppercase terminal-font">Classified Data for Director Only</p>
                        <div class="mt-6 h-32 flex items-end gap-2">
                            <template x-for="i in [40, 70, 50, 90, 100, 80]">
                                <div class="bg-gold/40 flex-1 rounded-t-lg" :style="'height: ' + i + '%'"></div>
                            </template>
                        </div>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="glass rounded-[2rem] h-[60vh] flex flex-col overflow-hidden border-white/5">
                    <div id="chat-container" class="flex-1 overflow-y-auto p-6 space-y-4">
                        <template x-for="msg in messages" :key="msg.id">
                            <div class="animate-slide-up">
                                <span class="text-[8px] font-black text-gold terminal-font" x-text="msg.username"></span>
                                <div class="bg-white/5 p-3 rounded-2xl rounded-tl-none block max-w-[80%] mt-1">
                                    <p class="text-[10px] text-zinc-300" x-text="msg.content"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="p-4 bg-white/5 border-t border-white/5 flex gap-2">
                        <input x-model="newMessage" @keyup.enter="sendMessage()" type="text" placeholder="TRANSMIT MESSAGE..." class="flex-1 bg-black/40 border border-gold/20 p-4 rounded-xl text-[10px] outline-none">
                        <button @click="sendMessage()" class="p-4 bg-gold text-black rounded-xl"><i data-lucide="send" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </main>
        </div>
    </template>
    
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function ministry() {
            return {
                view: 'auth',
                subView: 'chat',
                showBypass: false,
                isDirector: false,
                handleInput: '',
                username: 'GUEST',
                email: '',
                password: '',
                messages: [],
                newMessage: '',

                async init() {
                    lucide.createIcons();
                    
                    // Session check
                    const { data: { session } } = await client.auth.getSession();
                    if (session) {
                        this.handleLoginSuccess(session.user);
                    }

                    client.channel('public:messages')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                            this.messages.push(p.new);
                        }).subscribe();

                    this.fetchMessages();
                },

                handleLoginSuccess(user) {
                    this.username = user.email.split('@')[0].toUpperCase();
                    this.isDirector = user.email === 'director.mog@gmail.com' || user.email === 'pgmoloto9098@gmail.com';
                    this.view = 'grid';
                },

                async initializeUser() {
                    if(!this.handleInput) return;
                    this.username = this.handleInput.toUpperCase();
                    this.isDirector = false; // Guests are never directors
                    this.view = 'grid';
                },

                async signInWithEmail() {
                    const { data, error } = await client.auth.signInWithPassword({
                        email: this.email,
                        password: this.password
                    });
                    if (error) alert(error.message);
                    else this.handleLoginSuccess(data.user);
                },

                async fetchMessages() {
                    const { data } = await client.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
                    if (data) this.messages = data;
                },

                async sendMessage() {
                    if (!this.newMessage) return;
                    const content = this.newMessage;
                    this.newMessage = '';
                    await client.from('messages').insert([{ username: this.username, content: content }]);
                },

                async logout() {
                    await client.auth.signOut();
                    this.view = 'auth';
                    this.isDirector = false;
                }
            }
        }
    </script>
</body>
</html>
