<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ministry of Groove | M.O.G.</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D4AF37">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --mog-gold: #D4AF37; --mog-black: #0a0a0a; --mog-grey: #1a1a1a; }
        body { background: var(--mog-black); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        #loading-screen { position: fixed; inset: 0; background: black; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
        .logo-glow { width: 180px; filter: drop-shadow(0 0 20px var(--mog-gold)); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.95); } }

        #chat-interface { display: none; flex-direction: column; height: 100%; }
        .header { padding: 15px; background: var(--mog-grey); border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; background: #222; border-left: 3px solid var(--mog-gold); align-self: flex-start; font-size: 0.95rem; }
        .input-area { padding: 15px; background: var(--mog-grey); display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #444; background: #000; color: white; outline: none; padding-left: 20px; }
        .send-btn { background: var(--mog-gold); color: black; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <img src="logo.png" alt="M.O.G." class="logo-glow">
        <div style="color: var(--mog-gold); margin-top: 30px; font-weight: bold; letter-spacing: 3px; font-size: 0.8rem;">TITANIUM UPLINK ACTIVE</div>
    </div>

    <div id="chat-interface">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <img src="logo.png" style="width: 30px;">
                <span style="font-weight: bold; color: var(--mog-gold);">M.O.G. HUB</span>
            </div>
            <button onclick="logout()" style="background:none; border:none; color:#777; font-size: 11px;">OFFLINE</button>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Message National Grid...">
            <button class="send-btn" onclick="sendMessage()"><i data-lucide="send"></i></button>
        </div>
    </div>

    <script>
        const SB_URL = "https://quzwygjbqpkuqjhrmsjp.supabase.co";
        const SB_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU"; 
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        async function init() {
            lucide.createIcons();
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('chat-interface').style.display = 'flex';
                }, 600);
                loadHistory();
                subscribeToMessages();
            } else {
                window.location.href = 'login.html'; 
            }
        }

        function subscribeToMessages() {
            _supabase.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                displayMessage(payload.new);
            }).subscribe();
        }

        async function loadHistory() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: true }).limit(50);
            if (data) data.forEach(displayMessage);
        }

        function displayMessage(msg) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.textContent = msg.content;
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            if (!input.value.trim()) return;
            const text = input.value;
            input.value = '';
            await _supabase.from('messages').insert([{ content: text }]);
        }

        async function logout() { await _supabase.auth.signOut(); window.location.reload(); }
        init();
    </script>
</body>
</html>
