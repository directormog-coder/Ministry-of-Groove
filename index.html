<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>MINISTRY OF GROOVE | NCC MASTER v5.2.3</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        [x-cloak] { display: none !important; }
        .glass-gold { background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .tactical-tile { background: rgba(17, 17, 17, 0.8); border: 1px solid rgba(212, 175, 55, 0.1); border-radius: 1.5rem; transition: all 0.4s ease; cursor: pointer; }
        .tactical-tile:hover { border-color: #00F2FF; background: rgba(0, 242, 255, 0.05); transform: translateY(-5px); }
        .brand-title { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.15em; color: #D4AF37; text-transform: uppercase; }
        .text-electric { color: #00F2FF; }
    </style>
</head>
<body x-data="nccMasterEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen overflow-x-hidden font-mono">

    <div class="bg-circuit-pattern" aria-hidden="true"></div>

    <template x-if="view === 'auth'">
        <main class="min-h-screen flex flex-col items-center justify-center px-4">
            <div class="w-full max-w-[380px] space-y-8">
                <div class="flex flex-col items-center text-center">
                    <img src="assets/images/logo.png" alt="MOG" class="w-32 h-32 mb-6 drop-shadow-[0_0_15px_rgba(212,175,55,0.4)]">
                    <h1 class="brand-title text-xl font-bold">Ministry of Groove</h1>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-[0.4em] mt-2">Central Operations Gate</p>
                </div>

                <div class="glass-gold p-8 rounded-[2rem] space-y-4">
                    <input x-model="authForm.id" type="text" placeholder="IDENTIFICATION" class="ncc-input w-full bg-black/50 border border-white/10 p-4 rounded-xl text-center">
                    <input x-model="authForm.pass" type="password" placeholder="PASSCODE" class="ncc-input w-full bg-black/50 border border-white/10 p-4 rounded-xl text-center">
                    
                    <button @click="loginManual()" class="w-full py-4 bg-gold text-black font-black uppercase rounded-xl hover:bg-white transition-all">
                        Authorize Access
                    </button>

                    <div class="flex items-center gap-4 py-2">
                        <div class="flex-grow h-[1px] bg-white/10"></div>
                        <span class="text-[9px] text-zinc-600 uppercase">Secure Uplink</span>
                        <div class="flex-grow h-[1px] bg-white/10"></div>
                    </div>

                    <button @click="loginWithGoogle()" class="w-full py-3 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center gap-3 hover:bg-white/10">
                        <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" class="w-4 h-4">
                        <span class="text-xs font-bold uppercase tracking-widest">Biometric Uplink</span>
                    </button>
                </div>
            </div>
        </main>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col">
            <header class="glass-gold sticky top-0 z-50 px-6 py-4">
                <div class="max-w-7xl mx-auto flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <img src="assets/images/logo.png" alt="MOG" class="w-10 h-10">
                        <div>
                            <h2 class="brand-title text-xs">MOG MASTER</h2>
                            <span class="text-[8px] text-electric uppercase" x-text="'Sector: ' + userRole"></span>
                        </div>
                    </div>
                    <button @click="logout()" class="text-[10px] border border-red-900/50 text-red-500 px-4 py-2 rounded-lg hover:bg-red-500 hover:text-white transition-all">
                        TERMINATE_SESSION
                    </button>
                </div>
            </header>

            <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12">
                <div class="text-center mb-16">
                    <h1 class="text-4xl font-black italic uppercase tracking-tighter">Grid Dashboard</h1>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-widest mt-2">Synchronizing sector archives...</p>
                </div>

                <nav class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div @click="window.location.href='/pages/dossier.html'" class="tactical-tile p-10 flex flex-col items-center text-center">
                        <i data-lucide="shield-check" class="w-10 h-10 text-gold mb-4"></i>
                        <h3 class="text-white text-sm">Personnel Dossier</h3>
                    </div>

                    <div @click="window.location.href='/pages/gallery.html'" class="tactical-tile p-10 flex flex-col items-center text-center">
                        <i data-lucide="camera" class="w-10 h-10 text-electric mb-4"></i>
                        <h3 class="text-white text-sm">Media Archives</h3>
                    </div>

                    <div @click="window.location.href='/pages/frequency.html'" class="tactical-tile p-10 flex flex-col items-center text-center">
                        <i data-lucide="activity" class="w-10 h-10 text-white mb-4"></i>
                        <h3 class="text-white text-sm">Frequency Monitor</h3>
                    </div>
                </nav>

                <div x-show="userRole === 'director'" class="mt-8">
                    <div @click="window.location.href='/directorate'" class="tactical-tile p-8 border-red-900/30 bg-red-900/5 flex items-center justify-center gap-4">
                        <i data-lucide="zap" class="w-6 h-6 text-red-500"></i>
                        <span class="text-xs font-black text-red-500 uppercase tracking-[0.3em]">Enter Command Center</span>
                    </div>
                </div>
            </main>

            <footer class="py-12 text-center opacity-20 text-[8px] tracking-[1em]">
                © 2026 MINISTRY OF GROOVE // NCC MASTER
            </footer>
        </div>
    </template>

    <script>
        document.addEventListener('alpine:init', () => {
            // Lucide icons need manual trigger on template change
            lucide.createIcons();
        });
    </script>
</body>
</html>
