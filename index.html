<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ministry of Groove | The Grid</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.min.js"></script>
</head>
<body class="bg-noir text-gold overflow-hidden" x-data="gridLogic">
    
    <template x-if="!authenticated">
        <div class="fixed inset-0 bg-noir z-50 flex items-center justify-center">
            <div class="text-center">
                <img src="logo.png" class="w-24 mx-auto mb-8 animate-pulse">
                <button @click="login" class="border border-gold px-8 py-2 hover:bg-gold hover:text-noir transition">
                    INITIALIZE LINK
                </button>
            </div>
        </div>
    </template>

    <main class="h-screen grid grid-cols-2 grid-rows-2 p-4 gap-4">
        <a href="dossier.html" class="tile border border-gold/30 flex flex-col justify-center items-center hover:bg-gold/10">
            <span class="text-xs tracking-widest opacity-50">01</span>
            <h2 class="text-2xl uppercase">Operative Stats</h2>
        </a>
        <a href="archives.html" class="tile border border-gold/30 flex flex-col justify-center items-center hover:bg-gold/10">
            <span class="text-xs tracking-widest opacity-50">02</span>
            <h2 class="text-2xl uppercase">The Vault</h2>
        </a>
        <a href="gallery.html" class="tile border border-gold/30 flex flex-col justify-center items-center hover:bg-gold/10">
            <span class="text-xs tracking-widest opacity-50">03</span>
            <h2 class="text-2xl uppercase">Visual Archives</h2>
        </a>
        <a href="terminal.html" x-show="isDirector" class="tile border-2 border-gold flex flex-col justify-center items-center bg-gold/5">
            <span class="text-xs tracking-widest text-gold">DIRECTORATE ONLY</span>
            <h2 class="text-2xl uppercase">Hub Terminal</h2>
        </a>
    </main>

    <script src="script.js"></script>
</body>
</html>
