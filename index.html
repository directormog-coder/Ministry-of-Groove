<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v3.0</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid { background-image: radial-gradient(circle, #D4AF37 1px, transparent 1px); background-size: 30px 30px; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .glass-strong { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(25px); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .circuit-vignette { position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.95) 100%); pointer-events: none; z-index: 5; }
        .bg-circuit-pattern { position: fixed; inset: 0; opacity: 0.05; z-index: 1; pointer-events: none; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .audio-bar { width: 3px; background: #D4AF37; animation: audio-bounce 1s infinite ease-in-out; }
        @keyframes audio-bounce { 0%, 100% { height: 20%; } 50% { height: 100%; } }
        .loader { width: 24px; height: 24px; border: 3px solid #D4AF37; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .image-modal.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function ministry() {
            return {
                view: 'auth', subView: 'chat', authMode: 'login',
                username: '', emailInput: '', passwordInput: '', confirmPassword: '', handleInput: '',
                isDirector: false, isLoading: false, errorMsg: '', isOnline: navigator.onLine,
                messages: [], msgInput: '', activeBroadcast: null,
                galleryItems: [], selectedImage: null,
                showVoiceRecorder: false, isRecording: false, recordingTime: '00:00',
                nowPlaying: null, isPlaying: false, playbackProgress: 0,
                currentTime: '', sessionDuration: '00:00', sessionStart: null,
                weatherStatus: 'CONNECTION SECURED',

                async init() {
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await sb.auth.getSession();
                    if (session) this.setupUser(session.user);

                    setInterval(() => { this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); }, 1000);
                    this.subscribeToBroadcasts();
                    
                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { this.isOnline = false; });
                    
                    this.$watch('view', () => this.$nextTick(() => lucide.createIcons()));
                },

                setupUser(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid';
                    this.sessionStart = Date.now();
                    this.loadMessages();
                    this.subscribeToMessages();
                    this.loadGallery();
                    setInterval(() => {
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
                },

                async loginUser() {
                    if (!this.emailInput.trim()) { this.errorMsg = 'ENTER EMAIL'; return; }
                    this.isLoading = true;
                    this.errorMsg = '';
                    const { data, error } = await sb.auth.signInWithPassword({ 
                        email: this.emailInput.trim(), 
                        password: this.passwordInput 
                    });
                    if (error) this.errorMsg = "INVALID OPERATIVE CREDENTIALS";
                    else this.setupUser(data.user);
                    this.isLoading = false;
                },

                async registerUser() {
                    if (this.passwordInput !== this.confirmPassword) { this.errorMsg = 'KEY MISMATCH'; return; }
                    this.isLoading = true;
                    const { error } = await sb.auth.signUp({ 
                        email: this.emailInput.trim(), password: this.passwordInput, 
                        options: { data: { handle: this.handleInput } } 
                    });
                    if (error) this.errorMsg = error.message.toUpperCase();
                    else { this.authMode = 'login'; this.errorMsg = 'UPLINK CREATED. LOGIN.'; }
                    this.isLoading = false;
                },

                subscribeToBroadcasts() {
                    sb.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                        this.activeBroadcast = payload.new.content;
                        setTimeout(() => { this.activeBroadcast = null; }, 15000);
                    }).subscribe();
                },

                async loadMessages() {
                    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: true });
                    if (data) { this.messages = data; this.scrollToBottom(); }
                },

                subscribeToMessages() {
                    sb.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.scrollToBottom();
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    await sb.from('messages').insert({ username: this.username, content: this.msgInput });
                    this.msgInput = '';
                },

                loadGallery() {
                    this.galleryItems = [{ id: 1, url: 'assets/images/logo.png' }];
                },

                playPreview(song) { 
                    this.nowPlaying = song; this.isPlaying = true; this.playbackProgress = 0;
                    if(this.audioInterval) clearInterval(this.audioInterval);
                    this.audioInterval = setInterval(() => { if(this.isPlaying && this.playbackProgress < 100) this.playbackProgress += 0.5; }, 100);
                },

                logout() { sb.auth.signOut(); window.location.reload(); },
                scrollToBottom() { this.$nextTick(() => { if(this.$refs.chatContainer) this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight; }); }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="bg-grid fixed inset-0 opacity-20"></div>
    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <template x-if="activeBroadcast">
        <div class="fixed top-0 left-0 right-0 z-[500] bg-red-600 p-5 text-center font-black uppercase animate-pulse border-b-4 border-white shadow-2xl">
            <div class="flex items-center justify-center gap-4">
                <i data-lucide="shield-alert"></i>
                <span x-text="activeBroadcast"></span>
                <i data-lucide="shield-alert"></i>
            </div>
        </div>
    </template>

    <div x-show="showVoiceRecorder" class="fixed inset-0 z-[400] flex items-center justify-center p-6 bg-black/95 animate-fade-in">
        <div class="glass max-w-sm w-full p-10 rounded-[3rem] text-center">
            <h3 class="text-xl font-black uppercase tracking-[0.3em] text-white mb-8 italic">Voice Transmission</h3>
            <div class="flex justify-center mb-10 h-16 gap-1">
                <template x-if="isRecording">
                    <div class="flex items-end gap-1 h-full"><div class="audio-bar"></div><div class="audio-bar" style="animation-delay: 0.2s"></div><div class="audio-bar" style="animation-delay: 0.4s"></div></div>
                </template>
                <i x-show="!isRecording" data-lucide="mic" class="w-16 h-16 text-gold/20"></i>
            </div>
            <button @click="isRecording = !isRecording" :class="isRecording ? 'bg-red-600' : 'bg-gold'" class="w-20 h-20 rounded-full flex items-center justify-center shadow-xl transition-all">
                <i :data-lucide="isRecording ? 'square' : 'mic'" class="w-8 h-8 text-black"></i>
            </button>
            <button @click="showVoiceRecorder = false" class="mt-10 text-[10px] text-zinc-600 uppercase font-black">Abort</button>
        </div>
    </div>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-8 text-center z-20 relative animate-fade-in">
            <img src="assets/images/logo.png" class="w-40 h-40 mb-10 object-contain" onerror="this.outerHTML='<h1 class=\'text-5xl font-black text-gold\'>MOG</h1>'">
            
            <div x-show="authMode === 'login'" class="w-full max-w-md space-y-4">
                <h2 class="text-white font-black uppercase tracking-[0.4em] text-[10px] italic mb-8">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</h2>
                <div class="space-y-3">
                    <input x-model="emailInput" type="email" placeholder="OPERATIVE EMAIL" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[10px] focus:border-gold">
                    <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[10px] focus:border-gold">
                    <button @click="loginUser()" class="w-full py-5 bg-gold text-black font-black uppercase rounded-full shadow-lg shadow-gold/20 active:scale-95 transition-all">Initialize Access</button>
                    <button @click="loginWithGoogle()" class="w-full py-4 bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-full flex items-center justify-center gap-2 hover:bg-white/10 transition-all">
                        <i data-lucide="chrome" class="w-4 h-4 text-gold"></i> Sign in with Google
                    </button>
                </div>
                <button @click="authMode = 'register'" class="text-gold/40 text-[9px] uppercase font-black tracking-widest mt-6">Register New Clearance</button>
                <p x-show="errorMsg" x-text="errorMsg" class="text-red-500 text-[9px] font-black uppercase mt-4"></p>
            </div>

            <div x-show="authMode === 'register'" class="w-full max-w-md space-y-4" x-transition>
                <h2 class="text-white font-black uppercase italic text-xs mb-8 tracking-widest">New Enrollment</h2>
                <div class="space-y-4">
                    <input x-model="handleInput" type="text" placeholder="HANDLE" class="w-full bg-black/60 border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <input x-model="emailInput" type="email" placeholder="EMAIL" class="w-full bg-black/60 border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <input x-model="passwordInput" type="password" placeholder="KEY" class="w-full bg-black/60 border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                    <input x-model="confirmPassword" type="password" placeholder="CONFIRM" class="w-full bg-black/60 border border-white/10 p-4 rounded-xl text-center outline-none uppercase text-[10px]">
                </div>
                <button @click="registerUser()" class="w-full py-5 bg-white text-black font-black uppercase rounded-full text-[10px]">Initiate</button>
                <button @click="authMode = 'login'" class="text-white/40 text-[8px] font-black uppercase tracking-widest pt-4">Return</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col z-20 relative pb-32">
            
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-[100] shadow-2xl">
                <div class="flex items-center gap-4">
                    <img src="assets/images/logo.png" class="w-12 h-12 object-contain" onclick="window.location.reload()">
                    <div>
                        <p class="text-[10px] font-black uppercase italic tracking-widest leading-tight">Ministry of Groove</p>
                        <div class="flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                            <p class="text-[6px] text-gold/40 uppercase font-black tracking-widest" x-text="username"></p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right mr-4 border-r border-white/10 pr-4 hidden sm:block">
                        <p class="text-[12px] font-black terminal-font" x-text="currentTime"></p>
                        <p class="text-[6px] text-gold/40 uppercase font-black tracking-widest" x-text="'Uptime: ' + sessionDuration"></p>
                    </div>
                    <button x-show="isDirector" onclick="window.location.href='directorate.html'" class="p-3 border border-red-500 text-red-500 rounded-xl hover:bg-red-500/10 animate-pulse shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                        <i data-lucide="shield-alert" class="w-5 h-5"></i>
                    </button>
                    <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl hover:bg-red-900/20"><i data-lucide="power" class="w-5 h-5"></i></button>
                </div>
            </header>
            
            <main class="p-6 space-y-8 max-w-7xl mx-auto w-full flex-grow">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10' : 'border-white/10'" class="glass p-10 rounded-[3rem] text-center border transition-all cursor-pointer group">
                        <i data-lucide="message-square" class="mx-auto mb-3 text-blue-400 w-8 h-8 group-hover:scale-110 transition-transform"></i>
                        <span class="text-[11px] font-black uppercase text-white tracking-widest block">Command Grid</span>
                    </div>
                    <div onclick="window.location.href='dossier.html'" class="glass p-10 rounded-[3rem] text-center border border-white/10 hover:border-green-400 transition-all cursor-pointer group">
                        <i data-lucide="user-cog" class="mx-auto mb-3 text-green-400 w-8 h-8 group-hover:rotate-12 transition-transform"></i>
                        <span class="text-[11px] font-black uppercase text-white tracking-widest block">Operative Dossier</span>
                    </div>
                    <div onclick="window.location.href='archives.html'" class="glass p-10 rounded-[3rem] text-center border border-white/10 hover:border-gold transition-all cursor-pointer group">
                        <i data-lucide="database" class="mx-auto mb-3 text-gold w-8 h-8 group-hover:scale-110 transition-transform"></i>
                        <span class="text-[11px] font-black uppercase text-white tracking-widest block">Classified Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="glass rounded-[3rem] h-[55vh] flex flex-col overflow-hidden border-white/5 shadow-2xl animate-slide-up">
                    <div class="p-5 border-b border-white/5 bg-white/5 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
                            <span class="text-[11px] font-black uppercase tracking-widest italic">Live Grid Uplink</span>
                        </div>
                        <div class="text-[8px] text-zinc-500 font-bold uppercase terminal-font" x-text="currentTime"></div>
                    </div>
                    <div class="flex-grow overflow-y-auto p-6 md:p-10 space-y-6" x-ref="chatContainer">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === username ? 'ml-auto text-right items-end' : 'mr-auto text-left items-start'" class="flex flex-col max-w-[80%]">
                                <span class="text-[7px] text-zinc-500 uppercase font-black mb-1" x-text="msg.username"></span>
                                <div :class="msg.username === username ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-4 border rounded-3xl text-[12px] leading-relaxed" x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="sendMessage()" class="p-6 bg-black/40 border-t border-gold/10 flex gap-4">
                        <button type="button" @click="showVoiceRecorder = true" class="text-zinc-500 hover:text-gold transition-colors"><i data-lucide="mic" class="w-6 h-6"></i></button>
                        <input x-model="msgInput" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[12px] outline-none terminal-font uppercase placeholder:text-zinc-800">
                        <button type="submit" class="p-4 bg-gold/10 text-gold rounded-full hover:bg-gold hover:text-black transition-all"><i data-lucide="send" class="w-5 h-5"></i></button>
                    </form>
                </div>
            </main>

            <div x-show="nowPlaying" class="fixed bottom-0 left-0 right-0 glass-strong border-t border-gold/30 p-5 z-50 shadow-[0_-20px_50px_rgba(0,0,0,0.8)] animate-slide-up">
                <div class="max-w-6xl mx-auto flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-gold/10 rounded-2xl flex items-center justify-center border border-gold/20"><i data-lucide="music" class="text-gold w-8 h-8"></i></div>
                        <div>
                            <p class="text-xs font-black uppercase italic tracking-widest text-white" x-text="nowPlaying?.title"></p>
                            <p class="text-[9px] text-gold/60 uppercase font-black tracking-widest mt-1" x-text="nowPlaying?.artist"></p>
                        </div>
                    </div>
                    <button @click="isPlaying = !isPlaying" class="w-14 h-14 bg-gold text-black rounded-full flex items-center justify-center shadow-xl shadow-gold/30 hover:scale-110 active:scale-95 transition-all">
                        <i :data-lucide="isPlaying ? 'pause' : 'play'" class="w-7 h-7"></i>
                    </button>
                </div>
            </div>

            <footer class="border-t border-white/5 mt-20 bg-black/60 backdrop-blur-xl">
                <div class="max-w-6xl mx-auto p-16 grid md:grid-cols-4 gap-12 text-center md:text-left">
                    <div class="space-y-6">
                        <img src="assets/images/logo.png" class="w-20 h-20 mx-auto md:mx-0">
                        <p class="text-[11px] text-zinc-400 font-bold uppercase tracking-widest italic">Secure. Connected. Groove.</p>
                        <p class="text-[9px] text-zinc-600 font-black uppercase leading-relaxed">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</p>
                    </div>
                    <div>
                        <h4 class="text-gold text-[11px] font-black uppercase mb-8 tracking-widest">Contacts</h4>
                        <p class="text-[10px] text-zinc-400 font-black uppercase space-y-3">
                            director.mog@gmail.com<br>Emalahleni, Mpumalanga<br>South Africa
                        </p>
                    </div>
                    <div>
                        <h4 class="text-gold text-[11px] font-black uppercase mb-8 tracking-widest">Connect</h4>
                        <div class="flex justify-center md:justify-start gap-6 text-zinc-500">
                            <a href="#" target="_blank" class="hover:text-gold transition-all"><i data-lucide="instagram" class="w-6 h-6"></i></a>
                            <a href="#" target="_blank" class="hover:text-gold transition-all"><i data-lucide="message-circle" class="w-6 h-6"></i></a>
                            <a href="#" target="_blank" class="hover:text-gold transition-all"><i data-lucide="youtube" class="w-6 h-6"></i></a>
                        </div>
                    </div>
                </div>
                <div class="p-10 border-t border-white/5 text-center text-[9px] text-zinc-700 uppercase font-black italic tracking-[0.4em]">
                    © 2026 MINISTRY OF GROOVE • NCC MASTER v3.0 • SECURE CONNECTION
                </div>
            </footer>
        </div>
    </template>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/service-worker.js'); }); }
    </script>
</body>
</html>
