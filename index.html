<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG_GRID | NCC MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #D4AF37; --noir: #050505; }
        body { background: var(--noir); color: var(--gold); font-family: 'Inter', sans-serif; margin: 0; }
        .glass { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .gold-glow { filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.4)); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">
    
    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-10 text-center animate-in fade-in duration-1000">
            <img src="logo.png" class="h-32 w-32 mb-8 gold-glow rounded-full">
            <div class="w-full max-w-xs space-y-6">
                <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                <input x-model="handleInput" placeholder="OPERATIVE HANDLE..." class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white text-center outline-none">
                <button @click="initializeUser()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full shadow-lg">Initialize Access</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col pb-24">
            <header class="p-6 glass flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 gold-glow rounded-full">
                    <p class="text-[10px] font-black uppercase text-white tracking-widest italic">Grid_Active</p>
                </div>
                <div class="flex items-center gap-3">
                    <span class="text-[8px] font-black px-3 py-1 bg-green-500/10 text-green-500 border border-green-500/20 rounded-full" x-text="province"></span>
                    <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg"><i data-lucide="power" size="16"></i></button>
                </div>
            </header>

            <main class="p-6 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10' : 'border-gold/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i>
                        <span class="text-[9px] font-black uppercase text-white">Grid</span>
                    </div>
                    <div @click="subView = 'map'" :class="subView === 'map' ? 'border-green-400 bg-green-400/10' : 'border-gold/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="map-pin" class="mx-auto mb-2 text-green-400"></i>
                        <span class="text-[9px] font-black uppercase text-white">Map</span>
                    </div>
                    <div @click="window.location.href='dossier.html'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-gold"></i>
                        <span class="text-[9px] font-black uppercase text-white">Dossier</span>
                    </div>
                    <div @click="window.location.href='archives.html'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10">
                        <i data-lucide="database" class="mx-auto mb-2 text-white/40"></i>
                        <span class="text-[9px] font-black uppercase text-white">Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="glass rounded-[3rem] h-[50vh] flex flex-col overflow-hidden animate-in slide-in-from-bottom-4">
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-4">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === 'DIRECTORATE' ? 'ml-auto items-end' : 'mr-auto items-start'" class="flex flex-col gap-1 max-w-[85%]">
                                <span class="text-[7px] font-black text-zinc-500 px-2 uppercase" x-text="msg.username"></span>
                                <div :class="msg.username === 'DIRECTORATE' ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-4 border rounded-2xl text-[12px] text-white" x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="send()" class="p-4 bg-black/40 border-t border-gold/10 flex gap-3">
                        <input x-model="msgInput" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[12px] text-white outline-none">
                        <button type="submit" class="text-gold"><i data-lucide="send-horizontal"></i></button>
                    </form>
                </div>

                <div x-show="subView === 'map'" class="glass rounded-[3rem] p-8 min-h-[40vh] space-y-6 animate-in zoom-in-95">
                    <h3 class="text-[10px] font-black uppercase text-white italic tracking-widest">Provincial Intelligence</h3>
                    <div class="space-y-4">
                        <template x-for="stat in provinceStats" :key="stat.province_name">
                            <div class="space-y-1">
                                <div class="flex justify-between text-[8px] font-black uppercase">
                                    <span x-text="stat.province_name" class="text-zinc-400"></span>
                                    <span x-text="stat.operative_count + ' active'" class="text-gold"></span>
                                </div>
                                <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                                    <div class="h-full bg-gold transition-all duration-1000" :style="`width: ${Math.min(stat.operative_count * 10, 100)}%`"></div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        function ministry() {
            return {
                view: 'auth', subView: 'chat', username: '', province: 'DETECTING...',
                messages: [], msgInput: '', handleInput: '', provinceStats: [],
                
                async init() {
                    const saved = localStorage.getItem('mog_handle');
                    if(saved) { 
                        this.username = saved; 
                        this.view = 'grid'; 
                        await this.detectLocation();
                        this.fetchMessages(); 
                        this.fetchStats();
                        this.subscribe(); 
                        setInterval(() => { this.updatePresence(); this.fetchStats(); }, 30000);
                    }
                    lucide.createIcons();
                },
                async detectLocation() {
                    try {
                        const res = await fetch('https://ipapi.co/json/');
                        const data = await res.json();
                        this.province = data.region ? data.region.toUpperCase() : 'MPUMALANGA';
                    } catch (e) { this.province = 'UNKNOWN'; }
                },
                async fetchStats() {
                    const { data } = await mog_sb.rpc('get_province_stats');
                    this.provinceStats = data || [];
                },
                async updatePresence() {
                    if(this.username) {
                        await mog_sb.from('presence').upsert({ 
                            username: this.username, 
                            last_seen: new Date().toISOString(),
                            province: this.province
                        });
                    }
                },
                subscribe() {
                    mog_sb.channel('messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                        this.messages.push(p.new);
                        this.$nextTick(() => { const el = document.getElementById('chat-stream'); if(el) el.scrollTop = el.scrollHeight; });
                    }).subscribe();
                },
                async fetchMessages() { 
                    const { data } = await mog_sb.from('messages').select('*').order('created_at', { ascending: true }).limit(50); 
                    this.messages = data || [];
                },
                async send() {
                    if(!this.msgInput.trim()) return;
                    await mog_sb.from('messages').insert([{ content: this.msgInput.toUpperCase(), username: this.username }]);
                    this.msgInput = '';
                },
                initializeUser() {
                    if(!this.handleInput.trim()) return;
                    this.username = this.handleInput.toUpperCase();
                    localStorage.setItem('mog_handle', this.username);
                    location.reload();
                },
                logout() { localStorage.clear(); location.reload(); }
            }
        }
    </script>
</body>
</html>
