<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        
        :root { --gold: #D4AF37; --noir: #050505; }
        
        body { 
            background: var(--noir); 
            color: var(--gold); 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow-x: hidden; 
        }

        .glass { 
            background: rgba(10, 10, 10, 0.8); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(212, 175, 55, 0.15); 
        }

        .ticker-move { 
            display: inline-block; 
            white-space: nowrap; 
            animation: ticker 30s linear infinite; 
        }
        @keyframes ticker { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }

        /* Message Bubble Geometry */
        .rounded-tr-none { border-top-right-radius: 2px !important; }
        .rounded-tl-none { border-top-left-radius: 2px !important; }

        /* Custom Scrollbar */
        #chat-stream::-webkit-scrollbar { width: 4px; }
        #chat-stream::-webkit-scrollbar-track { background: rgba(212, 175, 55, 0.02); }
        #chat-stream::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.2); border-radius: 10px; }
        #chat-stream { scroll-behavior: smooth; }

        .terminal-font { font-family: 'JetBrains Mono', monospace; }
        [x-cloak] { display: none !important; }
        
        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.85; }
            100% { opacity: 1; }
        }
        .directorate-msg { animation: flicker 4s infinite; }
        
        .social-hover:hover { filter: drop-shadow(0 0 8px #D4AF37); color: white; transition: all 0.3s ease; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">

    <div class="fixed top-0 w-full z-[100] glass py-2 border-b border-gold/10 overflow-hidden">
        <div class="ticker-move text-[9px] font-black uppercase tracking-widest text-white">
            <template x-for="news in newsItems" :key="news.id">
                <span class="mx-10" x-text="`${news.title}: ${news.message} — [${new Date(news.created_at).toLocaleTimeString()}]` "></span>
            </template>
            <template x-if="newsItems.length === 0">
                <span class="mx-10 text-gold/40">SYSTEM_IDLE: STANDBY FOR DIRECTORATE SIGNAL...</span>
            </template>
        </div>
    </div>

    <template x-if="hasDM">
        <div class="fixed bottom-32 left-6 right-6 glass p-4 rounded-2xl border-gold animate-bounce z-[150] flex items-center gap-4 shadow-2xl">
            <i data-lucide="mail" class="text-gold"></i>
            <div class="flex-grow">
                <p class="text-[8px] font-black uppercase text-white">Direct Instruction Received</p>
                <p class="text-[10px] italic" x-text="latestDM"></p>
            </div>
            <button @click="hasDM = false" class="text-[10px] font-black">X</button>
        </div>
    </template>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-10 text-center animate-in fade-in">
            <img src="logo.png" class="h-32 w-32 mb-8 rounded-full border border-gold/20 shadow-[0_0_20px_rgba(212, 175, 55, 0.2)]">
            <div class="w-full max-w-xs space-y-6">
                <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                <p class="text-[7px] text-gold/60 font-bold uppercase tracking-[0.2em] -mt-4">Decrypting the Culture. Synchronizing the Grid.</p>
                <input x-model="handleInput" placeholder="OPERATIVE_HANDLE..." class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white text-center outline-none focus:border-gold/50 transition-all">
                <button @click="initializeUser()" class="w-full py-5 bg-gold text-black font-black text-[10px] uppercase rounded-full shadow-lg active:scale-95 transition-transform">Initialize Access</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen pt-14 pb-12 space-y-6">
            
            <header class="p-5 glass flex justify-between items-center mx-4 rounded-2xl sticky top-12 z-50">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full border border-gold/20">
                    <div>
                        <p class="text-[11px] font-black uppercase text-white tracking-widest leading-none">Ministry of Groove</p>
                        <p class="text-[6px] text-gold/50 uppercase mt-1 tracking-tighter">Decrypting the Culture. Synchronizing the Grid.</p>
                        <p class="text-[5px] text-zinc-500 uppercase font-bold mt-1" x-text="`Sector: ${province} | Time: ${sastTime}`"></p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button @click="window.location.href='dossier.html'" class="p-2 glass rounded-lg border-gold/10"><i data-lucide="user" size="14"></i></button>
                    <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg"><i data-lucide="power" size="14"></i></button>
                </div>
            </header>

            <main class="px-4 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'bg-white/10 border-white/20' : 'border-gold/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Grid Chat</span>
                    </div>
                    <div @click="subView = 'map'" :class="subView === 'map' ? 'bg-white/10 border-white/20' : 'border-gold/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="map-pin" class="mx-auto mb-2 text-green-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Live Map</span>
                    </div>
                    <div @click="subView = 'audio'" :class="subView === 'audio' ? 'bg-white/10 border-white/20' : 'border-gold/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="music" class="mx-auto mb-2 text-gold"></i>
                        <span class="text-[8px] font-black uppercase text-white">Streaming</span>
                    </div>
                    <div @click="subView = 'charts'" :class="subView === 'charts' ? 'bg-white/10 border-white/20' : 'border-gold/10'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border transition-all">
                        <i data-lucide="trending-up" class="mx-auto mb-2 text-purple-400"></i>
                        <span class="text-[8px] font-black uppercase text-white">Top 10</span>
                    </div>
                </div>

                <div class="glass rounded-[3rem] min-h-[55vh] overflow-hidden">
                    
                    <div x-show="subView === 'chat'" class="h-full flex flex-col h-[60vh] relative">
                        <div class="px-6 py-2 border-b border-gold/10 flex justify-between items-center bg-gold/5">
                            <div class="flex items-center gap-2">
                                <span class="relative flex h-2 w-2">
                                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-gold opacity-75"></span>
                                    <span class="relative inline-flex rounded-full h-2 w-2 bg-gold"></span>
                                </span>
                                <span class="text-[8px] font-black tracking-widest uppercase">Encrypted_Uplink: Active</span>
                            </div>
                            <span class="text-[8px] opacity-40 terminal-font" x-text="`LATENCY: ${Math.floor(Math.random() * 40 + 10)}MS` "></span>
                        </div>

                        <div id="chat-stream" class="flex-grow overflow-y-auto p-4 space-y-1">
                            <template x-for="(msg, index) in messages" :key="msg.id">
                                <div class="group flex flex-col">
                                    <div :class="{
                                        'items-end': msg.username === username,
                                        'items-start': msg.username !== username,
                                        'mt-4': index === 0 || messages[index-1].username !== msg.username,
                                        'mt-0.5': index > 0 && messages[index-1].username === msg.username
                                    }" class="flex flex-col max-w-[85%] transition-all">
                                        
                                        <template x-if="index === 0 || messages[index-1].username !== msg.username">
                                            <span class="text-[7px] font-black uppercase tracking-tighter mb-1 px-1 flex gap-2"
                                                  :class="msg.username === 'DIRECTORATE' ? 'text-gold' : 'text-zinc-500'">
                                                <span x-text="msg.username"></span>
                                                <span class="opacity-0 group-hover:opacity-100 transition-opacity text-[6px]" 
                                                      x-text="new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})"></span>
                                            </span>
                                        </template>

                                        <div :class="{
                                            'bg-gold text-black rounded-tr-none shadow-[0_0_15px_rgba(212,175,55,0.2)] directorate-msg': msg.username === 'DIRECTORATE',
                                            'bg-white/10 text-white rounded-tr-none border-r-2 border-gold': msg.username === username && msg.username !== 'DIRECTORATE',
                                            'bg-zinc-900 text-zinc-300 rounded-tl-none border-l border-white/5': msg.username !== username && msg.username !== 'DIRECTORATE'
                                        }" class="p-3 px-4 rounded-2xl text-[11px] leading-relaxed break-words font-medium tracking-wide" x-text="msg.content"></div>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <form @submit.prevent="send()" class="p-4 bg-noir/50 border-t border-gold/10 flex gap-2">
                            <input x-model="msgInput" placeholder="TRANSMIT_SIGNAL..." class="flex-grow bg-white/5 p-4 rounded-2xl text-[11px] text-white outline-none focus:bg-white/10 transition-all terminal-font uppercase">
                            <button type="submit" class="bg-gold text-black px-6 rounded-2xl active:scale-90 transition-all shadow-lg"><i data-lucide="zap" size="18"></i></button>
                        </form>
                    </div>

                    <div x-show="subView === 'audio'" class="h-full">
                        <iframe :src="streamUrl" width="100%" height="450" frameborder="0" allowtransparency="true" allow="encrypted-media" class="grayscale hover:grayscale-0 transition-all duration-700"></iframe>
                    </div>

                    <div x-show="subView === 'map'" class="p-10 space-y-6">
                        <h3 class="text-[10px] font-black uppercase text-white italic tracking-widest">Provincial Intelligence</h3>
                        <div class="space-y-6">
                            <template x-for="stat in provinceStats" :key="stat.province_name">
                                <div class="space-y-2">
                                    <div class="flex justify-between text-[9px] font-black uppercase"><span x-text="stat.province_name" class="text-zinc-500"></span><span x-text="stat.operative_count + ' ACTIVE'" class="text-gold"></span></div>
                                    <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden"><div class="h-full bg-gold transition-all duration-1000" :style="`width: ${Math.min(stat.operative_count * 10, 100)}%` "></div></div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div x-show="subView === 'charts'" class="p-6 space-y-4">
                        <template x-for="(track, index) in tracks" :key="track.id">
                            <div class="flex items-center justify-between bg-white/5 p-5 rounded-3xl border border-white/5">
                                <div class="flex items-center gap-6">
                                    <span class="text-2xl font-black italic opacity-20 terminal-font" x-text="index + 1"></span>
                                    <div><p class="text-[11px] font-black text-white uppercase" x-text="track.title"></p><p class="text-[8px] text-gold/50 font-bold" x-text="track.artist"></p></div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="text-[9px] font-black" x-text="track.votes"></span>
                                    <button @click="vote(track.id)" class="p-3 bg-gold/10 text-gold rounded-full"><i data-lucide="arrow-big-up" size="18"></i></button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <footer class="glass p-10 rounded-[3rem] space-y-10">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black uppercase tracking-widest text-white">Social Uplink</h4>
                            <div class="flex flex-wrap gap-6">
                                <a href="https://www.facebook.com/share/1AiqRtLxeo/" target="_blank" class="social-hover"><i data-lucide="facebook"></i></a>
                                <a href="https://tiktok.com/@ministryofgroove" target="_blank" class="social-hover"><i data-lucide="music-2"></i></a>
                                <a href="https://www.instagram.com/ministryofgroove_hq?igsh=Y3Rwc24zcmtsY2xj" target="_blank" class="social-hover"><i data-lucide="instagram"></i></a>
                                <a href="https://www.youtube.com/@MinistryofGroove-m1q" target="_blank" class="social-hover"><i data-lucide="youtube"></i></a>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-[10px] font-black uppercase tracking-widest text-white">Directorate Contact</h4>
                            <div class="space-y-2">
                                <a href="mailto:director.mog@gmail.com" class="flex items-center gap-3 text-[11px] text-zinc-400 hover:text-gold transition-colors">
                                    <i data-lucide="mail" size="14"></i> director.mog@gmail.com
                                </a>
                                <a href="https://wa.me/27813874921" class="flex items-center gap-3 text-[11px] text-zinc-400 hover:text-gold transition-colors">
                                    <i data-lucide="message-circle" size="14"></i> +27 81 387 4921
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="pt-8 border-t border-white/5 text-center">
                        <p class="text-[7px] font-black uppercase tracking-[0.5em] opacity-40">© 2026 Ministry of Groove. All Rights Reserved.</p>
                    </div>
                </footer>

            </main>
        </div>
    </template>

    <script>
        function ministry() {
            return {
                view: 'auth', subView: 'chat', username: '', province: 'DETECTING...',
                messages: [], msgInput: '', handleInput: '', 
                provinceStats: [], tracks: [], newsItems: [], streamUrl: '',
                sastTime: '', hasDM: false, latestDM: '',

                async init() {
                    const saved = localStorage.getItem('mog_handle');
                    if(saved) { 
                        this.username = saved; 
                        this.view = 'grid';
                        this.updateTime();
                        this.syncAll();
                        this.subscribe();
                        setInterval(() => { this.updateTime(); this.updatePresence(); this.syncAll(); }, 30000);
                        setInterval(() => this.updateTime(), 1000);
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                updateTime() {
                    this.sastTime = new Date().toLocaleTimeString('en-ZA', { timeZone: 'Africa/Johannesburg', hour12: false });
                },

                scrollToBottom(force = false) {
                    const el = document.getElementById('chat-stream');
                    if (!el) return;
                    setTimeout(() => {
                        el.scrollTo({ top: el.scrollHeight, behavior: force ? 'smooth' : 'auto' });
                    }, 50);
                },

                async syncAll() {
                    const [msg, stats, trks, news, strm] = await Promise.all([
                        mog_sb.from('messages').select('*').order('created_at', { ascending: true }).limit(50),
                        mog_sb.rpc('get_province_stats'),
                        mog_sb.from('chart_tracks').select('*').order('votes', { ascending: false }),
                        mog_sb.from('broadcasts').select('*').order('created_at', { ascending: false }).limit(5),
                        mog_sb.from('stream_config').select('*').single()
                    ]);
                    this.messages = msg.data || [];
                    this.provinceStats = stats.data || [];
                    this.tracks = trks.data || [];
                    this.newsItems = news.data || [];
                    this.streamUrl = strm.data?.playlist_url;
                    if(this.messages.length > 0) this.scrollToBottom();
                    this.detectLocation();
                },

                subscribe() {
                    mog_sb.channel('global')
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                            this.messages.push(p.new);
                            this.scrollToBottom(true);
                        })
                        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `recipient=eq.${this.username}` }, p => {
