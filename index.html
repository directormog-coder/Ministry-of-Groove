<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER v3.0</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <style>
        /* FULL RESTORATION OF ORIGINAL CUSTOM CSS */
        [x-cloak] { display: none !important; }
        .bg-grid { background-image: radial-gradient(circle, #D4AF37 1px, transparent 1px); background-size: 30px 30px; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .glass-strong { background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .terminal-font { font-family: 'Courier New', Courier, monospace; }
        .mog-logo-container { perspective: 1000px; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .circuit-vignette { position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.8) 100%); pointer-events: none; z-index: 5; }
        .bg-circuit-pattern { position: fixed; inset: 0; opacity: 0.05; background-image: url('assets/images/circuit.svg'); z-index: 1; pointer-events: none; }
        .audio-bar { width: 3px; height: 100%; background: #D4AF37; animation: audio-bounce 1s infinite ease-in-out; }
        @keyframes audio-bounce { 0%, 100% { height: 20%; } 50% { height: 100%; } }
        .loader { width: 24px; height: 24px; border: 3px solid #D4AF37; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        
        let sb = null;
        
        function ministry() {
            return {
                // VIEW STATES
                view: 'auth', subView: 'chat', authMode: 'login',
                
                // OPERATIVE DATA
                username: '', emailInput: '', passwordInput: '', confirmPassword: '', handleInput: '',
                isDirector: false, userStatus: 'online',

                // SYSTEM UI STATES
                isLoading: false, errorMsg: '', isOnline: navigator.onLine,
                soundEnabled: true, darkMode: true, showSettings: false,

                // CHAT/GRID LOGIC
                messages: [], msgInput: '', typingUsers: [], unreadCount: 0,

                // MEDIA & ASSETS
                galleryItems: [], selectedImage: null, isUploading: false,
                uploadProgress: 0, totalStorage: 0,

                // VOICE & ENCRYPTION
                showVoiceRecorder: false, isRecording: false, recordingTime: '00:00',
                showEncryptionModal: false, encryptionPassword: '',

                // MUSIC ENGINE
                amapianoChart: [], totalVotes: 0, nowPlaying: null, isPlaying: false, playbackProgress: 0,

                // BROADCASTS
                showDirectorConsole: false, globalAlertInput: '', activeBroadcast: null,

                // SYSTEM META
                currentTime: '', sessionDuration: '00:00', sessionStart: null, weatherStatus: 'CONNECTION ENCRYPTED',

                async init() {
                    console.log('📡 Ministry Uplink Initializing...');
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    
                    const { data: { session } } = await sb.auth.getSession();
                    if (session) this.setupUser(session.user);

                    setInterval(() => { this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); }, 1000);
                    this.subscribeToBroadcasts();
                    
                    window.addEventListener('online', () => { this.isOnline = true; });
                    window.addEventListener('offline', () => { this.isOnline = false; });
                    
                    this.$watch('view', () => this.$nextTick(() => { if (window.lucide) lucide.createIcons(); }));
                },

                setupUser(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid';
                    this.sessionStart = Date.now();
                    this.loadAmapianoChart();
                    this.loadMessages();
                    this.loadGallery();
                    this.subscribeToMessages();
                    
                    setInterval(() => {
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);
                },

                async loginWithGoogle() {
                    this.isLoading = true;
                    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } });
                },

                async loginUser() {
                    if (!this.emailInput.trim() || !this.passwordInput) { this.errorMsg = 'ENTER CREDENTIALS'; return; }
                    this.isLoading = true;
                    this.errorMsg = '';
                    const { data, error } = await sb.auth.signInWithPassword({ email: this.emailInput.trim(), password: this.passwordInput });
                    if (error) this.errorMsg = "INVALID OPERATIVE CREDENTIALS";
                    else this.setupUser(data.user);
                    this.isLoading = false;
                },

                async registerUser() {
                    if (this.passwordInput !== this.confirmPassword) { this.errorMsg = 'KEY MISMATCH'; return; }
                    this.isLoading = true;
                    const { data, error } = await sb.auth.signUp({ 
                        email: this.emailInput.trim(), password: this.passwordInput, 
                        options: { data: { handle: this.handleInput } } 
                    });
                    if (error) this.errorMsg = error.message.toUpperCase();
                    else { this.authMode = 'login'; this.errorMsg = 'UPLINK CREATED. LOGIN.'; }
                    this.isLoading = false;
                },

                async sendBroadcast() {
                    if (!this.globalAlertInput.trim()) return;
                    await sb.from('broadcasts').insert({ content: this.globalAlertInput, created_by: this.username });
                    this.showDirectorConsole = false; this.globalAlertInput = '';
                },

                subscribeToBroadcasts() {
                    sb.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                        this.activeBroadcast = payload.new.content;
                        setTimeout(() => { this.activeBroadcast = null; }, 15000);
                    }).subscribe();
                },

                async loadAmapianoChart() {
                    const { data } = await sb.from('amapiano_chart').select('*').order('votes', { ascending: false });
                    if (data) this.amapianoChart = data;
                },

                async loadMessages() {
                    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: true });
                    if (data) { this.messages = data; this.scrollToBottom(); }
                },

                subscribeToMessages() {
                    sb.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new); this.scrollToBottom();
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    await sb.from('messages').insert({ username: this.username, content: this.msgInput });
                    this.msgInput = '';
                },

                async loadGallery() {
                    const { data } = await sb.from('gallery').select('*').order('created_at', { ascending: false });
                    if (data) this.galleryItems = data;
                },

                playPreview(song) { 
                    this.nowPlaying = song; this.isPlaying = true; this.playbackProgress = 0;
                    if(this.audioInterval) clearInterval(this.audioInterval);
                    this.audioInterval = setInterval(() => { if(this.isPlaying && this.playbackProgress < 100) this.playbackProgress += 0.5; }, 100);
                },

                logout() { sb.auth.signOut(); window.location.reload(); },
                scrollToBottom() { this.$nextTick(() => { if(this.$refs.chatContainer) this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight; }); }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <template x-if="activeBroadcast">
        <div class="fixed top-0 left-0 right-0 z-[500] bg-red-600 p-5 text-center font-black uppercase animate-pulse border-b-4 border-white shadow-2xl">
            <div class="flex items-center justify-center gap-6">
                <i data-lucide="shield-alert" class="w-8 h-8"></i>
                <span class="tracking-[0.5em] text-lg" x-text="activeBroadcast"></span>
                <i data-lucide="shield-alert" class="w-8 h-8"></i>
            </div>
        </div>
    </template>

    <div x-show="showVoiceRecorder" class="fixed inset-0 z-[400] flex items-center justify-center p-6 bg-black/95 animate-fade-in">
        <div class="glass max-w-sm w-full p-10 rounded-[3rem] border border-gold/30 text-center shadow-2xl shadow-gold/5">
            <h3 class="text-xl font-black uppercase tracking-[0.3em] text-white mb-8 italic">Voice Transmission</h3>
            <div class="flex justify-center mb-10 h-16 gap-1">
                <template x-if="isRecording">
                    <div class="flex items-end gap-1 h-full"><div class="audio-bar"></div><div class="audio-bar" style="animation-delay: 0.2s"></div><div class="audio-bar" style="animation-delay: 0.4s"></div><div class="audio-bar" style="animation-delay: 0.1s"></div></div>
                </template>
                <i x-show="!isRecording" data-lucide="mic" class="w-16 h-16 text-gold/20"></i>
            </div>
            <div x-show="isRecording" class="text-gold font-black text-3xl mb-8 terminal-font" x-text="recordingTime"></div>
            <div class="flex gap-4 justify-center">
                <button @click="isRecording = !isRecording" :class="isRecording ? 'bg-red-600' : 'bg-gold'" class="w-20 h-20 rounded-full flex items-center justify-center shadow-xl transition-all active:scale-90">
                    <i :data-lucide="isRecording ? 'square' : 'mic'" class="w-8 h-8 text-black"></i>
                </button>
            </div>
            <button @click="showVoiceRecorder = false" class="mt-10 text-[10px] text-zinc-600 uppercase font-black tracking-widest hover:text-white transition-colors">Abort Transmission</button>
        </div>
    </div>

    <template x-if="view === 'auth'">
        <div class="h-screen flex flex-col items-center justify-center p-8 text-center z-20 relative animate-fade-in">
            <div class="mog-logo-container mb-12">
                <img src="assets/images/logo.png" class="w-48 h-48 object-contain" onerror="this.outerHTML='<h1 class=\'text-6xl font-black text-gold\'>MOG</h1>'">
            </div>
            
            <div x-show="authMode === 'login'" class="w-full max-w-md space-y-6 animate-slide-up">
                <div class="space-y-2 mb-10">
                    <h2 class="text-white font-black uppercase tracking-[0.5em] text-xs italic">Ministry of Groove</h2>
                    <p class="text-gold/40 text-[8px] uppercase font-black tracking-widest">NCC Master System Uplink</p>
                </div>
                
                <div class="space-y-4">
                    <input x-model="emailInput" type="email" placeholder="OPERATIVE EMAIL" class="w-full bg-black/60 border border-white/10 p-6 rounded-3xl text-center outline-none uppercase text-[11px] focus:border-gold transition-all terminal-font">
                    <input x-model="passwordInput" type="password" placeholder="PASSWORD" class="w-full bg-black/60 border border-white/10 p-6 rounded-3xl text-center outline-none uppercase text-[11px] focus:border-gold transition-all terminal-font" @keyup.enter="loginUser()">
                    
                    <button @click="loginUser()" :disabled="isLoading" class="w-full py-6 bg-gold text-black font-black uppercase rounded-full shadow-2xl shadow-gold/20 active:scale-95 transition-all text-sm tracking-widest">
                        <span x-show="!isLoading">Initialize Uplink</span>
                        <div x-show="isLoading" class="loader"></div>
                    </button>
                    
                    <button @click="loginWithGoogle()" class="w-full py-5 bg-white/5 border border-white/10 text-white text-[10px] font-bold uppercase rounded-full flex items-center justify-center gap-3 hover:bg-white/10 transition-all">
                        <i data-lucide="chrome" class="w-4 h-4 text-gold"></i> Sign in with Google
                    </button>
                </div>
                
                <div class="pt-8">
                    <button @click="authMode = 'register'" class="text-gold/40 text-[10px] uppercase font-black tracking-[0.3em] hover:text-gold transition-colors underline decoration-gold/20 underline-offset-8">Register New Clearance</button>
                </div>
                <p x-show="errorMsg" x-text="errorMsg" class="mt-8 text-red-500 text-[10px] font-black tracking-[0.2em] bg-red-500/10 py-3 px-8 rounded-full border border-red-500/30"></p>
            </div>
            
            <div x-show="authMode === 'register'" class="w-full max-w-md space-y-6 animate-slide-up" x-transition>
                <h2 class="text-white font-black uppercase italic text-sm mb-8 tracking-widest">New Clearance Enrollment</h2>
                <div class="space-y-4">
                    <input x-model="handleInput" type="text" placeholder="OPERATIVE HANDLE" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[11px] focus:border-gold transition-all">
                    <input x-model="emailInput" type="email" placeholder="EMAIL ADDRESS" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[11px] focus:border-gold transition-all">
                    <input x-model="passwordInput" type="password" placeholder="CREATE KEY" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[11px] focus:border-gold transition-all">
                    <input x-model="confirmPassword" type="password" placeholder="CONFIRM KEY" class="w-full bg-black/60 border border-white/10 p-5 rounded-2xl text-center outline-none uppercase text-[11px] focus:border-gold transition-all">
                </div>
                <button @click="registerUser()" class="w-full py-6 bg-white text-black font-black uppercase rounded-full text-xs tracking-widest shadow-2xl">Confirm Enrollment</button>
                <button @click="authMode = 'login'" class="text-white/40 text-[9px] uppercase font-black tracking-widest pt-4">Return to Uplink</button>
            </div>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col z-20 relative pb-32">
            
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-[100] shadow-2xl">

                    </div>
                </div>

                    <div class="hidden sm:block text-right mr-4 border-r border-white/10 pr-4">
                        <p class="text-[12px] font-black terminal-font text-white" x-text="currentTime"></p>
                        <p class="text-[7px] text-gold/40 uppercase font-black tracking-widest" x-text="weatherStatus"></p>
                    </div>
                    <button x-show="isDirector" @click="showDirectorConsole = true" class="p-4 border border-red-500/40 text-red-500 rounded-2xl hover:bg-red-500/10 transition-all active:scale-90">
                        <i data-lucide="radio" class="w-5 h-5"></i>
                    </button>
                    <button @click="logout()" class="p-4 border border-white/5 text-zinc-600 rounded-2xl hover:text-red-500 transition-all active:scale-90">
                        <i data-lucide="power" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <main class="p-4 md:p-8 space-y-8 max-w-7xl mx-auto w-full">
                
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-500 bg-blue-500/10 shadow-[0_0_30px_rgba(59,130,246,0.15)] scale-105' : 'border-white/10 opacity-60 hover:opacity-100'" class="glass p-10 rounded-[3rem] text-center cursor-pointer border transition-all duration-500 group">
                        <div class="w-16 h-16 bg-blue-500/10 rounded-3xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                            <i data-lucide="message-square" class="text-blue-400 w-8 h-8"></i>
                        </div>
                        <span class="text-[11px] font-black uppercase text-white tracking-[0.3em] block">Command Grid</span>
                    </div>
                    
                    <div onclick="window.location.href='dossier.html'" class="glass p-10 rounded-[3rem] text-center border border-white/10 cursor-pointer hover:border-green-400/50 hover:scale-105 transition-all duration-500 group opacity-60 hover:opacity-100">
                        <div class="w-16 h-16 bg-green-500/10 rounded-3xl flex items-center justify-center mx-auto mb-4 group-hover:rotate-12 transition-transform">
                            <i data-lucide="user-cog" class="text-green-400 w-8 h-8"></i>
                        </div>
                        <span class="text-[11px] font-black uppercase text-white tracking-[0.3em] block">Operative Dossier</span>
                    </div>

                    <div @click="subView = 'gallery'" :class="subView === 'gallery' ? 'border-purple-500 bg-purple-500/10 shadow-[0_0_30px_rgba(168,85,247,0.15)] scale-105' : 'border-white/10 opacity-60 hover:opacity-100'" class="glass p-10 rounded-[3rem] text-center cursor-pointer border transition-all duration-500 group">
                        <div class="w-16 h-16 bg-purple-500/10 rounded-3xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                            <i data-lucide="camera" class="text-purple-400 w-8 h-8"></i>
                        </div>
                        <span class="text-[11px] font-black uppercase text-white tracking-[0.3em] block">Media Gallery</span>
                    </div>

                    <div onclick="window.location.href='archives.html'" class="glass p-10 rounded-[3rem] text-center border border-white/10 cursor-pointer hover:border-gold hover:scale-105 transition-all duration-500 group opacity-60 hover:opacity-100">
                        <div class="w-16 h-16 bg-gold/10 rounded-3xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                            <i data-lucide="database" class="text-gold w-8 h-8"></i>
                        </div>
                        <span class="text-[11px] font-black uppercase text-white tracking-[0.3em] block">Classified Vault</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="grid grid-cols-1 lg:grid-cols-3 gap-8 animate-slide-up">
                    
                    <div class="lg:col-span-1 space-y-6">
                        <div class="glass p-8 rounded-[3rem] border border-gold/20 shadow-2xl relative overflow-hidden">
                            <div class="flex items-center justify-between mb-10">
                                <div class="flex items-center gap-4">
                                    <i data-lucide="music" class="w-6 h-6 text-gold"></i>
                                    <h3 class="text-sm font-black uppercase tracking-widest text-white italic">Amapiano Top 10</h3>
                                </div>
                                <p class="text-2xl font-black text-gold terminal-font" x-text="totalVotes.toLocaleString()"></p>
                            </div>
                            <div class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                                <template x-for="(song, index) in amapianoChart" :key="song.id">
                                    <div @click="playPreview(song)" :class="nowPlaying?.id === song.id ? 'bg-gold/10 border-gold/30' : 'bg-white/5 border-white/5'" class="p-5 rounded-2xl flex items-center justify-between hover:bg-white/10 cursor-pointer border transition-all group">

                                <span class="text-[11px] font-black uppercase tracking-[0.2em] italic">Command Grid Uplink</span>
                            </div>
                            <div class="flex gap-6">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="users" class="w-4 h-4 text-zinc-500"></i>
                                    <span class="text-[10px] font-bold text-zinc-400" x-text="onlineCount"></span>
                                </div>
                                <button @click="messages = []" class="text-[9px] text-zinc-600 uppercase font-black hover:text-red-500 transition-colors tracking-widest">Wipe Log</button>
                            </div>
                        </div>

                        <div class="flex-grow overflow-y-auto p-6 md:p-10 space-y-6 custom-scrollbar" x-ref="chatContainer">
                            <template x-for="msg in messages" :key="msg.id">
                                <div :class="msg.username === username ? 'ml-auto text-right items-end' : 'mr-auto text-left items-start'" class="flex flex-col gap-2 max-w-[85%]">
                                    <div class="flex items-center gap-3">
