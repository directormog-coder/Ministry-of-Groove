<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
    
    <!-- CRITICAL: Initialize Supabase and Alpine Data -->
    <script>
        // Initialize Supabase Client - REPLACE WITH YOUR ACTUAL CREDENTIALS
        const SUPABASE_URL = 'https://your-project.supabase.co'; // REPLACE THIS
        const SUPABASE_ANON_KEY = 'your-anon-key-here'; // REPLACE THIS
        
        let supabaseClient = null;
        
        // Ministry App Logic
        function ministry() {
            return {
                // View State
                view: 'auth',
                subView: 'chat',
                authMode: 'login',
                
                // User Data
                username: '',
                emailInput: '',
                passwordInput: '',
                confirmPassword: '',
                handleInput: '',
                userStatus: 'online',
                isDirector: false,
                
                // UI State
                isLoading: false,
                errorMsg: '',
                isOnline: navigator.onLine,
                soundEnabled: true,
                darkMode: true,
                notifications: true,
                showSettings: false,
                
                // Chat State
                messages: [],
                msgInput: '',
                typingUsers: [],
                unreadCount: 0,
                onlineCount: 0,
                
                // Gallery State
                galleryItems: [],
                selectedImage: null,
                isUploading: false,
                uploadProgress: 0,
                totalStorage: 0,
                
                // Voice Recording
                showVoiceRecorder: false,
                isRecording: false,
                recordingTime: '00:00',
                recordedBlob: null,
                
                // Encryption
                showEncryptionModal: false,
                encryptionPassword: '',
                pendingFile: null,
                
                // Private Messages
                showPrivateModal: false,
                privateMessageRecipient: '',
                privateMsgInput: '',
                
                // Amapiano Chart
                amapianoChart: [],
                totalVotes: 0,
                currentPlaying: null,
                nowPlaying: null,
                isPlaying: false,
                playbackProgress: 0,
                
                // Time/Weather
                currentTime: '',
                weatherStatus: 'SECURE CONNECTION',
                sessionDuration: '00:00',
                sessionStart: null,
                
                // Initialization
                async init() {
                    console.log('🎛️ Ministry of Groove System Initializing...');
                    
                    // Initialize Supabase
                    try {
                        if (typeof supabase !== 'undefined') {
                            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                            console.log('✅ Supabase Connected');
                        } else {
                            console.warn('⚠️ Supabase library not loaded');
                            this.showToast('Offline Mode - Supabase not connected', 'warning');
                        }
                    } catch (e) {
                        console.error('❌ Supabase Init Error:', e);
                        this.showToast('Connection Error - Check console', 'error');
                    }
                    
                    // Check for existing session
                    await this.checkSession();
                    
                    // Setup online/offline detection
                    window.addEventListener('online', () => {
                        this.isOnline = true;
                        this.showToast('Back Online', 'success');
                    });
                    window.addEventListener('offline', () => {
                        this.isOnline = false;
                        this.showToast('Offline Mode', 'warning');
                    });
                    
                    // Start clock
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    
                    // Initialize Lucide icons
                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                    
                    // Load initial data if authenticated
                    if (this.view !== 'auth') {
                        await this.loadMessages();
                        await this.loadGallery();
                        this.loadAmapianoChart();
                    }
                    
                    console.log('✅ System Ready');
                },
                
                // Session Management
                async checkSession() {
                    if (!supabaseClient) return;
                    
                    try {
                        const { data: { session }, error } = await supabaseClient.auth.getSession();
                        if (error) throw error;
                        
                        if (session) {
                            this.username = session.user.email.split('@')[0];
                            this.isDirector = session.user.email === 'director.mog@gmail.com';
                            this.view = 'grid';
                            this.sessionStart = Date.now();
                            this.startSessionTimer();
                            
                            // Subscribe to realtime
                            this.subscribeToMessages();
                        }
                    } catch (e) {
                        console.error('Session check failed:', e);
                    }
                },
                
                // Authentication Methods
                async loginUser() {
                    if (!this.emailInput || !this.passwordInput) {
                        this.errorMsg = 'ENTER CREDENTIALS';
                        return;
                    }
                    
                    this.isLoading = true;
                    this.errorMsg = '';
                    
                    try {
                        if (!supabaseClient) {
                            throw new Error('Supabase not initialized - check your URL and Key');
                        }
                        
                        const { data, error } = await supabaseClient.auth.signInWithPassword({
                            email: this.emailInput.toLowerCase().trim(),
                            password: this.passwordInput
                        });
                        
                        if (error) throw error;
                        
                        // Success
                        this.username = data.user.email.split('@')[0];
                        this.isDirector = data.user.email === 'director.mog@gmail.com';
                        this.view = 'grid';
                        this.passwordInput = '';
                        this.sessionStart = Date.now();
                        this.startSessionTimer();
                        
                        this.showToast(`Welcome Operative ${this.username}`, 'success');
                        
                        // Load data
                        await this.loadMessages();
                        await this.loadGallery();
                        this.subscribeToMessages();
                        
                    } catch (error) {
                        console.error('Login Error:', error);
                        this.errorMsg = this.getErrorMessage(error);
                        this.showToast(this.errorMsg, 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async registerUser() {
                    if (!this.emailInput || !this.passwordInput || !this.handleInput) {
                        this.errorMsg = 'ALL FIELDS REQUIRED';
                        return;
                    }
                    
                    if (this.passwordInput !== this.confirmPassword) {
                        this.errorMsg = 'PASSWORDS DO NOT MATCH';
                        return;
                    }
                    
                    if (this.passwordInput.length < 6) {
                        this.errorMsg = 'PASSWORD MIN 6 CHARACTERS';
                        return;
                    }
                    
                    this.isLoading = true;
                    this.errorMsg = '';
                    
                    try {
                        if (!supabaseClient) {
                            throw new Error('Supabase not initialized');
                        }
                        
                        const { data, error } = await supabaseClient.auth.signUp({
                            email: this.emailInput.toLowerCase().trim(),
                            password: this.passwordInput,
                            options: {
                                data: {
                                    handle: this.handleInput,
                                    role: this.emailInput === 'director.mog@gmail.com' ? 'director' : 'operative'
                                }
                            }
                        });
                        
                        if (error) throw error;
                        
                        this.showToast('Registration Successful - Check Email', 'success');
                        this.authMode = 'login';
                        this.errorMsg = 'CHECK EMAIL FOR CONFIRMATION';
                        
                    } catch (error) {
                        console.error('Registration Error:', error);
                        this.errorMsg = this.getErrorMessage(error);
                        this.showToast(this.errorMsg, 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },
                
                async logout() {
                    if (supabaseClient) {
                        await supabaseClient.auth.signOut();
                    }
                    this.view = 'auth';
                    this.username = '';
                    this.isDirector = false;
                    this.messages = [];
                    this.showToast('Logged Out', 'info');
                },
                
                // Error Handler
                getErrorMessage(error) {
                    if (!navigator.onLine) return 'NO NETWORK CONNECTION';
                    if (error.message.includes('Failed to fetch')) return 'CANNOT CONNECT TO SERVER - CHECK SUPABASE CONFIG';
                    if (error.message.includes('Invalid login')) return 'INVALID CREDENTIALS';
                    if (error.message.includes('Email not confirmed')) return 'EMAIL NOT CONFIRMED';
                    return error.message.toUpperCase();
                },
                
                // Data Loading
                async loadMessages() {
                    if (!supabaseClient) return;
                    
                    try {
                        const { data, error } = await supabaseClient
                            .from('messages')
                            .select('*')
                            .order('created_at', { ascending: true })
                            .limit(100);
                            
                        if (error) throw error;
                        this.messages = data || [];
                    } catch (e) {
                        console.error('Load messages failed:', e);
                    }
                },
                
                async loadGallery() {
                    if (!supabaseClient) return;
                    
                    try {
                        const { data, error } = await supabaseClient
                            .from('gallery')
                            .select('*')
                            .order('created_at', { ascending: false });
                            
                        if (error) throw error;
                        this.galleryItems = data || [];
                        this.calculateStorage();
                    } catch (e) {
                        console.error('Load gallery failed:', e);
                    }
                },
                
                loadAmapianoChart() {
                    // Sample data - replace with your actual data source
                    this.amapianoChart = [
                        { id: 1, title: 'Amazwe', artist: 'Mthunzi ft. MaWhoo', votes: 1240, userVoted: false },
                        { id: 2, title: 'Imithandazo', artist: 'Kabza De Small & Mthunzi', votes: 1180, userVoted: false },
                        { id: 3, title: 'Uku Khula', artist: 'Toss', votes: 950, userVoted: false },
                        { id: 4, title: 'Khusela', artist: 'K.O ft. Nandi Madida', votes: 890, userVoted: false },
                        { id: 5, title: 'Adiwele', artist: 'Young Stunna', votes: 840, userVoted: false }
                    ];
                    this.totalVotes = this.amapianoChart.reduce((a, b) => a + b.votes, 0);
                },
                
                // Realtime Subscription
                subscribeToMessages() {
                    if (!supabaseClient) return;
                    
                    supabaseClient
                        .channel('public:messages')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, payload => {
                            if (payload.eventType === 'INSERT') {
                                this.messages.push(payload.new);
                                this.scrollToBottom();
                            }
                        })
                        .subscribe();
                },
                
                // Messaging
                async sendMessage() {
                    if (!this.msgInput.trim() || !supabaseClient) return;
                    
                    try {
                        const { error } = await supabaseClient
                            .from('messages')
                            .insert({
                                username: this.username,
                                content: this.msgInput,
                                created_at: new Date().toISOString()
                            });
                            
                        if (error) throw error;
                        this.msgInput = '';
                    } catch (e) {
                        this.showToast('Failed to send message', 'error');
                    }
                },
                
                // Voice Recording
                startRecording() {
                    this.isRecording = true;
                    this.recordingTime = '00:00';
                    // Implement actual recording logic here
                },
                
                stopRecording() {
                    this.isRecording = false;
                },
                
                cancelRecording() {
                    this.isRecording = false;
                    this.recordedBlob = null;
                },
                
                // Upload
                async uploadImage(event) {
                    // Implementation here
                },
                
                prepareEncryptedUpload(event) {
                    // Implementation here
                },
                
                // Utilities
                updateTime() {
                    const now = new Date();
                    this.currentTime = now.toLocaleTimeString('en-US', { hour12: false });
                },
                
                startSessionTimer() {
                    setInterval(() => {
                        if (this.sessionStart) {
                            const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                            const mins = Math.floor(diff / 60).toString().padStart(2, '0');
                            const secs = (diff % 60).toString().padStart(2, '0');
                            this.sessionDuration = `${mins}:${secs}`;
                        }
                    }, 1000);
                },
                
                formatTime(dateString) {
                    return new Date(dateString).toLocaleTimeString('en-US', { 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: false 
                    });
                },
                
                formatDate(dateString) {
                    return new Date(dateString).toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric'
                    });
                },
                
                formatBytes(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                },
                
                calculateStorage() {
                    this.totalStorage = this.galleryItems.reduce((acc, item) => acc + (item.size || 0), 0);
                },
                
                scrollToBottom() {
                    this.$nextTick(() => {
                        const container = this.$refs.chatContainer;
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                },
                
                showToast(message, type = 'info') {
                    // Toast implementation
                    console.log(`[${type.toUpperCase()}] ${message}`);
                },
                
                toggleSound() {
                    this.soundEnabled = !this.soundEnabled;
                },
                
                toggleTheme() {
                    this.darkMode = !this.darkMode;
                },
                
                savePreferences() {
                    // Save to localStorage
                },
                
                // Chart functions
                playPreview(song) {
                    this.nowPlaying = song;
                    this.isPlaying = true;
                },
                
                togglePlay() {
                    this.isPlaying = !this.isPlaying;
                },
                
                skipTrack(direction) {
                    // Implementation
                },
                
                voteForSong(id) {
                    const song = this.amapianoChart.find(s => s.id === id);
                    if (song && !song.userVoted) {
                        song.votes++;
                        song.userVoted = true;
                        this.totalVotes++;
                    }
                },
                
                // Private messages
                openPrivateMessage(user) {
                    this.privateMessageRecipient = user;
                    this.showPrivateModal = true;
                },
                
                sendPrivateMessage() {
                    // Implementation
                    this.showPrivateModal = false;
                    this.privateMsgInput = '';
                },
                
                // Encryption
                confirmEncryption() {
                    this.showEncryptionModal = false;
                    // Process encrypted upload
                },
                
                decryptFile(msg) {
                    // Implementation
                },
                
                clearChat() {
                    this.messages = [];
                },
                
                onTyping() {
                    // Typing indicator logic
                },
                
                deleteImage(id) {
                    // Implementation
                },
                
                playVoiceMessage(url) {
                    // Implementation
                }
            }
        }
    </script>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <!-- Circuit Board Background -->
    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <!-- Offline Banner -->
    <div class="offline-banner" :class="{ 'show': !isOnline }">
        OFFLINE MODE - MESSAGES SAVED LOCALLY
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Image Modal -->
    <div x-show="selectedImage" class="image-modal" :class="{ 'active': selectedImage }" @click="selectedImage = null">
        <img :src="selectedImage" @click.stop alt="Full size">
    </div>

    <!-- Voice Recorder Modal -->
    <div x-show="showVoiceRecorder" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20 text-center">
            <h3 class="text-lg font-black uppercase tracking-widest text-white mb-4">Voice Transmission</h3>
            <div class="flex justify-center mb-6">
                <div class="audio-visualizer" x-show="isRecording">
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                    <div class="audio-bar"></div>
                </div>
                <div x-show="!isRecording" class="h-20 flex items-center justify-center">
                    <i data-lucide="mic" class="w-12 h-12 text-gold/50"></i>
                </div>
            </div>
            <div x-show="isRecording" class="text-gold font-black text-2xl mb-4 terminal-font" x-text="recordingTime"></div>
            <div class="flex gap-3 justify-center">
                <button x-show="!isRecording" @click="startRecording()" class="w-16 h-16 rounded-full bg-red-500 flex items-center justify-center hover:bg-red-600 transition-all hover:scale-110 animate-recording">
                    <i data-lucide="mic" class="w-8 h-8 text-white"></i>
                </button>
                <button x-show="isRecording" @click="stopRecording()" class="w-16 h-16 rounded-full bg-gold flex items-center justify-center hover:bg-yellow-400 transition-all hover:scale-110">
                    <i data-lucide="square" class="w-8 h-8 text-black"></i>
                </button>
                <button x-show="!isRecording && recordedBlob" @click="sendVoiceMessage()" class="w-16 h-16 rounded-full bg-green-500 flex items-center justify-center hover:bg-green-600 transition-all hover:scale-110">
                    <i data-lucide="send" class="w-8 h-8 text-white"></i>
                </button>
            </div>
            <button @click="showVoiceRecorder = false; cancelRecording()" class="mt-6 text-[10px] text-zinc-500 uppercase tracking-widest hover:text-white">Cancel</button>
        </div>
    </div>

    <!-- Encryption Modal -->
    <div x-show="showEncryptionModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20">
            <div class="flex items-center gap-3 mb-4">
                <i data-lucide="lock" class="w-6 h-6 text-gold"></i>
                <h3 class="text-lg font-black uppercase tracking-widest text-white">Encrypt Asset</h3>
            </div>
            <p class="text-[10px] text-zinc-400 mb-4">Set a password to encrypt this file.</p>
            <input x-model="encryptionPassword" type="password" placeholder="ENTER ENCRYPTION KEY..." class="w-full bg-black/50 border border-gold/20 p-4 rounded-xl text-[12px] text-white text-center terminal-font outline-none focus:border-gold mb-4">
            <div class="flex gap-3">
                <button @click="showEncryptionModal = false" class="flex-1 py-3 bg-white/10 text-white rounded-full text-[10px] font-black uppercase">Cancel</button>
                <button @click="confirmEncryption()" class="flex-1 py-3 bg-gold text-black rounded-full text-[10px] font-black uppercase">Encrypt & Upload</button>
            </div>
        </div>
    </div>

    <!-- Private Message Modal -->
    <div x-show="showPrivateModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20">
            <h3 class="text-lg font-black uppercase tracking-widest text-white mb-4">Private Transmission</h3>
            <p class="text-[10px] text-zinc-400 mb-4">To: <span class="text-gold" x-text="privateMessageRecipient"></span></p>
            <textarea x-model="privateMsgInput" class="w-full bg-black/50 border border-gold/20 rounded-xl p-3 text-white text-sm outline-none resize-none h-24" placeholder="Enter secure message..."></textarea>
            <div class="flex gap-3 mt-4">
                <button @click="showPrivateModal = false" class="flex-1 py-3 bg-white/10 text-white rounded-full text-[10px] font-black uppercase">Cancel</button>
                <button @click="sendPrivateMessage()" class="flex-1 py-3 bg-gold text-black rounded-full text-[10px] font-black uppercase">Send Secure</button>
            </div>
        </div>
    </div>

    <!-- Auth View -->
    <template x-if="view === 'auth'">
        <div class="h-screen w-full flex flex-col items-center justify-center p-6 text-center relative z-10">
            <div class="relative z-10 w-full max-w-md space-y-8 animate-slide-up">
                
                <!-- Logo -->
                <div class="mog-logo-container mx-auto mb-4">
                    <img src="assets/images/logo.png" alt="Ministry of Groove" class="mog-logo-img" onerror="this.style.display='none'">
                    <div x-show="!$el.querySelector('img') || $el.querySelector('img').style.display === 'none'" class="text-4xl font-black text-gold">MOG</div>
                </div>

                <div class="space-y-6">
                    <!-- Login Form -->
                    <div x-show="authMode === 'login'" class="space-y-4" x-transition>
                        <div class="space-y-2">
                            <h1 class="text-white font-black uppercase tracking-[0.3em] text-sm italic">Ministry of Groove</h1>
                            <p class="text-gold/40 text-[8px] uppercase font-black tracking-[0.2em]">Secure Authentication Required</p>
                            <p x-show="isDirector" class="text-red-500 text-[10px] uppercase tracking-widest animate-pulse">Director Access Terminal</p>
                        </div>
                        
                        <div class="space-y-3">
                            <input x-model="emailInput" type="email" placeholder="OPERATIVE@GMAIL.COM" 
                                class="w-full bg-black/60 backdrop-blur-md border border-gold/20 p-5 rounded-2xl text-[11px] text-white uppercase outline-none focus:border-gold terminal-font text-center transition-all placeholder:text-zinc-600 hover:border-gold/40">
                            
                            <input x-model="passwordInput" type="password" placeholder="PASSWORD" 
                                class="w-full bg-black/60 backdrop-blur-md border border-gold/20 p-5 rounded-2xl text-[11px] text-white uppercase outline-none focus:border-gold terminal-font text-center transition-all placeholder:text-zinc-600 hover:border-gold/40" 
                                @keyup.enter="loginUser()">
                            
                            <button @click="loginUser()" :disabled="isLoading || !emailInput || !passwordInput" 
                                class="w-full py-5 bg-gradient-to-r from-gold to-yellow-600 text-black font-black text-[11px] uppercase rounded-full shadow-lg active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 hover:shadow-gold/30 hover:from-yellow-400 hover:to-gold">
                                <span x-show="!isLoading">Initialize Access</span>
                                <div x-show="isLoading" class="loader"></div>
                            </button>
                        </div>
                        
                        <div class="pt-4 border-t border-white/10">
                            <p class="text-[10px] text-zinc-500 mb-2">New Operative?</p>
                            <button @click="authMode = 'register'" class="text-[10px] uppercase text-gold/60 tracking-widest hover:text-gold transition-colors">Register Clearance</button>
                        </div>
                    </div>

                    <!-- Register Form -->
                    <div x-show="authMode === 'register'" x-transition class="glass p-6 rounded-[2.5rem] space-y-4 border-gold/40 bg-black/60 backdrop-blur-xl">
                        <div class="space-y-2 mb-4">
                            <h2 class="text-white text-sm font-black uppercase tracking-widest italic">New Operative Registration</h2>
                            <p class="text-gold/40 text-[8px] uppercase font-black tracking-[0.2em]">Create Secure Credentials</p>
                        </div>
                        
                        <div class="space-y-3">
                            <input x-model="emailInput" type="email" placeholder="GMAIL ADDRESS" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center terminal-font outline-none focus:border-gold placeholder:text-zinc-600">
                            
                            <input x-model="handleInput" type="text" placeholder="OPERATIVE HANDLE" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center terminal-font outline-none focus:border-gold placeholder:text-zinc-600">
                            
                            <input x-model="passwordInput" type="password" placeholder="CREATE PASSWORD" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center terminal-font outline-none focus:border-gold placeholder:text-zinc-600">
                            
                            <input x-model="confirmPassword" type="password" placeholder="CONFIRM PASSWORD" class="w-full bg-black/60 border border-gold/20 p-4 rounded-xl text-[11px] text-white text-center terminal-font outline-none focus:border-gold placeholder:text-zinc-600" @keyup.enter="registerUser()">
                        </div>
                        
                        <button @click="registerUser()" :disabled="isLoading" class="w-full py-4 bg-white text-black font-black text-[11px] uppercase rounded-full hover:bg-gold transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                            <span x-show="!isLoading">Register & Initialize</span>
                            <span x-show="isLoading" class="terminal-font">PROCESSING...</span>
                        </button>
                        
                        <button @click="authMode = 'login'" class="text-[10px] uppercase text-white/40 tracking-widest hover:text-white transition-colors">← Return to Login</button>
                    </div>
                    
                    <p x-show="errorMsg" x-text="errorMsg" x-transition class="text-red-500 text-[9px] uppercase font-black animate-pulse terminal-font bg-red-500/10 py-2 px-4 rounded-full border border-red-500/20"></p>
                </div>
