    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function nccMasterEngine() {
            return {
                // --- SYSTEM STATE ---
                view: 'gate',
                authMode: 'login',
                isLoading: false,
                errorMsg: '',
                isOnline: navigator.onLine,
                currentTime: '',
                sessionStart: null,
                sessionDuration: '00:00',

                // --- AUTHENTICATION DATA ---
                emailInput: '',
                passwordInput: '',
                confirmPassword: '',
                handleInput: '',
                username: '',
                isDirector: false,

                // --- GRID NAVIGATION ---
                subView: 'grid', // grid | chat
                activeBroadcast: null,
                operatives: [],

                // --- CHAT SYSTEM ---
                messages: [],
                msgInput: '',

                // --- AUDIO ENGINE ---
                isPlaying: false,
                nowPlaying: null,

                async init() {
                    console.log("NCC MASTER: INITIALIZING ENGINE...");
                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    
                    // Initial Session Audit
                    const { data: { session } } = await sb.auth.getSession();
                    if (session) { 
                        this.setupUser(session.user); 
                    } else { 
                        this.view = 'auth'; 
                    }

                    // System Heartbeat
                    setInterval(() => { 
                        this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false }); 
                    }, 1000);

                    // Global Event Listeners
                    this.subscribeToBroadcasts();
                    this.loadSocialHub();
                    
                    this.$watch('view', () => this.$nextTick(() => lucide.createIcons()));
                    window.addEventListener('online', () => this.isOnline = true);
                    window.addEventListener('offline', () => this.isOnline = false);
                },

                setupUser(user) {
                    this.username = user.user_metadata.handle || user.email.split('@')[0];
                    this.isDirector = user.email === 'director.mog@gmail.com';
                    this.view = 'grid'; 
                    this.sessionStart = Date.now();
                    
                    // Initialize Data Streams
                    this.loadMessages();
                    this.subscribeToMessages();
                    
                    // Session Timer
                    setInterval(() => {
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        const mins = Math.floor(diff/60).toString().padStart(2,'0');
                        const secs = (diff%60).toString().padStart(2,'0');
                        this.sessionDuration = `${mins}:${secs}`;
                    }, 1000);
                },

                // --- AUTHENTICATION METHODS ---
                async loginWithGoogle() {
                    this.isLoading = true;
                    const { error } = await sb.auth.signInWithOAuth({ 
                        provider: 'google', 
                        options: { redirectTo: window.location.origin + '/index.html' } 
                    });
                    if (error) { this.errorMsg = "G-AUTH_ERROR: " + error.message; this.isLoading = false; }
                },

                async loginUser() {
                    if (!this.emailInput || !this.passwordInput) return;
                    this.isLoading = true; this.errorMsg = '';
                    const { data, error } = await sb.auth.signInWithPassword({ 
                        email: this.emailInput.trim(), 
                        password: this.passwordInput 
                    });
                    if (error) { 
                        this.errorMsg = "ACCESS_DENIED: INVALID CLEARANCE"; 
                        this.isLoading = false; 
                    } else { 
                        this.setupUser(data.user); 
                    }
                },

                async registerUser() {
                    if (this.passwordInput !== this.confirmPassword) { 
                        this.errorMsg = 'ENROLLMENT_ERROR: KEY_MISMATCH'; 
                        return; 
                    }
                    this.isLoading = true;
                    const { error } = await sb.auth.signUp({ 
                        email: this.emailInput.trim(), 
                        password: this.passwordInput, 
                        options: { data: { handle: this.handleInput.toUpperCase() } } 
                    });
                    if (error) { 
                        this.errorMsg = error.message.toUpperCase(); 
                        this.isLoading = false; 
                    } else { 
                        this.authMode = 'login'; 
                        this.errorMsg = 'ENROLLMENT_SUCCESS: VERIFY & LOGIN'; 
                        this.isLoading = false; 
                    }
                },

                // --- CHAT & DATA METHODS ---
                async loadMessages() {
                    const { data } = await sb.from('messages').select('*').order('created_at', { ascending: true }).limit(100);
                    if (data) { this.messages = data; this.scrollToBottom(); }
                },

                subscribeToMessages() {
                    sb.channel('public:messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                        this.messages.push(payload.new);
                        this.scrollToBottom();
                    }).subscribe();
                },

                async sendMessage() {
                    if (!this.msgInput.trim()) return;
                    const { error } = await sb.from('messages').insert({ 
                        username: this.username, 
                        content: this.msgInput 
                    });
                    if (!error) this.msgInput = '';
                },

                async loadSocialHub() {
                    const { data } = await sb.from('profiles').select('*').limit(20);
                    if (data) this.operatives = data;
                },

                subscribeToBroadcasts() {
                    sb.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, payload => {
                        this.activeBroadcast = payload.new.content;
                        setTimeout(() => { this.activeBroadcast = null; }, 20000);
                    }).subscribe();
                },

                scrollToBottom() {
                    this.$nextTick(() => { 
                        const container = this.$refs.chatContainer;
                        if (container) container.scrollTop = container.scrollHeight; 
                    });
                },

                logout() { 
                    sb.auth.signOut().then(() => { window.location.reload(); });
                }
            }
        }
    </script>
