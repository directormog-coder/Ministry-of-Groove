<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            background-color: #050505; color: #D4AF37; font-family: 'Inter', sans-serif;
            background-image: url('logo.png'); background-repeat: no-repeat;
            background-position: center; background-attachment: fixed; background-size: 30%;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.96); z-index: -1;
        }
        .glass { background: rgba(13, 13, 13, 0.9); backdrop-filter: blur(20px); border: 1px solid rgba(212, 175, 55, 0.1); }
        .gold-glow { filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); }
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

    <template x-if="appState === 'landing'">
        <div class="h-screen flex flex-col items-center justify-center text-center p-6">
            <div @click="startUplink()" class="cursor-pointer group active:scale-95 transition-all">
                <img src="logo.png" class="h-48 w-48 mx-auto mb-8 gold-glow animate-pulse">
                <h1 class="text-white text-3xl md:text-5xl tracking-[0.4em] font-black uppercase italic">Ministry of Groove</h1>
                <p class="text-gold/40 text-[9px] tracking-[1.2em] mt-6 uppercase">Initialize National Grid</p>
            </div>
        </div>
    </template>

    <template x-if="appState === 'grid'">
        <div class="min-h-screen flex flex-col animate-in fade-in duration-700">
            <header class="p-4 border-b border-gold/10 glass flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-3">
                    <img src="logo.png" class="h-8 w-8 gold-glow">
                    <span class="text-white text-[10px] font-black uppercase tracking-widest italic">NCC // Sector_eMalahleni</span>
                </div>
                <div class="flex items-center gap-4">
                    <button @click="requestNotify()" class="text-[8px] text-blue-400 font-black uppercase tracking-tighter hover:text-white transition-colors">Enable Alerts</button>
                    <button @click="logout()" class="text-[8px] text-red-500 font-black uppercase hover:opacity-70 transition-all">Disconnect</button>
                </div>
            </header>

            <main class="flex-grow p-4 md:p-8 flex flex-col items-center">
                <div class="w-full max-w-5xl glass rounded-[2rem] h-[78vh] flex flex-col overflow-hidden shadow-2xl border-white/5">
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-6">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.user_id === user?.id ? 'justify-end' : 'justify-start'" class="flex">
                                <div :class="msg.user_id === user?.id ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-zinc-900 text-zinc-300 rounded-tl-none border border-white/5'" 
                                     class="max-w-[80%] p-4 rounded-3xl shadow-xl">
                                    <template x-if="msg.image_url">
                                        <div class="mb-2 overflow-hidden rounded-xl border border-white/10">
                                            <img :src="msg.image_url" class="max-h-60 w-full object-cover cursor-pointer hover:scale-105 transition-transform duration-500">
                                        </div>
                                    </template>
                                    <p class="text-xs font-medium leading-relaxed" x-text="msg.text"></p>
                                    <div class="text-[7px] mt-2 opacity-40 uppercase font-black text-right" x-text="new Date(msg.created_at).toLocaleTimeString()"></div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <form @submit.prevent="sendMessage()" class="p-4 bg-black/60 border-t border-white/5 flex items-center gap-3">
                        <label class="cursor-pointer text-gold/50 hover:text-gold transition-colors p-2">
                            <i data-lucide="image" size="20"></i>
                            <input type="file" class="hidden" @change="uploadImage($event)" accept="image/*">
                        </label>
                        <input x-model="newMessage" placeholder="INPUT TRANSMISSION..." class="flex-grow bg-zinc-900/50 p-3 rounded-xl text-xs text-white outline-none border border-white/10 focus:border-gold/50 transition-all uppercase tracking-widest">
                        <button type="submit" class="bg-gold text-black px-8 py-3 rounded-xl font-black text-[10px] hover:bg-white transition-all italic uppercase">Transmit</button>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <template x-if="authView">
        <div class="fixed inset-0 z-[100] bg-black/98 flex items-center justify-center p-4 backdrop-blur-xl">
            <div class="max-w-md w-full p-10 glass rounded-[2.5rem] text-center shadow-2xl">
                <i :data-lucide="authView === 'set_passkey' ? 'fingerprint' : 'shield-alert'" class="mx-auto text-gold mb-8 animate-pulse" size="48"></i>
                <h2 class="text-white tracking-[0.4em] uppercase font-black mb-10 text-sm" x-text="authView.replace('_', ' ')"></h2>
                
                <form @submit.prevent="runAuthAction()" class="space-y-4">
                    <template x-if="authView !== 'set_passkey'">
                        <input type="email" x-model="email" placeholder="ACCESS_EMAIL" required class="w-full bg-zinc-900 p-4 rounded-xl text-white text-[10px] border border-white/10 outline-none">
                    </template>
                    <input type="password" x-model="authView === 'set_passkey' ? passkey : password" 
                           placeholder="SECURITY_CODE (MIN 6 CHARS)" required class="w-full bg-zinc-900 p-4 rounded-xl text-white text-[10px] border border-white/10 outline-none">
                    <button type="submit" class="w-full py-4 bg-gold text-black font-black text-[10px] uppercase tracking-widest rounded-xl hover:bg-white transition-all">Execute Protocol</button>
                </form>

                <template x-if="authView !== 'set_passkey'">
                    <button type="button" @click="loginWithGoogle()" class="w-full mt-4 py-4 bg-white/5 text-white font-bold text-[9px] uppercase tracking-widest rounded-xl border border-white/10 flex items-center justify-center gap-2">
                        <i data-lucide="chrome" size="14"></i> GOOGLE_UPLINK
                    </button>
                    <div class="mt-8 flex justify-center gap-8 text-[9px] uppercase font-bold opacity-30">
                        <span class="cursor-pointer hover:text-gold transition-colors" @click="authView = 'login'">Login</span>
                        <span class="cursor-pointer hover:text-gold transition-colors" @click="authView = 'register'">Register</span>
                    </div>
                </template>
            </div>
        </div>
    </template>
    
    <script>
        function app() {
            return {
                appState: 'landing', authView: 'login', user: null, profile: null,
                email: '', password: '', passkey: '', newMessage: '',
                messages: [], supabase: null,

                async init() {
                    // API KEYS INTEGRATED
                    const SB_URL = 'https://quzwygjbqpkuqjhrmsjp.supabase.co';
                    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU';
                    
                    this.supabase = window.supabase.createClient(SB_URL, SB_KEY);
                    
                    const { data: { session } } = await this.supabase.auth.getSession();
                    if (session) await this.handleAuthSuccess(session.user);

                    this.supabase.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session) await this.handleAuthSuccess(session.user);
                        if (event === 'SIGNED_OUT') { location.reload(); }
                    });
                    lucide.createIcons();
                },

                async handleAuthSuccess(user) {
                    this.user = user;
                    // EMAIL CONFIRMATION CHECK
                    if (!user.confirmed_at) {
                        alert("DIRECTORATE OVERRIDE: Email verification required. Check your inbox.");
                        await this.supabase.auth.signOut();
                        return;
                    }

                    let { data: profile } = await this.supabase.from('members').select('*').eq('user_id', user.id).maybeSingle();
                    if (!profile) {
                        const { data } = await this.supabase.from('members').insert([{ user_id: user.id, full_name: user.email.split('@')[0], gate_two_complete: false }]).select().single();
                        profile = data;
                    }
                    this.profile = profile;
                    
                    // GATE TWO LOGIC
                    if (!profile.gate_two_complete) {
                        this.authView = 'set_passkey';
                        this.$nextTick(() => lucide.createIcons());
                    } else {
                        this.authView = null;
                        this.startUplink();
                        this.fetchData();
                        this.subscribeToMessages();
                    }
                },

                async uploadImage(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const path = `chat/${Date.now()}-${file.name}`;
                    
                    // Convert to ArrayBuffer for maximum compatibility
                    const arrayBuffer = await file.arrayBuffer();
                    const { data, error } = await this.supabase.storage.from('chat-attachments').upload(path, arrayBuffer, {
                        contentType: file.type
                    });

                    if (data) {
                        const { data: { publicUrl } } = this.supabase.storage.from('chat-attachments').getPublicUrl(path);
                        await this.supabase.from('messages').insert([{ 
                            image_url: publicUrl, 
                            user_id: this.user.id, 
                            text: `TRANSMITTED_MEDIA: ${file.name.toUpperCase()}` 
                        }]);
                    } else {
                        alert("Storage Error: " + error.message);
                    }
                },

                async requestNotify() {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') alert("ALERTS ENABLED: NCC transmissions will be broadcast to desktop.");
                },

                subscribeToMessages() {
                    this.supabase.channel('hq').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (p) => {
                        this.messages.push(p.new);
                        // PUSH NOTIFICATION LOGIC
                        if (p.new.user_id !== this.user.id && Notification.permission === 'granted') {
                            new Notification("NCC: NEW TRANSMISSION", { 
                                body: p.new.text, 
                                icon: 'logo.png' 
                            });
                        }
                        this.scrollToBottom();
                    }).subscribe();
                },

                runAuthAction() {
                    if (this.authView === 'login') this.handleLogin();
                    else if (this.authView === 'register') this.handleRegister();
                    else this.finalizeSecurity();
                },

                async finalizeSecurity() {
                    if (this.passkey.length < 6) return alert("SECURITY BREACH: Passkey must be 6+ characters.");
                    const { error: authErr } = await this.supabase.auth.updateUser({ password: this.passkey });
                    const { error: dbErr } = await this.supabase.from('members').update({ gate_two_complete: true }).eq('user_id', this.user.id);
                    if (!authErr && !dbErr) { location.reload(); }
                },

                async handleLogin() { const { error } = await this.supabase.auth.signInWithPassword({ email: this.email, password: this.password }); if (error) alert(error.message); },
                async handleRegister() { const { error } = await this.supabase.auth.signUp({ email: this.email, password: this.password }); if (error) alert(error.message); else alert("RECRUITMENT PENDING: Verify your email to continue."); },
                async fetchData() { const { data } = await this.supabase.from('messages').select('*').order('created_at', { ascending: true }); this.messages = data || []; this.scrollToBottom(); },
                async sendMessage() { if (!this.newMessage.trim()) return; await this.supabase.from('messages').insert([{ text: this.newMessage.toUpperCase(), user_id: this.user.id }]); this.newMessage = ''; },
                async loginWithGoogle() { await this.supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } }); },
                logout() { this.supabase.auth.signOut(); },
                startUplink() { this.appState = 'grid'; this.$nextTick(() => { lucide.createIcons(); this.scrollToBottom(); }); },
                scrollToBottom() { this.$nextTick(() => { const el = document.getElementById('chat-stream'); if (el) el.scrollTop = el.scrollHeight; }); }
            }
        }
    </script>
</body>
</html>
