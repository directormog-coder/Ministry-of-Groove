<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC MASTER</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-white bg-grid min-h-screen">

    <!-- Offline Banner -->
    <div class="offline-banner" :class="{ 'show': !isOnline }">
        OFFLINE MODE - MESSAGES SAVED LOCALLY
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Image Modal -->
    <div x-show="selectedImage" class="image-modal" :class="{ 'active': selectedImage }" @click="selectedImage = null">
        <img :src="selectedImage" @click.stop alt="Full size">
    </div>

    <!-- Private Message Modal -->
    <div x-show="showPrivateModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
        <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20">
            <h3 class="text-lg font-black uppercase tracking-widest text-white mb-4">Private Transmission</h3>
            <p class="text-[10px] text-zinc-400 mb-4">To: <span class="text-gold" x-text="privateMessageRecipient"></span></p>
            <textarea x-model="privateMsgInput" class="w-full bg-black/50 border border-gold/20 rounded-xl p-3 text-white text-sm outline-none resize-none h-24" placeholder="Enter secure message..."></textarea>
            <div class="flex gap-3 mt-4">
                <button @click="showPrivateModal = false" class="flex-1 py-3 bg-white/10 text-white rounded-full text-[10px] font-black uppercase">Cancel</button>
                <button @click="sendPrivateMessage()" class="flex-1 py-3 bg-gold text-black rounded-full text-[10px] font-black uppercase">Send Secure</button>
            </div>
        </div>
    </div>

    <!-- Auth View -->
    <template x-if="view === 'auth'">
        <div class="h-screen w-full flex flex-col items-center justify-center bg-black p-10 text-center relative overflow-hidden">
            <div class="absolute inset-0 overflow-hidden pointer-events-none">
                <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-gold/5 rounded-full blur-3xl animate-pulse"></div>
                <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
            </div>
            <div class="relative z-10 w-full max-w-xs space-y-8 animate-slide-up">
                <div class="h-32 w-32 mx-auto mb-8 gold-glow animate-pulse-gold rounded-full bg-gradient-to-br from-gold/20 to-transparent flex items-center justify-center border border-gold/30 relative">
                    <div class="absolute inset-0 rounded-full border border-gold/20 animate-spin" style="animation-duration: 10s;"></div>
                    <i data-lucide="hexagon" class="w-16 h-16 text-gold"></i>
                </div>
                <div class="space-y-6">
                    <div x-show="!showBypass" class="space-y-4" x-transition>
                        <div class="space-y-2">
                            <h1 class="text-white font-black uppercase tracking-[0.4em] text-xs italic">Ministry of Groove</h1>
                            <p class="text-gold/40 text-[7px] uppercase font-black tracking-[0.3em]">Grid Synchronization Required</p>
                        </div>
                        <div class="space-y-3">
                            <input x-model="handleInput" type="text" placeholder="ENTER OPERATIVE HANDLE..." class="w-full bg-white/5 border border-gold/20 p-5 rounded-2xl text-[10px] text-white uppercase outline-none focus:border-gold terminal-font text-center transition-all placeholder:text-zinc-600 hover:border-gold/40" @keyup.enter="initializeUser()" maxlength="20">
                            <button @click="initializeUser()" :disabled="isLoading || !handleInput.trim()" class="w-full py-5 bg-gradient-to-r from-gold to-yellow-600 text-black font-black text-[10px] uppercase rounded-full shadow-lg active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 hover:shadow-gold/30 hover:from-yellow-400 hover:to-gold">
                                <span x-show="!isLoading">Initialize Access</span>
                                <div x-show="isLoading" class="loader"></div>
                            </button>
                        </div>
                        <button @click="showBypass = true" class="text-[7px] uppercase text-white/30 tracking-widest hover:text-gold transition-colors hover:tracking-[0.2em]">Directorate Override</button>
                    </div>
                    <div x-show="showBypass" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 transform scale-95" x-transition:enter-end="opacity-100 transform scale-100" class="glass p-6 rounded-[2.5rem] space-y-4 border-gold/40 bg-black/40">
                        <div class="flex items-center justify-center gap-2 mb-2">
                            <i data-lucide="shield" class="w-4 h-4 text-gold"></i>
                            <h2 class="text-white text-[9px] font-black uppercase tracking-widest italic">Directorate Override</h2>
                        </div>
                        <div class="space-y-3">
                            <input x-ref="emailInput" type="email" placeholder="DIRECTOR_ID@DOMAIN" class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[9px] text-white text-center terminal-font outline-none focus:border-gold placeholder:text-zinc-600" @keyup.enter="$refs.passwordInput.focus()">
                            <input x-ref="passwordInput" type="password" placeholder="PROTOCOL_KEY" class="w-full bg-black/40 border border-gold/20 p-4 rounded-xl text-[9px] text-white text-center terminal-font outline-none focus:border-gold placeholder:text-zinc-600" @keyup.enter="signInWithEmail()">
                        </div>
                        <button @click="signInWithEmail()" :disabled="isLoading" class="w-full py-4 bg-white text-black font-black text-[9px] uppercase rounded-full hover:bg-gold transition-all disabled:opacity-50 flex items-center justify-center gap-2">
                            <span x-show="!isLoading">Execute Authorization</span>
                            <span x-show="isLoading" class="terminal-font">AUTHENTICATING...</span>
                        </button>
                        <button @click="showBypass = false" class="text-[7px] uppercase text-white/40 tracking-widest hover:text-white transition-colors">← Abort Sequence</button>
                    </div>
                    <p x-show="errorMsg" x-text="errorMsg" x-transition class="text-red-500 text-[8px] uppercase font-black animate-pulse terminal-font bg-red-500/10 py-2 px-4 rounded-full border border-red-500/20"></p>
                </div>
                <div class="pt-8 border-t border-white/5">
                    <p class="text-[6px] text-zinc-600 uppercase tracking-[0.3em]">System Version 3.0.0</p>
                    <p class="text-[5px] text-zinc-700 mt-1" x-text="connectionStatus"></p>
                    <div class="flex justify-center gap-4 mt-4">
                        <button @click="toggleSound()" class="text-[8px] flex items-center gap-1 text-zinc-500 hover:text-gold">
                            <i data-lucide="volume-2" x-show="soundEnabled" class="w-3 h-3"></i>
                            <i data-lucide="volume-x" x-show="!soundEnabled" class="w-3 h-3"></i>
                            <span x-text="soundEnabled ? 'Sound On' : 'Sound Off'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Main Grid View -->
    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col relative pb-24 md:pb-0">
            <header class="p-6 border-b border-gold/10 glass-strong flex justify-between items-center sticky top-0 z-50">
                <div class="flex items-center gap-4">
                    <div class="h-10 w-10 gold-glow rounded-full bg-gradient-to-br from-gold/20 to-transparent flex items-center justify-center border border-gold/30">
                        <i data-lucide="hexagon" class="w-5 h-5 text-gold"></i>
                    </div>
                    <div>
                        <p class="text-[10px] font-black uppercase text-white tracking-widest italic leading-tight">Ministry of Groove</p>
                        <div class="flex items-center gap-2">
                            <span class="status-dot" :class="'status-' + userStatus"></span>
                            <p class="text-[6px] text-gold/40 uppercase tracking-widest" x-text="username"></p>
                            <span x-show="!isOnline" class="text-[6px] text-yellow-500 uppercase">[OFFLINE]</span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:block text-right">
                        <p class="terminal-font text-[10px] text-white font-bold" x-text="currentTime"></p>
                        <p class="text-[6px] text-gold/40 font-black uppercase tracking-tighter" x-text="weatherStatus"></p>
                    </div>
                    <button @click="logout()" class="p-3 border border-red-900/30 text-red-500 rounded-xl hover:bg-red-900/20 transition-all active:scale-95 group">
                        <i data-lucide="power" class="w-4 h-4 group-hover:rotate-90 transition-transform"></i>
                    </button>
                </div>
            </header>

            <main class="p-4 md:p-6 space-y-6 max-w-6xl mx-auto w-full">
                <!-- Navigation Grid -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                    <div @click="subView = 'chat'" :class="subView === 'chat' ? 'border-blue-400 bg-blue-400/10 shadow-lg shadow-blue-400/10' : 'border-white/10 hover:border-blue-400/30'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105 hover-lift group">
                        <div class="relative inline-block">
                            <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400 w-6 h-6 group-hover:scale-110 transition-transform"></i>
                            <span x-show="unreadCount > 0" x-text="unreadCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-[8px] font-black w-4 h-4 rounded-full flex items-center justify-center animate-pulse"></span>
                        </div>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Grid</span>
                        <span class="text-[6px] text-zinc-500 uppercase tracking-wider">Secure Channel</span>
                    </div>
                    <div @click="window.location.href='dossier.html'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border border-white/10 hover:border-green-400/30 hover:scale-105 transition-all hover-lift group">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-green-400 w-6 h-6 group-hover:rotate-12 transition-transform"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Dossier</span>
                        <span class="text-[6px] text-zinc-500 uppercase tracking-wider">Profile Data</span>
                    </div>
                    <div @click="subView = 'gallery'" :class="subView === 'gallery' ? 'border-purple-400 bg-purple-400/10 shadow-lg shadow-purple-400/10' : 'border-white/10 hover:border-purple-400/30'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border transition-all hover:scale-105 hover-lift group">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400 w-6 h-6 group-hover:scale-110 transition-transform"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Gallery</span>
                        <span class="text-[6px] text-zinc-500 uppercase tracking-wider" x-text="galleryItems.length + ' Assets'"></span>
                    </div>
                    <div @click="window.location.href='archives.html'" class="glass p-6 md:p-8 rounded-[2rem] text-center cursor-pointer border border-white/10 hover:border-gold/50 hover:scale-105 transition-all hover-lift group">
                        <i data-lucide="database" class="mx-auto mb-2 text-gold w-6 h-6 group-hover:scale-110 transition-transform"></i>
                        <span class="text-[9px] font-black uppercase tracking-widest text-white block">Vault</span>
                        <span class="text-[6px] text-zinc-500 uppercase tracking-wider">Classified</span>
                    </div>
                </div>

                <!-- Active Users -->
                <div x-show="subView === 'chat'" class="glass rounded-2xl p-4 border border-white/5">
                    <p class="text-[10px] font-black uppercase text-zinc-400 mb-3">Active Operatives</p>
                    <div class="flex gap-2 overflow-x-auto pb-2">
                        <template x-for="user in uniqueUsers" :key="user">
                            <button @click="openPrivateMessage(user)" class="flex items-center gap-2 px-3 py-2 bg-white/5 rounded-full border border-white/10 hover:border-gold/30 transition-all whitespace-nowrap">
                                <div class="w-2 h-2 rounded-full bg-green-500"></div>
                                <span class="text-[10px] text-white" x-text="user"></span>
                                <span class="pm-badge" x-show="user !== username">PM</span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Chat Section -->
                <div x-show="subView === 'chat'" x-transition class="glass rounded-[2rem] md:rounded-[3rem] h-[50vh] md:h-[60vh] flex flex-col overflow-hidden border-white/5 shadow-2xl">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <span class="text-[10px] font-black uppercase tracking-widest text-white">Grid Channel</span>
                            <span class="text-[8px] text-zinc-500" x-text="onlineCount + ' ONLINE'"></span>
                        </div>
                        <div class="flex gap-2">
                            <button @click="clearChat()" class="text-[8px] text-zinc-500 hover:text-red-400 transition-colors uppercase tracking-wider">Clear</button>
                        </div>
                    </div>
                    
                    <div class="flex-grow overflow-y-auto p-4 md:p-6 space-y-4" x-ref="chatContainer">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === username ? 'ml-auto items-end' : 'mr-auto items-start'" class="flex flex-col gap-1 max-w-[85%] message-enter">
                                <div class="flex items-center gap-2">
                                    <template x-if="msg.username === 'DIRECTORATE'">
                                        <div class="h-4 w-4 rounded-full bg-gold/20 flex items-center justify-center border border-gold/40">
                                            <i data-lucide="shield" class="w-2 h-2 text-gold"></i>
                                        </div>
                                    </template>
                                    <template x-if="msg.username !== 'DIRECTORATE'">
                                        <div class="h-4 w-4 rounded-full bg-blue-500/20 flex items-center justify-center border border-blue-500/40">
                                            <span class="text-[6px] text-blue-400 font-bold" x-text="msg.username.charAt(0)"></span>
                                        </div>
                                    </template>
                                    <span class="text-[7px] font-black text-zinc-500 uppercase tracking-wider" x-text="msg.username"></span>
                                    <span x-show="msg.recipient" class="pm-badge">PM</span>
                                    <span class="text-[6px] text-zinc-600" x-text="formatTime(msg.created_at)"></span>
                                </div>
                                <div :class="msg.username === username ? 'bg-gold/10 border-gold/20 text-white' : 'bg-white/5 border-white/5 text-white/80'" class="p-3 md:p-4 border rounded-2xl text-[11px] md:text-[12px] leading-relaxed break-words" x-text="msg.content"></div>
                            </div>
                        </template>
                        
                        <!-- Typing Indicator -->
                        <div x-show="typingUsers.length > 0" class="flex items-center gap-2 text-[10px] text-zinc-500">
                            <div class="typing-indicator">
                                <span></span><span></span><span></span>
                            </div>
                            <span x-text="typingUsers.join(', ') + ' typing...'"></span>
                        </div>
                        
                        <div x-show="messages.length === 0" class="h-full flex flex-col items-center justify-center text-zinc-600 space-y-4">
                            <i data-lucide="radio" class="w-12 h-12 opacity-20"></i>
                            <p class="text-[10px] uppercase tracking-widest">No transmissions detected</p>
                        </div>
                    </div>
                    
                    <form @submit.prevent="sendMessage()" class="p-4 bg-black/40 border-t border-gold/10 flex gap-3 items-center">
                        <input x-model="msgInput" @input="onTyping()" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[12px] text-white outline-none placeholder:text-zinc-600 terminal-font" maxlength="500" x-ref="msgInput">
                        <span x-show="msgInput.length > 0" class="text-[8px] text-zinc-600" x-text="msgInput.length + '/500'"></span>
                        <button type="submit" :disabled="!msgInput.trim() || isLoading" class="text-gold active:scale-90 transition-all disabled:opacity-30 p-2 hover:bg-gold/10 rounded-full">
                            <i data-lucide="send-horizontal" class="w-5 h-5"></i>
                        </button>
                    </form>
                </div>

                <!-- Gallery Section -->
                <div x-show="subView === 'gallery'" x-transition class="glass rounded-[2rem] md:rounded-[3rem] h-[50vh] md:h-[60vh] flex flex-col overflow-hidden border-white/5 shadow-2xl">
                    <div class="flex justify-between items-center p-4 md:p-6 border-b border-white/5 bg-white/5">
                        <div>
                            <h3 class="text-[10px] font-black uppercase tracking-widest text-white italic">Visual Archives</h3>
                            <p class="text-[8px] text-zinc-500 mt-1" x-text="galleryItems.length + ' items • ' + formatBytes(totalStorage) + ' used'"></p>
                        </div>
                        <label class="cursor-pointer bg-gradient-to-r from-gold to-yellow-600 text-black px-4 py-2 md:px-6 md:py-3 rounded-full text-[8px] md:text-[9px] font-black uppercase active:scale-95 transition-all shadow-lg hover:shadow-gold/20 disabled:opacity-50 flex items-center gap-2 hover:from-yellow-400 hover:to-gold" :class="{ 'opacity-50 cursor-not-allowed': isUploading }">
                            <i data-lucide="upload" class="w-3 h-3"></i>
                            <span x-text="isUploading ? 'UPLOADING... ' + uploadProgress + '%' : 'Transmit Asset'"></span>
                            <input type="file" @change="uploadImage($event)" class="hidden" accept="image/*,audio/*,.pdf" :disabled="isUploading">
                        </label>
                    </div>
                    <div class="gallery-grid overflow-y-auto flex-grow p-4 md:p-6">
                        <template x-for="img in galleryItems" :key="img.id">
                            <div class="relative aspect-square rounded-2xl overflow-hidden glass group border border-white/10 cursor-pointer hover:border-gold/30 transition-all hover-lift" @click="selectedImage = img.url">
                                <img :src="img.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-500" loading="lazy" :alt="img.name">
                                <div x-show="img.offline" class="absolute top-2 left-2 px-2 py-1 bg-yellow-500/80 text-black text-[8px] font-black rounded">OFFLINE</div>
                                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 flex flex-col justify-end p-3">
                                    <p class="text-[8px] text-white truncate uppercase font-bold" x-text="img.name || 'Untitled'"></p>
                                    <div class="flex justify-between items-center mt-1">
                                        <p class="text-[6px] text-gold/60" x-text="img.owner"></p>
                                        <p class="text-[6px] text-zinc-500" x-text="formatDate(img.created_at)"></p>
                                    </div>
                                </div>
                                <button @click.stop="deleteImage(img.id)" class="absolute top-2 right-2 p-1.5 bg-red-500/80 rounded-full opacity-0 group-hover:opacity-100 transition-all hover:bg-red-500">
                                    <i data-lucide="trash-2" class="w-3 h-3 text-white"></i>
                                </button>
                            </div>
                        </template>
                        <div x-show="galleryItems.length === 0" class="col-span-full h-full flex flex-col items-center justify-center text-zinc-600 space-y-4 min-h-[200px]">
                            <i data-lucide="image-off" class="w-12 h-12 opacity-20"></i>
                            <p class="text-[10px] uppercase tracking-widest">No visual assets archived</p>
                            <p class="text-[8px] text-zinc-700">Upload images to begin archival</p>
                        </div>
                    </div>
                </div>
                                  <!-- Quick Stats -->
                <div class="grid grid-cols-3 gap-3 md:gap-4">
                    <div class="glass p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-500 uppercase tracking-wider mb-1">Messages</p>
                        <p class="text-lg font-black text-white terminal-font" x-text="messages.length"></p>
                    </div>
                    <div class="glass p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-500 uppercase tracking-wider mb-1">Assets</p>
                        <p class="text-lg font-black text-gold terminal-font" x-text="galleryItems.length"></p>
                    </div>
                    <div class="glass p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[8px] text-zinc-500 uppercase tracking-wider mb-1">Uptime</p>
                        <p class="text-lg font-black text-blue-400 terminal-font" x-text="sessionDuration"></p>
                    </div>
                </div>
            </main>

            <footer class="glass-strong border-t border-gold/20 flex flex-col sm:flex-row justify-between items-center px-6 py-4 gap-4 fixed bottom-0 w-full left-0 z-40 md:relative md:mt-8">
                <div class="flex flex-col items-center sm:items-start gap-1">
                    <p class="terminal-font text-[7px] font-black uppercase text-gold/60">© 2026 MINISTRY OF GROOVE</p>
                    <div class="flex gap-3 text-[6px] font-black uppercase tracking-widest text-gold/30">
                        <a href="tos.html" class="hover:text-gold transition-colors">Protocol TOS</a>
                        <span>|</span>
                        <a href="privacy.html" class="hover:text-gold transition-colors">Privacy Shield</a>
                    </div>
                </div>
                <div class="flex gap-6 text-white/40">
                    <a href="mailto:director.mog@gmail.com" class="hover:text-gold transition-colors hover:scale-110 transform">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </a>
                    <a href="https://instagram.com/ministryofgroove_hq" target="_blank" class="hover:text-gold transition-colors hover:scale-110 transform">
                        <i data-lucide="instagram" class="w-5 h-5"></i>
                    </a>
                    <a href="#" @click.prevent="showSettings = true" class="hover:text-gold transition-colors hover:scale-110 transform">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </a>
                </div>
            </footer>

            <!-- Settings Modal -->
            <div x-show="showSettings" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90" x-transition>
                <div class="glass max-w-sm w-full p-6 rounded-3xl border border-gold/20">
                    <h3 class="text-lg font-black uppercase tracking-widest text-white mb-4">System Settings</h3>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-zinc-400 uppercase flex items-center gap-2">
                                <i data-lucide="bell" class="w-3 h-3"></i> 
                                Notifications
                            </span>
                            <button @click="notifications = !notifications; savePreferences()" :class="notifications ? 'bg-gold' : 'bg-zinc-700'" class="w-12 h-6 rounded-full transition-colors relative">
                                <span :class="notifications ? 'translate-x-6' : 'translate-x-1'" class="absolute top-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
                            </button>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-zinc-400 uppercase flex items-center gap-2">
                                <i data-lucide="volume-2" class="w-3 h-3"></i> Sound FX
                            </span>
                            <button @click="toggleSound()" :class="soundEnabled ? 'bg-gold' : 'bg-zinc-700'" class="w-12 h-6 rounded-full transition-colors relative">
                                <span :class="soundEnabled ? 'translate-x-6' : 'translate-x-1'" class="absolute top-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
                            </button>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-zinc-400 uppercase flex items-center gap-2">
                                <i data-lucide="moon" class="w-3 h-3"></i> Dark Mode
                            </span>
                            <button @click="toggleTheme()" :class="darkMode ? 'bg-gold' : 'bg-zinc-700'" class="w-12 h-6 rounded-full transition-colors relative">
                                <span :class="darkMode ? 'translate-x-6' : 'translate-x-1'" class="absolute top-1 w-4 h-4 bg-white rounded-full transition-transform"></span>
                            </button>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-zinc-400 uppercase flex items-center gap-2">
                                <i data-lucide="activity" class="w-3 h-3"></i> Status
                            </span>
                            <select x-model="userStatus" class="bg-black/50 border border-gold/20 rounded-lg text-[10px] text-white px-2 py-1 outline-none">
                                <option value="online">Online</option>
                                <option value="away">Away</option>
                                <option value="busy">Busy</option>
                            </select>
                        </div>
                    </div>
                    <button @click="showSettings = false" class="mt-6 w-full py-3 bg-white/10 text-white font-black text-[10px] uppercase rounded-full hover:bg-white/20">Close</button>
                </div>
            </div>
        </div>
    </template>

    <script src="JS/app.js"></script>
    <script>
        // Toast notification helper
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
