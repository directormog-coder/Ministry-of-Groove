<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG_GRID | NCC MASTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=JetBrains+Mono:wght@400;700&display=swap');
        :root { --gold: #D4AF37; --noir: #050505; }
        body { background: var(--noir); color: var(--gold); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(20, 20, 20, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(212, 175, 55, 0.15); }
        .ticker-wrap { width: 100%; overflow: hidden; background: rgba(212, 175, 55, 0.05); border-bottom: 1px solid rgba(212, 175, 55, 0.1); position: fixed; top: 0; z-index: 100; }
        .ticker-move { display: inline-block; white-space: nowrap; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="ministry()" x-init="init()" x-cloak class="bg-black text-gold">

    <div class="ticker-wrap py-2 flex items-center">
        <div class="px-4 border-r border-gold/20 text-[8px] font-black text-white whitespace-nowrap" x-text="sastTime"></div>
        <div class="ticker-move text-[9px] font-black uppercase tracking-[0.3em] text-white">
            <template x-for="news in newsItems" :key="news.id">
                <span class="mx-10" x-text="`${news.title}: ${news.message}`"></span>
            </template>
        </div>
    </div>

    <template x-if="hasDM">
        <div class="fixed bottom-24 left-6 right-6 glass p-4 rounded-2xl border-gold animate-bounce z-50 flex items-center gap-4">
            <i data-lucide="mail" class="text-gold"></i>
            <div class="flex-grow">
                <p class="text-[8px] font-black uppercase text-white">New Direct Instruction</p>
                <p class="text-[10px] italic" x-text="latestDM"></p>
            </div>
            <button @click="hasDM = false" class="text-[10px] font-black">X</button>
        </div>
    </template>

    <template x-if="view === 'grid'">
        <div class="min-h-screen flex flex-col pt-12 pb-24">
            <header class="p-6 glass flex justify-between items-center mx-4 rounded-2xl sticky top-12 z-40">
                <div class="flex items-center gap-4">
                    <img src="logo.png" class="h-10 w-10 rounded-full border border-gold/20">
                    <div>
                        <p class="text-[10px] font-black uppercase text-white leading-none">MOG_GRID_ACTIVE</p>
                        <p class="text-[7px] text-gold/60 uppercase mt-1" x-text="`Emalahleni: ${temp}°C`"></p>
                    </div>
                </div>
                <button @click="logout()" class="p-2 border border-red-900/30 text-red-500 rounded-lg"><i data-lucide="power" size="16"></i></button>
            </header>

            <main class="p-6 space-y-6 max-w-5xl mx-auto w-full">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div @click="subView = 'chat'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10">
                        <i data-lucide="message-square" class="mx-auto mb-2 text-blue-400"></i>
                        <span class="text-[9px] font-black uppercase text-white">Grid Chat</span>
                    </div>
                    <div @click="subView = 'gallery'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10">
                        <i data-lucide="camera" class="mx-auto mb-2 text-purple-400"></i>
                        <span class="text-[9px] font-black uppercase text-white">Archives</span>
                    </div>
                    <div @click="subView = 'polls'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10 relative">
                        <i data-lucide="bar-chart-3" class="mx-auto mb-2 text-green-400"></i>
                        <span class="text-[9px] font-black uppercase text-white">Polls</span>
                        <div class="absolute top-2 right-4 h-2 w-2 bg-red-500 rounded-full animate-ping"></div>
                    </div>
                    <div @click="window.location.href='dossier.html'" class="glass p-6 rounded-[2rem] text-center cursor-pointer border border-gold/10">
                        <i data-lucide="user" class="mx-auto mb-2 text-gold"></i>
                        <span class="text-[9px] font-black uppercase text-white">Dossier</span>
                    </div>
                </div>

                <div x-show="subView === 'chat'" class="glass rounded-[3rem] h-[50vh] flex flex-col overflow-hidden">
                    <div id="chat-stream" class="flex-grow overflow-y-auto p-6 space-y-4">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.username === 'DIRECTORATE' ? 'ml-auto items-end' : 'mr-auto items-start'" class="flex flex-col max-w-[85%]">
                                <span class="text-[7px] font-black text-zinc-500 px-2" x-text="msg.username"></span>
                                <div :class="msg.username === 'DIRECTORATE' ? 'bg-gold/10 border-gold/20' : 'bg-white/5 border-white/5'" class="p-4 border rounded-2xl text-[12px] text-white" x-text="msg.content"></div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="send()" class="p-4 bg-black/40 flex gap-3">
                        <input x-model="msgInput" placeholder="COMMAND UPLINK..." class="flex-grow bg-transparent text-[12px] text-white outline-none">
                        <button type="submit" class="text-gold"><i data-lucide="send-horizontal"></i></button>
                    </form>
                </div>

                <div x-show="subView === 'gallery'" class="glass rounded-[3rem] p-8 min-h-[40vh]">
                   <div class="flex justify-between mb-4">
                       <h3 class="text-[10px] font-black uppercase text-white italic">Visual Archives</h3>
                       <label class="cursor-pointer bg-gold text-black px-4 py-1 rounded-full text-[8px] font-black">
                           UPLOAD_ASSET
                           <input type="file" @change="optimizeAndUpload" class="hidden" accept="image/*">
                       </label>
                   </div>
                   <div class="grid grid-cols-3 gap-2" id="gallery-grid">
                       <template x-for="img in galleryItems" :key="img.id">
                           <img :src="img.url" class="aspect-square object-cover rounded-xl border border-white/10 grayscale hover:grayscale-0 transition-all cursor-zoom-in" @click="lightbox = img.url">
                       </template>
                   </div>
                </div>
            </main>
        </div>
    </template>

    <script>
        function ministry() {
            return {
                view: 'auth', subView: 'chat', username: '', 
                messages: [], msgInput: '', handleInput: '', 
                galleryItems: [], newsItems: [], lightbox: null,
                sastTime: '', temp: '22', hasDM: false, latestDM: '',

                async init() {
                    const saved = localStorage.getItem('mog_handle');
                    if(saved) { 
                        this.username = saved; this.view = 'grid';
                        this.updateTime();
                        this.fetchMessages();
                        this.fetchGallery();
                        this.checkDMs();
                        this.subscribe();
                        setInterval(() => this.updateTime(), 1000);
                    }
                    this.$nextTick(() => lucide.createIcons());
                },
                updateTime() {
                    this.sastTime = new Date().toLocaleTimeString('en-ZA', { timeZone: 'Africa/Johannesburg', hour12: false });
                },
                async checkDMs() {
                    const { data } = await mog_sb.from('direct_messages').select('*').eq('recipient', this.username).eq('read', false).order('created_at', { ascending: false }).limit(1);
                    if(data?.length) { this.hasDM = true; this.latestDM = data[0].content; }
                },
                async optimizeAndUpload(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    // Client-side compression logic using Canvas
                    const img = new Image();
                    img.src = URL.createObjectURL(file);
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = 800; canvas.height = (img.height / img.width) * 800;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob(async (blob) => {
                            const fileName = `archive_${Date.now()}.jpg`;
                            await mog_sb.storage.from('gallery').upload(fileName, blob);
                            const { data } = mog_sb.storage.from('gallery').getPublicUrl(fileName);
                            await mog_sb.from('gallery').insert([{ url: data.publicUrl, owner: this.username }]);
                            this.fetchGallery();
                        }, 'image/jpeg', 0.7);
                    };
                },
                subscribe() {
                    mog_sb.channel('realtime').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
                        this.messages.push(p.new);
                        this.$nextTick(() => document.getElementById('chat-stream').scrollTop = 99999);
                    }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: `recipient=eq.${this.username}` }, p => {
                        this.hasDM = true; this.latestDM = p.new.content;
                    }).subscribe();
                },
                async fetchMessages() { const { data } = await mog_sb.from('messages').select('*').order('created_at', { ascending: true }); this.messages = data || []; },
                async fetchGallery() { const { data } = await mog_sb.from('gallery').select('*').order('created_at', { ascending: false }); this.galleryItems = data || []; },
                async send() {
                    if(!this.msgInput.trim()) return;
                    await mog_sb.from('messages').insert([{ content: this.msgInput.toUpperCase(), username: this.username }]);
                    this.msgInput = '';
                },
                initializeUser() {
                    if(!this.handleInput.trim()) return;
                    this.username = this.handleInput.toUpperCase();
                    localStorage.setItem('mog_handle', this.username);
                    location.reload();
                },
                logout() { localStorage.clear(); location.reload(); }
            }
        }
    </script>
</body>
                        </html>
