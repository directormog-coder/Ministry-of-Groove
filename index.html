<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MINISTRY OF GROOVE | NCC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; color: #D4AF37; font-family: sans-serif; }
        .glass { background: rgba(10,10,10,0.9); backdrop-filter: blur(15px); border: 1px solid rgba(212,175,55,0.1); }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

    <template x-if="appState === 'landing'">
        <div class="h-screen flex flex-col items-center justify-center p-6 text-center">
            <div @click="startUplink()" class="cursor-pointer group">
                <img src="/logo.png" class="h-40 w-40 mx-auto mb-8 animate-pulse drop-shadow-[0_0_15px_rgba(212,175,55,0.3)]">
                <h1 class="text-white text-3xl tracking-[0.4em] font-black uppercase italic">Ministry of Groove</h1>
                <p class="text-gold/40 text-[9px] tracking-[1em] mt-4 uppercase">Initialize Grid</p>
            </div>
        </div>
    </template>

    <template x-if="appState === 'grid'">
        <div class="min-h-screen flex flex-col">
            <header class="p-6 border-b border-gold/10 glass flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <img src="/logo.png" class="h-8 w-8">
                    <span class="text-white text-[10px] font-black uppercase tracking-widest">Command Center // eMalahleni</span>
                </div>
                <button @click="logout()" class="text-[9px] text-red-500 uppercase font-bold">Disconnect</button>
            </header>
            <main class="flex-grow p-6">
                <div class="glass rounded-3xl h-[70vh] flex flex-col overflow-hidden">
                    <div id="chat" class="flex-grow overflow-y-auto p-6 space-y-4">
                        <template x-for="msg in messages">
                            <div :class="msg.user_id === user?.id ? 'justify-end' : 'justify-start'" class="flex">
                                <div :class="msg.user_id === user?.id ? 'bg-blue-600 text-white' : 'bg-zinc-900 text-zinc-400'" class="p-4 rounded-2xl max-w-[80%] text-xs shadow-xl">
                                    <p x-text="msg.text"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <form @submit.prevent="sendMessage()" class="p-4 bg-black/40 border-t border-white/5 flex gap-2">
                        <input x-model="newMessage" placeholder="TRANSMIT..." class="flex-grow bg-zinc-900 p-4 rounded-xl text-xs text-white outline-none border border-white/10 uppercase">
                        <button class="bg-gold text-black px-6 rounded-xl font-black text-xs italic">SEND</button>
                    </form>
                </div>
            </main>
        </div>
    </template>

    <template x-if="authView">
        <div class="fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4">
            <div class="max-w-md w-full p-8 glass rounded-[2rem] text-center shadow-2xl">
                <i :data-lucide="authView === 'set_passkey' ? 'fingerprint' : 'shield-check'" class="mx-auto mb-6 text-gold animate-pulse" size="40"></i>
                <h2 class="text-white tracking-[0.3em] uppercase font-black mb-6 text-sm" x-text="authView.replace('_', ' ')"></h2>
                
                <form @submit.prevent="authAction()" class="space-y-4">
                    <template x-if="authView !== 'set_passkey'">
                        <input type="email" x-model="email" placeholder="EMAIL" class="w-full bg-zinc-900 p-4 rounded-xl text-white text-xs border border-white/10 outline-none">
                    </template>
                    <input type="password" x-model="authView === 'set_passkey' ? passkey : password" :placeholder="authView === 'set_passkey' ? 'NEW_PASSKEY (MIN 6 CHARS)' : 'PASSWORD'" class="w-full bg-zinc-900 p-4 rounded-xl text-white text-xs border border-white/10 outline-none">
                    <button class="w-full py-4 bg-gold text-black font-black text-xs uppercase tracking-widest rounded-xl">Execute</button>
                </form>

                <template x-if="authView !== 'set_passkey'">
                    <button @click="loginWithGoogle()" class="w-full mt-4 py-4 bg-white/5 text-white font-bold text-[9px] uppercase tracking-widest rounded-xl border border-white/10 flex items-center justify-center gap-2">
                        <i data-lucide="chrome" size="14"></i> GOOGLE_UPLINK
                    </button>
                </template>
            </div>
        </div>
    </template>

    <script>
        function app() {
            return {
                appState: 'landing', authView: 'login', user: null, profile: null,
                email: '', password: '', passkey: '', newMessage: '',
                messages: [], members: [],
                supabase: null,

                async init() {
                    this.supabase = window.supabase.createClient('https://quzwygjbqpkuqjhrmsjp.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1end5Z2picXBrdXFqaHJtc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMTM0MDksImV4cCI6MjA4Nzg4OTQwOX0.1EVJRlSelXQOPHLX_Y7YsWxzVUmx8s7keRVpqWdXsPU');
                    
                    const { data: { session } } = await this.supabase.auth.getSession();
                    if (session) await this.handleAuthSuccess(session.user);

                    this.supabase.auth.onAuthStateChange(async (event, session) => {
                        if (event === 'SIGNED_IN' && session) await this.handleAuthSuccess(session.user);
                        if (event === 'SIGNED_OUT') location.reload();
                    });
                    lucide.createIcons();
                },

                async loginWithGoogle() {
                    await this.supabase.auth.signInWithOAuth({ 
                        provider: 'google', options: { redirectTo: window.location.origin } 
                    });
                },

                async handleAuthSuccess(user) {
                    this.user = user;
                    let { data: profile, error } = await this.supabase.from('members').select('*').eq('user_id', user.id).single();
                    
                    if (error || !profile) {
                        const { data } = await this.supabase.from('members').upsert({ user_id: user.id, full_name: user.email.split('@')[0] }).select().single();
                        profile = data;
                    }
                    
                    this.profile = profile;
                    if (!profile?.gate_two_complete) {
                        this.authView = 'set_passkey';
                        lucide.createIcons();
                    } else {
                        this.authView = null;
                        this.startUplink();
                    }
                    this.fetchData();
                },

                async finalizeSecurity() {
                    if (this.passkey.length < 6) {
                        alert("DIRECTORATE PROTOCOL: Passkey must be at least 6 characters.");
                        return;
                    }
                    
                    const { error: authError } = await this.supabase.auth.updateUser({ password: this.passkey });
                    if (authError) return alert(authError.message);

                    const { error: dbError } = await this.supabase.from('members').update({ gate_two_complete: true }).eq('user_id', this.user.id);
                    if (dbError) return alert(dbError.message);

                    // Refresh and Enter
                    const { data } = await this.supabase.from('members').select('*').eq('user_id', this.user.id).single();
                    this.profile = data;
                    this.authView = null;
                    this.startUplink();
                },

                authAction() {
                    if (this.authView === 'login') this.handleLogin();
                    else if (this.authView === 'register') this.handleRegister();
                    else this.finalizeSecurity();
                },

                async handleLogin() {
                    const { error } = await this.supabase.auth.signInWithPassword({ email: this.email, password: this.password });
                    if (error) alert(error.message);
                },

                async handleRegister() {
                    const { error } = await this.supabase.auth.signUp({ email: this.email, password: this.password });
                    if (error) alert(error.message); else alert("Verify email then login.");
                },

                async fetchData() {
                    const { data: m } = await this.supabase.from('messages').select('*').order('created_at', { ascending: true });
                    this.messages = m || [];
                    this.scrollToBottom();
                },

                async sendMessage() {
                    if (!this.newMessage.trim()) return;
                    await this.supabase.from('messages').insert([{ text: this.newMessage.toUpperCase(), user_id: this.user.id }]);
                    this.newMessage = '';
                    this.fetchData();
                },

                logout() { this.supabase.auth.signOut(); },
                startUplink() { this.appState = 'grid'; this.$nextTick(() => { lucide.createIcons(); this.scrollToBottom(); }); },
                scrollToBottom() { const el = document.getElementById('chat'); if (el) el.scrollTop = el.scrollHeight; }
            }
        }
    </script>
</body>
</html>
