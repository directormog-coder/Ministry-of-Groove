<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ministry of Groove</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #c44536 0%, #8b2e1f 50%, #5a1f15 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 50px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .social-btn:active {
            transform: translateY(0);
        }

        .apple-icon {
            width: 20px;
            height: 24px;
            fill: currentColor;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .divider span {
            padding: 0 16px;
        }

        .signup-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            border-radius: 50px;
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            margin-top: 16px;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Modal styles for email signup/login */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(180deg, #c44536 0%, #8b2e1f 100%);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-title {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: none;
            background: white;
            color: #8b2e1f;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            color: #ffcccc;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="button-stack">
            <!-- Apple Sign In -->
            <button class="social-btn" id="appleSignIn" onclick="handleAppleSignIn()">
                <svg class="apple-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
                Continue with Apple
            </button>

            <!-- Google Sign In -->
            <button class="social-btn" id="googleSignIn" onclick="handleGoogleSignIn()">
                <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Sign Up Button -->
            <button class="signup-btn" onclick="openModal('signup')">
                Sign up
            </button>

            <!-- Log In Button -->
            <button class="login-btn" onclick="openModal('login')">
                Log in
            </button>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal-overlay" id="signupModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('signup')">&times;</button>
            <h2 class="modal-title">Create Account</h2>
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <input type="email" class="form-input" id="signupEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="signupPassword" placeholder="Password" required minlength="8">
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="signupConfirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="submit-btn">Sign Up</button>
                <div class="error-message" id="signupError"></div>
            </form>
        </div>
    </div>

    <!-- Log In Modal -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('login')">&times;</button>
            <h2 class="modal-title">Welcome Back</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="email" class="form-input" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" id="loginPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="submit-btn">Log In</button>
                <div class="error-message" id="loginError"></div>
            </form>
        </div>
    </div>

    <script>
        // Web Crypto API for secure token storage
        const cryptoKey = null;

        async function getCryptoKey() {
            if (cryptoKey) return cryptoKey;
            return await crypto.subtle.generateKey(
                { name: 'AES-GCM', length: 256 },
                true,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(data) {
            const key = await getCryptoKey();
            const encoder = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv },
                key,
                encoder.encode(data)
            );
            return { iv: Array.from(iv), data: Array.from(new Uint8Array(encrypted)) };
        }

        // Modal Functions
        function openModal(type) {
            document.getElementById(type + 'Modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal(type) {
            document.getElementById(type + 'Modal').classList.remove('active');
            document.body.style.overflow = '';
            // Clear form and errors
            document.getElementById(type + 'Form').reset();
            document.getElementById(type + 'Error').classList.remove('show');
        }

        // Close modal on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            });
        });

        // Apple Sign In Handler
        async function handleAppleSignIn() {
            try {
                // Check if Apple Sign In is available
                if (window.AppleID) {
                    AppleID.auth.init({
                        clientId: 'YOUR_APPLE_CLIENT_ID',
                        scope: 'name email',
                        redirectURI: window.location.origin + '/auth/apple/callback',
                        usePopup: true
                    });
                    
                    const response = await AppleID.auth.signIn();
                    await processSocialLogin('apple', response);
                } else {
                    // Fallback for browsers without Apple SDK
                    showError('signup', 'Apple Sign In is only available on Apple devices or Safari browser');
                }
            } catch (error) {
                console.error('Apple Sign In Error:', error);
                showError('signup', 'Apple Sign In failed. Please try again.');
            }
        }

        // Google Sign In Handler
        async function handleGoogleSignIn() {
            try {
                // Initialize Google Sign In
                if (window.google && google.accounts) {
                    const client = google.accounts.oauth2.initTokenClient({
                        client_id: 'YOUR_GOOGLE_CLIENT_ID',
                        scope: 'email profile',
                        callback: async (response) => {
                            if (response.access_token) {
                                await processSocialLogin('google', response);
                            }
                        }
                    });
                    client.requestAccessToken();
                } else {
                    // Load Google API if not available
                    loadGoogleAPI().then(() => handleGoogleSignIn());
                }
            } catch (error) {
                console.error('Google Sign In Error:', error);
                showError('signup', 'Google Sign In failed. Please try again.');
            }
        }

        function loadGoogleAPI() {
            return new Promise((resolve) => {
                const script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;
                script.onload = resolve;
                document.head.appendChild(script);
            });
        }

        // Process Social Login
        async function processSocialLogin(provider, response) {
            try {
                // Encrypt sensitive data before storage
                const encryptedToken = await encryptData(JSON.stringify(response));
                sessionStorage.setItem(`${provider}_auth`, JSON.stringify(encryptedToken));
                
                // Send to your backend
                const result = await fetch('/api/auth/social', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ provider, token: response })
                });
                
                if (result.ok) {
                    window.location.href = '/dashboard';
                } else {
                    throw new Error('Authentication failed');
                }
            } catch (error) {
                console.error('Social Login Error:', error);
                showError('signup', `${provider} authentication failed. Please try again.`);
            }
        }

        // Email Sign Up Handler
        async function handleSignup(event) {
            event.preventDefault();
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;

            if (password !== confirmPassword) {
                showError('signup', 'Passwords do not match');
                return;
            }

            if (password.length < 8) {
                showError('signup', 'Password must be at least 8 characters');
                return;
            }

            try {
                // Hash password before sending (basic client-side hashing)
                const hashedPassword = await hashPassword(password);
                
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: hashedPassword })
                });

                if (response.ok) {
                    const data = await response.json();
                    // Store session securely
                    const encryptedSession = await encryptData(JSON.stringify(data));
                    sessionStorage.setItem('session', JSON.stringify(encryptedSession));
                    window.location.href = '/dashboard';
                } else {
                    const error = await response.json();
                    showError('signup', error.message || 'Sign up failed');
                }
            } catch (error) {
                console.error('Signup Error:', error);
                showError('signup', 'Network error. Please try again.');
            }
        }

        // Email Login Handler
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const hashedPassword = await hashPassword(password);
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: hashedPassword })
                });

                if (response.ok) {
                    const data = await response.json();
                    const encryptedSession = await encryptData(JSON.stringify(data));
                    sessionStorage.setItem('session', JSON.stringify(encryptedSession));
                    window.location.href = '/dashboard';
                } else {
                    const error = await response.json();
                    showError('login', error.message || 'Invalid credentials');
                }
            } catch (error) {
                console.error('Login Error:', error);
                showError('login', 'Network error. Please try again.');
            }
        }

        // Simple password hashing using Web Crypto
        async function hashPassword(password) {
        const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function showError(type, message) {
            const errorElement = document.getElementById(type + 'Error');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        // Load Apple Sign In SDK if on Apple device
        if (/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent)) {
            const script = document.createElement('script');
            script.src = 'https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js';
            script.async = true;
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
