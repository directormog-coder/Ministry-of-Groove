<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appleid.cdn-apple.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fgkljjgxecjmiiaptiug.supabase.co https://*.supabase.co;">
    <title>Ministry of Groove | Secure Access Terminal</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Apple Sign-In SDK -->
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tactical Background -->
    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <!-- Main Auth Container -->
    <main class="auth-container glass" style="margin-top: 10vh; position: relative; z-index: 10;">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="terminal-font text-gold glow-gold" style="font-size: 24px; margin: 0; letter-spacing: 0.2em;">
                MINISTRY OF GROOVE
            </div>
            <div class="text-muted terminal-font" style="font-size: 12px; margin-top: 0.5rem; letter-spacing: 0.1em;">
                // SECURE ACCESS TERMINAL v5.1
            </div>
            <div class="terminal-font" style="font-size: 10px; color: var(--electric-blue); margin-top: 0.25rem;">
                [SUPABASE_SECURE_CONNECTION_ESTABLISHED]
            </div>
        </div>

        <!-- Auth Error Display -->
        <div id="auth-alert" class="terminal-font" style="color: var(--critical-red); font-size: 12px; text-align: center; margin-bottom: 1rem; padding: 8px; border: 1px solid var(--critical-red); background: rgba(255, 75, 43, 0.1); border-radius: 4px; display: none;">
        </div>

        <!-- Apple Sign In -->
        <div class="apple-signin-wrapper" id="apple-btn-container" style="margin-bottom: 1rem;">
            <button class="btn-apple-custom" id="apple-signin-btn" type="button">
                Sign in with Apple
            </button>
        </div>

        <!-- Divider -->
        <div class="auth-divider">Or Authenticate With</div>

        <!-- Email/Password Form -->
        <form class="form-tactical" id="login-form" onsubmit="handleEmailLogin(event)">
            <input 
                type="email" 
                id="email" 
                class="input-tactical" 
                placeholder="OPERATIVE_ID@DOMAIN" 
                required
                autocomplete="email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            >
            <input 
                type="password" 
                id="password" 
                class="input-tactical" 
                placeholder="ACCESS_CODE" 
                required
                autocomplete="current-password"
                minlength="8"
            >
            <button type="submit" class="btn-command" style="width: 100%;">
                AUTHENTICATE
            </button>
        </form>

        <!-- Session Status -->
        <div id="session-status" class="terminal-font" style="font-size: 11px; text-align: center; margin-top: 1rem; color: var(--electric-blue); display: none;">
        </div>

        <!-- Abort/Logout -->
        <button class="btn-command btn-danger" style="width: 100%; margin-top: 1rem;" onclick="abortSession()" id="abort-btn">
            ABORT SESSION
        </button>

    </main>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION
        // ==========================================
        // Vercel automatically injects these at build time
        const SUPABASE_URL = process.env.SUPABASE_URL || 'https://fgkljjgxecjmiiaptiug.supabase.co';
        const SUPABASE_ANON_KEY = process.env.SUPABASE_ANON_KEY;
        
        // Initialize Supabase client
        let supabase;
        
        try {
            if (!SUPABASE_ANON_KEY) {
                throw new Error('Supabase Anon Key is not configured. Please set SUPABASE_ANON_KEY environment variable.');
            }
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            });
        } catch (error) {
            console.error('[MOG AUTH] Supabase initialization failed:', error);
            showAlert('AUTHENTICATION_SERVICE_UNAVAILABLE');
            document.querySelector('.btn-command').disabled = true;
            document.getElementById('apple-signin-btn').disabled = true;
        }

        // ==========================================
        // APPLE SIGN-IN CONFIGURATION
        // ==========================================
        // CRITICAL: These must match your Apple Developer Portal settings exactly
        const APPLE_SERVICES_ID = 'YOUR_APPLE_SERVICES_ID'; // e.g., 'com.ministryofgroove.web'
        const APPLE_REDIRECT_URI = 'https://yourdomain.com/auth/callback'; // Must match Supabase callback URL
        
        // Generate cryptographically secure nonce
        function generateNonce() {
            const array = new Uint8Array(16);
            crypto.getRandomValues(array);
            return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('');
        }

        let currentNonce = null;

        // Initialize Apple Sign-In
        function initAppleAuth() {
            try {
                currentNonce = generateNonce();
                
                AppleID.auth.init({
                    clientId: APPLE_SERVICES_ID,
                    scope: 'name email',
                    redirectURI: APPLE_REDIRECT_URI,
                    state: generateSecureState(),
                    nonce: currentNonce,
                    usePopup: true
                });
                
                console.log('[MOG AUTH] Apple Sign-In initialized');
                showSessionStatus('APPLE_AUTH_READY');
            } catch (error) {
                console.error('[MOG AUTH] Apple init failed:', error);
                showAlert('APPLE AUTHENTICATION UNAVAILABLE');
            }
        }

        // ==========================================
        // APPLE SIGN-IN HANDLER
        // ==========================================
        document.getElementById('apple-signin-btn').addEventListener('click', async () => {
            if (!supabase) {
                showAlert('AUTHENTICATION_SERVICE_UNAVAILABLE');
                return;
            }
            
            try {
                showSessionStatus('INITIATING_APPLE_AUTH...');
                
                const response = await AppleID.auth.signIn();
                
                // Extract tokens from Apple response
                const { authorization, user } = response;
                const idToken = authorization.id_token;
                
                showSessionStatus('VERIFYING_IDENTITY...');
                
                // CRITICAL: Send to Supabase for validation
                const { data, error } = await supabase.auth.signInWithIdToken({
                    provider: 'apple',
                    token: idToken,
                    nonce: currentNonce
                });

                if (error) throw error;

                // Handle first-time user data (Apple only sends name on first sign-in)
                if (user && user.name) {
                    const fullName = [
                        user.name.firstName,
                        user.name.middleName,
                        user.name.lastName
                    ].filter(Boolean).join(' ');
                    
                    // Update user metadata in Supabase
                    await supabase.auth.updateUser({
                        data: {
                            full_name: fullName,
                            given_name: user.name.firstName,
                            family_name: user.name.lastName,
                            auth_provider: 'apple'
                        }
                    });
                }

                showSessionStatus('AUTHENTICATION_SUCCESSFUL');
                await handleSuccessfulAuth(data);
                
            } catch (error) {
                console.error('[MOG AUTH] Apple sign in failed:', error);
                showAlert(`AUTHENTICATION_FAILED: ${error.message}`);
            }
        });

        // ==========================================
        // EMAIL/PASSWORD AUTH (Supabase Auth)
        // ==========================================
        async function handleEmailLogin(e) {
            e.preventDefault();
            
            if (!supabase) {
                showAlert('AUTHENTICATION_SERVICE_UNAVAILABLE');
                return;
            }
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                showSessionStatus('AUTHENTICATING...');
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;
                
                showSessionStatus('ACCESS_GRANTED');
                await handleSuccessfulAuth(data);
                
            } catch (error) {
                console.error('[MOG AUTH] Login failed:', error);
                showAlert(`ACCESS_DENIED: ${error.message}`);
            }
        }

        // ==========================================
        // SUPABASE OAUTH FLOW (Alternative)
        // ==========================================
        // Use this if you prefer redirect flow over popup
        async function signInWithAppleOAuth() {
            if (!supabase) {
                showAlert('AUTHENTICATION_SERVICE_UNAVAILABLE');
                return;
            }
            
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'apple',
                options: {
                    redirectTo: 'https://yourdomain.com/auth/callback',
                    scopes: 'name email'
                }
            });
            
            if (error) {
                showAlert(`OAUTH_INIT_FAILED: ${error.message}`);
            }
        }

        // ==========================================
        // SESSION MANAGEMENT
        // ==========================================
        async function handleSuccessfulAuth(data) {
            // Store session securely (Supabase handles this automatically with persistSession)
            console.log('[MOG AUTH] Session established:', data.session.user.email);
            
            // Redirect to secure area
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1000);
        }

        async function abortSession() {
            showSessionStatus('TERMINATING_SESSION...');
            
            if (supabase) {
                const { error } = await supabase.auth.signOut();
                if (error) {
                    console.error('[MOG AUTH] Logout error:', error);
                }
            }
            
            // Clear any local storage
            localStorage.clear();
            sessionStorage.clear();
            
            showSessionStatus('SESSION_TERMINATED');
            setTimeout(() => {
                window.location.href = '/';
            }, 500);
        }

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function generateSecureState() {
            return 'mog_' + btoa(crypto.getRandomValues(new Uint32Array(4)).join('')).substring(0, 16);
        }

        function showAlert(message) {
            const alert = document.getElementById('auth-alert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showSessionStatus(status) {
            const statusEl = document.getElementById('session-status');
            const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
            statusEl.textContent = `[${timestamp}] ${status}`;
            statusEl.style.display = 'block';
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            initAppleAuth();
            
            // Check for existing session
            if (supabase) {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    console.log('[MOG AUTH] Existing session found');
                    showSessionStatus('EXISTING_SESSION_DETECTED');
                    // Optionally auto-redirect: window.location.href = '/dashboard.html';
                }
            }
        });

        // Listen for auth state changes
        if (supabase) {
            supabase.auth.onAuthStateChange((event, session) => {
                console.log('[MOG AUTH] State change:', event);
                if (event === 'SIGNED_IN') {
                    showSessionStatus('SIGNED_IN');
                } else if (event === 'SIGNED_OUT') {
                    showSessionStatus('SIGNED_OUT');
                }
            });
        }
    </script>
</body>
</html>
