<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appleid.cdn-apple.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fgkljjgxecjmiiaptiug.supabase.co https://*.supabase.co wss://*.supabase.co;">
    <meta name="robots" content="noindex, nofollow">
    <title>Ministry of Groove | Secure Access Terminal</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Apple Sign-In SDK -->
    <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tactical Background -->
    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <!-- Main Auth Container -->
    <main class="auth-container glass" style="margin-top: 10vh; position: relative; z-index: 10;">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="terminal-font text-gold glow-gold" style="font-size: 24px; margin: 0; letter-spacing: 0.2em;">
                MINISTRY OF GROOVE
            </div>
            <div class="text-muted terminal-font" style="font-size: 12px; margin-top: 0.5rem; letter-spacing: 0.1em;">
                // SECURE ACCESS TERMINAL v{{APP_VERSION}}
            </div>
            <div class="terminal-font" style="font-size: 10px; color: var(--electric-blue); margin-top: 0.25rem;">
                [SUPABASE_SECURE_CONNECTION_ESTABLISHED]
            </div>
        </div>

        <!-- Auth Error Display -->
        <div id="auth-alert" class="terminal-font" style="color: var(--critical-red); font-size: 12px; text-align: center; margin-bottom: 1rem; padding: 8px; border: 1px solid var(--critical-red); background: rgba(255, 75, 43, 0.1); border-radius: 4px; display: none;">
        </div>

        <!-- Apple Sign In -->
        <div class="apple-signin-wrapper" id="apple-btn-container" style="margin-bottom: 1rem;">
            <button class="btn-apple-custom" id="apple-signin-btn" type="button">
                Sign in with Apple
            </button>
        </div>

        <!-- Divider -->
        <div class="auth-divider">Or Authenticate With</div>

        <!-- Email/Password Form -->
        <form class="form-tactical" id="login-form" onsubmit="handleEmailLogin(event)">
            <input 
                type="email" 
                id="email" 
                class="input-tactical" 
                placeholder="OPERATIVE_ID@DOMAIN" 
                required
                autocomplete="email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            >
            <input 
                type="password" 
                id="password" 
                class="input-tactical" 
                placeholder="ACCESS_CODE" 
                required
                autocomplete="current-password"
                minlength="8"
            >
            <button type="submit" class="btn-command" style="width: 100%;">
                AUTHENTICATE
            </button>
        </form>

        <!-- Session Status -->
        <div id="session-status" class="terminal-font" style="font-size: 11px; text-align: center; margin-top: 1rem; color: var(--electric-blue); display: none;">
        </div>

        <!-- Abort/Logout -->
        <button class="btn-command btn-danger" style="width: 100%; margin-top: 1rem;" onclick="abortSession()" id="abort-btn">
            ABORT SESSION
        </button>

    </main>

    <script>
        // ==========================================
        // SECURE CONFIGURATION (INJECTED AT BUILD)
        // ==========================================
        const SUPABASE_URL = '{{SUPABASE_URL}}';
        const SUPABASE_ANON_KEY = '{{SUPABASE_ANON_KEY}}';
        const APPLE_SERVICES_ID = '{{APPLE_SERVICES_ID}}';
        const APPLE_REDIRECT_URI = '{{APPLE_REDIRECT_URI}}';
        
        // Security: Validate injection worked
        if (SUPABASE_ANON_KEY === '{{SUPABASE_ANON_KEY}}') {
            console.error('[MOG SECURITY] Build injection failed - using fallback');
        }
        
        // Initialize Supabase
        let supabase = null;
        
        try {
            if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('{{')) {
                throw new Error('Invalid Supabase configuration');
            }
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            });
            
            console.log('[MOG AUTH] Secure connection established');
        } catch (error) {
            console.error('[MOG AUTH] Initialization failed:', error);
            document.body.innerHTML = '<div style="color:red;text-align:center;padding:50px;">AUTHENTICATION SERVICE UNAVAILABLE</div>';
            throw error;
        }

        // ==========================================
        // APPLE SIGN-IN
        // ==========================================
        let currentNonce = null;
        
        function initAppleAuth() {
            if (!APPLE_SERVICES_ID || APPLE_SERVICES_ID.includes('{{')) {
                console.log('[MOG AUTH] Apple Sign-In not configured');
                document.getElementById('apple-btn-container').style.display = 'none';
                return;
            }
            
            try {
                currentNonce = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                    .map(b => b.toString(16).padStart(2, '0')).join('');
                
                AppleID.auth.init({
                    clientId: APPLE_SERVICES_ID,
                    scope: 'name email',
                    redirectURI: APPLE_REDIRECT_URI,
                    state: 'mog_' + Math.random().toString(36).substring(2, 15),
                    nonce: currentNonce,
                    usePopup: true
                });
                
                console.log('[MOG AUTH] Apple Sign-In ready');
            } catch (error) {
                console.error('[MOG AUTH] Apple init failed:', error);
                document.getElementById('apple-btn-container').style.display = 'none';
            }
        }

        // ==========================================
        // AUTH HANDLERS
        // ==========================================
        document.getElementById('apple-signin-btn').addEventListener('click', async () => {
            try {
                const response = await AppleID.auth.signIn();
                const { authorization, user } = response;
                
                const { data, error } = await supabase.auth.signInWithIdToken({
                    provider: 'apple',
                    token: authorization.id_token,
                    nonce: currentNonce
                });
                
                if (error) throw error;
                
                // Update profile on first sign-in
                if (user?.name) {
                    const fullName = [user.name.firstName, user.name.lastName]
                        .filter(Boolean).join(' ');
                    await supabase.auth.updateUser({
                        data: { full_name: fullName, auth_provider: 'apple' }
                    });
                }
                
                window.location.href = '/dashboard.html';
            } catch (error) {
                showAlert(`AUTHENTICATION_FAILED: ${error.message}`);
            }
        });

        async function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email, password
                });
                
                if (error) throw error;
                window.location.href = '/dashboard.html';
            } catch (error) {
                showAlert(`ACCESS_DENIED: ${error.message}`);
            }
        }

        async function abortSession() {
            await supabase.auth.signOut();
            localStorage.clear();
            window.location.href = '/';
        }

        function showAlert(message) {
            const alert = document.getElementById('auth-alert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 5000);
        }

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            initAppleAuth();
            
            // Check existing session
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) window.location.href = '/dashboard.html';
            });
        });
    </script>
</body>
</html>
