    <style>
        /* ── Logo colours ────────────────────────────────────────
           Black:       #000000

           Teal:        #00d4aa  /  bright #4aecd4  /  dim  #006e59
        ──────────────────────────────────────────────────────── */
        :root {
            --black:       #000000;
            --gold:        #d4af37;
            --gold-bright: #f0c040;
            --gold-dark:   #8b6914;
            --gold-glow:   rgba(212,175,55,0.4);
            --teal:        #00d4aa;
            --teal-bright: #4aecd4;
            --teal-dim:    #006e59;

            --text-xs:   clamp(0.6rem,  1.8vw, 0.72rem);
            --text-sm:   clamp(0.75rem, 2.2vw, 0.875rem);
            --text-base: clamp(0.875rem,2.8vw, 1rem);
            --text-lg:   clamp(1rem,    3.5vw, 1.25rem);
            --text-xl:   clamp(1.1rem,  4.5vw, 1.5rem);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--black);
            color: #e8f0ee;
            min-height: 100vh; min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mono  { font-family: 'Share Tech Mono', monospace; }
        .orbit { font-family: 'Orbitron', sans-serif; }

        button, a { min-height: 44px; touch-action: manipulation; }

        /* ── Background ── */
        .logo-watermark {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: clamp(240px, 80vmin, 520px);
            height: clamp(240px, 80vmin, 520px);
            background: url('/assets/images/logo.png') center/contain no-repeat;
            opacity: 0.04; pointer-events: none; z-index: 0;
            filter: drop-shadow(0 0 50px rgba(212,175,55,0.12))
                    drop-shadow(0 0 25px rgba(0,212,170,0.08));
        }

        .circuit-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background-image:
                linear-gradient(rgba(0,212,170,0.022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,170,0.022) 1px, transparent 1px);
            background-size: 52px 52px;
        }
        @media (max-width:480px) { .circuit-grid { display: none; } }

        .vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 2;
            background: radial-gradient(ellipse at center, transparent 28%, rgba(0,0,0,0.85) 100%);
        }

        .scanline {
            position: fixed; top: -80px; left: 0;
            width: 100%; height: 80px; z-index: 3; pointer-events: none;
            background: linear-gradient(transparent, rgba(212,175,55,0.022) 50%, transparent);
            animation: scanline 14s linear infinite;
        }
        @keyframes scanline { to { top: 100vh; } }

        /* ── Page layout ── */
        .page {
            position: relative; z-index: 10;
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: clamp(12px, 4vw, 20px);
        }

        /* ── Card ── */
        .card {
            width: 100%; max-width: 460px;
            background: rgba(6,10,8,0.93);
            border: 1px solid rgba(0,212,170,0.16);
            border-radius: clamp(1.5rem, 4vw, 2.5rem);
            padding: clamp(1.4rem, 5vw, 2.4rem);
            box-shadow:
                0 0 80px rgba(212,175,55,0.04),
                0 0 40px rgba(0,0,0,0.8),
                inset 0 1px 0 rgba(255,255,255,0.04);
            position: relative; overflow: hidden;
        }
        @media (min-width:641px) {
            .card { backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); }
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: -100%;
            height: 2px; width: 100%;
            background: linear-gradient(90deg,
                transparent, var(--teal), var(--gold-bright), var(--teal), transparent);
            animation: cardFlow 4s linear infinite;
        }
        @keyframes cardFlow { to { left: 100%; } }

        .card::after {
            content: ''; position: absolute; bottom: 14px; right: 14px;
            width: 15px; height: 15px;
            border-right: 2px solid rgba(212,175,55,0.3);
            border-bottom: 2px solid rgba(0,212,170,0.3);
        }

            margin-bottom: clamp(1.1rem, 3.5vw, 1.75rem);
        }

        .logo-ring-outer {
            position: relative;
            width: clamp(88px, 22vw, 108px);
            height: clamp(88px, 22vw, 108px);
            margin-bottom: clamp(0.9rem, 2.5vw, 1.2rem);
        }

        .logo-spin {
            position: absolute; inset: 0; border-radius: 50%; padding: 3px;
            background: conic-gradient(from 0deg,
                var(--gold-bright), var(--teal), var(--gold-dark),
                var(--teal-bright), var(--gold));
            animation: ringRotate 15s linear infinite;
        }
        .logo-spin > div {
            width: 100%; height: 100%; border-radius: 50%;
            border: 3px solid var(--black);
            background: var(--black);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .logo-spin img {
            width: 80%; height: 80%; object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(212,175,55,0.5))
                    drop-shadow(0 0 5px rgba(0,212,170,0.3));
        }

        .logo-inner-ring {
            position: absolute; inset: 8px; border-radius: 50%;
            border: 1px solid rgba(0,212,170,0.18);
            animation: ringRotate 9s linear infinite reverse;
        }

        @keyframes ringRotate { to { transform: rotate(360deg); } }

        .brand-name {
            font-family: 'Orbitron', sans-serif; font-weight: 900;
            letter-spacing: 0.14em; text-transform: uppercase;
            font-size: var(--text-xl); text-align: center;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold), var(--teal));

        .sec-dot {
            width: 7px; height: 7px; border-radius: 50%;

            animation: secPulse 2.2s ease-in-out infinite;
            display: inline-block; margin-right: 0.5rem; flex-shrink: 0;

        .alert {

            padding: 0.8rem 1rem; border-radius: 0.75rem;
            margin-bottom: clamp(0.7rem, 2vw, 1.1rem);
            font-family: 'Share Tech Mono', monospace;
            font-size: var(--text-xs); line-height: 1.5;

        .alert.show { display: flex; }
        .alert.error   { background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.3); color:#fca5a5; }
        .alert.success { background:rgba(0,212,170,0.1); border:1px solid rgba(0,212,170,0.3); color:var(--teal); }
        .alert.warning { background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.3); color:var(--gold); }

        .field { position: relative; margin-bottom: clamp(0.65rem, 2vw, 0.9rem); }

        .field-icon {

            color: var(--teal); opacity: 0.5; width: 17px; height: 17px;

        .field-input {
            width: 100%;
            background: rgba(0,6,4,0.85);
            border: 1px solid rgba(0,212,170,0.18);
            border-radius: 0.85rem;
            padding: 0.9rem 2.8rem 0.9rem 2.6rem;
            color: #e8f0ee;
            font-family: 'Share Tech Mono', monospace;
            font-size: max(16px, var(--text-sm));

        }
        
        .btn-primary {
            width: 100%; padding: clamp(0.85rem, 2.5vw, 1rem);
            background: linear-gradient(135deg, var(--gold-dark), var(--gold-bright), var(--gold-dark));
            border: none; border-radius: 0.85rem;
            color: #000; font-family: 'Orbitron', sans-serif;
            font-size: var(--text-sm); font-weight: 900;
            letter-spacing: 0.16em; text-transform: uppercase;
            cursor: pointer; position: relative; overflow: hidden;

        }

        .btn-google {
            width: 100%; padding: clamp(0.85rem, 2.5vw, 1rem);
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 0.85rem;
            color: #e8f0ee; font-family: 'Rajdhani', sans-serif;
            font-size: var(--text-sm); font-weight: 700;
            letter-spacing: 0.07em; text-transform: uppercase;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.65rem;
            transition: all 0.28s ease;
            margin-bottom: clamp(0.65rem, 2vw, 0.9rem);
        }

        .divider {
            display: flex; align-items: center; gap: 0.75rem;
            margin: clamp(0.6rem, 2vw, 1rem) 0;

        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
        }
        .divider span {
            font-size: var(--text-xs); color: rgba(255,255,255,0.3);

        .gold-line {
            height: 1px; margin: clamp(0.9rem, 3vw, 1.4rem) 0;

            opacity: 0.3;
        }

        .contact-grid {
            display: grid; grid-template-columns: repeat(4,1fr);
            gap: clamp(0.4rem, 1.5vw, 0.6rem); margin-top: 0.65rem;
        }

        .contact-btn {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.3rem; padding: clamp(0.5rem,2vw,0.7rem) 0.25rem;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,212,170,0.16);
            border-radius: 0.75rem;
            color: rgba(255,255,255,0.5); text-decoration: none; cursor: pointer;
            font-size: var(--text-xs); font-family: 'Orbitron',sans-serif;
            letter-spacing: 0.04em; text-transform: uppercase;
            transition: all 0.25s ease;
        }
        .contact-btn svg { width: 16px; height: 16px; }

        .auth-footer {
            text-align: center;
            margin-top: clamp(0.75rem, 2.5vw, 1.1rem);
        }
        .auth-footer p {
            font-family: 'Share Tech Mono', monospace;
            font-size: var(--text-xs); color: rgba(255,255,255,0.15);
            letter-spacing: 0.15em; text-transform: uppercase;
        }

        .loading-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.94);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1.5rem;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.show { opacity: 1; pointer-events: all; }

        .loader-wrap { position: relative; width: 64px; height: 64px; }
        .loader {
            width: 64px; height: 64px; border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--gold);
            border-right-color: var(--teal);
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            font-family: 'Share Tech Mono', monospace;
            font-size: var(--text-xs); color: var(--gold);
            text-transform: uppercase; letter-spacing: 0.35em;
            animation: textBlink 1.5s ease-in-out infinite;
        }
    </style>
</head>

<body>

                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

    <script>
    /* ══════════════════════════════════════════════════════════
       UPGRADED M.O.G. LOGIN LOGIC
    ══════════════════════════════════════════════════════════ */

    function getSb() { return window.sb || window.supabaseClient || null; }

    window.addEventListener('load', async () => {
        const client = getSb();
        if (!client) return;

        /* Check existing session */
        const { data:{ session } } = await client.auth.getSession();
        if (session) {
            setLoading(true, 'Resuming session...');
            await performSecureRedirect();
        }
    });

    /* ── UPGRADE: The Secure Redirect ── */
    async function performSecureRedirect() {
        try {
            // This calls your new handleLoginRedirect function in auth.js
            await window.MOGAuth.handleLoginRedirect();
        } catch(e) {
            setLoading(false);
            showAlert('Clearance verification failed.', 'error');
        }
    }

    async function signInWithGoogle() {
        const client = getSb();
        setLoading(true, 'Redirecting...');
        await client.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/login.html' }
        });
    }

    async function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        setLoading(true, 'Authenticating...');
        const client = getSb();
        
        const { error } = await client.auth.signInWithPassword({ email, password });
        
        if (error) {
            setLoading(false);
            showAlert(error.message, 'error');
        } else {
            await performSecureRedirect();
        }
    }

    function showAlert(msg, type) {
        const box = document.getElementById('alertBox');
        box.innerText = msg;
        box.className = `alert show ${type}`;
        setTimeout(() => box.classList.remove('show'), 4000);
    }

    function setLoading(show, text) {
        document.getElementById('loadingOverlay').classList.toggle('show', show);
        document.getElementById('loadingText').innerText = text;
    }
    </script>
