<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fgkljjgxecjmiiaptiug.supabase.co https://*.supabase.co wss://*.supabase.co;">
    <meta name="robots" content="noindex, nofollow">
    <title>Ministry of Groove | Secure Access Terminal</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tactical Background -->
    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <!-- Main Auth Container -->
    <main class="auth-container glass" style="margin-top: 10vh; position: relative; z-index: 10;">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="terminal-font text-gold glow-gold" style="font-size: 24px; margin: 0; letter-spacing: 0.2em;">
                MINISTRY OF GROOVE
            </div>
            <div class="text-muted terminal-font" style="font-size: 12px; margin-top: 0.5rem; letter-spacing: 0.1em;">
                // SECURE ACCESS TERMINAL v{{APP_VERSION}}
            </div>
            <div class="terminal-font" style="font-size: 10px; color: var(--electric-blue); margin-top: 0.25rem;">
                [SUPABASE_SECURE_CONNECTION_ESTABLISHED]
            </div>
        </div>

        <!-- Auth Error Display -->
        <div id="auth-alert" class="terminal-font" style="color: var(--critical-red); font-size: 12px; text-align: center; margin-bottom: 1rem; padding: 8px; border: 1px solid var(--critical-red); background: rgba(255, 75, 43, 0.1); border-radius: 4px; display: none;">
        </div>

        <!-- Email/Password Form -->
        <form class="form-tactical" id="login-form" onsubmit="handleEmailLogin(event)">
            <input 
                type="email" 
                id="email" 
                class="input-tactical" 
                placeholder="OPERATIVE_ID@DOMAIN" 
                required
                autocomplete="email"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
            >
            <input 
                type="password" 
                id="password" 
                class="input-tactical" 
                placeholder="ACCESS_CODE" 
                required
                autocomplete="current-password"
                minlength="8"
            >
            <button type="submit" class="btn-command" style="width: 100%;">
                AUTHENTICATE
            </button>
        </form>

        <!-- Magic Link Option -->
        <div style="text-align: center; margin-top: 1rem;">
            <button onclick="toggleMagicLink()" class="terminal-font text-gold" style="background: none; border: none; cursor: pointer; font-size: 11px; text-decoration: underline;">
                USE MAGIC LINK INSTEAD
            </button>
        </div>

        <!-- Magic Link Form (Hidden by default) -->
        <form class="form-tactical" id="magic-link-form" onsubmit="handleMagicLink(event)" style="display: none; margin-top: 1rem;">
            <input 
                type="email" 
                id="magic-email" 
                class="input-tactical" 
                placeholder="OPERATIVE_ID@DOMAIN" 
                required
                autocomplete="email"
            >
            <button type="submit" class="btn-command" style="width: 100%;">
                SEND SECURE LINK
            </button>
        </form>

        <!-- Session Status -->
        <div id="session-status" class="terminal-font" style="font-size: 11px; text-align: center; margin-top: 1rem; color: var(--electric-blue); display: none;">
        </div>

        <!-- Abort/Logout -->
        <button class="btn-command btn-danger" style="width: 100%; margin-top: 1rem;" onclick="abortSession()" id="abort-btn">
            ABORT SESSION
        </button>

    </main>

    <script>
        // ==========================================
        // SECURE CONFIGURATION (INJECTED AT BUILD)
        // ==========================================
        const SUPABASE_URL = '{{SUPABASE_URL}}';
        const SUPABASE_ANON_KEY = '{{SUPABASE_ANON_KEY}}';
        
        // Security: Validate injection worked
        if (SUPABASE_ANON_KEY === '{{SUPABASE_ANON_KEY}}') {
            console.error('[MOG SECURITY] Build injection failed - check environment variables');
        }
        
        // Initialize Supabase
        let supabase = null;
        
        try {
            if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('{{')) {
                throw new Error('Invalid Supabase configuration');
            }
            
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            });
            
            console.log('[MOG AUTH] Secure connection established');
        } catch (error) {
            console.error('[MOG AUTH] Initialization failed:', error);
            document.body.innerHTML = '<div style="color:red;text-align:center;padding:50px;">AUTHENTICATION SERVICE UNAVAILABLE</div>';
            throw error;
        }

        // ==========================================
        // AUTH HANDLERS
        // ==========================================
        
        async function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            
            // Basic validation
            if (!email || !password) {
                showAlert('ACCESS_DENIED: Credentials required');
                return;
            }
            
            if (password.length < 8) {
                showAlert('ACCESS_DENIED: Invalid access code format');
                return;
            }
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email, 
                    password
                });
                
                if (error) throw error;
                
                // Security: Clear sensitive fields
                document.getElementById('password').value = '';
                
                // Redirect based on role
                const role = data.user?.user_metadata?.role || 'operative';
                const redirectMap = {
                    'director': '/pages/directorate.html',
                    'operative': '/hub.html',
                    'admin': '/pages/admin.html'
                };
                
                window.location.href = redirectMap[role] || '/hub.html';
                
            } catch (error) {
                showAlert(`ACCESS_DENIED: ${error.message}`);
                document.getElementById('password').value = '';
            }
        }

        async function handleMagicLink(e) {
            e.preventDefault();
            const email = document.getElementById('magic-email').value.trim().toLowerCase();
            
            if (!email) {
                showAlert('ACCESS_DENIED: Email required');
                return;
            }
            
            try {
                const { error } = await supabase.auth.signInWithOtp({
                    email,
                    options: {
                        emailRedirectTo: window.location.origin + '/hub.html'
                    }
                });
                
                if (error) throw error;
                
                showAlert('SUCCESS: Secure link dispatched to your terminal');
                document.getElementById('magic-email').value = '';
                
            } catch (error) {
                showAlert(`TRANSMISSION_FAILED: ${error.message}`);
            }
        }

        function toggleMagicLink() {
            const form = document.getElementById('magic-link-form');
            const isVisible = form.style.display !== 'none';
            form.style.display = isVisible ? 'none' : 'block';
        }

        async function abortSession() {
            try {
                await supabase.auth.signOut();
            } catch (e) {
                console.error('Logout error:', e);
            }
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = '/';
        }

        function showAlert(message) {
            const alert = document.getElementById('auth-alert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 5000);
        }

        // ==========================================
        // SECURITY: Prevent credential caching
        // ==========================================
        window.addEventListener('beforeunload', () => {
            document.getElementById('password').value = '';
        });

        // ==========================================
        // INIT
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check existing session
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    const role = session.user?.user_metadata?.role || 'operative';
                    const redirectMap = {
                        'director': '/pages/directorate.html',
                        'operative': '/hub.html',
                        'admin': '/pages/admin.html'
                    };
                    window.location.href = redirectMap[role] || '/hub.html';
                }
            });
        });
    </script>
</body>
</html>
