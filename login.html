<!DOCTYPE html>
<html lang="en" color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/images/logo.png">
  <title>M.O.G. | SECURE ACCESS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    @layer base, layout, components, animations, utilities;

    @layer base {
      :root {
        --black: #000;
        --gold: #d4af37; --gold-bright: #f0c040; --gold-dark: #8b6914;
        --gold-glow: rgba(212,175,55,0.4);
        --teal: #00d4aa; --teal-glow: rgba(0,212,170,0.3);
        --red: #dc2626; --red-glow: rgba(220,38,38,0.4);
        --surface: rgba(5,7,6,0.98);
        --border: rgba(212,175,55,0.15);
        --text: #e8f0ee;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-top: env(safe-area-inset-top, 0px);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Rajdhani', sans-serif;
        background: var(--black); color: var(--text);
        min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        overflow: hidden; padding: 1rem;
      }
      [x-cloak] { display: none !important; }
    }

    @layer layout {
      .page-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .bg-watermark {
        position: absolute; inset: 0;
        background: url('/assets/images/logo.png') center/400px no-repeat;
        opacity: 0.04; filter: blur(2px);
      }
      .bg-grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(rgba(212,175,55,0.02) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(212,175,55,0.02) 1px, transparent 1px);
        background-size: 50px 50px;
      }

      .card {
        position: relative; z-index: 10;
        width: 100%; max-width: 400px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 2rem; padding: 2.5rem;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      }
      .card.shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: var(--red); }
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px, 0, 0); }
        20%, 80% { transform: translate3d(2px, 0, 0); }
        30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
        40%, 60% { transform: translate3d(4px, 0, 0); }
      }
    }

    @layer components {
      .logo-ring {
        width: 90px; height: 90px; margin: 0 auto 1.5rem;
        border-radius: 50%; padding: 3px;
        background: conic-gradient(from 0deg, var(--gold), var(--teal), var(--gold));
        animation: spin 10s linear infinite;
      }
      .logo-ring div {
        width: 100%; height: 100%; background: #000; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
      }
      .logo-ring img { width: 70%; filter: drop-shadow(0 0 10px var(--gold-glow)); }
      @keyframes spin { to { transform: rotate(360deg); } }

      .field-input {
        width: 100%; background: rgba(0,0,0,0.5);
        border: 1px solid rgba(212,175,55,0.2);
        border-radius: 1rem; padding: 1rem;
        color: #fff; font-family: 'Share Tech Mono', monospace;
        margin-bottom: 1rem; transition: all 0.3s;
      }
      .field-input:focus { border-color: var(--gold); box-shadow: 0 0 15px var(--gold-glow); outline: none; }
      
      .btn-primary {
        width: 100%; padding: 1rem;
        background: var(--gold); border: none; border-radius: 1rem;
        color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900;
        text-transform: uppercase; letter-spacing: 0.1em;
        cursor: pointer; transition: 0.3s;
      }
      .btn-primary:hover { background: var(--gold-bright); transform: translateY(-2px); box-shadow: 0 5px 20px var(--gold-glow); }
      .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .alert-banner {
        display: none; background: rgba(220,38,38,0.2);
        border: 1px solid var(--red); border-radius: 0.5rem;
        padding: 0.75rem; margin-bottom: 1rem;
        color: #fca5a5; font-size: 0.7rem; text-align: center; font-family: 'Orbitron', sans-serif;
      }
      .alert-banner.active { display: block; }
    }

    .loading-overlay {
      position: fixed; inset: 0; z-index: 100; background: #000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .loading-overlay.active { display: flex; }
  </style>
</head>
<body>

  <div class="page-bg">
    <div class="bg-watermark"></div>
    <div class="bg-grid"></div>
  </div>

  <div class="loading-overlay" id="loader">
    <div class="logo-ring"><div><img src="/assets/images/logo.png"></div></div>
    <p class="font-orbit text-gold text-xs tracking-widest animate-pulse" id="loaderText">AUTHENTICATING...</p>
  </div>

  <main class="card" id="loginCard">
    <div class="logo-ring">
      <div><img src="/assets/images/logo.png" alt="MOG"></div>
    </div>
    
    <div class="text-center mb-8">
      <h1 class="font-orbit text-xl font-black text-white tracking-widest">M.O.G.</h1>
      <p class="font-mono text-[10px] text-gold/60 uppercase tracking-[0.3em]">Secure Access Terminal</p>
    </div>

    <div class="alert-banner" id="errorBanner">
      ⚠ ACCESS DENIED: INVALID CREDENTIALS
    </div>

    <div class="space-y-4">
      <input type="email" id="email" class="field-input" placeholder="OPERATIVE ID (EMAIL)">
      <input type="password" id="password" class="field-input" placeholder="ACCESS CODE">
      
      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">
        Initialize Access
      </button>

      <div class="flex items-center justify-between px-2">
        <button onclick="magicLink()" class="font-mono text-[9px] text-gray-500 hover:text-gold uppercase tracking-widest">Request Magic Link</button>
        <div class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
            <span class="font-mono text-[9px] text-gray-500 uppercase">Uplink Stable</span>
        </div>
      </div>
    </div>

    <footer class="mt-12 text-center border-t border-white/5 pt-6">
        <p class="font-mono text-[8px] text-gray-700 tracking-widest uppercase">Ministry of Groove // Emalahleni // 2026</p>
    </footer>
  </main>

  
  <script>
    const getSb = () => window.sb || window.supabaseClient;
    let attempts = 0;

    async function handleLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const loader = document.getElementById('loader');

      if(!email || !password) return;

      btn.disabled = true;
      loader.classList.add('active');

      try {
        const { data, error } = await getSb().auth.signInWithPassword({ email, password });
        
        if (error) throw error;

        // Login Success - Route by Rank
        document.getElementById('loaderText').textContent = "VERIFYING CLEARANCE...";
        const { data: profile } = await getSb().from('profiles').select('rank').eq('id', data.user.id).single();

        if (profile?.rank === 'DIRECTOR') {
          localStorage.setItem('userRole', 'director');
          window.location.href = '/pages/directorate.html';
        } else {
          window.location.href = '/index.html';
        }

      } catch (err) {
        attempts++;
        loader.classList.remove('active');
        btn.disabled = false;
        
        const card = document.getElementById('loginCard');
        const banner = document.getElementById('errorBanner');
        
        card.classList.add('shake');
        banner.classList.add('active');
        banner.textContent = `⚠ ACCESS DENIED: ATTEMPT ${attempts}/3`;
        
        if(attempts >= 3) {
            banner.textContent = "⚠ SYSTEM LOCKED: INTRUSION LOGGED";
            btn.style.display = 'none';
            // Log intrusion to DB
            getSb().from('activity_log').insert({ type: 'INTRUSION', description: `Failed login for ${email}` });
        }

        setTimeout(() => card.classList.remove('shake'), 500);
        navigator.vibrate?.([50, 50, 50]);
      }
    }

    async function magicLink() {
        const email = document.getElementById('email').value;
        if(!email) return alert("Enter Operative ID");
        
        const { error } = await getSb().auth.signInWithOtp({ email });
        if(!error) alert("Magic link dispatched to secure inbox.");
    }
  </script>
</body>
</html>
