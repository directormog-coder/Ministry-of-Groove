<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050A0E">
<title>M.O.G. — Operative Access</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<style>
:root{--gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;--teal:#00E5CC;--teal-dim:#009E8E;--black:#050A0E;--navy:#0D1F2D;--panel:rgba(13,31,45,0.88);--border:rgba(201,168,76,0.28);--border-teal:rgba(0,229,204,0.22);--text:rgba(255,255,255,0.9);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--black);font-family:'Rajdhani',sans-serif;overflow:hidden;}
canvas#bg{position:fixed;inset:0;z-index:0;opacity:0.18;}
.scanlines{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);}
.status-bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(5,10,14,0.95);border-bottom:1px solid var(--border);font-family:'Share Tech Mono',monospace;color:var(--text);font-size:9px;letter-spacing:2px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.25}}
.status-right{margin-left:auto;color:rgba(201,168,76,0.45);}
.wrap{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 24px 30px;overflow-y:auto;}
.wrap::-webkit-scrollbar{display:none;}
.logo-ring{width:108px;height:108px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(201,168,76,0.35);margin-bottom:12px;}
.logo-ring img{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;}
.org-name{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--gold);letter-spacing:5px;text-align:center;margin-bottom:2px;}
.org-slogan{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--teal);letter-spacing:1.5px;text-align:center;margin-bottom:28px;text-transform:uppercase;opacity:0.9;}
.panel{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:28px 24px;backdrop-filter:blur(16px);position:relative;box-shadow:0 20px 40px rgba(0,0,0,0.35);}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),var(--teal),var(--gold),transparent);}
.panel-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold-light);letter-spacing:4px;margin-bottom:22px;text-align:center;}
.btn-google{width:100%;padding:13px 16px;background:rgba(201,168,76,0.07);border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--text);letter-spacing:1.8px;cursor:pointer;transition:all .2s ease;}
.btn-google:hover,.btn-google:active{background:rgba(201,168,76,0.16);border-color:var(--gold);box-shadow:0 0 22px rgba(201,168,76,0.2);}
.btn-google svg{width:18px;height:18px;flex-shrink:0;}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--gold-dim);letter-spacing:2px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:2px;margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;background:rgba(0,229,204,0.04);border:1px solid var(--border-teal);border-radius:4px;outline:none;font-family:'Rajdhani',sans-serif;font-size:15px;color:var(--text);}
.field input:focus{border-color:var(--teal);box-shadow:0 0 12px rgba(0,229,204,0.12);}
.field input::placeholder{color:rgba(255,255,255,0.15);}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold-dim),var(--gold));border:none;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--black);letter-spacing:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s ease;}
.btn-login:hover,.btn-login:active{background:linear-gradient(135deg,var(--gold),var(--gold-light));box-shadow:0 0 28px rgba(201,168,76,0.45);}
.btn-login:disabled{opacity:0.55;cursor:not-allowed;}
.spinner{width:18px;height:18px;border:2px solid rgba(5,10,14,0.4);border-top-color:var(--black);border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{display:none;background:rgba(255,59,59,0.1);border:1px solid rgba(255,59,59,0.3);border-radius:4px;padding:10px 14px;margin-bottom:12px;font-family:'Share Tech Mono',monospace;font-size:9px;color:#ffb0b0;letter-spacing:1px;}
.error-msg.show{display:block;animation:shake 0.4s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.register-link{text-align:center;margin-top:18px;font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--gold-dim);letter-spacing:1px;}
.register-link a{color:var(--teal);text-decoration:none;cursor:pointer;font-weight:700;}
.classify{margin-top:24px;font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(201,168,76,0.22);letter-spacing:3px;border:1px solid rgba(201,168,76,0.1);padding:6px 16px;border-radius:4px;}
.modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(5,10,14,0.94);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:24px;}
.modal-overlay.open{display:flex;}
.modal-box{width:100%;max-width:380px;background:var(--navy);border:1px solid var(--border-teal);border-radius:6px;padding:30px 24px;position:relative;}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);}
.modal-close{position:absolute;top:12px;right:12px;background:none;border:1px solid var(--border);color:var(--gold-dim);font-size:14px;padding:4px 10px;border-radius:3px;cursor:pointer;font-family:'Share Tech Mono',monospace;}
.modal-close:hover{color:var(--gold);border-color:var(--gold);}
.modal-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--teal);letter-spacing:3px;margin-bottom:22px;text-align:center;}
.btn-register{width:100%;padding:14px;background:linear-gradient(135deg,var(--teal-dim),var(--teal));border:none;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--black);letter-spacing:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.toast{display:none;position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:rgba(0,200,83,0.14);border:1px solid rgba(0,200,83,0.4);border-radius:6px;padding:12px 24px;font-family:'Share Tech Mono',monospace;font-size:9px;color:#bff7d4;letter-spacing:1px;}
.toast.show{display:block;animation:toastIn 0.3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="scanlines"></div>

<div class="status-bar">
  <div class="dot"></div>
  <span>ENCRYPTION ACTIVE</span>
  <span class="status-right">CLASSIFIED — OPERATIVE ACCESS ONLY</span>
</div>

<div class="wrap">
  <div class="logo-ring">
    <img src="logo.png" alt="M.O.G." id="logoImg" onerror="this.onerror=null;this.src='assets/images/logo.png'">
  </div>
  <div class="org-name">MINISTRY OF GROOVE</div>
  <div class="org-slogan">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID.</div>

  <div class="panel">
    <div class="panel-title">— OPERATIVE AUTHENTICATION —</div>

    <button class="btn-google" id="googleBtn" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      INFILTRATE WITH GOOGLE
    </button>

    <div class="divider">OR</div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field">
      <label for="emailInput">OPERATIVE ID (EMAIL)</label>
      <input type="email" id="emailInput" placeholder="operative@gmail.com" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label for="passInput">CIPHER (PASSWORD)</label>
      <input type="password" id="passInput" placeholder="••••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleEmailLogin()">
    </div>

    <button class="btn-login" id="loginBtn" onclick="handleEmailLogin()">
      <span id="loginText">INITIATE ACCESS</span>
      <div class="spinner" id="loginSpinner"></div>
    </button>

    <div class="register-link">
      NEW RECRUIT? <a onclick="openRegister()">REQUEST CLEARANCE</a>
    </div>
  </div>

  <div class="classify">TOP SECRET // M.O.G. NETWORK // EST. 2026</div>
</div>

<div class="modal-overlay" id="registerModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeRegister()">✕</button>
    <div class="modal-title">// NEW OPERATIVE ENROLLMENT //</div>
    <div class="error-msg" id="regError"></div>
    <div class="field">
      <label>OPERATIVE NAME</label>
      <input type="text" id="regName" placeholder="e.g. OPERATIVE_NOVA" maxlength="30">
    </div>
    <div class="field">
      <label>EMAIL ADDRESS</label>
      <input type="email" id="regEmail" placeholder="operative@gmail.com" inputmode="email">
    </div>
    <div class="field">
      <label>CREATE CIPHER (MIN. 8 CHARS)</label>
      <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn-register" id="regBtn" onclick="handleRegister()">
      <span id="regText">REQUEST CLEARANCE</span>
      <div class="spinner" id="regSpinner"></div>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const nodes = Array.from({length:55}, () => ({
  x:Math.random()*canvas.width, y:Math.random()*canvas.height,
  vx:(Math.random()-.5)*.4, vy:(Math.random()-.5)*.4
}));
(function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  nodes.forEach(n=>{
    n.x+=n.vx; n.y+=n.vy;
    if(n.x<0||n.x>canvas.width) n.vx*=-1;
    if(n.y<0||n.y>canvas.height) n.vy*=-1;
    ctx.beginPath(); ctx.arc(n.x,n.y,2,0,Math.PI*2);
    ctx.fillStyle='#00E5CC'; ctx.fill();
  });
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<130){
      ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y);
      ctx.strokeStyle=`rgba(0,229,204,${(1-d/130)*.35})`; ctx.lineWidth=.5; ctx.stroke();
    }
  }
  requestAnimationFrame(draw);
})();

function showError(msg, id='errorMsg'){
  const el=document.getElementById(id);
  if(!el) return;
  el.textContent='⚠ '+msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),4500);
}
function setLoading(on, btn='loginBtn', txt='loginText', sp='loginSpinner'){
  const button = document.getElementById(btn);
  const text = document.getElementById(txt);
  const spinner = document.getElementById(sp);
  if(button) button.disabled = on;
  if(text) text.style.display = on ? 'none' : 'block';
  if(spinner) spinner.style.display = on ? 'block' : 'none';
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
function goTo(path){ window.location.replace(path); }

function isSupabaseReady(){
  return !!(window.sb && typeof window.sb.auth !== 'undefined');
}

function fallbackLogin({ email, role = 'RECRUIT', name = 'OPERATIVE', redirect = 'index.html' }) {
  sessionStorage.setItem('mogUser', name);
  sessionStorage.setItem('mogEmail', email);
  sessionStorage.setItem('mogRank', role);
  showToast(role === 'ADMIN' ? '✓ DIRECTOR ACCESS GRANTED' : '✓ ACCESS GRANTED');
  setTimeout(()=>goTo(redirect), 700);
}

async function handleGoogleLogin(){
  setLoading(true,'googleBtn','googleBtn','loginSpinner');
  document.getElementById('googleBtn').textContent='CONNECTING...';

  if (isSupabaseReady()) {
    try {
      const { data, error } = await window.sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/index.html' }
      });
      if (error) throw error;
      return;
    } catch (error) {
      console.warn('[M.O.G.] OAuth fallback triggered:', error);
    }
  }

  fallbackLogin({ email: 'operative@gmail.com', name: 'OPERATIVE', redirect: 'index.html' });
}

async function handleEmailLogin(){
  const email=document.getElementById('emailInput').value.trim();
  const pass=document.getElementById('passInput').value;
  if(!email){ showError('OPERATIVE ID REQUIRED'); return; }
  if(!email.includes('@')){ showError('INVALID EMAIL FORMAT'); return; }
  if(!pass){ showError('CIPHER REQUIRED'); return; }
  if(pass.length<6){ showError('CIPHER TOO SHORT — MIN 6 CHARACTERS'); return; }

  setLoading(true);

  if (isSupabaseReady()) {
    try {
      const { data, error } = await window.sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      if (data?.session) {
        const name = email.split('@')[0].toUpperCase().replace(/[^A-Z0-9]/g,'_');
        sessionStorage.setItem('mogUser', name);
        sessionStorage.setItem('mogEmail', email);
        const redirect = email.toLowerCase() === 'director.mog@gmail.com' ? 'directorate.html' : 'index.html';
        sessionStorage.setItem('mogRank', email.toLowerCase() === 'director.mog@gmail.com' ? 'ADMIN' : 'RECRUIT');
        showToast(email.toLowerCase() === 'director.mog@gmail.com' ? '✓ DIRECTOR ACCESS GRANTED' : '✓ ACCESS GRANTED');
        setTimeout(()=>goTo(redirect),700);
        return;
      }
    } catch (error) {
      console.warn('[M.O.G.] Email auth failed, using local fallback:', error);
    }
  }

  const name = email.split('@')[0].toUpperCase().replace(/[^A-Z0-9]/g,'_');
  if (email.toLowerCase() === 'director.mog@gmail.com') {
    fallbackLogin({ email, role: 'ADMIN', name, redirect: 'directorate.html' });
  } else {
    fallbackLogin({ email, role: 'RECRUIT', name, redirect: 'index.html' });
  }
}

function openRegister(){ document.getElementById('registerModal').classList.add('open'); }
function closeRegister(){ document.getElementById('registerModal').classList.remove('open'); }

async function handleRegister(){
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPass').value;
  if(!name){ showError('NAME REQUIRED','regError'); return; }
  if(!email||!email.includes('@')){ showError('VALID EMAIL REQUIRED','regError'); return; }
  if(pass.length<8){ showError('CIPHER MIN 8 CHARACTERS','regError'); return; }
  setLoading(true,'regBtn','regText','regSpinner');

  if (isSupabaseReady()) {
    try {
      const { data, error } = await window.sb.auth.signUp({
        email,
        password: pass,
        options: { data: { username: name } }
      });
      if (error) throw error;
      if (data?.user) {
        sessionStorage.setItem('mogUser', name.toUpperCase().replace(/\s+/g,'_').replace(/[^A-Z0-9_]/g,''));
        sessionStorage.setItem('mogEmail', email);
        sessionStorage.setItem('mogRank', 'RECRUIT');
        closeRegister();
        showToast('✓ CLEARANCE GRANTED');
        setTimeout(()=>goTo('index.html'),900);
        return;
      }
    } catch (error) {
      console.warn('[M.O.G.] Sign-up fallback triggered:', error);
    }
  }

  const upperName=name.toUpperCase().replace(/\s+/g,'_').replace(/[^A-Z0-9_]/g,'');
  sessionStorage.setItem('mogUser', upperName);
  sessionStorage.setItem('mogEmail', email);
  sessionStorage.setItem('mogRank', 'RECRUIT');
  closeRegister();
  showToast('✓ CLEARANCE GRANTED — WELCOME ' + upperName);
  setTimeout(()=>goTo('index.html'),900);
}

document.getElementById('registerModal').addEventListener('click',function(e){if(e.target===this)closeRegister();});
sessionStorage.clear();
</script>
</body>
</html>
