<html lang="en">
<head>

    <script src="/js/supabase-client.js"></script>
    <script src="/js/auth.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --black:       #000000;
            --gold:        #d4af37;
            --gold-bright: #f0c040;
            --gold-dark:   #8b6914;
            --teal:        #00d4aa;
            --teal-bright: #4aecd4;
            --teal-dim:    #006e59;
            --text-xs:   clamp(0.6rem,  1.8vw, 0.72rem);
            --text-sm:   clamp(0.75rem, 2.2vw, 0.875rem);
            --text-xl:   clamp(1.1rem,  4.5vw, 1.5rem);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--black);
            color: #e8f0ee;
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            overflow-x: hidden;
        }

        /* ── Background layers ── */
        .logo-watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
            width: clamp(240px, 80vmin, 520px); height: clamp(240px, 80vmin, 520px);
            background: url('/assets/images/logo.png') center/contain no-repeat;
            opacity: 0.04; pointer-events: none; z-index: 0;
        }

        .circuit-grid {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background-image: linear-gradient(rgba(0,212,170,0.022) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,212,170,0.022) 1px, transparent 1px);
            background-size: 52px 52px;
        }

        .scanline {
            position: fixed; top: -80px; left: 0; width: 100%; height: 80px; z-index: 3;
            background: linear-gradient(transparent, rgba(212,175,55,0.022) 50%, transparent);
            animation: scanline 14s linear infinite;
        }
        @keyframes scanline { to { top: 100vh; } }

        /* ── Card ── */
        .card {
            width: 100%; max-width: 460px; z-index: 10;
            background: rgba(6,10,8,0.93);
            border: 1px solid rgba(0,212,170,0.16);
            border-radius: 2.5rem; padding: 2.4rem;
            position: relative; overflow: hidden; backdrop-filter: blur(28px);
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: -100%; height: 2px; width: 100%;
            background: linear-gradient(90deg, transparent, var(--teal), var(--gold-bright), var(--teal), transparent);
            animation: cardFlow 4s linear infinite;
        }
        @keyframes cardFlow { to { left: 100%; } }

        /* ── Logo Rings ── */
        .logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.75rem; }
        .logo-ring-outer { position: relative; width: 100px; height: 100px; margin-bottom: 1rem; }
        .logo-spin {
            position: absolute; inset: 0; border-radius: 50%; padding: 3px;
            background: conic-gradient(from 0deg, var(--gold-bright), var(--teal), var(--gold-dark), var(--teal-bright), var(--gold));
            animation: ringRotate 15s linear infinite;
        }
        .logo-spin > div { width: 100%; height: 100%; border-radius: 50%; background: var(--black); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .logo-spin img { width: 80%; height: 80%; object-fit: contain; }
        @keyframes ringRotate { to { transform: rotate(360deg); } }

        .brand-name {
            font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 0.14em;
            font-size: var(--text-xl); text-align: center;
            background: linear-gradient(135deg, var(--gold-bright), var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ── GOOGLE BUTTON HARD FIX ── */
        .btn-google {
            width: 100% !important; height: 46px !important;
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.16) !important;
            border-radius: 0.85rem !important;
            color: #e8f0ee !important; font-family: 'Rajdhani', sans-serif !important;
            font-size: var(--text-sm) !important; font-weight: 700 !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
            gap: 12px !important; cursor: pointer !important; margin-bottom: 1rem !important;
        }
        .google-icon { width: 18px !important; height: 18px !important; min-width: 18px !important; flex-shrink: 0 !important; }

        .btn-otp {
            width: 100%; padding: 0.85rem; background: rgba(0,212,170,0.07);
            border: 1px solid rgba(0,212,170,0.28); border-radius: 0.85rem;
            color: var(--teal); font-family: 'Orbitron', sans-serif; font-size: var(--text-xs);
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
        }

        .divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.2rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
        .divider span { font-size: var(--text-xs); color: rgba(255,255,255,0.3); text-transform: uppercase; }

        .field-input {
            width: 100%; background: rgba(0,6,4,0.85); border: 1px solid rgba(0,212,170,0.18);
            border-radius: 0.85rem; padding: 1rem; color: #e8f0ee; font-family: 'Share Tech Mono', monospace;
            margin-bottom: 0.8rem; outline: none;
        }

        .btn-primary {
            width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--gold-dark), var(--gold-bright));
            border: none; border-radius: 0.85rem; color: #000; font-family: 'Orbitron', sans-serif;
            font-weight: 900; text-transform: uppercase; cursor: pointer; letter-spacing: 0.16em;
        }

        .loading-overlay {
            position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.94);
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
        }
        .loading-overlay.show { display: flex; }
        .loader { width: 50px; height: 50px; border: 3px solid transparent; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="logo-watermark"></div>
    <div class="circuit-grid"></div>
    <div class="scanline"></div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
        <p class="mono" id="loadingText" style="color:var(--gold); letter-spacing:4px;">AUTHENTICATING...</p>
    </div>

    <main class="card">
        <div class="logo-wrap">
            <div class="logo-ring-outer">
                <div class="logo-spin"><div><img src="/assets/images/logo.png" alt="M.O.G."></div></div>
            </div>
            <h1 class="brand-name">MINISTRY OF GROOVE</h1>
            <p class="mono" style="color:var(--teal); font-size:var(--text-xs); opacity:0.7;">SECURE ACCESS TERMINAL v2.0</p>
        </div>

<button class="btn-google" id="googleBtn" onclick="signInWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <button class="btn-otp" onclick="showAlert('Magic Link system initializing...', 'info')">
            Magic Link / OTP Access
        </button>

        <div class="divider"><span>OR AUTHORIZE VIA CODE</span></div>

        <form onsubmit="handleLogin(event)">
            <input type="email" id="emailInput" class="field-input" placeholder="OPERATIVE ID" required>
            <input type="password" id="passwordInput" class="field-input" placeholder="ACCESS CODE" required>
            <button type="submit" class="btn-primary" id="loginBtn">INITIALIZE</button>
        </form>

        <p style="text-align:center; font-size:var(--text-xs); color:var(--gold-dark); margin-top:1.5rem;" class="mono">
            Ministry of Groove · Emalahleni · Est. 2026
        </p>
    </main>

    <script>
    function getSb() { return window.sb || window.supabaseClient; }

    async function signInWithGoogle() {
        setLoading(true, 'REDIRECTING TO GOOGLE...');
        await getSb().auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/login.html' }
        });
    }

    async function handleLogin(e) {
        e.preventDefault();
        setLoading(true, 'AUTHENTICATING...');
        const { error } = await getSb().auth.signInWithPassword({
            email: document.getElementById('emailInput').value,
            password: document.getElementById('passwordInput').value
        });
        if (error) { setLoading(false); alert(error.message); }
        else { await window.MOGAuth.handleLoginRedirect(); }
    }

    function setLoading(show, text) {
        const overlay = document.getElementById('loadingOverlay');
        document.getElementById('loadingText').innerText = text;
        overlay.classList.toggle('show', show);
    }

    function showAlert(msg) { alert(msg); }
    </script>
</body>
</html>
