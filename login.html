<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.O.G. — Operative Access</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0C85A;
    --gold-dim: #8A6E2F;
    --teal: #00E5CC;
    --teal-dim: #009E8E;
    --black: #050A0E;
    --navy: #0D1F2D;
    --panel: rgba(13,31,45,0.85);
    --border: rgba(201,168,76,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--black); font-family:'Rajdhani',sans-serif; overflow:hidden; }

  /* Animated circuit background */
  canvas#bg { position:fixed; inset:0; z-index:0; opacity:0.18; }

  .login-wrap {
    position:relative; z-index:2;
    height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px;
  }

  /* Top status bar */
  .status-bar {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; gap:20px;
    padding:10px 20px;
    background:rgba(5,10,14,0.9);
    border-bottom:1px solid var(--border);
    font-family:'Share Tech Mono',monospace;
    font-size:10px; color:var(--teal-dim);
    letter-spacing:2px;
  }
  .status-bar .dot { width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }

  /* Logo */
  .logo-ring {
    width:110px; height:110px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(201,168,76,0.4), inset 0 0 20px rgba(0,229,204,0.05);
    margin-bottom:8px;
    animation:logoGlow 3s ease-in-out infinite;
  }
  @keyframes logoGlow {
    0%,100%{box-shadow:0 0 20px rgba(201,168,76,0.4)}
    50%{box-shadow:0 0 50px rgba(201,168,76,0.7),0 0 80px rgba(0,229,204,0.2)}
  }
  .logo-ring img { width:100px; height:100px; border-radius:50%; object-fit:cover; }
  .logo-img { width:100px; height:100px; border-radius:50%; object-fit:cover; }

  .org-name {
    font-family:'Orbitron',sans-serif;
    font-size:13px; font-weight:700;
    color:var(--gold); letter-spacing:4px;
    text-align:center; margin-bottom:4px;
  }
  .org-sub {
    font-family:'Share Tech Mono',monospace;
    font-size:9px; color:var(--teal-dim);
    letter-spacing:3px; text-align:center; margin-bottom:32px;
  }

  /* Panel */
  .login-panel {
    width:100%; max-width:380px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:4px;
    padding:32px 28px;
    backdrop-filter:blur(16px);
    position:relative;
  }
  .login-panel::before {
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),var(--teal),transparent);
  }
  .panel-title {
    font-family:'Orbitron',sans-serif;
    font-size:11px; font-weight:700;
    color:var(--gold-light); letter-spacing:4px;
    margin-bottom:24px; text-align:center;
  }

  /* Google button */
  .btn-google {
    width:100%; padding:14px;
    background:rgba(201,168,76,0.08);
    border:1px solid var(--gold);
    border-radius:3px;
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600;
    color:var(--gold-light); letter-spacing:2px;
    cursor:pointer; transition:all 0.3s;
    text-decoration:none;
  }
  .btn-google:hover {
    background:rgba(201,168,76,0.18);
    box-shadow:0 0 20px rgba(201,168,76,0.3);
    transform:translateY(-1px);
  }
  .btn-google svg { width:20px; height:20px; flex-shrink:0; }

  .divider {
    display:flex; align-items:center; gap:12px;
    margin:20px 0; color:var(--gold-dim);
    font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:2px;
  }
  .divider::before,.divider::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  /* Email form */
  .field { margin-bottom:16px; }
  .field label {
    display:block; font-family:'Share Tech Mono',monospace;
    font-size:10px; color:var(--teal-dim); letter-spacing:2px; margin-bottom:6px;
  }
  .field input {
    width:100%; padding:12px 14px;
    background:rgba(0,229,204,0.04);
    border:1px solid rgba(0,229,204,0.2);
    border-radius:3px; outline:none;
    font-family:'Rajdhani',sans-serif; font-size:15px; color:#fff;
    transition:border 0.3s;
  }
  .field input:focus { border-color:var(--teal); box-shadow:0 0 10px rgba(0,229,204,0.15); }
  .field input::placeholder { color:rgba(255,255,255,0.2); }

  .btn-login {
    width:100%; padding:14px;
    background:linear-gradient(135deg,var(--gold-dim),var(--gold));
    border:none; border-radius:3px;
    font-family:'Orbitron',sans-serif; font-size:12px; font-weight:700;
    color:var(--black); letter-spacing:3px;
    cursor:pointer; transition:all 0.3s;
    margin-top:4px;
  }
  .btn-login:hover {
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    box-shadow:0 0 25px rgba(201,168,76,0.5);
  }

  .register-link {
    text-align:center; margin-top:20px;
    font-family:'Share Tech Mono',monospace; font-size:10px;
    color:var(--gold-dim); letter-spacing:1px;
  }
  .register-link a { color:var(--teal); text-decoration:none; }

  /* Classification stamp */
  .classify {
    margin-top:28px; text-align:center;
    font-family:'Share Tech Mono',monospace; font-size:9px;
    color:rgba(201,168,76,0.25); letter-spacing:3px;
    border:1px solid rgba(201,168,76,0.1);
    padding:6px 16px; display:inline-block;
    border-radius:2px;
  }

  /* Scanline overlay */
  .scanlines {
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.05) 2px,rgba(0,0,0,0.05) 4px);
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="scanlines"></div>

<div class="status-bar">
  <div class="dot"></div>
  <span>ENCRYPTION ACTIVE</span>
  <span style="margin-left:auto;color:rgba(201,168,76,0.5)">CLASSIFIED — OPERATIVE ACCESS ONLY</span>
</div>

<div class="login-wrap">
  <div class="logo-ring">
    <img src="logo.png" class="logo-img" alt="Ministry of Groove">
  </div>
  <div class="org-name">MINISTRY OF GROOVE</div>
  <div class="org-sub">SECURE OPERATIVE NETWORK</div>

  <div class="login-panel">
    <div class="panel-title">— OPERATIVE AUTHENTICATION —</div>

    <!-- Google Login -->
    <a href="#" class="btn-google" onclick="handleGoogleLogin()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      INFILTRATE WITH GOOGLE
    </a>

    <div class="divider">OR</div>

    <!-- Email form -->
    <div class="field">
      <label>OPERATIVE ID (EMAIL)</label>
      <input type="email" placeholder="your@gmail.com" id="emailInput">
    </div>
    <div class="field">
      <label>CIPHER (PASSWORD)</label>
      <input type="password" placeholder="••••••••••" id="passInput">
    </div>
    <button class="btn-login" onclick="handleEmailLogin()">INITIATE ACCESS</button>

    <div class="register-link">
      NEW RECRUIT? <a href="#" onclick="showRegister()">REQUEST CLEARANCE</a>
    </div>
  </div>

  <div class="classify">TOP SECRET // M.O.G. NETWORK // EST. 2026</div>
</div>

<script>
// Circuit board background animation
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const nodes = [];
const lines = [];
for(let i=0;i<60;i++){
  nodes.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3});
}

function drawBG(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  nodes.forEach(n=>{
    n.x+=n.vx; n.y+=n.vy;
    if(n.x<0||n.x>canvas.width)n.vx*=-1;
    if(n.y<0||n.y>canvas.height)n.vy*=-1;
    ctx.beginPath();ctx.arc(n.x,n.y,2,0,Math.PI*2);
    ctx.fillStyle='#00E5CC';ctx.fill();
  });
  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){
        ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);
        ctx.strokeStyle=`rgba(0,229,204,${(1-d/120)*0.5})`;ctx.lineWidth=0.5;ctx.stroke();
      }
    }
  }
  requestAnimationFrame(drawBG);
}
drawBG();

function handleGoogleLogin(){
  alert('🔐 Google OAuth will be connected to Supabase.\nRedirecting to Operative Hub...');
  window.location.href='index.html';
}
function handleEmailLogin(){
  const e=document.getElementById('emailInput').value;
  const p=document.getElementById('passInput').value;
  if(!e||!p){alert('Enter your Operative ID and Cipher.');return;}
  alert('Authenticating operative...\nRedirecting to Hub.');
  window.location.href='index.html';
}
function showRegister(){
  alert('Registration portal — connect to Supabase auth to enable.');
}
</script>
</body>
</html>
