<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fgkljjgxecjmiiaptiug.supabase.co https://*.supabase.co wss://*.supabase.co;">
    <meta name="robots" content="noindex, nofollow">
    <title>Ministry of Groove | Secure Access Terminal</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-black text-white">
    <div class="bg-circuit-pattern"></div>
    <div class="circuit-vignette"></div>

    <main class="auth-container glass" style="margin-top: 10vh; position: relative; z-index: 10; max-width: 400px; margin-left: auto; margin-right: auto; padding: 2rem; border-radius: 2rem; border: 1px solid rgba(212, 175, 55, 0.2);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="terminal-font" style="font-size: 24px; color: #D4AF37; letter-spacing: 0.2em; font-weight: bold;">
                MINISTRY OF GROOVE
            </div>
            <div style="font-size: 10px; color: #00F2FF; margin-top: 0.5rem;" class="terminal-font">
                [GRID_UPLINK_SECURE_v5.2.3]
            </div>
        </div>

        <div id="auth-alert" style="color: #ff4b2b; font-size: 11px; text-align: center; margin-bottom: 1rem; padding: 10px; border: 1px solid #ff4b2b; background: rgba(255, 75, 43, 0.1); border-radius: 8px; display: none;" class="terminal-font">
        </div>

        <form id="login-form" onsubmit="handleEmailLogin(event)" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="email" id="email" class="ncc-input" placeholder="OPERATIVE_ID" required style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: white; text-align: center;">
            <input type="password" id="password" class="ncc-input" placeholder="ACCESS_CODE" required style="width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; color: white; text-align: center;">
            <button type="submit" class="btn-command" style="width: 100%; padding: 14px; background: #D4AF37; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; border: none;">
                AUTHENTICATE
            </button>
        </form>

        <div class="auth-divider" style="display: flex; align-items: center; gap: 10px; margin: 1.5rem 0; opacity: 0.3;">
            <div style="flex: 1; height: 1px; background: white;"></div>
            <span style="font-size: 9px;">OR</span>
            <div style="flex: 1; height: 1px; background: white;"></div>
        </div>

        <button onclick="loginWithGoogle()" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;" class="terminal-font">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width: 16px;">
            BIOMETRIC UPLINK
        </button>

        <p style="font-size: 8px; color: rgba(255,255,255,0.2); text-align: center; margin-top: 2rem; letter-spacing: 0.3em;" class="terminal-font">
            UNAUTHORIZED ACCESS RECORDED
        </p>
    </main>

    <script>
        const CONFIG = {
            URL: 'https://fgkljjgxecjmiiaptiug.supabase.co',
            KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0iugiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'
        };

        const supabase = window.supabase.createClient(CONFIG.URL, CONFIG.KEY);

        async function handleEmailLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                syncAndRedirect(data.user);
            } catch (error) {
                showAlert(`ACCESS_DENIED: ${error.message}`);
            }
        }

        async function loginWithGoogle() {
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
        }

        async function syncAndRedirect(user) {
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            const role = profile?.role || (user.email === 'director.mog@gmail.com' ? 'director' : 'operative');
            
            localStorage.setItem('userRole', role);
            
            // ABSOLUTE REDIRECTS to stop the 404s
            const dest = (role === 'director') ? '/directorate' : '/index.html';
            window.location.assign(window.location.origin + dest);
        }

        function showAlert(msg) {
            const alert = document.getElementById('auth-alert');
            alert.textContent = msg;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 5000);
        }

        // Auto-check session on load
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) syncAndRedirect(session.user);
        });
    </script>
</body>
</html>
