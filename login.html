<!DOCTYPE html>
<html lang="en" color-scheme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="assets/images/logo.png">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <title>M.O.G. | SECURE ACCESS</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       HARDWARE UI SHADERS
       =========================================================================
    */
    @layer base, layout, components, animations;

    @layer base {
      :root {
        --black: #000;
        --gold: #d4af37;
        --gold-bright: #f0c040;
        --gold-glow: rgba(212,175,55,0.35);
        --teal: #00d4aa;
        --red: #dc2626;
        --surface: rgba(5,7,6,0.98);
        --border: rgba(212,175,55,0.15);
        --text: #e8f0ee;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Rajdhani', sans-serif;
        background: var(--black); color: var(--text);
        min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        overflow: hidden; padding: 1.5rem; -webkit-font-smoothing: antialiased;
      }
    }

    @layer layout {
      .bg-watermark {
        position: fixed; inset: 0; pointer-events: none;
        background: url('assets/images/logo.png') center/clamp(280px, 60vw, 500px) no-repeat;
        opacity: 0.04; filter: blur(1px); z-index: 0;
      }
      .bg-grid {
        position: fixed; inset: 0; z-index: 1;
        background-image: linear-gradient(rgba(212,175,55,0.02) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(212,175,55,0.02) 1px, transparent 1px);
        background-size: 50px 50px;
      }
      
      .terminal-card {
        position: relative; z-index: 10;
        width: 100%; max-width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 2.5rem; padding: 3rem 2.5rem;
        backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
        box-shadow: 0 25px 60px rgba(0,0,0,0.9);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      /* DIRECTORATE OVERRIDE VISUALS */
      .terminal-card.directorate-gate {
        border-color: var(--teal);
        box-shadow: 0 0 50px rgba(0, 212, 170, 0.15);
      }

      .shake-anim { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
      @keyframes shake {
        10%, 90% { transform: translateX(-1px); }
        20%, 80% { transform: translateX(2px); }
        30%, 50%, 70% { transform: translateX(-4px); }
        40%, 60% { transform: translateX(4px); }
      }
    }

    @layer components {
      .access-ring {
        width: clamp(80px, 15vw, 100px); height: clamp(80px, 15vw, 100px);
        margin: 0 auto 2.5rem; border-radius: 50%; padding: 4px;
        background: conic-gradient(from 0deg, var(--gold), var(--teal), var(--gold));
        animation: rotate-ring 15s linear infinite;
        flex-shrink: 0;
      }
      .access-ring div {
        width: 100%; height: 100%; background: #000; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
      }
      .access-ring img { width: 65%; object-fit: contain; filter: drop-shadow(0 0 10px var(--gold-glow)); }
      @keyframes rotate-ring { to { transform: rotate(360deg); } }

      .input-terminal {
        width: 100%; background: rgba(0,0,0,0.5);
        border: 1px solid rgba(212,175,55,0.2);
        border-radius: 1.25rem; padding: 1.15rem;
        color: #fff; font-family: 'Share Tech Mono', monospace;
        margin-bottom: 1.25rem; transition: 0.3s;
        text-align: center; font-size: 0.9rem; outline: none;
      }
      .input-terminal:focus { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); }
      .input-terminal.directorate-focus { border-color: var(--teal); color: var(--teal); }

      .btn-auth {
        width: 100%; padding: 1.15rem;
        background: var(--gold); border: none; border-radius: 1.25rem;
        color: #000; font-family: 'Orbitron', sans-serif; font-weight: 900;
        text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.7rem;
        cursor: pointer; transition: 0.4s;
      }
      .btn-auth:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 10px 30px var(--gold-glow); }
      .btn-auth:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }
      .btn-auth.directorate-btn { background: var(--teal); color: #000; }

      .alert-strip {
        display: none; background: rgba(220,38,38,0.2);
        border: 1px solid var(--red); border-radius: 0.75rem;
        padding: 0.8rem; margin-bottom: 1.5rem;
        color: #fca5a5; font-size: 0.65rem; text-align: center;
        font-family: 'Orbitron', sans-serif; letter-spacing: 0.1em;
      }
      .alert-strip.active { display: block; animation: pulse-red 2s infinite; }
      @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    }

    .system-loader {
      position: fixed; inset: 0; z-index: 1000; background: #000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    .system-loader.active { display: flex; }
  </style>

  <script>
    /**
     * =========================================================================
     * BIFROST GATE CONTROLLER
     * =========================================================================
     */
    const DIRECTOR_EMAIL = 'director.mog@gmail.com';
    let failedAttempts = 0;

    const getSb = () => window.sb || window.supabaseClient;

    /**
     * DUAL GATE MONITOR
     * Visually transforms the gate when Directorate ID is entered.
     */
    function monitorGateInput(val) {
        const card = document.getElementById('authCard');
        const title = document.getElementById('gateTitle');
        const btn = document.getElementById('authBtn');
        const inputs = document.querySelectorAll('.input-terminal');

        if (val.trim().toLowerCase() === DIRECTOR_EMAIL) {
            card.classList.add('directorate-gate');
            title.textContent = "DIRECTORATE PRIME";
            title.style.color = "#00d4aa";
            btn.classList.add('directorate-btn');
            inputs.forEach(i => i.classList.add('directorate-focus'));
            navigator.vibrate?.(40);
        } else {
            card.classList.remove('directorate-gate');
            title.textContent = "M.O.G. HUB";
            title.style.color = "#fff";
            btn.classList.remove('directorate-btn');
            inputs.forEach(i => i.classList.remove('directorate-focus'));
        }
    }

    /**
     * INITIALIZE GATE UPLINK
     */
    async function initializeAccess() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const loader = document.getElementById('sysLoader');
        const status = document.getElementById('loadStatus');
        const card = document.getElementById('authCard');
        const alertBox = document.getElementById('alertStrip');

        if (!email || !password) {
            triggerShake();
            return;
        }

        loader.classList.add('active');
        status.textContent = "ESTABLISHING SECURE TUNNEL...";

        try {
            const { data, error } = await getSb().auth.signInWithPassword({ email, password });
            
            if (error) throw error;

            status.textContent = "CLEARANCE VERIFIED.";
            
            // DUAL-GATE REDIRECT LOGIC
            setTimeout(() => {
                if (email.toLowerCase() === DIRECTOR_EMAIL) {
                    status.textContent = "REDIRECTING TO COMMAND CENTER...";
                    window.location.href = 'pages/directorate.html';
                } else {
                    status.textContent = "REDIRECTING TO OPERATIVE HUB...";
                    window.location.href = 'index.html';
                }
            }, 1200);

        } catch (err) {
            failedAttempts++;
            loader.classList.remove('active');
            triggerShake();
            
            alertBox.classList.add('active');
            alertBox.textContent = `⚠ ACCESS DENIED: ATTEMPT ${failedAttempts}/3`;

            if (failedAttempts >= 3) {
                lockdownTerminal();
            }
        }
    }

    function triggerShake() {
        const card = document.getElementById('authCard');
        card.classList.add('shake-anim');
        navigator.vibrate?.([50, 50, 50]);
        setTimeout(() => card.classList.remove('shake-anim'), 500);
    }

    function lockdownTerminal() {
        const btn = document.getElementById('authBtn');
        const alertBox = document.getElementById('alertStrip');
        alertBox.textContent = "⚠ TERMINAL LOCKED: INTRUSION LOGGED";
        btn.disabled = true;
        
        // Log intrusion to Directorate
        getSb().from('activity_log').insert({ 
            type: 'INTRUSION_ALERT', 
            description: `Multiple failed attempts for operative ID: ${document.getElementById('email').value}`
        });
    }

    async function requestMagicLink() {
        const email = document.getElementById('email').value;
        if (!email) { alert("Enter Personnel ID first."); return; }
        const { error } = await getSb().auth.signInWithOtp({ email });
        if (!error) alert("Magic link transmitted to secure inbox.");
    }
  </script>
</head>
<body>

  <div class="bg-watermark"></div>
  <div class="bg-grid"></div>

  <div class="system-loader" id="sysLoader">
    <div class="access-ring"><div><img src="assets/images/logo.png" alt="MOG"></div></div>
    <p class="font-orbit text-gold text-[10px] tracking-[0.6em] animate-pulse" id="loadStatus">AUTHENTICATING</p>
  </div>

  <main class="terminal-card" id="authCard">
    <div class="access-ring">
      <div><img src="assets/images/logo.png" alt="MOG SEAL"></div>
    </div>
    
    <div class="text-center mb-10">
      <h1 class="font-orbit text-2xl font-black text-white tracking-[0.2em]" id="gateTitle">M.O.G. HUB</h1>
      <p class="font-mono text-[9px] text-gold/40 uppercase tracking-[0.4em] mt-2">Secure Access Terminal</p>
    </div>

    <div class="alert-strip" id="alertStrip"></div>

    <div class="space-y-1">
      <p class="font-orbit text-[8px] text-gray-700 uppercase tracking-widest mb-2 px-1">Personnel ID</p>
      <input type="email" id="email" class="input-terminal" placeholder="ID@MINISTRY.COM" oninput="monitorGateInput(this.value)">
      
      <p class="font-orbit text-[8px] text-gray-700 uppercase tracking-widest mb-2 px-1">Access Code</p>
      <input type="password" id="password" class="input-terminal" placeholder="••••••••">
      
      <button class="btn-auth mt-6" id="authBtn" onclick="initializeAccess()">
        Initialize Uplink
      </button>

      <div class="flex flex-col items-center gap-4 mt-10">
        <button onclick="requestMagicLink()" class="font-mono text-[9px] text-gray-600 hover:text-gold transition-colors uppercase tracking-widest">
            Request Magic Link Access
        </button>
        <div class="flex items-center gap-2">
            <span class="w-1 h-1 rounded-full bg-teal animate-pulse"></span>
            <span class="font-mono text-[8px] text-gray-800 uppercase tracking-widest">Dual-Gate Protocol Active</span>
        </div>
      </div>
    </div>

  </main>

  <footer class="fixed bottom-8 w-full text-center pointer-events-none">
    <p class="font-mono text-[9px] text-gray-800 uppercase tracking-[0.5em]">Ministry of Groove // Emalahleni // 2026</p>
  </footer>

</body>
</html>
