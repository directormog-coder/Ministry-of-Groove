<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>DIRECTORATE HQ | MASTER COMMAND</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        /* Directorate Exclusive Theme: Command Red */
        .bg-grid-red { background-image: radial-gradient(circle, #ef4444 1.5px, transparent 1.5px); background-size: 40px 40px; }
        .glass-red { background: rgba(15, 0, 0, 0.97); backdrop-filter: blur(40px); border: 1px solid rgba(239, 68, 68, 0.3); }
        .loader-red { width: 40px; height: 40px; border: 4px solid #ef4444; border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .scanline-red { 
            width: 100%; height: 100px; 
            background: linear-gradient(0deg, transparent 0%, rgba(239, 68, 68, 0.05) 50%, transparent 100%); 
            position: fixed; top: -100px; left: 0; pointer-events: none; 
            animation: moveScanline 6s linear infinite; z-index: 100; 
        }
        @keyframes moveScanline { from { top: -100px; } to { top: 100vh; } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function commandCenter() {
            return {
                view: 'gate',
                broadcastInput: '',
                operatives: [],
                liveActivity: [],
                wealth: '1.4M',
                currentTime: '',
                sessionDuration: '00:00',
                sessionStart: null,

                async init() {
                    // SECURE GATE CHECK: Only Director Role can enter
                    const role = localStorage.getItem('userRole');
                    if (role !== 'director') {
                        window.location.href = '../login.html';
                        return;
                    }

                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    this.view = 'active';
                    this.sessionStart = Date.now();
                    this.startClock();
                    await this.loadSecureData();
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadSecureData() {
                    // Load Operatives
                    const { data: ops } = await sb.from('profiles').select('*').limit(10);
                    if (ops) this.operatives = ops;

                    // Load Activity
                    const { data: logs } = await sb.from('messages').select('*').order('created_at', { ascending: false }).limit(8);
                    if (logs) this.liveActivity = logs;
                },

                async sendBroadcast() {
                    if (!this.broadcastInput.trim()) return;
                    // Logic for global directive
                    alert('GLOBAL DIRECTIVE SYNCHRONIZED TO ALL OPERATIVE GRIDS');
                    this.broadcastInput = '';
                },

                startClock() {
                    setInterval(() => {
                        this.currentTime = new Date().toLocaleTimeString('en-ZA', { hour12: false });
                        const diff = Math.floor((Date.now() - this.sessionStart) / 1000);
                        this.sessionDuration = `${Math.floor(diff/60).toString().padStart(2,'0')}:${(diff%60).toString().padStart(2,'0')}`;
                    }, 1000);
                },

                logout() {
                    localStorage.clear();
                    window.location.href = '../login.html';
                }
            }
        }
    </script>
</head>
<body x-data="commandCenter()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden">

    <div class="scanline-red"></div>
    <div class="bg-grid-red fixed inset-0 z-0 opacity-10"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <div class="loader-red"></div>
            <p class="terminal-font text-[12px] text-red-500 animate-pulse uppercase tracking-[0.5em]">Establishing High-Clearance Uplink...</p>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-10 relative animate-fade-in">
            
            <header class="p-10 glass-red rounded-[3rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl">
                <div class="flex items-center gap-8">
                    <button onclick="window.location.href='../index.html'" class="p-6 bg-white/5 rounded-[2rem] border border-white/10 hover:border-gold transition-all group">
                        <i data-lucide="chevron-left" class="text-gold w-8 h-8 group-hover:scale-110"></i>
                    </button>
                    <div>
                        <h1 class="text-4xl font-black uppercase italic tracking-tighter text-red-600">Directorate HQ</h1>
                        <p class="text-[11px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-2 italic">MASTER COMMAND // SECTOR 7G ARCHIVE</p>
                    </div>
                </div>
                <div class="text-right flex items-center gap-12">
                    <div class="hidden md:block">
                        <p class="text-4xl font-black terminal-font text-white" x-text="currentTime"></p>
                        <p class="text-[10px] text-red-600 uppercase font-black tracking-widest text-right" x-text="'SESSION: ' + sessionDuration"></p>
                    </div>
                    <button @click="logout()" class="p-6 border border-red-600/30 text-red-600 rounded-[2.5rem] hover:bg-red-600 hover:text-white transition-all shadow-xl">
                        <i data-lucide="power" class="w-8 h-8"></i>
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                
                <div class="space-y-12">
                    <div class="glass-red p-12 rounded-[6rem] text-center border border-gold/20 shadow-2xl relative overflow-hidden group">
                        <div class="absolute inset-0 bg-radial-gradient from-red-600/20 to-transparent opacity-50"></div>
                        <img src="../assets/images/1000219947.png" alt="DIRECTORATE SEAL" class="w-full aspect-square object-contain mb-8 filter drop-shadow-[0_0_40px_rgba(239, 68, 68, 0.5)] transition-transform duration-1000 group-hover:rotate-12 group-hover:scale-110">
                        <div class="pt-8 border-t border-red-600/20 relative z-10">
                            <h3 class="text-2xl font-black uppercase italic tracking-tighter text-gold">Directorate Seal</h3>
                            <p class="text-[10px] text-zinc-600 uppercase font-black tracking-widest mt-3 italic">Authorized Master Presence</p>
                        </div>
                    </div>

                    <div class="glass-red p-12 rounded-[4rem] text-center border border-gold/30 shadow-2xl">
                        <h4 class="terminal-font text-[12px] text-gold mb-6 italic">Brand Wealth Index</h4>
                        <p class="text-7xl font-black text-white terminal-font tracking-tighter" x-text="wealth"></p>
                        <div class="mt-6 flex items-center justify-center gap-3">
                            <span class="px-3 py-1 bg-green-500/10 text-green-500 rounded-full text-[10px] font-black">+18.4% GAIN</span>
                        </div>
                    </div>

                    <div class="glass-red p-10 rounded-[3.5rem] border border-white/5">
                        <div class="flex items-center justify-between mb-8">
                            <h3 class="text-xs font-black uppercase text-gold tracking-widest flex items-center gap-3">
                                <i data-lucide="users" class="w-5 h-5"></i> Personnel DB
                            </h3>
                            <span class="terminal-font text-[8px] text-zinc-700" x-text="operatives.length + ' Registered'"></span>
                        </div>
                        <div class="space-y-4 max-h-96 overflow-y-auto custom-scrollbar pr-3">
                            <template x-for="op in operatives" :key="op.id">
                                <div class="p-5 bg-white/[0.03] border border-white/5 rounded-3xl flex justify-between items-center transition-all hover:bg-white/[0.08] group">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 bg-zinc-900 rounded-full flex items-center justify-center border border-white/10 group-hover:border-red-500 transition-colors">
                                            <i data-lucide="user" class="w-5 h-5 text-zinc-600 group-hover:text-red-500"></i>
                                        </div>
                                        <div>
                                            <p class="text-[11px] font-black uppercase text-white" x-text="op.handle"></p>
                                            <p class="text-[8px] text-zinc-500 uppercase" x-text="op.status"></p>
                                        </div>
                                    </div>
                                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-12">
                    
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-8">
                        <template x-for="node in [
                            {i:'layout-grid', l:'Hub', u:'../index.html', c:'text-gold'}, 
                            {i:'user-cog', l:'Dossier', u:'dossier.html', c:'text-green-500'}, 
                            {i:'camera', l:'Gallery', u:'gallery.html', c:'text-purple-500'}, 
                            {i:'activity', l:'Freq', u:'frequency.html', c:'text-gold'}, 
                            {i:'radio', l:'Dispatch', u:'dispatch.html', c:'text-red-500'}, 
                            {i:'lock', l:'Vault', u:'archives.html', c:'text-zinc-500'}
                        ]">
                            <div @click="window.location.href=node.u" class="glass-red p-10 rounded-[3.5rem] text-center border border-white/5 hover:border-white transition-all group shadow-xl cursor-pointer">
                                <div :class="node.c" class="mb-4 transition-transform group-hover:scale-110">
                                    <i :data-lucide="node.i" class="mx-auto w-10 h-10"></i>
                                </div>
                                <span class="text-[10px] font-black uppercase tracking-[0.2em] text-white" x-text="node.l"></span>
                            </div>
                        </template>
                    </div>

                    <div class="glass-red p-16 rounded-[5rem] border border-red-600/30 shadow-2xl space-y-12 relative overflow-hidden">
                        <div class="absolute -top-20 -left-20 w-64 h-64 bg-red-600/5 rounded-full blur-3xl"></div>
                        <div class="flex items-center gap-8 relative z-10">
                            <div class="p-6 bg-red-600 rounded-[2.5rem] text-white shadow-2xl"><i data-lucide="zap" class="w-14 h-14"></i></div>
                            <div>
                                <h3 class="text-4xl font-black uppercase italic tracking-widest text-white leading-none">Execute Directive</h3>
                                <p class="text-[11px] text-red-600 font-black uppercase tracking-[0.5em] mt-4">Global Synchronization Command</p>
                            </div>
                        </div>
                        <textarea 
                            x-model="broadcastInput" 
                            class="w-full h-80 bg-black/40 border border-red-600/10 p-10 rounded-[4rem] outline-none text-[20px] uppercase terminal-font leading-relaxed focus:border-red-600 transition-all text-white placeholder:text-zinc-900 relative z-10 resize-none" 
                            placeholder="TRANSMIT MASTER ORDER TO ALL GRIDS..."
                        ></textarea>
                        <div class="flex justify-end relative z-10">
                            <button @click="sendBroadcast()" class="px-24 py-9 bg-red-600 text-white font-black uppercase rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all text-sm tracking-[0.4em]">
                                Synchronize Grid
                            </button>
                        </div>
                    </div>

                    <div class="glass p-12 rounded-[5rem] border border-white/5 space-y-10 shadow-inner">
                        <div class="flex items-center justify-between border-b border-white/5 pb-8">
                            <h3 class="terminal-font text-[12px] text-gold italic flex items-center gap-4">
                                <i data-lucide="activity" class="w-7 h-7"></i> Live Grid Activity
                            </h3>
                            <span class="text-[9px] text-red-600 uppercase font-black animate-pulse">Real-time Stream Active</span>
                        </div>
                        <div class="space-y-6">
                            <template x-for="log in liveActivity" :key="log.id">
                                <div class="p-8 bg-white/[0.02] border-l-4 border-red-600 rounded-r-[3rem] flex justify-between items-center transition-all hover:bg-white/[0.05] group">
                                    <div class="flex gap-8 items-center">
                                        <div class="w-2 h-2 rounded-full bg-red-600"></div>
                                        <div>
                                            <p class="text-[10px] text-zinc-500 font-black uppercase" x-text="log.username"></p>
                                            <p class="text-[15px] text-zinc-200 terminal-font mt-1" x-text="log.content"></p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] text-zinc-700 terminal-font" x-text="new Date(log.created_at).toLocaleTimeString()"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-40 pt-20 border-t border-white/5 text-center text-zinc-800">
                <p class="terminal-font text-[14px] uppercase tracking-[1em] italic">DIRECTORATE ACCESS ONLY // © 2026 MOG HQ</p>
            </footer>
        </div>
    </template>

</body>
</html>
