<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | FREQUENCY UPLINK</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-gold { background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px); background-size: 30px 30px; }
        .glass-gold-strong { background: rgba(10, 10, 15, 0.97); backdrop-filter: blur(35px); border: 1px solid rgba(212, 175, 55, 0.2); }
        
        /* AUDIO VISUALIZER BARS */
        .visualizer { display: flex; align-items: flex-end; gap: 3px; height: 40px; }
        .v-bar { width: 4px; background: var(--gold); border-radius: 2px; animation: bounce 1s infinite ease-in-out; }
        @keyframes bounce { 
            0%, 100% { height: 10%; opacity: 0.3; } 
            50% { height: 100%; opacity: 1; } 
        }

        .loader-gold { width: 35px; height: 35px; border: 4px solid var(--gold); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .chart-row:hover { background: rgba(212, 175, 55, 0.08); transform: translateX(10px); border-color: var(--electric); }
        .chart-row { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .vote-btn:active { transform: scale(0.95); }
        .vote-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>

    <script>
        // Secure configuration - replace with environment variables or config.js
        const CONFIG = {
            SUPABASE_URL: window.MOG_CONFIG?.SUPABASE_URL || 'YOUR_SUPABASE_URL',
            SUPABASE_ANON_KEY: window.MOG_CONFIG?.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY'
        };
        
        let sb = null;

        function frequencyEngine() {
            return {
                view: 'gate',
                chartItems: [],
                isDirector: false,
                nowPlaying: null,
                signalStrength: 94,
                isLoading: false,
                isVoting: false,
                authError: null,
                userVotes: new Set(), // Track voted items

                async init() {
                    // Security Gate Check
                    const role = localStorage.getItem('userRole');
                    if (!role) {
                        window.location.href = '../login.html';
                        return;
                    }

                    // Validate configuration
                    if (!this.isSupabaseConfigured()) {
                        this.authError = 'FREQUENCY SYSTEM OFFLINE - CONFIGURATION REQUIRED';
                        console.error('[FREQUENCY] Supabase not configured');
                        setTimeout(() => this.view = 'error', 1000);
                        return;
                    }

                    try {
                        sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                        const { data: { session } } = await sb.auth.getSession();
                        
                        if (!session) {
                            window.location.href = '../index.html';
                            return;
                        }

                        this.isDirector = role === 'director';
                        this.view = 'active';
                        await this.loadFrequencyData();
                        
                        // Simulate signal fluctuation
                        this.startSignalSimulation();
                        
                        this.$nextTick(() => {
                            if (typeof lucide !== 'undefined') lucide.createIcons();
                        });
                        
                    } catch (error) {
                        console.error('[FREQUENCY] Initialization failed:', error);
                        this.authError = 'SECURE CONNECTION FAILED';
                        this.view = 'error';
                    }
                },

                isSupabaseConfigured() {
                    return CONFIG.SUPABASE_URL && 
                           !CONFIG.SUPABASE_URL.includes('YOUR_') &&
                           CONFIG.SUPABASE_ANON_KEY && 
                           !CONFIG.SUPABASE_ANON_KEY.includes('YOUR_');
                },

                async loadFrequencyData() {
                    try {
                        this.isLoading = true;
                        const { data, error } = await sb
                            .from('frequency')
                            .select('*')
                            .order('votes', { ascending: false })
                            .limit(10);

                        if (error) throw error;
                        
                        this.chartItems = data || [];
                    } catch (error) {
                        console.error('[FREQUENCY] Load failed:', error);
                        this.showNotification('FAILED TO LOAD FREQUENCIES', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async castVote(id) {
                    // Prevent double voting
                    if (this.userVotes.has(id)) {
                        this.showNotification('ALREADY VOTED ON THIS FREQUENCY', 'warning');
                        return;
                    }

                    this.isVoting = true;

                    try {
                        // Try RPC first, fallback to direct update
                        let error;
                        
                        try {
                            const result = await sb.rpc('increment_vote', { row_id: id });
                            error = result.error;
                        } catch (rpcError) {
                            // Fallback: direct update with optimistic locking
                            const { data: current } = await sb
                                .from('frequency')
                                .select('votes')
                                .eq('id', id)
                                .single();
                            
                            if (current) {
                                const { error: updateError } = await sb
                                    .from('frequency')
                                    .update({ votes: current.votes + 1 })
                                    .eq('id', id);
                                error = updateError;
                            }
                        }

                        if (error) throw error;

                        // Track vote locally
                        this.userVotes.add(id);
                        
                        // Optimistic UI update
                        const item = this.chartItems.find(i => i.id === id);
                        if (item) item.votes++;

                        this.showNotification('SIGNAL WEIGHT INCREASED', 'success');
                        
                        // Refresh after delay
                        setTimeout(() => this.loadFrequencyData(), 500);
                        
                    } catch (error) {
                        console.error('[FREQUENCY] Vote failed:', error);
                        this.showNotification('FREQUENCY LOCK FAILED', 'error');
                    } finally {
                        this.isVoting = false;
                    }
                },

                startSignalSimulation() {
                    // Simulate realistic signal strength fluctuations
                    setInterval(() => {
                        const base = 94;
                        const variance = Math.floor(Math.random() * 6) - 3; // -3 to +3
                        this.signalStrength = Math.max(85, Math.min(99, base + variance));
                    }, 3000);
                },

                hasVoted(id) {
                    return this.userVotes.has(id);
                },

                showNotification(message, type = 'info') {
                    const colors = {
                        success: 'border-green-500 text-green-400 bg-green-500/10',
                        error: 'border-red-500 text-red-400 bg-red-500/10',
                        warning: 'border-yellow-500 text-yellow-400 bg-yellow-500/10',
                        info: 'border-electric text-electric bg-electric/10'
                    };
                    
                    const toast = document.createElement('div');
                    toast.className = `fixed top-4 right-4 z-50 glass-gold-strong px-6 py-4 rounded-xl border-l-4 ${colors[type]} animate-slide-in max-w-md`;
                    toast.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-black uppercase tracking-wider">${type}</span>
                            <p class="text-xs text-white">${message}</p>
                        </div>
                    `;
                    
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.classList.add('animate-fade-out');
                        setTimeout(() => toast.remove(), 300);
                    }, 4000);
                },

                async terminateSession() {
                    try {
                        await sb?.auth?.signOut();
                    } catch (e) {
                        console.error('[FREQUENCY] Sign out error:', e);
                    }
                    
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('userData');
                    sessionStorage.clear();
                    
                    window.location.href = '../login.html';
                },

                destroy() {
                    // Clean up intervals if any
                }
            }
        }
    </script>
</head>
<body x-data="frequencyEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-gold/30">

    <div class="bg-circuit-pattern"></div>
    <div class="bg-grid-gold fixed inset-0 z-0 opacity-10"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <div class="loader-gold"></div>
            <p class="terminal-font text-[11px] text-gold animate-pulse uppercase tracking-[0.5em]">Scanning Frequencies...</p>
        </div>
    </template>

    <template x-if="view === 'error'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <i data-lucide="shield-alert" class="w-16 h-16 text-red-500"></i>
            <p class="terminal-font text-[11px] text-red-500 uppercase tracking-[0.3em]" x-text="authError || 'SYSTEM ERROR'"></p>
            <button @click="terminateSession()" class="px-8 py-4 bg-white/10 rounded-full text-xs uppercase tracking-widest hover:bg-white/20 transition-all">
                Return to Gate
            </button>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-10 relative animate-fade-in">
            
            <header class="p-8 glass-gold-strong rounded-[2.5rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-12 shadow-2xl">
                <div class="flex items-center gap-6">
                    <button onclick="window.location.href='../index.html'" class="p-4 bg-white/5 rounded-2xl border border-white/10 hover:border-gold transition-all group">
                        <i data-lucide="chevron-left" class="text-gold group-hover:scale-110"></i>
                    </button>
                    <div>
                        <h1 class="text-3xl font-black uppercase italic tracking-tighter text-gold leading-none">Frequency Uplink</h1>
                        <p class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-2 italic">Audio Surveillance // Sector 7G</p>
                    </div>
                </div>

                <div class="flex items-center gap-8">
                    <div class="text-right hidden sm:block">
                        <p class="text-[9px] text-zinc-500 font-black uppercase tracking-widest">Signal Integrity</p>
                        <p class="text-xl font-black terminal-font text-electric" x-text="signalStrength + '%'"></p>
                    </div>
                    <div class="visualizer">
                        <div class="v-bar"></div>
                        <div class="v-bar" style="animation-delay: 0.2s"></div>
                        <div class="v-bar" style="animation-delay: 0.4s"></div>
                        <div class="v-bar" style="animation-delay: 0.1s"></div>
                        <div class="v-bar" style="animation-delay: 0.3s"></div>
                    </div>
                    
                    <!-- Session Controls -->
                    <button @click="terminateSession()" 
                            class="p-3 bg-white/5 rounded-xl border border-white/10 hover:border-red-500 hover:text-red-400 transition-all"
                            title="Terminate Session">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                
                <div class="space-y-10">
                    <div class="glass-gold-strong p-10 rounded-[4rem] border border-gold/10 shadow-2xl relative overflow-hidden">
                        <div class="absolute -top-10 -left-10 w-32 h-32 bg-gold/5 rounded-full blur-2xl"></div>
                        <h3 class="text-xs font-black uppercase text-gold tracking-widest mb-8 italic flex items-center gap-3">
                            <i data-lucide="radio"></i> Master Signal
                        </h3>
                        <div class="space-y-6">
                            <div class="p-6 bg-white/5 rounded-3xl border border-white/5">
                                <p class="text-[8px] text-zinc-600 uppercase font-black mb-1">Active Stream</p>
                                <p class="text-xs font-black terminal-font uppercase text-zinc-300">AMAPIANO_SYNC_B-01</p>
                            </div>
                            <div class="p-6 bg-white/5 rounded-3xl border border-white/5">
                                <p class="text-[8px] text-zinc-600 uppercase font-black mb-1">Target Sector</p>
                                <p class="text-xs font-black terminal-font uppercase text-zinc-300">Highveld / Sector 7G</p>
                            </div>
                        </div>
                        <button class="btn-command w-full mt-8 py-4 text-[10px] opacity-50 cursor-not-allowed" disabled>
                            Optimize Uplink
                        </button>
                    </div>

                    <div class="glass p-8 rounded-[3rem] border border-white/5 shadow-xl">
                        <h4 class="terminal-font text-[10px] text-zinc-500 mb-6 tracking-widest italic">System Nodes</h4>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="window.location.href='../index.html'" class="p-5 bg-white/5 rounded-2xl hover:bg-white/10 transition-all text-center border border-white/5">
                                <i data-lucide="layout-grid" class="mx-auto mb-2 text-gold"></i>
                                <span class="text-[8px] font-black uppercase">Hub</span>
                            </button>
                            <button onclick="window.location.href='dossier.html'" class="p-5 bg-white/5 rounded-2xl hover:bg-white/10 transition-all text-center border border-white/5">
                                <i data-lucide="shield-check" class="mx-auto mb-2 text-electric"></i>
                                <span class="text-[8px] font-black uppercase">Dossier</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="glass-gold-strong p-10 rounded-[4rem] border border-gold/10 shadow-2xl">
                        <div class="flex items-center justify-between mb-10 border-b border-gold/10 pb-8">
                            <div>
                                <h3 class="text-2xl font-black uppercase italic tracking-tighter text-white">Frequency Rankings</h3>
                                <p class="text-[10px] text-zinc-500 uppercase font-black tracking-widest mt-2">The Top 10 Amapiano Directives</p>
                            </div>
                            <i data-lucide="trending-up" class="text-gold w-10 h-10 opacity-20"></i>
                        </div>

                        <div x-show="isLoading" class="py-12 text-center">
                            <div class="loader-gold mx-auto mb-4"></div>
                            <p class="terminal-font text-[10px] text-zinc-500 uppercase">Loading Frequencies...</p>
                        </div>

                        <div class="space-y-4">
                            <template x-for="(item, index) in chartItems" :key="item.id">
                                <div class="chart-row p-6 bg-white/[0.03] border border-white/5 rounded-[2.5rem] flex items-center justify-between">
                                    <div class="flex items-center gap-8">
                                        <span class="text-xl font-black terminal-font" 
                                              :class="index < 3 ? 'text-gold' : 'text-gold/40'" 
                                              x-text="(index + 1).toString().padStart(2, '0')"></span>
                                        <div>
                                            <p class="text-sm font-black uppercase tracking-wider text-white" x-text="item.title"></p>
                                            <p class="text-[9px] text-zinc-600 uppercase font-black italic" x-text="item.artist"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-6">
                                        <div class="text-right hidden sm:block">
                                            <p class="text-[8px] text-zinc-700 uppercase font-black">Weight</p>
                                            <p class="text-[10px] font-black terminal-font text-electric" x-text="item.votes?.toLocaleString() || 0"></p>
                                        </div>
                                        <button @click="castVote(item.id)" 
                                                :disabled="isVoting || hasVoted(item.id)"
                                                class="vote-btn p-4 bg-gold/10 text-gold rounded-full hover:bg-gold hover:text-black transition-all disabled:opacity-30"
                                                :class="{ 'bg-green-500/20 text-green-400': hasVoted(item.id) }"
                                                :title="hasVoted(item.id) ? 'Already Voted' : 'Cast Vote'">
                                            <i data-lucide="zap" class="w-5 h-5" x-show="!hasVoted(item.id)"></i>
                                            <i data-lucide="check" class="w-5 h-5" x-show="hasVoted(item.id)"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>

                            <div x-show="chartItems.length === 0 && !isLoading" class="py-20 text-center opacity-20">
                                <i data-lucide="music" class="mx-auto mb-4 w-12 h-12"></i>
                                <p class="terminal-font text-[10px] uppercase tracking-widest">No Frequencies Logged</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-24 pt-10 border-t border-white/5 text-center text-zinc-800">
                <p class="terminal-font text-[11px] uppercase tracking-[0.6em] italic leading-relaxed">
                    DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026
                </p>
            </footer>
        </div>
    </template>
</body>
</html>
