<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.O.G. — Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;--teal:#00E5CC;--teal-dim:#009E8E;--black:#050A0E;--navy:#0D1F2D;--panel:rgba(13,31,45,0.9);--border:rgba(201,168,76,0.25);--border-teal:rgba(0,229,204,0.2);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);font-family:'Rajdhani',sans-serif;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);}

  /* TOP BAR */
  .top-bar{background:rgba(5,10,14,0.97);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;backdrop-filter:blur(10px);flex-shrink:0;z-index:10;}
  .back-btn{color:var(--gold);font-size:20px;text-decoration:none;padding:4px 8px;}
  .top-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:3px;flex:1;text-align:center;}
  .room-indicator{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal);letter-spacing:1px;}

  /* ROOMS SELECTOR */
  .rooms-bar{background:var(--navy);border-bottom:1px solid var(--border-teal);padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;z-index:9;}
  .rooms-bar::-webkit-scrollbar{display:none;}
  .room-tab{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;padding:10px 12px;color:var(--gold-dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;flex-shrink:0;}
  .room-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
  .room-tab .unread{background:var(--teal);color:var(--black);font-size:8px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700;}

  /* MESSAGES AREA */
  .messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;z-index:1;position:relative;}
  .messages-area::-webkit-scrollbar{width:3px;}
  .messages-area::-webkit-scrollbar-thumb{background:var(--border);}

  /* Room header */
  .room-header{text-align:center;padding:8px;}
  .room-header-text{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--gold-dim);letter-spacing:3px;border:1px solid var(--border);padding:6px 16px;border-radius:2px;display:inline-block;}

  /* Messages */
  .msg{display:flex;gap:10px;max-width:85%;}
  .msg.mine{flex-direction:row-reverse;align-self:flex-end;}
  .msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);flex-shrink:0;}
  .msg-body{display:flex;flex-direction:column;gap:3px;}
  .msg-name{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:1px;}
  .msg.mine .msg-name{text-align:right;}
  .msg-bubble{background:var(--panel);border:1px solid var(--border);border-radius:6px;border-top-left-radius:2px;padding:10px 14px;font-size:14px;font-weight:500;color:#e0e0e0;line-height:1.4;}
  .msg.mine .msg-bubble{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.4);border-top-right-radius:2px;border-top-left-radius:6px;}
  .msg-time{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:1px;}
  .msg.mine .msg-time{text-align:right;}

  /* System message */
  .sys-msg{text-align:center;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:2px;padding:4px;}

  /* INPUT AREA */
  .input-area{background:rgba(5,10,14,0.97);border-top:1px solid var(--border);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;flex-shrink:0;z-index:10;}
  .msg-input{flex:1;background:rgba(13,31,45,0.8);border:1px solid var(--border-teal);border-radius:6px;padding:12px 14px;font-family:'Rajdhani',sans-serif;font-size:15px;color:#fff;outline:none;resize:none;max-height:100px;min-height:44px;}
  .msg-input:focus{border-color:var(--teal);}
  .msg-input::placeholder{color:rgba(255,255,255,0.2);}
  .send-btn{background:var(--gold);border:none;border-radius:6px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.2s;flex-shrink:0;}
  .send-btn:hover{background:var(--gold-light);box-shadow:0 0 15px rgba(201,168,76,0.4);}

  /* BOTTOM NAV */
  .bottom-nav{background:rgba(5,10,14,0.97);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;z-index:10;}
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;gap:4px;cursor:pointer;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent;}
  .nav-item.active{border-top-color:var(--gold);}
  .nav-icon{font-size:20px;}
  .nav-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:1px;}
  .nav-item.active .nav-label{color:var(--gold);}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="top-title">DISPATCH</div>
  <div class="room-indicator" id="onlineCount">● 12 ONLINE</div>
</div>

<div class="rooms-bar">
  <div class="room-tab active" onclick="switchRoom('general',this)">GENERAL HQ</div>
  <div class="room-tab" onclick="switchRoom('session01',this)">SESSION 01 <span class="unread">3</span></div>
  <div class="room-tab" onclick="switchRoom('session02',this)">SESSION 02</div>
  <div class="room-tab" onclick="switchRoom('amapiano',this)">AMAPIANO INTEL</div>
</div>

<div class="messages-area" id="messagesArea"></div>

<div class="input-area">
  <textarea class="msg-input" id="msgInput" placeholder="TRANSMIT MESSAGE..." rows="1"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
    oninput="this.style.height='44px';this.style.height=this.scrollHeight+'px'"></textarea>
  <button class="send-btn" onclick="sendMsg()">➤</button>
</div>

<div class="bottom-nav">
  <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>
  <a href="gallery.html" class="nav-item"><div class="nav-icon">🎬</div><div class="nav-label">GALLERY</div></a>
  <a href="frequency.html" class="nav-item"><div class="nav-icon">🎙️</div><div class="nav-label">LIVE</div></a>
  <a href="dispatch.html" class="nav-item active"><div class="nav-icon">💬</div><div class="nav-label">CHAT</div></a>
  <a href="dossier.html" class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></a>
</div>

<script>
const rooms={
  general:{name:'GENERAL HQ',messages:[
    {id:1,user:'OPERATIVE_ZEN',initial:'Z',text:'The groove is real 🔥',time:'21:05',mine:false},
    {id:2,user:'MOG_NOVA',initial:'N',text:'Session 02 was insane. When is the next one?',time:'21:10',mine:false},
    {id:3,user:'YOU',initial:'ME',text:'Already counting down 🎵',time:'21:12',mine:true},
    {id:4,user:'OPERATIVE_KASE',initial:'K',text:'The Directorate never misses 🎯',time:'21:15',mine:false},
  ]},
  session01:{name:'SESSION 01',messages:[
    {id:1,user:'MOG_NOVA',initial:'N',text:'That opening set was a full takeover 🎶',time:'14D AGO',mine:false},
    {id:2,user:'OPERATIVE_ZEN',initial:'Z',text:'Piano Hub killed it on the decks',time:'14D AGO',mine:false},
    {id:3,user:'OPERATIVE_RIZE',initial:'R',text:'Download the pics in the vault!!',time:'14D AGO',mine:false},
  ]},
  session02:{name:'SESSION 02',messages:[
    {id:1,user:'DIRECTORATE',initial:'D',text:'Session 02 recap is live in the vault. Go check it 🔐',time:'2D AGO',mine:false,isDirectorate:true},
    {id:2,user:'MOG_NOVA',initial:'N',text:'The energy was even crazier this time 🔥',time:'2D AGO',mine:false},
  ]},
  amapiano:{name:'AMAPIANO INTEL',messages:[
    {id:1,user:'OPERATIVE_KASE',initial:'K',text:'Who thinks Scorpion Kings are still top 5?',time:'3 HRS AGO',mine:false},
    {id:2,user:'OPERATIVE_ZEN',initial:'Z',text:'Kabza De Small is untouchable right now',time:'3 HRS AGO',mine:false},
    {id:3,user:'YOU',initial:'ME',text:'Vote in the dossier section 🗳️',time:'2 HRS AGO',mine:true},
  ]},
};

let currentRoom='general';

function renderMessages(roomKey){
  const area=document.getElementById('messagesArea');
  const room=rooms[roomKey];
  area.innerHTML=`
    <div class="room-header"><div class="room-header-text">// ${room.name} //</div></div>
    <div class="sys-msg">END-TO-END ENCRYPTED — OPERATIVE EYES ONLY</div>
    ${room.messages.map(m=>`
      <div class="msg ${m.mine?'mine':''}">
        <div class="msg-avatar" style="${m.isDirectorate?'border-color:var(--teal);color:var(--teal)':''}">${m.initial}</div>
        <div class="msg-body">
          <div class="msg-name">${m.user}</div>
          <div class="msg-bubble" style="${m.isDirectorate?'border-color:var(--teal);background:rgba(0,229,204,0.05)':''}">${m.text}</div>
          <div class="msg-time">${m.time}</div>
        </div>
      </div>
    `).join('')}
  `;
  area.scrollTop=area.scrollHeight;
}

function switchRoom(key,btn){
  currentRoom=key;
  document.querySelectorAll('.room-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  // clear unread badge
  const badge=btn.querySelector('.unread');
  if(badge)badge.remove();
  renderMessages(key);
}

function sendMsg(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text)return;
  const now=new Date();
  const time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  rooms[currentRoom].messages.push({id:Date.now(),user:'YOU',initial:'ME',text,time,mine:true});
  input.value='';
  input.style.height='44px';
  renderMessages(currentRoom);
}

renderMessages('general');
</script>
</body>
</html>
