<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020608">
<title>M.O.G. — Dispatch</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;
  --teal:#00E5CC;--teal-dim:#009E8E;
  --black:#020608;--navy:#0A1929;
  --panel:rgba(10,25,41,0.94);
  --border:rgba(201,168,76,0.22);--border-teal:rgba(0,229,204,0.18);
  --red:#FF3B3B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   THE LAYOUT — 100dvh grid, nothing scrolls except messages
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
html, body {
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  background: var(--black);
  font-family: 'Rajdhani', sans-serif;
  color: #fff;
}

.layout {
  height: 100dvh;
  max-height: 100dvh;
  display: grid;
  grid-template-rows: auto auto auto 1fr auto auto auto;
  /* rows:  topbar toolbar tabs  msgs  typing input  nav  */
  overflow: hidden;
}

/* Scanlines overlay */
.layout::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
  );
}

/* ── TOP BAR ── */
.top-bar {
  grid-row: 1;
  background: rgba(2,6,8,0.99);
  border-bottom: 1px solid var(--border);
  padding: 0 14px;
  display: flex;
  align-items: center;
  height: 56px;
  gap: 10px;
  backdrop-filter: blur(16px);
  z-index: 50;
  box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(0,0,0,0.5);
  position: relative;
}
.back-btn { color:var(--gold);font-size:22px;text-decoration:none;padding:4px;line-height:1;flex-shrink:0; }
.top-logo { width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);overflow:hidden;flex-shrink:0; }
.top-logo img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
.top-brand { flex:1;min-width:0; }
.top-brand-name { font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;color:var(--gold-light);letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.top-brand-slogan { font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--teal-dim);letter-spacing:1px;margin-top:1px; }
.online-badge { display:flex;align-items:center;gap:5px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal);letter-spacing:1px;flex-shrink:0; }
.pulse { width:5px;height:5px;border-radius:50%;background:var(--teal);animation:blink 2s infinite;flex-shrink:0; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }

/* ── DIRECTOR TOOLBAR ── */
.director-toolbar {
  grid-row: 2;
  display: none;
  background: rgba(0,229,204,0.04);
  border-bottom: 1px solid var(--border-teal);
  padding: 8px 14px;
  gap: 6px;
  flex-wrap: wrap;
  z-index: 49;
}
.director-toolbar.show { display: flex; }
.dir-btn { font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:1px;padding:7px 13px;border-radius:4px;cursor:pointer;border:1px solid var(--border-teal);color:var(--teal);background:rgba(0,229,204,0.05);transition:all 0.2s;white-space:nowrap; }
.dir-btn:hover,.dir-btn:active { background:rgba(0,229,204,0.15);border-color:var(--teal); }
.dir-btn.danger { color:var(--red);border-color:rgba(255,59,59,0.3);background:rgba(255,59,59,0.04); }
.dir-btn.danger:hover { background:rgba(255,59,59,0.15); }

/* ── ROOM TABS ── */
.rooms-bar {
  grid-row: 3;
  background: rgba(10,25,41,0.88);
  border-bottom: 1px solid var(--border-teal);
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
  z-index: 48;
}
.rooms-bar::-webkit-scrollbar { display:none; }
.room-tab { font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;padding:11px 14px;color:var(--gold-dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;flex-shrink:0;background:none;border-top:none;border-left:none;border-right:none;display:flex;align-items:center;gap:5px; }
.room-tab.active { color:var(--gold);border-bottom-color:var(--gold); }
.room-tab:hover:not(.active) { color:var(--gold-light); }
.unread-dot { width:7px;height:7px;background:var(--teal);border-radius:50%;flex-shrink:0;box-shadow:0 0 5px rgba(0,229,204,0.6);animation:blink 1.5s infinite; }
.room-tab.vip-tab { display:none; }
.room-tab.vip-tab.visible { display:flex; }

/* ── MESSAGES — fills all remaining space, ONLY scrollable area ── */
.messages-wrap {
  grid-row: 4;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: rgba(201,168,76,0.2) transparent;
}
.messages-wrap::-webkit-scrollbar { width:4px; }
.messages-wrap::-webkit-scrollbar-track { background:transparent; }
.messages-wrap::-webkit-scrollbar-thumb { background:rgba(201,168,76,0.25);border-radius:4px; }
.messages-wrap::-webkit-scrollbar-thumb:hover { background:var(--gold); }

/* ── SCROLL TO BOTTOM FAB ── */
.scroll-fab {
  position: fixed;
  right: 16px;
  bottom: calc(56px + 62px + 10px); /* nav height + input height + gap */
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(10,25,41,0.97);
  border: 1.5px solid var(--teal);
  color: var(--teal);
  font-size: 18px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 60;
  box-shadow: 0 2px 14px rgba(0,0,0,0.5), 0 0 10px rgba(0,229,204,0.2);
  transition: all 0.2s;
}
.scroll-fab.show { display: flex; }
.scroll-fab:hover { background: rgba(0,229,204,0.15); }

/* Room label + system messages */
.room-header-label { text-align:center;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold-dim);letter-spacing:3px;border:1px solid var(--border);padding:5px 14px;border-radius:3px;display:inline-block;align-self:center;margin-bottom:6px; }
.sys-msg { text-align:center;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:2px;padding:4px; }
.date-divider { font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:2px;margin:6px 0;display:flex;align-items:center;gap:10px; }
.date-divider::before,.date-divider::after { content:'';flex:1;height:1px;background:rgba(255,255,255,0.06); }

/* ── BUBBLES ── */
.msg { display:flex;gap:9px;max-width:88%;animation:msgIn 0.22s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)} }
.msg.mine { flex-direction:row-reverse;align-self:flex-end; }
.msg.dir-msg { max-width:96%; }
.avatar { width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);flex-shrink:0;align-self:flex-end;overflow:hidden;background:var(--navy); }
.avatar img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
.avatar.dir { border-color:var(--teal);border-width:2px;box-shadow:0 0 8px rgba(0,229,204,0.3); }
.avatar.me  { border-color:var(--gold); }
.msg-body { display:flex;flex-direction:column;gap:2px;min-width:0; }
.msg-sender { font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:1px; }
.msg.mine .msg-sender { text-align:right;color:var(--gold-dim); }
.bubble { background:var(--panel);border:1px solid var(--border);border-radius:12px;border-bottom-left-radius:3px;padding:10px 14px;font-size:14px;font-weight:500;color:#ddd;line-height:1.45;word-break:break-word;position:relative; }
.msg.mine .bubble { background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.35);border-bottom-right-radius:3px;border-bottom-left-radius:12px; }
.bubble.dir-bubble { background:linear-gradient(135deg,rgba(0,229,204,0.06),rgba(10,25,41,0.95));border-color:rgba(0,229,204,0.35); }
.bubble.dir-bubble::before { content:'👑 DIRECTORATE';position:absolute;top:-9px;left:10px;font-family:'Orbitron',sans-serif;font-size:7px;color:var(--teal);letter-spacing:2px;background:var(--black);padding:0 5px;border-radius:2px; }
.bubble-img { padding:4px;background:var(--navy);border:1px solid var(--border);border-radius:10px;cursor:pointer; }
.bubble-img img { max-width:200px;max-height:200px;border-radius:6px;display:block;object-fit:cover; }
.msg-foot { display:flex;align-items:center;gap:8px;margin-top:2px; }
.msg.mine .msg-foot { flex-direction:row-reverse; }
.msg-time { font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.22);letter-spacing:1px; }
.tick { font-size:9px;color:rgba(255,255,255,0.2); }
.tick.sent { color:var(--teal); }
/* Broadcast banner */
.broadcast { background:linear-gradient(135deg,rgba(0,229,204,0.07),rgba(10,25,41,0.97));border:1px solid rgba(0,229,204,0.3);border-radius:8px;padding:12px 14px;margin:4px 0;position:relative;overflow:hidden;animation:msgIn 0.3s ease; }
.broadcast::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent); }
.bc-label { font-family:'Orbitron',sans-serif;font-size:8px;color:var(--teal);letter-spacing:3px;margin-bottom:4px; }
.bc-text { font-size:14px;font-weight:600;color:#e0e0e0;line-height:1.4; }
.bc-time { font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.2);margin-top:4px; }
/* Reactions */
.reacts { display:flex;gap:4px;flex-wrap:wrap;margin-top:4px; }
.react-pill { background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:10px;padding:2px 8px;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:3px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--gold-dim); }
.react-pill.on,.react-pill:hover { background:rgba(201,168,76,0.18);border-color:var(--gold);color:var(--gold); }
.react-picker { display:none;position:absolute;bottom:calc(100% + 6px);left:0;background:rgba(10,25,41,0.98);border:1px solid var(--border);border-radius:20px;padding:6px 10px;gap:6px;z-index:70;backdrop-filter:blur(12px); }
.react-picker.show { display:flex; }
.msg.mine .react-picker { left:auto;right:0; }
.react-e { font-size:18px;cursor:pointer;transition:transform 0.15s;padding:2px; }
.react-e:hover { transform:scale(1.4); }

/* ── TYPING ── */
.typing-bar {
  grid-row: 5;
  display: none;
  padding: 4px 14px;
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(255,255,255,0.3);letter-spacing:1px;
  background:rgba(2,6,8,0.85);
}
.typing-bar.show { display:block; }
.t-dots { display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle; }
.t-dots span { width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.3);animation:td 1.4s infinite;display:inline-block; }
.t-dots span:nth-child(2){animation-delay:0.2s}
.t-dots span:nth-child(3){animation-delay:0.4s}
@keyframes td{0%,80%,100%{opacity:0.3}40%{opacity:1}}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   INPUT WRAP — grid-row:6, always rendered, never hidden
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.input-wrap {
  grid-row: 6;
  background: rgba(2,6,8,0.99);
  border-top: 1.5px solid var(--border);
  padding: 10px 12px 12px;
  z-index: 50;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
}
.preview-strip { display:none;padding-bottom:8px;gap:8px;overflow-x:auto;scrollbar-width:none; }
.preview-strip.show { display:flex; }
.preview-strip::-webkit-scrollbar { display:none; }
.preview-thumb { position:relative;flex-shrink:0; }
.preview-thumb img { width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--border);display:block; }
.p-remove { position:absolute;top:-5px;right:-5px;background:var(--black);border:1px solid var(--border);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;color:var(--gold-dim); }

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}

.attach-btn {
  width: 46px;
  height: 46px;
  min-width: 46px;
  flex-shrink: 0;
  background: rgba(201,168,76,0.06);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  cursor: pointer;
  color: var(--gold-dim);
  transition: all 0.2s;
}
.attach-btn:hover,.attach-btn:active { border-color:var(--gold);color:var(--gold); }

/* The textarea */
.msg-input {
  flex: 1;
  min-width: 0;
  background: rgba(10,25,41,0.92);
  border: 1.5px solid var(--border-teal);
  border-radius: 12px;
  padding: 12px 14px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  color: #fff;
  outline: none;
  resize: none;
  min-height: 46px;
  max-height: 120px;
  line-height: 1.4;
  display: block;
  -webkit-appearance: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.msg-input:focus { border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,229,204,0.1); }
.msg-input::placeholder { color:rgba(255,255,255,0.25); }

/* The send button */
.send-btn {
  width: 46px;
  height: 46px;
  min-width: 46px;
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  border: none;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--black);
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 2px 12px rgba(201,168,76,0.3);
}
.send-btn:hover { background:linear-gradient(135deg,var(--gold),var(--gold-light));box-shadow:0 0 20px rgba(201,168,76,0.5); }
.send-btn:active { transform:scale(0.92); }
.send-btn:disabled { opacity:0.4;cursor:not-allowed;transform:none; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  grid-row: 7;
  background: rgba(2,6,8,0.99);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5,1fr);
  z-index: 50;
}
.nav-item { display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;gap:4px;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent; }
.nav-item.active { border-top-color:var(--gold); }
.nav-icon { font-size:20px;line-height:1; }
.nav-label { font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:1px; }
.nav-item.active .nav-label { color:var(--gold); }

/* ── LIGHTBOX ── */
.lightbox { display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.95);backdrop-filter:blur(8px);align-items:center;justify-content:center; }
.lightbox.open { display:flex; }
.lightbox img { max-width:90vw;max-height:85vh;border-radius:8px;object-fit:contain; }
.lb-close { position:absolute;top:16px;right:16px;background:rgba(10,25,41,0.8);border:1px solid var(--border);color:var(--gold);font-size:18px;padding:6px 12px;border-radius:4px;cursor:pointer; }

/* ── CONFIRM DIALOG ── */
.confirm-ov { display:none;position:fixed;inset:0;z-index:300;background:rgba(2,6,8,0.92);backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:24px; }
.confirm-ov.show { display:flex; }
.confirm-box { width:100%;max-width:300px;background:rgba(10,25,41,0.98);border:1px solid rgba(255,59,59,0.3);border-radius:12px;padding:28px 22px;text-align:center; }
.confirm-box::before { content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:-28px -22px 20px; }
.ci { font-size:36px;margin-bottom:12px; }
.ct { font-family:'Orbitron',sans-serif;font-size:11px;color:var(--red);letter-spacing:2px;margin-bottom:8px; }
.cm { font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1px;line-height:1.8;margin-bottom:20px; }
.cb { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.cn { padding:11px;background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:4px;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold);letter-spacing:2px;cursor:pointer; }
.cy { padding:11px;background:rgba(255,59,59,0.12);border:1px solid rgba(255,59,59,0.4);border-radius:4px;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--red);letter-spacing:2px;cursor:pointer; }
</style>
</head>
<body>

<div class="layout">

  <!-- ROW 1: TOP BAR -->
  <div class="top-bar">
    <a href="../index.html" class="back-btn">←</a>
    <div class="top-logo">
      <img src="../logo.png" alt="M.O.G." onerror="this.onerror=null;this.src='../assets/images/logo.png'">
    </div>
    <div class="top-brand">
      <div class="top-brand-name">MINISTRY OF GROOVE</div>
      <div class="top-brand-slogan">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID</div>
    </div>
    <div class="online-badge"><div class="pulse"></div><span id="onlineCount">— ONLINE</span></div>
  </div>

  <!-- ROW 2: DIRECTOR TOOLBAR -->
  <div class="director-toolbar" id="directorToolbar">
    <button class="dir-btn" onclick="dirAnnounce()">📣 BROADCAST</button>
    <button class="dir-btn" onclick="dirPin()">📌 PIN LAST</button>
    <button class="dir-btn danger" onclick="askClear()">🗑️ CLEAR ROOM</button>
  </div>

  <!-- ROW 3: ROOM TABS -->
  <div class="rooms-bar">
    <button class="room-tab active" onclick="switchRoom('general',this)">💬 GENERAL HQ</button>
    <button class="room-tab" onclick="switchRoom('session01',this)">🎬 SESSION 01</button>
    <button class="room-tab" onclick="switchRoom('session02',this)">🎬 SESSION 02</button>
    <button class="room-tab" onclick="switchRoom('amapiano',this)">🎵 AMAPIANO</button>
    <button class="room-tab vip-tab" id="vipTab" onclick="switchRoom('vip',this)">👑 VIP</button>
  </div>

  <!-- ROW 4: MESSAGES (only scrollable area) -->
  <div class="messages-wrap" id="msgWrap"></div>

  <!-- ROW 5: TYPING INDICATOR -->
  <div class="typing-bar" id="typingBar">
    <span id="typingText">Someone is typing</span>
    <span class="t-dots"><span></span><span></span><span></span></span>
  </div>

  <!-- ROW 6: INPUT — always in the grid, never hidden -->
  <div class="input-wrap">
    <div class="preview-strip" id="previewStrip"></div>
    <div class="input-row">
      <button class="attach-btn" onclick="document.getElementById('imgIn').click()" title="Attach photo">📎</button>
      <input type="file" id="imgIn" accept="image/*" style="display:none" onchange="handleImg(this)">
      <textarea
        class="msg-input"
        id="msgInput"
        placeholder="TRANSMIT MESSAGE..."
        rows="1"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        oninput="grow(this);onType()"
        onkeydown="onKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
    </div>
  </div>

  <!-- ROW 7: BOTTOM NAV -->

    <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>

<button class="scroll-fab" id="scrollFab" onclick="toBottom()">↓</button>

<div class="lightbox" id="lightbox" onclick="closeLB()">
  <button class="lb-close" onclick="closeLB()">✕</button>
  <img id="lbImg" src="" alt="">
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-ov" id="confirmOv">
  <div class="confirm-box">
    <div class="ci">🗑️</div>
    <div class="ct">CLEAR ROOM?</div>
    <div class="cm" id="confirmMsg">DELETE ALL MESSAGES?</div>
    <div class="cb">
      <button class="cn" onclick="closeConfirm()">CANCEL</button>
      <button class="cy" onclick="doClear()">CLEAR</button>
    </div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// IDENTITY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const DIRECTOR = 'director.mog@gmail.com';
const ME_NAME   = (localStorage.getItem('mogUser')  || 'OPERATIVE').toUpperCase();
const ME_EMAIL  = (localStorage.getItem('mogEmail') || '').toLowerCase();
const ME_RANK   =  localStorage.getItem('mogRank')  || 'RECRUIT';
const ME_AVATAR =  localStorage.getItem('mogAvatar')|| null;
const ME_ID     =  localStorage.getItem('mogUserId')|| 'local-' + Math.random().toString(36).substr(2,8);
const ME_INIT   = ME_NAME.substring(0,2);
const IS_DIR    = ME_EMAIL === DIRECTOR || ME_RANK === 'ADMIN';

const ROOMS = {
  general:  { name:'GENERAL HQ',          icon:'💬', vip:false },
  session01:{ name:'SESSION 01 DEBRIEF',   icon:'🎬', vip:false },
  session02:{ name:'SESSION 02 DEBRIEF',   icon:'🎬', vip:false },
  amapiano: { name:'AMAPIANO INTEL',       icon:'🎵', vip:false },
  vip:      { name:'VIP — DIRECTORS ONLY', icon:'👑', vip:true  },
};

let room    = 'general';
let imgPend = null;
let typeTm  = null;
let rtChan  = null;
let msgN    = 0;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// STORAGE — messages persist in localStorage
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const key = r => 'mog_chat_' + r;

function load(r){ try{ return JSON.parse(localStorage.getItem(key(r)) || '[]'); }catch(e){ return []; } }

function save(r, msgs){
  try{ localStorage.setItem(key(r), JSON.stringify(msgs.slice(-200))); }
  catch(e){ try{ localStorage.setItem(key(r), JSON.stringify(msgs.slice(-50))); }catch(e2){} }
}

function push(r, msg){
  const msgs = load(r);
  if(msg.dbId && msgs.some(m => m.dbId === msg.dbId)) return false;
  msgs.push(msg);
  save(r, msgs);
  return true;
}

function clearRoom(r){ localStorage.removeItem(key(r)); }

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function init(){
  if(IS_DIR){
    document.getElementById('directorToolbar').classList.add('show');
    document.getElementById('vipTab').classList.add('visible');
  }
  document.getElementById('onlineCount').textContent = (Math.floor(Math.random()*18)+3) + ' ONLINE';

  // Scroll watcher
  const wrap = document.getElementById('msgWrap');
  wrap.addEventListener('scroll', () => {
    const far = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight;
    document.getElementById('scrollFab').classList.toggle('show', far > 100);
  }, { passive:true });

  render(room);
  syncDB(room);
  liveConnect(room);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function render(r){
  const def  = ROOMS[r];
  const msgs = load(r);
  const wrap = document.getElementById('msgWrap');

  let html = `
    <div style="display:flex;justify-content:center;margin-bottom:8px;">
      <div class="room-header-label">${def.icon} ${def.name}</div>
    </div>
    <div class="sys-msg">🔐 OPERATIVE EYES ONLY · ENCRYPTED</div>`;

  if(!msgs.length){
    html += `<div class="sys-msg" style="margin-top:40px;opacity:0.3;">
      NO TRANSMISSIONS YET<br><span style="font-size:8px;opacity:0.6;">START THE CONVERSATION</span>
    </div>`;
  } else {
    let lastDate = '';
    msgs.forEach(m => {
      if(m.date && m.date !== lastDate){ lastDate = m.date; html += `<div class="date-divider">${m.date}</div>`; }
      html += msgHTML(m);
    });
  }
  wrap.innerHTML = html;
  toBottom(false);
}

function toBottom(animate=true){
  const wrap = document.getElementById('msgWrap');
  if(wrap){ wrap.scrollTop = wrap.scrollHeight; }
  document.getElementById('scrollFab').classList.remove('show');
}

function appendOne(m){
  const wrap = document.getElementById('msgWrap');
  // Remove empty state
  const empty = wrap.querySelector('.sys-msg[style*="margin-top"]');
  if(empty) empty.remove();
  const d = document.createElement('div');
  d.innerHTML = msgHTML(m).trim();
  const node = d.firstElementChild;
  if(node) wrap.appendChild(node);
  // Only auto-scroll if user is near bottom
  const far = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight;
  if(far < 120) toBottom();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MESSAGE HTML
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function msgHTML(m){
  if(m.type === 'bc') return `<div class="broadcast">
    <div class="bc-label">📣 DIRECTORATE BROADCAST</div>
    <div class="bc-text">${x(m.text)}</div>
    <div class="bc-time">${m.t||''}</div>
  </div>`;

  const mine  = m.mine || m.uid === ME_ID;
  const isDir = m.dir  || false;
  const av    = m.av
    ? `<img src="${m.av}" alt="${x(m.u)}" onerror="this.outerHTML='${x(m.ini||'OP')}';">`
    : (m.ini || 'OP');
  const bCls  = isDir && !mine ? 'dir-bubble' : '';
  const reacts = m.r && Object.keys(m.r).length
    ? `<div class="reacts">${Object.entries(m.r).map(([e,c])=>
        `<span class="react-pill ${(m.mr||[]).includes(e)?'on':''}" onclick="toggleR('${m.id}','${e}')">${e} ${c}</span>`
      ).join('')}</div>` : '';

  const content = m.type === 'img'
    ? `<div class="bubble-img" onclick="openLB('${m.src}')"><img src="${m.src}" alt="img" loading="lazy"></div>`
    : `<div class="bubble ${bCls}" style="position:relative">
        ${x(m.text)}
        <div class="react-picker" id="rp-${m.id}">
          ${['❤️','🔥','🎵','💃','😂','👑','🙌','💯'].map(e=>
            `<span class="react-e" onclick="addR('${m.id}','${e}')">${e}</span>`
          ).join('')}
        </div>
       </div>`;

  return `<div class="msg ${mine?'mine':''} ${isDir?'dir-msg':''}" data-id="${m.id}"
    ontouchstart="lp('${m.id}')" ontouchend="clp()"
    oncontextmenu="showPicker('${m.id}');return false;">
    <div class="avatar ${isDir&&!mine?'dir':''} ${mine?'me':''}">${av}</div>
    <div class="msg-body">
      <span class="msg-sender">${x(m.u)}${isDir&&!mine?' 👑':''}</span>
      ${content}
      <div class="msg-foot">
        <span class="msg-time">${m.t||''}</span>
        ${mine?`<span class="tick ${m.ok?'sent':''}">✓${m.ok?'✓':''}</span>`:''}
      </div>
      ${reacts}
    </div>
  </div>`;
}

function x(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SUPABASE SYNC
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function syncDB(r){
  if(typeof sb === 'undefined') return;
  try{
    const { data } = await sb
      .from('messages')
      .select('*, profiles(username, avatar_url, rank, email)')
      .eq('room', r).eq('deleted', false)
      .order('created_at', { ascending:true }).limit(100);
    if(!data?.length) return;
    const stored = new Set(load(r).map(m=>m.dbId).filter(Boolean));
    let changed = false;
    data.forEach(row => {
      if(stored.has(row.id)) return;
      const p = row.profiles || {};
      const isDir = p.rank==='ADMIN'||(p.email||'').toLowerCase()===DIRECTOR;
      const now = new Date(row.created_at);
      const m = {
        id: 'db-'+row.id, dbId: row.id,
        u: p.username||'OPERATIVE', ini:(p.username||'OP').substring(0,2).toUpperCase(),
        av: p.avatar_url||null, type:'text', text:row.content,
        t: now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),
        date: now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}),
        mine:false, uid:row.user_id, dir:isDir, r:{}, mr:[], ok:true
      };
      if(push(r,m)) changed=true;
    });
    if(changed) render(r);
  } catch(e){}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// REALTIME
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function liveConnect(r){
  if(typeof sb === 'undefined') return;
  if(rtChan) sb.removeChannel(rtChan);
  rtChan = sb.channel('dispatch-'+r)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room=eq.'+r},
      async payload => {
        const row = payload.new;
        if(row.user_id === ME_ID || row.user_id === localStorage.getItem('mogUserId')) return;
        let p = {};
        try{ const{data}=await sb.from('profiles').select('username,avatar_url,rank,email').eq('id',row.user_id).single(); if(data)p=data; }catch(e){}
        const isDir = p.rank==='ADMIN'||(p.email||'').toLowerCase()===DIRECTOR;
        const now = new Date(row.created_at||Date.now());
        const m = {
          id:'db-'+row.id, dbId:row.id,
          u:p.username||'OPERATIVE', ini:(p.username||'OP').substring(0,2).toUpperCase(),
          av:p.avatar_url||null, type:'text', text:row.content,
          t:now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),
          date:now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}),
          mine:false, uid:row.user_id, dir:isDir, r:{}, mr:[], ok:true
        };
        if(push(r,m)) appendOne(m);
        if(r !== room){ // mark tab unread
          document.querySelectorAll('.room-tab').forEach(t=>{
            if(t.getAttribute('onclick')?.includes(`'${r}'`) && !t.querySelector('.unread-dot')){
              const d=document.createElement('span'); d.className='unread-dot'; t.appendChild(d);
            }
          });
        }
      })
    .on('presence',{event:'sync'},()=>{
      try{
        const typing=Object.values(rtChan.presenceState()).flat()
          .filter(p=>p.typing&&p.user!==ME_NAME).map(p=>p.user);
        const bar=document.getElementById('typingBar');
        if(typing.length){ document.getElementById('typingText').textContent=typing.slice(0,2).join(', ')+(typing.length>1?' are':' is')+' typing'; bar.classList.add('show'); }
        else bar.classList.remove('show');
      }catch(e){}
    })
    .subscribe();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SEND
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function send(){
  const inp  = document.getElementById('msgInput');
  const text = inp.value.trim();
  if(!text && !imgPend) return;

  const now   = new Date();
  const t     = now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
  const date  = now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});
  const id    = 'L'+(++msgN)+'-'+Date.now();

  if(imgPend){
    const m = { id, u:ME_NAME, ini:ME_INIT, av:ME_AVATAR, type:'img', src:imgPend, t, date, mine:true, uid:ME_ID, dir:IS_DIR, r:{}, mr:{}, ok:false };
    push(room, m); appendOne(m); clearImg();
  }
  if(text){
    inp.value=''; inp.style.height='46px';
    const m = { id, u:ME_NAME, ini:ME_INIT, av:ME_AVATAR, type:'text', text, t, date, mine:true, uid:ME_ID, dir:IS_DIR, r:{}, mr:[], ok:false };
    push(room, m); appendOne(m);
    document.getElementById('sendBtn').disabled=true;
    setTimeout(()=>document.getElementById('sendBtn').disabled=false, 400);

    if(typeof sb !== 'undefined'){
      try{
        const {data:{session}} = await sb.auth.getSession();
        if(session){
          const {data:row,error} = await sb.from('messages').insert({room, content:text, user_id:session.user.id}).select().single();
          if(!error && row){
            const msgs = load(room);
            const i = msgs.findIndex(m=>m.id===id);
            if(i!==-1){ msgs[i].dbId=row.id; msgs[i].ok=true; save(room,msgs); }
            const el=document.querySelector(`[data-id="${id}"] .tick`);
            if(el){el.classList.add('sent');el.textContent='✓✓';}
          }
        }
      }catch(e){}
    }
  }
  inp.focus();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INPUT HELPERS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function grow(el){
  el.style.height = '46px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function onKey(e){
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if(!isMobile && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
}
function onType(){
  if(typeof sb==='undefined'||!rtChan) return;
  try{ rtChan.track({user:ME_NAME,typing:true}); clearTimeout(typeTm); typeTm=setTimeout(()=>rtChan.track({user:ME_NAME,typing:false}),2500); }catch(e){}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SWITCH ROOM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function switchRoom(r, btn){
  if(ROOMS[r].vip && !IS_DIR){ toast('⚠ VIP ROOM — DIRECTOR ONLY'); return; }
  room = r;
  document.querySelectorAll('.room-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const dot=btn.querySelector('.unread-dot'); if(dot)dot.remove();
  render(r); syncDB(r); liveConnect(r);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// IMAGE ATTACH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function handleImg(input){
  if(!input.files?.[0]) return;
  if(input.files[0].size > 5*1024*1024){ toast('⚠ IMAGE UNDER 5MB ONLY'); return; }
  const fr = new FileReader();
  fr.onload = e => {
    imgPend = e.target.result;
    const s = document.getElementById('previewStrip');
    s.innerHTML=`<div class="preview-thumb"><img src="${imgPend}" alt="preview"><span class="p-remove" onclick="clearImg()">✕</span></div>`;
    s.classList.add('show');
  };
  fr.readAsDataURL(input.files[0]);
}
function clearImg(){
  imgPend=null;
  const s=document.getElementById('previewStrip'); s.innerHTML=''; s.classList.remove('show');
  document.getElementById('imgIn').value='';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// REACTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showPicker(id){ document.querySelectorAll('.react-picker').forEach(p=>p.classList.remove('show')); const el=document.getElementById('rp-'+id); if(el)el.classList.add('show'); }
function addR(id,e){ document.querySelectorAll('.react-picker').forEach(p=>p.classList.remove('show')); toggleR(id,e); }
function toggleR(id,e){
  const msgs=load(room); const m=msgs.find(m=>m.id===id); if(!m)return;
  if(!m.r)m.r={}; if(!m.mr)m.mr=[];
  if(m.mr.includes(e)){ m.mr=m.mr.filter(x=>x!==e); m.r[e]=Math.max((m.r[e]||1)-1,0); if(!m.r[e])delete m.r[e]; }
  else { m.mr.push(e); m.r[e]=(m.r[e]||0)+1; }
  save(room,msgs); render(room);
}
let lpTm; function lp(id){lpTm=setTimeout(()=>showPicker(id),500);} function clp(){clearTimeout(lpTm);}
document.addEventListener('click',e=>{ if(!e.target.closest('.react-picker')&&!e.target.closest('.msg')) document.querySelectorAll('.react-picker').forEach(p=>p.classList.remove('show')); });

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DIRECTOR CONTROLS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function dirAnnounce(){
  const text=prompt('📣 BROADCAST MESSAGE:'); if(!text?.trim()) return;
  const now=new Date();
  const m={id:'bc-'+Date.now(),type:'bc',text:text.trim(),u:'DIRECTORATE',ini:'D',t:now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),date:now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}),mine:false,dir:true};
  push(room,m); appendOne(m);
  if(typeof sb!=='undefined'){const{data:{session}}=await sb.auth.getSession().catch(()=>({data:{session:null}})); if(session)await sb.from('messages').insert({room,content:'[BC] '+text.trim(),user_id:session.user.id,is_pinned:true}).catch(()=>{});}
}
function dirPin(){const msgs=load(room);if(!msgs.length){toast('NO MESSAGES');return;}toast('📌 PINNED: '+(msgs[msgs.length-1].text||'IMAGE').substring(0,30));}
function askClear(){ document.getElementById('confirmMsg').textContent='DELETE ALL MESSAGES IN '+ROOMS[room].name+'?'; document.getElementById('confirmOv').classList.add('show'); }
function closeConfirm(){ document.getElementById('confirmOv').classList.remove('show'); }
function doClear(){ closeConfirm(); clearRoom(room); if(typeof sb!=='undefined')sb.from('messages').update({deleted:true}).eq('room',room).catch(()=>{}); render(room); toast('✓ ROOM CLEARED'); }

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LIGHTBOX
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openLB(src){ document.getElementById('lbImg').src=src; document.getElementById('lightbox').classList.add('open'); }
function closeLB(){ document.getElementById('lightbox').classList.remove('open'); }

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toast(msg){
  let el=document.getElementById('_toast');
  if(!el){ el=document.createElement('div');el.id='_toast';el.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(10,25,41,0.97);border:1px solid rgba(0,229,204,0.35);border-radius:8px;padding:10px 20px;font-family:Orbitron,sans-serif;font-size:9px;color:#00E5CC;letter-spacing:2px;z-index:999;white-space:nowrap;backdrop-filter:blur(12px);display:none;box-shadow:0 0 16px rgba(0,229,204,0.15)';document.body.appendChild(el); }
  el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2800);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
init();
</script>
