<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#020608">
<title>M.O.G. — Dispatch</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;
  --teal:#00E5CC;--teal-dim:#009E8E;
  --black:#020608;--navy:#0A1929;
  --panel:rgba(10,25,41,0.94);
  --border:rgba(201,168,76,0.22);--border-teal:rgba(0,229,204,0.18);
  --red:#FF3B3B;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;}

/* KEY FIX: body must NOT use overflow:hidden — that hides the input on mobile */
body{
  background:var(--black);
  font-family:'Rajdhani',sans-serif;
  color:#fff;
  height:100%;
  /* Use dvh so the layout respects the keyboard */
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* Scanlines */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);
}

/* ── TOP BAR ── */
.top-bar{
  background:rgba(2,6,8,0.97);border-bottom:1px solid var(--border);
  padding:0 14px;display:flex;align-items:center;height:56px;gap:10px;
  backdrop-filter:blur(16px);flex-shrink:0;z-index:50;
  box-shadow:0 2px 12px rgba(0,0,0,0.4);
}
.back-btn{color:var(--gold);font-size:22px;text-decoration:none;padding:4px;line-height:1;flex-shrink:0;}
.top-logo{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--gold);overflow:hidden;flex-shrink:0;}
.top-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.top-brand{flex:1;min-width:0;}
.top-brand-name{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:900;color:var(--gold-light);letter-spacing:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-brand-slogan{font-family:'Share Tech Mono',monospace;font-size:7px;color:var(--teal-dim);letter-spacing:1px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.online-badge{display:flex;align-items:center;gap:5px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal);letter-spacing:1px;white-space:nowrap;flex-shrink:0;}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulseAnim 2s infinite;flex-shrink:0;}
@keyframes pulseAnim{0%,100%{opacity:1}50%{opacity:0.2}}

/* ── DIRECTOR TOOLBAR ── */
.director-toolbar{
  display:none;background:rgba(0,229,204,0.04);
  border-bottom:1px solid var(--border-teal);
  padding:8px 14px;gap:6px;flex-shrink:0;flex-wrap:wrap;z-index:49;
}
.director-toolbar.show{display:flex;}
.dir-btn{
  font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:1px;
  padding:6px 12px;border-radius:4px;cursor:pointer;
  border:1px solid var(--border-teal);color:var(--teal);
  background:rgba(0,229,204,0.05);transition:all 0.2s;white-space:nowrap;
}
.dir-btn:hover{background:rgba(0,229,204,0.15);border-color:var(--teal);}
.dir-btn.danger{color:var(--red);border-color:rgba(255,59,59,0.3);background:rgba(255,59,59,0.04);}
.dir-btn.danger:hover{background:rgba(255,59,59,0.15);}

/* ── ROOM TABS ── */
.rooms-bar{
  background:rgba(10,25,41,0.85);border-bottom:1px solid var(--border-teal);
  display:flex;overflow-x:auto;scrollbar-width:none;flex-shrink:0;z-index:48;
}
.rooms-bar::-webkit-scrollbar{display:none;}
.room-tab{
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;
  padding:11px 14px;color:var(--gold-dim);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all 0.2s;flex-shrink:0;
  background:none;border-top:none;border-left:none;border-right:none;
  display:flex;align-items:center;gap:5px;
}
.room-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.room-tab:hover:not(.active){color:var(--gold-light);}
.unread-dot{
  width:7px;height:7px;background:var(--teal);border-radius:50%;
  flex-shrink:0;box-shadow:0 0 5px rgba(0,229,204,0.6);animation:pulseAnim 1.5s infinite;
}
.room-tab.vip-tab{display:none;}
.room-tab.vip-tab.visible{display:flex;}

/* ── CHAT BODY — KEY FIX ──
   flex:1 with min-height:0 makes it fill remaining space
   overflow-y:auto allows scrolling within this area only    */
.chat-body{
  flex:1;
  min-height:0;         /* critical — without this flex:1 doesn't shrink */
  display:flex;
  flex-direction:column;
  overflow:hidden;
  position:relative;
  z-index:1;
}

.messages-wrap{
  flex:1;
  min-height:0;         /* critical */
  overflow-y:auto;
  padding:12px 14px 4px;
  display:flex;
  flex-direction:column;
  gap:8px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.messages-wrap::-webkit-scrollbar{width:3px;}
.messages-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* Room header */
.room-header-label{
  text-align:center;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold-dim);
  letter-spacing:3px;border:1px solid var(--border);padding:5px 14px;border-radius:3px;
  display:inline-block;align-self:center;margin-bottom:4px;
}
.sys-msg{
  text-align:center;font-family:'Share Tech Mono',monospace;font-size:9px;
  color:var(--teal-dim);letter-spacing:2px;padding:4px;
}
.date-divider{
  text-align:center;font-family:'Share Tech Mono',monospace;font-size:8px;
  color:rgba(255,255,255,0.2);letter-spacing:2px;margin:6px 0;
  display:flex;align-items:center;gap:10px;
}
.date-divider::before,.date-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06);}

/* ── MESSAGE BUBBLES ── */
.msg{display:flex;gap:9px;max-width:88%;animation:msgIn 0.22s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.mine{flex-direction:row-reverse;align-self:flex-end;}
.msg.director-msg{max-width:96%;}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;
  border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);
  flex-shrink:0;align-self:flex-end;overflow:hidden;background:var(--navy);
}
.msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.msg-avatar.is-director{border-color:var(--teal);border-width:2px;box-shadow:0 0 8px rgba(0,229,204,0.35);}
.msg-avatar.is-mine{border-color:var(--gold);}

.msg-body{display:flex;flex-direction:column;gap:2px;min-width:0;}
.msg-name{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:1px;}
.msg.mine .msg-name{text-align:right;color:var(--gold-dim);}

.bubble{
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;border-bottom-left-radius:3px;
  padding:10px 14px;font-size:14px;font-weight:500;color:#ddd;
  line-height:1.45;word-break:break-word;position:relative;
}
.msg.mine .bubble{
  background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.35);
  border-bottom-right-radius:3px;border-bottom-left-radius:12px;
}
.bubble.director-bubble{
  background:linear-gradient(135deg,rgba(0,229,204,0.06),rgba(10,25,41,0.95));
  border-color:rgba(0,229,204,0.35);
}
.bubble.director-bubble::before{
  content:'👑 DIRECTORATE';
  position:absolute;top:-9px;left:10px;
  font-family:'Orbitron',sans-serif;font-size:7px;color:var(--teal);letter-spacing:2px;
  background:var(--black);padding:0 5px;border-radius:2px;
}
.bubble-img{padding:5px;background:var(--navy);border:1px solid var(--border);border-radius:10px;cursor:pointer;}
.bubble-img img{max-width:200px;max-height:200px;border-radius:6px;display:block;object-fit:cover;}

.msg-footer{display:flex;align-items:center;gap:8px;margin-top:2px;}
.msg.mine .msg-footer{flex-direction:row-reverse;}
.msg-time{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.22);letter-spacing:1px;}
.msg-tick{font-size:9px;color:rgba(255,255,255,0.2);}
.msg-tick.read{color:var(--teal);}

/* Director broadcast banner */
.director-announce{
  display:block;background:linear-gradient(135deg,rgba(0,229,204,0.07),rgba(10,25,41,0.97));
  border:1px solid rgba(0,229,204,0.3);border-radius:8px;padding:12px 14px;
  margin:4px 0;position:relative;overflow:hidden;animation:msgIn 0.3s ease;
}
.director-announce::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);}
.da-label{font-family:'Orbitron',sans-serif;font-size:8px;color:var(--teal);letter-spacing:3px;margin-bottom:4px;}
.da-text{font-size:14px;font-weight:600;color:#e0e0e0;line-height:1.4;}
.da-time{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.2);margin-top:4px;}

/* ── REACTIONS ── */
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.reaction-pill{
  background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:10px;
  padding:2px 8px;cursor:pointer;transition:all 0.2s;
  display:inline-flex;align-items:center;gap:3px;
  font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--gold-dim);
}
.reaction-pill.reacted,.reaction-pill:hover{background:rgba(201,168,76,0.18);border-color:var(--gold);color:var(--gold);}
.reaction-bar{
  display:none;position:absolute;bottom:calc(100% + 6px);left:0;
  background:rgba(10,25,41,0.98);border:1px solid var(--border);
  border-radius:20px;padding:6px 10px;gap:6px;z-index:60;backdrop-filter:blur(12px);
}
.reaction-bar.show{display:flex;}
.msg.mine .reaction-bar{left:auto;right:0;}
.react-emoji{font-size:18px;cursor:pointer;transition:transform 0.15s;padding:2px;}
.react-emoji:hover{transform:scale(1.4);}

/* ── TYPING INDICATOR ── */
.typing-indicator{
  display:none;padding:4px 14px 0;
  font-family:'Share Tech Mono',monospace;font-size:9px;
  color:rgba(255,255,255,0.3);letter-spacing:1px;
  flex-shrink:0;
}
.typing-indicator.show{display:block;}
.typing-dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle;}
.typing-dots span{
  width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.3);
  animation:tdot 1.4s infinite;display:inline-block;
}
.typing-dots span:nth-child(2){animation-delay:0.2s;}
.typing-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes tdot{0%,80%,100%{opacity:0.3}40%{opacity:1}}

/* ── INPUT AREA — KEY FIX ──
   flex-shrink:0 ensures it's always visible
   No fixed/absolute positioning — stays in flex flow      */
.input-wrap{
  background:rgba(2,6,8,0.97);
  border-top:1px solid var(--border);
  padding:10px 14px;
  /* safe area for iPhone bottom bar */
  padding-bottom:max(10px, env(safe-area-inset-bottom));
  flex-shrink:0;
  z-index:50;
  position:relative;
  box-shadow:0 -2px 12px rgba(0,0,0,0.3);
}
.preview-strip{display:none;padding:0 0 8px;gap:8px;overflow-x:auto;scrollbar-width:none;}
.preview-strip.show{display:flex;}
.preview-strip::-webkit-scrollbar{display:none;}
.preview-thumb{position:relative;flex-shrink:0;}
.preview-thumb img{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--border);display:block;}
.preview-remove{
  position:absolute;top:-5px;right:-5px;background:var(--black);
  border:1px solid var(--border);border-radius:50%;width:16px;height:16px;
  display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;color:var(--gold-dim);
}

.input-row{display:flex;gap:8px;align-items:flex-end;}
.attach-btn{
  background:rgba(201,168,76,0.06);border:1px solid var(--border);border-radius:10px;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:17px;color:var(--gold-dim);transition:all 0.2s;flex-shrink:0;
}
.attach-btn:hover,.attach-btn:active{border-color:var(--gold);color:var(--gold);}

.msg-input{
  flex:1;
  background:rgba(10,25,41,0.9);
  border:1.5px solid var(--border-teal);
  border-radius:12px;
  padding:11px 14px;
  font-family:'Rajdhani',sans-serif;
  font-size:16px;
  color:#fff;
  outline:none;
  resize:none;
  max-height:130px;
  min-height:44px;
  transition:border-color 0.2s, box-shadow 0.2s;
  line-height:1.4;
  -webkit-appearance:none;  /* removes iOS default styling */
}
.msg-input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(0,229,204,0.1);
}
.msg-input::placeholder{color:rgba(255,255,255,0.2);}

.send-btn{
  background:linear-gradient(135deg,var(--gold-dim),var(--gold));
  border:none;border-radius:12px;
  width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;color:var(--black);
  flex-shrink:0;transition:all 0.2s;
  box-shadow:0 2px 10px rgba(201,168,76,0.25);
}
.send-btn:hover{background:linear-gradient(135deg,var(--gold),var(--gold-light));box-shadow:0 0 18px rgba(201,168,76,0.45);}
.send-btn:active{transform:scale(0.93);}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;}

/* ── BOTTOM NAV — with safe area ── */
.bottom-nav{
  background:rgba(2,6,8,0.98);border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;z-index:50;
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 11px;gap:4px;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent;}
.nav-item.active{border-top-color:var(--gold);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:1px;}
.nav-item.active .nav-label{color:var(--gold);}

/* ── LIGHTBOX ── */
.lightbox{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.95);backdrop-filter:blur(8px);align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:90vw;max-height:85vh;border-radius:8px;object-fit:contain;}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(10,25,41,0.8);border:1px solid var(--border);color:var(--gold);font-size:18px;padding:6px 12px;border-radius:4px;cursor:pointer;}

/* ── IN-APP CONFIRM (no browser confirm()) ── */
.confirm-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(2,6,8,0.92);backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:24px;}
.confirm-overlay.show{display:flex;}
.confirm-box{width:100%;max-width:300px;background:rgba(10,25,41,0.98);border:1px solid rgba(255,59,59,0.3);border-radius:12px;padding:28px 22px;text-align:center;}
.confirm-box::before{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:-28px -22px 20px;}
.confirm-icon{font-size:36px;margin-bottom:12px;}
.confirm-title{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--red);letter-spacing:2px;margin-bottom:8px;}
.confirm-msg{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:1px;line-height:1.8;margin-bottom:20px;}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.confirm-no{padding:11px;background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:4px;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold);letter-spacing:2px;cursor:pointer;}
.confirm-yes{padding:11px;background:rgba(255,59,59,0.12);border:1px solid rgba(255,59,59,0.4);border-radius:4px;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--red);letter-spacing:2px;cursor:pointer;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="top-logo">
    <img src="../logo.png" alt="M.O.G." onerror="this.onerror=null;this.src='../assets/images/logo.png'">
  </div>
  <div class="top-brand">
    <div class="top-brand-name">MINISTRY OF GROOVE</div>
    <div class="top-brand-slogan">DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID</div>
  </div>
  <div class="online-badge"><div class="pulse"></div><span id="onlineCount">— ONLINE</span></div>
</div>

<!-- DIRECTOR TOOLBAR -->
<div class="director-toolbar" id="directorToolbar">
  <button class="dir-btn" onclick="dirAnnounce()">📣 BROADCAST</button>
  <button class="dir-btn" onclick="dirPin()">📌 PIN LAST</button>
  <button class="dir-btn danger" onclick="showClearConfirm()">🗑️ CLEAR ROOM</button>
</div>

<!-- ROOM TABS -->
<div class="rooms-bar">
  <button class="room-tab active" onclick="switchRoom('general',this)">💬 GENERAL HQ</button>
  <button class="room-tab" onclick="switchRoom('session01',this)">🎬 SESSION 01</button>
  <button class="room-tab" onclick="switchRoom('session02',this)">🎬 SESSION 02</button>
  <button class="room-tab" onclick="switchRoom('amapiano',this)">🎵 AMAPIANO</button>
  <button class="room-tab vip-tab" id="vipTab" onclick="switchRoom('vip',this)">👑 VIP</button>
</div>

<!-- CHAT BODY: messages + typing + input all in one flex container -->
<div class="chat-body">

  <div class="messages-wrap" id="msgWrap"></div>

  <div class="typing-indicator" id="typingIndicator">
    <span id="typingText">Someone is typing</span>
    <span class="typing-dots"><span></span><span></span><span></span></span>
  </div>

  <!-- INPUT — lives inside chat-body, never hidden -->
  <div class="input-wrap" id="inputWrap">
    <div class="preview-strip" id="previewStrip"></div>
    <div class="input-row">
      <button class="attach-btn" onclick="document.getElementById('imgUpload').click()" title="Attach image">📎</button>
      <input type="file" id="imgUpload" accept="image/*" style="display:none" onchange="handleImageAttach(this)">
      <textarea
        class="msg-input"
        id="msgInput"
        placeholder="TRANSMIT MESSAGE..."
        rows="1"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
        spellcheck="false"
        oninput="autoResize(this);handleTyping()"
        onkeydown="handleKeydown(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">➤</button>
    </div>
  </div>

</div><!-- /chat-body -->

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>
  <a href="gallery.html"  class="nav-item"><div class="nav-icon">🎬</div><div class="nav-label">GALLERY</div></a>
  <a href="frequency.html" class="nav-item"><div class="nav-icon">📡</div><div class="nav-label">LIVE</div></a>
  <a href="dispatch.html" class="nav-item active"><div class="nav-icon">💬</div><div class="nav-label">CHAT</div></a>
  <a href="dossier.html"  class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></a>
</nav>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<!-- IN-APP CONFIRM -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title">CLEAR ROOM?</div>
    <div class="confirm-msg" id="confirmMsg">DELETE ALL MESSAGES?</div>
    <div class="confirm-btns">
      <button class="confirm-no"  onclick="hideConfirm()">CANCEL</button>
      <button class="confirm-yes" onclick="execClear()">CLEAR</button>
    </div>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// IDENTITY
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const DIRECTOR_EMAIL = 'director.mog@gmail.com';
const myName     = (localStorage.getItem('mogUser')   || 'OPERATIVE').toUpperCase();
const myEmail    = localStorage.getItem('mogEmail')   || '';
const myRank     = localStorage.getItem('mogRank')    || 'RECRUIT';
const myAvatar   = localStorage.getItem('mogAvatar')  || null;
const myId       = localStorage.getItem('mogUserId')  || ('local-' + Math.random().toString(36).substr(2,8));
const myInitials = myName.substring(0, 2);
const isDirector = myEmail.toLowerCase() === DIRECTOR_EMAIL.toLowerCase() || myRank === 'ADMIN';

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// ROOM DEFINITIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const ROOM_DEFS = {
  general:  { name:'GENERAL HQ',          icon:'💬', restricted:false },
  session01:{ name:'SESSION 01 DEBRIEF',   icon:'🎬', restricted:false },
  session02:{ name:'SESSION 02 DEBRIEF',   icon:'🎬', restricted:false },
  amapiano: { name:'AMAPIANO INTEL',       icon:'🎵', restricted:false },
  vip:      { name:'VIP — DIRECTORS ONLY', icon:'👑', restricted:true  },
};

let currentRoom   = 'general';
let pendingImage  = null;
let typingTimer   = null;
let realtimeChannel = null;
let msgIdCounter  = 0;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PERSISTENCE — localStorage per room
// Messages persist until user explicitly deletes them.
// Format key: mog_chat_{room}
// Value: JSON array of message objects
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function storageKey(room){ return 'mog_chat_' + room; }

function loadStoredMessages(room){
  try{
    const raw = localStorage.getItem(storageKey(room));
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}

function saveMessages(room, msgs){
  try{
    // Keep last 200 messages per room to avoid storage limits
    const toSave = msgs.slice(-200);
    localStorage.setItem(storageKey(room), JSON.stringify(toSave));
  } catch(e){
    // Storage full — trim and retry
    try{
      const toSave = msgs.slice(-50);
      localStorage.setItem(storageKey(room), JSON.stringify(toSave));
    } catch(e2){}
  }
}

function appendMessage(room, msg){
  const msgs = loadStoredMessages(room);
  // Avoid duplicates by dbId
  if(msg.dbId && msgs.some(m => m.dbId === msg.dbId)) return;
  msgs.push(msg);
  saveMessages(room, msgs);
}

function clearStoredMessages(room){
  localStorage.removeItem(storageKey(room));
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function init(){
  // Show director toolbar & VIP tab
  if(isDirector){
    document.getElementById('directorToolbar').classList.add('show');
    document.getElementById('vipTab').classList.add('visible');
  }

  // Online count
  document.getElementById('onlineCount').textContent =
    Math.floor(Math.random()*18+3) + ' ONLINE';

  // Render stored messages then sync from Supabase
  renderRoom(currentRoom);
  syncFromSupabase(currentRoom);
  connectRealtime(currentRoom);

  // Focus input on load (after a tick to avoid mobile keyboard popup)
  setTimeout(()=>{
    const inp = document.getElementById('msgInput');
    if(inp) inp.focus({ preventScroll:true });
  }, 400);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER ROOM FROM localStorage
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderRoom(room){
  const def  = ROOM_DEFS[room];
  const msgs = loadStoredMessages(room);
  const wrap = document.getElementById('msgWrap');

  let html = `
    <div style="display:flex;justify-content:center;margin-bottom:8px;">
      <div class="room-header-label">${def.icon} ${def.name}</div>
    </div>
    <div class="sys-msg">🔐 OPERATIVE EYES ONLY · END-TO-END ENCRYPTED</div>`;

  if(msgs.length === 0){
    html += `<div class="sys-msg" style="margin-top:40px;opacity:0.3;">
      NO TRANSMISSIONS YET<br>
      <span style="font-size:8px;opacity:0.6">START THE CONVERSATION, OPERATIVE</span>
    </div>`;
  } else {
    let lastDate = '';
    msgs.forEach(m => {
      const msgDate = m.date || '';
      if(msgDate && msgDate !== lastDate){
        lastDate = msgDate;
        html += `<div class="date-divider">${msgDate}</div>`;
      }
      html += renderMsgHTML(m);
    });
  }

  wrap.innerHTML = html;
  scrollToBottom();
}

function scrollToBottom(){
  const wrap = document.getElementById('msgWrap');
  if(wrap) setTimeout(()=>{ wrap.scrollTop = wrap.scrollHeight; }, 50);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// RENDER SINGLE MESSAGE HTML
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function renderMsgHTML(m){
  if(m.type === 'announce'){
    return `<div class="director-announce">
      <div class="da-label">📣 DIRECTORATE BROADCAST</div>
      <div class="da-text">${esc(m.text)}</div>
      <div class="da-time">${m.t || ''}</div>
    </div>`;
  }

  const avatarContent = m.avatar
    ? `<img src="${m.avatar}" alt="${esc(m.u)}" onerror="this.outerHTML='${esc(m.initials||'OP')}';">`
    : (m.initials || 'OP');

  const reactHtml = (m.reactions && Object.keys(m.reactions).length)
    ? `<div class="reactions">${Object.entries(m.reactions).map(([e,c])=>
        `<span class="reaction-pill ${(m.myReacts||[]).includes(e)?'reacted':''}"
          onclick="toggleReaction('${m.id}','${e}')">${e} ${c}</span>`
      ).join('')}</div>` : '';

  const isMine = m.mine || m.userId === myId;
  const isDir  = m.isDirector || false;
  const bubbleCls = isDir && !isMine ? 'director-bubble' : '';

  const content = m.type === 'image'
    ? `<div class="bubble-img" onclick="openLightbox('${m.imageUrl}')"><img src="${m.imageUrl}" alt="img" loading="lazy"></div>`
    : `<div class="bubble ${bubbleCls}" style="position:relative;">
        ${esc(m.text)}
        <div class="reaction-bar" id="rbar-${m.id}">
          ${['❤️','🔥','🎵','💃','😂','👑','🙌','💯'].map(e=>
            `<span class="react-emoji" onclick="addReaction('${m.id}','${e}')">${e}</span>`
          ).join('')}
        </div>
       </div>`;

  return `
  <div class="msg ${isMine?'mine':''} ${isDir?'director-msg':''}"
    data-id="${m.id}"
    ontouchstart="startLongPress('${m.id}')"
    ontouchend="cancelLongPress()"
    oncontextmenu="showReactions('${m.id}');return false;">
    <div class="msg-avatar ${isDir&&!isMine?'is-director':''} ${isMine?'is-mine':''}">${avatarContent}</div>
    <div class="msg-body">
      <span class="msg-name">${esc(m.u)}${isDir&&!isMine?' 👑':''}</span>
      ${content}
      <div class="msg-footer">
        <span class="msg-time">${m.t||''}</span>
        ${isMine ? `<span class="msg-tick ${m.read?'read':''}">✓${m.read?'✓':''}</span>` : ''}
      </div>
      ${reactHtml}
    </div>
  </div>`;
}

// Append one new message DOM node (faster than full re-render)
function appendMsgToDOM(m){
  const wrap = document.getElementById('msgWrap');
  // Remove empty state if present
  const sys = wrap.querySelector('.sys-msg[style*="margin-top"]');
  if(sys) sys.remove();
  const div = document.createElement('div');
  div.innerHTML = renderMsgHTML(m).trim();
  const node = div.firstElementChild;
  if(node) wrap.appendChild(node);
  scrollToBottom();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SUPABASE SYNC — load existing messages from DB
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function syncFromSupabase(room){
  if(typeof sb === 'undefined') return;
  try{
    const { data } = await sb
      .from('messages')
      .select('*, profiles(username, avatar_url, rank, email)')
      .eq('room', room)
      .eq('deleted', false)
      .order('created_at', { ascending:true })
      .limit(100);

    if(!data || data.length === 0) return;

    const stored = loadStoredMessages(room);
    const storedDbIds = new Set(stored.map(m => m.dbId).filter(Boolean));
    let added = false;

    data.forEach(row => {
      if(storedDbIds.has(row.id)) return; // already have it
      const p    = row.profiles || {};
      const isMe = row.user_id === myId || row.user_id === localStorage.getItem('mogUserId');
      const isDir= p.rank === 'ADMIN' || (p.email||'').toLowerCase() === DIRECTOR_EMAIL.toLowerCase();
      const now  = new Date(row.created_at);
      const msg = {
        id:          'db-' + row.id,
        dbId:        row.id,
        u:           p.username || 'OPERATIVE',
        initials:    (p.username||'OP').substring(0,2).toUpperCase(),
        avatar:      p.avatar_url || null,
        type:        'text',
        text:        row.content,
        t:           now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),
        date:        now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}),
        mine:        isMe,
        userId:      row.user_id,
        isDirector:  isDir,
        reactions:   {},
        myReacts:    [],
        read:        true
      };
      appendMessage(room, msg);
      added = true;
    });

    if(added) renderRoom(room);
  } catch(e){
    console.warn('[MOG Dispatch] Sync error:', e.message);
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SUPABASE REALTIME — live new messages from other users
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function connectRealtime(room){
  if(typeof sb === 'undefined') return;
  if(realtimeChannel) sb.removeChannel(realtimeChannel);

  realtimeChannel = sb.channel('dispatch-' + room)
    .on('postgres_changes',{
      event:'INSERT', schema:'public', table:'messages',
      filter:'room=eq.' + room
    }, async payload => {
      const row = payload.new;
      // Don't re-add our own messages (already added optimistically)
      if(row.user_id === localStorage.getItem('mogUserId')) return;
      // Fetch sender profile
      let p = {};
      try{
        const {data} = await sb.from('profiles').select('username,avatar_url,rank,email').eq('id',row.user_id).single();
        if(data) p = data;
      } catch(e){}
      const isDir = p.rank==='ADMIN'||(p.email||'').toLowerCase()===DIRECTOR_EMAIL.toLowerCase();
      const now = new Date(row.created_at||Date.now());
      const msg = {
        id:         'db-' + row.id,
        dbId:       row.id,
        u:          p.username || 'OPERATIVE',
        initials:   (p.username||'OP').substring(0,2).toUpperCase(),
        avatar:     p.avatar_url || null,
        type:       'text',
        text:       row.content,
        t:          now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),
        date:       now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}),
        mine:       false,
        userId:     row.user_id,
        isDirector: isDir,
        reactions:  {},
        myReacts:   [],
        read:       false
      };
      appendMessage(room, msg);
      appendMsgToDOM(msg);
      // Mark unread on other room tabs
      if(room !== currentRoom) markTabUnread(room);
    })
    // Typing presence
    .on('presence',{ event:'sync' }, () => {
      try{
        const state = realtimeChannel.presenceState();
        const typing = Object.values(state).flat()
          .filter(p => p.typing && p.user !== myName)
          .map(p => p.user);
        const el = document.getElementById('typingIndicator');
        if(typing.length > 0){
          document.getElementById('typingText').textContent =
            typing.slice(0,2).join(', ') + (typing.length>1?' are':' is') + ' typing';
          el.classList.add('show');
        } else {
          el.classList.remove('show');
        }
      } catch(e){}
    })
    .subscribe();
}

function markTabUnread(room){
  const tabs = document.querySelectorAll('.room-tab');
  tabs.forEach(t => {
    if(t.textContent.toLowerCase().includes(room.replace(/\d+/,'').trim()) &&
       !t.querySelector('.unread-dot')){
      const dot = document.createElement('span');
      dot.className = 'unread-dot';
      t.appendChild(dot);
    }
  });
  }

  
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SWITCH ROOM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function switchRoom(room, btn){
  if(ROOM_DEFS[room]?.restricted && !isDirector){
    showToast('⚠ VIP ROOM — DIRECTOR ACCESS ONLY');
    return;
  }
  currentRoom = room;
  document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  // Remove unread dot
  const dot = btn.querySelector('.unread-dot');
  if(dot) dot.remove();
  renderRoom(room);
  syncFromSupabase(room);
  connectRealtime(room);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SEND MESSAGE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function send(){
  const input = document.getElementById('msgInput');
  const text  = input.value.trim();
  if(!text && !pendingImage) return;

  const now  = new Date();
  const t    = now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});
  const date = now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});
  const id   = 'local-' + (++msgIdCounter) + '-' + Date.now();

  // Handle image message
  if(pendingImage){
    const imgMsg = {
      id, u:myName, initials:myInitials, avatar:myAvatar,
      type:'image', imageUrl:pendingImage, t, date,
      mine:true, userId:myId, isDirector, reactions:{}, myReacts:[], read:false
    };
    appendMessage(currentRoom, imgMsg);
    appendMsgToDOM(imgMsg);
    clearImagePreview();
  }

  // Handle text message
  if(text){
    input.value = '';
    input.style.height = '44px';

    const msg = {
      id, u:myName, initials:myInitials, avatar:myAvatar,
      type:'text', text, t, date,
      mine:true, userId:myId, isDirector, reactions:{}, myReacts:[], read:false
    };

    // Save locally immediately (persists regardless of network/login)
    appendMessage(currentRoom, msg);
    appendMsgToDOM(msg);

    // Disable send briefly to prevent double-send
    const sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;
    setTimeout(()=>{ sendBtn.disabled = false; }, 500);

    // Send to Supabase
    if(typeof sb !== 'undefined'){
      try{
        const {data:{session}} = await sb.auth.getSession();
        if(session){
          const {data:inserted, error} = await sb.from('messages').insert({
            room:    currentRoom,
            content: text,
            user_id: session.user.id
          }).select().single();

          if(!error && inserted){
            // Update local record with real DB id
            const msgs = loadStoredMessages(currentRoom);
            const idx  = msgs.findIndex(m => m.id === id);
            if(idx !== -1){
              msgs[idx].dbId = inserted.id;
              msgs[idx].read = true;
              saveMessages(currentRoom, msgs);
            }
            // Update tick mark in DOM
            const tickEl = document.querySelector(`[data-id="${id}"] .msg-tick`);
            if(tickEl){ tickEl.classList.add('read'); tickEl.textContent = '✓✓'; }
          }
        }
      } catch(e){ console.warn('[MOG] Send to Supabase failed:', e.message); }
      // Stop typing indicator
      try{
        if(realtimeChannel) realtimeChannel.track({ user:myName, typing:false });
      } catch(e){}
    }
  }

  input.focus();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// KEYBOARD HANDLER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function handleKeydown(e){
  // Desktop: Enter sends, Shift+Enter = newline
  // Mobile: never intercept Enter (let keyboard handle it naturally)
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if(!isMobile && e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// IMAGE ATTACH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function handleImageAttach(input){
  if(!input.files || !input.files[0]) return;
  const file = input.files[0];
  if(file.size > 5*1024*1024){ showToast('⚠ IMAGE MUST BE UNDER 5MB'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    pendingImage = e.target.result;
    const strip = document.getElementById('previewStrip');
    strip.innerHTML = `<div class="preview-thumb">
      <img src="${pendingImage}" alt="preview">
      <span class="preview-remove" onclick="clearImagePreview()">✕</span>
    </div>`;
    strip.classList.add('show');
  };
  reader.readAsDataURL(file);
}
function clearImagePreview(){
  pendingImage = null;
  const s = document.getElementById('previewStrip');
  s.innerHTML = ''; s.classList.remove('show');
  document.getElementById('imgUpload').value = '';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// AUTO RESIZE TEXTAREA
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function autoResize(el){
  el.style.height = '44px';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TYPING INDICATOR
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function handleTyping(){
  if(typeof sb === 'undefined' || !realtimeChannel) return;
  try{
    realtimeChannel.track({ user:myName, typing:true });
    clearTimeout(typingTimer);
    typingTimer = setTimeout(()=>{
      realtimeChannel.track({ user:myName, typing:false });
    }, 2500);
  } catch(e){}
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// REACTIONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showReactions(id){
  document.querySelectorAll('.reaction-bar').forEach(b => b.classList.remove('show'));
  const bar = document.getElementById('rbar-' + id);
  if(bar) bar.classList.add('show');
}
function addReaction(msgId, emoji){
  document.querySelectorAll('.reaction-bar').forEach(b => b.classList.remove('show'));
  toggleReaction(msgId, emoji);
}
function toggleReaction(msgId, emoji){
  const msgs = loadStoredMessages(currentRoom);
  const msg  = msgs.find(m => m.id === msgId);
  if(!msg) return;
  if(!msg.reactions) msg.reactions = {};
  if(!msg.myReacts)  msg.myReacts  = [];
  if(msg.myReacts.includes(emoji)){
    msg.myReacts = msg.myReacts.filter(e => e !== emoji);
    msg.reactions[emoji] = Math.max((msg.reactions[emoji]||1)-1, 0);
    if(msg.reactions[emoji] === 0) delete msg.reactions[emoji];
  } else {
    msg.myReacts.push(emoji);
    msg.reactions[emoji] = (msg.reactions[emoji]||0) + 1;
  }
  saveMessages(currentRoom, msgs);
  renderRoom(currentRoom); // re-render to show updated reactions
}
let longPressTimer;
function startLongPress(id){ longPressTimer = setTimeout(()=>showReactions(id), 500); }
function cancelLongPress(){ clearTimeout(longPressTimer); }

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// DIRECTOR CONTROLS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
async function dirAnnounce(){
  const text = prompt('📣 BROADCAST TO THIS ROOM:');
  if(!text || !text.trim()) return;
  const now = new Date();
  const msg = {
    id:       'ann-'+Date.now(),
    type:     'announce',
    text:     text.trim(),
    u:        'DIRECTORATE',
    initials: 'D',
    t:        now.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'}),
    date:     now.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}),
    mine:     false,
    isDirector:true
  };
  appendMessage(currentRoom, msg);
  appendMsgToDOM(msg);
  // Also save to Supabase as a regular message
  if(typeof sb !== 'undefined'){
    const {data:{session}} = await sb.auth.getSession().catch(()=>({data:{session:null}}));
    if(session) await sb.from('messages').insert({
      room:     currentRoom,
      content:  '[BROADCAST] ' + text.trim(),
      user_id:  session.user.id,
      is_pinned:true
    }).catch(()=>{});
  }
}

function dirPin(){
  const msgs = loadStoredMessages(currentRoom);
  if(!msgs.length){ showToast('NO MESSAGES TO PIN'); return; }
  const last = msgs[msgs.length-1];
  showToast('📌 PINNED: ' + (last.text||'IMAGE').substring(0,30));
}

let clearConfirmCallback = null;
function showClearConfirm(){
  document.getElementById('confirmMsg').textContent =
    'DELETE ALL MESSAGES IN ' + ROOM_DEFS[currentRoom].name + '?';
  document.getElementById('confirmOverlay').classList.add('show');
}
function hideConfirm(){
  document.getElementById('confirmOverlay').classList.remove('show');
}
function execClear(){
  hideConfirm();
  clearStoredMessages(currentRoom);
  if(typeof sb !== 'undefined'){
    sb.from('messages').update({deleted:true}).eq('room',currentRoom).catch(()=>{});
  }
  renderRoom(currentRoom);
  showToast('✓ ROOM CLEARED');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// LIGHTBOX
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showToast(msg, dur=2800){
  let el = document.getElementById('mog-dispatch-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'mog-dispatch-toast';
    el.style.cssText = [
      'position:fixed','bottom:100px','left:50%','transform:translateX(-50%)',
      'background:rgba(10,25,41,0.97)','border:1px solid rgba(0,229,204,0.35)',
      'border-radius:8px','padding:10px 20px','font-family:Orbitron,sans-serif',
      'font-size:9px','color:#00E5CC','letter-spacing:2px','z-index:999',
      'white-space:nowrap','backdrop-filter:blur(12px)','display:none',
      'box-shadow:0 0 16px rgba(0,229,204,0.15)'
    ].join(';');
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.display='none'; }, dur);
  }

  // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// UTILITIES
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Close reaction bars on outside tap
document.addEventListener('click', e => {
  if(!e.target.closest('.reaction-bar') && !e.target.closest('.msg'))
    document.querySelectorAll('.reaction-bar').forEach(b => b.classList.remove('show'));
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// KEYBOARD PUSH — scroll to bottom when keyboard opens
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    // When keyboard opens the viewport shrinks — scroll to bottom
    scrollToBottom();
  });
}
