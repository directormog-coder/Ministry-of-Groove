<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050A0E">
<title>M.O.G. — Dispatch</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;--teal:#00E5CC;--teal-dim:#009E8E;--black:#050A0E;--navy:#0D1F2D;--panel:rgba(13,31,45,0.9);--border:rgba(201,168,76,0.25);--border-teal:rgba(0,229,204,0.2);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--black);font-family:'Rajdhani',sans-serif;color:#fff;display:flex;flex-direction:column;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);}

/* TOP BAR */
.top-bar{background:rgba(5,10,14,0.97);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;backdrop-filter:blur(10px);flex-shrink:0;z-index:10;position:relative;}
.back-btn{color:var(--gold);font-size:22px;text-decoration:none;padding:4px;line-height:1;transition:color 0.2s;}
.back-btn:hover{color:var(--gold-light);}
.top-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:3px;flex:1;text-align:center;}
.online-count{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal);letter-spacing:1px;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}

/* ROOM TABS */
.rooms-bar{background:rgba(13,31,45,0.6);border-bottom:1px solid var(--border-teal);padding:0 16px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex-shrink:0;z-index:9;position:relative;}
.rooms-bar::-webkit-scrollbar{display:none;}
.room-tab{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;padding:12px 14px;color:var(--gold-dim);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all 0.2s;flex-shrink:0;position:relative;background:none;border-top:none;border-left:none;border-right:none;}
.room-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.room-tab:hover:not(.active){color:var(--gold-light);}
.unread{background:var(--teal);color:var(--black);font-size:8px;padding:1px 5px;border-radius:8px;margin-left:5px;font-weight:700;display:inline-block;}

/* MESSAGES */
.messages-wrap{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1;}
.messages-wrap::-webkit-scrollbar{width:3px;}
.messages-wrap::-webkit-scrollbar-thumb{background:var(--border);}
.room-header-label{text-align:center;padding:6px;font-family:'Orbitron',sans-serif;font-size:9px;color:var(--gold-dim);letter-spacing:3px;border:1px solid var(--border);padding:6px 16px;border-radius:2px;display:inline-block;align-self:center;}
.sys-msg{text-align:center;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:2px;padding:4px;}

/* MSG BUBBLES */
.msg{display:flex;gap:10px;max-width:88%;}
.msg.mine{flex-direction:row-reverse;align-self:flex-end;}
.msg-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--gold);flex-shrink:0;align-self:flex-end;}
.msg-avatar.directorate{border-color:var(--teal);color:var(--teal);}
.msg-body{display:flex;flex-direction:column;gap:3px;}
.msg-name{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:1px;}
.msg.mine .msg-name{text-align:right;color:var(--gold-dim);}
.bubble{background:var(--panel);border:1px solid var(--border);border-radius:10px;border-bottom-left-radius:2px;padding:10px 14px;font-size:14px;font-weight:500;color:#ddd;line-height:1.4;word-break:break-word;}
.msg.mine .bubble{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.35);border-bottom-right-radius:2px;border-bottom-left-radius:10px;}
.bubble.directorate-bubble{background:rgba(0,229,204,0.05);border-color:rgba(0,229,204,0.3);}
.msg-time{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.22);letter-spacing:1px;}
.msg.mine .msg-time{text-align:right;}

/* INPUT */
.input-wrap{background:rgba(5,10,14,0.97);border-top:1px solid var(--border);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;flex-shrink:0;z-index:10;position:relative;}
.msg-input{flex:1;background:rgba(13,31,45,0.8);border:1px solid var(--border-teal);border-radius:8px;padding:11px 14px;font-family:'Rajdhani',sans-serif;font-size:15px;color:#fff;outline:none;resize:none;max-height:120px;min-height:44px;transition:border 0.2s;}
.msg-input:focus{border-color:var(--teal);}
.msg-input::placeholder{color:rgba(255,255,255,0.2);}
.send-btn{background:var(--gold);border:none;border-radius:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;transition:all 0.2s;flex-shrink:0;color:var(--black);}
.send-btn:hover{background:var(--gold-light);box-shadow:0 0 16px rgba(201,168,76,0.4);}
.send-btn:active{transform:scale(0.95);}

/* BOTTOM NAV */
.bottom-nav{background:rgba(5,10,14,0.98);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;z-index:10;position:relative;}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;gap:4px;cursor:pointer;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent;}
.nav-item.active{border-top-color:var(--gold);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:1px;}
.nav-item.active .nav-label{color:var(--gold);}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="top-title">DISPATCH</div>
  <div class="online-count"><div class="dot"></div><span id="onlineCount">12 ONLINE</span></div>
</div>

<div class="rooms-bar">
  <button class="room-tab active" onclick="switchRoom('general',this)">GENERAL HQ</button>
  <button class="room-tab" onclick="switchRoom('session01',this)">SESSION 01 <span class="unread">3</span></button>
  <button class="room-tab" onclick="switchRoom('session02',this)">SESSION 02</button>
  <button class="room-tab" onclick="switchRoom('amapiano',this)">AMAPIANO INTEL</button>
</div>

<div class="messages-wrap" id="msgWrap"></div>

<div class="input-wrap">
  <textarea class="msg-input" id="msgInput" placeholder="TRANSMIT MESSAGE..." rows="1"
    oninput="autoResize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
  <button class="send-btn" onclick="send()">➤</button>
</div>

<div class="bottom-nav">
  <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>
  <a href="gallery.html" class="nav-item"><div class="nav-icon">🎬</div><div class="nav-label">GALLERY</div></a>
  <a href="frequency.html" class="nav-item"><div class="nav-icon">📡</div><div class="nav-label">LIVE</div></a>
  <a href="dispatch.html" class="nav-item active"><div class="nav-icon">💬</div><div class="nav-label">CHAT</div></a>
  <a href="dossier.html" class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></a>
</div>

<script>
const myName=(sessionStorage.getItem('mogUser')||'OPERATIVE').substring(0,12);

// Rooms start empty — messages load from Supabase in production
// Wire up: sb.from('messages').select('*').eq('room',key).order('created_at')
const rooms={
  general:  {name:'GENERAL HQ',       msgs:[]},
  session01:{name:'SESSION 01 DEBRIEF',msgs:[]},
  session02:{name:'SESSION 02 DEBRIEF',msgs:[]},
  amapiano: {name:'AMAPIANO INTEL',    msgs:[]},
};

let current='general';

function renderMsgs(key){
  const room=rooms[key];
  const wrap=document.getElementById('msgWrap');
  wrap.innerHTML=`
    <div style="display:flex;justify-content:center;margin-bottom:6px;">
      <div class="room-header-label">// ${room.name} //</div>
    </div>
    <div class="sys-msg">🔐 END-TO-END ENCRYPTED</div>
    ${room.msgs.length===0
      ? `<div class="sys-msg" style="margin-top:40px;opacity:0.4">NO TRANSMISSIONS YET — BE THE FIRST TO BROADCAST</div>`
      : room.msgs.map(m=>`
      <div class="msg ${m.mine?'mine':''}">
        <div class="msg-avatar ${m.dir?'directorate':''}">${m.ini}</div>
        <div class="msg-body">
          <div class="msg-name">${m.u}</div>
          <div class="bubble ${m.dir?'directorate-bubble':''}">${m.text}</div>
          <div class="msg-time">${m.t}</div>
        </div>
      </div>
    `).join('')}
  `;
  wrap.scrollTop=wrap.scrollHeight;
}

function switchRoom(key,btn){
  current=key;
  document.querySelectorAll('.room-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const badge=btn.querySelector('.unread');
  if(badge)badge.remove();
  renderMsgs(key);
}

function send(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text)return;
  const now=new Date();
  const t=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  rooms[current].msgs.push({u:myName,ini:myName.substring(0,2),text,t,mine:true});
  input.value='';input.style.height='44px';
  renderMsgs(current);
}

function autoResize(el){
  el.style.height='44px';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

// Random online count
document.getElementById('onlineCount').textContent=Math.floor(Math.random()*20+8)+' ONLINE';

renderMsgs('general');
</script>
</body>
</html>
