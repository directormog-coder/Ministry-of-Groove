<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | DISPATCH ARCHIVE</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-gold { background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px); background-size: 35px 35px; }
        .glass-gold-dispatch { background: rgba(10, 10, 15, 0.98); backdrop-filter: blur(40px); border: 1px solid rgba(212, 175, 55, 0.2); }
        
        /* ALERT BEACON */
        .beacon { width: 10px; height: 10px; background: var(--gold); border-radius: 50%; position: relative; }
        .beacon::after { content: ''; position: absolute; inset: -5px; border: 2px solid var(--gold); border-radius: 50%; animation: ring 1.5s infinite; }
        @keyframes ring { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }

        .loader-gold { width: 35px; height: 35px; border: 4px solid var(--gold); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .directive-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-left: 4px solid transparent; }
        .directive-card:hover { border-left-color: var(--gold); background: rgba(212, 175, 55, 0.05); transform: scale(1.02); }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0iugiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function dispatchEngine() {
            return {
                view: 'gate',
                directives: [],
                isDirector: false,
                status: 'MONITORING',

                async init() {
                    // 1. Security Gate Verification
                    const role = localStorage.getItem('userRole');
                    if (!role) {
                        window.location.href = '../login.html';
                        return;
                    }

                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (!session) {
                        window.location.href = '../index.html';
                        return;
                    }

                    this.isDirector = role === 'director';
                    this.view = 'active';
                    this.loadDirectives();
                    this.subscribeToDirectives();
                    this.$nextTick(() => lucide.createIcons());
                },

                async loadDirectives() {
                    const { data } = await sb.from('broadcasts').select('*').order('created_at', { ascending: false });
                    if (data) this.directives = data;
                },

                subscribeToDirectives() {
                    sb.channel('public:broadcasts').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'broadcasts' }, () => {
                        this.loadDirectives();
                        this.status = 'NEW DIRECTIVE INCOMING';
                        setTimeout(() => this.status = 'MONITORING', 5000);
                    }).subscribe();
                },

                async acknowledge(id) {
                    alert('DIRECTIVE ACKNOWLEDGED. LOGGED TO OPERATIVE PROFILE.');
                }
            }
        }
    </script>
</head>
<body x-data="dispatchEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-gold/30">

    <div class="bg-circuit-pattern"></div>
    <div class="bg-grid-gold fixed inset-0 z-0 opacity-10"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <div class="loader-gold"></div>
            <p class="terminal-font text-[11px] text-gold animate-pulse uppercase tracking-[0.5em]">Decrypting Tactical Feed...</p>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-5xl mx-auto p-6 md:p-12 z-10 relative animate-fade-in">
            
            <header class="p-8 glass-gold-dispatch rounded-[2.5rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl">
                <div class="flex items-center gap-6">
                    <button onclick="window.location.href='../index.html'" class="p-4 bg-white/5 rounded-2xl border border-white/10 hover:border-gold transition-all group">
                        <i data-lucide="chevron-left" class="text-gold group-hover:scale-110"></i>
                    </button>
                    <div class="flex items-center gap-4">
                        <img src="../assets/images/logo.png" alt="MOG Logo" class="w-10 h-10">
                        <div>
                            <h1 class="text-3xl font-black uppercase italic tracking-tighter text-gold leading-none">Dispatch Log</h1>
                            <p class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-2 italic">Sector 7G Directives</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-6 bg-gold/5 px-6 py-3 rounded-full border border-gold/20">
                    <div class="beacon"></div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-gold" x-text="'System: ' + status"></p>
                </div>
            </header>

            <div class="grid grid-cols-1 gap-12">
                
                <div class="space-y-6">
                    <div class="flex items-center justify-between mb-4 px-4">
                        <h3 class="text-xs font-black uppercase text-zinc-500 tracking-[0.3em] italic flex items-center gap-2">
                             <i data-lucide="radio" class="w-4 h-4"></i> Encrypted Transmissions
                        </h3>
                        <span class="terminal-font text-[9px] text-zinc-700 uppercase" x-text="directives.length + ' Logs Found'"></span>
                    </div>

                    <template x-for="item in directives" :key="item.id">
                        <div class="directive-card glass-gold-dispatch p-10 rounded-[3rem] shadow-xl relative overflow-hidden group">
                            <div class="absolute top-0 right-0 p-6 opacity-5 group-hover:opacity-20 transition-opacity">
                                <i data-lucide="shield-check" class="w-20 h-20 text-gold"></i>
                            </div>

                            <div class="flex flex-col md:flex-row justify-between gap-6 relative z-10">
                                <div class="space-y-4 max-w-2xl">
                                    <div class="flex items-center gap-4">
                                        <span class="px-3 py-1 bg-gold text-black text-[8px] font-black uppercase rounded-full">High Priority</span>
                                        <span class="text-[9px] text-zinc-600 font-black terminal-font uppercase" x-text="new Date(item.created_at).toLocaleString()"></span>
                                    </div>
                                    <p class="text-lg md:text-xl font-black uppercase italic tracking-tight text-zinc-200 leading-tight" x-text="item.content"></p>
                                </div>

                                <div class="flex items-end">
                                    <button @click="acknowledge(item.id)" class="px-8 py-4 bg-white/5 border border-white/10 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gold hover:text-black hover:border-gold transition-all">
                                        Acknowledge
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <div x-show="directives.length === 0" class="py-24 text-center opacity-10 bg-white/5 rounded-[4rem] border border-dashed border-gold/20">
                        <i data-lucide="radio-off" class="mx-auto mb-6 w-16 h-16 text-zinc-700"></i>
                        <p class="terminal-font text-xs uppercase tracking-[0.5em]">No Data in Current Buffer</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-12">
                    <button onclick="window.location.href='dossier.html'" class="p-6 glass-gold-dispatch rounded-3xl border border-white/5 hover:border-gold transition-all text-center group">
                        <i data-lucide="user-cog" class="mx-auto mb-2 text-zinc-600 group-hover:text-gold"></i>
                        <span class="text-[8px] font-black uppercase">Dossier</span>
                    </button>
                    <button onclick="window.location.href='frequency.html'" class="p-6 glass-gold-dispatch rounded-3xl border border-white/5 hover:border-gold transition-all text-center group">
                        <i data-lucide="activity" class="mx-auto mb-2 text-zinc-600 group-hover:text-gold"></i>
                        <span class="text-[8px] font-black uppercase">Frequency</span>
                    </button>
                    <button onclick="window.location.href='gallery.html'" class="p-6 glass-gold-dispatch rounded-3xl border border-white/5 hover:border-gold transition-all text-center group">
                        <i data-lucide="camera" class="mx-auto mb-2 text-zinc-600 group-hover:text-gold"></i>
                        <span class="text-[8px] font-black uppercase">Gallery</span>
                    </button>
                    <button onclick="window.location.href='archives.html'" class="p-6 glass-gold-dispatch rounded-3xl border border-white/5 hover:border-gold transition-all text-center group">
                        <i data-lucide="database" class="mx-auto mb-2 text-zinc-600 group-hover:text-gold"></i>
                        <span class="text-[8px] font-black uppercase">Vault</span>
                    </button>
                </div>
            </div>

            <footer class="mt-24 pt-10 border-t border-white/5 text-center text-zinc-800">
                <p class="terminal-font text-[12px] uppercase tracking-[0.8em] italic">
                    DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026
                </p>
            </footer>
        </div>
    </template>

</body>
</html>
