<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | GALLERY ARCHIVES</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-gold { background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px); background-size: 30px 30px; }
        .glass-gold-strong { background: rgba(10, 10, 15, 0.96); backdrop-filter: blur(40px); border: 1px solid rgba(212, 175, 55, 0.2); }
        
        /* MEDIA CARD LOGIC */
        .media-card { transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .media-card:hover { transform: translateY(-10px) scale(1.02); border-color: var(--electric); }
        .media-card:hover .overlay { opacity: 1; transform: translateY(0); }
        .overlay { opacity: 0; transform: translateY(20px); transition: all 0.4s ease; background: rgba(0, 0, 0, 0.85); }
        
        .loader-gold { width: 40px; height: 40px; border: 4px solid var(--gold); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .gold-glow { box-shadow: 0 0 50px rgba(212, 175, 55, 0.1); }
        
        .liked { color: #ef4444; }
    </style>

    <script>
        // Secure configuration - replace with environment variables or config.js
        const CONFIG = {
            SUPABASE_URL: window.MOG_CONFIG?.SUPABASE_URL || 'YOUR_SUPABASE_URL',
            SUPABASE_ANON_KEY: window.MOG_CONFIG?.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY'
        };
        
        let sb = null;
        let realtimeChannel = null;

        function galleryEngine() {
            return {
                view: 'gate',
                isDirector: false,
                isLoading: false,
                isUploading: false,
                items: [],
                authError: null,
                userLikes: new Set(), // Track liked items in session

                async init() {
                    // Security Gate Check
                    const role = localStorage.getItem('userRole');
                    if (!role) {
                        window.location.href = '../login.html';
                        return;
                    }

                    // Validate configuration
                    if (!this.isSupabaseConfigured()) {
                        this.authError = 'GALLERY SYSTEM OFFLINE - CONFIGURATION REQUIRED';
                        console.error('[GALLERY] Supabase not configured');
                        setTimeout(() => this.view = 'error', 1000);
                        return;
                    }

                    try {
                        sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                        const { data: { session } } = await sb.auth.getSession();
                        
                        if (!session) {
                            window.location.href = '../index.html';
                            return;
                        }

                        this.isDirector = role === 'director';
                        this.view = 'active';
                        await this.loadMedia();
                        this.subscribeToGallery();
                        
                        this.$nextTick(() => {
                            if (typeof lucide !== 'undefined') lucide.createIcons();
                        });
                        
                    } catch (error) {
                        console.error('[GALLERY] Initialization failed:', error);
                        this.authError = 'SECURE CONNECTION FAILED';
                        this.view = 'error';
                    }
                },

                isSupabaseConfigured() {
                    return CONFIG.SUPABASE_URL && 
                           !CONFIG.SUPABASE_URL.includes('YOUR_') &&
                           CONFIG.SUPABASE_ANON_KEY && 
                           !CONFIG.SUPABASE_ANON_KEY.includes('YOUR_');
                },

                async loadMedia() {
                    try {
                        this.isLoading = true;
                        const { data, error } = await sb
                            .from('gallery')
                            .select('*')
                            .order('created_at', { ascending: false });

                        if (error) throw error;
                        
                        this.items = data || [];
                    } catch (error) {
                        console.error('[GALLERY] Load failed:', error);
                        this.showNotification('FAILED TO LOAD ARCHIVE', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                subscribeToGallery() {
                    // Clean up existing subscription
                    if (realtimeChannel) {
                        realtimeChannel.unsubscribe();
                    }

                    realtimeChannel = sb
                        .channel('public:gallery')
                        .on('postgres_changes', 
                            { event: '*', schema: 'public', table: 'gallery' }, 
                            (payload) => {
                                console.log('[GALLERY] Realtime update:', payload);
                                this.loadMedia();
                            }
                        )
                        .subscribe((status) => {
                            console.log('[GALLERY] Realtime status:', status);
                        });
                },

                async handleUpload(e) {
                    if (!this.isDirector) {
                        this.showNotification('DIRECTOR CLEARANCE REQUIRED', 'error');
                        return;
                    }

                    const file = e.target.files[0];
                    if (!file) return;

                    // Validate file size (max 100MB)
                    const maxSize = 100 * 1024 * 1024;
                    if (file.size > maxSize) {
                        this.showNotification('FILE TOO LARGE: MAX 100MB', 'error');
                        e.target.value = '';
                        return;
                    }

                    this.isUploading = true;
                    
                    try {
                        const timestamp = Date.now();
                        const fileExt = file.name.split('.').pop();
                        const safeName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_').substring(0, 50);
                        const fileName = `MOG-${timestamp}-${MogCrypto?.generateSecureToken(8) || Math.random().toString(36).substring(2, 10)}-${safeName}.${fileExt}`;
                        
                        const { data: uploadData, error: uploadError } = await sb
                            .storage
                            .from('media')
                            .upload(fileName, file, {
                                cacheControl: '3600',
                                upsert: false
                            });

                        if (uploadError) throw uploadError;

                        const { data: { publicUrl } } = sb
                            .storage
                            .from('media')
                            .getPublicUrl(fileName);

                        const { error: dbError } = await sb
                            .from('gallery')
                            .insert({ 
                                url: publicUrl, 
                                type: file.type.startsWith('video') ? 'video' : 'image',
                                name: file.name.toUpperCase(),
                                likes: 0,
                                uploaded_by: (await sb.auth.getUser()).data.user?.id,
                                created_at: new Date().toISOString()
                            });

                        if (dbError) throw dbError;

                        this.showNotification('ARCHIVE SYNCHRONIZED: ASSET LIVE', 'success');
                        await this.loadMedia();
                        
                    } catch (error) {
                        console.error('[GALLERY] Upload failed:', error);
                        this.showNotification('UPLINK DENIED: ' + error.message, 'error');
                    } finally {
                        this.isUploading = false;
                        e.target.value = ''; // Reset input
                    }
                },

                async likeAsset(id, currentLikes) {
                    // Prevent double-liking
                    if (this.userLikes.has(id)) {
                        this.showNotification('ALREADY SYNCHRONIZED WITH ASSET', 'warning');
                        return;
                    }

                    try {
                        const { error } = await sb
                            .from('gallery')
                            .update({ likes: (currentLikes || 0) + 1 })
                            .eq('id', id);

                        if (error) throw error;

                        // Track locally
                        this.userLikes.add(id);
                        
                        // Optimistic update
                        const item = this.items.find(i => i.id === id);
                        if (item) item.likes = (item.likes || 0) + 1;

                        this.showNotification('SIGNAL AMPLIFIED', 'success');
                        
                    } catch (error) {
                        console.error('[GALLERY] Like failed:', error);
                        this.showNotification('AMPLIFICATION FAILED', 'error');
                    }
                },

                hasLiked(id) {
                    return this.userLikes.has(id);
                },

                async redactAsset(id) {
                    if (!this.isDirector) {
                        this.showNotification('DIRECTOR CLEARANCE REQUIRED', 'error');
                        return;
                    }

                    if (!confirm("PERMANENTLY REDACT THIS CULTURAL ASSET? THIS ACTION IS IRREVERSIBLE.")) {
                        return;
                    }

                    try {
                        // Get file info first
                        const { data: assetData } = await sb
                            .from('gallery')
                            .select('url')
                            .eq('id', id)
                            .single();

                        const { error: deleteError } = await sb
                            .from('gallery')
                            .delete()
                            .eq('id', id);

                        if (deleteError) throw deleteError;

                        // Clean up storage if possible
                        if (assetData?.url) {
                            const path = assetData.url.split('/').pop();
                            if (path) {
                                await sb.storage.from('media').remove([path]);
                            }
                        }

                        this.showNotification('ASSET PURGED FROM GRID', 'success');
                        await this.loadMedia();
                        
                    } catch (error) {
                        console.error('[GALLERY] Redaction failed:', error);
                        this.showNotification('REDACTION FAILED', 'error');
                    }
                },

                showNotification(message, type = 'info') {
                    const colors = {
                        success: 'border-green-500 text-green-400 bg-green-500/10',
                        error: 'border-red-500 text-red-400 bg-red-500/10',
                        warning: 'border-yellow-500 text-yellow-400 bg-yellow-500/10',
                        info: 'border-electric text-electric bg-electric/10'
                    };
                    
                    const toast = document.createElement('div');
                    toast.className = `fixed top-4 right-4 z-50 glass-gold-strong px-6 py-4 rounded-xl border-l-4 ${colors[type]} animate-slide-in max-w-md`;
                    toast.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-black uppercase tracking-wider">${type}</span>
                            <p class="text-xs text-white">${message}</p>
                        </div>
                    `;
                    
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.classList.add('animate-fade-out');
                        setTimeout(() => toast.remove(), 300);
                    }, 4000);
                },

                async terminateSession() {
                    if (realtimeChannel) {
                        realtimeChannel.unsubscribe();
                    }
                    
                    try {
                        await sb?.auth?.signOut();
                    } catch (e) {
                        console.error('[GALLERY] Sign out error:', e);
                    }
                    
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('userData');
                    sessionStorage.clear();
                    
                    window.location.href = '../login.html';
                },

                destroy() {
                    if (realtimeChannel) {
                        realtimeChannel.unsubscribe();
                    }
                }
            }
        }
    </script>
</head>
<body x-data="galleryEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-gold/30">

    <div class="bg-circuit-pattern"></div>
    <div class="bg-grid-gold fixed inset-0 z-0 opacity-10"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-8 relative z-50">
            <div class="loader-gold"></div>
            <p class="terminal-font text-[12px] text-gold animate-pulse uppercase tracking-[0.5em]">Syncing Visual Archive...</p>
        </div>
    </template>

    <template x-if="view === 'error'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <i data-lucide="shield-alert" class="w-16 h-16 text-red-500"></i>
            <p class="terminal-font text-[11px] text-red-500 uppercase tracking-[0.3em]" x-text="authError || 'SYSTEM ERROR'"></p>
            <button @click="terminateSession()" class="px-8 py-4 bg-white/10 rounded-full text-xs uppercase tracking-widest hover:bg-white/20 transition-all">
                Return to Gate
            </button>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-7xl mx-auto p-6 md:p-12 z-20 relative animate-fade-in">
            
            <header class="p-8 glass-gold-strong rounded-[3rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl gold-glow">
                <div class="flex items-center gap-8">
                    <button onclick="window.location.href='../index.html'" class="p-6 bg-white/5 rounded-[2rem] border border-white/10 hover:border-gold transition-all group shadow-xl">
                        <i data-lucide="chevron-left" class="text-gold group-hover:scale-110"></i>
                    </button>
                    <div class="flex items-center gap-4">
                        <img src="../assets/images/logo.png" alt="MOG Logo" class="w-12 h-12 object-contain" onerror="this.style.display='none'">
                        <div>
                            <h1 class="text-3xl font-black uppercase italic tracking-tighter text-gold leading-none">Media Curator</h1>
                            <p class="text-[10px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-2 italic">Sector 7G Visual Archive</p>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-6">
                    <template x-if="isDirector">
                        <label class="cursor-pointer bg-gold text-black px-12 py-6 rounded-full text-[11px] font-black uppercase tracking-[0.3em] shadow-2xl shadow-gold/30 hover:scale-105 active:scale-95 transition-all flex items-center gap-4 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i data-lucide="upload-cloud" class="w-6 h-6" x-show="!isUploading"></i>
                            <div class="w-6 h-6 border-2 border-black border-t-transparent rounded-full animate-spin" x-show="isUploading"></div>
                            <span x-text="isUploading ? 'Syncing...' : 'Initiate Archive Upload'"></span>
                            <input type="file" @change="handleUpload" class="hidden" accept="image/*,video/*" :disabled="isUploading">
                        </label>
                    </template>

                    <div x-show="!isDirector" class="text-right border-l border-white/5 pl-8 hidden md:block">
                        <p class="text-[10px] text-gold/50 font-black uppercase tracking-widest">Clearance: Operative</p>
                        <p class="text-[10px] font-black terminal-font mt-1 text-zinc-500 uppercase">Read-Only Access</p>
                    </div>
                    
                    <!-- Session Controls -->
                    <button @click="terminateSession()" 
                            class="p-4 bg-white/5 rounded-2xl border border-white/10 hover:border-red-500 hover:text-red-400 transition-all"
                            title="Terminate Session">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </header>

            <div x-show="isLoading" class="py-12 text-center">
                <div class="loader-gold mx-auto mb-4"></div>
                <p class="terminal-font text-[10px] text-zinc-500 uppercase">Loading Archive...</p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
                <template x-for="item in items" :key="item.id">
                    <div class="media-card relative aspect-square glass-gold-strong rounded-[4rem] overflow-hidden border border-white/5 group shadow-2xl">
                        
                        <template x-if="item.type === 'video'">
                            <video :src="item.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000" muted loop playsinline onmouseover="this.play()" onmouseout="this.pause()"></video>
                        </template>
                        <template x-if="item.type !== 'video'">
                            <img :src="item.url" class="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-1000" loading="lazy" decoding="async" :alt="item.name">
                        </template>

                        <div class="overlay absolute inset-0 p-10 flex flex-col justify-between">
                            <div class="flex justify-between items-start">
                            <div>
                                    <p class="text-[8px] text-zinc-500 uppercase font-black tracking-widest" x-text="'REF: ' + (item.id ? item.id.substring(0,8) : 'UNKNOWN')"></p>
                                    <p class="text-[12px] text-white font-black uppercase mt-1 truncate max-w-[150px]" x-text="item.name"></p>
                                </div>
                                <template x-if="isDirector">
                                    <button @click="redactAsset(item.id)" class="p-4 bg-red-600/10 text-red-500 rounded-2xl border border-red-600/20 hover:bg-red-600 hover:text-white transition-all shadow-xl" title="Redact Asset">
                                        <i data-lucide="shield-off" class="w-5 h-5"></i>
                                    </button>
                                </template>
                            </div>

                            <div class="flex justify-center gap-8">
                                <button @click="likeAsset(item.id, item.likes)" 
                                        class="flex flex-col items-center gap-3 group/btn"
                                        :disabled="hasLiked(item.id)">
                                    <div class="p-6 rounded-full shadow-2xl transition-all group-hover/btn:scale-110 active:scale-90"
                                         :class="hasLiked(item.id) ? 'bg-red-500 text-white shadow-red-500/40' : 'bg-gold text-black shadow-gold/40'">
                                        <i data-lucide="heart" class="w-7 h-7" :class="{ 'fill-current': hasLiked(item.id) }"></i>
                                    </div>
                                    <span class="text-[11px] font-black terminal-font" :class="hasLiked(item.id) ? 'text-red-400' : 'text-gold'" x-text="(item.likes || 0).toLocaleString()"></span>
                                </button>
                                
                                <a :href="item.url" download class="flex flex-col items-center gap-3 group/btn" title="Download Asset">
                                    <div class="p-6 bg-white/5 text-white rounded-full border border-white/10 group-hover/btn:bg-electric group-hover/btn:text-black group-hover/btn:border-electric transition-all">
                                        <i data-lucide="download" class="w-7 h-7"></i>
                                    </div>
                                    <span class="text-[9px] font-black text-zinc-500 uppercase tracking-widest">Archive</span>
                                </a>
                            </div>

                            <div class="flex justify-center">
                                <span class="text-[7px] text-zinc-600 font-black uppercase tracking-[0.5em]">Ministry Archive Protocol // Sec-7G</span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <div x-show="items.length === 0 && !isLoading" class="h-96 flex flex-col items-center justify-center opacity-10">
                <i data-lucide="camera-off" class="w-24 h-24 mb-8"></i>
                <p class="terminal-font text-[13px] uppercase tracking-[0.8em]">No Assets Detected</p>
            </div>

            <footer class="mt-40 pt-16 border-t border-white/5 text-center text-zinc-800">
                <p class="terminal-font text-[14px] uppercase tracking-[0.8em] italic">
                    DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026
                </p>
            </footer>
        </div>
    </template>
</body>
</html>
