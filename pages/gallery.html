<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.O.G. — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;--teal:#00E5CC;--teal-dim:#009E8E;--black:#050A0E;--navy:#0D1F2D;--panel:rgba(13,31,45,0.9);--border:rgba(201,168,76,0.25);--border-teal:rgba(0,229,204,0.2);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--black);font-family:'Rajdhani',sans-serif;color:#fff;min-height:100vh;padding-bottom:90px;}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);}

  /* TOP BAR */
  .top-bar{position:sticky;top:0;z-index:100;background:rgba(5,10,14,0.97);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;backdrop-filter:blur(10px);}
  .back-btn{color:var(--gold);font-size:20px;text-decoration:none;padding:4px 8px;}
  .top-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:3px;flex:1;text-align:center;}
  .top-bar-right{width:40px;}

  /* FILTER TABS */
  .filter-tabs{display:flex;gap:8px;padding:16px;overflow-x:auto;scrollbar-width:none;}
  .filter-tabs::-webkit-scrollbar{display:none;}
  .tab{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:2px;padding:7px 14px;border:1px solid var(--border);border-radius:3px;color:var(--gold-dim);background:none;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
  .tab.active,.tab:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.08);}

  /* GALLERY GRID */
  .gallery-grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .media-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;transition:all 0.3s;}
  .media-card:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.2);transform:translateY(-2px);}
  .media-thumb{width:100%;aspect-ratio:1;background:var(--navy);display:flex;align-items:center;justify-content:center;position:relative;}
  .media-thumb .thumb-icon{font-size:40px;opacity:0.3;}
  .media-type-badge{position:absolute;top:8px;left:8px;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;padding:2px 6px;border-radius:2px;}
  .badge-photo{background:rgba(201,168,76,0.8);color:var(--black);}
  .badge-video{background:rgba(0,229,204,0.8);color:var(--black);}
  .media-actions{position:absolute;top:8px;right:8px;display:flex;gap:6px;}
  .action-btn{background:rgba(5,10,14,0.85);border:1px solid var(--border);border-radius:3px;padding:5px 8px;font-size:13px;cursor:pointer;transition:all 0.2s;}
  .action-btn:hover{border-color:var(--gold);}
  .media-info{padding:10px;}
  .media-title{font-size:12px;font-weight:600;color:var(--gold-light);letter-spacing:1px;margin-bottom:3px;font-family:'Orbitron',sans-serif;}
  .media-meta{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:1px;}
  .likes-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
  .like-btn{background:none;border:none;color:var(--gold-dim);font-size:14px;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:'Share Tech Mono',monospace;font-size:10px;transition:all 0.2s;}
  .like-btn.liked,.like-btn:hover{color:var(--gold);}
  .download-btn{background:none;border:1px solid var(--border-teal);color:var(--teal-dim);padding:4px 8px;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:1px;transition:all 0.2s;}
  .download-btn:hover{border-color:var(--teal);color:var(--teal);}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(5,10,14,0.95);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal-close{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--border);color:var(--gold);font-size:20px;padding:6px 12px;cursor:pointer;border-radius:3px;}
  .modal-content{width:90%;max-width:400px;}
  .modal-media{width:100%;aspect-ratio:1;background:var(--navy);border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:80px;margin-bottom:16px;}
  .modal-title{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--gold);letter-spacing:2px;margin-bottom:8px;}
  .modal-meta{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--teal-dim);letter-spacing:1px;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-btn{flex:1;padding:12px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;border-radius:3px;cursor:pointer;border:none;transition:all 0.2s;}
  .modal-btn.gold{background:var(--gold);color:var(--black);}
  .modal-btn.teal{background:rgba(0,229,204,0.15);color:var(--teal);border:1px solid var(--teal);}

  /* BOTTOM NAV */
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(5,10,14,0.97);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(10px);}
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;gap:4px;cursor:pointer;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent;}
  .nav-item.active{border-top-color:var(--gold);}
  .nav-icon{font-size:20px;}
  .nav-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:1px;}
  .nav-item.active .nav-label{color:var(--gold);}

  /* Section header */
  .section-hdr{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;}
  .section-hdr h2{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:3px;}
  .section-hdr .line{flex:1;height:1px;background:var(--border);}
  .count-badge{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal);border:1px solid var(--border-teal);padding:2px 8px;border-radius:2px;}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="top-title">MEDIA VAULT</div>
  <div class="top-bar-right"></div>
</div>

<div class="filter-tabs">
  <button class="tab active" onclick="filterMedia('all',this)">ALL INTEL</button>
  <button class="tab" onclick="filterMedia('photo',this)">PHOTOS</button>
  <button class="tab" onclick="filterMedia('video',this)">VIDEOS</button>
  <button class="tab" onclick="filterMedia('session01',this)">SESSION 01</button>
  <button class="tab" onclick="filterMedia('session02',this)">SESSION 02</button>
</div>

<div class="section-hdr">
  <div class="line"></div>
  <h2>CLASSIFIED MEDIA</h2>
  <div class="count-badge" id="mediaCount">6 FILES</div>
  <div class="line"></div>
</div>

<div class="gallery-grid" id="galleryGrid">
  <!-- Cards injected by JS -->
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-content">
    <div class="modal-media" id="modalThumb">🎬</div>
    <div class="modal-title" id="modalTitle">TITLE</div>
    <div class="modal-meta" id="modalMeta">META</div>
    <div class="modal-actions">
      <button class="modal-btn gold" onclick="likeFromModal()">♥ LIKE</button>
      <button class="modal-btn teal" onclick="downloadFromModal()">⬇ DOWNLOAD</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>
  <a href="gallery.html" class="nav-item active"><div class="nav-icon">🎬</div><div class="nav-label">GALLERY</div></a>
  <a href="frequency.html" class="nav-item"><div class="nav-icon">🎙️</div><div class="nav-label">LIVE</div></a>
  <a href="dispatch.html" class="nav-item"><div class="nav-icon">💬</div><div class="nav-label">CHAT</div></a>
  <a href="dossier.html" class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></a>
</div>

<script>
const mediaItems=[
  {id:1,type:'video',session:'session01',title:'SESSION 01',subtitle:'AMAPIANO LIVE MIX',icon:'🎬',date:'14D AGO',likes:24,liked:false},
  {id:2,type:'photo',session:'session01',title:'SESSION 01',subtitle:'GALLERY DROP A',icon:'📸',date:'14D AGO',likes:18,liked:false},
  {id:3,type:'photo',session:'session01',title:'SESSION 01',subtitle:'GALLERY DROP B',icon:'🖼️',date:'14D AGO',likes:31,liked:false},
  {id:4,type:'video',session:'session02',title:'SESSION 02',subtitle:'THE SEQUEL DROPS',icon:'🎥',date:'2D AGO',likes:9,liked:false},
  {id:5,type:'photo',session:'session02',title:'SESSION 02',subtitle:'VIBE SHOTS',icon:'📷',date:'2D AGO',likes:15,liked:false},
  {id:6,type:'photo',session:'session02',title:'SESSION 02',subtitle:'THE CROWD',icon:'📸',date:'2D AGO',likes:22,liked:false},
];

let activeFilter='all';
let currentModalId=null;

function renderGallery(items){
  const grid=document.getElementById('galleryGrid');
  document.getElementById('mediaCount').textContent=items.length+' FILES';
  grid.innerHTML=items.map(m=>`
    <div class="media-card" onclick="openModal(${m.id})">
      <div class="media-thumb">
        <div class="thumb-icon">${m.icon}</div>
        <div class="media-type-badge badge-${m.type}">${m.type.toUpperCase()}</div>
      </div>
      <div class="media-info">
        <div class="media-title">${m.title}</div>
        <div class="media-meta">${m.subtitle} · ${m.date}</div>
        <div class="likes-row">
          <button class="like-btn ${m.liked?'liked':''}" onclick="event.stopPropagation();toggleLike(${m.id},this)">
            ${m.liked?'♥':'♡'} <span>${m.likes}</span>
          </button>
          <button class="download-btn" onclick="event.stopPropagation();downloadItem(${m.id})">⬇ SAVE</button>
        </div>
      </div>
    </div>
  `).join('');
}

function filterMedia(f,btn){
  activeFilter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  const filtered=f==='all'?mediaItems:mediaItems.filter(m=>m.type===f||m.session===f);
  renderGallery(filtered);
}

function toggleLike(id,btn){
  const item=mediaItems.find(m=>m.id===id);
  item.liked=!item.liked;
  item.likes+=item.liked?1:-1;
  btn.classList.toggle('liked');
  btn.innerHTML=(item.liked?'♥':'♡')+' <span>'+item.likes+'</span>';
}

function downloadItem(id){
  const item=mediaItems.find(m=>m.id===id);
  alert('📥 Downloading: '+item.title+' — '+item.subtitle+'\n(Connect to Supabase storage to enable real downloads)');
}

function openModal(id){
  currentModalId=id;
  const item=mediaItems.find(m=>m.id===id);
  document.getElementById('modalThumb').textContent=item.icon;
  document.getElementById('modalTitle').textContent=item.title+' — '+item.subtitle;
  document.getElementById('modalMeta').textContent=item.type.toUpperCase()+' · '+item.date+' · '+item.likes+' LIKES';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function likeFromModal(){ if(currentModalId) toggleLike(currentModalId,{classList:{toggle:()=>{}},innerHTML:''}); closeModal(); }
function downloadFromModal(){ if(currentModalId) downloadItem(currentModalId); closeModal(); }

renderGallery(mediaItems);
</script>
</body>
</html>
