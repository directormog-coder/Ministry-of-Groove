<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>M.O.G. | MEDIA CURATOR</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        [x-cloak] { display: none !important; }

        :root {
            --black:       #000000;
            --gold:        #d4af37;
            --gold-bright: #f0c040;
            --gold-dark:   #8b6914;
            --gold-glow:   rgba(212,175,55,0.4);
            --teal:        #00d4aa;
            --teal-glow:   rgba(0,212,170,0.3);
            --red:         #dc2626;
            --red-glow:    rgba(220,38,38,0.4);
        }

        *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--black);
            color: #e8e0cc;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .mono  { font-family: 'Share Tech Mono', monospace; }
        .orbit { font-family: 'Orbitron', sans-serif; }

        /* ── Background ── */
        .bg-seal {
            position: fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            width: clamp(280px,75vmin,600px); height: clamp(280px,75vmin,600px);
            background: url('../assets/images/logo.png') center/contain no-repeat;
            opacity: 0.04; pointer-events:none; z-index:0;
        }
        .bg-grid {
            position:fixed; inset:0; pointer-events:none; z-index:1;
            background-image:
                linear-gradient(rgba(212,175,55,0.025) 1px,transparent 1px),
                linear-gradient(90deg,rgba(212,175,55,0.025) 1px,transparent 1px);
            background-size:52px 52px;
        }
        @media (max-width:480px){.bg-grid{display:none}}
        .bg-vignette {
            position:fixed; inset:0; pointer-events:none; z-index:2;
            background: radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,0.85) 100%);
        }

        /* ── Glass ── */
        .glass {
            background: rgba(8,10,6,0.93);
            border: 1px solid rgba(212,175,55,0.18);
            box-shadow: 0 4px 40px rgba(0,0,0,0.5);
        }
        @media (min-width:641px){
            .glass { backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); }
        }

        /* ── Gold line ── */
        .gold-line { height:1px; background:linear-gradient(90deg,transparent,var(--gold-dark),var(--gold),var(--teal),transparent); }

        /* ── Loader ── */
        .loader-ring {
            width:56px; height:56px; position:relative;
        }
        .loader-ring::before {
            content:''; position:absolute; inset:0; border-radius:50%;
            border:3px solid transparent; border-top-color:var(--gold);
            animation:spin 1s linear infinite;
        }
        .loader-ring::after {
            content:''; position:absolute; inset:6px; border-radius:50%;
            border:2px solid transparent; border-bottom-color:var(--teal);
            animation:spin 1.6s linear infinite reverse;
        }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* ── Buttons ── */
        .btn {
            display:inline-flex; align-items:center; justify-content:center; gap:6px;
            cursor:pointer; transition:all 0.24s ease;
            font-family:'Orbitron',sans-serif; font-weight:700; text-transform:uppercase;
            position:relative; overflow:hidden;
        }
        .btn-gold { background:linear-gradient(135deg,rgba(212,175,55,0.12),rgba(139,105,20,0.22)); border:1px solid rgba(212,175,55,0.38); color:var(--gold); }
        .btn-gold:hover { background:linear-gradient(135deg,rgba(212,175,55,0.25),rgba(139,105,20,0.38)); box-shadow:0 0 20px var(--gold-glow); border-color:var(--gold-bright); transform:translateY(-1px); }
        .btn-red  { background:linear-gradient(135deg,rgba(220,38,38,0.12),rgba(153,27,27,0.22)); border:1px solid rgba(220,38,38,0.38); color:#fca5a5; }
        .btn-red:hover  { background:linear-gradient(135deg,rgba(220,38,38,0.25),rgba(153,27,27,0.38)); box-shadow:0 0 20px var(--red-glow); border-color:var(--red); color:#fff; transform:translateY(-1px); }
        .btn-teal { background:linear-gradient(135deg,rgba(0,212,170,0.1),rgba(0,110,89,0.2)); border:1px solid rgba(0,212,170,0.38); color:var(--teal); }
        .btn-teal:hover { background:linear-gradient(135deg,rgba(0,212,170,0.22),rgba(0,110,89,0.35)); box-shadow:0 0 18px var(--teal-glow); border-color:var(--teal); transform:translateY(-1px); }
        .btn:active { transform:scale(0.97) !important; }
        .btn:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }

        /* ── Media card ── */
        .media-card {
            border-radius:1.5rem; overflow:hidden;
            border:1px solid rgba(212,175,55,0.1);
            background:rgba(4,6,4,0.95);
            transition:all 0.35s cubic-bezier(0.16,1,0.3,1);
            position:relative;
        }
        @media (hover:hover){
            .media-card:hover { transform:translateY(-6px) scale(1.01); border-color:rgba(212,175,55,0.35); box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px rgba(212,175,55,0.08); }
            .media-card:hover .card-overlay { opacity:1; }
            .media-card:hover .card-media { transform:scale(1.05); filter:grayscale(0%) !important; }
        }
        .media-card:active { transform:scale(0.98); }

        .card-media {
            width:100%; aspect-ratio:1/1; object-fit:cover;
            filter:grayscale(30%);
            transition:all 0.6s ease;
        }

        .card-overlay {
            position:absolute; inset:0;
            background:rgba(0,0,0,0.82);
            opacity:0; transition:opacity 0.35s ease;
            display:flex; flex-direction:column; justify-content:space-between;
            padding:1.25rem;
        }

        /* Mobile: overlay always visible */
        @media (max-width:640px){
            .card-overlay { opacity:1; background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,transparent 50%); }
        }

        /* ── Like button ── */
        .like-btn { transition:all 0.2s ease; }
        .like-btn.liked { color:#ef4444; border-color:rgba(239,68,68,0.5); background:rgba(239,68,68,0.15); box-shadow:0 0 12px rgba(239,68,68,0.3); }
        .like-btn:not(.liked):hover { background:rgba(212,175,55,0.2); }

        /* ── Slogan ── */
        .slogan { font-family:'Orbitron',sans-serif; font-size:clamp(0.44rem,1.1vw,0.54rem); letter-spacing:0.28em; color:var(--teal); opacity:0.5; text-transform:uppercase; }

        /* ── Upload progress ── */
        .upload-bar { height:3px; background:rgba(0,0,0,0.7); border-radius:99px; overflow:hidden; }
        .upload-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,var(--gold-dark),var(--gold-bright)); box-shadow:0 0 8px var(--gold-glow); transition:width 0.3s ease; }

        /* ── Toast ── */
        .toast {
            font-family:'Orbitron',sans-serif; font-size:0.62rem; font-weight:700;
            letter-spacing:0.1em; text-transform:uppercase;
            border-radius:12px; padding:11px 16px;
            box-shadow:0 8px 32px rgba(0,0,0,0.8);
            display:flex; align-items:center; gap:8px;
            border-width:1px; border-style:solid;
            transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s ease;
            max-width:min(90vw,360px);
        }

        /* ── Animations ── */
        .fade-up { animation:fadeUp 0.5s cubic-bezier(0.22,1,0.36,1) both; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

        .dot-blink span { animation:blink 1.3s infinite; }
        .dot-blink span:nth-child(2){animation-delay:.2s}
        .dot-blink span:nth-child(3){animation-delay:.4s}
        @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:rgba(0,0,0,0.6); }
        ::-webkit-scrollbar-thumb { background:linear-gradient(180deg,var(--gold-dark),var(--teal)); border-radius:4px; }

        @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important} }
    </style>

    <script>
    function galleryEngine() {
        return {
            view: 'gate',
            isDirector: false,
            isLoading: false,
            isUploading: false,
            uploadProgress: 0,
            items: [],
            likedSet: new Set(),
            filterType: 'ALL',
            currentUserId: null,

            get sb() { return window.sb || window.supabaseClient; },

            get filteredItems() {
                if (this.filterType === 'ALL') return this.items;
                return this.items.filter(i => (i.type||'image').toUpperCase() === this.filterType);
            },

            async init() {
                // Auth check
                const role = localStorage.getItem('userRole');
                if (!role) { window.location.href = '../login.html'; return; }

                // Wait for Supabase
                let tries = 0;
                while (!this.sb && tries < 30) {
                    await new Promise(r => setTimeout(r, 100)); tries++;
                }
                if (!this.sb) {
                    this.toast('Connection failed — refresh and try again', 'error');
                    return;
                }

                try {
                    const { data:{ session } } = await this.sb.auth.getSession();
                    if (!session) { window.location.href = '../login.html'; return; }

                    this.currentUserId = session.user.id;
                    this.isDirector = role === 'director';
                    this.view = 'active';
                    await this.loadMedia();
                    this.loadLikedFromStorage();
                    this.subscribeRealtime();
                    this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
                } catch(e) {
                    console.error('[GALLERY]', e);
                    this.toast('Authentication failed', 'error');
                }
            },

            loadLikedFromStorage() {
                try {
                    const stored = JSON.parse(localStorage.getItem('mog_liked_gallery') || '[]');
                    this.likedSet = new Set(stored);
                } catch(_) {}
            },

            saveLikedToStorage() {
                try { localStorage.setItem('mog_liked_gallery', JSON.stringify([...this.likedSet])); } catch(_) {}
            },

            async loadMedia() {
                this.isLoading = true;
                try {
                    const { data, error } = await this.sb.from('gallery')
                        .select('*').order('created_at', { ascending:false });
                    if (error) throw error;
                    this.items = data || [];
                } catch(e) {
                    console.error('[GALLERY] load:', e);
                    this.items = [];
                } finally { this.isLoading = false; }
            },

            subscribeRealtime() {
                try {
                    this.sb.channel('gallery-realtime')
                        .on('postgres_changes', { event:'*', schema:'public', table:'gallery' }, () => this.loadMedia())
                        .subscribe();
                } catch(_) {}
            },

            async likeItem(item) {
                const id = item.id;
                if (this.likedSet.has(id)) {
                    this.toast('Already synchronized with this asset', 'warning'); return;
                }
                // Optimistic
                this.likedSet.add(id);
                this.likedSet = new Set(this.likedSet);
                const idx = this.items.findIndex(i => i.id === id);
                if (idx > -1) this.items[idx].likes = (this.items[idx].likes || 0) + 1;
                this.saveLikedToStorage();
                try {
                    await this.sb.from('gallery').update({ likes:(item.likes||0)+1 }).eq('id', id);
                } catch(_) {}
            },

            isLiked(id) { return this.likedSet.has(id); },

            async handleUpload(e) {
                if (!this.isDirector) { this.toast('Director clearance required', 'error'); return; }
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 100 * 1024 * 1024) { this.toast('Max 100MB', 'error'); e.target.value=''; return; }

                this.isUploading = true;
                this.uploadProgress = 10;
                try {
                    const ext  = file.name.split('.').pop();
                    const name = `MOG-${Date.now()}-${Math.random().toString(36).substr(2,8)}.${ext}`;
                    this.uploadProgress = 35;
                    const { error:ue } = await this.sb.storage.from('media').upload(name, file, { cacheControl:'3600', upsert:false });
                    if (ue) throw ue;
                    this.uploadProgress = 70;
                    const { data:{ publicUrl } } = this.sb.storage.from('media').getPublicUrl(name);
                    const { error:de } = await this.sb.from('gallery').insert({
                        url: publicUrl,
                        type: file.type.startsWith('video') ? 'video' : 'image',
                        name: file.name.toUpperCase(),
                        likes: 0,
                        uploaded_by: this.currentUserId,
                        created_at: new Date().toISOString()
                    });
                    if (de) throw de;
                    this.uploadProgress = 100;
                    this.toast('Asset archived successfully', 'success');
                    await this.loadMedia();
                } catch(err) {
                    console.error('[GALLERY] upload:', err);
                    this.toast('Upload failed: '+(err.message||'retry'), 'error');
                } finally {
                    this.isUploading = false;
                    setTimeout(() => this.uploadProgress=0, 1500);
                    e.target.value = '';
                }
            },

            async redactItem(id) {
                if (!this.isDirector) { this.toast('Director clearance required', 'error'); return; }
                if (!confirm('PERMANENTLY REDACT THIS ASSET? IRREVERSIBLE.')) return;
                try {
                    const { data:asset } = await this.sb.from('gallery').select('url').eq('id',id).single();
                    const { error } = await this.sb.from('gallery').delete().eq('id',id);
                    if (error) throw error;
                    if (asset?.url) {
                        const path = asset.url.split('/').pop();
                        if (path) await this.sb.storage.from('media').remove([path]).catch(()=>{});
                    }
                    this.items = this.items.filter(i => i.id !== id);
                    this.toast('Asset purged from grid', 'success');
                } catch(e) { this.toast('Redaction failed', 'error'); }
            },

            logout() {
                try { this.sb?.auth?.signOut(); } catch(_) {}
                localStorage.removeItem('userRole');
                window.location.href = '../login.html';
            },

            timeAgo(ts) {
                if (!ts) return '—';
                const s=(Date.now()-new Date(ts))/1000;
                if (s<60)    return Math.floor(s)+'s ago';
                if (s<3600)  return Math.floor(s/60)+'m ago';
                if (s<86400) return Math.floor(s/3600)+'h ago';
                return Math.floor(s/86400)+'d ago';
            },

            toast(message, type='info') {
                const cfg = {
                    success:{ bg:'#052010', border:'rgba(0,212,170,0.4)',  color:'#4aecd4' },
                    error:  { bg:'#1a0404', border:'rgba(220,38,38,0.45)', color:'#f87171' },
                    warning:{ bg:'#1a1000', border:'rgba(212,175,55,0.4)', color:'#fcd34d' },
                    info:   { bg:'#050a08', border:'rgba(0,212,170,0.2)',  color:'#e8f0ee' }
                }[type]||{ bg:'#050a08', border:'rgba(0,212,170,0.2)', color:'#e8f0ee' };
                const t=document.createElement('div');
                const m=window.innerWidth<640;
                t.style.cssText=`position:fixed;z-index:99999;${m?'bottom:20px;left:50%;transform:translate(-50%,20px)':'top:16px;right:16px;transform:translateX(120%)'};background:${cfg.bg};border:1px solid ${cfg.border};color:${cfg.color};font-family:'Orbitron',sans-serif;font-size:0.62rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;border-radius:12px;padding:11px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.8);display:flex;align-items:center;gap:8px;max-width:min(90vw,360px);`;
                t.textContent=message;
                document.body.appendChild(t);
                requestAnimationFrame(()=>setTimeout(()=>{t.style.transform=m?'translate(-50%,0)':'translateX(0)';t.style.transition='transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';},20));
                setTimeout(()=>{t.style.opacity='0';t.style.transform=m?'translate(-50%,20px)':'translateX(120%)';setTimeout(()=>t.remove(),350);},4000);
            }
        };
    }
    </script>
</head>

<body x-data="galleryEngine()" x-init="init()" x-cloak class="bg-black min-h-screen">

<div class="bg-seal" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>

<!-- ── GATE ── -->
<template x-if="view==='gate'">
<div class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6 bg-black">
    <div class="loader-ring" style="width:56px;height:56px"></div>
    <div class="text-center space-y-2">
        <p class="orbit text-xs tracking-widest" style="color:var(--gold)">
            Syncing Visual Archive
            <span class="dot-blink"><span>.</span><span>.</span><span>.</span></span>
        </p>
        <p class="slogan">Decrypting the Culture. Synchronizing the Grid.</p>
    </div>
</div>
</template>

<!-- ── ACTIVE ── -->
<template x-if="view==='active'">
<div class="relative z-10 min-h-screen fade-up">

    <!-- NAV -->
    <nav class="glass sticky top-0 z-40" style="border-bottom:1px solid rgba(212,175,55,0.12)">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="btn btn-gold p-2 rounded-xl" style="min-height:unset;padding:7px;font-size:0.6rem">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                </a>
                <img src="../assets/images/logo.png" alt="M.O.G." style="width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 8px var(--gold-glow))" onerror="this.style.display='none'">
                <div>
                    <p class="orbit font-black text-base sm:text-lg uppercase" style="color:var(--gold);line-height:1.1">Media Curator</p>
                    <p class="slogan">Sector 7G Visual Archive</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Filter chips — desktop -->
                <div class="hidden sm:flex gap-1.5">
                    <template x-for="f in ['ALL','IMAGE','VIDEO']" :key="f">
                        <button @click="filterType=f" class="orbit font-bold uppercase rounded-full px-3 py-1 transition-all" style="font-size:0.56rem;min-height:unset" :style="filterType===f?'background:rgba(212,175,55,0.18);border:1px solid rgba(212,175,55,0.45);color:var(--gold)':'background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.08);color:#6b7280'" x-text="f"></button>
                    </template>
                </div>

                <!-- Upload (director only) -->
                <template x-if="isDirector">
                    <label class="btn btn-gold px-3 py-2 rounded-xl cursor-pointer" style="font-size:0.6rem;min-height:unset" :class="isUploading?'opacity-50':''">
                        <svg x-show="!isUploading" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                        <svg x-show="isUploading" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        <span x-text="isUploading?'Uploading...':'Upload Asset'"></span>
                        <input type="file" @change="handleUpload($event)" class="hidden" accept="image/*,video/*" :disabled="isUploading">
                    </label>
                </template>

                <button @click="logout()" class="btn btn-red p-2 rounded-xl" style="min-height:unset;padding:7px" title="Sign Out">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </div>

        <!-- Upload progress bar -->
        <template x-if="uploadProgress>0">
            <div class="upload-bar mx-4 sm:mx-6 mb-2">
                <div class="upload-fill" :style="'width:'+uploadProgress+'%'"></div>
            </div>
        </template>

        <div class="gold-line" style="opacity:0.2"></div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-5 sm:py-8" style="padding-bottom:2rem">

        <!-- Mobile filters -->
        <div class="flex sm:hidden gap-2 mb-5">
            <template x-for="f in ['ALL','IMAGE','VIDEO']" :key="f">
                <button @click="filterType=f" class="orbit font-bold uppercase rounded-full px-4 py-2 transition-all flex-1" style="font-size:0.58rem" :style="filterType===f?'background:rgba(212,175,55,0.18);border:1px solid rgba(212,175,55,0.45);color:var(--gold)':'background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.08);color:#6b7280'" x-text="f"></button>
            </template>
        </div>

        <!-- Loading -->
        <template x-if="isLoading">
            <div class="flex flex-col items-center justify-center py-20 gap-4">
                <div class="loader-ring"></div>
                <p class="orbit text-xs tracking-widest" style="color:var(--gold)">Loading Archive...</p>
            </div>
        </template>

        <!-- Grid -->
        <template x-if="!isLoading">
            <div>
                <!-- Empty state -->
                <template x-if="filteredItems.length===0">
                    <div class="flex flex-col items-center justify-center py-24 gap-5" style="opacity:0.2">
                        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--gold)"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                        <p class="orbit text-sm uppercase tracking-widest" style="color:var(--gold)">No Assets Detected</p>
                        <p class="mono text-xs text-gray-600" x-show="isDirector">Use the Upload button to add media to the archive</p>
                    </div>
                </template>

                <!-- Media grid -->
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
                    <template x-for="item in filteredItems" :key="item.id">
                        <div class="media-card">
                            <!-- Media -->
                            <template x-if="item.type==='video'">
                                <video :src="item.url" class="card-media" muted loop playsinline preload="none"
                                       @mouseenter="$el.play()" @mouseleave="$el.pause();$el.currentTime=0"
                                       @touchstart="$el.play()"></video>
                            </template>
                            <template x-if="item.type!=='video'">
                                <img :src="item.url" :alt="item.name||'Asset'" class="card-media" loading="lazy"
                                     @error="$el.src='../assets/images/logo.png'">
                            </template>

                            <!-- Overlay -->
                            <div class="card-overlay">
                                <!-- Top: ref + redact -->
                                <div class="flex items-start justify-between">
                                    <div>
                                        <p class="mono text-gray-500 truncate max-w-[120px]" style="font-size:0.52rem" x-text="'REF: '+(item.id||'').substring(0,8)"></p>
                                        <p class="orbit font-bold text-white truncate max-w-[140px]" style="font-size:0.62rem" x-text="item.name||'UNTITLED'"></p>
                                        <p class="mono text-gray-600" style="font-size:0.52rem" x-text="timeAgo(item.created_at)"></p>
                                    </div>
                                    <template x-if="isDirector">
                                        <button @click.stop="redactItem(item.id)" class="btn btn-red p-1.5 rounded-lg" style="min-height:unset">
                                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                                        </button>
                                    </template>
                                </div>

                                <!-- Bottom: like + download -->
                                <div class="flex items-center justify-center gap-4">
                                    <button @click.stop="likeItem(item)"
                                            class="like-btn btn rounded-full px-4 py-2.5 border"
                                            :class="isLiked(item.id)?'liked':''"
                                            style="border-color:rgba(212,175,55,0.25);background:rgba(0,0,0,0.5);color:var(--gold);font-size:0.6rem;font-family:'Orbitron',sans-serif;font-weight:700;letter-spacing:0.08em;min-height:unset"
                                            :disabled="isLiked(item.id)">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" :style="isLiked(item.id)?'fill:#ef4444;stroke:#ef4444':''"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                        <span x-text="(item.likes||0)"></span>
                                    </button>
                                    <a :href="item.url" download class="btn btn-gold rounded-full px-3 py-2.5" style="font-size:0.6rem;min-height:unset">
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                        DL
                                    </a>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Count -->
                <template x-if="filteredItems.length > 0">
                    <p class="mono text-center text-gray-700 mt-6" style="font-size:0.58rem;letter-spacing:0.15em;text-transform:uppercase" x-text="filteredItems.length+' assets in archive'"></p>
                </template>
            </div>
        </template>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 mt-4" style="border-top:1px solid rgba(212,175,55,0.06)">
        <p class="slogan">Decrypting the Culture. Synchronizing the Grid. © 2026</p>
        <p class="mono text-gray-800 mt-1" style="font-size:0.52rem;letter-spacing:0.2em">MINISTRY OF GROOVE // SECTOR 7G VISUAL ARCHIVE</p>
    </footer>

</div>
</template>

</body>
</html>
