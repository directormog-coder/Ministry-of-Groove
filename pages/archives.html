<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | CLASSIFIED VAULT</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        .bg-grid-gold { background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px); background-size: 40px 40px; }
        .glass-vault { background: rgba(5, 5, 8, 0.98); backdrop-filter: blur(40px); border: 1px solid rgba(212, 175, 55, 0.2); }
        
        .loader-gold { width: 35px; height: 35px; border: 4px solid var(--gold); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .file-row { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-left: 0px solid var(--gold); }
        .file-row:hover { border-left-width: 6px; background: rgba(212, 175, 55, 0.05); transform: translateX(5px); border-color: var(--electric); }
        
        .redact-btn:hover { background: #ef4444; color: white; border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    </style>

    <script>
        // Configuration loaded from environment or config file
        const CONFIG = {
            SUPABASE_URL: window.MOG_CONFIG?.SUPABASE_URL || 'YOUR_SUPABASE_URL',
            SUPABASE_ANON_KEY: window.MOG_CONFIG?.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY'
        };
        
        let sb = null;

        function vaultEngine() {
            return {
                view: 'gate',
                files: [],
                isDirector: false,
                isLoading: false,
                vaultStatus: 'ENCRYPTED',
                authError: null,

                async init() {
                    // Security Gate Check
                    const role = localStorage.getItem('userRole');
                    if (!role) {
                        window.location.href = '../login.html';
                        return;
                    }

                    // Validate Supabase configuration
                    if (!this.isSupabaseConfigured()) {
                        this.authError = 'Vault systems offline - configuration required';
                        console.error('[VAULT] Supabase not configured');
                        return;
                    }

                    sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
                    
                    try {
                        const { data: { session } } = await sb.auth.getSession();
                        
                        if (!session) {
                            window.location.href = '../index.html';
                            return;
                        }

                        this.isDirector = role === 'director';
                        this.view = 'active';
                        await this.loadVaultData();
                        this.vaultStatus = 'DECRYPTED';
                        this.$nextTick(() => lucide.createIcons());
                    } catch (error) {
                        console.error('[VAULT] Initialization error:', error);
                        this.authError = 'Vault access denied';
                    }
                },

                isSupabaseConfigured() {
                    return CONFIG.SUPABASE_URL && 
                           !CONFIG.SUPABASE_URL.includes('YOUR_') &&
                           CONFIG.SUPABASE_ANON_KEY && 
                           !CONFIG.SUPABASE_ANON_KEY.includes('YOUR_');
                },

                async loadVaultData() {
                    try {
                        const { data, error } = await sb
                            .from('archives')
                            .select('*')
                            .order('created_at', { ascending: false });
                        
                        if (error) throw error;
                        if (data) this.files = data;
                    } catch (error) {
                        console.error('[VAULT] Load failed:', error);
                        this.authError = 'Failed to decrypt vault contents';
                    }
                },

                async handleUpload(e) {
                    if (!this.isDirector) {
                        alert('ACCESS DENIED: Director clearance required');
                        return;
                    }
                    
                    const file = e.target.files[0];
                    if (!file) return;

                    // Validate file size (max 50MB)
                    if (file.size > 50 * 1024 * 1024) {
                        alert('FILE TOO LARGE: Maximum 50MB allowed');
                        return;
                    }

                    this.isLoading = true;
                    
                    try {
                        const timestamp = Date.now();
                        const fileExt = file.name.split('.').pop();
                        const fileName = `CLASSIFIED-${timestamp}-${MogCrypto?.generateSecureToken(8) || Math.random().toString(36).substring(2, 10)}.${fileExt}`;
                        
                        const { data: uploadData, error: uploadError } = await sb
                            .storage
                            .from('vault')
                            .upload(fileName, file, {
                                cacheControl: '3600',
                                upsert: false
                            });

                        if (uploadError) throw uploadError;

                        const { data: { publicUrl } } = sb
                            .storage
                            .from('vault')
                            .getPublicUrl(fileName);

                        const { error: dbError } = await sb
                            .from('archives')
                            .insert({ 
                                name: file.name.toUpperCase(),
                                url: publicUrl,
                                size: this.formatFileSize(file.size),
                                classification: 'CONFIDENTIAL',
                                uploaded_by: (await sb.auth.getUser()).data.user?.id,
                                created_at: new Date().toISOString()
                            });

                        if (dbError) throw dbError;

                        await this.loadVaultData();
                        this.showNotification('VAULT UPDATED: DOCUMENT ARCHIVED', 'success');
                        
                    } catch (error) {
                        console.error('[VAULT] Upload failed:', error);
                        this.showNotification('ARCHIVE FAILED: ' + error.message, 'error');
                    } finally {
                        this.isLoading = false;
                        e.target.value = ''; // Reset input
                    }
                },

                async redactFile(id) {
                    if (!this.isDirector) {
                        alert('ACCESS DENIED: Director clearance required');
                        return;
                    }

                    if (!confirm("REDACT THIS DOCUMENT? THIS ACTION IS IRREVERSIBLE.")) {
                        return;
                    }

                    try {
                        // Get file info first to delete from storage
                        const { data: fileData } = await sb
                            .from('archives')
                            .select('url')
                            .eq('id', id)
                            .single();

                        const { error: deleteError } = await sb
                            .from('archives')
                            .delete()
                            .eq('id', id);

                        if (deleteError) throw deleteError;

                        // Attempt to delete from storage if URL exists
                        if (fileData?.url) {
                            const path = fileData.url.split('/').pop();
                            if (path) {
                                await sb.storage.from('vault').remove([path]);
                            }
                        }

                        await this.loadVaultData();
                        this.showNotification('DOCUMENT REDACTED PERMANENTLY', 'success');
                        
                    } catch (error) {
                        console.error('[VAULT] Redaction failed:', error);
                        this.showNotification('REDACTION FAILED', 'error');
                    }
                },

                formatFileSize(bytes) {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + sizes[i];
                },

                showNotification(message, type = 'info') {
                    // Create toast notification
                    const toast = document.createElement('div');
                    const colors = {
                        success: 'border-green-500 text-green-400',
                        error: 'border-red-500 text-red-400',
                        info: 'border-electric text-electric'
                    };
                    
                    toast.className = `fixed top-4 right-4 z-50 glass-vault px-6 py-4 rounded-xl border-l-4 ${colors[type]} animate-slide-in`;
                    toast.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-black uppercase tracking-wider">${type}</span>
                            <p class="text-xs text-white">${message}</p>
                        </div>
                    `;
                    
                    document.body.appendChild(toast);
                    
                    setTimeout(() => {
                        toast.classList.add('animate-fade-out');
                        setTimeout(() => toast.remove(), 300);
                    }, 5000);
                },

                terminateSession() {
                    sb?.auth?.signOut();
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('userData');
                    window.location.href = '../index.html';
                }
            }
        }
    </script>
</head>
<body x-data="vaultEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-gold/30">

    <div class="bg-circuit-pattern"></div>
    <div class="bg-grid-gold fixed inset-0 z-0 opacity-10"></div>
    <div class="circuit-vignette"></div>

    <!-- Error Display -->
    <div x-show="authError" x-cloak class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-500/10 border border-red-500/30 px-6 py-3 rounded-lg">
        <p class="text-xs text-red-400 uppercase tracking-wider" x-text="authError"></p>
    </div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6 relative z-50">
            <div class="loader-gold"></div>
            <p class="terminal-font text-[11px] text-gold animate-pulse uppercase tracking-[0.5em]">Bypassing Vault Encryption...</p>
            <p x-show="authError" class="text-[10px] text-red-500 uppercase tracking-wider" x-text="authError"></p>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-6xl mx-auto p-6 md:p-12 z-10 relative animate-fade-in">
            
            <header class="p-8 glass-vault rounded-[2.5rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl">
                <div class="flex items-center gap-6">
                    <button onclick="window.location.href='../index.html'" class="p-4 bg-white/5 rounded-2xl border border-white/10 hover:border-gold transition-all group">
                        <i data-lucide="chevron-left" class="text-gold group-hover:scale-110"></i>
                    </button>
                    <div>
                        <h1 class="text-3xl font-black uppercase italic tracking-tighter text-gold leading-none">Classified Vault</h1>
                        <p class="text-[10px] text-zinc-600 font-black uppercase tracking-[0.4em] mt-2 italic">Archive Repository // Sector 7G</p>
                    </div>
                </div>

                <div class="flex items-center gap-8">
                    <div class="hidden sm:block text-right">
                        <p class="text-[9px] text-zinc-700 font-black uppercase tracking-widest">Vault Status</p>
                        <p class="text-xs font-black terminal-font text-electric" x-text="vaultStatus"></p>
                    </div>
                    
                    <!-- Session Controls -->
                    <button @click="terminateSession()" class="p-3 bg-white/5 rounded-xl border border-white/10 hover:border-red-500 hover:text-red-400 transition-all" title="Terminate Session">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>

                    <template x-if="isDirector">
                        <label class="cursor-pointer bg-gold text-black px-8 py-4 rounded-full text-[10px] font-black uppercase tracking-widest hover:scale-105 transition-all shadow-xl flex items-center gap-3">
                            <i data-lucide="file-plus" class="w-4 h-4"></i>
                            <span x-text="isLoading ? 'Archiving...' : 'Archive Data'"></span>
                            <input type="file" @change="handleUpload" class="hidden" accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png,.mp4,.mov">
                        </label>
                    </template>
                </div>
            </header>

            <div class="grid grid-cols-1 gap-6">
                <div class="flex items-center justify-between px-6 mb-4">
                    <h3 class="text-xs font-black uppercase text-gold tracking-[0.3em] italic flex items-center gap-3">
                        <i data-lucide="folder-lock" class="w-4 h-4 text-electric"></i> Secure Directory
                    </h3>
                    <span class="terminal-font text-[9px] text-zinc-500 uppercase" x-text="files.length + ' Documents Found'"></span>
                </div>

                <div class="space-y-4">
                    <template x-for="file in files" :key="file.id">
                        <div class="file-row glass-vault p-8 rounded-[2.5rem] border border-white/5 flex flex-col md:flex-row justify-between items-center gap-6 shadow-lg">
                            <div class="flex items-center gap-8">
                                <div class="p-4 bg-white/5 rounded-2xl border border-white/5">
                                    <i data-lucide="file-text" class="text-gold"></i>
                                </div>
                                <div>
                                    <p class="text-[11px] font-black uppercase text-white tracking-widest" x-text="file.name"></p>
                                    <div class="flex gap-4 mt-1">
                                        <span class="text-[8px] text-zinc-600 font-black uppercase" x-text="file.size"></span>
                                        <span class="text-[8px] text-electric font-black uppercase tracking-tighter" x-text="'Level: ' + (file.classification || 'CONFIDENTIAL')"></span>
                                    </div>
                                </div>
                            </div>

                            <div class="flex items-center gap-4">
                                <a :href="file.url" download class="p-4 bg-white/5 text-zinc-400 rounded-xl border border-white/5 hover:text-white hover:bg-white/10 transition-all" title="Download">
                                    <i data-lucide="download" class="w-5 h-5"></i>
                                </a>
                                <template x-if="isDirector">
                                    <button @click="redactFile(file.id)" class="redact-btn p-4 bg-white/5 text-red-500 border border-red-900/20 rounded-xl transition-all" title="Redact Document">
                                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </template>
                    
                    <div x-show="files.length === 0" class="py-32 text-center opacity-20 bg-white/[0.01] rounded-[4rem] border border-dashed border-gold/20">
                        <i data-lucide="lock" class="mx-auto mb-6 w-16 h-16 text-gold"></i>
                        <p class="terminal-font text-xs uppercase tracking-[0.5em]">Vault Records Purged or Encrypted</p>
                    </div>
                </div>
            </div>

            <div class="mt-20 grid grid-cols-2 md:grid-cols-5 gap-4">
                <button onclick="window.location.href='../index.html'" class="p-6 glass-vault rounded-[2rem] border border-white/5 hover:border-gold transition-all text-center group">
                    <i data-lucide="layout-grid" class="mx-auto mb-2 text-zinc-500 group-hover:text-gold w-5 h-5"></i>
                    <span class="text-[8px] font-black uppercase">Hub</span>
                </button>
                <button onclick="window.location.href='dossier.html'" class="p-6 glass-vault rounded-[2rem] border border-white/5 hover:border-gold transition-all text-center group">
                    <i data-lucide="shield-check" class="mx-auto mb-2 text-zinc-500 group-hover:text-gold w-5 h-5"></i>
                    <span class="text-[8px] font-black uppercase">Dossier</span>
                </button>
                <button onclick="window.location.href='gallery.html'" class="p-6 glass-vault rounded-[2rem] border border-white/5 hover:border-gold transition-all text-center group">
                    <i data-lucide="camera" class="mx-auto mb-2 text-zinc-500 group-hover:text-gold w-5 h-5"></i>
                    <span class="text-[8px] font-black uppercase">Gallery</span>
                </button>
                <button onclick="window.location.href='frequency.html'" class="p-6 glass-vault rounded-[2rem] border border-white/5 hover:border-gold transition-all text-center group">
                    <i data-lucide="activity" class="mx-auto mb-2 text-zinc-500 group-hover:text-gold w-5 h-5"></i>
                    <span class="text-[8px] font-black uppercase">Freq</span>
                </button>
                <button onclick="window.location.href='dispatch.html'" class="p-6 glass-vault rounded-[2rem] border border-white/5 hover:border-gold transition-all text-center group">
                    <i data-lucide="radio" class="mx-auto mb-2 text-zinc-500 group-hover:text-gold w-5 h-5"></i>
                    <span class="text-[8px] font-black uppercase">Dispatch</span>
                </button>
            </div>

            <footer class="mt-32 pt-10 border-t border-white/5 text-center text-zinc-800">
                <p class="terminal-font text-[10px] uppercase tracking-[0.6em] italic">
                    DECRYPTING THE CULTURE. SYNCHRONIZING THE GRID. © 2026
                </p>
            </footer>
        </div>
    </template>

</body>
</html>
