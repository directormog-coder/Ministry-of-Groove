<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050A0E">
<title>M.O.G. — Archives</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--black);font-family:var(--font-main);color:#fff;min-height:100vh;padding-bottom:90px;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);}

.top-bar{position:sticky;top:0;z-index:100;background:rgba(5,10,14,0.97);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;backdrop-filter:blur(10px);}
.back-btn{color:var(--gold);font-size:22px;text-decoration:none;padding:4px;line-height:1;transition:color 0.2s;}
.back-btn:hover{color:var(--gold-light);}
.top-title{font-family:var(--font-cyber);font-size:12px;font-weight:700;color:var(--gold);letter-spacing:3px;flex:1;text-align:center;}
.archive-count{font-family:var(--font-mono);font-size:9px;color:var(--teal-dim);letter-spacing:1px;white-space:nowrap;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;position:relative;z-index:1;}
.stat-mini{background:var(--panel);border:1px solid var(--border-teal);border-radius:8px;padding:14px;text-align:center;position:relative;overflow:hidden;}
.stat-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--teal));}
.sm-val{font-family:var(--font-cyber);font-size:20px;font-weight:900;color:var(--gold);}
.sm-label{font-family:var(--font-mono);font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:1px;margin-top:4px;}

/* SEARCH */
.search-wrap{padding:0 16px 12px;position:relative;z-index:1;}
.search-input{width:100%;padding:12px 16px;background:rgba(13,31,45,0.8);border:1px solid var(--border-teal);border-radius:6px;font-family:var(--font-main);font-size:15px;color:#fff;outline:none;transition:border 0.2s;}
.search-input:focus{border-color:var(--teal);}
.search-input::placeholder{color:rgba(255,255,255,0.2);}

/* FILTER TABS */
.filter-tabs{padding:0 16px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.filter-tabs::-webkit-scrollbar{display:none;}
.ftab{font-family:var(--font-mono);font-size:9px;letter-spacing:2px;padding:7px 14px;border:1px solid var(--border);border-radius:3px;color:var(--gold-dim);background:none;cursor:pointer;white-space:nowrap;transition:all 0.2s;flex-shrink:0;}
.ftab.active,.ftab:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.08);}

/* SESSION CARDS */
.sessions-list{padding:0 16px;position:relative;z-index:1;}

.session-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;transition:all 0.25s;cursor:pointer;}
.session-card:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.1);}
.session-card.expanded .session-body{display:block;}
.session-card.expanded .expand-icon{transform:rotate(180deg);}

.session-header{padding:16px;display:flex;align-items:center;gap:14px;}
.session-num{font-family:var(--font-cyber);font-size:28px;font-weight:900;color:rgba(201,168,76,0.15);width:48px;text-align:center;flex-shrink:0;line-height:1;}
.session-info{flex:1;min-width:0;}
.session-title{font-family:var(--font-cyber);font-size:13px;font-weight:700;color:var(--gold-light);letter-spacing:2px;margin-bottom:4px;}
.session-date{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:1px;}
.session-meta{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.smeta{font-family:var(--font-mono);font-size:8px;letter-spacing:1px;padding:3px 8px;border-radius:2px;}
.smeta-photos{background:rgba(201,168,76,0.1);color:var(--gold-dim);border:1px solid var(--border);}
.smeta-video{background:rgba(0,229,204,0.1);color:var(--teal-dim);border:1px solid var(--border-teal);}
.smeta-attendees{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.08);}
.expand-icon{font-size:18px;color:var(--gold-dim);transition:transform 0.3s;flex-shrink:0;}

.session-body{display:none;border-top:1px solid var(--border);}
.session-preview{width:100%;aspect-ratio:16/9;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden;}
.session-preview::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,229,204,0.04),transparent);}
.session-actions{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sact-btn{padding:11px;border-radius:4px;font-family:var(--font-cyber);font-size:9px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;}
.sact-gallery{background:rgba(201,168,76,0.08);border:1px solid var(--border);color:var(--gold);}
.sact-gallery:hover{background:rgba(201,168,76,0.16);box-shadow:0 0 14px var(--gold-glow);}
.sact-chat{background:rgba(0,229,204,0.06);border:1px solid var(--border-teal);color:var(--teal);}
.sact-chat:hover{background:rgba(0,229,204,0.14);}
.session-notes{padding:0 16px 14px;font-family:var(--font-mono);font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;line-height:1.7;border-top:1px solid rgba(201,168,76,0.06);padding-top:12px;}

/* EMPTY STATE */
.empty-archive{text-align:center;padding:60px 20px;position:relative;z-index:1;}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:0.3;}
.empty-title{font-family:var(--font-cyber);font-size:12px;color:rgba(201,168,76,0.3);letter-spacing:3px;margin-bottom:8px;}
.empty-sub{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,0.15);letter-spacing:2px;line-height:1.8;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(5,10,14,0.98);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(12px);}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;gap:4px;cursor:pointer;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent;}
.nav-item.active{border-top-color:var(--gold);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-family:var(--font-mono);font-size:8px;color:var(--gold-dim);letter-spacing:1px;}
.nav-item.active .nav-label{color:var(--gold);}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="top-title">ARCHIVES</div>
  <div class="archive-count" id="archiveCount">0 SESSIONS</div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-mini">
    <div class="sm-val" id="totalSessions">0</div>
    <div class="sm-label">SESSIONS</div>
  </div>
  <div class="stat-mini">
    <div class="sm-val" id="totalMedia">0</div>
    <div class="sm-label">MEDIA FILES</div>
  </div>
  <div class="stat-mini">
    <div class="sm-val" id="totalAttendees">0</div>
    <div class="sm-label">OPERATIVES</div>
  </div>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <input type="text" class="search-input" id="searchInput" placeholder="🔍 SEARCH SESSIONS..." oninput="filterSessions()">
</div>

<!-- FILTER TABS -->
<div class="filter-tabs">
  <button class="ftab active" onclick="setFilter('all',this)">ALL SESSIONS</button>
  <button class="ftab" onclick="setFilter('2026',this)">2026</button>
  <button class="ftab" onclick="setFilter('video',this)">HAS VIDEO</button>
  <button class="ftab" onclick="setFilter('photos',this)">HAS PHOTOS</button>
</div>

<!-- SESSIONS LIST -->
<div class="sessions-list" id="sessionsList"></div>

<div class="bottom-nav">
  <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>
  <a href="gallery.html" class="nav-item"><div class="nav-icon">🎬</div><div class="nav-label">GALLERY</div></a>
  <a href="frequency.html" class="nav-item"><div class="nav-icon">📡</div><div class="nav-label">LIVE</div></a>
  <a href="dispatch.html" class="nav-item"><div class="nav-icon">💬</div><div class="nav-label">CHAT</div></a>
  <a href="dossier.html" class="nav-item"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></a>
</div>

<script>
// Sessions load from Supabase in production
// Wire up: sb.from('events').select('*,media(count),tickets(count)').eq('status','completed')
const sessions = [];

let activeFilter = 'all';
let searchTerm = '';

function getFiltered() {
  return sessions.filter(s => {
    const matchSearch = !searchTerm || s.title.toLowerCase().includes(searchTerm.toLowerCase());
    const matchFilter = activeFilter === 'all'
      || (activeFilter === '2026' && s.year === 2026)
      || (activeFilter === 'video' && s.hasVideo)
      || (activeFilter === 'photos' && s.photoCount > 0);
    return matchSearch && matchFilter;
  });
}

function renderSessions() {
  const filtered = getFiltered();
  const list = document.getElementById('sessionsList');
  document.getElementById('archiveCount').textContent = filtered.length + ' SESSION' + (filtered.length !== 1 ? 'S' : '');

  if (sessions.length === 0) {
    list.innerHTML = `
      <div class="empty-archive">
        <div class="empty-icon">🗂️</div>
        <div class="empty-title">ARCHIVES EMPTY</div>
        <div class="empty-sub">
          COMPLETED SESSIONS WILL APPEAR HERE<br>
          ONCE THE DIRECTORATE MARKS EVENTS AS COMPLETE<br>
          AND UPLOADS MEDIA TO THE VAULT
        </div>
      </div>`;
    return;
  }

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-archive">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">NO RESULTS FOUND</div>
        <div class="empty-sub">TRY A DIFFERENT SEARCH TERM OR FILTER</div>
      </div>`;
    return;
  }

  list.innerHTML = filtered.map((s, i) => `
    <div class="session-card" id="card-${i}" onclick="toggleCard(${i})">
      <div class="session-header">
        <div class="session-num">0${i+1}</div>
        <div class="session-info">
          <div class="session-title">${s.title}</div>
          <div class="session-date">📅 ${s.date} · 📍 ${s.location}</div>
          <div class="session-meta">
            ${s.photoCount > 0 ? `<span class="smeta smeta-photos">📸 ${s.photoCount} PHOTOS</span>` : ''}
            ${s.hasVideo ? `<span class="smeta smeta-video">🎬 VIDEO</span>` : ''}
            ${s.attendees > 0 ? `<span class="smeta smeta-attendees">👥 ${s.attendees}</span>` : ''}
          </div>
        </div>
        <div class="expand-icon">▾</div>
      </div>
      <div class="session-body">
        <div class="session-preview">${s.hasVideo ? '🎬' : '📸'}</div>
        <div class="session-actions">
          <a href="gallery.html" class="sact-btn sact-gallery">📸 VIEW GALLERY</a>
          <a href="dispatch.html" class="sact-btn sact-chat">💬 SESSION CHAT</a>
        </div>
        ${s.notes ? `<div class="session-notes">${s.notes}</div>` : ''}
      </div>
    </div>
  `).join('');

  // Update stats
  document.getElementById('totalSessions').textContent = sessions.length;
  document.getElementById('totalMedia').textContent = sessions.reduce((s,x) => s + x.photoCount + (x.hasVideo ? 1 : 0), 0);
  document.getElementById('totalAttendees').textContent = sessions.reduce((s,x) => s + (x.attendees || 0), 0);
}

function toggleCard(i) {
  const card = document.getElementById('card-' + i);
  card.classList.toggle('expanded');
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderSessions();
}

function filterSessions() {
  searchTerm = document.getElementById('searchInput').value.trim();
  renderSessions();
}

renderSessions();
</script>
</body>
</html>
