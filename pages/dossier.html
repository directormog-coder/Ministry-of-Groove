<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Dossier | MOG NCC Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <script src="../config/env.js"></script>
    <script src="../js/auth.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-black text-white font-mono" x-data="dossierPage()" x-init="init()">
    
    <div class="min-h-screen flex flex-col">
        <header class="glass-gold sticky top-0 z-50 px-6 py-4 border-b border-white/5">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <a href="../index.html" class="text-gold hover:text-white transition-colors">
                        <i data-lucide="arrow-left" class="w-6 h-6"></i>
                    </a>
                    <h1 class="brand-title text-lg">Personnel Dossier</h1>
                </div>
                <button @click="logout()" class="text-red-500 hover:text-red-400 text-sm uppercase tracking-wider">
                    Terminate
                </button>
            </div>
        </header>

        <main class="flex-grow p-8" x-show="!loading">
            <div class="max-w-4xl mx-auto">
                <div class="glass-gold rounded-2xl p-8">
                    <h2 class="text-2xl font-bold text-gold mb-6 uppercase tracking-wider">Agent Profile</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs text-zinc-500 uppercase tracking-wider">Codename</label>
                                <p class="text-lg" x-text="profile?.codename || 'Unknown'"></p>
                            </div>
                            <div>
                                <label class="text-xs text-zinc-500 uppercase tracking-wider">Clearance Level</label>
                                <p class="text-lg text-electric" x-text="profile?.clearance || 'CLASSIFIED'"></p>
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs text-zinc-500 uppercase tracking-wider">Status</label>
                                <p class="text-lg text-green-500">ACTIVE</p>
                            </div>
                            <div>
                                <label class="text-xs text-zinc-500 uppercase tracking-wider">Last Login</label>
                                <p class="text-lg" x-text="lastLogin"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function dossierPage() {
            return {
                loading: true,
                profile: null,
                lastLogin: '',
                auth: null,

                async init() {
                    this.auth = new MOGAuth();
                    const session = await this.auth.init();
                    
                    if (session) {
                        this.profile = {
                            codename: session.user.email?.split('@')[0],
                            clearance: session.user.user_metadata?.role || 'AGENT'
                        };
                        this.lastLogin = new Date(session.user.last_sign_in_at).toLocaleString();
                    }
                    
                    this.loading = false;
                    lucide.createIcons();
                },

                async logout() {
                    await this.auth.logout();
                }
            }
        }
    </script>
</body>
</html>
