<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>MOG | OPERATIVE DOSSIER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        [x-cloak] { display: none !important; }
        /* Tactical Palette Overrides for Dossier */
        .bg-grid-gold { background-image: radial-gradient(circle, var(--gold) 1px, transparent 1px); background-size: 30px 30px; }
        .glass-tactical { background: rgba(5, 5, 10, 0.95); backdrop-filter: blur(35px); border: 1px solid rgba(212, 175, 55, 0.2); }
        .profile-glow { box-shadow: 0 0 60px rgba(212, 175, 55, 0.1); }
        
        .scanline-gold { 
            width: 100%; 
            height: 100px; 
            background: linear-gradient(0deg, transparent 0%, rgba(212, 175, 55, 0.07) 50%, transparent 100%); 
            position: absolute; top: -100px; left: 0; pointer-events: none; 
            animation: moveScanline 4s linear infinite; 
        }
        @keyframes moveScanline { from { top: -100px; } to { top: 100%; } }
        
        .loader-gold { width: 30px; height: 30px; border: 3px solid var(--gold); border-bottom-color: transparent; border-radius: 50%; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
        const SUPABASE_URL = 'https://fgkljjgxecjmiiaptiug.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZna2xqamd4ZWNqbWlpYXB0aXVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwNjUxNzIsImV4cCI6MjA4ODY0MTE3Mn0.y8rd5v4K5pwToCm2eooJLBksA51AnQXce06uEoE_gyE'; 
        let sb = null;

        function dossierEngine() {
            return {
                view: 'gate',
                isUpdating: false,
                statusInput: '',
                
                user: {
                    id: '',
                    handle: 'PENDING...',
                    email: '',
                    status: 'INITIALIZING...',
                    clearance: 'LEVEL 1',
                    joined: ''
                },

                async init() {
                    // Check Local Security Gate first
                    const role = localStorage.getItem('userRole');
                    if (!role) {
                        window.location.href = '../login.html';
                        return;
                    }

                    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    const { data: { session } } = await sb.auth.getSession();
                    
                    if (!session) {
                        window.location.href = '../index.html';
                        return;
                    }

                    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
                    
                    this.user.id = session.user.id;
                    this.user.email = session.user.email;
                    this.user.handle = profile?.handle || session.user.user_metadata.handle || 'UNIDENTIFIED';
                    this.user.status = profile?.status || 'ACTIVE MONITORING';
                    this.user.clearance = role === 'director' ? 'LEVEL 5 (DIRECTOR)' : 'LEVEL 1 (OPERATIVE)';
                    this.user.joined = new Date(session.user.created_at).toLocaleDateString('en-ZA');
                    
                    this.view = 'active';
                    this.$nextTick(() => lucide.createIcons());
                },

                async updateDossier() {
                    if (!this.statusInput.trim()) return;
                    this.isUpdating = true;
                    
                    const { error } = await sb.from('profiles').update({ 
                        status: this.statusInput.toUpperCase() 
                    }).eq('id', this.user.id);

                    if (!error) {
                        this.user.status = this.statusInput.toUpperCase();
                        this.statusInput = '';
                        alert('PERSONNEL RECORD SYNCHRONIZED');
                    } else {
                        alert('UPLINK FAILED: DATABASE REJECTED UPDATE');
                    }
                    this.isUpdating = false;
                },

                logout() { 
                    localStorage.clear();
                    sb.auth.signOut().then(() => window.location.href = '../login.html'); 
                }
            }
        }
    </script>
</head>
<body x-data="dossierEngine()" x-init="init()" x-cloak class="bg-black text-white min-h-screen relative overflow-x-hidden selection:bg-gold/30">

    <div class="bg-circuit-pattern"></div>
    <div class="bg-grid-gold fixed inset-0 z-0 opacity-10"></div>
    <div class="circuit-vignette"></div>

    <template x-if="view === 'gate'">
        <div class="h-screen flex flex-col items-center justify-center space-y-6">
            <div class="loader-gold"></div>
            <p class="terminal-font text-[11px] text-gold animate-pulse">Accessing Secure Personnel Vault...</p>
        </div>
    </template>

    <template x-if="view === 'active'">
        <div class="max-w-6xl mx-auto p-6 md:p-12 z-20 relative animate-fade-in">
            
            <header class="p-8 glass-tactical rounded-[3rem] flex flex-col md:flex-row justify-between items-center gap-8 mb-16 shadow-2xl">
                <div class="flex items-center gap-8">
                    <button onclick="window.location.href='../index.html'" class="p-5 bg-white/5 rounded-2xl border border-white/10 hover:border-gold transition-all group">
                        <i data-lucide="chevron-left" class="text-gold group-hover:scale-110"></i>
                    </button>
                    <div>
                        <h1 class="text-3xl font-black uppercase italic tracking-tighter text-gold leading-none">Operative Dossier</h1>
                        <p class="text-[11px] text-zinc-500 font-black uppercase tracking-[0.4em] mt-3 italic">Sector Personnel Record // NCC-5.0</p>
                    </div>
                </div>
                <div class="text-right border-l border-white/5 pl-8 hidden md:block">
                    <p class="text-[10px] text-gold font-black uppercase tracking-widest">Clearance Verified</p>
                    <p class="text-xs font-black terminal-font mt-1 text-zinc-400" x-text="'UID: ' + user.id.substring(0,13)"></p>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                
                <div class="space-y-12">
                    <div class="glass-tactical p-12 rounded-[5rem] text-center relative overflow-hidden profile-glow group shadow-2xl">
                        <div class="scanline-gold"></div>
                        
                        <div class="w-44 h-44 bg-gold/5 rounded-full mx-auto mb-10 flex items-center justify-center border-2 border-gold/20 relative">
                            <i data-lucide="shield" class="w-24 h-24 text-gold/30 group-hover:text-gold transition-colors"></i>
                            <div class="absolute bottom-3 right-3 w-8 h-8 bg-gold rounded-full border-4 border-black animate-pulse shadow-[0_0_20px_#D4AF37]"></div>
                        </div>

                        <h2 class="text-3xl font-black uppercase italic tracking-tight text-white" x-text="user.handle"></h2>
                        <div class="mt-6 inline-block px-6 py-2 bg-gold/10 rounded-full border border-gold/30">
                            <p class="text-[11px] text-gold font-black uppercase tracking-[0.2em]" x-text="user.status"></p>
                        </div>

                        <div class="mt-12 pt-12 border-t border-gold/10 grid grid-cols-2 gap-8 text-left">
                            <div>
                                <p class="text-[9px] text-zinc-600 uppercase font-black tracking-widest">Clearance</p>
                                <p class="text-sm font-black text-white mt-1" x-text="user.clearance"></p>
                            </div>
                            <div>
                                <p class="text-[9px] text-zinc-600 uppercase font-black tracking-widest">Enlisted</p>
                                <p class="text-sm font-black text-white mt-1" x-text="user.joined"></p>
                            </div>
                        </div>
                    </div>

                    <div class="glass p-10 rounded-[3.5rem] border border-white/5 space-y-6 shadow-2xl">
                        <h4 class="terminal-font text-[10px] text-zinc-500 italic mb-4">Tactical Nodes</h4>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="window.location.href='../index.html'" class="p-6 bg-white/5 rounded-3xl text-center hover:bg-white/10 transition-all border border-gold/10">
                                <i data-lucide="layout-grid" class="mx-auto mb-2 w-6 h-6 text-gold"></i>
                                <span class="text-[9px] font-black uppercase">Hub</span>
                            </button>
                            <button onclick="window.location.href='gallery.html'" class="p-6 bg-white/5 rounded-3xl text-center hover:bg-white/10 transition-all border border-electric/10">
                                <i data-lucide="camera" class="mx-auto mb-2 w-6 h-6 text-electric"></i>
                                <span class="text-[9px] font-black uppercase">Gallery</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-2 space-y-12">
                    
                    <div class="glass-tactical p-16 rounded-[4.5rem] shadow-2xl border-t-4 border-gold/40 relative overflow-hidden">
                        <div class="absolute -top-24 -right-24 w-64 h-64 bg-gold/5 rounded-full blur-3xl"></div>
                        
                        <div class="flex items-center gap-8 mb-12 relative z-10">
                            <div class="p-6 bg-gold rounded-[2.5rem] text-black shadow-xl">
                                <i data-lucide="radio" class="w-10 h-10"></i>
                            </div>
                            <div>
                                <h3 class="text-3xl font-black uppercase italic tracking-widest text-white">Broadcast Status</h3>
                                <p class="text-[11px] text-gold font-black uppercase tracking-[0.4em] mt-3">Sync mission state to the Ministry grid</p>
                            </div>
                        </div>

                        <div class="space-y-8 relative z-10">
                            <textarea x-model="statusInput" 
                                class="w-full bg-black/50 border border-gold/20 p-8 rounded-[3rem] outline-none text-md uppercase terminal-font leading-relaxed focus:border-gold transition-all text-white placeholder:text-zinc-800"
                                placeholder="E.G. SCANNING FOR FREQUENCY ANOMALIES..."
                                rows="3"></textarea>
                            
                            <div class="flex justify-end">
                                <button @click="updateDossier()" 
                                    :disabled="isUpdating"
                                    class="px-20 py-8 bg-gold text-black font-black uppercase rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-all text-sm tracking-[0.3em] disabled:opacity-50">
                                    <span x-show="!isUpdating">Synchronize Identity</span>
                                    <span x-show="isUpdating" class="flex gap-4 items-center">
                                        <div class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                                        Syncing...
                                    </span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                        <div class="glass p-12 rounded-[4rem] border border-white/5 shadow-2xl">
                            <p class="text-[10px] text-zinc-600 uppercase font-black mb-6 tracking-[0.3em]">Uplink Integrity</p>
                            <div class="flex items-end gap-5">
                                <p class="text-6xl font-black terminal-font text-white">98%</p>
                                <div class="mb-2">
                                    <p class="text-[11px] text-electric font-black uppercase">Secure</p>
                                    <p class="text-[8px] text-zinc-700 font-black uppercase">AES-256</p>
                                </div>
                            </div>
                            <div class="mt-8 w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                                <div class="h-full bg-electric w-[98%] shadow-[0_0_15px_#00F2FF]"></div>
                            </div>
                        </div>

                        <div class="glass p-12 rounded-[4rem] border border-white/5 shadow-2xl">
                            <p class="text-[10px] text-zinc-600 uppercase font-black mb-6 tracking-[0.3em]">Grid Weight</p>
                            <div class="flex items-end gap-5">
                                <p class="text-6xl font-black terminal-font text-white">V.4</p>
                                <div class="mb-2">
                                    <p class="text-[11px] text-gold font-black uppercase italic">Elite</p>
                                    <p class="text-[8px] text-zinc-700 font-black uppercase">Structure</p>
                                </div>
                            </div>
                            <div class="mt-8 flex gap-1.5 h-3 items-end">
                                <div class="flex-grow h-1.5 bg-gold rounded-full opacity-50"></div>
                                <div class="flex-grow h-3 bg-gold rounded-full"></div>
                                <div class="flex-grow h-2.5 bg-gold rounded-full"></div>
                                <div class="flex-grow h-1.5 bg-white/10 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="mt-40 pt-16 border-t border-white/5 text-center text-zinc-800">
                <p class="terminal-font text-[12px] uppercase tracking-[1em]">
                    MINISTRY OF GROOVE // PERSONNEL ARCHIVE v5.0
                </p>
            </footer>
        </div>
    </template>
</body>
</html>
