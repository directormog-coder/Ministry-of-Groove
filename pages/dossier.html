<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050A0E">
<title>M.O.G. — Dossier</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#F0C85A;--gold-dim:#8A6E2F;--teal:#00E5CC;--teal-dim:#009E8E;--black:#050A0E;--navy:#0D1F2D;--panel:rgba(13,31,45,0.9);--border:rgba(201,168,76,0.25);--border-teal:rgba(0,229,204,0.2);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--black);font-family:'Rajdhani',sans-serif;color:#fff;min-height:100vh;padding-bottom:80px;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);}

.top-bar{position:sticky;top:0;z-index:100;background:rgba(5,10,14,0.97);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;height:52px;gap:12px;backdrop-filter:blur(10px);}
.back-btn{color:var(--gold);font-size:22px;text-decoration:none;padding:4px;line-height:1;}
.top-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:3px;flex:1;text-align:center;}

/* PAGE TABS */
.page-tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:99;background:rgba(5,10,14,0.97);backdrop-filter:blur(10px);}
.page-tab{padding:14px;text-align:center;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;}
.page-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,0.04);}

.section{display:none;padding:16px;}
.section.active{display:block;}

/* ── VOTE SECTION ── */
.vote-hdr{background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
.vote-hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold));}
.vote-hdr-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold-light);letter-spacing:2px;margin-bottom:4px;}
.vote-hdr-sub{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:2px;margin-bottom:8px;}
.vote-deadline{font-family:'Share Tech Mono',monospace;font-size:9px;color:rgba(255,255,255,0.35);letter-spacing:1px;}
.votes-left{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--teal);letter-spacing:2px;margin-top:6px;}

.song-card{background:var(--panel);border:1px solid var(--border-teal);border-radius:8px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:all 0.25s;cursor:pointer;position:relative;}
.song-card:hover{border-color:rgba(201,168,76,0.4);background:rgba(201,168,76,0.03);}
.song-card.voted{border-color:var(--gold);background:rgba(201,168,76,0.07);box-shadow:0 0 14px rgba(201,168,76,0.12);}
.song-rank{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;color:var(--gold-dim);width:30px;text-align:center;flex-shrink:0;line-height:1;}
.song-rank.top3{color:var(--gold);}
.song-rank.no1{color:var(--gold-light);text-shadow:0 0 10px rgba(201,168,76,0.5);}
.song-info{flex:1;min-width:0;}
.song-title{font-size:13px;font-weight:700;color:#e0e0e0;letter-spacing:0.5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-artist{font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.song-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;}
.vote-count{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--gold);}
.vbar-wrap{width:55px;height:3px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
.vbar{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:2px;transition:width 0.6s ease;}
.vote-btn{padding:5px 11px;border-radius:3px;font-family:'Orbitron',sans-serif;font-size:8px;letter-spacing:2px;cursor:pointer;border:1px solid var(--border);color:var(--gold-dim);background:none;transition:all 0.2s;white-space:nowrap;}
.vote-btn.voted{background:var(--gold);color:var(--black);border-color:var(--gold);}
.vote-btn:not(.voted):hover{border-color:var(--gold);color:var(--gold);}

/* ── PROFILE SECTION ── */
.profile-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center;position:relative;overflow:hidden;margin-bottom:16px;}
.profile-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold));}
.p-avatar{width:82px;height:82px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;margin:0 auto 14px;box-shadow:0 0 28px rgba(201,168,76,0.3);}
.p-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.p-name{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:4px;}
.p-email{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--teal-dim);letter-spacing:1px;margin-bottom:10px;}
.p-rank{display:inline-block;border:1px solid var(--gold);color:var(--gold);font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:3px;padding:4px 14px;border-radius:2px;margin-bottom:18px;}
.p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:4px;overflow:hidden;}
.pstat{background:var(--navy);padding:14px 8px;text-align:center;}
.pstat-val{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:700;color:var(--gold);}
.pstat-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:rgba(255,255,255,0.3);letter-spacing:1px;margin-top:4px;}
.p-btn{width:100%;margin-top:12px;padding:13px;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all 0.2s;border:1px solid var(--border);}
.p-btn-edit{background:rgba(201,168,76,0.07);color:var(--gold);}
.p-btn-edit:hover{background:rgba(201,168,76,0.15);box-shadow:0 0 14px rgba(201,168,76,0.2);}
.p-btn-logout{background:rgba(139,0,0,0.12);border-color:rgba(139,0,0,0.35);color:#ff5555;margin-top:8px;}
.p-btn-logout:hover{background:rgba(139,0,0,0.22);}

/* EDIT MODAL */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(5,10,14,0.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:24px;}
.modal.open{display:flex;}
.modal-box{width:100%;max-width:380px;background:var(--navy);border:1px solid var(--border-teal);border-radius:8px;padding:28px 24px;position:relative;}
.modal-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);}
.modal-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--teal);letter-spacing:3px;margin-bottom:20px;text-align:center;}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--border);color:var(--gold);font-size:14px;padding:4px 10px;border-radius:3px;cursor:pointer;transition:all 0.2s;}
.modal-close:hover{border-color:var(--gold);}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--teal-dim);letter-spacing:2px;margin-bottom:6px;}
.field input{width:100%;padding:12px 14px;background:rgba(0,229,204,0.04);border:1px solid var(--border-teal);border-radius:4px;outline:none;font-family:'Rajdhani',sans-serif;font-size:15px;color:#fff;transition:border 0.2s;}
.field input:focus{border-color:var(--teal);}
.field input::placeholder{color:rgba(255,255,255,0.18);}
.btn-save{width:100%;padding:13px;background:linear-gradient(135deg,var(--teal-dim),var(--teal));border:none;border-radius:4px;font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;color:var(--black);letter-spacing:3px;cursor:pointer;transition:all 0.3s;margin-top:4px;}
.btn-save:hover{box-shadow:0 0 20px rgba(0,229,204,0.3);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(5,10,14,0.98);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(12px);}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;gap:4px;cursor:pointer;text-decoration:none;transition:all 0.2s;border-top:2px solid transparent;}
.nav-item.active{border-top-color:var(--gold);}
.nav-icon{font-size:20px;line-height:1;}
.nav-label{font-family:'Share Tech Mono',monospace;font-size:8px;color:var(--gold-dim);letter-spacing:1px;}
.nav-item.active .nav-label{color:var(--gold);}
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">←</a>
  <div class="top-title">DOSSIER</div>
</div>

<div class="page-tabs">
  <button class="page-tab active" onclick="showTab('vote',this)">🗳️ TOP 10 VOTE</button>
  <button class="page-tab" onclick="showTab('profile',this)">👤 MY PROFILE</button>
</div>

<!-- VOTE SECTION -->
<div class="section active" id="voteSection">
  <div class="vote-hdr">
    <div class="vote-hdr-title">TOP 10 AMAPIANO — WEEK 14</div>
    <div class="vote-hdr-sub">// CLASSIFIED MUSIC INTELLIGENCE //</div>
    <div class="vote-deadline">⏱ POLL CLOSES: SUNDAY 23:59</div>
    <div class="votes-left" id="votesLeftEl">2 VOTES REMAINING</div>
  </div>
  <div id="songList"></div>
</div>

<!-- PROFILE SECTION -->
<div class="section" id="profileSection">
  <div class="profile-card">
    <div class="p-avatar">
      <img src="../logo.png" alt="M.O.G." id="profileImg" onerror="this.style.display='none'">
    </div>
    <div class="p-name" id="pName">OPERATIVE</div>
    <div class="p-email" id="pEmail">operative@gmail.com</div>
    <div class="p-rank">GROOVE DIVISION // RECRUIT</div>
    <div class="p-stats">
      <div class="pstat"><div class="pstat-val">2</div><div class="pstat-label">SESSIONS</div></div>
      <div class="pstat"><div class="pstat-val" id="pLikes">14</div><div class="pstat-label">LIKES</div></div>
      <div class="pstat"><div class="pstat-val">100%</div><div class="pstat-label">LOYALTY</div></div>
    </div>
    <button class="p-btn p-btn-edit" onclick="openEdit()">✎ EDIT OPERATIVE FILE</button>
    <button class="p-btn p-btn-logout" onclick="logout()">⇥ TERMINATE SESSION</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeEdit()">✕</button>
    <div class="modal-title">// EDIT DOSSIER //</div>
    <div class="field"><label>OPERATIVE NAME</label><input type="text" id="editName" placeholder="OPERATIVE_NAME"></div>
    <div class="field"><label>EMAIL ADDRESS</label><input type="email" id="editEmail" placeholder="operative@gmail.com"></div>
    <button class="btn-save" onclick="saveProfile()">✓ SAVE CHANGES</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="../index.html" class="nav-item"><div class="nav-icon">⬡</div><div class="nav-label">HUB</div></a>
  <a href="gallery.html" class="nav-item"><div class="nav-icon">🎬</div><div class="nav-label">GALLERY</div></a>
  <a href="frequency.html" class="nav-item"><div class="nav-icon">📡</div><div class="nav-label">LIVE</div></a>
  <a href="dispatch.html" class="nav-item"><div class="nav-icon">💬</div><div class="nav-label">CHAT</div></a>
  <a href="dossier.html" class="nav-item active"><div class="nav-icon">👤</div><div class="nav-label">PROFILE</div></a>
</div>

<script>
// Songs data
const songs=[
  {id:1,title:'PIANO HUB',artist:'Kabza De Small & DJ Maphorisa',votes:312},
  {id:2,title:'ASIBE HAPPY',artist:'Kabza De Small ft. Ami Faku',votes:287},
  {id:3,title:'BUYILE',artist:'Young Stunna ft. Kabza De Small',votes:264},
  {id:4,title:'SCORPION KINGS LIVE',artist:'Kabza De Small & DJ Maphorisa',votes:241},
  {id:5,title:'LOVE LANGUAGE',artist:'Sun-EL Musician ft. Simmy',votes:198},
  {id:6,title:'UMBALA',artist:'Musa Keys ft. Nobantu Vilakazi',votes:176},
  {id:7,title:'SPONONO',artist:'Kabza De Small ft. Wizkid',votes:153},
  {id:8,title:'IZINTO',artist:'Da Muziqal Chef',votes:131},
  {id:9,title:'NGEKE',artist:'Various Artists',votes:109},
  {id:10,title:'AMALOBOLO',artist:'Focalistic & Shakes',votes:94},
];

let votesLeft=2;
const votedFor=new Set();

function maxVotes(){return Math.max(...songs.map(s=>s.votes));}

function renderSongs(){
  const sorted=[...songs].sort((a,b)=>b.votes-a.votes);
  const max=maxVotes();
  document.getElementById('songList').innerHTML=sorted.map((s,i)=>{
    const rankClass=i===0?'no1':i<3?'top3':'';
    return `<div class="song-card ${votedFor.has(s.id)?'voted':''}" onclick="vote(${s.id})">
      <div class="song-rank ${rankClass}">${i+1}</div>
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <div class="song-right">
        <div class="vote-count">${s.votes}</div>
        <div class="vbar-wrap"><div class="vbar" style="width:${Math.round(s.votes/max*100)}%"></div></div>
        <button class="vote-btn ${votedFor.has(s.id)?'voted':''}" onclick="event.stopPropagation();vote(${s.id})">${votedFor.has(s.id)?'✓ VOTED':'VOTE'}</button>
      </div>
    </div>`;
  }).join('');
  document.getElementById('votesLeftEl').textContent=
    votesLeft>0?votesLeft+' VOTE'+(votesLeft!==1?'S':'')+' REMAINING':'ALL VOTES CAST';
}

function vote(id){
  if(votedFor.has(id)){
    votedFor.delete(id);
    songs.find(s=>s.id===id).votes--;
    votesLeft++;
  } else {
    if(votesLeft<=0){alert('No votes remaining this week. Come back next poll!');return;}
    votedFor.add(id);
    songs.find(s=>s.id===id).votes++;
    votesLeft--;
  }
  renderSongs();
}

// TABS
function showTab(tab,btn){
  document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(tab+'Section').classList.add('active');
}

// PROFILE
const storedName=sessionStorage.getItem('mogUser')||'OPERATIVE';
const storedEmail=sessionStorage.getItem('mogEmail')||'operative@gmail.com';
document.getElementById('pName').textContent=storedName;
document.getElementById('pEmail').textContent=storedEmail;

function openEdit(){
  document.getElementById('editName').value=document.getElementById('pName').textContent;
  document.getElementById('editEmail').value=document.getElementById('pEmail').textContent;
  document.getElementById('editModal').classList.add('open');
}
function closeEdit(){document.getElementById('editModal').classList.remove('open');}
function saveProfile(){
  const name=document.getElementById('editName').value.trim();
  const email=document.getElementById('editEmail').value.trim();
  if(name){
    document.getElementById('pName').textContent=name.toUpperCase();
    sessionStorage.setItem('mogUser',name.toUpperCase());
  }
  if(email&&email.includes('@')){
    document.getElementById('pEmail').textContent=email;
    sessionStorage.setItem('mogEmail',email);
  }
  closeEdit();
}
function logout(){
  if(confirm('Terminate operative session?')){
    sessionStorage.clear();
    window.location.href='../login.html';
  }
}

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeEdit();});

renderSongs();
</script>
</body>
</html>
